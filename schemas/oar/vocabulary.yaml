# The Open Agent Rules vocabulary — core facts, core observation functions,
# standard profiles, core anchors, the reserved detector references, and the
# on_fire vocabulary.
#
# This file is hand-authored and is the source of truth. The tables in
# open-agent-rules.md sections 5.2, 5.3, 5.4, and 8.1 are checked against it by
# `node scripts/check-vocab.mjs 1.0`; a table that drifts fails the build.
# Implementations may consume this file directly rather than parsing the prose.
#
# type is one of the closed vocabulary of [OAR-FACT-16]: bool, int, double,
# string, list<string>, map<string, dyn>, list<map<string, dyn>> — or a
# function signature written (arg-type) -> return-type.

oar: "1.0"

core:
  description: >-
    Provided by every conforming engine. Deliberately minimal: only what is
    meaningful at every anchor of every host — the call being made, the
    session it belongs to, and the engine's own counters.
  facts:
    - name: tool
      type: string
      observation: The name of the tool being invoked at this anchor occurrence.
    - name: tool_args
      type: map<string, dyn>
      observation: The arguments the tool was called with, as a map.
    - name: session_posture
      type: string
      observation: The session's declared posture.
    - name: profile
      type: string
      observation: The permission profile in force for this call.
    - name: arg_validation_errors
      type: list<string>
      observation: >-
        Machine codes for argument checks that did not pass. Empty when the
        arguments validated.
    - name: tool_args_fingerprint
      type: string
      observation: >-
        A stable digest of the tool name and arguments, for identifying a
        repeat of the same call.
    - name: breaker_count
      type: int
      observation: >-
        How many times a circuit breaker has been incremented for this rule and
        session.
    - name: same_code_reject_run
      type: int
      observation: >-
        How many consecutive rejections carrying the same identifier this
        session has produced.
    - name: is_directory
      type: bool
      observation: True when a path argument resolved to a directory.
    - name: not_found
      type: bool
      observation: True when a path or artifact the call names does not exist.
    - name: path_denied
      type: bool
      observation: True when a path argument resolved to a location policy refuses.
    - name: policy_denied
      type: bool
      observation: True when the host's own policy layer refused the call.
  functions:
    - name: path_outside_scope
      type: (string) -> bool
      observation: >-
        True when the named tool's path arguments resolve outside the scope in
        force for that tool.

profiles:
  - name: content-safety
    description: >-
      A host that submits model-facing content to registered detectors and
      publishes their observations as facts.
    facts:
      - name: prompt_injection_score
        type: double
        observation: >-
          Injection likelihood from a registered detector, between 0 and 1.
      - name: jailbreak_score
        type: double
        observation: Jailbreak likelihood from a registered detector, between 0 and 1.
      - name: pii_entities
        type: list<map<string, dyn>>
        observation: >-
          Personal-data spans a registered detector reported. Empty when no
          detector ran.
      - name: secret_matches
        type: list<map<string, dyn>>
        observation: >-
          Credential or secret spans a registered detector reported. Empty when
          no detector ran.

  - name: mcp
    description: A host bridging Model Context Protocol providers.
    facts:
      - name: mcp_server_id
        type: string
        observation: >-
          The catalogue server id for this call, or empty when the call is not a
          bridged tool call.
      - name: mcp_tool_name
        type: string
        observation: The unqualified tool name on the bridged server.
      - name: mcp_qualified_tool
        type: string
        observation: The host-side name of the bridged tool.
      - name: mcp_server_configured
        type: bool
        observation: True when the catalogue contains the given server id.
      - name: mcp_server_enabled
        type: bool
        observation: True when the given server is configured and enabled.
      - name: mcp_call_ok
        type: bool
        observation: >-
          True after a bridged call that returned without error. False before
          the call.
      - name: mcp_error_code
        type: string
        observation: >-
          The machine error code a failed bridged call reported, never free
          text.
      - name: mcp_schema_matched
        type: bool
        observation: >-
          True when at least one declared result schema validated the call's
          result.
      - name: mcp_server_configured_for
        type: (string) -> bool
        observation: True when the catalogue contains the given server id.
      - name: mcp_server_enabled_for
        type: (string) -> bool
        observation: True when the given server is configured and enabled.
      - name: mcp_has_field
        type: (string) -> bool
        observation: True when the projected result carries the given key.
      - name: mcp_field_bool
        type: (string) -> bool
        observation: >-
          The projected boolean at the given key; false when absent or wrongly
          typed.
      - name: mcp_field_string
        type: (string) -> string
        observation: The projected string at the given key; empty when absent.
      - name: mcp_field_int
        type: (string) -> int
        observation: The projected integer at the given key; zero when absent.

anchors:
  - name: tool.pre_invoke
    moment: >-
      Before a tool call is dispatched, with the tool name and arguments
      observable and nothing executed yet.
  - name: tool.handler
    moment: >-
      Inside the tool's own handler, after argument validation and before the
      effect it performs.
  - name: tool.post_invoke
    moment: >-
      After a tool call returns, with the result observable and before it is
      handed back to the agent.
  - name: agent.post_turn
    moment: >-
      After an agent produces a turn that called no tool — the moment a claim
      can be checked against evidence.
  - name: agent.finalize
    moment: After a worker or child agent completes and its summary is available.
  - name: model.input
    moment: >-
      User and retrieved content assembled for the model, before the model
      consumes it.
  - name: model.output
    moment: A model response, before it is shown to a person or acted on.
  - name: model.tool_result
    moment: >-
      Content returned by a tool or retrieval step, before the model consumes
      it.

# Reserved for the conformance corpus. [OAR-CONF-18] requires an engine running
# the corpus to provide all three; none needs a model or a network.
detectors:
  - ref: detector://noop
    behaviour: Reports no findings.
  - ref: detector://error
    behaviour: Always fails, which is how a fixture reaches the on_error path.
  - ref: detector://fixture
    behaviour: >-
      Reports no findings of its own, leaving the detector facts the fixture
      supplied in place, which is how a fixture proves the rule owns the
      threshold.

# The closed on_fire vocabulary ([OAR-FIRE-1]) and what each action does.
# The fire counter an increment_counter/reset_counter pair maintains is exposed
# to rules as an ordinary fact per [OAR-FIRE-3]; the core table names
# breaker_count, which increment_breaker/reset_breaker maintain.
on_fire:
  - action: increment_counter
    effect: Adds one to the rule's fire counter.
  - action: reset_counter
    effect: Sets the rule's fire counter to zero.
  - action: increment_breaker
    writes: breaker_count
    effect: Adds one.
  - action: reset_breaker
    writes: breaker_count
    effect: Sets the value to zero.
  - action: publish_event
    writes: null
    effect: >-
      Emits an event to the host's audit sink. It writes no fact.
