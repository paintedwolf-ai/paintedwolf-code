[package]
name = "document-core"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
yrs = "=0.27.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
lto = true
opt-level = "s"
panic = "abort"
overflow-checks = true
debug-assertions = true
strip = true
