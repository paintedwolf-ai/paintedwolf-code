[package]
name = "bialy"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false
description = "Bialy: the tuned local decision engine"

[lib]
name = "bialy"
path = "src/lib.rs"

[[bin]]
name = "bialy"
path = "src/main.rs"

[dependencies]
candle-core = "0.11.0"
candle-nn = "0.11.0"
clap = { version = "4.5", features = ["derive"] }
indexmap = { version = "2.7", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

burn = { version = "0.22.0", default-features = false, features = ["std", "vulkan", "fusion", "autotune", "cubecl"], optional = true }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlx-rs = { version = "0.32", optional = true }

[features]
default = []
# Accelerated runtimes; scripts/decide-features.sh picks per host.
# MLX on Apple silicon.
mlx = ["dep:mlx-rs"]
# Any Vulkan GPU, through Burn.
vulkan = ["dep:burn"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
