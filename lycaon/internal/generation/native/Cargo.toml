[package]
name = "nativegen"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = false
description = "Native local generation service for Gemma 4 E4B"

[lib]
name = "nativegen"
path = "src/lib.rs"

[[bin]]
name = "nativegen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
half = "2"
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlx-rs = { version = "0.32", optional = true }

[features]
default = []
# Apple silicon acceleration.
mlx = ["dep:mlx-rs"]

[profile.release]
opt-level = 3
lto = "thin"
strip = true
