# fixture_echo.yaml — testdata schema binding for unit tests.
id: fixture_echo
provider_id: fixture
tool_name: echo
schema:
  type: object
  required: [id, state]
  properties:
    id: { type: string }
    count: { type: integer }
    state:
      type: object
      properties:
        type: { type: string }
        name: { type: string }
fields:
  - key: issue_id
    type: string
    path: /id
  - key: state_type
    type: string
    path: /state/type
  - key: is_started
    type: bool
    path: /state/type
    equals: started
  - key: item_count
    type: int
    path: /count
