# Go static analysis for the lycaon module.
# lint:fast: --fast-only plus gosec. lint:full: every enabled linter.

version: "2"

run:
  # The CI job limit bounds a hang; a clean run must not fail on elapsed time.
  timeout: 0
  tests: true
  # Analyze integration- and budget-tagged files.
  build-tags:
    - integration
    - budgets
    - referenceuserland
  # Concurrent lint processes share the checkout cache.
  allow-parallel-runners: true

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - config/runtime/scanners/rules/vendor
      - internal/syntaxhealth/testdata/go-eof

linters:
  default: none
  enable:
    - bidichk
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - forbidigo
    - funlen
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - govet
    - ineffassign
    - mirror
    - misspell
    - nilerr
    - nilnesserr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - nolintlint
    - paralleltest
    - sloglint
    - staticcheck
    - testifylint
    - tparallel
    - unused
    - usetesting
    - wastedassign

  settings:
    govet:
      # nilness proves impossible and tautological conditions.
      enable:
        - nilness
    errcheck:
      # Fprint to stdout or an in-memory buffer is not actionable. Close, Rollback, and Sync stay checked.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    funlen:
      lines: 160
      statements: 120
    gocritic:
      enabled-tags:
        - diagnostic
      disabled-checks:
        - ifElseChain
        # Reports the standard `if err := f(); err != nil` idiom as unchecked;
        # every reported site checks the error and the messages garble the
        # line's tokens.
        - uncheckedInlineErr
        # Fixture path Join shapes.
        - filepathJoin
        - badCall
    gosec:
      config:
        # Match credential-shaped identifiers without substring noise.
        G101:
          pattern: '(?i)(?:^cred(?:ential)?$|(?:passwd|pass|password|pwd|secret|token|pw|api[_-]?key|bearer)$)'
    staticcheck:
      # Listing `checks` replaces the default set. QF1001 inverts character-class
      # allowlists.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    exhaustive:
      check:
        - switch
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print(|f|ln)$
          msg: use slog instead of fmt.Print* in production code
        - pattern: ^print(|ln)$
          msg: use slog instead of builtin print/println
        - pattern: ^syscall\.Kill$
          msg: use osprocess.Signal or osprocess.SignalGroup instead of raw syscall.Kill
        - pattern: ^(golang\.org/x/sys/)?unix\.(Kill|Killpg|PidfdSendSignal)$
          msg: use osprocess.Signal or osprocess.SignalGroup instead of raw unix signal syscalls
        - pattern: ^os\.FindProcess$
          msg: use osprocess.Incarnation instead of wrapping an unverified PID with os.FindProcess
      analyze-types: true
    paralleltest:
      # Loop subtests that capture a shared var must still call Parallel.
      ignore-missing: true
      ignore-missing-subtests: true
    sloglint:
      no-mixed-args: true
      kv-only: false
      attr-only: false
      # no-global stays unset: log helpers such as loopwake/loop_log.go wrap the
      # boot-configured default logger.
      context: scope
      static-msg: false
      key-naming-case: snake
    depguard:
      rules:
        # Wire types must not depend on engine internals.
        pkg-api:
          list-mode: lax
          files:
            - '**/pkg/api/**'
            - '!**/pkg/api/**_test.go'
          deny:
            - pkg: github.com/lycaon/lycaon/internal
              desc: pkg/api is the wire contract; it must not import internal/**
        # OpenAPI runtime validators are heavy and intended only for test/openapi.
        # Production paths use the lighter validators in pkg/api.
        openapi-runtime:
          list-mode: lax
          files:
            - '**/internal/**'
          deny:
            - pkg: github.com/lycaon/lycaon/test/openapi
              desc: test/openapi kin-openapi validators must not be imported under internal/

  exclusions:
    rules:
      # Format is a pure template render; no deadline to observe.
      - text: '(->|Function `)Format` should pass the context parameter'
        linters:
          - contextcheck
      # Author `rules test` CLI / conformance fixtures — no request-scoped
      # deadline; CheckRuleFiles is a batch verb over files.
      - text: '->RunFixture` should pass the context parameter'
        linters:
          - contextcheck
      # Catalog initialization has a process lifetime.
      - text: '(->|Function `)CatalogForConsumers` should pass the context parameter'
        linters:
          - contextcheck
      # Park timers and eviction callbacks outlive the request that claimed the
      # project, so they run without caller cancellation.
      - text: '(ClaimWorkspace|ClaimTurn|claim|evaluateProjectLocked|evictOldestActiveLocked).*should pass the context parameter'
        linters:
          - contextcheck
      # Operation contexts live on Page; teardown detaches cancellation.
      - path: '^internal/(browser/|app/runtime_resources\.go$)'
        text: '(->|Function `)(driverCall|PageInfo|closeTarget|stopPageCast)` should pass the context parameter'
        linters:
          - contextcheck
      # The reaper outlives every request, so supervisors seed it with a
      # detached context; the chain is by design.
      - text: '->ensureReaper->startReaperLocked` should pass the context parameter'
        linters:
          - contextcheck
      # NFS prepare teardown (rollback closures, detachUnserved, Probe,
      # unmount) runs after a failed or canceled prepare, and the server
      # outlives it; these contexts are detached by design.
      - path: '^internal/layeredfs/adapter/nfsdarwin/'
        text: '(should pass the context parameter|Non-inherited new context)'
        linters:
          - contextcheck
      # Datagram endpoint receive is bounded by the endpoint's Close and
      # cancel, not each caller's request context.
      - text: '->startDatagramEndpoint->receive->peer` should pass the context parameter'
        linters:
          - contextcheck
      # cgo rewrites C calls into generated temporaries that gocritic reports
      # as duplicate subexpressions and unchecked inline errors.
      - path: '^internal/(desktoptrash/trash|hostprocess/process|userpath/account_shell)_darwin\.go$'
        text: '(dupSubExpr|uncheckedInlineErr)'
        linters:
          - gocritic
      # cgo wrapper temporaries in the darwin descriptor custodians read as
      # duplicate subexpressions and extra dereferences.
      - path: '^internal/(lineage/(socket|listener)_darwin|socketref/volume_darwin|osprocess/pidpath_darwin)\.go$'
        text: '(dupSubExpr|underef)'
        linters:
          - gocritic
      - path: '(.+)_test\.go'
        linters:
          - errcheck
          - gosec
      - path: '^internal/session/(coordinator_wire|spawn)\.go'
        linters:
          - funlen
      # One linear wire-up per subsystem.
      - path: '^internal/app/build_(board|delegation|workflows|server)\.go'
        linters:
          - funlen
      - path: '^test/'
        linters:
          - errcheck
          - gosec
          - funlen
      - path: '^pkg/api/.*_test\.go'
        linters:
          - funlen
      # Executes sandboxed subprocesses.
      - path: '^internal/exec/exec\.go'
        linters:
          - gosec
      # Launches each target process with its generated sandbox profile.
      - path: '^internal/confine/'
        linters:
          - gosec
      # Dials caller-supplied hosts after approval by the egress decider.
      - path: '^internal/egressproxy/'
        linters:
          - gosec
      # Config loaders read paths under the host config root.
      - path: '^internal/'
        text: 'G304'
        linters:
          - gosec
      # Credentials file is redacted before marshal in production paths.
      - path: '^internal/llm/credentials/'
        text: 'G117'
        linters:
          - gosec
      # Credential bytes are atomically stored with owner-only file permissions.
      - path: '^internal/credentialstore/'
        text: 'G117'
        linters:
          - gosec
      # Random index fallback; max is a small positive pool size.
      - path: '^internal/llm/pool_selector\.go'
        text: 'G115'
        linters:
          - gosec
      # API handlers write JSON and SARIF bodies, never HTML.
      - path: '^internal/api/'
        text: 'G705'
        linters:
          - gosec
      # Commit comparison reads paths confined by evidence.ResolveCitationAbs.
      - path: '^internal/api/sourceapi/project_source_commit_comparison\.go'
        text: 'G703'
        linters:
          - gosec
      # Git remote lookup for project registration.
      - path: '^internal/project/registry\.go'
        linters:
          - gosec
      # Paths validated by sandbox before read/write.
      - path: '^internal/tools/native/'
        linters:
          - gosec
      # The FUSE and NFS servers translate fixed-width wire fields to and from the core's types.
      - path: '^internal/layeredfs/(adapter/fuselinux|nfsserver)/'
        text: 'G115'
        linters:
          - gosec
      # Darwin's stat_t carries narrower device fields than Linux's; widening
      # non-negative kernel ids to the core's types cannot overflow, and the
      # conversion is a no-op where the field is already wide.
      - path: '^internal/(fseffect|fspath|launchverify|layeredfs)/'
        text: 'G115: integer overflow conversion int32 -> uint64'
        linters:
          - gosec
      # Darwin kernel-structure marshaling: sockaddr family and length bytes
      # and uid and gid fields are narrower than Go's types, and non-negative
      # kernel ids cannot overflow; G103 marks the syscall buffers these
      # structures require.
      - path: '^internal/(lineage/holder_exclusion_darwin|socketref/(peer|reference|reference_directory|service_directory)_darwin|layeredfs/adapter/nfsdarwin/(connection_recovery|mount|fsstat_darwin)|fseffect/read_directory_path_darwin)\.go$'
        text: 'G(103|115)'
        linters:
          - gosec
      # The retained-service endpoint passes file descriptors through raw
      # sendmsg inside RawConn so custody serializes with connection writes;
      # the darwin-only raw syscalls (sendmsg, F_GETPATH fcntl and getsockopt)
      # are the only forms the kernel offers and are deprecated only there.
      - path: '^internal/(socketref/endpoint_messages_unix|fseffect/read_directory_path_darwin|socketref/peer_darwin)\.go$'
        text: 'SA1019: unix\.SYS_(SENDMSG|FCNTL|GETSOCKOPT)'
        linters:
          - staticcheck
      # Worker trees keep the modes their source and Git give them; engine storage sits under
      # owner-only roots.
      - path: '^internal/layeredfs/'
        text: 'G30[126]'
        linters:
          - gosec
      # Paths name entries of engine-owned branch, backing and checkpoint trees, resolved against
      # their root before use.
      - path: '^internal/(layeredfs|workspace|worker)/'
        text: 'G(703|122)'
        linters:
          - gosec
      # CLI commands print user-facing output.
      - path: '^cmd/'
        text: 'use slog instead of'
        linters:
          - forbidigo
      # Low-level process identity and namespace plumbing owns raw signal syscalls.
      - path: '^internal/(osprocess/|launchguard/|confine/linuxsandbox/|hostprocess/|exec/(supervisor_linux|supervisor_tree_linux|relay_linux)\.go$)'
        text: 'use osprocess\.'
        linters:
          - forbidigo
      # Tests use fmt.Print* for diagnostic output during development.
      - path: '(.+)_test\.go'
        linters:
          - forbidigo
          - sloglint
          - contextcheck
      # Webindex serializes writes without caller contexts.
      - path: '^internal/webindex/'
        linters:
          - noctx
      # Survey visitors may skip unreadable entries.
      - source: 'return sandbox\.Survey(Continue|Stop), nil'
        linters:
          - nilerr
      - path: '(.+)_test\.go'
        linters:
          - noctx
          - errchkjson
          - nilerr
      - path: '^test/'
        linters:
          - noctx
          - errchkjson
          - nilerr

issues:
  # Report every finding so one repair does not reveal a hidden next batch.
  max-issues-per-linter: 0
  max-same-issues: 0
