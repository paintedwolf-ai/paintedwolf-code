# Go static analysis for the lycaon module.
# lint:fast: --fast-only plus gosec. lint:full: every enabled linter.

version: "2"

run:
  timeout: 20m
  tests: true
  # Analyze integration- and budget-tagged files.
  build-tags:
    - integration
    - budgets
  # Concurrent lint processes share the checkout cache.
  allow-parallel-runners: true

linters:
  default: none
  enable:
    - bidichk
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - forbidigo
    - funlen
    - gocheckcompilerdirectives
    - gocritic
    - gosec
    - govet
    - ineffassign
    - mirror
    - misspell
    - nilerr
    - nilnesserr
    - noctx
    - rowserrcheck
    - sqlclosecheck
    - nolintlint
    - paralleltest
    - sloglint
    - staticcheck
    - testifylint
    - tparallel
    - unused
    - usetesting
    - wastedassign

  settings:
    govet:
      # nilness proves impossible and tautological conditions.
      enable:
        - nilness
    errcheck:
      # Fprint to stdout or an in-memory buffer is not actionable. Close, Rollback, and Sync stay checked.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
    funlen:
      lines: 160
      statements: 120
    gocritic:
      enabled-tags:
        - diagnostic
      disabled-checks:
        - ifElseChain
        # Fixture path Join shapes.
        - filepathJoin
        - badCall
    gosec:
      config:
        # Match credential-shaped identifiers without substring noise.
        G101:
          pattern: '(?i)(?:^cred(?:ential)?$|(?:passwd|pass|password|pwd|secret|token|pw|api[_-]?key|bearer)$)'
    staticcheck:
      # Listing `checks` replaces the default set. QF1001 inverts character-class
      # allowlists.
      checks:
        - all
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        - -QF1001
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    exhaustive:
      check:
        - switch
      default-signifies-exhaustive: true
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print(|f|ln)$
          msg: use slog instead of fmt.Print* in production code
        - pattern: ^print(|ln)$
          msg: use slog instead of builtin print/println
      analyze-types: true
    paralleltest:
      # Loop subtests that capture a shared var must still call Parallel.
      ignore-missing: true
      ignore-missing-subtests: true
    sloglint:
      no-mixed-args: true
      kv-only: false
      attr-only: false
      # no-global stays unset: log helpers such as loopwake/loop_log.go wrap the
      # boot-configured default logger.
      context: scope
      static-msg: false
      key-naming-case: snake
    depguard:
      rules:
        # Wire types must not depend on engine internals.
        pkg-api:
          list-mode: lax
          files:
            - '**/pkg/api/**'
            - '!**/pkg/api/**_test.go'
          deny:
            - pkg: github.com/lycaon/lycaon/internal
              desc: pkg/api is the wire contract; it must not import internal/**
        # OpenAPI runtime validators are heavy and intended only for test/openapi.
        # Production paths use the lighter validators in pkg/api.
        openapi-runtime:
          list-mode: lax
          files:
            - '**/internal/**'
          deny:
            - pkg: github.com/lycaon/lycaon/test/openapi
              desc: test/openapi kin-openapi validators must not be imported under internal/

  exclusions:
    rules:
      # Format is a pure template render; no deadline to observe.
      - text: '(->|Function `)Format` should pass the context parameter'
        linters:
          - contextcheck
      # Author `rules test` CLI / conformance fixtures — no request-scoped
      # deadline; CheckRuleFiles is a batch verb over files.
      - text: '->RunFixture` should pass the context parameter'
        linters:
          - contextcheck
      # Catalog initialization has a process lifetime.
      - text: '(->|Function `)CatalogForConsumers` should pass the context parameter'
        linters:
          - contextcheck
      # Park timers and eviction callbacks outlive the request that claimed the
      # project, so they run without caller cancellation.
      - text: '(ClaimWorkspace|ClaimTurn|claim|evaluateProjectLocked|evictOldestActiveLocked).*should pass the context parameter'
        linters:
          - contextcheck
      # Operation contexts live on Page; teardown detaches cancellation.
      - path: '^internal/(browser/|app/runtime_resources\.go$)'
        text: '(->|Function `)(driverCall|PageInfo|closeTarget|stopPageCast)` should pass the context parameter'
        linters:
          - contextcheck
      # cgo rewrites C calls into generated temporaries that gocritic reports
      # as duplicate subexpressions and unchecked inline errors.
      - path: '^internal/(desktoptrash/trash|hostprocess/process|userpath/account_shell)_darwin\.go$'
        text: '(dupSubExpr|uncheckedInlineErr)'
        linters:
          - gocritic
      - path: '(.+)_test\.go'
        linters:
          - errcheck
          - gosec
      - path: '^internal/session/(coordinator_wire|spawn)\.go'
        linters:
          - funlen
      # One linear wire-up per subsystem.
      - path: '^internal/app/build_(board|delegation|workflows|server)\.go'
        linters:
          - funlen
      - path: '^test/'
        linters:
          - errcheck
          - gosec
          - funlen
      - path: '^pkg/api/.*_test\.go'
        linters:
          - funlen
      # Executes sandboxed subprocesses.
      - path: '^internal/exec/exec\.go'
        linters:
          - gosec
      # Launches each target process with its generated sandbox profile.
      - path: '^internal/confine/'
        linters:
          - gosec
      # Dials caller-supplied hosts after approval by the egress decider.
      - path: '^internal/egressproxy/'
        linters:
          - gosec
      # Config loaders read paths under the host config root.
      - path: '^internal/'
        text: 'G304'
        linters:
          - gosec
      # Credentials file is redacted before marshal in production paths.
      - path: '^internal/llm/credentials/'
        text: 'G117'
        linters:
          - gosec
      # Credential bytes are atomically stored with owner-only file permissions.
      - path: '^internal/credentialstore/'
        text: 'G117'
        linters:
          - gosec
      # Random index fallback; max is a small positive pool size.
      - path: '^internal/llm/pool_selector\.go'
        text: 'G115'
        linters:
          - gosec
      # API handlers write JSON and SARIF bodies, never HTML.
      - path: '^internal/api/'
        text: 'G705'
        linters:
          - gosec
      # Commit comparison reads paths confined by evidence.ResolveCitationAbs.
      - path: '^internal/api/sourceapi/project_source_commit_comparison\.go'
        text: 'G703'
        linters:
          - gosec
      # Git remote lookup for project registration.
      - path: '^internal/project/registry\.go'
        linters:
          - gosec
      # Paths validated by sandbox before read/write.
      - path: '^internal/tools/native/'
        linters:
          - gosec
      # CLI commands print user-facing output.
      - path: '^cmd/'
        linters:
          - forbidigo
      # Tests use fmt.Print* for diagnostic output during development.
      - path: '(.+)_test\.go'
        linters:
          - forbidigo
          - sloglint
          - contextcheck
      # Webindex serializes writes without caller contexts.
      - path: '^internal/webindex/'
        linters:
          - noctx
      # Survey visitors may skip unreadable entries.
      - source: 'return sandbox\.Survey(Continue|Stop), nil'
        linters:
          - nilerr
      - path: '(.+)_test\.go'
        linters:
          - noctx
          - errchkjson
          - nilerr
      - path: '^test/'
        linters:
          - noctx
          - errchkjson
          - nilerr
