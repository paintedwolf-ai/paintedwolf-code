<!DOCTYPE html>
<html><head><title>Role label</title></head>
<body>
<button type="button" id="check">Check configuration</button>
<pre id="status">idle</pre>
<script>
document.getElementById("check").addEventListener("click", () => {
  document.getElementById("status").textContent = "loading";
  fetch("/config.json")
    .then((r) => r.json())
    .then((cfg) => {
      document.getElementById("status").textContent = "ok:" + (cfg.env || "");
    })
    .catch((err) => {
      document.getElementById("status").textContent = "error:" + err;
    });
});
</script>
</body></html>
