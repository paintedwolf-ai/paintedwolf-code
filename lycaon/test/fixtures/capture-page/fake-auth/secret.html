<!DOCTYPE html>
<html><head><title>Secret</title></head>
<body>
<div id="gate">checking…</div>
<script>
function authed() {
  return document.cookie.split(";").some((c) => c.trim().startsWith("session=authed"));
}
const gate = document.getElementById("gate");
if (authed()) {
  gate.textContent = "welcome-authed";
} else {
  gate.textContent = "denied";
}
</script>
</body></html>
