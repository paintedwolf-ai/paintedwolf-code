<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Geometry fixture</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #ffffff; }
    #box-a {
      position: absolute;
      left: 40px;
      top: 40px;
      width: 120px;
      height: 60px;
      background: #1a1a1a;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #box-b {
      position: absolute;
      left: 180px; /* 40 + 120 + 20 gap */
      top: 40px;
      width: 80px;
      height: 60px;
      background: #cccccc;
      color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body>
  <div id="box-a" data-testid="box-a">A</div>
  <div id="box-b" data-testid="box-b">B</div>
</body>
</html>
