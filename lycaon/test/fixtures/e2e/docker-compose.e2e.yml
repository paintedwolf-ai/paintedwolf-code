# Tier B browser E2E with random host ports.
services:
  model-fixture:
    image: oven/bun:1.3.14
    command:
      - bun
      - -e
      - |
        Bun.serve({
          hostname: "0.0.0.0",
          port: 11434,
          fetch(request) {
            const path = new URL(request.url).pathname;
            if (request.method === "GET" && path === "/api/tags") {
              return Response.json({models: [{name: "mock-model"}]});
            }
            if (request.method === "POST" && path === "/api/show") {
              return Response.json({capabilities: ["completion", "tools"]});
            }
            return new Response("not found", {status: 404});
          },
        });

  sidecar:
    # Match the module's pinned toolchain.
    image: golang:1.26.8-bookworm
    working_dir: /workspace/lycaon
    depends_on:
      - model-fixture
    volumes:
      - type: bind
        source: ${LYCAON_REPO_ROOT}/lycaon
        target: /workspace/lycaon
      - type: bind
        source: ${LYCAON_REPO_ROOT}/schemas
        target: /workspace/schemas
        read_only: true
      # go.mod replaces the parser module with ../third_party/gotreesitter.
      - type: bind
        source: ${LYCAON_REPO_ROOT}/third_party
        target: /workspace/third_party
        read_only: true
      - type: bind
        source: ${LYCAON_E2E_STATE_DIR}
        target: ${LYCAON_E2E_STATE_DIR}
      - type: bind
        source: ${LYCAON_E2E_PROJECT_DIR}
        target: ${LYCAON_E2E_PROJECT_DIR}
      # Module and build caches outlive the per-run compose project.
      - type: bind
        source: ${LYCAON_E2E_GO_CACHE_DIR}/mod
        target: /go/pkg/mod
      - type: bind
        source: ${LYCAON_E2E_GO_CACHE_DIR}/build
        target: /root/.cache/go-build
    environment:
      LYCAON_ADDR: 0.0.0.0:8787
      LYCAON_BIND_ALL: "1"
      LYCAON_API_TOKEN: ${LYCAON_E2E_TOKEN}
      LYCAON_CONFIG_DIR: ${LYCAON_E2E_CONFIG_DIR}
      LYCAON_LLM_MOCK: "1"
      LYCAON_HARNESS: "1"
      LYCAON_DEV: "1"
      LYCAON_DEV_CORS: "1"
      GOPROXY: https://proxy.golang.org,direct
    command:
      - sh
      - -c
      - |
        set -eu
        echo "e2e-sidecar: go build…" >&2
        go build -o /tmp/lycaon ./cmd/lycaon
        echo "e2e-sidecar: serve…" >&2
        exec /tmp/lycaon serve --db "${LYCAON_E2E_STATE_DIR}/lycaon.db"
    ports:
      - "127.0.0.1::8787"

  vite:
    # Match the workspace's pinned runtime.
    image: oven/bun:1.3.14
    working_dir: /workspace/lycaon-den
    depends_on:
      - sidecar
    volumes:
      - type: bind
        source: ${LYCAON_REPO_ROOT}/lycaon-den
        target: /workspace/lycaon-den
      - type: bind
        source: ${LYCAON_REPO_ROOT}/lycaon/config
        target: /workspace/lycaon/config
        read_only: true
      - type: bind
        source: ${LYCAON_REPO_ROOT}/CHANGELOG.md
        target: /workspace/CHANGELOG.md
        read_only: true
      - type: volume
        source: vite-node-modules
        target: /workspace/lycaon-den/node_modules
    environment:
      VITE_LYCAON_API_URL: ${LYCAON_E2E_API_URL}
      VITE_LYCAON_API_TOKEN: ${LYCAON_E2E_TOKEN}
      VITE_LYCAON_PROXY: "1"
      VITE_LYCAON_PROXY_TARGET: http://sidecar:8787
      LYCAON_E2E_FROZEN: "1"
    command:
      - sh
      - -c
      - bun install --frozen-lockfile && exec bun run vite --host 0.0.0.0 --port 1420 --strictPort
    ports:
      - "127.0.0.1::1420"

volumes:
  vite-node-modules:
