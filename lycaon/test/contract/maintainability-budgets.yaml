# Maintainability limits. Every artifact a change touches must be within its
# category limit: a file it edits, a directory it adds files to or removes
# files from, a Go type whose declaration or methods it edits. Artifacts the
# change does not touch are counted, and meet the standard when next touched.
#
# An exception admits one artifact up to its cap. Write one only when the
# artifact must be that large, give the cap room for ordinary edits, and say
# why in terms a reviewer can weigh. No exception may be outgrown.
limits:
    source_files: {warn: 400, limit: 600}
    test_files: {warn: 500, limit: 800}
    source_directories: {warn: 30, limit: 50}
    test_directories: {warn: 40, limit: 70}
    go_struct_fields: {warn: 15, limit: 25}
    go_receiver_methods: {warn: 20, limit: 40}
    go_receiver_lines: {warn: 400, limit: 1000}
    ts_local_dependencies: {warn: 20, limit: 30}
exceptions:
    go_receiver_lines:
        lycaon/internal/coordinator/loopwake/loopwake.LoopEngine:
            cap: 1835
            reason: "Past the limit before #356, which stops its wait timers at host shutdown without adding methods; the split is tracked in #364."
        lycaon/internal/coordinator/assembly/assembly.AssemblyEngine:
            cap: 1200
            reason: "Already past the limit before the boot-orientation fix, which adds one bounded loop; the split is tracked in #270."
        lycaon/internal/session/session.Manager:
            cap: 12700
            reason: Predates the limits; fixes still land here while the package is decomposed (#271).
        lycaon/internal/workflow/workflow.RunManager:
            cap: 6500
            reason: The workflow run lifecycle (advance, gates, topology settlement, closeout, report delivery, runtime snapshots) shares one manager's run locks and ledger; splitting it needs its own change with a lifecycle and locking review.
    go_receiver_methods:
        lycaon/internal/toolhost/toolhost.Runtime:
            cap: 42
            reason: "Past the limit before #356, which releases the default status cache through a binding without adding methods; the split is tracked in #363."
        lycaon/internal/coordinator/loopwake/loopwake.LoopEngine:
            cap: 121
            reason: "Past the limit before #356, which moves the sleep table into its own type to stop wait timers without growing the engine; the split is tracked in #364."
        lycaon/internal/hitl/hitl.Manager:
            cap: 48
            reason: "Past the limit before #356, which moves expiry scheduling into its own type to stop timers without growing the manager; the split is tracked in #365."
        lycaon/internal/coordinator/assembly/assembly.AssemblyEngine:
            cap: 55
            reason: "Already past the limit before the boot-orientation fix; the split is tracked in #270."
        lycaon/internal/session/session.Manager:
            cap: 720
            reason: Predates the limits; fixes still land here while the package is decomposed (#271).
        lycaon/internal/workflow/workflow.RunManager:
            cap: 250
            reason: The workflow run lifecycle (advance, gates, topology settlement, closeout, report delivery, runtime snapshots) shares one manager's run locks and ledger; splitting it needs its own change with a lifecycle and locking review.
    go_struct_fields:
        lycaon/internal/toolhost/toolhost.Runtime:
            cap: 36
            reason: "Past the limit before #356, which folds the status cache and its release into one field; the split is tracked in #363."
        lycaon/internal/session/session.Manager:
            cap: 145
            reason: Predates the limits; fixes still land here while the package is decomposed (#271).
    source_files:
        lycaon/internal/coordinator/loopwake/engine.go:
            cap: 1198
            reason: "Past the limit before #356, which moves the sleep table out of it; the split is tracked in #364."
        lycaon/internal/toolhost/runtime.go:
            cap: 962
            reason: "Past the limit before #356, which only rewires the status cache binding; the split is tracked in #363."
        lycaon/internal/session/coordinator_wire.go:
            cap: 1100
            reason: Predates the limits; fixes still land here while the package is decomposed (#271).
    test_directories:
        lycaon/internal/session:
            cap: 265
            reason: Predates the limits; fixes still land here while the package is decomposed (#271).
    source_directories:
        lycaon/internal/session:
            cap: 210
            reason: Predates the limits; fixes still land here while the package is decomposed (#271).
        scripts:
            cap: 170
            reason: Task and CI entry points are invoked by path and import sibling modules by name; the change-scoped budget and coverage reports joined them here.
