version: 2

agents:
  web-path-explorer:
    archetype: explore_readonly
    playbook_ids: [worker-leg-default, explore-addenda]
    delta:
      role_title: Web path explorer
      focus: "Explore paths and structure for the coordinator within this profile's tools."
      process:
        - "Report what the offered tools established and list the rest as unknowns."

  web-security-reviewer:
    archetype: security_scan_survey
    playbook_ids: [worker-leg-default, security-review-addenda]
    delta:
      role_title: Web security reviewer
      focus: "Review the assigned security scope within this profile's tools."
      process:
        - "Cite what the offered tools observed and put unreviewed areas in remaining_risk."

  editor-implementer:
    archetype: implement_shell
    playbook_ids: [worker-leg-default, implement-addenda]
    delta:
      role_title: Editor implementer
      focus: "Work the assigned change surface within this profile's tools."
      process:
        - "Read worker context and CompletionCriteria before editing."
