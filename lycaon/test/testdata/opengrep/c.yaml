language: c
comment:
- //
limits: 'Allocation lifetime checks are not enabled: pointer aliases can replace allocations, and syntactic dereference matches include unevaluated sizeof operands. Risk examples are context-only. Stack-address and selected unsafe-API checks remain; wrappers and cross-file flows require additional analysis.'
