language: swift
comment:
- //
limits: >-
  Intraprocedural Foundation and Vapor/SQLKit models with reviewed import facts, typed parameters, registered
  Application callbacks, and if/guard optional bindings. Stored SQL builders, custom SQL expressions, explicit
  closure captures, default or multiple-argument subscripts, custom request wrappers, and cross-file helper
  flows require additional modeling. Framework package versions are not resolved dynamically.
cases:
- name: insecure-unarchiving-context-only
  file: sample.swift
  source: |
    import Foundation
    func load(data: Data) { NSKeyedUnarchiver.unarchiveObject(with: data) }
  want: []
  covers: []
- name: insecure-unarchiving-safe
  file: sample.swift
  source: |
    import Foundation
    func load(data: Data) { NSKeyedUnarchiver.unarchivedObject(ofClass: NSString.self, from: data) }
  want: []
  covers: []
