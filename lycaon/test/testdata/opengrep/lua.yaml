language: lua
comment:
- --
limits: No qualified default security model. OpenResty globals, mutable API tables, and Lua environments require
  value identity before request-flow findings are reliable. Loading a chunk alone does not prove execution. Context-only
  and quiet examples are regression-tested.
cases:
- name: shell-injection-context-only
  file: sample.lua
  source: |
    function run()
     os.execute(ngx.var.arg_command)
    end
  want: []
  covers: []
  coverage:
  - lycaon.coverage.lua
- name: shell-injection-safe
  file: sample.lua
  source: |
    function run()
     os.execute("echo ready")
    end
  want: []
  covers: []
  coverage:
  - lycaon.coverage.lua
- name: code-injection-context-only
  file: sample.lua
  source: |
    function run()
     loadstring(ngx.var.arg_code)
    end
  want: []
  covers: []
  coverage:
  - lycaon.coverage.lua
