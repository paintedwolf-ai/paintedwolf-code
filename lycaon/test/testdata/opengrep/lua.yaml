- name: precision-local-ngx-table
  file: sample.lua
  source: |
    local ngx = {var = {arg_command = "echo ready", arg_code = "return 1", arg_path = "config.json", arg_next = "/home"}, redirect = function(value) return value end}
    os.execute(ngx.var.arg_command)
    load(ngx.var.arg_code)
    io.open(ngx.var.arg_path, "r")
    ngx.redirect(ngx.var.arg_next)
  want: []
  covers: []
  coverage:
  - lycaon.coverage.lua
- name: precision-local-os-table
  file: sample.lua
  source: |
