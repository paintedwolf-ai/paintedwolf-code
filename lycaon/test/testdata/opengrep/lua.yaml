    os.execute(ngx.var.arg_command)
  want: []
  covers: []
  coverage:
  - lycaon.coverage.lua
- name: precision-local-io-table
  file: sample.lua
  source: |
    local io = {popen = function(value) return value end, open = function(value) return value end}
    io.popen(ngx.var.arg_command)
    io.open(ngx.var.arg_path, "r")
  want: []
  covers: []
  coverage:
  - lycaon.coverage.lua
- name: precision-local-load-function
  file: sample.lua
  source: |
    local load = function(value) return value end
    local loadstring = function(value) return value end
    load(ngx.var.arg_code)
    loadstring(ngx.var.arg_code)
  want: []
  covers: []
  coverage:
  - lycaon.coverage.lua
- name: precision-parameter-ngx
  file: sample.lua
  source: |
    function render(ngx)
      ngx.redirect(ngx.var.arg_next)
      os.execute(ngx.var.arg_command)
    end
    render({var = {arg_next = "/home", arg_command = "echo ready"}, redirect = print})
  want: []
  covers: []
  coverage:
  - lycaon.coverage.lua
