language: dart
comment:
- //
limits: Local data flow with verified Dart, Shelf, Dart Frog and PostgreSQL import provenance. PostgreSQL query text is distinct from connection URLs and bound parameters; prepared statements require execution or direct stream consumption. Request change/copyWith fields, opaque wrappers, injected connections, pools, transaction callbacks, competing wildcard exports, conditional imports selecting different libraries, and cross-file identities remain unresolved.
cases:
- name: shell-interpolation-context-only
  file: sample.dart
  source: "void run(String user) { Process.run(\"sh\", [\"-c\", \"echo ${user}\"]); }\n"
  want: []
  covers: []
- name: shell-interpolation-safe
  file: sample.dart
  source: "void run(String user) { Process.run(\"printf\", [\"%s\",user]); }\n"
  want: []
  covers: []
- name: sql-interpolation-context-only
  file: sample.dart
  source: "void run(String user) { db.rawQuery(\"SELECT * FROM users WHERE name = ${user}\"); }\n"
  want: []
  covers: []
- name: sql-interpolation-safe
  file: sample.dart
  source: "void run(String user) { db.rawQuery(\"SELECT * FROM users WHERE name = ?\", [user]); }\n"
  want: []
  covers: []
