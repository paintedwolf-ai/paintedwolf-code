  source: |
    import 'package:shelf/shelf.dart' as shelf;
    import 'package:postgres/postgres.dart' as pg;
    Future<shelf.Response> handler(shelf.Request request) async {
     final user = request.url.queryParameters['value']!;
     final connection = await pg.Connection.openFromUrl('postgresql://localhost/test');
     await connection.execute(pg.Sql.named("SELECT * FROM items WHERE id = $user"));
     return shelf.Response.ok('ok');
    }
  want:
  - lycaon.dart.server-postgres-sql-injection
  covers:
  - lycaon.dart.server-postgres-sql-injection
- name: shelf-postgres-query-fixed-indexed
  file: app.dart
  source: |
    import 'package:shelf/shelf.dart' as shelf;
    import 'package:postgres/postgres.dart' as pg;
    Future<shelf.Response> handler(shelf.Request request) async {
     final user = request.url.queryParameters['value']!;
     final connection = await pg.Connection.openFromUrl('postgresql://localhost/test');
     await connection.execute(pg.Sql.indexed(r'SELECT * FROM items WHERE id = $1'), parameters: [user]);
     return shelf.Response.ok('ok');
    }
  want: []
  covers:
  - lycaon.dart.server-postgres-sql-injection
