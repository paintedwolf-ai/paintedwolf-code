  want: []
  covers: []
- name: network-policy-open-ingress-safe
  file: sample.yaml
  source: |
    kind: ProductExample
    spec:
      ingress:
        - {}
  want: []
  covers: []
- name: actions-injection
  file: .github/workflows/check.yaml
  source: |
    name: Check
    on: [issues]
    jobs:
      check:
        runs-on: ubuntu-latest
        steps:
          - run: echo "${{ github.event.issue.title }}"
  want:
  - lycaon.yaml.actions-script-injection
  covers: []
  evidence:
  - rule: lycaon.yaml.actions-script-injection
    primary: {line: 7, column: 20, end_line: 7, end_column: 51}
- name: actions-environment
  file: .github/workflows/check.yaml
  source: |
    name: Check
    on: [issues]
    jobs:
      check:
        runs-on: ubuntu-latest
        steps:
          - run: echo "$TITLE"
            env:
              TITLE: ${{ github.event.issue.title }}
  want: []
  covers:
  - lycaon.yaml.actions-script-injection
