language: yaml
comment:
- '#'
limits: Explicit Kubernetes privilege and direct reviewed GitHub event string interpolation. Workflow expression transforms and indirect values require additional analysis.
cases:
- name: privileged-container-vulnerable
  file: sample.yaml
  source: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: example
    spec:
      containers:
        - name: app
          image: example:1
          securityContext:
            privileged: true
  want:
  - lycaon.yaml.privileged-container
  covers: []
- name: privileged-container-safe
  file: sample.yaml
  source: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: example
    spec:
      containers:
        - name: app
          image: example:1
          securityContext:
            privileged: false
  want: []
  covers:
  - lycaon.yaml.privileged-container
- name: privilege-escalation-context-only
  file: sample.yaml
  source: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: example
    spec:
      containers:
        - name: app
          image: example:1
          securityContext:
            allowPrivilegeEscalation: true
  want: []
  covers: []
- name: privilege-escalation-safe
  file: sample.yaml
  source: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: example
    spec:
      containers:
        - name: app
          image: example:1
          securityContext:
            allowPrivilegeEscalation: false
  want: []
  covers: []
- name: host-process-namespace-context-only
  file: sample.yaml
