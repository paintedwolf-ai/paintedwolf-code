language: javascript
comment:
- //
limits: Express and Fastify inputs require a recognized factory, route registration, typed plugin contract, or imported fastify-plugin wrapper. Request-shaped local objects and unregistered handlers do not establish HTTP input. Selected imported or typed Next.js App Router and Pages Router handlers are modeled. Same-file helpers and exported closures are followed; untyped exported Fastify plugin functions without a recognized registration or wrapper, server actions, and cross-file handlers remain unmodeled.
cases:
- name: command-injection-vulnerable
  file: sample.js
  source: |
    import _pw_fixture_express from "express";
    const _pw_fixture_app = _pw_fixture_express();
    import fs from "node:fs";
    import { readFileSync } from "node:fs";
    import { exec } from "node:child_process";
    function route(req,res) { exec(req.query.command); }

    _pw_fixture_app.get("/fixture", route);

  want:
  - lycaon.javascript.command-injection
  covers: []
- name: command-injection-safe
  file: sample.js
  source: |
    import _pw_fixture_express from "express";
    const _pw_fixture_app = _pw_fixture_express();
    import fs from "node:fs";
    import { readFileSync } from "node:fs";
    import { exec } from "node:child_process";
    function route(req,res) { execFile("printf", ["%s",req.query.text]); }

    _pw_fixture_app.get("/fixture", route);

  want: []
  covers:
  - lycaon.javascript.command-injection
