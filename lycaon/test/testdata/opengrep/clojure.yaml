language: clojure
comment:
- ;
limits: Registered Ring/Jetty handlers with one or three parameters, including named functions, static namespace aliases, lexical aliases,
  and parameter middleware. Arbitrary callback producers and other frameworks are outside this contract. Shell rules model explicit POSIX
  interpreter command text; SQL rules model next.jdbc query vectors. HTTP destination rules select URL arguments to clj-http methods and
  request-map :url fields; decomposed request URLs and arbitrary validators are outside the model. File serving models Ring file-response
  and its root option; general filesystem APIs and custom path validators are outside the model.
cases:
- name: eval-reader-context-only
  file: sample.clj
  source: "(defn run [code] (eval (read-string code)))\n"
  want: []
  covers: []
  coverage:
  - lycaon.coverage.clojure
- name: eval-reader-safe
  file: sample.clj
  source: "(defn read-data [code] (clojure.edn/read-string code))\n"
  want: []
  covers: []
  coverage:
  - lycaon.coverage.clojure
- name: reader-eval-enabled-context-only
  file: sample.clj
  source: "(binding [*read-eval* true] (read-string data))\n"
  want: []
  covers: []
  coverage:
  - lycaon.coverage.clojure
- name: reader-eval-enabled-safe
  file: sample.clj
  source: "(binding [*read-eval* false] (read-string data))\n"
  want: []
  covers: []
  coverage:
  - lycaon.coverage.clojure
- name: unregistered-map-is-not-http-input
  file: app.clj
  source: "(ns app (:require [ring.middleware.params]))\n(defn handler [request] (let [code (get (:query-params request) \"code\")] (clojure.core/load-string
    code)))\n"
  want: []
  covers: &id001
  - lycaon.clojure.ring-code-injection
  coverage: &id002
  - lycaon.coverage.clojure
- name: ring-code-injection-constant
  file: app.clj
  source: "(ns app (:require [ring.middleware.params]))\n(defn handler [request] (let [code (get (:query-params request) \"code\")] (clojure.core/load-string
    \"(+ 1 2)\")))\n"
  want: []
  covers:
  - lycaon.clojure.ring-code-injection
  coverage:
  - lycaon.coverage.clojure
- name: ring-code-injection-safe-api
  file: app.clj
  source: "(ns app (:require [ring.middleware.params]))\n(defn handler [request] (let [code (get (:query-params request) \"code\")] (clojure.edn/read-string
    code)))\n"
  want: []
  covers: *id001
  coverage: *id002
- name: registered-params-flow
  file: app.clj
  source: |
    (ns app (:require [ring.adapter.jetty] [ring.middleware.params]))
    (ring.adapter.jetty/run-jetty
      (ring.middleware.params/wrap-params
        (fn [request]
          (let [code (get (:query-params request) "code")]
            (clojure.core/load-string code))))
      {:port 8080})
  want:
  - lycaon.clojure.ring-code-injection
  covers:
  - lycaon.clojure.ring-code-injection
  coverage:
  - lycaon.coverage.clojure
