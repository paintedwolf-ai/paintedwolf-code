language: scala
comment:
- //
limits: Intra-file patterns and data flow; wrappers and cross-file flows require additional analysis.
cases:
- name: sql-injection-vulnerable
  file: sample.scala
  source: |
    object Audit { def handle(req: HttpServletRequest) = { stmt.executeQuery("SELECT * FROM users WHERE name = " + req.getParameter("input")) } }
  want:
  - lycaon.scala.sql-injection
  covers: []
- name: sql-injection-safe
  file: sample.scala
  source: |
    object Audit { def handle(req: HttpServletRequest) = { stmt.executeQuery("SELECT 1") } }
  want: []
  covers:
  - lycaon.scala.sql-injection
- name: command-injection-vulnerable
  file: sample.scala
  source: |
    object Audit { def handle(req: HttpServletRequest) = { Runtime.getRuntime().exec(req.getParameter("input")) } }
  want:
  - lycaon.scala.command-injection
  covers: []
- name: command-injection-safe
  file: sample.scala
  source: |
    object Audit { def handle(req: HttpServletRequest) = { Runtime.getRuntime().exec("echo ready") } }
  want: []
  covers:
  - lycaon.scala.command-injection
- name: path-traversal-vulnerable
  file: sample.scala
  source: |
    object Audit { def handle(req: HttpServletRequest) = { FileInputStream(req.getParameter("input")) } }
  want:
  - lycaon.scala.path-traversal
  covers: []
- name: path-traversal-safe
  file: sample.scala
  source: |
    object Audit { def handle(req: HttpServletRequest) = { FileInputStream("config.json") } }
  want: []
  covers:
  - lycaon.scala.path-traversal
- name: open-redirect-vulnerable
  file: sample.scala
  source: |
    object Audit { def handle(req: HttpServletRequest) = { res.sendRedirect(req.getParameter("input")) } }
  want:
  - lycaon.scala.open-redirect
  covers: []
- name: open-redirect-safe
  file: sample.scala
  source: |
    object Audit { def handle(req: HttpServletRequest) = { res.sendRedirect("/home") } }
  want: []
  covers:
  - lycaon.scala.open-redirect
