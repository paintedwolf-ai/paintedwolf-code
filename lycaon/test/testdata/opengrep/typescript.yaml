language: typescript
comment:
- //
limits: Selected typed Next.js App Router handlers expose request URLs, nextUrl search parameters, awaited bodies, headers, cookies, and awaited context params, including typed destructuring. Typed NextApiRequest Pages Router handlers and imported Fastify plugin types are modeled with lexical type provenance. Local type declarations and generic parameters do not inherit imported request identities. Server actions, cross-file handlers, and params reads without await remain unmodeled.
cases:
- name: command-injection-vulnerable
  file: sample.ts
  source: |
    import _pw_fixture_express from "express";
    const _pw_fixture_app = _pw_fixture_express();
    import fs from "node:fs";
    import { readFileSync } from "node:fs";
    import { exec } from "node:child_process";
    function route(req: any,res: any) { exec(req.query.command); }

    _pw_fixture_app.get("/fixture", route);
  want:
  - lycaon.javascript.command-injection
  covers: []
- name: command-injection-safe
  file: sample.ts
  source: |
    import _pw_fixture_express from "express";
    const _pw_fixture_app = _pw_fixture_express();
    import fs from "node:fs";
    import { readFileSync } from "node:fs";
    import { exec } from "node:child_process";
    function route(req: any,res: any) { execFile("printf", ["%s",req.query.text]); }

    _pw_fixture_app.get("/fixture", route);
  want: []
  covers:
  - lycaon.javascript.command-injection
