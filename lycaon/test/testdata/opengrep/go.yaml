language: go
comment:
- //
limits: Intra-file patterns and data flow; wrappers and cross-file flows require additional analysis.
cases:
- name: shell-injection-vulnerable
  file: sample.go
  source: 'package sample

    import ("net/http"; "os"; "os/exec"; "database/sql"; "html/template")

    func f(r *http.Request, db *sql.DB) { exec.Command("sh","-c",r.FormValue("cmd")) }

    '
  want:
  - lycaon.go.shell-injection
  covers: []
- name: shell-injection-safe
  file: sample.go
  source: 'package sample

    import ("net/http"; "os"; "os/exec"; "database/sql"; "html/template")

    func f(r *http.Request, db *sql.DB) { exec.Command("printf","%s",r.FormValue("text")) }

    '
  want: []
  covers:
  - lycaon.go.shell-injection
- name: sql-injection-vulnerable
  file: sample.go
  source: 'package sample

    import ("net/http"; "os"; "os/exec"; "database/sql"; "html/template")

    func f(r *http.Request, db *sql.DB) { db.Query("SELECT * FROM users WHERE name = " + r.FormValue("name")) }

    '
  want:
  - lycaon.go.sql-injection
  covers: []
- name: sql-injection-safe
  file: sample.go
  source: 'package sample

    import ("net/http"; "os"; "os/exec"; "database/sql"; "html/template")

    func f(r *http.Request, db *sql.DB) { db.Query("SELECT * FROM users WHERE name = ?", r.FormValue("name")) }

    '
  want: []
  covers:
  - lycaon.go.sql-injection
