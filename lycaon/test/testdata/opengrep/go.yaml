- name: review-peer-pinned-after-literal
  file: sample.go
  source: |
    package sample
    import ("crypto/tls"; "crypto/x509")
    func f(pinned func([][]byte, [][]*x509.Certificate) error, verify func(tls.ConnectionState) error, enabled bool) *tls.Config {
    cfg := &tls.Config{InsecureSkipVerify: true}
    cfg.VerifyPeerCertificate = pinned
    return cfg
    }
  want: []
  covers: []
- name: review-connection-pinned-after-literal
  file: sample.go
  source: |
    package sample
    import ("crypto/tls"; "crypto/x509")
