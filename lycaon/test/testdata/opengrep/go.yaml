- name: review-conditional-reenable
  file: sample.go
  source: |
    package sample
    import ("crypto/tls"; "crypto/x509")
    func f(pinned func([][]byte, [][]*x509.Certificate) error, verify func(tls.ConnectionState) error, enabled bool) *tls.Config {
    cfg := &tls.Config{InsecureSkipVerify: true}
    if enabled { cfg.InsecureSkipVerify = false }
    return cfg
    }
  want:
  - lycaon.go.tls-verification-disabled
  covers: []
- name: review-distinct-config-reenable
  file: sample.go
  source: |
    package sample
    import ("crypto/tls"; "crypto/x509")
    func f(pinned func([][]byte, [][]*x509.Certificate) error, verify func(tls.ConnectionState) error, enabled bool) *tls.Config {
    cfg := &tls.Config{InsecureSkipVerify: true}
    other := &tls.Config{}
    other.InsecureSkipVerify = false
    return cfg
    }
  want:
  - lycaon.go.tls-verification-disabled
  covers: []
