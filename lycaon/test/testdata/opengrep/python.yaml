language: python
comment:
- '#'
limits: Selected Flask and Django request reads and typed FastAPI or Starlette request objects are modeled. FastAPI and APIRouter routes with import-proven factories also model primitive string inputs, supported Query/Path/Header/Cookie/Body/Form defaults, and Annotated forms. Python lexical imports and rebinding distinguish framework factories and converters from local names. Pydantic model attributes, Depends or Security providers, custom dependency defaults, typed request.get converters, urls.py registration, and cross-file wrappers remain unmodeled.
cases:
- name: command-injection-vulnerable
  file: sample.py
  source: 'from flask import request

    import os, sqlite3, pickle, yaml, subprocess, requests

    os.system(request.args.get("cmd"))

    '
  want:
  - lycaon.python.command-injection
  covers: []
- name: command-injection-safe
  file: sample.py
  source: 'from flask import request

    import os, sqlite3, pickle, yaml, subprocess, requests

    subprocess.run(["printf", "%s", request.args.get("text")], shell=False)

    '
  want: []
  covers:
  - lycaon.python.command-injection
