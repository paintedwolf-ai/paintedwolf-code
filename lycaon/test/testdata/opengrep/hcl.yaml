language: hcl
comment:
- '#'
limits: Explicit resource configuration with known protocol and port values. Dynamic resource values and deployment reachability require additional analysis.
cases:
- name: public-admin-ingress-vulnerable
  file: sample.tf
  source: |
    resource "aws_security_group" "example" {
    ingress {
     from_port = 22
     to_port = 22
     protocol = "tcp"
     ipv6_cidr_blocks = ["::/0"]
    }
    }
  want:
  - lycaon.terraform.public-admin-ingress
  covers: []
- name: public-admin-ingress-safe
  file: sample.tf
  source: |
    resource "aws_security_group" "example" {
    ingress {
     from_port = 22
     to_port = 22
     protocol = "tcp"
     cidr_blocks = ["10.0.0.0/8"]
    }
    }
  want: []
  covers:
  - lycaon.terraform.public-admin-ingress
- name: public-ingress-rule-vulnerable
  file: sample.tf
  source: |
    resource "aws_vpc_security_group_ingress_rule" "example" {
    security_group_id = "sg-example"
    from_port = 22
    to_port = 22
    ip_protocol = "tcp"
    cidr_ipv6 = "::/0"
    }
  want:
  - lycaon.terraform.public-ingress-rule
  covers: []
- name: public-ingress-rule-safe
  file: sample.tf
  source: |
    resource "aws_vpc_security_group_ingress_rule" "example" {
    security_group_id = "sg-example"
    from_port = 22
    to_port = 22
    ip_protocol = "tcp"
    cidr_ipv6 = "fd00::/8"
    }
  want: []
  covers:
  - lycaon.terraform.public-ingress-rule
- name: iam-admin-policy-vulnerable
  file: sample.tf
  source: |
    data "aws_iam_policy_document" "p" {
    statement {
    effect = "Allow"
    actions = ["*"]
    resources = ["*"]
    }
    }
  want:
  - lycaon.terraform.iam-admin-policy
  covers: []
- name: iam-admin-policy-safe
  file: sample.tf
  source: |
    data "aws_iam_policy_document" "p" {
    statement {
    effect = "Deny"
    actions = ["*"]
    resources = ["*"]
    }
    }
  want: []
  covers:
  - lycaon.terraform.iam-admin-policy
- name: rds-encryption-disabled-vulnerable
