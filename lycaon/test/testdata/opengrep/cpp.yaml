language: cpp
comment:
- //
limits: Allocation lifetime, repeated-delete, and allocation/deallocation-pair checks are not enabled for C++ because references can replace a pointer without a visible address escape. Remaining patterns are intra-file; wrappers and cross-file flows require additional analysis.
cases:
- name: raptor-double-free-vulnerable-context-only
  file: sample.cpp
  source: 'void f(void *p) { free(p); free(p); }

    '
  want: []
  covers: []
- name: raptor-double-free-safe
  file: sample.cpp
  source: 'void f(void *p) { free(p); p=0; }

    '
  want: []
  covers: []
- name: use-after-free-vulnerable-context-only
  file: sample.cpp
  source: 'int f(int *p) { free(p); return *p; }

    '
  want: []
  covers: []
- name: use-after-free-safe
  file: sample.cpp
  source: 'int f(int *p) { int n=*p; free(p); return n; }

    '
  want: []
  covers: []
- name: raptor-ret-stack-address-vulnerable
