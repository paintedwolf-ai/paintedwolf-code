- name: precision-safe-conversion
  file: sample.php
  source: '<?php $n = intval($_GET["limit"]); $db->query("SELECT * FROM users LIMIT " . $n);

    '
  want: []
  covers: []
- name: review-escape-undone
  file: sample.php
  source: |
    <?php $arg = trim(escapeshellarg($_GET['dir']), "'"); system("ls " . $arg);
  want:
  - lycaon.php.command-injection
  covers: []
- name: review-escape-used-as-argument
  file: sample.php
  source: |
    <?php system("ls " . escapeshellarg($_GET['dir']));
  want: []
  covers: []
- name: review-escape-benign-trim
  file: sample.php
  source: |
    <?php system("ls " . trim(escapeshellarg($_GET['dir'])));
  want: []
  covers: []
- name: review-escape-before-transform
  file: sample.php
  source: |
    <?php system("ls " . escapeshellarg(trim($_GET['dir'], "'")));
  want: []
  covers: []
- name: review-escape-benign-replacement
  file: sample.php
  source: |
    <?php system("ls " . str_replace("x", "y", escapeshellarg($_GET['dir'])));
  want: []
  covers: []
