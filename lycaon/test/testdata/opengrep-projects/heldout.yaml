    sink locations: two routed query-parameter eval calls, unsigned POST-supplied pickle loading after base64 decoding, and
    authenticated user-update SQL interpolation. The numeric URL constraint does not constrain the POST user_id used in SQL,
    and indexing the raw query result forces execution before form validation. This adjudicates only these observed results;
    whole-project review and recall remain pending. No application or exploit was executed, and rules were not tuned on this
    project.'
