      class ServerMode(db.Model):
        __tablename__ = 'servermode'
        id = db.Column(db.Integer, primary_key=True)
        hardened = db.Column(db.Boolean, default=False)

        @classmethod
        def set_mode(cls, mode):
          obj = ServerMode.query.one()
          if mode == 'easy':
            obj.hardened = False
          else:
            obj.hardened = True

          db.session.add(obj)
          db.session.commit()

