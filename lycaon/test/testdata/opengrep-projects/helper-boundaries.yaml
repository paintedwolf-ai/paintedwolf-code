  - name: helper-go-query-service
    language: "go"
    framework: "net/http"
    review_status: "complete"
    adjudication: "A helper concatenates its supplied name into SQL; request input reaches that helper. A separate parameterized query is safe, and a direct concatenated query must survive both modes."
    families:
      - lycaon.go.sql-injection
    files:
      app.go: |
        package reports
        import "database/sql"
        import "net/http"
        func lookup(db *sql.DB, name string) {
            db.Query("SELECT id FROM reports WHERE name = '" + name + "'")
        }
        func Handle(w http.ResponseWriter, r *http.Request, db *sql.DB) {
            lookup(db, r.FormValue("name"))
            db.Query("SELECT id FROM reports WHERE name = ?", r.FormValue("safe"))
            db.Query("SELECT id FROM reports WHERE name = '" + r.FormValue("direct") + "'")
        }
    findings:
      - file: app.go
        rule: lycaon.go.sql-injection
        line: 5
      - file: app.go
        rule: lycaon.go.sql-injection
        line: 10
  - name: helper-go-fixed-query
    language: "go"
    framework: "net/http"
    review_status: "complete"
    adjudication: "A helper ignores its request-derived argument and returns a fixed SQL statement. A separate parameterized query safely binds the request value."
    families:
      - lycaon.go.sql-injection
    files:
      app.go: |
        package reports
        import "database/sql"
        import "net/http"
        func reportQuery(unused string) string { return "SELECT id FROM reports" }
        func Handle(w http.ResponseWriter, r *http.Request, db *sql.DB) {
            db.Query(reportQuery(r.FormValue("ignored")))
            db.Query("SELECT id FROM reports WHERE name = ?", r.FormValue("name"))
        }
    findings: []
  - name: helper-java-command-service
    language: "java"
    framework: "servlet"
    review_status: "complete"
    adjudication: "The servlet request controls a helper executable string. The static conversion in the direct control preserves attacker control of the executable; constant service input is safe."
    families:
      - lycaon.java.command-injection
    files:
      ReportController.java: |
        import jakarta.servlet.http.HttpServletRequest;
        class ReportController {
          static void runReport(String command) throws Exception {
            Runtime.getRuntime().exec(command);
          }
          void handle(HttpServletRequest req) throws Exception {
            runReport(req.getParameter("command"));
            runReport("date");
            Runtime.getRuntime().exec(java.util.Objects.toString(req.getParameter("direct")));
          }
        }
