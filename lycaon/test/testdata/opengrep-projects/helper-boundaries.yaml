  - name: helper-javascript-mutual-recursion
    language: "javascript"
    framework: "express"
    review_status: "complete"
    adjudication: "Mutually recursive dispatch executes request command text after a finite countdown. A direct sink must remain visible irrespective of recursive summary support."
    families:
      - lycaon.javascript.command-injection
    files:
      app.js: |
        import express from 'express';
        import { exec } from 'node:child_process';
        const app = express();
        function dispatch(command, count) { return execute(command, count - 1); }
        function execute(command, count) {
          if (count > 0) return dispatch(command, count);
          exec(command);
        }
        app.get('/reports/run', (req, res) => {
          dispatch(req.query.command, 2);
          exec(req.query.direct);
          res.sendStatus(202);
        });
    findings:
      - file: app.js
        rule: lycaon.javascript.command-injection
        line: 7
      - file: app.js
        rule: lycaon.javascript.command-injection
        line: 11
