  - name: helper-python-mutual-recursion
    language: "python"
    framework: "flask"
    review_status: "complete"
    adjudication: "Two mutually recursive helpers eventually execute their first argument. A bounded countdown guarantees termination. A direct sink is a control for lost local findings."
    families:
      - lycaon.python.command-injection
    files:
      app.py: |
        import flask
        import os
        def dispatch(command, remaining):
            if remaining <= 0:
                return execute(command, remaining)
            return execute(command, remaining - 1)
        def execute(command, remaining):
            if remaining > 0:
                return dispatch(command, remaining - 1)
            return os.system(command)
        def run():
            dispatch(flask.request.args.get('command'), 2)
            os.system(flask.request.args.get('direct'))
    findings:
      - file: app.py
        rule: lycaon.python.command-injection
        line: 10
      - file: app.py
        rule: lycaon.python.command-injection
        line: 13
  - name: helper-python-inherited-source
    language: "python"
    framework: "flask"
    review_status: "complete"
    adjudication: "The inherited constructor stores request text; the subclass executes that field. The separate direct sink must remain visible even when inheritance is unsupported."
    families:
      - lycaon.python.command-injection
    files:
      app.py: |
        import flask
        import os
        class Report:
            def __init__(self, command):
                self.command = command
        class ShellReport(Report):
            def execute(self):
                return os.system(self.command)
        def run():
            report = ShellReport(flask.request.args.get('command'))
            report.execute()
            os.system(flask.request.args.get('direct'))
    findings:
      - file: app.py
        rule: lycaon.python.command-injection
        line: 8
      - file: app.py
        rule: lycaon.python.command-injection
        line: 12
  - name: helper-python-fixed-callback
    language: "python"
    framework: "flask"
    review_status: "complete"
    adjudication: "The selected callback ignores its argument and returns a constant. Both the direct constant helper and callback-mediated result remain safe despite request input."
    families:
      - lycaon.python.command-injection
    files:
      app.py: |
        import flask
        import os
        def fixed_command(unused):
            return 'date'
        def apply_command(callback, value):
            return callback(value)
        def run():
            value = flask.request.args.get('command')
            os.system(fixed_command(value))
            os.system(apply_command(fixed_command, value))
    findings: []
  - name: helper-javascript-command-service
