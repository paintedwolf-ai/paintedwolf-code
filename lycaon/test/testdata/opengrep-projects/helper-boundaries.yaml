  - name: helper-javascript-selected-callback
    language: "javascript"
    framework: "express"
    review_status: "complete"
    adjudication: "Request-controlled selection may choose a callback that returns request command text, so the first exec is vulnerable. A statically selected constant callback keeps the second exec safe."
    families:
      - lycaon.javascript.command-injection
    files:
      app.js: |
        import express from 'express';
        import { exec } from 'node:child_process';
        const app = express();
        function passthrough(command) { return command; }
        function fixedCommand(unused) { return 'date'; }
        function applyCommand(callback, value) { return callback(value); }
        app.get('/reports/run', (req, res) => {
          const callback = req.query.mode === 'custom' ? passthrough : fixedCommand;
          exec(applyCommand(callback, req.query.command));
          exec(applyCommand(fixedCommand, req.query.command));
          res.sendStatus(202);
        });
    findings:
      - file: app.js
        rule: lycaon.javascript.command-injection
        line: 9
  - name: helper-typescript-service-method
    language: "typescript"
    framework: "express"
    review_status: "complete"
    adjudication: "A typed service method executes the supplied shell text. The route supplies request input; another invocation supplies a constant. The direct sink guards against mode regressions."
    families:
      - lycaon.javascript.command-injection
    files:
      app.ts: |
        import express, { Request, Response } from 'express';
        import { exec } from 'node:child_process';
        const app = express();
        class ReportService {
          run(command: string): void { exec(command); }
        }
        app.get('/reports/run', (req: Request, res: Response) => {
          const service = new ReportService();
          service.run(String(req.query.command));
          service.run('date');
          exec(String(req.query.direct));
          res.sendStatus(202);
        });
    findings:
