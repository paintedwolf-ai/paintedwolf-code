partition: development
projects:
  - name: helper-python-command-service
    language: "python"
    framework: "flask"
    review_status: "complete"
    adjudication: "Request text reaches the shell through a local service. The constant service invocation is safe; the direct request-to-shell finding must survive either mode."
    families:
      - lycaon.python.command-injection
    files:
      app.py: |
        import flask
        import os
        app = flask.Flask(__name__)
        def run_report(command):
            return os.system(command)
        @app.get('/reports/run')
        def run():
            run_report(flask.request.args.get('command'))
            run_report('date')
            os.system(flask.request.args.get('direct'))
            return 'done'
    findings:
      - file: app.py
        rule: lycaon.python.command-injection
        line: 5
      - file: app.py
        rule: lycaon.python.command-injection
        line: 10
  - name: helper-python-source-return
    language: "python"
    framework: "flask"
    review_status: "complete"
    adjudication: "A helper reads the live Flask request and returns its command. A second helper returns a constant despite accepting request text; only the first shell call is vulnerable."
    families:
      - lycaon.python.command-injection
    files:
      app.py: |
        import flask
        import os
        app = flask.Flask(__name__)
        def requested_command():
            return flask.request.args.get('command')
        def default_command(unused):
            return 'date'
        @app.get('/reports/run')
        def run():
            os.system(requested_command())
            os.system(default_command(flask.request.args.get('ignored')))
            return 'done'
    findings:
      - file: app.py
        rule: lycaon.python.command-injection
        line: 10
  - name: helper-python-selected-argument
    language: "python"
    framework: "flask"
    review_status: "complete"
    adjudication: "The helper returns only its second argument. Request text used only as an unused audit label cannot control the first command; the second command is controlled by the request."
