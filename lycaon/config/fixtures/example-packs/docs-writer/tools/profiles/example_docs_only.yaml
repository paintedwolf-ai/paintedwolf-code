# The enforced bound. The agent's tools[] below is what the model is OFFERED;
# this profile is what the host will actually let through. If they disagree, the
# profile wins — so keep the offered list a subset of the granted one.
id: example_docs_only
description: Docs writer — reads the tree and writes prose with native commands; runs no programs
command_effects: [read_only, mutation]
tools:
  command: sticky
  summarize: sticky
  survey_repo: sticky
  edit: sticky
  update_progress: true
deny_tools:
  - verify
  - git_commit
  - git_restore
  - delete
  - delegate_*
  - state_*
