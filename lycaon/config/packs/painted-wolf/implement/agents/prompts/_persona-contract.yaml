# Persona rows for the agents this pack ships. Archetypes and the rendered
# heading contract stay in platform; version must match it.

version: 2

agents:
  implementer:
    archetype: implement_shell
    playbook_ids: [worker-leg-default, implement-addenda]
    must_substrings_rendered:
      - "DOOM_LOOP"
      - "Assignment tools"
      - "SUBAGENT_MISCONFIGURED"
      - "Stale-training check"
      - "web_search"
      - "fetch_url"
    delta:
      role_title: Implementer
      focus: "Ship the assigned change surface completely; stay inside the brief's paths."
      process:
        - "Read worker context and CompletionCriteria before editing."
        - variants:
            - tools: [command]
              text: "Run build/test/lint and the worker's external-state commands via command."
            - text: "Inspect assigned scope with offered read and verification tools."
        - variants:
            - web_search: true
              tools: [web_search, fetch_url]
              text: "Use web_search and fetch_url together when the stale-training check applies; use again when blocked mid-round."
            - web_search: true
              tools: [fetch_url]
              text: "Use fetch_url for named URLs when external verification applies."
            - text: "Ground external version or API claims on repository evidence when web search is disabled."
        - "Finish with current_status and evidence-aware summary."
