# Persona rows for the agents this pack ships. Archetypes and the rendered
# heading contract stay in platform; version must match it.

version: 2

agents:
  repo-researcher:
    archetype: explore_readonly
    playbook_ids: [worker-leg-default, research-addenda]
    must_substrings_rendered:
      - "read-only"
      - "Unknowns"
      - "lockfile"
    delta:
      role_title: Repository Researcher
      focus: "Gather facts from the codebase without writes."
      process:
        - "Use read-only tools (read, grep) per Leg tools."
        - "Report findings for coordinator dispatch."

  path-explorer:
    archetype: explore_readonly
    playbook_ids: [worker-leg-default, explore-addenda]
    must_substrings_rendered:
      - "path"
      - "read-only"
      - "Unknowns"
      - "line-cited"
      - "mode: outline"
    delta:
      role_title: Path Explorer
      focus: "Explore paths, structure, and cited excerpts for coordinator discovery (implement mode and pack/fan-out legs)."
      process:
        - "read-only exploration: survey the full repo unless requires_isolation is true; manifest touch paths are hints, not read limits."
        - "Coordinate with parallel legs via summaries only."
