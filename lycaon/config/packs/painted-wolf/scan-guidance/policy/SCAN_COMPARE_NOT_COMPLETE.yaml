spec_version: "1.0"
id: SCAN_COMPARE_NOT_COMPLETE
kind: schema
on: tool.rejected
selector:
  tools:
    - scan_compare
requires_facts: [paintedwolf.rejection_code, paintedwolf.scan_new_status, paintedwolf.scan_old_status]
when: paintedwolf.rejection_code == "SCAN_COMPARE_NOT_COMPLETE"
effect: block
category: recoverable
emit: guard:scan_compare
message: Scan not complete — cannot compare yet
what: The baseline scan is {{ paintedwolf.scan_old_status }} and the new scan is {{ paintedwolf.scan_new_status }}; both must complete successfully.
cause: Compare reads authoritative finding sets written only when a scan completes successfully.
why: Incomplete rows have no stable finding buckets to diff.
fix: Wait or poll only for scans that are still active. A failed or canceled scan needs its failure resolved and an intentional new assessment; polling cannot turn it into success. Preserve assigned comparison IDs and report any replacement needed.
instead: Branch on Code; compare only complete scans
scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      profile: coordinator
      tool: scan_compare
