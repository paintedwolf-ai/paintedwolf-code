spec_version: "1.0"
id: SCAN_INVENTORY_STALE
kind: schema
on: tool.rejected
selector:
  tools: [scan_query]
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SCAN_INVENTORY_STALE"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:scan_drilldown
message: Scan inventory changed.
what: The scan inventory changed between pages.
cause: The requested inventory revision is no longer current.
why: Continuing with the old offset could omit groups.
fix: Restart paging at offset zero using the current inventory revision.
instead: Preserve prior observations but recheck group membership against the current inventory.
x-paintedwolf-scenarios:
  - id: stale
    vars: {}
