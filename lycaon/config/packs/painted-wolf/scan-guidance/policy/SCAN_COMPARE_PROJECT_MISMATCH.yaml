spec_version: "1.0"
id: SCAN_COMPARE_PROJECT_MISMATCH
kind: schema
on: tool.rejected
selector:
  tools:
    - scan_compare
requires_facts: [paintedwolf.conflict, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SCAN_COMPARE_PROJECT_MISMATCH"
effect: block
category: recoverable
emit: guard:scan_compare
message: Scan ids must belong to the active project
what: old_scan_id or new_scan_id is not keyed to the session project root.
cause: Scan tools are host-bound — ids from another checkout or project cannot be compared here.
why: Compare enforces same canonical_path as the active session project.
fix: Use scans belonging to the active project and the intended comparison. Preserve assigned IDs and report the mismatch for bound work; choosing another project or arbitrary new scans would change the task.
instead: Branch on Code; use scan ids from the active project only
scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      profile: coordinator
      tool: scan_compare
