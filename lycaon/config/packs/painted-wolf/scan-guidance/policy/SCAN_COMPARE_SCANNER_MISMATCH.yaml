oar: '1.0'
id: SCAN_COMPARE_SCANNER_MISMATCH
kind: schema
anchor: tool.rejected
selector:
  tool:
  - scan_compare
requires:
  facts:
  - paintedwolf.rejection_code
  profiles:
  - tool
when: paintedwolf.rejection_code == "SCAN_COMPARE_SCANNER_MISMATCH"
effect: block
copy:
  what: The two scans were produced by different scanners.
  cause: Scanner-specific findings and fingerprints do not share one comparison domain.
  why: Treating different engines as revisions would fabricate regressions and resolutions.
  fix: Compare two complete compatible scans from the same scanner. Board assessment summaries may combine
    engines for overview, but they do not make cross-scanner finding identities comparable.
  instead: Branch on Code; select a same-scanner baseline
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:scan_compare
x-paintedwolf-message: Scanner mismatch — choose a same-scanner baseline
x-paintedwolf-scenarios:
- id: default
  vars:
    detail: incompatible scans
    path: src/main.go
    profile: coordinator
    tool: scan_compare
  expect_contains:
  - 'Rejected:'
  - 'Code: SCAN_COMPARE_SCANNER_MISMATCH'
