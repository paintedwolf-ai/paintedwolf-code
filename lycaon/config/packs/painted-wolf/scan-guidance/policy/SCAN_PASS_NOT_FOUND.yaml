spec_version: "1.0"
id: SCAN_PASS_NOT_FOUND
kind: schema
on: tool.rejected
selector:
  tools:
    - scan_summary
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SCAN_PASS_NOT_FOUND"
effect: block
category: recoverable
emit: guard:scan_drilldown
message: Full pass id not found
what: pass_id does not match a full pass the host recorded.
cause: The supplied id is missing, truncated, or was not returned by scan_pack.
why: A full pass is read by the pass_id scan_pack returned when it asked for the pass.
fix: 'Put the exact pass_id from the pack receipt in pass_id, or pass that receipt''s scan_ids instead, then retry.'
instead: 'Branch on Code SCAN_PASS_NOT_FOUND; reuse the pack receipt''s pass_id unchanged.'
scenarios:
  - id: default
    vars:
      profile: coordinator
      pass_id: deadbeef
      tool: scan_summary
