spec_version: "1.0"
id: SCAN_PACK_NO_HOST_ENGINE
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.categories, paintedwolf.engines, paintedwolf.project_dir, paintedwolf.rejection_code, paintedwolf.scan_no_engines, paintedwolf.valid_categories]
when: paintedwolf.rejection_code == "SCAN_PACK_NO_HOST_ENGINE"
effect: block
category: recoverable
emit: guard:scan_pack
message: scan_pack categories match no host scanner
what: scan_pack categories {{ paintedwolf.categories }} match no host scanner at {{ paintedwolf.project_dir }}.
cause: '{% if paintedwolf.scan_no_engines %}No host scanners are registered.{% else %}Registered engines {{ paintedwolf.engines }} do not cover the requested categories. Available categories: {{ paintedwolf.valid_categories }}.{% endif %}'
why: Unavailable scanner coverage cannot establish that the project is free of findings.
fix: '{% if paintedwolf.scan_no_engines %}Report missing host scanner setup; all or default categories cannot run without an engine.{% else %}Choose a supported category only if it meets the requested assessment. Report any required category that remains unavailable.{% endif %}'
instead: Preserve the requested assessment coverage and resolve missing host support
scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      session_role: coordinator
      tool: read
