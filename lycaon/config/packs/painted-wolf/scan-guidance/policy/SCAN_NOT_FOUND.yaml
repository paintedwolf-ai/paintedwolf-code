spec_version: "1.0"
id: SCAN_NOT_FOUND
kind: schema
on: tool.rejected
selector:
  tools:
    - scan_summary
    - scan_query
requires_facts: [paintedwolf.next_steps, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SCAN_NOT_FOUND"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:scan_drilldown
message: Scan id not found for this project
what: scan_id does not match a stored scan row for the active project root.
cause: The supplied id is missing, truncated, stale, or not from the host scan store.
why: Drill-down reads persisted ingest keyed by the full per-engine scan UUID.
fix: 'For bound work, report the missing assigned id; do not substitute ambient scans. {{ paintedwolf.next_steps }}'
instead: 'Preserve bound scan_ids; resolve unbound ids before drill-down.'
x-paintedwolf-scenarios:
  - id: default
    vars:
      profile: coordinator
      scan_id: deadbeef
      tool: scan_query
