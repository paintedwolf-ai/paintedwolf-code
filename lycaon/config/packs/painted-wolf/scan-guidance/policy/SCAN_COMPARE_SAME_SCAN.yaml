spec_version: "1.0"
id: SCAN_COMPARE_SAME_SCAN
kind: schema
on: tool.rejected
selector:
  tools:
    - scan_compare
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SCAN_COMPARE_SAME_SCAN"
effect: block
category: recoverable
emit: guard:scan_compare
message: old_scan_id and new_scan_id must differ
what: scan_compare received the same id for baseline and new scan.
cause: A verify-fix loop needs a pre-fix baseline and a distinct post-fix scan.
why: Comparing a scan to itself yields empty diff buckets and hides regressions.
fix: Pass the pre-fix per_scan id as old_scan_id and the post-fix id as new_scan_id.
instead: Branch on Code; supply two different complete scan ids
scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      profile: coordinator
      tool: scan_compare
