oar: '1.0'
id: SCAN_COMPARE_DEFINITION_MISMATCH
kind: schema
anchor: tool.rejected
selector:
  tool:
    - scan_compare
requires:
  facts: [paintedwolf.rejection_code]
  profiles:
    - tool
when: paintedwolf.rejection_code == "SCAN_COMPARE_DEFINITION_MISMATCH"
effect: block
copy:
  what: The two scans have different execution fingerprints.
  cause: Their engine artifact, rules, exclusions, parser, mapper, or runtime definition changed.
  why: A changed scanner definition is not evidence that source findings appeared or disappeared.
  fix: Select scans with the same execution fingerprint, or establish a new baseline under the current definition.
  instead: Branch on Code; do not interpret incompatible scanner definitions as a source diff
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:scan_compare
x-paintedwolf-message: Scanner definition changed — comparison is incompatible
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: incompatible scans
      path: src/main.go
      profile: coordinator
      tool: scan_compare
    expect_contains:
      - 'Rejected:'
      - 'Code: SCAN_COMPARE_DEFINITION_MISMATCH'
