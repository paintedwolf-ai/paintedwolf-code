spec_version: "1.0"
id: REQUEST_DECISION_ARTIFACT_NOT_FOUND
kind: schema
on: tool.rejected
selector:
  tools:
    - request_decision
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "REQUEST_DECISION_ARTIFACT_NOT_FOUND"
effect: block
category: recoverable
emit: guard:request_decision
message: artifact was not found
what: request_decision referenced an unavailable artifact.
cause: The host could not resolve a usable artifact for this decision. A lookup failure does not prove the artifact never existed.
why: The coordinator cannot review a missing artifact.
fix: Check the artifact ID from an actual result in this session tree. Preserve the review requirement while the artifact or its storage is unavailable; do not substitute unrelated evidence.
instead: Branch on Code REQUEST_DECISION_ARTIFACT_NOT_FOUND; pass an in-tree artifact UUID
scenarios:
  - id: default
    vars:
      detail: stub
      path: src/main.go
      profile: worker
      tool: request_decision
