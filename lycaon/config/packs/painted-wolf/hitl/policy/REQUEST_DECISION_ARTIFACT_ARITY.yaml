spec_version: "1.0"
id: REQUEST_DECISION_ARTIFACT_ARITY
kind: schema
on: tool.rejected
selector:
  tools:
    - request_decision
requires_facts: [paintedwolf.count, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "REQUEST_DECISION_ARTIFACT_ARITY"
effect: block
category: recoverable
emit: guard:request_decision
message: compare requires 2 to 4 artifacts
what: request_decision compare mode received {{ paintedwolf.count }} artifacts; it requires 2–4 distinct artifacts.
cause: artifact_ids has an invalid number of entries.
why: The compare card labels each submitted artifact.
fix: Pass 2–4 distinct observed artifact UUIDs for the intended comparison, or artifact_id for a single review. Do not drop required candidates silently.
instead: Branch on Code REQUEST_DECISION_ARTIFACT_ARITY; pass a valid artifact count
scenarios:
  - id: default
    vars:
      detail: stub
      path: src/main.go
      profile: worker
      tool: request_decision
