spec_version: "1.0"
id: ASK_USER_SECRET_METADATA_FORBIDDEN
kind: schema
on: tool.rejected
selector:
  tools: [ask_user]
requires_facts: [paintedwolf.rejection_code, paintedwolf.response_type]
when: paintedwolf.rejection_code == "ASK_USER_SECRET_METADATA_FORBIDDEN"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:ask_user
message: "Secret metadata cannot accompany response_type {{ paintedwolf.response_type }}."
what: "Secret metadata cannot accompany response_type {{ paintedwolf.response_type }}."
cause: "The requested response channel would not store the answer as protected input."
why: Preserve the response channel and protected-input lifecycle before creating a user question.
fix: "If a credential is needed, use response_type secret with its required metadata and no artifacts. Otherwise remove the unrelated secret metadata; never solicit a credential through a text or choice response."
instead: Correct the structured request without downgrading protected input
x-paintedwolf-scenarios:
  - id: default
    vars: {"response_type": "text", "session_role": "coordinator", "tool": "ask_user"}
