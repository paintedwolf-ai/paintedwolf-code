spec_version: "1.0"
id: ASK_USER_ARTIFACT_UNSUPPORTED
kind: schema
on: tool.rejected
selector:
  tools:
    - ask_user
requires_facts: [paintedwolf.ask_artifact_formats, paintedwolf.ask_artifact_mime, paintedwolf.ref, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "ASK_USER_ARTIFACT_UNSUPPORTED"
effect: block
category: recoverable
emit: guard:ask_user
message: artifact cannot render in the decision card
what: Artifact {{ paintedwolf.ref }} has unsupported preview type {{ paintedwolf.ask_artifact_mime }}.
cause: The artifact MIME type is not an interactive preview format.
why: A decision card must show the artifact it asks the user to review.
fix: 'Use an artifact UUID with a current interactive preview format: {{ paintedwolf.ask_artifact_formats }}. Preserve the content needed for the decision; a renamed MIME type does not convert the artifact.'
instead: Branch on Code ASK_USER_ARTIFACT_UNSUPPORTED; pass a supported artifact UUID
scenarios:
  - id: default
    vars:
      detail: stub
      path: src/main.go
      profile: coordinator
      tool: ask_user
