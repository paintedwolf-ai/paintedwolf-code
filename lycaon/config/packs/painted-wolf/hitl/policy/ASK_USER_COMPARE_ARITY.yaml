spec_version: "1.0"
id: ASK_USER_COMPARE_ARITY
kind: schema
on: tool.rejected
selector:
  tools:
    - ask_user
requires_facts: [paintedwolf.ask_artifact_count, paintedwolf.ask_artifact_limit, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "ASK_USER_COMPARE_ARITY"
effect: block
category: recoverable
emit: guard:ask_user
message: compare requires 2 to 4 artifacts
what: The comparison includes {{ paintedwolf.ask_artifact_count }} distinct artifacts; the current limit is {{ paintedwolf.ask_artifact_limit }}.
cause: The cleaned artifact list exceeds the decision card’s comparison bound.
why: Each compared variant needs a visible, selectable preview.
fix: Narrow this comparison to between two and {{ paintedwolf.ask_artifact_limit }} relevant variants. One artifact requests review; no artifacts requests clarification. Preserve alternatives material to the user’s decision.
instead: Branch on Code ASK_USER_COMPARE_ARITY; narrow the comparison without discarding a material alternative
scenarios:
  - id: default
    vars:
      detail: stub
      path: src/main.go
      session_role: coordinator
      tool: ask_user
