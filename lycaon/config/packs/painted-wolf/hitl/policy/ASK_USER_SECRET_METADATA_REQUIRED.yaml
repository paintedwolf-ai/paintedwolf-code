spec_version: "1.0"
id: ASK_USER_SECRET_METADATA_REQUIRED
kind: schema
on: tool.rejected
selector:
  tools: [ask_user]
requires_facts: [paintedwolf.rejection_code, paintedwolf.rejection_field]
when: paintedwolf.rejection_code == "ASK_USER_SECRET_METADATA_REQUIRED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:ask_user
message: "Protected response metadata {{ paintedwolf.rejection_field }} is required."
what: "Protected response metadata {{ paintedwolf.rejection_field }} is required."
cause: "The host needs value-free metadata to manage the credential lifecycle before requesting it."
why: Preserve the response channel and protected-input lifecycle before creating a user question.
fix: "Supply the missing metadata required by the current secret schema while keeping response_type secret. Never place the credential value in the question or metadata."
instead: Correct the structured request without downgrading protected input
x-paintedwolf-scenarios:
  - id: default
    vars: {"field": "secret.name", "session_role": "coordinator", "tool": "ask_user"}
