oar: '1.0'
id: ASK_USER_REVIEW_OPTIONS
kind: schema
anchor: tool.rejected
selector:
  tool:
    - ask_user
requires:
  facts: [paintedwolf.rejection_code]
  profiles:
    - tool
when: paintedwolf.rejection_code == "ASK_USER_REVIEW_OPTIONS"
effect: block
copy:
  what: ask_user with 1 artifact synthesizes Approve / Request changes / Reject; caller must not pass options or multi_choice.
  cause: artifacts length is 1 with caller options or multi_choice response_type.
  why: The host defines review choice labels; Other+text is always available. Review is always single_choice.
  fix: Omit options; pass one artifact UUID. Omit response_type or use single_choice.
  instead: Branch on Code ASK_USER_REVIEW_OPTIONS; omit options and pass one artifact
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:ask_user
x-paintedwolf-message: review shape rejects conflicting options
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: stub
      path: src/main.go
      profile: coordinator
      tool: ask_user
    expect_contains:
      - 'Rejected:'
      - 'Code: ASK_USER_REVIEW_OPTIONS'
      - Omit options
