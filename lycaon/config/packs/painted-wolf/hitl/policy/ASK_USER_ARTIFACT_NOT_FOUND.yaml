spec_version: "1.0"
id: ASK_USER_ARTIFACT_NOT_FOUND
kind: schema
on: tool.rejected
selector:
  tools:
    - ask_user
requires_facts: [paintedwolf.ref, paintedwolf.rejection_code, paintedwolf.rejection_reason]
when: paintedwolf.rejection_code == "ASK_USER_ARTIFACT_NOT_FOUND"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:ask_user
message: artifact ref was not found
what: The artifact {{ paintedwolf.ref }} could not be resolved{% if paintedwolf.rejection_reason %} ({{ paintedwolf.rejection_reason }}){% endif %}.
cause: The reference is malformed or absent, or the artifact store is unavailable; the structured reason identifies which.
why: The feedback card cannot preview a missing artifact.
fix: Use a UUID returned by an artifact-producing tool in this conversation tree. If the store is unavailable, restore that host service before retrying. Omit artifacts only when the decision can be answered without reviewing them; do not replace required visual evidence with an unsupported claim.
instead: Branch on Code ASK_USER_ARTIFACT_NOT_FOUND; use a known session-tree artifact UUID from producer tool JSON
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: stub
      path: src/main.go
      profile: coordinator
      tool: ask_user
