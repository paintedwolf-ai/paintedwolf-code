spec_version: "1.0"
id: ASK_USER_OPTIONS_REQUIRED
kind: schema
on: tool.rejected
selector:
  tools:
    - ask_user
requires_facts: [paintedwolf.ask_option_count, paintedwolf.ask_option_limit, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "ASK_USER_OPTIONS_REQUIRED"
effect: block
category: recoverable
emit: guard:ask_user
message: choice asks need at least two options
what: The choice request has {{ paintedwolf.ask_option_count }} non-empty options; it requires at least {{ paintedwolf.ask_option_limit }}.
cause: response_type is single_choice or multi_choice but options were missing, empty, or fewer than two after trim.
why: Choice cards need a real option set for the user to pick from.
fix: Provide at least {{ paintedwolf.ask_option_limit }} meaningful non-empty options. Move choices written in `prompt` into `options` and ask again. Use text only when a nonsecret question is better answered freely; never move protected input into text.
instead: Branch on Code ASK_USER_OPTIONS_REQUIRED; provide a real choice set or a suitable nonsecret text question
scenarios:
  - id: default
    vars:
      detail: stub
      path: src/main.go
      profile: coordinator
      tool: ask_user
