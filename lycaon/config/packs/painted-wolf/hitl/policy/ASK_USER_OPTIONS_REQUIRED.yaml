oar: '1.0'
id: ASK_USER_OPTIONS_REQUIRED
kind: schema
anchor: tool.rejected
selector:
  tool:
  - ask_user
requires:
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.ask_option_count
  - paintedwolf.ask_option_limit
  profiles:
  - tool
when: paintedwolf.rejection_code == "ASK_USER_OPTIONS_REQUIRED"
effect: block
copy:
  what: The choice request has {{ paintedwolf.ask_option_count }} non-empty options; it requires at least {{
    paintedwolf.ask_option_limit }}.
  cause: response_type is single_choice or multi_choice but options were missing, empty, or fewer than two
    after trim.
  why: Choice cards need a real option set for the user to pick from.
  fix: Provide at least {{ paintedwolf.ask_option_limit }} meaningful non-empty options. Move choices written in `prompt` into `options` and ask again. Use text only when
    a nonsecret question is better answered freely; never move protected input into text.
  instead: Branch on Code ASK_USER_OPTIONS_REQUIRED; provide a real choice set or a suitable nonsecret text
    question
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:ask_user
x-paintedwolf-message: choice asks need at least two options
x-paintedwolf-scenarios:
- id: default
  vars:
    detail: stub
    path: src/main.go
    profile: coordinator
    tool: ask_user
  expect_contains:
  - 'Code: ASK_USER_OPTIONS_REQUIRED'
  - options
