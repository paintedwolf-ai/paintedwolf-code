spec_version: "1.0"
id: ASK_USER_OPTIONS_TOO_MANY
kind: schema
on: tool.rejected
selector:
  tools:
    - ask_user
requires_facts: [paintedwolf.ask_option_count, paintedwolf.ask_option_limit, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "ASK_USER_OPTIONS_TOO_MANY"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:ask_user
message: too many choice options
what: The choice request has {{ paintedwolf.ask_option_count }} options after cleaning; the current limit is {{ paintedwolf.ask_option_limit }}.
cause: The option count exceeds the decision card bound.
why: Excess options are rejected rather than silently removed.
fix: Use at most {{ paintedwolf.ask_option_limit }} meaningful options (two to four preferred), or ask a narrower question. Do not duplicate the host’s free-text alternative.
instead: Branch on Code ASK_USER_OPTIONS_TOO_MANY; narrow the option set to the current limit
x-paintedwolf-scenarios:
  - id: default
    vars:
      count: '7'
      detail: stub
      max_options: '6'
      path: src/main.go
      profile: coordinator
      tool: ask_user
