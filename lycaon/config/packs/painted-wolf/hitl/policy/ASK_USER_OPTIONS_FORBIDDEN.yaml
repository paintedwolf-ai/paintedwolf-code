spec_version: "1.0"
id: ASK_USER_OPTIONS_FORBIDDEN
kind: schema
on: tool.rejected
selector:
  tools:
    - ask_user
requires_facts: [paintedwolf.rejection_code, paintedwolf.response_type]
when: paintedwolf.rejection_code == "ASK_USER_OPTIONS_FORBIDDEN"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:ask_user
message: text asks must not include options
what: 'ask_user response_type {{ paintedwolf.response_type }} does not accept options.'
cause: Caller-provided choices are incompatible with this response channel.
why: A text card accepts free text; a secret card writes protected input directly to managed storage.
fix: Remove options and preserve the intended response_type. For protected input, keep response_type secret and its lifecycle metadata; never turn the request into ordinary text or a choice list.
instead: Remove the incompatible choices without downgrading protected input
x-paintedwolf-scenarios:
  - id: default
    vars:
      response_type: secret
      detail: stub
      path: src/main.go
      profile: coordinator
      tool: ask_user
