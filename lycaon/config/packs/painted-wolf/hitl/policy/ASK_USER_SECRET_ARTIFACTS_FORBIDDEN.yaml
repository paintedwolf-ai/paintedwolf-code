oar: '1.0'
id: ASK_USER_SECRET_ARTIFACTS_FORBIDDEN
kind: schema
anchor: tool.rejected
selector:
  tool: [ask_user]
requires:
  profiles: [tool]
  facts: [paintedwolf.rejection_code, paintedwolf.count]
when: paintedwolf.rejection_code == "ASK_USER_SECRET_ARTIFACTS_FORBIDDEN"
effect: block
copy:
  what: "Protected input cannot be combined with {{ paintedwolf.count }} review artifacts."
  cause: "Artifact review produces ordinary choice feedback; it cannot receive a protected secret response."
  why: Preserve the response channel and protected-input lifecycle before creating a user question.
  fix: "Keep response_type secret and its metadata, and remove artifacts from this request. Present any independently needed artifact review in a separate question after this one is resolved."
  instead: Correct the structured request without downgrading protected input
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:ask_user
x-paintedwolf-message: "Protected input cannot be combined with {{ paintedwolf.count }} review artifacts."
x-paintedwolf-scenarios:
  - id: default
    vars: {"count": 1, "profile": "coordinator", "tool": "ask_user"}
    expect_contains: ['Rejected:', 'Code: ASK_USER_SECRET_ARTIFACTS_FORBIDDEN']
