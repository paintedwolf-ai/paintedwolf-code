oar: '1.0'
id: REQUEST_DECISION_ARTIFACT_SHAPE
kind: schema
anchor: tool.rejected
selector:
  tool:
  - request_decision
requires:
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.rejection_reason
  profiles:
  - tool
when: paintedwolf.rejection_code == "REQUEST_DECISION_ARTIFACT_SHAPE"
effect: block
copy:
  what: 'request_decision received an invalid attachment shape: {{ paintedwolf.rejection_reason }}.'
  cause: A decision can attach one nonempty artifact_id or a compare list of distinct nonempty artifact UUIDs.
  why: The card has one visual decision shape.
  fix: Use exactly one attachment field with valid IDs from actual results. Correct malformed entries explicitly;
    do not silently discard required evidence.
  instead: Branch on Code REQUEST_DECISION_ARTIFACT_SHAPE; use one artifact field
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:request_decision
x-paintedwolf-message: decision has conflicting artifact fields
x-paintedwolf-scenarios:
- id: default
  vars:
    detail: stub
    path: src/main.go
    profile: worker
    tool: request_decision
  expect_contains:
  - 'Code: REQUEST_DECISION_ARTIFACT_SHAPE'
  - artifact
