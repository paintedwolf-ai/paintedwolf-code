spec_version: "1.0"
id: ASK_USER_ALREADY_PENDING
kind: schema
on: tool.rejected
selector:
  tools:
    - ask_user
requires_facts: [paintedwolf.pending_input_id, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "ASK_USER_ALREADY_PENDING"
effect: block
category: recoverable
emit: guard:ask_user
message: a user ask is already pending
what: ask_user cannot open a second coordinator-to-human wait while one is still pending.
cause: 'A user response is already pending{% if paintedwolf.pending_input_id %} for {{ paintedwolf.pending_input_id }}{% endif %}.'
why: A second request would compete with the unresolved response.
fix: Preserve the existing request and wait for its response. Ask another question only if a distinct unresolved need remains afterward.
instead: Do not repeat the question, infer an answer, or open replacement work to bypass the pending response.
scenarios:
  - id: default
    vars:
      detail: stub
      path: src/main.go
      session_role: coordinator
      tool: ask_user
