spec_version: "1.0"
id: REQUEST_DECISION_ARTIFACT_UNSUPPORTED
kind: schema
on: tool.rejected
selector:
  tools:
    - request_decision
requires_facts: [paintedwolf.artifact_id, paintedwolf.artifact_preview_mimes, paintedwolf.mime, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "REQUEST_DECISION_ARTIFACT_UNSUPPORTED"
effect: block
category: recoverable
emit: guard:request_decision
message: artifact cannot render in the decision card
what: Artifact {{ paintedwolf.artifact_id }} has MIME {{ paintedwolf.mime }}, which the decision card cannot preview.
cause: The artifact MIME type is not an interactive preview format.
why: A decision card must show the artifact it asks the coordinator to review.
fix: 'Use an intended review artifact in a currently supported format: {{ paintedwolf.artifact_preview_mimes }}. Preserve the content the coordinator must evaluate.'
instead: Branch on Code REQUEST_DECISION_ARTIFACT_UNSUPPORTED; pass a supported artifact UUID
scenarios:
  - id: default
    vars:
      detail: stub
      path: src/main.go
      profile: worker
      tool: request_decision
