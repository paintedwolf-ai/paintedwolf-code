oar: '1.0'
id: REQUEST_DECISION_ARTIFACT_UNSUPPORTED
kind: schema
anchor: tool.rejected
selector:
  tool:
  - request_decision
requires:
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.artifact_id
  - paintedwolf.mime
  - paintedwolf.artifact_preview_mimes
  profiles:
  - tool
when: paintedwolf.rejection_code == "REQUEST_DECISION_ARTIFACT_UNSUPPORTED"
effect: block
copy:
  what: Artifact {{ paintedwolf.artifact_id }} has MIME {{ paintedwolf.mime }}, which the decision card cannot
    preview.
  cause: The artifact MIME type is not an interactive preview format.
  why: A decision card must show the artifact it asks the coordinator to review.
  fix: 'Use an intended review artifact in a currently supported format: {{ paintedwolf.artifact_preview_mimes
    }}. Preserve the content the coordinator must evaluate.'
  instead: Branch on Code REQUEST_DECISION_ARTIFACT_UNSUPPORTED; pass a supported artifact UUID
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:request_decision
x-paintedwolf-message: artifact cannot render in the decision card
x-paintedwolf-scenarios:
- id: default
  vars:
    detail: stub
    path: src/main.go
    profile: worker
    tool: request_decision
  expect_contains:
  - 'Code: REQUEST_DECISION_ARTIFACT_UNSUPPORTED'
  - artifact
