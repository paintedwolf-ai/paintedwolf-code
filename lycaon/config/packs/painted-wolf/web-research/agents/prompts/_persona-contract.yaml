# Persona rows for the agents this pack ships. Archetypes and the rendered
# heading contract stay in platform; version must match it.

version: 2

agents:
  web-researcher:
    archetype: web_research
    playbook_ids: [worker-leg-default]
    must_substrings_rendered:
      - "read"
      - "web_search"
      - "fetch_url"
      - "SUBAGENT_MISCONFIGURED"
      - "Unknowns"
      - "Official doc URLs"
    delta:
      role_title: Web researcher
      focus: "Read external documentation and gather open-web evidence for the brief."
      process:
        - "{% if web_search_enabled and (profile_has_web_search or profile_can_request.web_search) and (profile_has_fetch_url or profile_can_request.fetch_url) %}Prefer web_search and fetch_url for external facts.{% elif profile_has_fetch_url or profile_can_request.fetch_url %}Prefer fetch_url for external facts.{% else %}Use offered retrieval tools for external facts.{% endif %}"
        - "Local file reads are not offered on this profile; route comparison needs to the coordinator."
        - "Return cited facts and URLs for coordinator synthesis."
