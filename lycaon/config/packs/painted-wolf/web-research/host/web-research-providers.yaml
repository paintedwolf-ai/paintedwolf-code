# Web research custom providers — bundled catalog SSOT.
# Direct search (wire id "direct") is NOT listed here; it is the built-in mode side.
# Wire enum + pkg/api consts + Den catalog TS are generated from this file:
#   ./task codegen:web-research-catalog
# kind: keyed | keyed_extra | keyless_endpoint | keyless
# roles: [results] (default) | [results, seeds] — participation axes for custom fan-out and direct seeds
# Only high-signal general indexes act as crawl seeds.
# Specialized sources remain results-only to bound direct fan-out.
# default_enabled and pacing are keyless-only (see docs/tools.md)
# family selects a shared runtime adapter; custom uses a dedicated builder.
# family_params: runtime-only (ignored by ./task codegen:web-research-catalog).
# Family parameters configure adapter-specific fields.

providers:
  - id: brave
    kind: keyed
    label: Brave Search
    credential_slot: brave-search
    api_key_env: BRAVE_SEARCH_API_KEY
    test_query: test
    hint: Get a key from Brave Search API.

  - id: marginalia
    kind: keyed
    label: Marginalia Search
    credential_slot: marginalia
    api_key_env: MARGINALIA_API_KEY
    test_query: test
    hint: Get a key from Marginalia Search for independent open-web results.

  - id: google_cse
    kind: keyed_extra
    label: Google Programmable Search
    credential_slot: google-cse
    api_key_env: GOOGLE_CSE_API_KEY
    extra_fields:
      - name: search_engine_id
        env: GOOGLE_CSE_SEARCH_ENGINE_ID
        label: Search engine ID (cx)
    test_query: test
    hint: API key plus Programmable Search Engine ID (cx) from Google Cloud Console.

  - id: tavily
    kind: keyed
