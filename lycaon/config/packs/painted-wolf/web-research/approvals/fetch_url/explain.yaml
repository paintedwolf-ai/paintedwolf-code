# fetch_url — approval explanation registry entry.
# Enriched by ./task codegen:approval-explanations

approval_explanations:
    fetch_url:
        tool: fetch_url
        tier_hint: recoverable
        what_changes: Fetch content from a URL; mode=raw with dest may write the resource into the project.
        who_affected: The remote host (read), and when dest is set the local project tree (write).
        if_wrong: A bad page extract is harmless; a bad dest overwrite is a local file mutation you can revert in git.
        allow_line: fetching URLs
        scenarios:
            - id: default
              vars:
                project: my-app
              expect_contains:
                - Fetch
                - URL
