# Deprecated rejection identity; raw transfers use portable curl.
spec_version: "1.0"
id: FETCH_URL_DEST_INVALID
kind: schema
on: tool.rejected
selector:
  tools:
    - fetch_url
requires_facts: [paintedwolf.next_steps, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "FETCH_URL_DEST_INVALID"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:fetch_url
message: recorded fetch_url destination was invalid
what: fetch_url was called with dest while mode was not raw.
cause: That invocation combined a text extraction with a file destination.
why: The current source reader has no destination argument.
fix: 'The source reader no longer accepts mode or dest. Use its current schema; respect any recorded access refusal. {{ paintedwolf.next_steps }}'
instead: Follow the current schema and access boundaries.
x-paintedwolf-scenarios:
  - id: default
    vars:
      dest: assets/logo.png
      tool: fetch_url
