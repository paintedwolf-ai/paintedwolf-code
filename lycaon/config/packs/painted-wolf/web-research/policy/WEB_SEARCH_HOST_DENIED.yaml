spec_version: "1.0"
id: WEB_SEARCH_HOST_DENIED
kind: schema
on: tool.rejected
selector:
  tools:
    - web_search
    - fetch_url
requires_facts: [paintedwolf.host, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "WEB_SEARCH_HOST_DENIED"
effect: block
category: recoverable
emit: guard:web_search_host
message: the user declined outbound access to this host
what: A web tool tried to reach {{ paintedwolf.host }}, and the user declined that host for this session.
cause: This host is not available for web tools this session.
why: Retrying the same host loops on the same denial.
fix: Use a different public URL or provider only if it serves the intended research, is allowed, and respects any direction the user attached. Do not re-request the denied host or route around the denial.
instead: Respect the denied host and user direction; report the dependency when no allowed source suffices
scenarios:
  - id: web_search_host_denied
    vars:
      host: api.example-search.test
      tool: web_search
  - id: fetch_url_host_denied
    vars:
      host: docs.example.test
      tool: fetch_url
