# Deprecated rejection identity; raw transfers use portable curl.
oar: '1.0'
id: FETCH_URL_DEST_REQUIRED
kind: schema
anchor: tool.rejected
selector:
  tool:
  - fetch_url
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.next_steps
  - paintedwolf.rejection_code
  - paintedwolf.content_type
when: paintedwolf.rejection_code == "FETCH_URL_DEST_REQUIRED"
effect: block
copy:
  what: mode=raw fetched a non-image binary resource ({{ paintedwolf.content_type }}) without dest.
  cause: That invocation required a destination for binary transfers; that transfer path is retired.
  why: The current source reader returns readable documents or screened images.
  fix: 'The source reader no longer accepts mode or dest. Use its current schema; respect any recorded access refusal. {{ paintedwolf.next_steps }}'
  instead: Follow the current schema and access boundaries.
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:fetch_url
x-paintedwolf-message: recorded fetch_url binary transfer lacked a destination
x-paintedwolf-scenarios:
- id: default
  vars:
    content_type: image/png
    tool: fetch_url
