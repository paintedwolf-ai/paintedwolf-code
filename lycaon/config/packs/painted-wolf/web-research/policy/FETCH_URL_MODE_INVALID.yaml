# Deprecated rejection identity; raw transfers use portable curl.
oar: '1.0'
id: FETCH_URL_MODE_INVALID
kind: schema
anchor: tool.rejected
selector:
  tool:
    - fetch_url
requires:
  profiles:
    - tool
  facts:
    - paintedwolf.rejection_code
    - paintedwolf.mode
when: paintedwolf.rejection_code == "FETCH_URL_MODE_INVALID"
effect: block
copy:
  what: fetch_url mode {{ paintedwolf.mode }} is not text or raw.
  cause: Only mode=text (research extract) and mode=raw (verbatim / asset ingest) are valid.
  why: The host routes HTML extraction versus byte ingest from the mode field alone.
  fix: Fetch is read-only. Omit mode and dest to read a source. Raw transfers and downloads require portable curl on a command-capable surface; existing access refusals still apply.
  instead: Use the read-only source reader or an authorized raw transfer.
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:fetch_url
x-paintedwolf-message: fetch_url mode must be text or raw
x-paintedwolf-scenarios:
  - id: default
    vars:
      mode: html
      tool: fetch_url
