# Deprecated rejection identity; raw transfers use portable curl.
oar: '1.0'
id: FETCH_URL_DEST_DENIED
kind: schema
anchor: tool.rejected
selector:
  tool:
  - fetch_url
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.path
when: paintedwolf.rejection_code == "FETCH_URL_DEST_DENIED"
effect: block
copy:
  what: fetch_url could not write dest {{ paintedwolf.path }} under project write scope.
  cause: The requested destination failed the ingest write boundary after the response was fetched.
  why: Asset ingest must stay inside the attached folders — same jail as write and copy.
  fix: Fetch is read-only. Omit mode and dest to read a source. Raw transfers and downloads require portable curl on a command-capable surface; existing access refusals still apply.
  instead: Use the read-only source reader or an authorized raw transfer.
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:fetch_url
x-paintedwolf-message: fetch_url dest path is not writable
x-paintedwolf-scenarios:
- id: default
  vars:
    path: .git/objects/pack
    tool: fetch_url
