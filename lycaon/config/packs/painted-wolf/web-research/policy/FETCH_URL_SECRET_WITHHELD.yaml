spec_version: "1.0"
id: FETCH_URL_SECRET_WITHHELD
kind: schema
on: tool.rejected
selector:
  tools:
    - fetch_url
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "FETCH_URL_SECRET_WITHHELD"
effect: block
category: recoverable
emit: guard:fetch_url
message: fetch_url image perception withheld by the secret screen
what: fetch_url did not send the fetched image to the model.
cause: The image carries text the secret screen flagged or could not read, and the send was declined or could not be put to a person.
why: A person decides whether an image that may hold a credential reaches the model provider.
fix: Continue without this image, or report that it needs review.
instead: Branch on Code FETCH_URL_SECRET_WITHHELD; do not fetch the same image again
scenarios:
  - id: default
    vars:
      tool: fetch_url
