id: closeout_gates_passed
kind: workflow-closeout
purpose: |
  Closeout requires settled worker obligations (no worker working or asking, complete results accounted for, and changes promoted, rejected, or shelved) and current source verification evidence.
missing_signals:
  - id: closeout_pending
    when: "true"
    detail: "Worker accounting or change resolution, current source verification, or required security evidence is incomplete."
    fix: "Account for complete worker results, resolve open changes (promote, reject, or shelve), and record passing current-source verification and required security evidence."
satisfy:
  - "Account for complete worker results and resolve open changes."
  - "Record passing current-source verification and required security evidence."
