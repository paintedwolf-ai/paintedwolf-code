id: recon_or_board_ready
kind: delegate-orientation
purpose: |
  Orientation is ready when the host has injected the board and worker roster in the request or a recon worker
  has returned terminal proof on the parent session.
missing_signals:
  - id: no_board_or_recon
    when: "true"
    detail: "No board/roster inject and no completed recon/orientation worker on this session."
    fix: "Read `pack_board` for the current worker roster and repository snapshot, or dispatch an orientation worker and wait for its result."
satisfy:
  - "Ensure the host injects the board and worker roster on the next coordinator turn, or complete an orientation worker round."
