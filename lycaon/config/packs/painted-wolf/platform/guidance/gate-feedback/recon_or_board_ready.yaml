id: recon_or_board_ready
kind: delegate-orientation
purpose: |
  Orientation is ready when the host has injected a pack board snapshot or a recon worker
  has returned terminal proof on the parent session.
missing_signals:
  - id: no_board_or_recon
    when: "true"
    detail: "No pack board inject and no completed recon/orientation worker on this session."
    fix: "Call pack_board for a compact snapshot, or task(agent_type=\"repo-researcher\"|\"path-explorer\", …) and wait for the worker envelope."
satisfy:
  - "Ensure the host injects pack board on the next coordinator turn, or complete an orientation worker job."
