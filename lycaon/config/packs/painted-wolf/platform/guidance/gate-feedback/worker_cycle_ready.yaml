id: worker_cycle_ready
kind: delegate-worker-cycle
purpose: |
  No worker in the current phase is working or asking; waiting workers do not block
  re-entering the build loop.
missing_signals:
  - id: pending_workers
    when: "true"
    detail: "One or more workers are still working or asking on this session."
    fix: "Wait for working workers to deliver or answer any pending question before claiming done."
  - id: no_terminal_proof
    when: "true"
    detail: "The host has not recorded a settled result notice for the completing round."
    fix: "Wait for active worker rounds to settle and deliver their result notices on the parent session."
satisfy_auto:
  - "Wait until no worker is working or asking on the parent session."
  - "Wait for round settlement; host re-prompts after worker_cycle_ready."
satisfy:
  - "Wait until no worker is working or asking on the parent session."
  - "Wait for round settlement; host re-prompts after worker_cycle_ready."
