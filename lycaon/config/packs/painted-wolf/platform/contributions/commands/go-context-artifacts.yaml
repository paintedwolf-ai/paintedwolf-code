id: painted-wolf/platform:go-context-artifacts
title: "Show artifacts"
scope: "global"
keywords:
  - "artifacts"
when:
  all:
    - fact: "project_open"
    - all:
        - fact: "context_feature"
          is: "artifacts"
        - any:
            - fact: "context_navigable"
            - fact: "view_mounted"
              is: "context"
action:
  kind: native_ui
  handler: "go.context.artifacts"
