id: painted-wolf/platform:shell-install-pw
title: "Install pw command"
icon: terminal
scope: "global"
keywords:
  - "shell"
  - "cli"
  - "terminal"
  - "path"
  - "pw"
  - "pw-logs"
  - "command line"
# A package-managed install already provides the command.
when:
  not:
    fact: "shell_command_packaged"
action:
  kind: native_ui
  handler: "shell.installPw"
