id: painted-wolf/platform:go-context-extensions
title: "Show extensions"
scope: "global"
keywords:
  - "extensions"
when:
  all:
    - fact: "project_open"
    - all:
        - fact: "context_feature"
          is: "extensions"
        - any:
            - fact: "context_navigable"
            - fact: "view_mounted"
              is: "context"
action:
  kind: native_ui
  handler: "go.context.extensions"
