# capability_request field schemas. A tool schema that declares
# capability_request receives every field its execution contract supports
# (native-tools.yaml execution_capabilities). Keys a tool declares for a field
# are merged over the field's schema here, so a tool restates only what differs.
fields:
  host_resources: {type: array, minItems: 1, maxItems: 16, description: Service IDs., items: {type: string}}
  socket_paths: {type: array, minItems: 1, maxItems: 8, items: {type: string}, description: "Exact service path. External argv or env values use a whole `{{paintedwolf-socket:/absolute/path}}` reference. Clients needing a Unix URL use `{{paintedwolf-socket:unix-url:/absolute/path}}`. macOS datagrams use `{{paintedwolf-socket:unixgram:/absolute/path}}`; Linux confinement refuses Unix datagrams. Native socket arguments use the path."}
  process_control: {description: "Signals to processes outside the sandbox.", oneOf: [{type: boolean, enum: [true]}, {type: object, additionalProperties: false}]}
  credential_store: {type: boolean, enum: [true], description: Read-only access to the OS credential store.}
  host_execution: {description: "Runs outside the sandbox after review. For operations no other field admits, such as binding a socket outside session scratch or starting a VM. Never opens policy-denied or control-plane targets.", oneOf: [{type: boolean, enum: [true]}, {type: object, additionalProperties: false}]}
  direct_ip:
    description: Direct IP for UDP or clients that ignore proxy variables.
    oneOf: [{type: boolean}, {type: array, maxItems: 16, items: {type: string, maxLength: 256}}, {type: object, additionalProperties: false, properties: {declared_destinations: {type: array, maxItems: 16, items: {type: string, maxLength: 256}}}}]
  local_listen: {type: object, additionalProperties: false, description: Listen ports., properties: {ports: {type: array, minItems: 1, maxItems: 8, uniqueItems: true, description: Ports., items: {type: integer, minimum: 1, maximum: 65535}}}}
  loopback_connect: {type: object, additionalProperties: false, description: Client ports., properties: {ports: {type: array, minItems: 1, maxItems: 8, uniqueItems: true, description: Ports., items: {type: integer, minimum: 1, maximum: 65535}}}}
  write_root: {type: string, maxLength: 1024, description: "Absolute path needing write authority; protected files need the exact path."}
  read_path:
    description: One exact absolute protected path or a list of up to 32.
    oneOf:
      - {type: string, maxLength: 1024}
      - {type: array, minItems: 1, maxItems: 32, items: {type: string, maxLength: 1024}}
