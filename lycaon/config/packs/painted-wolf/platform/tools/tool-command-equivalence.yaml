- native: git_restore
  replaces:
  - habit: git restore
    examples:
    - git restore -- main.go
    - git restore --staged --worktree --source=HEAD -- main.go
  redirect_code: USE_NATIVE_TOOL
  profiles:
  - coordinator
- native: git_commit
  replaces:
  - habit: git add paths && git commit -m
    examples:
    - git add main.go && git commit -m 'Update main'
  - habit: git commit --amend -m message -- paths
    examples:
    - git commit --amend -m 'Complete change' -- main.go new_test.go
    - git add -- new_test.go && git commit --amend -m 'Complete change' -- main.go new_test.go
  args_hint: Use explicit paths and message; amend:true replaces HEAD with those paths, including new files,
    and leaves unrelated staged changes alone.
  redirect_code: USE_NATIVE_TOOL
  profiles:
  - coordinator
- native: chmod
  replaces:
