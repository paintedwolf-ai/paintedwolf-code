entries:
- native: read
  replaces:
  - habit: cat / head / sed -n
    examples:
    - sed -n '1,200p' docs/den.md
    - head -n 40 README.md
    - cat main.go
  args_hint: Pass path with 1-based offset + limit, or ranges[] for up to 8 spans in one call; mode outline
    for a symbol index instead of lines.
  redirect_code: USE_READ_NATIVE
  profiles:
  - explore_readonly
  - coordinator
  - implement
  - worker_readonly
  - plan_review_readonly
  - plan_write_only
  read_habit:
  - program: cat
    grammar: whole_file
  - program: head
    grammar: leading_lines
  - program: sed
    grammar: quiet_line_span
- native: find
  replaces:
  - habit: find(1) recursive walk
    examples:
    - find . -name '*.go'
  - habit: tree(1)
    examples:
    - tree -L 2 src
  command_grammar:
  - program: find
    grammar: find
  - program: tree
    grammar: tree
  redirect_code: USE_FIND_NOT_COMMAND
  profiles:
  - explore_readonly
  - coordinator
  - implement
- native: grep
  replaces:
  - habit: rg / grep -r
    examples:
    - rg Pattern
    - grep -r foo .
  args_hint: Pattern is always RE2 regex — ripgrep-style search works as-is; escape what you mean literally.
  command_grammar:
  - program: rg
    grammar: grep
  - program: grep
    grammar: grep
  redirect_code: USE_GREP_REGEX
  profiles:
  - explore_readonly
  - coordinator
  - implement
- native: list_dir
  replaces:
  - habit: ls -la
    examples:
    - ls -la pkg/
  command_grammar:
  - program: ls
    grammar: list_dir
  redirect_code: USE_LIST_DIR_NATIVE
  profiles:
  - explore_readonly
  - coordinator
  - implement
- native: jq
  replaces:
  - habit: jq
    examples:
    - jq '.data.users' config.json
    - jq keys package.json
  - habit: yq
    examples:
    - yq '.phases[0].tools' workflow.yaml
    - yq '.package.name' Cargo.toml
  args_hint: Pass the jq program as query and the file as path — JSON, YAML, and TOML are supported via format
    (default auto).
  command_grammar:
  - program: jq
    grammar: jq_json
  - program: yq
    grammar: jq_yaml
  redirect_code: USE_JQ_NATIVE
  profiles:
  - explore_readonly
  - coordinator
  - implement
  - worker_readonly
  - plan_review_readonly
  - plan_write_only
- native: stat
  replaces:
  - habit: stat(1)
    examples:
    - stat file.go
  command_grammar:
  - program: stat
    grammar: stat
  redirect_code: USE_STAT_NATIVE
  profiles:
  - explore_readonly
  - coordinator
  - implement
- native: wc
  replaces:
  - habit: wc -l
    examples:
    - wc -l file.go
  command_grammar:
  - program: wc
    grammar: wc
  redirect_code: USE_WC_NATIVE
  profiles:
  - explore_readonly
  - coordinator
  - implement
- native: git_status
  replaces:
  - habit: git status
    examples:
    - git status
    - git status --porcelain=v1 --untracked-files=all
    - git status -s -- src
  args_hint: 'Pages of 80 files: follow next_offset with offset until it is absent; paths[] narrows to repo-relative
    prefixes (a file, or a directory subtree). Untracked files are listed one per file.'
  command_grammar:
  - program: git
    grammar: git
  redirect_code: USE_GIT_STATUS_NATIVE
  profiles:
  - explore_readonly
  - coordinator
- native: git_diff
  replaces:
  - habit: git diff
    examples:
    - git diff --cached -- src/main.go
    - git diff --stat
    - git diff main -- src
    - git diff src/main.go docs
  args_hint: 'Pages of 80 files and 5 KiB of hunks: follow next_offset with offset until it is absent; stat:true
    surveys counts only; paths[] narrows; base_ref compares against a commit or branch; untracked:true adds
    new files as additions.'
  redirect_code: USE_GIT_DIFF_NATIVE
  profiles:
  - explore_readonly
  - coordinator
- native: git_log
  replaces:
  - habit: git log
    examples:
    - git log -n 20
    - git log --oneline -6 benchmark-page
    - git log main..feature -- src/main.go
  redirect_code: USE_NATIVE_TOOL
  profiles:
  - explore_readonly
  - coordinator
  - worker_readonly
  - plan_review_readonly
