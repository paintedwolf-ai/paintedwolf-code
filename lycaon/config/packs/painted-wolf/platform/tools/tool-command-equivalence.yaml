  profiles:
  - coordinator
  - implement
  command_grammar:
  - program: unzip
    grammar: extract_zip
- native: http_request
  replaces:
  - habit: ad hoc HTTP API request
    examples:
    - 'curl -X POST -H ''Content-Type: application/json'' -d ''{"ok":true}'' https://api.example.test/v1'
  replacement_example: http_request {"url":"https://api.example.test/v1","method":"POST","headers":[{"name":"Content-Type","value":"application/json"}],"body_text":"{\"ok\":true}"}
  args_hint: 'Use http_request for API endpoints and webhooks. For reading web pages or documentation, use fetch_url instead. Use ordered headers and exactly one of body_text, body_json, body_path, or form. Set response_path
    to land a large body in the project, or response_body: discard for status only. Loopback needs capability_request.loopback_connect.'
  redirect_code: USE_HTTP_REQUEST_NATIVE
  profiles:
  - coordinator
  - implement
  command_grammar:
  - program: curl
    grammar: curl
- native: wait
  replaces:
  - habit: sleep
    examples:
    - sleep 10
  args_hint: Use timeout_ms; add typed conditions when a host-observed event can resume sooner.
  redirect_code: USE_NATIVE_TOOL
  profiles:
  - explore_readonly
  - coordinator
  - implement
  - worker_readonly
  - plan_review_readonly
  - plan_write_only
  - web_research
  command_grammar:
  - program: sleep
    grammar: sleep
- native: edit
  replaces:
  - habit: sed -i / perl -pi in-place edit
    examples:
    - sed -i 's/old/new/g' main.go
  args_hint: Anchor on required exact old_string; replace_all changes all exact matches only when that is intended.
    Use code_rewrite for supported structural patterns.
  profiles:
  - implement
  - plan_write_only
- native: code_rewrite
  replaces:
  - habit: ast-grep / comby / gofmt -r structural rewrite
    examples:
    - ast-grep -p 'fmt.Println($A)' -r 'log.Info($A)'
  args_hint: pattern + rewrite with $VAR / $$$VAR placeholders; paths[] + recursive for codemods; dry_run returns
    a unified diff.
  profiles:
  - implement
