# Tool transcript presentation for chat cards and parent-chat visibility.
# Codegen: ./task codegen:tool-presentation
#   -> lycaon-den/src/chat/tool/tool-presentation.generated.ts
#   -> lycaon/internal/toolpresentation/visibility.generated.go
#
# Each schema-backed tool has one entry; title_keys refer to declared arguments.
# title_fallback labels calls whose readable target is not yet resolved.
#
# visibility:
#   coordinator_internal — hidden from parent chat.
#   long_running         — visible before its result and after settlement,
#                          including benign results.
#   (omitted)            — deferred until the result settles, then follows
#                          tool_result.ui_visibility.
#
# kind selects a card rendering family:
#   read    — file content.
#   write   — file mutation.
#   command — command output.
#   task    — worker dispatch.
#   skill   — host-stamped skill projection.
#
# path_entry names what the tool's `path` argument addresses (file or
# folder), so Den opens the right kind of entry from the argument fact.
#
# Visible calls form activity spans. activity weights each span's headline:
#   incidental — bookkeeping that should not rename substantive work.
#   supporting — orientation and small supporting actions.
#   primary    — substantive execution or verification.
#   defining   — consequential work that should readily headline a span.
#
# Result visibility remains dynamic on the wire.

# Ordered arg keys tried when a tool has no entry-specific title_keys match.
fallback_title_keys:
  - path
  - file
  - file_path
  - command
  - pattern
  - query
  - name_glob
  - blueprint_path
  - recipe
  - url
  - ref
  - message
  - to_agent
  - tools
  - paths
  - refs

