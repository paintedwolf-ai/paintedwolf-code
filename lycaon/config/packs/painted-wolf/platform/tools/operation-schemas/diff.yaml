tags: [edit, filesystem]
description: "Unified diff between two file paths (read-scope only): relative to the session folder, `@label/path` for any attached folder, `@scratch/path` or `@output/path` for session scratch/output, or absolute."
schema:
  type: object
  properties:
    path_a:
      type: string
      description: "Path to the left/before file: relative to the session folder, `@label/path` for any attached folder, `@scratch/path` or `@output/path`, or absolute"
    path_b:
      type: string
      description: "Path to the right/after file: relative to the session folder, `@label/path` for any attached folder, `@scratch/path` or `@output/path`, or absolute"
    context_lines:
      type: integer
      description: Unified hunk context lines (default 3, max 10)
  required: [path_a, path_b]
  additionalProperties: false
