tags: [edit, filesystem]
description: "Unified diff between two file paths (read-scope only): relative to the session folder, `@label/path` for any attached folder, `@scratch/path` or `@output/path` for session scratch/output, or absolute."
schema:
  type: object
  properties:
    path_a:
      type: string
      description: "Left (before) side of the comparison: bare names sit in the session folder, a leading `@label/` selects an attached folder, `@scratch/` and `@output/` reach the session folders, and absolute locations are accepted"
    path_b:
      type: string
      description: "Right (after) side of the comparison: bare names sit in the session folder, a leading `@label/` selects an attached folder, `@scratch/` and `@output/` reach the session folders, and absolute locations are accepted"
    context_lines:
      type: integer
      description: Unified hunk context lines (default 3, max 10)
  required: [path_a, path_b]
  additionalProperties: false
