tags: [filesystem]
description: "Rename files within write scope; a replaced destination can be undone."
schema:
  type: object
  properties:
    moves:
      description: "Batch of from→to file renames (max 10)."
      type: array
      maxItems: 10
      items:
        type: object
        properties:
          from:
            type: string
            description: "Source file relative to the session folder, `@label/path` for any attached folder, `@scratch/path` for session scratch, or absolute."
          to:
            type: string
            description: "Destination file relative to the session folder, `@label/path` for any attached folder, `@scratch/path` for session scratch, or absolute."
        required: [from, to]
        additionalProperties: false
  required: [moves]
  additionalProperties: false
