tags: [git, mutation]
description: "Stage and commit edited, modified, or new files on the current branch with a message. Use this for the commit step when committing and pushing a branch. amend=true replaces HEAD with the selected paths, including new files, leaving unrelated staged changes alone. Empty paths stages only files this session wrote; name paths explicitly to commit work this session did not write (max 500 paths per commit). Success JSON: available, hash, paths, and uncommitted_paths/uncommitted_count for dirty files this commit left alone. Failure JSON: available=false, error, optional hook_failed, output_tail (last hook/CLI lines), and hint."
schema:
  type: object
  properties:
    message:
      type: string
      description: Commit message
    amend:
      type: boolean
      description: Replace the latest commit with this message and the selected paths. Use only for an authorized amendment; defaults to false.
    paths:
      type: array
      items:
        type: string
      description: "Paths relative to the session folder, `@label/path` for any attached folder, or absolute (empty stages this session's own writes)."
  required: [message]
  additionalProperties: false
