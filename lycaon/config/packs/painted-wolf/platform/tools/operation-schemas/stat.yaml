description: "File metadata (mode, size, mtime, entry_count for directories)"
schema:
  type: object
  properties:
    paths:
      type: array
      items:
        type: string
      maxItems: 50
      description: "Paths relative to the session folder, `@label/path` for any attached folder, `@output/path` for session output, or absolute (max 50)."
  required: [paths]
  additionalProperties: false
