tags: [filesystem]
description: "Copy files within write scope (files only)."
schema:
  type: object
  properties:
    copies:
      description: "Batch of from→to file copies (max 10)."
      type: array
      maxItems: 10
      items:
        type: object
        properties:
          from:
            type: string
            description: "Source file relative to the session folder, `@label/path` for any attached folder, `@output/path` for session output, or absolute."
          to:
            type: string
            description: "Destination file relative to the session folder, `@label/path` for any attached folder, `@scratch/path` for session scratch, or absolute."
        required: [from, to]
        additionalProperties: false
    max_file_bytes:
      type: integer
      minimum: 1
      description: Per-file byte cap (default 10485760)
  required: [copies]
  additionalProperties: false
