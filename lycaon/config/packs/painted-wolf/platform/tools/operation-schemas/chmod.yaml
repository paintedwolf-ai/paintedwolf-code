tags: [filesystem]
description: "Change approval bits on paths relative to the session folder, `@label/path` for any attached folder, `@scratch/path` for session scratch, or absolute."
schema:
  type: object
  properties:
    paths:
      type: array
      items:
        type: string
      maxItems: 20
      description: "Target paths: relative to the session folder, `@label/path` for any attached folder, `@scratch/path` for session scratch, or absolute (capped by maxItems)"
    mode:
      type: string
      description: Symbolic (+x, u+x, -x) or octal allowlist (755, 644, …)
  required: [paths, mode]
  additionalProperties: false
