tags: [filesystem]
description: "Create directories within write scope."
schema:
  type: object
  properties:
    paths:
      type: array
      items:
        type: string
      maxItems: 20
      description: "Directory paths relative to the session folder, `@label/path` for any attached folder, `@scratch/path` for session scratch, or absolute (max 20)."
    mode:
      type: string
      description: Octal allowlist (755 default; same family as chmod)
  required: [paths]
  additionalProperties: false
