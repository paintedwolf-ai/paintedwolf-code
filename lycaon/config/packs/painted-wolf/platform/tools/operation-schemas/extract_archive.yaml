tags: [filesystem]
description: "Unpack .zip or .tar.gz into a write-scoped directory (replaces unzip/tar xzf; HITL ask by default)."
schema:
  type: object
  properties:
    path:
      type: string
      description: "Archive path relative to the session folder, `@label/path` for any attached folder, `@output/path` for session output, or absolute (.zip or .tar.gz only)."
    dest:
      type: string
      description: "Destination directory relative to the session folder, `@label/path` for any attached folder, or `@scratch/path` for session scratch (created when missing; must be under write scope)."
  required: [path, dest]
  additionalProperties: false
