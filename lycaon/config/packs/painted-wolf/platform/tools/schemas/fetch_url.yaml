# Retired mode and dest arguments: use command with portable curl for transfers.
tags: [web, network, research]
description: >-
  Read web sources as extracted markdown with cached line paging and source
  provenance. Large pages return a head and section map; use offset and limit
  to read supporting passages. Images return screened visual captures and
  extracted text. Read-only: raw HTTP transfers and file downloads use portable
  curl through command when offered.
schema:
  type: object
  properties:
    url:
      type: string
      description: HTTP or HTTPS URL
    offset:
      type: integer
      minimum: 1
      description: 1-based start line; defaults to the first line when only limit is given
    limit:
      type: integer
      minimum: 1
      description: Max lines from offset; omit both for head + map
    parallel:
      type: boolean
      default: false
      description: >-
        Run concurrently with sibling fetch_url calls in this assistant
        response. Set true only for already-known independent URLs (max 4). Omit to
        preserve serial execution.
    unredact:
      type: string
      maxLength: 64
      description: >-
        A redaction receipt token from a prior result of this call. Citing it
        asks the user to send the real value; the host decides. Never invent
        one.
  required: [url]
  additionalProperties: false
