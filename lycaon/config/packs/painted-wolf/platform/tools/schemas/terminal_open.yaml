tags: [terminal]
description: >-
  Open a live terminal for an interactive program. Returns a session id and an
  artifact_id image of the first screen; input, read, snapshot and close tools
  attach once it is open.
schema:
  type: object
  properties:
    secret_use: {type: object, additionalProperties: false, required: [services], description: "Origins for `{{paintedwolf-secret:…}}`.", properties: {services: {type: array, minItems: 1, maxItems: 8, description: Origin URLs., items: {type: string, maxLength: 1024}}}}
    command: {type: string, description: "One program's argv; no `&&`, `||` or `;`."}
    cwd: {type: string, description: "Folder path or `@label/...`; the terminal then tracks its own directory."}
    winsize: {type: object, additionalProperties: false, required: [cols, rows], description: Dimensions; default 80x24., properties: {cols: {type: integer, minimum: 1, maximum: 240, description: Columns.}, rows: {type: integer, minimum: 1, maximum: 120, description: Rows.}}}
    env: {type: object, additionalProperties: {type: string}, description: Inline env (sanitized).}
    observe: {type: string, enum: [ack, delta, screen], default: screen, description: "Return ack, one output delta, or the settled screen."}
    socks_proxy: {type: boolean, description: SOCKS5h proxy.}
    capability_request:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Extra access this terminal needs; a server binding a named port needs local_listen. Network destinations run under command.
      properties:
        host_resources: {type: array, minItems: 1, maxItems: 16, description: Service IDs., items: {type: string}}
        socket_paths: {type: array, minItems: 1, maxItems: 8, items: {type: string}, description: "Exact service path. External argv or env values use a whole `{{paintedwolf-socket:/absolute/path}}` reference. Clients needing a Unix URL use `{{paintedwolf-socket:unix-url:/absolute/path}}`. macOS datagrams use `{{paintedwolf-socket:unixgram:/absolute/path}}`; Linux confinement refuses Unix datagrams. Native socket arguments use the path."}
        local_listen: {type: object, additionalProperties: false, description: Listen ports., properties: {ports: {type: array, minItems: 1, maxItems: 8, description: Ports., items: {type: integer, minimum: 1, maximum: 65535}}}}
        loopback_connect: {type: object, additionalProperties: false, description: Client ports., properties: {ports: {type: array, minItems: 1, maxItems: 8, description: Ports., items: {type: integer, minimum: 1, maximum: 65535}}}}
        write_root: {type: string, maxLength: 1024, description: "Absolute path needing write authority; protected files need the exact path. Instruction and settings files need command."}
        read_path: {type: string, maxLength: 1024, description: Absolute protected path to read.}
  required: [command]
  additionalProperties: false
