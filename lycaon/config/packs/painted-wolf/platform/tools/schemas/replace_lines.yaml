tags: [edit, filesystem]
description: "Atomically replace or reindent line ranges. Use direct fields once, or operations for coupled non-overlapping seams in one snapshot. Read existing editable files in an earlier response before applying changes; concurrent edits rebase against that read. EDITOR_DOCUMENT_READ_REQUIRED or EDITOR_DOCUMENT_CHANGING requires read and recomputation."
schema:
  type: object
  properties:
    path:
      type: string
      description: Repo-relative path
    start_line:
      type: integer
      description: First line (1-based, inclusive)
    end_line:
      type: integer
      description: Last line (1-based, inclusive)
    new_content:
      type: string
      description: Complete replacement; empty deletes the range
    operations:
      type: array
      minItems: 1
      maxItems: 64
      description: Non-overlapping operations in original coordinates
      items:
        type: object
        properties:
          kind:
            type: string
            enum: [replace, shift_indent, indent, dedent]
            description: "Operation kind: replace (substitute text), indent (add prefix), dedent (remove prefix), or shift_indent (specify direction)"
          start_line:
            type: integer
            minimum: 1
            description: First line (1-based, inclusive)
          end_line:
            type: integer
            minimum: 1
            description: Last line (1-based, inclusive)
          new_content:
            type: string
            description: "Replacement content (for kind: replace; empty deletes the range)"
          direction:
            type: string
            enum: [indent, dedent]
            description: "Direction for shift_indent (indent or dedent)"
          prefix:
            type: string
            minLength: 1
            pattern: '^[ \t]+$'
            description: "Whitespace prefix to add or remove (defaults to 4 spaces for indent/dedent)"
        required: [kind, start_line, end_line]
        additionalProperties: false
    syntax_override_reason:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: '\S'
      description: Recorded reason to override final syntax validation for this call. Other mutation checks still apply.
    resolve_secret_references:
      type: boolean
      description: Whether to resolve managed secret references in new_content. Defaults to true.
  required: [path]
  oneOf:
    - required: [start_line, end_line, new_content]
      not: {required: [operations]}
    - required: [operations]
      not:
        anyOf:
          - required: [start_line]
          - required: [end_line]
          - required: [new_content]
  additionalProperties: false
