tags: [edit, filesystem]
description: "Paths accept @scratch/<path> for private working files. Create a new file, replace a file's full content, or append with append: true. Supported source must parse (MUTATION_BROKE_PARSE). Scope violation: WRITE_SCOPE_DENIED. Read existing editable files in an earlier response; concurrent edits rebase against it. EDITOR_DOCUMENT_READ_REQUIRED or EDITOR_DOCUMENT_CHANGING requires rereading. Replaces command: cat <<EOF > file / tee file."
schema:
  type: object
  properties:
    path:
      type: string
      description: Repo-relative file path
    content:
      type: string
      description: Full file contents to write (or the chunk to append)
    append:
      type: boolean
      description: Append to an existing file (rejects missing files); use chunks for payloads too large for one call
    syntax_override_reason:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: '\S'
      description: Recorded reason to override final syntax validation for this call. Other mutation checks still apply.
    resolve_secret_references:
      type: boolean
      description: Whether to resolve managed secret references in content. Defaults to true.
  required: [path, content]
  additionalProperties: false
