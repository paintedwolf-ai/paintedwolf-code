tags: [visual, browser, inspection]
description: >-
  Measure selector geometry in CSS pixels, and whether the pointer can reach each element or
  what covers or clips it. Use id for an existing live page, or one exclusive project_dir/loopback
  url target. annotate adds boxes; page_geometry remains the numeric evidence.
schema:
  type: object
  properties:
    id:
      type: string
      description: >-
        Live page id from page_open; preserves its current state. Do not combine with one-shot fields.
    project_dir:
      type: string
      description: >-
        Sandboxed file-tree probe for plain HTML/CSS/JS or a built static export. Host serves
        in-process via CDP (no TCP). Mount the site/export root (not a leaf page folder). Use
        path for nested pages. Absolute production asset paths under the mount are fulfilled
        from disk. Use url for bundler/dev/SSR or when running fidelity matters.
    path:
      type: string
      description: >-
        Optional site-relative path within project_dir (e.g. /talks/). Only valid with project_dir.
    url:
      type: string
      description: >-
        Loopback http(s) URL of a running app (127.0.0.1 / localhost / ::1 only). For
        agent-started servers, pass process_handle from command background:true. Not file://.
    process_handle:
      type: string
      description: Optional bgprocess handle from command background:true. When set, the handle must still be running in this session.
    selectors:
      type: array
      description: >-
        CSS selectors from structural evidence or stable ids/testids; each resolves to one node.
      minItems: 1
      maxItems: 16
      items:
        type: string
        minLength: 1
    metrics:
      type: array
      description: Optional getComputedStyle property names (default padding/margin/font-size/color/background-color/z-index).
      items:
        type: string
        minLength: 1
    viewport:
      description: "Optional one-shot viewport; a live page keeps its viewport."
      type: object
      properties:
        width:
          description: "Viewport width in CSS pixels."
          type: integer
          minimum: 1
        height:
          description: "Viewport height in CSS pixels."
          type: integer
          minimum: 1
      required: [width, height]
      additionalProperties: false
    wait:
      type: string
      enum: [idle]
      description: Settle one-shot navigation before measuring.
    annotate:
      type: boolean
      description: When true, attach a source:capture overlay screenshot with bounding boxes (show/perceive only — measurements remain text).
    caption:
      type: string
      description: Short label on the optional overlay artifact card.
    capability_request:
      type: object
      description: >-
        Loopback authority for a url target. Not needed for project_dir, which
        serves from disk and opens no socket.
      properties:
        loopback_connect:
          type: object
          description: Loopback authority for exact ports.
          properties:
            ports:
              type: array
              minItems: 1
              maxItems: 8
              uniqueItems: true
              description: Loopback TCP ports this target may connect to.
              items: {type: integer, minimum: 1, maximum: 65535}
          additionalProperties: false
      required: [loopback_connect]
      additionalProperties: false
  required: [selectors]
  additionalProperties: false
