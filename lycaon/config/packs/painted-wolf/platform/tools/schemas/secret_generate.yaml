tags: [secrets, security]
description: Generate random secret material and return an opaque {{paintedwolf-secret:…}} reference for tool execution.
schema:
  type: object
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 80
      description: Reference label.
    purpose:
      type: string
      minLength: 1
      maxLength: 240
      description: Intended use. For project scope, name the later chat's need.
    scope:
      type: string
      enum: [chat, project]
      default: chat
      description: Which chats may use the reference.
    format:
      type: string
      enum: [base64url, hex, alphanumeric]
      default: base64url
      description: Generated alphabet.
    bytes:
      type: integer
      minimum: 16
      maximum: 128
      default: 32
      description: Entropy bytes.
    agent_use_ttl_seconds:
      type: integer
      minimum: 60
      maximum: 31536000
      description: Agent-use lifetime; reveal persists.
  required: [name]
  allOf:
    - if:
        properties:
          scope: { const: project }
        required: [scope]
      then:
        required: [purpose]
  additionalProperties: false
