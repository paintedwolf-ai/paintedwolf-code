description: >-
  Merge preview of a result handle — same plan as promote_overlay without landing.
  Returns path_status and ready_resolutions; spill_path is
  host-data-relative (promote-spills/<id>.json). Example: {"overlay_id":"<result handle>"}.
schema:
  type: object
  properties:
    overlay_id:
      type: string
      description: The result handle from the worker's result notice or the roster.
    path:
      type: string
      description: Optional — scope preview to one repo-relative path
    detail:
      type: string
      enum: [hunks, full]
      description: Conflict shape — hunks (default) or full; spill_path for complete bodies
  required: [overlay_id]
  additionalProperties: false
