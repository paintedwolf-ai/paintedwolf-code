tags: [process, verification]
description: >-
  Run a verification check as a Bash program. Omit command to run the selected
  project check; a different command is rejected while one is selected. Use
  command with verification:true for targeted checks. Pipes, redirects and jobs
  use command syntax. A running program has no verdict: wait for its check to
  finish. Source-bound receipts report passed, failed or unverifiable; selecting
  a check does not require repeating it after every edit.
schema:
  type: object
  properties:
    secret_use:
      type: object
      additionalProperties: false
      required: [services]
      description: >-
        Use only when this invocation passes a managed secret reference (`{{paintedwolf-secret:…}}`) from secret input or the vault; programs using their own stored login need no `secret_use`. Request one reusable permission for the managed secrets used by this
        process and their later use with the named HTTP services. The person
        reviews both process access and these declared service addresses.
        This does not claim the process or a daemon sends only to those services.
        Put connection and socket requirements in capability_request as usual.
      properties:
        services:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            maxLength: 1024
          description: Exact HTTP origins (scheme, host, port), without paths, query parameters, or credentials.
    command: {type: string, description: "Bash source. Leave empty for the default."}
    cwd: {type: string, description: "Folder path, `@label/...`, or `@scratch/...`."}
    timeout_ms: {type: integer, minimum: 1000, maximum: 7200000, description: Deadline ms.}
    socks_proxy: {type: boolean, default: false, description: SOCKS5h proxy.}
    capability_request:
      type: object
      description: >-
        Declares the resources this check needs before execution, using the
        same fields as command. Listening and loopback connecting are separate
        authorities. Narrow each request to the required resource; the host
        reviews it before spawn. Omit for ordinary execution.
      properties:
        host_resources:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
          description: Available host-resource ids; the host resolves their connection routes.
        socket_paths:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
          description: "Exact AF_UNIX service paths, as a whole `{{paintedwolf-socket:/absolute/path}}` reference for an external program."
        process_control:
          description: "`true` requests signaling outside the command sandbox; actual signal targets are unobserved."
          oneOf:
            - type: boolean
              enum: [true]
            - type: object
              additionalProperties: false
        credential_store:
          type: boolean
          enum: [true]
          description: "`true` requests read-only access to the host OS credential store."
        host_execution:
          description: "`true` requests execution outside the command sandbox, with effects unobserved. Cannot combine with other capability_request fields or socks_proxy."
          oneOf:
            - type: boolean
              enum: [true]
            - type: object
              additionalProperties: false
        direct_ip:
          description: "`true` or a destination list requests direct outbound IP; actual destinations are unobserved."
          oneOf:
            - type: boolean
            - type: array
              maxItems: 16
              items:
                type: string
                maxLength: 256
            - type: object
              additionalProperties: false
              properties:
                declared_destinations:
                  type: array
                  description: "Destinations as host:port with an explicit port and optional tcp:// or udp:// scheme."
                  maxItems: 16
                  items:
                    type: string
                    maxLength: 256
        local_listen:
          type: object
          description: "Local listener authority. Declare ports to narrow it; {} requests any local port."
          properties:
            ports:
              type: array
              minItems: 1
              maxItems: 8
              items:
                type: integer
                minimum: 1
                maximum: 65535
              description: Exact local ports to narrow the profile to.
          additionalProperties: false
        loopback_connect:
          type: object
          description: "Authority to connect to services on this machine. Declare ports when known; {} requests any local port."
          properties:
            ports:
              type: array
              minItems: 1
              maxItems: 8
              items:
                type: integer
                minimum: 1
                maximum: 65535
              description: Exact destination ports on this machine.
          additionalProperties: false
        write_root:
          type: string
          maxLength: 1024
          description: "One absolute path this check must write outside its project and default cache roots. Reviewed before spawn."
        read_path:
          type: string
          maxLength: 1024
          description: "One absolute protected path this invocation must read. Reviewed before spawn."
      additionalProperties: false
      minProperties: 1
  additionalProperties: false
