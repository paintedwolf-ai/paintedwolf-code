tags: [process, sync]
description: "Observe conditions asynchronously while continuing work. Returns a handle and watch_match condition for wait (call wait directly if blocked now)."
schema:
  type: object
  properties:
    conditions:
      type: array
      minItems: 1
      maxItems: 8
      uniqueItems: true
      description: 1-8 alternatives (refuses watch_match).
      items:
        type: object
        properties:
          kind:
            type: string
            enum: [next_worker_done, all_workers_idle, overlay_promote_pending, scan_done, process_done, http_ready, port_ready, worker_decision_needed, worker_failed, process_output, file_change, git_ref, timer]
            description: Condition kind.
          handles:
            type: array
            minItems: 1
            maxItems: 8
            uniqueItems: true
            items: {type: string, minLength: 1}
            description: Command or worker handles.
          handle:
            type: string
            minLength: 1
            description: Output command handle.
          cursor:
            type: integer
            minimum: 0
            description: Start cursor.
          url: {type: string, description: HTTP(S) URL.}
          method: {type: string, enum: [GET, HEAD], default: GET, description: Probe method.}
          status_min: {type: integer, minimum: 100, maximum: 599, default: 200, description: Min status.}
          status_max: {type: integer, minimum: 100, maximum: 599, default: 399, description: Max status.}
          host: {type: string, default: localhost, description: Loopback host.}
          port: {type: integer, minimum: 1, maximum: 65535, description: TCP port.}
          root: {type: string, minLength: 1, description: Folder label.}
          path: {type: string, minLength: 1, description: Root-relative path.}
          glob: {type: string, maxLength: 256, description: Optional glob.}
          include_own: {type: boolean, default: false, description: Include own edits.}
          ref: {type: string, minLength: 5, description: Full refs/ name.}
          delay_ms: {type: integer, minimum: 1000, description: Delay ms.}
          at: {type: string, description: Local YYYY-MM-DDTHH:MM.}
          calendar:
            type: object
            description: Calendar schedule.
            properties:
              days:
                type: array
                minItems: 1
                maxItems: 7
                uniqueItems: true
                description: Schedule days.
                items:
                  type: string
                  enum: [every_day, weekdays, monday, tuesday, wednesday, thursday, friday, saturday, sunday]
              times:
                type: array
                minItems: 1
                maxItems: 8
                uniqueItems: true
                items: {type: string, minLength: 5, maxLength: 5}
                description: Local HH:MM.
            required: [days, times]
            additionalProperties: false
          time_zone: {type: string, description: IANA zone.}
        required: [kind]
        additionalProperties: false
    delivery:
      type: string
      enum: [collect, wake]
      default: collect
      description: collect (next turn) or wake (idle turn).
    repeat:
      type: boolean
      default: false
      description: Keep live after match.
    expires_at:
      type: string
      description: RFC 3339 expiry (1m-30d).
    standing:
      type: object
      description: Draft a person-owned standing watch (timer/git_ref/file_change; collect).
      properties:
        name: {type: string, minLength: 1, maxLength: 80, description: Watch name.}
        prompt: {type: string, minLength: 1, maxLength: 8000, description: Run prompt.}
        replaces: {type: string, description: Existing standing watch UUID.}
      required: [name, prompt]
      additionalProperties: false
    capability_request:
      type: object
      description: Loopback port grant.
      properties:
        loopback_connect:
          type: object
          description: Loopback port list.
          properties:
            ports:
              type: array
              minItems: 1
              maxItems: 8
              uniqueItems: true
              description: Loopback TCP ports.
              items: {type: integer, minimum: 1, maximum: 65535}
          additionalProperties: false
      required: [loopback_connect]
      additionalProperties: false
  required: [conditions]
  additionalProperties: false
