description: "Inspect the worker roster and project state. Recent and unresolved workers appear first; use cursor for older workers and plan to filter by Blueprint."
schema:
  type: object
  properties:
    plan:
      type: string
      description: Filter the worker roster to workers bound to the matching Blueprint path.
    cursor:
      type: string
      description: Continuation token to page older workers beyond the current roster page.
    detail_level:
      type: string
      enum: [status, compact, full, forensic]
      description: "status: board summary and pulse. compact (default): worker states, result dispositions, workspace state, and paths. full: adds worker briefs, instructions, and questions. forensic: adds host job records per worker."
  additionalProperties: false
