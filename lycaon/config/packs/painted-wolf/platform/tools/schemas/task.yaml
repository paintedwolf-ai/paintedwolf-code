description: >-
  Start background workers for parallel execution across concurrent legs
  and return control immediately. Dispatch ready legs together in the same turn
  or launch companion legs while work runs. For single-thread, localized changes,
  execute inline directly. Write workers execute inside a private view with no remote or publish capability; sibling workers' changes do not appear until they land. Version-control inspection, committing, and any publication steps belong to the coordinator on the host workspace after promotion. Use after_workers when a worker needs completed producer files. Match the worker profile and scope to the assignment. Returns the worker's name; follow-up work that builds on what a worker learned goes back to that worker instead of a new one.
schema:
  type: object
  additionalProperties: false
  properties:
    after_workers:
      type: array
      maxItems: 32
      uniqueItems: true
      items:
        type: string
        minLength: 1
        maxLength: 64
      description: Names of workers in this session whose outputs this fresh worker needs. The host starts this worker once each producer has delivered a complete result and its writes have landed; a producer sent back for corrections holds it until it delivers again. Cannot combine with base_overlay_id.
    shared_context:
      type: string
      description: Shared interface agreements and assumptions for this worker, up to 8192 UTF-8 bytes. Copy the same relevant contracts to collaborating assignments; workers do not inherit the parent conversation or sibling files.
    workflow_work_id:
      type: string
      description: Host-issued work id for a planned leg or registered review question. Planned legs supply omitted agent_type and scope; questions require an explicit agent and read scope.
    agent_type:
      description: "Worker agent id. Omit when dispatching a planned leg, which supplies it."
      type: string
    brief:
      description: >-
        Structured worker charter, capped at 4096 runes across its text fields.
        Do not assign git commit, git push, branch/tag operations, release
        publication, or external publishing inside a worker brief or acceptance
        criteria. Parent-session attachments are forwarded by the host as
        header-only handles; cite their names in context_refs instead of pasting
        bodies or inventing host-data paths.
      type: object
      additionalProperties: false
      properties:
        goal:
          description: One focused, observable objective for this leg.
          type: string
          minLength: 1
          maxLength: 1000
        known_facts:
          description: Material facts the cold-start worker cannot recover from the parent conversation.
          type: array
          maxItems: 6
          items:
            type: string
            minLength: 1
        constraints:
          description: Decisions, exclusions, or boundaries the worker must preserve.
          type: array
          maxItems: 6
          items:
            type: string
            minLength: 1
        done_when:
          description: Concrete acceptance criteria that let the worker stop.
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
            minLength: 1
        context_refs:
          description: Compact path, symbol, attachment-name, or prior-result references; never pasted bodies.
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 240
      required: [goal, done_when]
    review_of:
      type: string
      description: Optional result handle of a delivered worker's result with changes. Starts a reviewer that reads a read-only view of exactly that result, whatever its worker does next. Needs read scope and a read agent; cannot combine with base_overlay_id, after_workers or workflow_work_id. Starting the review accounts for the result.
    name:
      type: string
      minLength: 1
      maxLength: 64
      description: Optional worker name, unique in this session; the host names the worker after its agent when omitted.
    files:
      description: "Optional repo-relative files to emphasize for the worker."
      type: array
      maxItems: 12
      items:
        type: string
        minLength: 1
        maxLength: 240
    scope:
      description: "Worker mode and optional assignment paths. Paths guide focus only."
      type: object
      additionalProperties: false
      properties:
        mode:
          description: "read for survey; write for a private view that lands by promotion, with no remote or publish capability (required when the profile can mutate)."
          type: string
          enum: [read, write]
        paths:
          type: array
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 240
          description: >-
            Optional repo-relative paths or slash globs that guide the worker's
            focus. They do not grant, restrict, or filter tool access, mutations,
            verification, or promotion.
        base_overlay_id:
          type: string
          description: Optional result handle of another worker's unlanded write result; this worker starts on top of those changes instead of current source.
  anyOf:
    - required: [brief]
    - required: [workflow_work_id]
