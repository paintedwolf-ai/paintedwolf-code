description: >-
  Start background workers for parallel execution across concurrent legs
  and return control immediately. Dispatch ready legs together in the same turn
  or launch companion legs while work runs. For single-thread, localized changes,
  execute inline directly. Write workers use private snapshots; sibling files do not appear live. Use after_workers when a worker needs completed producer files. Match the worker profile and scope to the assignment.
schema:
  type: object
  additionalProperties: false
  properties:
    after_workers:
      type: array
      maxItems: 32
      uniqueItems: true
      items:
        type: string
        format: uuid
      description: Existing sibling job IDs whose outputs this fresh worker needs. The host waits for successful completion and promotion of writes before starting. Unusable producer output cancels waiting consumers. Cannot combine with child_session_id or base_overlay_id.
    shared_context:
      type: string
      description: Shared interface agreements and assumptions for this worker, up to 8192 UTF-8 bytes. Copy the same relevant contracts to collaborating assignments; workers do not inherit the parent conversation or sibling files.
    workflow_work_id:
      type: string
      description: Host-issued work id for a planned leg or registered review question. Planned legs supply omitted agent_type, scope, and max_tool_loops; questions require an explicit agent and read scope. A resume retains its child's work id.
    agent_type:
      description: "Worker agent id. Omit when resuming a child or dispatching a planned leg; either one supplies it."
      type: string
    brief:
      description: >-
        Structured worker charter, capped at 4096 runes across its text fields.
        Parent-session attachments are forwarded by the host as header-only
        handles; cite their names in context_refs instead of pasting bodies or
        inventing host-data paths.
      type: object
      additionalProperties: false
      properties:
        goal:
          description: One focused, observable objective for this leg.
          type: string
          minLength: 1
          maxLength: 1000
        known_facts:
          description: Material facts the cold-start worker cannot recover from the parent conversation.
          type: array
          maxItems: 6
          items:
            type: string
            minLength: 1
            maxLength: 500
        constraints:
          description: Decisions, exclusions, or boundaries the worker must preserve.
          type: array
          maxItems: 6
          items:
            type: string
            minLength: 1
            maxLength: 500
        done_when:
          description: Concrete acceptance criteria that let the worker stop.
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
            minLength: 1
            maxLength: 500
        context_refs:
          description: Compact path, symbol, attachment-name, or prior-result references; never pasted bodies.
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 240
      required: [goal, done_when]
    max_tool_loops:
      type: integer
      minimum: 2
      maximum: 120
      description: >-
        Optional worker tool-round ceiling (range 2-120). Omitted uses the planned
        leg's ceiling, a resumed child's ceiling raised to its unanswered
        request, or the host default. The host never raises a ceiling on its own;
        a worker asks with request_budget and you grant with extend_worker_budget.
        The final round offers only complete_leg.
    child_session_id:
      type: string
      description: >-
        Resume an existing worker child session instead of spawning a new one.
        The resume keeps the child's agent_type, scope mode, and planned leg;
        restating a different agent_type or scope mode is rejected.
    files:
      description: "Optional repo-relative files to emphasize for the worker."
      type: array
      maxItems: 12
      items:
        type: string
        minLength: 1
        maxLength: 240
    scope:
      description: "Worker mode and optional assignment paths. Paths guide focus only."
      type: object
      additionalProperties: false
      properties:
        mode:
          description: "read for survey; write for overlay landing (required when the profile can mutate)."
          type: string
          enum: [read, write]
        paths:
          type: array
          maxItems: 12
          items:
            type: string
            minLength: 1
            maxLength: 240
          description: >-
            Optional repo-relative paths or slash globs that guide the worker's
            focus. They do not grant, restrict, or filter tool access, mutations,
            verification, or promotion.
        base_overlay_id:
          type: string
          description: Optional. Stacked-overlay base — names another pending write overlay to dispatch on top of (instead of primary). Empty means based on primary.
  required: [brief]
