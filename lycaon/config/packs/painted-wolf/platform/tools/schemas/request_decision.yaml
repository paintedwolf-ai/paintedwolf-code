description: Ask your coordinator a question you cannot proceed without — offer two or more concrete options when they are natural, or none for an open question. The accepted call suspends your run; the coordinator answers and you resume with the same workspace. To tell your coordinator something without stopping, send a message instead. Do not also call complete_leg.
schema:
  type: object
  properties:
    question:
      type: string
      description: The decision you're blocked on (cite the real constraint).
    options:
      type: array
      items:
        type: string
      description: Optional; 2+ concrete, mutually-exclusive options when the choice has them.
    blocker_class:
      type: string
      enum: [decision, checkpoint, sandbox]
      description: >-
        Machine class of the blocker — decision (coordinator may answer),
        checkpoint (user must approve child HITL), sandbox (confinement
        write-boundary or true host-env block after write-root declaration — not
        missing paths, typos, or bad cwd; those are decision or fix-and-retry).
    artifact_id:
      type: string
      format: uuid
      description: Optional image/screenshot id from this session for the coordinator to judge.
    artifact_ids:
      type: array
      uniqueItems: true
      minItems: 2
      maxItems: 4
      items:
        type: string
        format: uuid
      description: Optional 2–4 image ids when asking which variant to prefer (A/B…).
  required: [question]
  additionalProperties: false
