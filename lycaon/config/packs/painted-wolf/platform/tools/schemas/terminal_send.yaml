tags: [terminal]
description: >-
  Write literal text and/or named control tokens ({Enter}, {Ctrl-C}, …) to a
  held pty, then return the settled vt grid. Never send known plaintext passwords,
  tokens, or passphrases. An opaque {{paintedwolf-secret:…}} reference is allowed when the
  interactive prompt is the consuming boundary; the host resolves and screens it.
schema:
  type: object
  properties:
    secret_use: {type: object, additionalProperties: false, required: [services], description: "Origins for `{{paintedwolf-secret:…}}`.", properties: {services: {type: array, minItems: 1, maxItems: 8, description: Origin URLs., items: {type: string, maxLength: 1024}}}}
    id: {type: string, description: Handle from terminal_open.}
    input: {type: string, description: "Payload to type; {LeftBrace} and {RightBrace} type braces; protected references insert as bytes."}
    observe: {type: string, enum: [ack, delta, screen], default: screen, description: "Return ack, one output delta, or the settled screen."}
  required: [id, input]
  additionalProperties: false
