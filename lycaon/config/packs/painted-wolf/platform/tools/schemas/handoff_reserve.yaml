description: Record session-folder-relative path reservations on the parent session plane (informational; merge resolves overlaps).
schema:
  type: object
  properties:
    session_id:
      description: "Parent session id (defaults to caller session)."
      type: string
    agent:
      description: "Worker job id or agent id (defaults to caller binding)."
      type: string
    paths:
      description: "Session-folder-relative paths or slash globs to reserve on the handoff plane (reservation keys, not addressed paths — `@label/` prefixes do not resolve here)."
      type: array
      items:
        type: string
  required: [paths]
  additionalProperties: false
