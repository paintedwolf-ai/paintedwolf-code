description: >-
  Structured question for the user — this tool is the only way to ask one, and
  assistant prose is not an answer. Host parks until the user resolves; next wake
  returns this tool result. Prefer choices[] when present. Parallel while pending →
  ASK_USER_ALREADY_PENDING. Fill args per field docs below.
schema:
  type: object
  properties:
    prompt:
      type: string
      maxLength: 800
      description: >-
        One decision, short enough to read and answer at a glance — roughly 8–10 lines
        as the user sees it. Markdown OK for brief context only. Prefer choice options
        over multi-question text dumps. The host hard-caps at 800 Unicode code points
        after trim and rejects with ASK_USER_PROMPT_TOO_LONG.
    purpose:
      type: string
      enum: [clarify, review, compare]
      description: >-
        Optional ask mode, inferred when omitted: clarify with no artifacts, review with
        1–4 artifacts (open feedback or review choices). compare (choose between 2–4
        visual variants) is explicit. A purpose that does not fit the artifacts →
        ASK_USER_PURPOSE_INVALID.
    response_type:
      type: string
      enum: [text, single_choice, multi_choice, secret]
      description: >-
        Feedback response kind (default text). Use secret only when the user must provide a
        credential; the value goes directly into protected storage and the tool
        receives only a managed reference. Secret responses cannot include artifacts
        or options. For artifacts, text collects open critique, and single_choice uses
        Approve/Request changes/Reject (review) or variant picks (compare).
    options:
      type: array
      maxItems: 6
      items: { type: string }
      description: >-
        Choice options (≥2; cap 6 → ASK_USER_OPTIONS_TOO_MANY — prefer 2–4). No
        Other option (composer accepts off-menu). Forbidden on text and secret
        (ASK_USER_OPTIONS_FORBIDDEN), and on compare where host labels A/B/C/D.
    artifacts:
      type: array
      maxItems: 4
      items: { type: string }
      description: >-
        Session-tree visual UUIDs, evidence handles, or workspace image paths
        (.png, .jpg, .jpeg, .webp, .gif, .svg), 1–4. Visuals default to review (open
        text or host Approve/Changes/Reject); purpose: compare evaluates 2–4
        alternatives with synthesized variant choices A… Passing options on compare
        → ASK_USER_COMPARE_OPTIONS.
    secret:
      type: object
      description: Required when response_type is secret; forbidden otherwise.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Short user-visible name for the managed secret.
        purpose:
          type: string
          maxLength: 240
          description: Why the agent needs this value. Required for project scope.
        scope:
          type: string
          enum: [chat, project]
          default: chat
          description: Chat scope lets only this chat and its workers use the reference; project scope lets later chats use it too.
        agent_use_ttl_seconds:
          type: integer
          minimum: 0
          maximum: 31536000
          description: Agent-use lifetime; 0 means none. Human reveal still works.
      required: [name]
      additionalProperties: false
      allOf:
        - if:
            properties:
              scope: {const: project}
            required: [scope]
          then:
            required: [purpose]
  allOf:
    - if:
        properties:
          response_type: {const: secret}
        required: [response_type]
      then:
        required: [secret]
        properties:
          artifacts: {maxItems: 0}
          options: {maxItems: 0}
      else:
        not:
          required: [secret]
    - if:
        properties:
          artifacts: {minItems: 1}
        required: [artifacts]
      then:
        properties:
          response_type: {enum: [text, single_choice]}
  required: [prompt]
  additionalProperties: false
