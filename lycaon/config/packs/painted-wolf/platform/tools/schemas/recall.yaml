description: >-
  Recover recorded observations or original messages. Use query or own-session
  history coordinates. Branch on resolution and next_action; check source currency.

schema:
  type: object
  properties:
    query:
      type: string
      minLength: 1
      description: >-
        Exact handle lookup: handle:read#3. Free terms are ANDed; AND, OR, NOT and
        parentheses are supported. Filters: agent:scout, leg:<id>, session:<id>,
        tool:read, after:2026-08-01, before:2026-08-02, kind:evidence, path:src/*.go,
        url:<url>, untrusted:true, verified:false, run:<id>.
    history:
      type: object
      description: >-
        Page transcript index or load a message body within through_ord. Cannot
        combine with query or widen.
      properties:
        search: {type: string, minLength: 1, maxLength: 256, description: "Up to eight literal terms, all required."}
        format: {type: string, enum: [text, record], description: "Body format. record includes original parts and arguments; concatenate pages before parsing."}
        body_runes: {type: integer, minimum: 1, maximum: 4096, description: "Unicode characters per body page."}
        after_ord: {type: integer, minimum: 0, description: "Start index after this ordinal."}
        through_ord: {type: integer, minimum: 1, description: "Inclusive upper ordinal bound."}
        source_seq: {type: integer, minimum: 0, description: "Sequence stamp to detect row edits."}
        message_id: {type: string, minLength: 1, description: "Row ID to read in full pages."}
        offset: {type: integer, minimum: 0, description: "Unicode character offset for body paging."}
      required: [through_ord]
      additionalProperties: false
    widen:
      type: string
      enum: [subtree, project, all]
      description: >-
        Default: your session and worker legs. subtree keeps that scope; project
        searches this project's sessions; all searches attached projects. Workers
        cannot widen. History recovery always stays in your own session.
    limit:
      type: integer
      minimum: 1
      maximum: 50
      description: >-
        Maximum rows to return (default 20). A broad answer returns snippets and
        facets instead of bodies; narrow the query to get bodies back.
  oneOf:
    - required: [query]
    - required: [history]
  additionalProperties: false
