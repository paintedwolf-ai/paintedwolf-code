description: >-
  Look up what was already observed instead of observing it again. Reach for
  it when a finished worker leg's envelope omits a detail the leg saw, when a
  continuation record or a `[compacted …]` banner names a handle whose body is
  gone from context, or — from a root session — when an earlier session on
  this project may already have looked (`widen`). It reads the recorded index,
  not the working tree: use grep or read for files as they are now. Branch on
  the result's `resolution`, never on the row count: `no_match_in_scope` means
  this scope observed something but not that, `scope_empty` means nothing here
  has been observed yet (dispatch or observe it yourself; do not search again),
  `record_deleted` means it existed and is gone, `executor_degraded` is never
  evidence of absence. Do what `next_action` says. Each hit states
  `observed_at` and `currency` — a `changed` hit describes the file as it was,
  not as it is. Re-asking one question with a different phrasing does not
  change the answer.
schema:
  type: object
  properties:
    query:
      type: string
      minLength: 1
      description: >-
        Search terms plus optional filters, combined with AND / OR / NOT and
        parentheses. Addressing beats searching: handle:read#3 returns that one
        observation, which is the surest lookup when a leg, a continuation
        record, or a compaction banner named its handle. Otherwise narrow with
        agent:scout, leg:<id>, session:<id>, tool:read, after:2026-08-01 before
        free text. Also available — kind:evidence, path:src/*.go, url:<url>,
        untrusted:true, verified:false, run:<id>.
    widen:
      type: string
      enum: [subtree, project, all]
      description: >-
        Scope beyond the default. Omit for the default — your own session and
        its worker legs. project searches every session in this project, which
        is how an earlier session's observations are reached; all searches
        every attached project. Worker legs may not widen.
    limit:
      type: integer
      minimum: 1
      maximum: 50
      description: >-
        Maximum rows to return (default 20). A broad answer returns snippets and
        facets instead of bodies; narrow the query to get bodies back.
  required: [query]
  additionalProperties: false
