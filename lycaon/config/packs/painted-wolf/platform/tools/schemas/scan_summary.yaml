tags: [scans]
description: >-
  Read status and guidance for one or more scans. One id reads one scan; the exact
  id array returned by scan_pack reads that pack as a single cross-engine aggregate,
  and a pass_id reads a full pass, including scanners that have not started yet.
  This is the first call after a scan completes — start here rather than grepping
  the repo for findings. Use scan_query for paginated findings.
schema:
  type: object
  properties:
    scan_ids:
      type: array
      minItems: 1
      uniqueItems: true
      description: >-
        Complete scan identifiers to summarize together. Give scan_ids or pass_id.
      items:
        type: string
    pass_id:
      type: string
      description: >-
        A full pass id from scan_pack. Returns the pass's scan_ids with the
        cross-engine aggregate once every scanner has finished.
    view:
      type: string
      enum: [summary, full]
      description: summary (default) or full.
  additionalProperties: false
