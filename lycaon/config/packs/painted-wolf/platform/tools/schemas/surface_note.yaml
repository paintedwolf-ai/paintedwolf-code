description: >-
  Send a grounded user-visible update and keep working. Assistant text with tool
  calls is hidden. Use for meaningful updates or mid-task answers, including
  before waiting. Cite observed evidence or URLs; artifact_ids shows stills.
  Use ask_user for decisions and a no-tool reply for closeout.
schema:
  type: object
  properties:
    summary:
      type: string
      minLength: 1
      maxLength: 600
      description: >-
        One short paragraph the user should see now, displayed verbatim.
        Grounding comes from the citation fields below.
    cited_evidence:
      type: array
      maxItems: 32
      items:
        type: string
        minLength: 1
      description: >-
        A handle copied verbatim from a [kind#ordinal] tag you have seen
        (read#3, command#11), or path:line with a single line number
        (src/a.go:42) — one line, not a range, not a bare path.
    cited_urls:
      type: array
      maxItems: 16
      description: >-
        Absolute http(s) URLs observed in this session.
      items:
        type: string
        minLength: 1
    artifact_ids:
      type: array
      maxItems: 4
      items:
        type: string
        minLength: 1
      description: >-
        Producer artifact_id values to show on this note — the mid-run present
        path, since a capture otherwise stays folded in the tool row that took
        it. Each id names a still this turn produced.
  required: [summary]
  additionalProperties: false
