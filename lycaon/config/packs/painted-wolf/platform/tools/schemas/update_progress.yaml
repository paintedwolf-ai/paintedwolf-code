description: Set session progress checklist (markdown). Replaces the whole checklist — see content for markers and caps.
schema:
  type: object
  properties:
    reconciliation_token:
      type: string
      minLength: 64
      maxLength: 64
      description: Current host reconciliation token; acknowledges its listed worker finishes without closing unfinished deliverables.
    expected_revision:
      type: string
      description: Current snapshot revision. Required when a checklist exists; omitted only for first creation.
      minLength: 64
      maxLength: 64
    item_ids:
      type: array
      maxItems: 48
      items:
        type: [string, 'null']
        maxLength: 64
      description: 'Checklist row identities aligned with content rows. Required when replacing an existing checklist: pass each retained row''s snapshot item_ids entry, null or "" for newly added rows, and omit removed rows.'
    content:
      type: string
      maxLength: 8000
      description: 'Checklist: `- [ ]` pending, `- [x]` done, `- [~]` terminal descope (not in-progress), `- [>]` optional (last). One row per deliverable in the request. Max 48 lines when needed; labels ≤60c.'
  required: [content]
  additionalProperties: false
