description: >-
  Manage session progress rows by ID (replace, add, update, remove) and
  acknowledge settled worker result handles (acknowledge_results).
schema:
  type: object
  minProperties: 1
  additionalProperties: false
  properties:
    replace:
      type: array
      minItems: 1
      maxItems: 48
      description: >-
        Seed the plan or replace all rows for a new request. Each entry mints a
        new p<N> ID in order; optional rows must come last. Mutually exclusive
        with add, update, and remove.
      items:
        type: object
        additionalProperties: false
        required: [label]
        properties:
          label:
            type: string
            minLength: 1
            maxLength: 240
            description: Deliverable outcome (display clamped to 60c). For user-facing CLI, terminal, or web UI work, include a separate final row to snapshot the running program.
          state:
            type: string
            enum: [pending, done, na, optional]
            default: pending
            description: Initial state (pending default; na = terminal descope; optional = non-blocking note, must be last).
    add:
      type: array
      minItems: 1
      maxItems: 48
      description: >-
        Insert new rows into the plan (or initialize when empty). Required rows
        append before trailing optional rows unless after_id places them.
      items:
        type: object
        additionalProperties: false
        required: [label]
        properties:
          label:
            type: string
            minLength: 1
            maxLength: 240
            description: Deliverable outcome.
          state:
            type: string
            enum: [pending, optional]
            default: pending
            description: Initial state for the added row.
          after_id:
            type: string
            pattern: '^(start|p[1-9][0-9]*)$'
            description: Surviving row ID (p1, p2, ...) to insert after, or "start" to prepend. Multiple additions sharing an anchor preserve input order. Omit to append before trailing optional rows.
    update:
      type: array
      minItems: 1
      maxItems: 48
      description: >-
        Patch existing rows by host-minted ID (p1, p2, ...). Omit unchanged
        rows and unchanged fields.
      items:
        type: object
        additionalProperties: false
        required: [id]
        properties:
          id:
            type: string
            pattern: '^p[1-9][0-9]*$'
            description: Target row ID from the current progress snapshot.
          state:
            type: string
            enum: [pending, done, na, optional]
            description: Updated state (done = verified complete; na = terminal will-not-pursue, never in-progress).
          label:
            type: string
            minLength: 1
            maxLength: 240
            description: Updated deliverable label when scope is refined.
    remove:
      type: array
      minItems: 1
      maxItems: 48
      uniqueItems: true
      description: Existing row IDs (p1, p2, ...) to remove when superseded.
      items:
        type: string
        pattern: '^p[1-9][0-9]*$'
    acknowledge_results:
      type: array
      minItems: 1
      maxItems: 32
      uniqueItems: true
      description: >-
        Settled worker result_handle values (for example scout-api#1) reviewed
        in this step. Accounts for those rounds without closing unfinished
        deliverables.
      items:
        type: string
        minLength: 1
        maxLength: 128
