description: >-
  Discard a result's changes without landing them, together with that worker's later changes. Wrong/superseded only — not landable conflicts.
  Example: {"overlay_id":"<result handle>","reason":"Superseded by corrected dispatch"}.
schema:
  type: object
  properties:
    overlay_id:
      type: string
      description: The result handle from the worker's result notice or the roster.
    reason:
      type: string
      description: Reject rationale (optional)
  required: [overlay_id]
  additionalProperties: false
