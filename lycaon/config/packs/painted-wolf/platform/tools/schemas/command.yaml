tags: [process, terminal]
description: >-
  Runs a bash program in the project. Write ordinary shell: pipelines,
  `&&`/`||`/`;`, if/for/while/case, functions, variables, `$(...)`, globs,
  here-documents, redirects (`>`, `>>`, `<`, `2>&1`), and `&` jobs. Common
  utilities run natively, accept both GNU and BSD option spellings, and print
  their catalog help on `CMD --help`. Toolchains (python3, go, node, npm, make,
  cargo) run directly in the session sandbox. Prefer one coherent program over
  several calls. The whole program is parsed first, then each reached command
  is checked and reported in order with output, status, and effects; refusals
  name the command, option, and replacement. Writes publish when their command
  finishes; variables, functions, and `cd` last for this program only.
schema:
  type: object
  properties:
    secret_use:
      type: object
      additionalProperties: false
      required: [services]
      description: Declare HTTP origins when passing a `{{paintedwolf-secret:…}}` reference.
      properties:
        services:
          type: array
          minItems: 1
          maxItems: 8
          items:
            type: string
            maxLength: 1024
          description: Exact HTTP origins (scheme, host, port).
    verification:
      type: boolean
      default: false
      description: Marks this invocation as validation evidence.
    command:
      type: string
      description: The bash program text.
    cwd:
      type: string
      description: Working directory relative to active root, `@label/sub/path`, or `@scratch/sub/path`. `cd` moves from here.
    timeout_ms:
      type: integer
      minimum: 1000
      maximum: 7200000
      description: Deadline in ms; expiry stops the program and its owned work.
    terminal_capture:
      type: object
      description: Sealed one-shot PTY screen capture for a single foreground command.
      properties:
        winsize:
          type: object
          description: Terminal dimensions (default 80x24).
          properties:
            cols:
              type: integer
              minimum: 1
              maximum: 240
              description: Column count.
            rows:
              type: integer
              minimum: 1
              maximum: 120
              description: Row count.
          required: [cols, rows]
          additionalProperties: false
        caption:
          type: string
          maxLength: 240
          description: Caption for the captured screen.
      additionalProperties: false
    snapshot_capture:
      type: object
      additionalProperties: false
      description: Offscreen snapshot via APP_SNAPSHOT attached on zero exit.
      properties:
        env_var:
          type: string
          default: APP_SNAPSHOT
          description: Environment variable holding the target image path.
        view:
          type: string
          description: View or route identifier passed as APP_SNAPSHOT_VIEW.
        scale:
          type: number
          default: 2.0
          description: Render scale factor passed as APP_SNAPSHOT_SCALE.
        caption:
          type: string
          maxLength: 240
          description: Caption for the visual artifact.
    socks_proxy:
      type: boolean
      default: false
      description: Inject ALL_PROXY for mediated non-HTTP TCP (SOCKS5h); omit for HTTP(S).
    capability_request:
      type: object
      description: >-
        Declares confinement this invocation needs; omit for ordinary
        execution. Valid keys: direct_ip, host_resources, socket_paths,
        local_listen, loopback_connect, write_root, read_path, process_control,
        host_execution; any other key is refused. Do not put listen or connect
        ids in host_resources.
      properties:
        host_resources:
          type: array
          minItems: 1
          maxItems: 16
          items:
            type: string
          description: Host-resource ids to attach.
        socket_paths:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
          description: Exact absolute AF_UNIX socket path.
        process_control:
          description: "`true` requests signaling outside the command sandbox; prefer process_signal."
          oneOf:
            - type: boolean
              enum: [true]
            - type: object
              additionalProperties: false
        host_execution:
          description: "`true` requests unsandboxed execution (`sudo -n`, setuid); standalone only."
          oneOf:
            - type: boolean
              enum: [true]
            - type: object
              additionalProperties: false
        direct_ip:
          description: >-
            `true` or destination list for direct IP (UDP, raw sockets, portless bind).
            Actual destinations will be unobserved.
          oneOf:
            - type: boolean
            - type: array
              maxItems: 16
              items:
                type: string
                maxLength: 256
            - type: object
              additionalProperties: false
              properties:
                declared_destinations:
                  type: array
                  description: "`host:port`, `tcp://host:port`, or `udp://host:port`."
                  maxItems: 16
                  items:
                    type: string
                    maxLength: 256
        local_listen:
          type: object
          description: Local bind+accept authority; pass `ports` or `{}` for any local port.
          properties:
            ports:
              type: array
              minItems: 1
              maxItems: 8
              items:
                type: integer
                minimum: 1
                maximum: 65535
              description: Local TCP/UDP ports to bind.
          additionalProperties: false
        loopback_connect:
          type: object
          description: Local TCP/UDP connect authority; pass `ports` or `{}` for any local port.
          properties:
            ports:
              type: array
              minItems: 1
              maxItems: 8
              items:
                type: integer
                minimum: 1
                maximum: 65535
              description: Local destination ports.
          additionalProperties: false
        write_root:
          type: string
          maxLength: 1024
          description: Absolute path outside default write roots or protected file to write.
        read_path:
          type: string
          maxLength: 1024
          description: Absolute protected path (such as an SSH or signing key) to read.
      additionalProperties: false
      minProperties: 1
  required: [command]
  additionalProperties: false
