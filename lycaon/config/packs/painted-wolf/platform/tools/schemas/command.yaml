tags: [process, terminal]
description: >-
  Runs a bash program (`$(...)`, pipes, redirects, `&` jobs). Common utilities
  run natively (GNU/BSD flags; `CMD --help` prints help); refusals name the
  command, flag, and replacement. Other binaries run inside a sandbox.
  Variables and `cd` last for this call only.
schema:
  type: object
  properties:
    secret_use: {type: object, additionalProperties: false, required: [services], description: "HTTP origins for `{{paintedwolf-secret:…}}`.", properties: {services: {type: array, minItems: 1, maxItems: 8, items: {type: string, maxLength: 1024}}}}
    verification: {type: boolean, default: false, description: Validation evidence.}
    command: {type: string, description: Bash program.}
    cwd: {type: string, description: "Relative to active root, `@label/...`, or `@scratch/...`."}
    timeout_ms: {type: integer, minimum: 1000, maximum: 7200000, description: Deadline in ms.}
    terminal_capture: {type: object, additionalProperties: false, description: One-shot PTY capture., properties: {winsize: {type: object, additionalProperties: false, required: [cols, rows], properties: {cols: {type: integer, minimum: 1, maximum: 240}, rows: {type: integer, minimum: 1, maximum: 120}}}, caption: {type: string, maxLength: 240}}}
    snapshot_capture: {type: object, additionalProperties: false, description: "Attach APP_SNAPSHOT on zero exit.", properties: {env_var: {type: string, default: APP_SNAPSHOT}, view: {type: string}, scale: {type: number, default: 2.0}, caption: {type: string, maxLength: 240}}}
    socks_proxy: {type: boolean, default: false, description: ALL_PROXY (SOCKS5h) for non-HTTP TCP.}
    capability_request:
      type: object
      additionalProperties: false
      minProperties: 1
      description: >-
        Extra access this call needs: direct_ip, host_resources,
        socket_paths, local_listen, loopback_connect, write_root, read_path,
        process_control, host_execution.
      properties:
        host_resources: {type: array, minItems: 1, maxItems: 16, items: {type: string}}
        socket_paths: {type: array, minItems: 1, maxItems: 1, items: {type: string}, description: Absolute AF_UNIX socket path.}
        process_control: {oneOf: [{type: boolean, enum: [true]}, {type: object, additionalProperties: false}]}
        host_execution: {oneOf: [{type: boolean, enum: [true]}, {type: object, additionalProperties: false}]}
        direct_ip:
          description: Direct IP (`true` or destinations) for UDP or clients that ignore proxy variables.
          oneOf: [{type: boolean}, {type: array, maxItems: 16, items: {type: string, maxLength: 256}}, {type: object, additionalProperties: false, properties: {declared_destinations: {type: array, maxItems: 16, items: {type: string, maxLength: 256}}}}]
        local_listen: {type: object, additionalProperties: false, properties: {ports: {type: array, minItems: 1, maxItems: 8, items: {type: integer, minimum: 1, maximum: 65535}}}}
        loopback_connect: {type: object, additionalProperties: false, properties: {ports: {type: array, minItems: 1, maxItems: 8, items: {type: integer, minimum: 1, maximum: 65535}}}}
        write_root: {type: string, maxLength: 1024, description: Path outside folders to write.}
        read_path: {type: string, maxLength: 1024, description: Protected path to read.}
  required: [command]
  additionalProperties: false
