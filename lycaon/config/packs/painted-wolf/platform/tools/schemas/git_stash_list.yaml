tags: [git, mutation]
description: "List stashes with immutable IDs and current selectors for apply/drop. Replaces command: git stash list."
schema:
  type: object
  properties:
    offset: {type: integer, minimum: 0, maximum: 1000000, default: 0, description: "Start at next_offset (initially 0)."}
    limit: {type: integer, minimum: 1, maximum: 80, default: 20, description: "Page size."}
  additionalProperties: false
