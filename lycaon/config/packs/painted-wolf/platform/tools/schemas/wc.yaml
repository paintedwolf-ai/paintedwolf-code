description: "Count lines (LF bytes), bytes, and words in files or recursively in directories. Counts describe one captured representation: the open editor text when in_editor, else the file; truncated marks a capped scan whose bytes is the file size. Replaces command: wc -l."
schema:
  type: object
  properties:
    paths:
      type: array
      items:
        type: string
      maxItems: 50
      description: Repo-relative file or directory paths (max 50)
    words:
      type: boolean
      description: Include word counts (default true)
    recursive:
      type: boolean
      description: When true, aggregate counts for all files under a directory path (max 500 files)
  required: [paths]
  additionalProperties: false
