description: Finish this worker leg when the assignment is done or blocked. The host builds the parent report from these fields plus disk proof.
schema:
  type: object
  properties:
    coverage_gaps:
      description: Unexamined or inconclusive scope, including areas with no findings; empty when none remain.
      type: array
      items:
        type: object
        additionalProperties: false
        required: [id, subject, reason]
        properties:
          id: {type: string, pattern: '^[A-Za-z0-9_.-]+$', description: Stable id for this gap within the leg.}
          subject: {type: string, minLength: 1, description: The scope left unexamined or inconclusive.}
          reason: {type: string, minLength: 1, description: Why it remains open.}
          paths:
            type: array
            description: Affected paths, when known.
            items: {type: string}
    coverage_review:
      type: object
      description: Required when the host assignment declares coverage review. Use its revision and assess every supplied id, including exclusions, against full-scope facts.
      properties:
        revision:
          type: string
          description: Revision token from the coverage review assignment.
        assessments:
          type: array
          description: Assessments for each obligation or claim id in the declared review.
          items:
            type: object
            properties:
              id:
                type: string
                description: Identifier of the claim or obligation being assessed.
              disposition:
                type: string
                enum: [satisfied, covered, immaterial, material_open, essential_open]
                description: Evaluation outcome for this assessment item.
              reason:
                type: string
                maxLength: 1200
                description: Plain-text justification grounded in observed facts.
              obligations:
                type: array
                description: Obligation identifiers addressed by this assessment.
                items:
                  type: string
                  description: Identifier of the obligation.
              cited_evidence:
                type: array
                maxItems: 12
                description: Evidence references backing this assessment.
                items:
                  type: object
                  properties:
                    handle:
                      type: string
                      description: Tool result handle that observed the evidence.
                    path:
                      type: string
                      description: Repo-relative file path where evidence was observed.
                    line:
                      type: integer
                      description: 1-based line number in the cited file.
                    excerpt:
                      type: string
                      description: Verbatim text from the cited line or tool result.
                  additionalProperties: false
            required: [id, disposition, reason, cited_evidence]
            additionalProperties: false
      required: [revision, assessments]
      additionalProperties: false
    verification:
      type: object
      description: Validation chosen for this assignment. The host derives outcomes from receipts; this never waives a workflow gate.
      properties:
        method:
          type: string
          enum: [inspection, targeted, project, blocked]
          description: inspection=read-back without executable checks; targeted=a narrower check; project=the selected or documented project check; blocked=required validation could not execute or finish, even if narrower checks passed. Report actual outcomes in reason.
        reason:
          type: string
          minLength: 1
          maxLength: 2000
          description: Why this scope is sufficient, or what prevented validation. Name checks and limitations; never claim broader coverage.
      required: [method, reason]
      additionalProperties: false
    leg_status:
      type: string
      enum: [complete, partial, blocked]
      description: complete=assigned work delivered; partial=work remains; blocked=work cannot proceed. Validation limits alone do not make delivered work incomplete.
    brief:
      type: string
      minLength: 1
      description: Parent-visible narrative. No file dumps. Host-capped.
    findings:
      type: array
      maxItems: 12
      description: Strongest source citations or observed non-source handles — not an inventory.
      items:
        type: object
        properties:
          path:
            type: string
            description: Repo-relative source path observed by the cited read or grep. Omit for scanner-only and web findings.
          line:
            type: integer
            description: 1-based line when citing file content.
          evidence:
            type: string
            description: Exact observation supporting this finding. Source text uses its read or grep handle; scanner-only findings use scan#N without path, line or excerpt.
          excerpt:
            type: string
            description: Verbatim observed source text at path/line. Omit for scanner-only and web findings.
          note:
            type: string
            description: Conclusion supported by the cited observation. Source claims still require a source excerpt.
          claim:
            type: string
            enum: [vulnerability, hardening, accepted_residual, model]
            description: >-
              Security claim class. vulnerability = exploitable by an in-scope
              adversary. hardening = a real improvement, not exploitable under the
              stated threat model. accepted_residual = a risk this repo documented
              and accepted. model = a fact about the threat model itself (assets,
              entry points, trust boundaries), not an issue.
          adversary:
            type: string
            description: Threat capability.
          precondition:
            type: string
            description: Required state.
          severity:
            type: string
            enum: [high, medium, low]
            description: Claim severity.
        additionalProperties: false
    cited_urls:
      type: array
      maxItems: 12
      items:
        type: string
      description: Exact URLs your web tools returned.
    objectives_met:
      type: array
      maxItems: 12
      items:
        type: string
      description: Short narrative bullets — no path:line or URLs.
    remaining_risk:
      type: array
      maxItems: 12
      items:
        type: string
      description: Residual risk or proof gap.
    suggested_next_task:
      type: string
      description: Useful follow-up assignment.
  required: [leg_status, brief]
  additionalProperties: false
