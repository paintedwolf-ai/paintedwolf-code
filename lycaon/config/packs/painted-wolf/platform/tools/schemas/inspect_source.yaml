description: Read a file with line numbers, list a directory, search project files, query JSON or YAML, or inspect Git history and changes. Each call performs one read operation.
schema:
  type: object
  properties:
    operation:
      type: string
      enum: [read, list, search, query_json, query_yaml, git_status, git_diff, git_log]
    path:
      type: string
      description: Project-relative path or @label/path. Required for read and query operations. List and search default to the session folder.
    pattern:
      type: string
      description: Regular expression required for search.
    query:
      type: string
      description: jq expression required for query_json or query_yaml.
  required: [operation]
  additionalProperties: false
