tags: [secrets, security]
description: Revoke a managed secret reference while retaining provider-screening evidence.
schema:
  type: object
  properties:
    reference:
      type: string
      pattern: '^\{\{paintedwolf-secret:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\}\}$'
      description: Opaque reference.
  required: [reference]
  additionalProperties: false
