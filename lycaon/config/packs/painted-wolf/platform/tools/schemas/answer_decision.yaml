tags: [workers]
description: "Answer a worker's pending question. Choose one of its options, by number or text, or answer in your own words when it offered none or none fits. The worker resumes in the same conversation with your answer."
schema:
  type: object
  properties:
    worker:
      type: string
      description: The asking worker's name
    answer:
      type: string
      description: Your answer — an offered option's number or text, or free text when the question offered no options
    resolved_by:
      type: string
      enum: [coordinator, user]
      description: coordinator (default) or user (ask_user relay)
  required: [worker, answer]
