tags: [edit, filesystem]
description: "@scratch/<path> addresses private working files. Replace an exact text span in an existing file. Batch independent edits to distinct files. Call read in an earlier response; summarize and grep do not establish an edit base. Same-batch read+edit rejects: EDITOR_DOCUMENT_READ_REQUIRED. Omit displayed line labels; preserve source indentation. old_string must be unique unless replace_all. Parse-breaking splices: MUTATION_BROKE_PARSE. Replaces command: sed -i / perl -pi in-place edit."
schema:
  type: object
  properties:
    path:
      type: string
      minLength: 1
      description: Repo-relative file path
    old_string:
      type: string
      minLength: 1
      description: Literal bytes to find in the file.
    new_string:
      type: string
      description: Replacement text; empty deletes the span. Must differ from old_string.
    replace_all:
      type: boolean
      description: Replace every occurrence of old_string (default false).
    syntax_override_reason:
      type: string
      minLength: 1
      maxLength: 1024
      pattern: '\S'
      description: Reason to override syntax validation for this call; other mutation checks still apply.
    resolve_secret_references:
      type: boolean
      description: Resolve managed secret references in old_string and new_string (default true).
  required: [path, old_string, new_string]
  additionalProperties: false
