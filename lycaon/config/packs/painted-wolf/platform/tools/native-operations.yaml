# Native operations reached through command. Agents cannot call these names as
# tools; each section has the same meaning as in native-tools.yaml.
operations:
  filesystem:
    - read
    - write
    - edit
    - replace_lines
    - grep
    - find
    - jq
    - jq_edit
    - stat
    - wc
    - list_dir
    - chmod
    - delete
    - copy
    - move
    - mkdir
    - chown
    - diff
    - extract_archive
  git:
    - git_status
    - git_diff
    - git_log
    - git_commit
    - git_show
    - git_blame
    - git_restore
    - git_ref
    - git_branches
    - git_compare
    - git_checkout
    - git_merge
    - git_stash
    - git_stash_list
  processes:
    - process_list
    - process_signal
  network:
    - http_request

grant_target_scope:
  write: path
  edit: path
  replace_lines: path
  jq_edit: path

multi_root:
  path:
    - read
    - write
    - edit
    - replace_lines
    - stat
    - wc
    - delete
    - chmod
    - chown
    - copy
    - move
    - mkdir
    - extract_archive
    - diff
    - jq
    - jq_edit
    - git_status
    - git_diff
    - git_log
    - git_commit
    - git_show
    - git_blame
    - git_restore
    - git_ref
    - git_branches
    - git_compare
    - git_checkout
    - git_merge
    - git_stash
    - git_stash_list
  discovery:
    - find
    - grep
    - list_dir
  none:
    - process_list
    - process_signal
    - http_request

requires_worker_branch:
  - write
  - edit
  - replace_lines
  - jq_edit
  - delete
  - mkdir
  - copy
  - move
  - chmod
  - chown
  - extract_archive
  - git_commit
  - git_restore
  - git_checkout
  - git_merge
  - git_stash

mutates_content:
  - write
  - edit
  - replace_lines
  - jq_edit

mutates_path:
  - write
  - edit
  - replace_lines
  - jq_edit
  - delete
  - copy
  - move
  - mkdir
  - chmod
  - chown
  - extract_archive
  - git_commit
  - git_restore
  - git_checkout
  - git_merge
  - git_stash
  - http_request

socket_arg:
  http_request: unix_socket

secret_reference_surface:
  http_request: http_request
  write: file
  edit: file
  replace_lines: file
  jq_edit: file

secret_reference_args:
  write:
    - content
  edit:
    - old_string
    - new_string
  replace_lines:
    - new_content
    - "operations.[].new_content"
  jq_edit:
    - vars

execution_capabilities:
  write: [file_change]
  edit: [file_change]
  replace_lines: [file_change]
  jq_edit: [file_change]
  copy: [file_change]
  move: [file_change]
  delete: [file_change]
  mkdir: [file_change]
  chmod: [file_change]
  chown: [file_change]
  extract_archive: [file_change]
  git_restore: [file_change]
  git_checkout: [file_change]
  git_merge: [file_change]
  git_stash: [file_change]
  http_request:
    - direct_ip
    - loopback_connect

families:
  processes:
    - process_list
    - process_signal

grant_identity_neutral_args:
  grep:
    - max_matches
    - offset
    - context_lines
  read:
    - limit
    - offset
  find:
    - offset
    - max_results

chunkable_payload:
  - write
  - replace_lines

bounded_in_process:
