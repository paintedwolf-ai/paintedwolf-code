id: coordinator
description: Coordinator tool surface — orchestration without product repo writes
command_effects: [read_only, mutation, external_exec, network_egress]
tools:
  recall: sticky
  edit: sticky
  replace_lines: sticky
  summarize: sticky
  survey_repo: sticky
  pack_board: sticky
  delegate_dispatch: sticky
  update_progress: sticky
  task: sticky
  worker_cancel: sticky
  answer_decision: sticky
  extend_worker_budget: sticky
  decline_worker_budget: sticky
  promote_overlay: sticky
  reject_overlay: sticky
  preview_overlay: sticky
  workflow_compose: sticky
  workflow_compose_from_template: sticky
  workflow_catalog_summaries: sticky
  workflow_persist: sticky
  workflow_user_feedback: sticky
  ask_user: sticky
  surface_note: sticky
  workflow_advance: sticky
  workflow_transition: sticky
  fanout_plan: sticky
  submit_verdict: sticky
  state_start: sticky
  source_history: true
  git_checkout: sticky
  git_merge: sticky
  git_stash: sticky
  chmod: sticky
  chown: sticky
  code_rewrite: true
  jq_edit: true
  restore_version: true
  git_restore: sticky
  git_commit: sticky
  scan_pack: sticky
  scan_list: true
  scan_summary: true
  scan_query: true
  scan_compare: true
  wait: sticky
  web_search: sticky
  fetch_url: sticky
  process_list: true
  process_signal: true
  command: sticky
  command_output: true
  command_stop: true
  held_result: true
  held_stop: true
  verify: sticky
  skills_read: sticky
  secret_generate: sticky
  secret_list: sticky
  secret_revoke: sticky
  mcp_*: true
  render_view: sticky
  view_image: sticky
  view_video: sticky
  capture_page: sticky
  measure_page: sticky
  page_open: sticky
  page_act: sticky
  page_snapshot: sticky
  page_close: sticky
  terminal_open: sticky
  terminal_send: sticky
  terminal_read: sticky
  terminal_snapshot: sticky
  terminal_close: sticky
# A worker asks for rounds; the coordinator grants with extend_worker_budget.
deny_tools:
  - request_budget
read_scope: coordinator_product_read
write_scope: coordinator_orchestration
wait_conditions: [next_worker_done, all_workers_idle, overlay_promote_pending, scan_done, process_done, http_ready, port_ready]
