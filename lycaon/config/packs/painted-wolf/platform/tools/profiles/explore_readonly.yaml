id: explore_readonly
description: Read-only exploration — native find/grep and metadata tools (no command)
tools:
  recall: sticky
  read: sticky
  record_finding: sticky
  pack_board: sticky
  request_decision: sticky
  request_budget: sticky
  surface_note: sticky
  complete_leg: sticky
  grep: sticky
  find: sticky
  summarize: sticky
  survey_repo: sticky
  jq: sticky
  stat: sticky
  wc: sticky
  list_dir: sticky
  git_status: sticky
  git_diff: sticky
  diff: sticky
  git_log: true
  git_show: true
  git_blame: true
  source_history: true
  git_ref: true
  git_branches: true
  git_compare: true
  git_stash_list: true
  scan_list: true
  scan_summary: true
  scan_query: true
  scan_compare: true
  render_view: true
  view_image: true
  view_video: true
  capture_page: true
  measure_page: true
  page_open: true
  page_act: true
  page_snapshot: true
  page_close: true
  skills_read: sticky
  wait: sticky
  held_result: true
  held_stop: true
deny_tools:
  - write
  - edit
  - replace_lines
  - code_rewrite
  - jq_edit
  - chmod
  - delete
  - chown
  - git_commit
  - git_restore
  - git_checkout
  - git_merge
  - git_stash
  - command
  - secret_*
  - delegate_*
  - state_*
  - handoff_*
wait_conditions: [http_ready, port_ready]
