id: explore_readonly
description: Read-only exploration — command in read-only mode and metadata tools
command_effects: [read_only]
tools:
  command: sticky
  recall: sticky
  record_finding: sticky
  pack_board: sticky
  request_decision: sticky
  request_budget: sticky
  surface_note: sticky
  complete_leg: sticky
  summarize: sticky
  survey_repo: sticky
  source_history: true
  scan_list: true
  scan_summary: true
  scan_query: true
  scan_compare: true
  render_view: true
  view_image: true
  view_video: true
  capture_page: true
  measure_page: true
  page_open: true
  page_act: true
  page_snapshot: true
  page_close: true
  skills_read: sticky
  wait: sticky
  held_result: true
  held_stop: true
deny_tools:
  - write
  - edit
  - replace_lines
  - code_rewrite
  - jq_edit
  - chmod
  - delete
  - chown
  - git_commit
  - git_restore
  - git_checkout
  - git_merge
  - git_stash
  - secret_*
  - delegate_*
  - state_*
  - handoff_*
wait_conditions: [http_ready, port_ready]
