id: editor_file
description: >
  Editor selection turns — file tools, native command reads and writes, and
  bounded readiness probes. No external programs, network content fetch, MCP,
  or spawn/delegate. Used by inline edit and the seven selection verbs.
command_effects: [read_only, mutation]
tools:
  command: sticky
  recall: sticky
  edit: sticky
  replace_lines: sticky
  code_rewrite: sticky
  restore_version: sticky
  summarize: sticky
  jq_edit: true
  scan_query: sticky
  scan_list: sticky
  record_finding: sticky
  pack_board: sticky
  surface_note: sticky
  wait: sticky
  skills_read: sticky
  secret_generate: sticky
  secret_list: sticky
  secret_revoke: sticky
  held_result: true
  held_stop: true
wait_conditions: [http_ready, port_ready]
deny_tools:
  - command_output
  - command_stop
  - web_search
  - fetch_url
  - terminal_open
  - terminal_send
  - terminal_read
  - terminal_snapshot
  - terminal_close
  - page_open
  - page_act
  - page_snapshot
  - page_close
  - render_view
  - capture_page
  - measure_page
  - delegate_*
  - state_*
  - handoff_*
  - git_commit
  - git_restore
  - git_checkout
  - git_merge
  - git_stash
  - chmod
  - chown
  - delete
  - copy
  - move
  - mkdir
  - extract_archive
  - verify
  - survey_repo
  - mcp_*
