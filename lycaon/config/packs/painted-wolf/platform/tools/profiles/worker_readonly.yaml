id: worker_readonly
description: >
  Read-only review surface with no leg tools. A workflow binds it by declaring
  `coordinator_profile`.
command_effects: [read_only]
tools:
  command: sticky
  recall: sticky
  view_image: sticky
  view_video: sticky
  record_finding: sticky
  pack_board: sticky
  summarize: sticky
  source_history: sticky
  wait: sticky
  held_result: true
  held_stop: true
deny_tools:
  - secret_*
  - write
  - edit
  - replace_lines
  - code_rewrite
  - jq_edit
  - chmod
  - delete
  - chown
  - git_commit
  - git_restore
  - git_checkout
  - git_merge
  - git_stash
  - delegate_*
  - state_*
  - handoff_*
wait_conditions: [http_ready, port_ready]
