    - view_image
    - view_video
    - capture_page
    - measure_page
    - page_open
    - page_act
    - page_snapshot
    - page_close
  terminal:
    - terminal_open
    - terminal_send
    - terminal_read
    - terminal_snapshot
    - terminal_close

# Grant predicates target declared command or path arguments.
# Codegen: ./task codegen:native-tool-contracts
grant_target_scope:
  command: command
  verify: command
  terminal_open: command
  restore_version: path
  code_rewrite: path

# Multi-root modes declare labeled paths, union discovery, command cwd, or no path.
# Codegen: ./task codegen:native-tool-contracts
