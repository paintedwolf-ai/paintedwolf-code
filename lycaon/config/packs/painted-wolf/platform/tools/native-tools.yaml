# These write tools require the worker's private branch before execution.
# Codegen: ./task codegen:worker-branch-tools
requires_worker_branch:
  - write
  - edit
  - replace_lines
  - restore_version
  - code_rewrite
  - jq_edit
  - delete
  - mkdir
  - copy
  - move
  - chmod
  - chown
  - extract_archive
  - git_commit
  - git_restore
  - git_checkout
  - git_merge
  - git_stash
  - command
  - verify
  - terminal_open

# Tools whose arguments carry file content the model authored. Read by human
# content review, the coordinator write-surface rejects, and worker completion
# proof; a tool missing here writes past content review.
#
# Narrower than mutates_path: copy, move, and extract_archive change bytes on
# disk and author none, so a review card for one would show nothing.
# content_apply is host-produced, so rules selecting on this fact see it even
# though the review gate is called with the originating tool.
# Codegen: ./task codegen:native-tool-contracts
mutates_content:
  - write
  - edit
  - replace_lines
  - code_rewrite
  - jq_edit
  - content_apply

# Tools that mutate a path named in their own structured arguments. The approval
# gate reads this to classify a declared file target as a write crossing (so a
# sensitive location declared `mode: write` matches) and to run the
# protected-sink deny. A tool absent here declares reads only.
#
# Narrower than requires_worker_branch, which also lists command / verify /
# terminal_open: those reach the tree through a subprocess and declare no path.
# Codegen: ./task codegen:native-tool-contracts
mutates_path:
  - write
  - edit
  - replace_lines
  - restore_version
  - code_rewrite
  - jq_edit
  - content_apply
  - delete
  - copy
  - move
  - mkdir
  - chmod
  - chown
  - extract_archive
  - git_commit
  - git_restore
  - git_checkout
  - git_merge
  - git_stash
  # fetch_url writes only when the model supplies `dest`; those remote-origin
  # bytes classify as a write crossing, not a fetch.
  - fetch_url
  # http_request writes only when the model supplies `response_path`; the same
  # remote-origin classification applies.
  - http_request
  # render_view writes only when the model supplies `dest`.
  - render_view

# The argument naming an AF_UNIX socket a native tool dials itself. The
# executor reviews that socket as exact socket authority, the same subject
# capability_request.socket_paths gives a subprocess.
# Codegen: ./task codegen:native-tool-contracts
socket_arg:
  http_request: unix_socket

# Tools whose arguments resolve managed-secret references, and the outbound
# screen that reviews the resolved execution copy. command and terminal screens
# run in the executor over process arguments; http_request screens its own wire
# copy. MCP tools carry the mcp surface on their dynamic contract. Every other
# tool keeps a reference as literal text.
# Codegen: ./task codegen:native-tool-contracts
secret_reference_surface:
  command: command
  verify: command
  terminal_open: terminal
  terminal_send: terminal
  http_request: http_request
  write: file
  edit: file
  replace_lines: file
  jq_edit: file

# Value slots that resolve managed-secret references for file-surface tools.
# Tools not listed resolve across the entire argument tree.
# Codegen: ./task codegen:native-tool-contracts
secret_reference_args:
  write:
    - content
  edit:
    - old_string
    - new_string
  replace_lines:
    - new_content
    - "operations.[].new_content"
  jq_edit:
    - vars


# Tools whose execution can create a host subprocess. The approval gate derives
# unobserved-channel facts from this structural inventory.
# Codegen: ./task codegen:native-tool-contracts
spawns_process:
  - command
  - verify
  - terminal_open
  - scan_pack
  - render_view
  - view_image
  - view_video
  - capture_page
  - measure_page
  - page_open

# Structured authority/evidence surfaces accepted by each execution tool.
# Runtime preflight and invocation receipts consume the generated contract;
# schemas and prompt contracts are checked against this catalog.
execution_capabilities:
  write: [file_change]
  edit: [file_change]
  replace_lines: [file_change]
  restore_version: [file_change]
  code_rewrite: [file_change]
  jq_edit: [file_change]
  copy: [file_change]
  move: [file_change]
  delete: [file_change]
  mkdir: [file_change]
  chmod: [file_change]
  chown: [file_change]
  extract_archive: [file_change]
  git_restore: [file_change]
  git_checkout: [file_change]
  git_merge: [file_change]
  git_stash: [file_change]
  http_request:
    - loopback_connect
  wait:
    - loopback_connect
  # A url-mode page target is a local service with http_request's reach, so it
  # takes the same port-narrowed grant. project_dir captures open no socket.
  capture_page:
    - loopback_connect
  measure_page:
    - loopback_connect
  page_open:
    - loopback_connect
  command:
    - host_resource
    - socket
    - direct_ip
    - process_control
    - host_execution
    - local_listen
    - loopback_connect
    - terminal_capture
    - write_root
    - read_path
    - package_execution
  verify:
    - host_resource
    - socket
    - direct_ip
    - process_control
    - host_execution
    - local_listen
    - loopback_connect
    - write_root
    - read_path
    - package_execution
  # A pty is the same spawn under a tty, so it takes the same bounded
  # capabilities. direct_ip is the exception: its lease covers one action with
  # unobserved destinations, which a session held across turns would outlive.
  terminal_open:
    - host_resource
    - socket
    - local_listen
    - loopback_connect
    - write_root
    - read_path
    - package_execution
  terminal_send:
    - held_terminal_input

# Listing one family member on a surface grants the rest. resource_implied
# names the control tools made available by a live resource.
families:
  processes:
    - process_list
    - process_signal
  command:
    - command
    - command_output
    - command_stop
  held_call:
    - held_result
    - held_stop
  terminal:
    - terminal_open
    - terminal_send
    - terminal_read
    - terminal_snapshot
    - terminal_close
  page:
    - page_open
    - page_act
    - page_snapshot
    - page_close

# Companions load with a tool a request selects. The file-mutation tools rank
# near one another on a need to create or change files, and a turn that does
# one of them does the others next; loading them together saves the round trip.
companions:
  write: [edit, replace_lines]
  edit: [write, replace_lines]
  replace_lines: [write, edit]

resource_implied:
  command_jobs:
    - command_output
    - command_stop
    - wait
  held_calls:
    - held_result
    - held_stop
    - wait
  terminals:
    - terminal_send
    - terminal_read
    - terminal_snapshot
    - terminal_close
  pages:
    - page_act
    - page_snapshot
    - page_close

# Wait limits and output framing leave execution authority unchanged.
# Arguments absent from this list contribute to the grant identity.
# Codegen: ./task codegen:native-tool-contracts
grant_identity_neutral_args:
  command:
    - timeout_ms
    - wait_ms
    - terminal_capture
  verify:
    - timeout_ms
    - wait_ms
  grep:
    - max_matches
    - offset
    - context_lines
  read:
    - limit
    - offset
  find:
    - offset
    - max_results
  source_history:
    - limit
    - before_ordinal
  fetch_url:
    - parallel
  web_search:
    - parallel
  scan_pack:
    - completion
    - timeout_ms
  view_image:
    - scale
    - viewport
  view_video:
    - times_ms
    - start_ms
    - end_ms
    - count
    - crop

# Tools whose arguments carry a free-form payload that can be split across calls.
# Only these are told to chunk on TOOL_ARGS_TRUNCATED; elsewhere a cut argument
# stream is a runaway, and there is no second half to send.
# Codegen: ./task codegen:native-tool-contracts
chunkable_payload:
  - write
  - replace_lines
  - code_rewrite

# Bookkeeping calls that neither observe the tree nor act on it; a batch of
# these leaves the coordinator's read-only survey streak unchanged.
# Codegen: ./task codegen:native-tool-contracts
survey_neutral:
  - request_tools
  - update_progress

# In-process tools execute synchronously within the caller's context deadline.
# Codegen: ./task codegen:native-tool-contracts
bounded_in_process:
