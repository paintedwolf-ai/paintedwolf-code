  - git_restore
  - git_ref
  - git_branches
  - git_compare
  - git_checkout
  - git_merge
  - git_stash
  - git_stash_list

# Read-only tools whose call may outlive its foreground wait. Past the budget the
# turn continues with a handle and the call keeps running, so a tool that blocks
# on shared infrastructure cannot hold the coordinator. A tool that records an
# effect is not listed: its attempt must settle inside the turn that made it.
# Codegen: ./task codegen:native-tool-contracts
detach_after_budget:
  - find
  - grep
  - wc
  - list_dir
  - summarize
  - survey_repo
  - diff
  - git_status
  - git_diff
  - git_log
  - git_show
  - git_blame
  - git_compare
  - git_branches
  - git_ref
  - git_stash_list

# Session shape a tool belongs to. A profile grants capability and cannot say
# which shape is running: explore_readonly serves scout legs and editor inspect
# turns alike. Absent means either shape.
#   worker_child      — writes to leg state that only a spawned leg has
#   addressed_session — speaks to the user, so it runs where they are reading
# Codegen: ./task codegen:native-tool-contracts
session_scope:
  git_checkout: addressed_session
  git_merge: addressed_session
  git_stash: addressed_session
  complete_leg: worker_child
  request_decision: worker_child
  request_budget: worker_child
  surface_note: addressed_session

# Connected servers register these prefixes after boot.
# Other profile patterns resolve against the registered tool set.
runtime_registered_prefixes:
  - mcp_

# Rule-selectable host identities have no model-facing tool schema.
host_produced_tools:
