# Boolean schema arguments that explicitly enable otherwise serial same-tool
# calls in one assistant response. Omission preserves serial execution.
batch_opt_in_arg:
  fetch_url: parallel
  web_search: parallel

# Per-tool caps for concurrent batches. The host cap remains the ceiling.
batch_concurrency_limit:
  fetch_url: 4
  web_search: 4
  summarize: 4

# Presence of the named argument keeps that call serial even when opted in.
batch_serial_when_arg:
  fetch_url: dest

