# Catalog tool allowlist for codegen and contracts.
# Functional ids follow docs/naming.md.
#
# Every id here is registered at serve boot. Native tools registered directly in
# Go are not listed — native-tools.yaml holds those.

tools:
  # state_start workflow run proposal
  - state_start

  # handoff_* sibling worker coordination (parent session plane)
  - handoff_reserve
  - handoff_release
  - handoff_release_all

  # scan_* host security scans and drill-down
  - scan_pack
  - scan_list
  - scan_summary
  - scan_query
  - scan_compare

  # coordinator workflow surface
  - workflow_compose
  - workflow_compose_from_template
  - workflow_catalog_summaries
  - workflow_persist
  - workflow_advance
  - ask_user
  - fanout_plan
  - submit_verdict

  # plan_from_blueprint blueprint seeding
  - plan_from_blueprint

  # pack_board, read_findings, and read_review orientation and review readers
  - pack_board
  - read_findings
  - read_review

  # record_finding agent feed writer (grounded)
  - record_finding

  # request_decision worker escalation (resumable)
  - request_decision

  # message_coordinator worker note to its coordinator
  - message_coordinator

  # instruct_worker, shelve_overlay, worker_history: long-lived worker control
  - instruct_worker
  - shelve_overlay
  - worker_history
