spec_version: "1.0"
id: COMMAND_OPTION_UNSUPPORTED
kind: policy
on: tool.rejected
selector:
  tools:
    - command
    - verify
requires_facts: [paintedwolf.command, paintedwolf.expected_form, paintedwolf.rejection_code, paintedwolf.source_column, paintedwolf.source_line, paintedwolf.word]
when: paintedwolf.rejection_code == "COMMAND_OPTION_UNSUPPORTED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_composition_redirect
message: native command option is unsupported
what: '{% if paintedwolf.command %}{{ paintedwolf.command }}{% else %}This command{% endif %} cannot use {% if paintedwolf.word %}{{ paintedwolf.word }}{% else %}the supplied option{% endif %}{% if paintedwolf.source_line %} at {{ paintedwolf.source_line }}:{{ paintedwolf.source_column }}{% endif %}.'
cause: '{% if paintedwolf.expected_form %}Supported form: {{ paintedwolf.expected_form }}.{% endif %}'
why: This command form does not accept the supplied option.
fix: '{% if paintedwolf.expected_form %}Use the supported form for this operation; preserve its other operands and earlier effects.{% endif %}'
instead: ''
x-paintedwolf-scenarios:
  - id: path_option
    vars:
      tool: command
      command: basename
      expected_form: 'basename [--] PATH [SUFFIX]'
