oar: '1.0'
id: COMMAND_OPTION_UNSUPPORTED
kind: policy
anchor: tool.rejected
selector:
  tool:
  - command
  - verify
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.command
  - paintedwolf.expected_form
  - paintedwolf.word
  - paintedwolf.source_line
  - paintedwolf.source_column
when: paintedwolf.rejection_code == "COMMAND_OPTION_UNSUPPORTED"
effect: block
copy:
  what: '{{ paintedwolf.command }} cannot use {% if paintedwolf.word %}{{ paintedwolf.word }}{% else %}that option{% endif %}{% if paintedwolf.source_line %}{% if paintedwolf.source_column %} at {{ paintedwolf.source_line }}:{{ paintedwolf.source_column }}{% endif %}{% endif %}.'
  cause: 'Supported form: {{ paintedwolf.expected_form }}.'
  why: This command form does not accept the supplied option.
  fix: Correct this option using the supported form. Keep the other operands and intended operation; review earlier output and changes before submitting remaining work.
  instead: 'Use {{ paintedwolf.expected_form }}.'
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_composition_redirect
x-paintedwolf-message: native command option is unsupported
x-paintedwolf-scenarios:
- id: path_option
  vars:
    tool: command
    command: basename
    expected_form: 'basename [--] PATH [SUFFIX]'
  expect_contains:
  - 'Code: COMMAND_OPTION_UNSUPPORTED'
  - basename
  - PATH
  - supported form
