spec_version: "1.0"
id: SECRET_STORE_UNAVAILABLE
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SECRET_STORE_UNAVAILABLE"
effect: block
category: recoverable
emit: guard:tool
message: The protected secret store is unavailable
what: The protected secret store is unavailable.
cause: The host could not complete the lifecycle operation without access to protected storage.
why: Secret values are never returned through the tool result as a fallback.
fix: Retry after protected storage is available. If it remains unavailable, report the host failure.
instead: Do not generate or reconstruct a replacement value in model-visible text
scenarios:
  - id: default
    vars: {profile: implement, tool: secret_generate}
