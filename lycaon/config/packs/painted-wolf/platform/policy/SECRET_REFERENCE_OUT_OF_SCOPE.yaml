oar: '1.0'
id: SECRET_REFERENCE_OUT_OF_SCOPE
kind: schema
anchor: tool.rejected
requires:
  facts:
  - paintedwolf.rejection_code
  profiles:
  - tool
when: paintedwolf.rejection_code == "SECRET_REFERENCE_OUT_OF_SCOPE"
effect: block
copy:
  what: The managed secret reference is outside this chat's scope.
  cause: Its chat or project scope does not match the current operation.
  why: Reference possession alone does not grant cross-scope access.
  fix: Use a live reference scoped to this chat or project. Otherwise report the dependency through the current
    session’s available completion or user-response surface.
  instead: Do not copy identifiers across chat or project boundaries
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
x-paintedwolf-message: The managed secret reference is outside this chat's scope
x-paintedwolf-scenarios:
- id: default
  vars:
    profile: implement
    tool: command
  expect_contains:
  - 'Rejected:'
  - 'Code: SECRET_REFERENCE_OUT_OF_SCOPE'
