spec_version: "1.0"
id: SECRET_REFERENCE_OUT_OF_SCOPE
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SECRET_REFERENCE_OUT_OF_SCOPE"
effect: block
category: recoverable
emit: guard:tool
message: The managed secret reference is outside this chat's scope
what: The managed secret reference is outside this chat's scope.
cause: Its chat or project scope does not match the current operation.
why: Reference possession alone does not grant cross-scope access.
fix: Use a live reference scoped to this chat or project. Otherwise report the dependency through the current session’s available completion or user-response surface.
instead: Do not copy identifiers across chat or project boundaries
scenarios:
  - id: default
    vars:
      session_role: implement
      tool: command
