spec_version: "1.0"
id: WORKFLOW_DELEGATION_NOT_READY
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code, paintedwolf.rejection_reason]
when: paintedwolf.rejection_code == "WORKFLOW_DELEGATION_NOT_READY"
effect: block
category: recoverable
emit: rule:coordinator
message: Delegation tools are blocked until implement_workflow_ready
what: The current workflow has not admitted this delegation.
cause: '{{ paintedwolf.rejection_reason }}'
why: The active workflow owns its readiness requirements; a repeated dispatch does not satisfy them.
fix: Follow the active workflow prerequisite details and current phase exit. Complete only the unmet requirements; preserve completed work and approvals. If progress depends on a person or unavailable capability, report that dependency instead of repeating dispatch.
instead: Use the active workflow requirements before delegation
scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      profile: coordinator
      tool: delegate_dispatch
