oar: '1.0'
id: COMMAND_CONCURRENCY_CAP_REACHED
kind: policy
anchor: tool.rejected
selector:
  tool:
  - command
  - verify
requires:
  profiles:
  - tool
  facts: [paintedwolf.rejection_code, paintedwolf.max_awaited, paintedwolf.count, paintedwolf.live_command_handles, paintedwolf.awaited_capacity_known, paintedwolf.next_steps]
when: paintedwolf.rejection_code == "COMMAND_CONCURRENCY_CAP_REACHED"
effect: block
copy:
  what: 'This session''s awaited-command capacity is full.{% if paintedwolf.awaited_capacity_known %} Live jobs at admission: {{ paintedwolf.count }}; configured
    limit: {{ paintedwolf.max_awaited }}.{% endif %}'
  cause: Explicit awaited concurrency is bounded independently from background servers and watches.
  why: More overlapping foreground work would make completion order and resource coordination unreliable.
  fix: '{{ paintedwolf.next_steps }}'
  instead: ''
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_job
x-paintedwolf-message: awaited command concurrency cap reached
x-paintedwolf-scenarios:
- id: default
  vars:
    max_awaited: 2
    count: 2
    live_command_handles:
    - command-a
    - command-b
