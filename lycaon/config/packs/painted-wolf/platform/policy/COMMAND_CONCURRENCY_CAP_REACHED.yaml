oar: '1.0'
id: COMMAND_CONCURRENCY_CAP_REACHED
kind: policy
anchor: tool.rejected
selector:
  tool:
  - command
  - verify
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.max_awaited
  - paintedwolf.count
  - paintedwolf.live_command_handles
when: paintedwolf.rejection_code == "COMMAND_CONCURRENCY_CAP_REACHED"
effect: block
copy:
  what: At admission, this session had {{ paintedwolf.count }} live awaited command jobs; the configured limit
    is {{ paintedwolf.max_awaited }}.
  cause: Explicit awaited concurrency is bounded independently from background servers and watches.
  why: More overlapping foreground work would make completion order and resource coordination unreliable.
  fix: Inspect or await an existing job from {{ paintedwolf.live_command_handles }}. Stop a job only if the
    task no longer needs it. Retry after capacity is actually free; allow_concurrent does not override this
    bound.
  instead: Reduce the live awaited command set
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_job
x-paintedwolf-message: awaited command concurrency cap reached
x-paintedwolf-scenarios:
- id: default
  vars:
    max_awaited: 2
    count: 2
    live_command_handles:
    - command-a
    - command-b
  expect_contains:
  - 'Code: COMMAND_CONCURRENCY_CAP_REACHED'
  - 2 live awaited
  - command-a
  - command-b
