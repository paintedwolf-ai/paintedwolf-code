spec_version: "1.0"
id: POLICY_CONTEXT_CHANGED
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "POLICY_CONTEXT_CHANGED"
effect: block
category: recoverable
emit: guard:tool
message: Project guidance prerequisite
what: 'The reached operation did not run because its applicable project guidance was not included in the proposing model request.'
cause: 'The operation entered a new policy scope or its guidance changed.'
why: 'Applicable guidance must reach the model before it chooses this effect.'
fix: 'Read the current scoped guidance supplied on the next request, reconsider the operation, and issue a fresh call. Earlier completed program effects remain completed; do not replay them.'
instead: 'Continue read-only investigation, then propose only the remaining effects after fresh guidance is delivered.'
scenarios:
  - id: reached_operation
    vars:
      tool: command
