oar: '1.0'
id: MOVE_NOT_FOUND
kind: schema
anchor: tool.rejected
selector:
  tool:
  - move
requires:
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.path
  profiles:
  - filesystem
  - tool
when: paintedwolf.rejection_code == "MOVE_NOT_FOUND"
effect: block
copy:
  cause: The source was absent when validated; this does not establish why it is missing.
  why: A rejected item does not undo earlier successful moves in the batch.
  fix: Check the intended source and earlier move receipts. A prior item may already have moved it; do not
    create a placeholder or replay completed work.
  instead: Resolve the reported item and preserve completed move receipts
  what: Move source {{ paintedwolf.path }} does not exist.
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:move
x-paintedwolf-message: move:move source does not exist
x-paintedwolf-scenarios:
- id: default
  vars:
    detail: bad args
    path: src/main.go
    profile: implement
    tool: move
  expect_contains:
  - 'Rejected:'
  - 'Code: MOVE_NOT_FOUND'
