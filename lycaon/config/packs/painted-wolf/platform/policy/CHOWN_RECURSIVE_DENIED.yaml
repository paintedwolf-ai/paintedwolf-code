spec_version: "1.0"
id: CHOWN_RECURSIVE_DENIED
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.operation, paintedwolf.rejection_code]
when: paintedwolf.operation == "chown" && paintedwolf.rejection_code == "CHOWN_RECURSIVE_DENIED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:chown
message: chown:recursive chown not supported
what: Recursive chown is not supported.
cause: The invocation requested recursive ownership changes.
why: This tool applies ownership only to explicit bounded targets.
fix: Use explicit paths for the ownership changes actually requested, within the current schema’s batch limit. Do not use a recursive command to bypass this restriction.
instead: Branch on Code CHOWN_RECURSIVE_DENIED; keep the intended targets explicit
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: bad args
      path: scripts/run.sh
      profile: implement
      tool: chown
