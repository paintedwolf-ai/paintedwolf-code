oar: '1.0'
id: CHOWN_RECURSIVE_DENIED
kind: schema
anchor: tool.rejected
selector:
  tool:
  - chown
requires:
  facts:
  - paintedwolf.rejection_code
  profiles:
  - tool
when: paintedwolf.rejection_code == "CHOWN_RECURSIVE_DENIED"
effect: block
copy:
  cause: The invocation requested recursive ownership changes.
  why: This tool applies ownership only to explicit bounded targets.
  fix: Use explicit paths for the ownership changes actually requested, within the current schema’s batch limit.
    Do not use a recursive command to bypass this restriction.
  instead: Branch on Code CHOWN_RECURSIVE_DENIED; keep the intended targets explicit
  what: Recursive chown is not supported.
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:chown
x-paintedwolf-message: chown:recursive chown not supported
x-paintedwolf-scenarios:
- id: default
  vars:
    detail: bad args
    path: scripts/run.sh
    profile: implement
    tool: chown
  expect_contains:
  - 'Rejected:'
  - 'Code: CHOWN_RECURSIVE_DENIED'
