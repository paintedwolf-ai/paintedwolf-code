spec_version: "1.0"
id: CHOWN_ROOT_DENIED
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.operation, paintedwolf.ownership_field, paintedwolf.ownership_gid, paintedwolf.ownership_target, paintedwolf.ownership_uid, paintedwolf.rejection_code]
when: paintedwolf.operation == "chown" && paintedwolf.rejection_code == "CHOWN_ROOT_DENIED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:chown
message: chown:chown cannot chown to root uid
what: The requested root ownership target {{ paintedwolf.ownership_target }} is unavailable for chown.
cause: The requested root identity differs from this host’s user identity.
why: This host permits only its current user ID {{ paintedwolf.ownership_uid }} and group ID {{ paintedwolf.ownership_gid }}.
fix: Use the exact permitted numeric UID and GID only when that matches the requested ownership change. The native form accepts UID[:GID], without account-name lookup. Otherwise report the limitation; do not guess another account, elevate the host, or switch tools to bypass it.
instead: Branch on Code CHOWN_ROOT_DENIED; retain the current-identity boundary
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: bad args
      path: scripts/run.sh
      profile: implement
      tool: chown
