spec_version: "1.0"
id: RENDER_KIT_UNKNOWN
kind: schema
on: tool.rejected
selector:
  tools:
    - render_view
requires_facts: [paintedwolf.rejection_code, paintedwolf.render_kit_available, paintedwolf.render_kit_kind, paintedwolf.render_kit_suggestions, paintedwolf.unknown_target]
when: paintedwolf.rejection_code == "RENDER_KIT_UNKNOWN"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:visual_render
message: Unknown design-kit name
what: render_view rejected a {{ paintedwolf.render_kit_kind }} catalog selection.
cause: The supplied selection is not recognized by the active hermetic design kit.
why: Mockups stay offline and deterministic — only host-bundled OFL fonts, Lucide-adapted icons, themes, and viewport presets are allowed.
fix: '{% if paintedwolf.render_kit_available %}Available selections: {{ paintedwolf.render_kit_available }}. {% endif %}{% if paintedwolf.render_kit_suggestions %}Candidate spellings: {{ paintedwolf.render_kit_suggestions }}. {% endif %}Choose an intended catalog entry, using the current kit payload and naming guide. Suggestions are candidates, not proof of semantic equivalence.'
instead: Use the current kit vocabulary and preserve the intended design
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      profile: coordinator
      tool: render_view
