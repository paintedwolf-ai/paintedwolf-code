spec_version: "1.0"
id: HELD_CALL_NOT_FOUND
kind: schema
on: tool.rejected
selector:
  tools:
    - held_result
    - held_stop
requires_facts: [paintedwolf.handle, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "HELD_CALL_NOT_FOUND"
effect: block
category: recoverable
emit: guard:tool
message: held call handle {{ paintedwolf.handle }} was not found
what: Handle {{ paintedwolf.handle }} is not a held call in this session.
cause: The handle was never issued to a call, was evicted after later calls settled, or the host restarted, which ends held calls.
why: A held call lives in memory only. A missing handle does not say what the call would have returned.
fix: 'Use a handle from a result that returned one. A command job''s handle does not address a held call. To recover the answer, repeat the original call.'
instead: Repeat the original call; do not poll a handle that no longer exists
scenarios:
  - id: default
    vars:
      handle: held-1
      profile: coordinator
      tool: held_result
