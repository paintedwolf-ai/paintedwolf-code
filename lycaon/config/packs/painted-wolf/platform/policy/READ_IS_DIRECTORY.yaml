spec_version: "1.0"
id: READ_IS_DIRECTORY
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.next_steps, paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "READ_IS_DIRECTORY"
effect: block
category: recoverable
emit: guard:read
message: read path is a directory
what: '{{ tool }} needs a file path; {{ paintedwolf.path }} is a directory.'
cause: This operation consumes file contents. A symbol lookup also requires a concrete file path.
why: Separating file read from directory listing keeps survey JSON structured and capped.
fix: '{{ paintedwolf.next_steps }} If no listing is available, use an already observed file path or report the missing path information to the caller.'
instead: Choose the actual file needed for the operation; do not repeat the directory request or assume a missing tool can be called.
scenarios:
  - id: root
    vars:
      path: .
      profile: coordinator
      tool: read
      can_list_dir: true
      can_find: true
      can_grep: true
      can_read: true
  - id: default
    vars:
      path: lycaon/internal
      profile: explore_readonly
      tool: read
      can_list_dir: true
      can_find: true
      can_grep: true
      can_read: true
  - id: symbol_lookup
    vars:
      path: internal/session
      profile: explore_readonly
      tool: read
      can_list_dir: true
      can_find: true
      can_grep: true
      can_read: true
  - id: narrow_profile
    vars:
      tool: read
      path: plans
      can_read: true
      can_grep: true
