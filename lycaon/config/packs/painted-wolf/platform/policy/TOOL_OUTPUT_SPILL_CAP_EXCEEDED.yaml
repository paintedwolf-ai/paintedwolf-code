oar: '1.0'
id: TOOL_OUTPUT_SPILL_CAP_EXCEEDED
kind: schema
anchor: tool.rejected
requires:
  profiles:
    - tool
  facts:
    - paintedwolf.rejection_code
    - paintedwolf.execution_outcome
    - paintedwolf.bytes
    - paintedwolf.cap
    - paintedwolf.bare_repo_scope
    - paintedwolf.path
when: paintedwolf.rejection_code == "TOOL_OUTPUT_SPILL_CAP_EXCEEDED"
effect: block
copy:
  what: 'Structured {{ tool }} output is {{ paintedwolf.bytes }} bytes, above the {{ paintedwolf.cap }}-byte spill cap; the oversized spill was not written.'
  cause: 'Execution returned {{ paintedwolf.execution_outcome }} before spill admission. Refusing this output does not undo completed changes.'
  why: Structured output must remain valid JSON; cutting it to fit would corrupt the stored result.
  fix: >-
    Inspect existing results and current state before another operation. Do not repeat a mutation just to reshape its output.
    {% if paintedwolf.bare_repo_scope %}For a fresh read-only summary, use a subpath instead of path={{ paintedwolf.path }}, or add a focused pattern.
    {% else %}Use an independent bounded observation or pagination supported by its actual schema.{% endif %}
    No new spill is available from this failed write. Retain any earlier results and report the unavailable payload as a limitation.
  instead: Preserve completed work; recover only the observations still needed
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
x-paintedwolf-message: structured tool output is {{ paintedwolf.bytes }} bytes; spill cap is {{ paintedwolf.cap }}
x-paintedwolf-scenarios:
  - id: default
    vars:
      execution_outcome: completed
      bytes: 70000000
      cap: 67108864
      profile: coordinator
      reason: structured_spill_cap
      tool: summarize
    expect_contains:
      - 'Rejected:'
      - 'Code: TOOL_OUTPUT_SPILL_CAP_EXCEEDED'
