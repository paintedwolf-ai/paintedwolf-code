spec_version: "1.0"
id: DESKTOP_CAPTURE_DISALLOWED
kind: policy
on: tool.rejected
selector:
  tools:
    - command
    - verify
requires_facts: [paintedwolf.command, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "DESKTOP_CAPTURE_DISALLOWED"
effect: block
category: recoverable
emit: guard:command
message: desktop screen capture commands are disallowed
what: Desktop screen capture command {{ paintedwolf.command }} is disallowed.
cause: Desktop screen capture is outside this invocation's allowed surface.
why: ''
fix: ''
instead: ''
scenarios:
  - id: default
    vars:
      command: screencapture -x build/screen.png
      session_role: coordinator
      tool: command
