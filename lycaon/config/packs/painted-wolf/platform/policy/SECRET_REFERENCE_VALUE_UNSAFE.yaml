spec_version: "1.0"
id: SECRET_REFERENCE_VALUE_UNSAFE
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SECRET_REFERENCE_VALUE_UNSAFE"
effect: block
category: recoverable
emit: guard:tool
message: Secret value contains characters unsafe for line-oriented file write
what: Secret value contains newlines or null bytes unsafe for line-oriented file write.
cause: Line-oriented file tools cannot safely write multi-line or binary secrets without corrupting formatting.
why: File tools write single lines or delimited content, which would be corrupted by unexpected line breaks or null characters.
fix: Use `jq-edit --arg NAME VALUE` or a command environment variable instead.
instead: Do not attempt to inject multi-line or null-containing secrets into line-oriented text files
scenarios:
  - id: default
    vars:
      session_role: implement
      tool: write
