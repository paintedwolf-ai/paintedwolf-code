spec_version: "1.0"
id: SECRET_REFERENCE_VALUE_UNSAFE
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.command_external_reachable, paintedwolf.command_jq_edit_reachable, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SECRET_REFERENCE_VALUE_UNSAFE"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
message: Secret value contains characters unsafe for line-oriented file write
what: Secret value contains newlines or null bytes unsafe for line-oriented file write.
cause: Line-oriented file tools cannot safely write multi-line or binary secrets without corrupting formatting.
why: File tools write single lines or delimited content, which would be corrupted by unexpected line breaks or null characters.
fix: '{% if paintedwolf.command_jq_edit_reachable %}Use `jq-edit --arg NAME VALUE` in command{% if paintedwolf.command_external_reachable %} or a command environment variable{% endif %} instead.{% else %}{% if paintedwolf.command_external_reachable %}Pass the secret via a command environment variable instead.{% else %}Pass multi-line or binary secrets through an environment-accepting execution surface rather than a line-oriented file write, or report the limitation.{% endif %}{% endif %}'
instead: Do not attempt to inject multi-line or null-containing secrets into line-oriented text files
x-paintedwolf-scenarios:
  - id: default
    vars:
      profile: implement
      tool: write
