oar: '1.0'
id: COMMAND_EXEC_DENIED
kind: policy
anchor: tool.rejected
selector:
  tool:
  - command
  - verify
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.path
when: paintedwolf.rejection_code == "COMMAND_EXEC_DENIED"
effect: block
copy:
  what: '{% if paintedwolf.path %}Executable `{{ paintedwolf.path }}` could not be started.{% else %}The executable could not be started.{% endif %}'
  cause: The launch was refused. This observation does not distinguish file permissions, operating-system policy or confinement.
  why: ''
  fix: ''
  instead: ''
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_composition_redirect
x-paintedwolf-message: The kernel refused the resolved executable
x-paintedwolf-scenarios:
- id: default
  vars:
    path: ./ntp_check.py
  expect_contains:
  - 'Code: COMMAND_EXEC_DENIED'
  - ./ntp_check.py
  - could not be started
