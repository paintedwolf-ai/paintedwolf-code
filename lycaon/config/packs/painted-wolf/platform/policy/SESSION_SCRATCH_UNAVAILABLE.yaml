spec_version: "1.0"
id: SESSION_SCRATCH_UNAVAILABLE
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SESSION_SCRATCH_UNAVAILABLE"
effect: block
category: recoverable
emit: guard:tool
message: Session scratch is unavailable in this chat
what: 'Session scratch is unavailable in this chat, so {{ paintedwolf.path }} has no folder to resolve against.'
cause: The host could not prepare this chat's scratch folder; the cause is in the host log.
why: Scratch is a folder outside the project, so an @scratch path cannot fall back to another location.
fix: Keep intermediate output in the tool result, or write to a temporary location such as /tmp. Do not move scratch files into the project.
instead: Branch on Code; never re-create scratch files inside an attached folder
scenarios:
  - id: default
    vars:
      path: '@scratch/notes.txt'
      tool: read
