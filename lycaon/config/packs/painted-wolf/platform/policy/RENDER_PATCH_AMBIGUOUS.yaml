spec_version: "1.0"
id: RENDER_PATCH_AMBIGUOUS
kind: schema
on: tool.rejected
selector:
  tools:
    - render_view
requires_facts: [paintedwolf.handle, paintedwolf.match_count, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "RENDER_PATCH_AMBIGUOUS"
effect: block
category: recoverable
emit: guard:render_view
message: ambiguous patch target in handle markup
what: '{{ tool }} found {{ paintedwolf.match_count }} matches for old_string in render handle "{{ paintedwolf.handle }}".'
cause: The target string is ambiguous because it matches multiple locations and replace_all is false.
why: Surgical patching requires a unique match to prevent unintended changes to other parts of the markup.
fix: Include more surrounding context in old_string to make it unique, or set replace_all to true if all matches should change.
instead: 'Branch on Code RENDER_PATCH_AMBIGUOUS; include surrounding context or set replace_all: true'
scenarios:
  - id: default
    vars:
      handle: mockup-1
      match_count: '3'
      profile: coordinator
      tool: render_view
