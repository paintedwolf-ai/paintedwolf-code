spec_version: "1.0"
id: MESSAGE_COORDINATOR_NO_WORKER
kind: schema
on: tool.rejected
selector:
  tools:
    - message_coordinator
requires_facts: [paintedwolf.next_steps, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "MESSAGE_COORDINATOR_NO_WORKER"
effect: block
category: recoverable
emit: guard:message_coordinator
message: This leg is not a worker, so it has no message history with the coordinator.
what: This leg is not a worker, so it has no message history with the coordinator.
cause: message_coordinator ran in a spawned leg that was not started as a worker.
why: Messages belong to a worker and are delivered to the coordinator through that worker's history.
fix: '{{ paintedwolf.next_steps }}'
instead: Branch on Code MESSAGE_COORDINATOR_NO_WORKER; put what you wanted to say in your leg report, or ask for a decision if you cannot proceed
scenarios:
  - id: default
    vars:
      profile: explore
      tool: message_coordinator
