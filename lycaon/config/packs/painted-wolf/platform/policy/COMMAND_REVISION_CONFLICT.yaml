oar: '1.0'
id: COMMAND_REVISION_CONFLICT
kind: policy
anchor: tool.rejected
requires:
  profiles: [tool]
  facts: [paintedwolf.rejection_code, paintedwolf.path, paintedwolf.unsaved_draft, paintedwolf.write_protection_unavailable, paintedwolf.write_protection_has_aliases]
when: paintedwolf.rejection_code == "COMMAND_REVISION_CONFLICT"
effect: block
copy:
  what: '{% if paintedwolf.write_protection_unavailable %}This command did not start because the host could not protect {{ paintedwolf.path }} from writes.{% else %}{% if paintedwolf.unsaved_draft %}{{ paintedwolf.path }} has unsaved changes in the editor, so this operation did not write there.{% else %}{{ paintedwolf.path }} changed after the program captured it, so this operation did not publish.{% endif %}{% endif %}'
  cause: '{% if paintedwolf.write_protection_unavailable %}{% if paintedwolf.write_protection_has_aliases %}The file has another hard link. Protecting one name cannot prevent writes through its other name.{% else %}The available launch boundary cannot protect this editor path from writes.{% endif %}{% else %}{% if paintedwolf.unsaved_draft %}The editor has unsaved changes in {{ paintedwolf.path }}; commands must keep those changes safe.{% else %}A person, editor or another process changed the input or output file while this command prepared its change.{% endif %}{% endif %}'
  why: '{% if paintedwolf.write_protection_unavailable %}An unprotected command could overwrite unsaved editor work.{% else %}{% if paintedwolf.unsaved_draft %}Overwriting {{ paintedwolf.path }} on disk could conflict with its unsaved editor changes.{% else %}Saving now could overwrite a newer change. The command stopped instead of trying again automatically.{% endif %}{% endif %}'
  fix: '{% if paintedwolf.write_protection_unavailable %}Wait until the draft is saved or discarded before trying this command again.{% else %}{% if paintedwolf.unsaved_draft %}Leave {{ paintedwolf.path }} unchanged until its draft is saved or discarded.{% else %}Keep the current file and the results of commands that already ran. Read the current file before preparing a new change.{% endif %}{% endif %}'
  instead: '{% if paintedwolf.write_protection_unavailable %}Keep the unsaved changes and do not retry the same launch{% else %}{% if paintedwolf.unsaved_draft %}Keep the unsaved editor changes{% else %}Keep the newer file; do not run the same write again{% endif %}{% endif %}'
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_revision_pin
x-paintedwolf-message: command stopped to preserve a file revision or unsaved editor changes
x-paintedwolf-scenarios:
  - id: destination-moved
    vars:
      tool: command
      path: config/app.json
    expect_contains:
      - 'Code: COMMAND_REVISION_CONFLICT'
      - config/app.json changed after the program captured it
