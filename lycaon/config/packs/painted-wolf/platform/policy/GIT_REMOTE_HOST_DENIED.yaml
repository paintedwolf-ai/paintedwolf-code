spec_version: "1.0"
id: GIT_REMOTE_HOST_DENIED
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "GIT_REMOTE_HOST_DENIED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_git_remote
message: The Git remote's host was not authorized
what: The Git remote's host was not authorized.
cause: The host denied network access to this remote before Git contacted it, so the fetch, pull, push, clone or ls-remote did not run.
why: Native Git network commands cross the same egress approval boundary as every other network client.
fix: Keep earlier results. Use a remote whose host is authorized, or report the blocked remote to the caller.
instead: Do not reach the remote through another network client or an external git
x-paintedwolf-scenarios:
  - id: default
    vars:
      tool: command
      profile: implement
