spec_version: "1.0"
id: SUBMIT_VERDICT_QUESTION_INVALID
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.offenders_sample, paintedwolf.rejection_code, paintedwolf.rejection_reason]
when: paintedwolf.rejection_code == "SUBMIT_VERDICT_QUESTION_INVALID"
effect: block
x-paintedwolf-severity: error
category: recoverable
emit: guard:workflow
message: The follow-up question needs a valid transition.
what: 'The follow-up question cannot make this transition{% if paintedwolf.offenders_sample %}: {{ paintedwolf.offenders_sample }}{% endif %}.'
cause: '{{ paintedwolf.rejection_reason }}.'
why: Question identity, completed investigations, and current review evidence determine which transitions are available.
fix: >-
  Register open claims with question: {missing_fact, obligations}, using current obligation ids; retain each registered scope and include every claim's outcome. Wait for active work. Dispatch any required investigation with the question id as workflow_work_id, then the declared reviewer with the returned review_work_id. A terminal verdict needs current review evidence and a coverage assessment for every question. After the investigation allowance is exhausted, keep unanswered claims unresolved and assess their impact as immaterial, material_open, or essential_open; do not request another follow-up or mark an open question covered.
instead: Keep completed investigations and their evidence. Do not rename a question, drop its scope, or mark it covered to make the transition pass.
scenarios:
  - id: review_required
    vars:
      rejection_reason: claim_outcome_required
      offenders_sample: question/c1
  - id: exhausted
    vars:
      rejection_reason: investigations_exhausted
      offenders_sample: ''
