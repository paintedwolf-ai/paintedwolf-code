spec_version: "1.0"
id: COMMAND_EXTERNAL_HIDDEN
kind: schema
on: tool.rejected
selector:
  tools:
    - command
    - verify
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "COMMAND_EXTERNAL_HIDDEN"
effect: block
category: recoverable
emit: guard:tool
message: the external selector is turned off on this host
what: The external selector is turned off on this host, so this statement did not run.
cause: This host runs native utilities by their own names and every other program directly by name.
why: With the selector off, a native name always reaches its native owner.
fix: ''
instead: ''
scenarios:
  - id: default
    vars:
      tool: command
