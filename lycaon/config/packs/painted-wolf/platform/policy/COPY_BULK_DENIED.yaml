spec_version: "1.0"
id: COPY_BULK_DENIED
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - copy
requires_facts: [paintedwolf.bulk_denied, paintedwolf.max_pairs, paintedwolf.operation, paintedwolf.rejection_code, paintedwolf.requested]
when: paintedwolf.rejection_code == "COPY_BULK_DENIED"
effect: block
category: recoverable
emit: guard:copy
message: copy:copy batch exceeds max pairs
what: copy received {{ paintedwolf.requested }} pairs; the limit is {{ paintedwolf.max_pairs }} per call.
cause: The explicit source–destination batch exceeds its bound.
why: Each source must remain paired with its intended destination.
fix: Split the intended pairs into batches of at most {{ paintedwolf.max_pairs }}. Preserve pair order where one copy depends on another; do not broaden the target set.
instead: Reduce the pair count while retaining each source–destination assignment
scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      profile: implement
      tool: copy
