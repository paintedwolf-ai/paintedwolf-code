spec_version: "1.0"
id: READ_PATH_NOT_FOUND
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - read
      - edit
      - write
      - replace_lines
      - code_rewrite
      - jq_edit
      - diff
requires_facts: [paintedwolf.can_find, paintedwolf.can_list_dir, paintedwolf.operation, paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "READ_PATH_NOT_FOUND"
effect: block
category: recoverable
emit: guard:read
message: read path does not exist
what: '{{ tool }} could not open {{ paintedwolf.path }} — path does not exist in the attached folders.'
cause: The path must name an existing file; directories and out-of-scope paths are rejected separately.
why: Structured rejects include optional suggestions so agents can fix typos without guessing from free-form errors.
fix: '{% if paintedwolf.can_list_dir %}Inspect the intended parent with the offered directory listing.{% endif %}{% if paintedwolf.can_find %} Use the offered file search to resolve the intended filename.{% endif %} Correct a demonstrated path mistake within the attached folders, then retry {{ tool }}. Do not create an empty substitute for missing input.'
instead: Correct the path from observed evidence, or report the missing input
scenarios:
  - id: default
    vars:
      path: src/missing.go
      profile: explore_readonly
      tool: read
