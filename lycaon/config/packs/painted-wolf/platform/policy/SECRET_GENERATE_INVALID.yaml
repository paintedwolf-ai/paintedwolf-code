spec_version: "1.0"
id: SECRET_GENERATE_INVALID
kind: schema
on: tool.rejected
selector:
  tools:
    - secret_generate
requires_facts: [paintedwolf.rejection_code, paintedwolf.rejection_field, paintedwolf.rejection_reason]
when: paintedwolf.rejection_code == "SECRET_GENERATE_INVALID"
effect: block
category: recoverable
emit: guard:tool
message: The secret generation request is invalid
what: 'The secret generation field {{ paintedwolf.rejection_field }} is invalid: {{ paintedwolf.rejection_reason }}.'
cause: A name, purpose, scope, format, size, or lifetime is outside the published schema.
why: The host must be able to validate the secret lifecycle before creating protected value material.
fix: Correct the identified field using the current schema bounds while preserving the intended format, strength, scope, and lifetime. Omit an optional field only when its default is intended; do not round or coerce supplied values.
instead: Keep the value host-generated and use the documented bounds
scenarios:
  - id: default
    vars:
      profile: implement
      tool: secret_generate
