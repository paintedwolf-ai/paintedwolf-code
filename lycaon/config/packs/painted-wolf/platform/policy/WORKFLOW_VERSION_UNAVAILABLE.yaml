spec_version: "1.0"
id: WORKFLOW_VERSION_UNAVAILABLE
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code, paintedwolf.rejection_reason]
when: paintedwolf.rejection_code == "WORKFLOW_VERSION_UNAVAILABLE"
effect: block
category: recoverable
emit: rule:coordinator
message: Workflow version is unavailable
what: The workflow version is unavailable.
cause: '{{ paintedwolf.rejection_reason }}'
why: The requested workflow version is not available and cannot be resumed.
fix: Start a new run with the current workflow version or exit the workflow with /exit.
instead: Follow the current workflow version and task intent
scenarios:
  - id: default
    vars:
      session_role: coordinator
      rejection_reason: workflow version is unavailable
