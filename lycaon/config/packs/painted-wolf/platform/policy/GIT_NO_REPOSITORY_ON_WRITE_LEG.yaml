oar: '1.0'
id: GIT_NO_REPOSITORY_ON_WRITE_LEG
kind: policy
anchor: tool.post_invoke
selector:
  tool: [command]
requires:
  profiles: [tool]
  facts:
  - paintedwolf.git_no_repository_on_write_leg
  - paintedwolf.source_history_offered
when: paintedwolf.git_no_repository_on_write_leg
effect: warn
copy:
  what: A Git read in this command found no repository on this write leg.
  cause: This directory has no repository, and the leg's own copy of the project has no Git metadata, so Git reported its own fatal and status 128.
  why: The command ran normally and Git's answer stands. A retry in this directory gets the same answer.
  fix: >-
    {% if paintedwolf.source_history_offered %}Call `source_history()` for what changed on your branch this session,
    every actor, and `source_history(path, mode="diff")` for one file's change since the session began.
    {% else %}Work from the files on this leg, and state in your result anything that needs Git history.{% endif %}
  instead: Committed history belongs to a read-scoped leg or the coordinator on the primary tree.
x-paintedwolf-category: informational
x-paintedwolf-emit: guard:git_no_repository_on_write_leg
x-paintedwolf-message: a Git read found no repository on this write leg
x-paintedwolf-scenarios:
- id: default
  vars:
    tool: command
    profile: implement
    source_history_offered: true
  expect_contains:
  - 'Code: GIT_NO_REPOSITORY_ON_WRITE_LEG'
  - source_history()
- id: without_source_history
  vars:
    tool: command
    profile: plan_write_only
    source_history_offered: false
  expect_contains:
  - 'Code: GIT_NO_REPOSITORY_ON_WRITE_LEG'
  - state in your result
