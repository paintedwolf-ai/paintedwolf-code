oar: '1.0'
id: GIT_NO_REPOSITORY_ON_WRITE_LEG
kind: policy
anchor: tool.rejected
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.source_history_offered
when: paintedwolf.rejection_code == "GIT_NO_REPOSITORY_ON_WRITE_LEG"
effect: block
copy:
  what: Git has no repository to read on this write leg.
  cause: A write leg works in a copy of the project without Git metadata.
  why: Another directory or a retry cannot change that, so the answer has to come from elsewhere.
  fix: >-
    {% if paintedwolf.source_history_offered %}Call `source_history()` for what changed on your branch this session,
    every actor, and `source_history(path, mode="diff")` for one file's change since the session began.
    {% else %}Work from the files on this leg, and state in your result anything that needs Git history.{% endif %}
  instead: Committed history belongs to a read-scoped leg or the coordinator on the primary tree; do not retry Git here.
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:git_no_repository_on_write_leg
x-paintedwolf-message: Git has no repository on this write leg
x-paintedwolf-scenarios:
- id: default
  vars:
    tool: command
    profile: implement
    source_history_offered: true
  expect_contains:
  - 'Rejected:'
  - 'Code: GIT_NO_REPOSITORY_ON_WRITE_LEG'
- id: without_source_history
  vars:
    tool: command
    profile: plan_write_only
    source_history_offered: false
  expect_contains:
  - 'Code: GIT_NO_REPOSITORY_ON_WRITE_LEG'
