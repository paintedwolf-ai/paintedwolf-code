oar: '1.0'
id: SUBMIT_VERDICT_REVIEWER_UNCITED
kind: policy
anchor: tool.rejected
requires:
  profiles:
    - tool
  facts:
    - paintedwolf.rejection_code
    - paintedwolf.review_expected_call
    - paintedwolf.review_uncited_reviewers
when: paintedwolf.rejection_code == "SUBMIT_VERDICT_REVIEWER_UNCITED"
effect: block
copy:
  what: "The verdict does not cite these required reviewer envelopes: {{ paintedwolf.review_uncited_reviewers }}."
  cause: "The submitted citations resolve, but do not cover every owed reviewer."
  why: "Every owed reviewer must contribute traceable evidence to the terminal ruling."
  fix: "Add an observed handle, path or URL from each named reviewer envelope without removing already valid citations. Current call shape: {{ paintedwolf.review_expected_call }}."
  instead: "Repair the citation metadata using existing envelopes; do not dispatch another review merely to obtain citations."
x-paintedwolf-category: recoverable
x-paintedwolf-severity: error
x-paintedwolf-message: Terminal verdict does not cite every owed reviewer.
x-paintedwolf-scenarios:
  - id: skeptic
    vars: { review_uncited_reviewers: [skeptic] }
    expect_contains: ['Code: SUBMIT_VERDICT_REVIEWER_UNCITED', 'skeptic']
x-paintedwolf-emit: guard:workflow
