spec_version: "1.0"
id: TASK_SCOPE_WRITE_REQUIRED
kind: policy
on: coordinator.pre_invoke
selector: {}
requires_facts: [paintedwolf.agent_type, paintedwolf.next_steps, paintedwolf.profile_mutation_capable, paintedwolf.scope_mode, paintedwolf.tool_is_task]
when: paintedwolf.tool_is_task && paintedwolf.profile_mutation_capable && paintedwolf.scope_mode != "write"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
message: Mutation-capable profiles require scope.mode write
what: '**{{ paintedwolf.agent_type }}** uses a mutation-capable tool profile and must start with **`scope.mode: write`** so changes land in an isolated worker workspace.'
cause: You started a mutation-capable worker with read scope or omitted scope (which defaults to read).
why: 'Read-scoped workers inspect the primary tree without mutating it; file mutations require a write workspace and overlay.'
fix: '{{ paintedwolf.next_steps }}'
instead: 'Branch on Code: read-only profiles for inspection; mutation-capable profiles only with write workspaces.'
x-paintedwolf-scenarios:
  - id: default
    vars:
      agent_type: implementer
      detail: bad args
      path: src/main.go
      profile: coordinator
      scope_mode: read
      scope_paths: []
      tool: task
