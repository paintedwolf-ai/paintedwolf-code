spec_version: "1.0"
id: GIT_COMMIT_BULK_DENIED
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - git_commit
requires_facts: [paintedwolf.bulk_denied, paintedwolf.max_paths, paintedwolf.operation, paintedwolf.rejection_code, paintedwolf.requested]
when: paintedwolf.rejection_code == "GIT_COMMIT_BULK_DENIED"
effect: block
category: recoverable
emit: guard:tool
message: git_commit bulk path list denied
what: git_commit received {{ paintedwolf.requested }} staging paths; the cap is {{ paintedwolf.max_paths }}.
cause: The staging set exceeds the host’s per-commit bound.
why: A path count alone does not establish how many logical changes the work contains.
fix: Review the intended change and authorization. Split into coherent commits only when that matches the task, keeping each staging set within {{ paintedwolf.max_paths }}; otherwise report the limit instead of arbitrarily fragmenting the change.
instead: Resolve staging scope and commit intent before retrying
scenarios:
  - id: default
    vars:
      path: src/main.go
      session_role: coordinator
      tool: git_commit
