spec_version: "1.0"
id: SESSION_OUTPUT_UNAVAILABLE
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SESSION_OUTPUT_UNAVAILABLE"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
message: Session output is unavailable in this chat
what: 'This call has no session output folder, so {{ paintedwolf.path }} cannot resolve.'
cause: The host did not provide this chat's output folder.
why: Each chat reads its own output copies; this address cannot fall back to another folder.
fix: Keep the existing result. Retry after the chat's output storage is available.
instead: Keep the delivered result until output storage is available
x-paintedwolf-scenarios:
  - id: default
    vars:
      path: '@output/program.stdout'
      tool: read
