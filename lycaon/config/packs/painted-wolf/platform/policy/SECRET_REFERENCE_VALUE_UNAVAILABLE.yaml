spec_version: "1.0"
id: SECRET_REFERENCE_VALUE_UNAVAILABLE
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SECRET_REFERENCE_VALUE_UNAVAILABLE"
effect: block
category: recoverable
emit: guard:tool
message: The managed secret's protected value is unavailable
what: The managed secret's protected value is unavailable.
cause: Metadata exists, but the host cannot retrieve the corresponding value from protected storage.
why: The host does not recover missing values from logs, transcripts, or model output.
fix: Use a replacement reference after the protected-store issue is resolved.
instead: Do not reveal or reconstruct the missing value
scenarios:
  - id: default
    vars: {session_role: implement, tool: command}
