spec_version: "1.0"
id: INSTRUCT_WORKER_AGENT_BETWEEN_ROUNDS
kind: schema
on: tool.rejected
selector:
  tools:
    - instruct_worker
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "INSTRUCT_WORKER_AGENT_BETWEEN_ROUNDS"
effect: block
category: recoverable
emit: guard:instruct_worker
message: A worker changes agent only between rounds.
what: A worker changes agent only between rounds.
cause: The worker is working or asking now.
why: A running round keeps the agent, tools and confinement it started with.
fix: Send the instruction without agent_type now, or change the agent after the round delivers.
instead: Branch on Code INSTRUCT_WORKER_AGENT_BETWEEN_ROUNDS; do not retry the same call
scenarios:
  - id: default
    vars:
      profile: coordinator
      tool: instruct_worker
