spec_version: "1.0"
id: SURVEY_GLOB_INVALID
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - grep
      - find
requires_facts: [paintedwolf.detail, paintedwolf.operation, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SURVEY_GLOB_INVALID"
effect: block
category: recoverable
emit: guard:grep
message: Discovery glob is invalid
what: 'Invalid discovery glob: {{ paintedwolf.detail }}.'
cause: The file selection pattern could not be compiled.
why: An invalid filter must not be reported as an empty search.
fix: "Use *, ?, character classes, ** for directories, and comma-separated brace alternatives such as **/*.{go,ts}. Escape literal metacharacters."
instead: Branch on Code; correct the glob and retry
scenarios:
  - id: default
    vars:
      session_role: coordinator
      tool: grep
      detail: unmatched brace
