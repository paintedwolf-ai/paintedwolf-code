spec_version: "1.0"
id: EXTRACT_FORMAT_UNSUPPORTED
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.admitted_archive_forms, paintedwolf.extract_allowed, paintedwolf.extract_format_cause, paintedwolf.extract_invalid_format, paintedwolf.extract_rejected_value, paintedwolf.operation, paintedwolf.path, paintedwolf.rejection_code, paintedwolf.unsupported]
when: paintedwolf.operation == "extract_archive" && paintedwolf.rejection_code == "EXTRACT_FORMAT_UNSUPPORTED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:extract_archive
message: extract_archive format not supported
what: '{% if paintedwolf.extract_invalid_format %}archive format {{ paintedwolf.extract_rejected_value }} is not supported for {{ paintedwolf.path }}.{% else %}path {{ paintedwolf.path }} ({{ paintedwolf.extract_rejected_value }}) does not have a supported archive suffix.{% endif %}'
cause: '{% if paintedwolf.extract_invalid_format %}Explicit archive format ({{ paintedwolf.extract_format_cause }}) must be one of: {{ paintedwolf.extract_allowed }}.{% else %}Archive path suffix ({{ paintedwolf.extract_format_cause }}) must be one of: {{ paintedwolf.extract_allowed }}.{% endif %}'
why: Narrow format set keeps parser and zip-slip defenses auditable.
fix: >-
  {% if paintedwolf.extract_invalid_format %}Omit the explicit format to select from the archive suffix, or pass one of the supported formats ({{ paintedwolf.extract_allowed }}).{% else %}Use an actual supported archive ({{ paintedwolf.extract_allowed }}) containing the intended data. Renaming an unsupported file does not convert its contents.{% endif %} {% if paintedwolf.admitted_archive_forms %}Inside command, {{ paintedwolf.admitted_archive_forms }} when that is the intended task.{% else %}Inspect a single uncompressed file with an offered reader when that is the intended task.{% endif %}
instead: Branch on Code
x-paintedwolf-scenarios:
  - id: unsupported-suffix
    vars:
      extract_allowed: [.zip, .tar, .tar.gz, .tgz, .tar.bz2, .tbz2, .tar.xz, .txz, .tar.zst, .tzst]
      extract_format_cause: unsupported_suffix
      extract_invalid_format: false
      extract_rejected_value: .7z
      path: vendor/sdk.7z
      profile: implement
      tool: extract_archive
    expect_contains:
      - vendor/sdk.7z
      - .7z
      - .tar, .tar.gz
      - .tzst
  - id: invalid-explicit-format
    vars:
      extract_allowed: [zip, tar, tar.gz, tar.bz2, tar.xz, tar.zst]
      extract_format_cause: invalid_format
      extract_invalid_format: true
      extract_rejected_value: 7z
      format: 7z
      path: vendor/sdk.tar
      profile: implement
      tool: extract_archive
    expect_contains:
      - vendor/sdk.tar
      - 7z
      - zip, tar, tar.gz
      - tar.zst
  - id: command-leg
    vars:
      admitted_archive_forms: 'inspect a single zip member with `unzip -p` or extract a tar member with `tar -x -f`'
      extract_allowed: [.zip, .tar, .tar.gz, .tgz, .tar.bz2, .tbz2, .tar.xz, .txz, .tar.zst, .tzst]
      extract_format_cause: unsupported_suffix
      extract_invalid_format: false
      extract_rejected_value: .7z
      path: vendor/sdk.7z
      profile: implement
      tool: extract_archive
    expect_contains:
      - '`unzip -p`'
