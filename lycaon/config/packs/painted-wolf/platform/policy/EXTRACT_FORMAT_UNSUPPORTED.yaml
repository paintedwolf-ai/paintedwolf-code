oar: '1.0'
id: EXTRACT_FORMAT_UNSUPPORTED
kind: schema
anchor: tool.rejected
selector:
  tool:
  - extract_archive
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.path
  - paintedwolf.unsupported
when: paintedwolf.rejection_code == "EXTRACT_FORMAT_UNSUPPORTED"
effect: block
copy:
  what: path {{ paintedwolf.path }} is not a supported archive extension.
  cause: This extractor accepts archive formats identified by the .zip and .tar.gz suffixes.
  why: Narrow format set keeps parser and zip-slip defenses auditable.
  fix: Use an actual supported archive containing the intended data. Renaming an unsupported file does not
    convert its contents. Inspect a single uncompressed file with an offered read tool when that is the intended
    task.
  instead: Branch on Code
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:extract_archive
x-paintedwolf-message: extract_archive format not supported
x-paintedwolf-scenarios:
- id: default
  vars:
    allowed: .zip, .tar.gz
    path: vendor/sdk.tar
    profile: implement
    tool: extract_archive
  expect_contains:
  - 'Rejected:'
  - 'Code: EXTRACT_FORMAT_UNSUPPORTED'
