oar: '1.0'
id: EDIT_TARGET_CHANGED_BY_OTHERS
kind: schema
anchor: tool.rejected
selector:
  tool:
  - edit
requires:
  profiles:
  - filesystem
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.old_string_chars
  - paintedwolf.path
  - paintedwolf.total_lines
  - paintedwolf.change_count
when: paintedwolf.rejection_code == "EDIT_TARGET_CHANGED_BY_OTHERS"
effect: block
copy:
  what: edit on {{ paintedwolf.path }} could not find old_string ({{ paintedwolf.old_string_chars }} chars),
    and the ledger recorded {{ paintedwolf.change_count }} change(s) to this file by other actors during this
    session.
  cause: The ledger records other actors’ changes during this session. They may explain the miss, but a misquoted
    old_string can also fail; changed_by identifies the recorded actors and times.
  why: Read the current text before attributing the mismatch or recomputing an edit; the existence of a foreign
    change alone does not prove it caused this miss.
  fix: >-
    {% if paintedwolf.replacement_matches > 0 %}The requested nonempty new_string already occurs
    {{ paintedwolf.replacement_matches }} time(s) in the edit basis, first at line
    {{ paintedwolf.replacement_line }}. This call made no change; this observation does not prove an earlier
    edit succeeded. Read {{ paintedwolf.path }} to check whether the intended change is already satisfied
    before attempting another mutation.{% else %}Read {{ paintedwolf.path }} again; use read_hint when present.
    Check whether the intended change is still needed. If it is, copy a fresh verbatim substring into old_string,
    without displayed line labels and preserving indentation.{% endif %}
  instead: Inspect source_history when attribution is needed. Do not repeat the same edit or replace the whole
    file merely to bypass a missing match.

x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:edit
x-paintedwolf-message: edit target changed by another actor this session
x-paintedwolf-scenarios:
- id: default
  vars:
    change_count: 2
    old_string_chars: 42
    path: internal/foo.go
    profile: implement
    tool: edit
    total_lines: 120
  expect_contains:
  - 'Rejected:'
  - 'Code: EDIT_TARGET_CHANGED_BY_OTHERS'

- id: replacement_present
  vars:
    change_count: 2
    old_string_chars: 42
    path: internal/foo.go
    profile: implement
    tool: edit
    total_lines: 120
    replacement_matches: 1
    replacement_line: 7
  expect_contains:
  - 'already occurs'
  - 'This call made no change'
  - 'does not prove an earlier'
