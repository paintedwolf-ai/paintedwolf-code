spec_version: "1.0"
id: FILE_CHANGE_APPROVAL_UNAVAILABLE
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "FILE_CHANGE_APPROVAL_UNAVAILABLE"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
message: file change approval is unavailable
what: This call cannot review the change to {{ paintedwolf.path }}.
cause: File change approvals are unavailable.
fix: Ask the person to enable approvals or make this change.
instead: Do not retry the file change through another command while approval is unavailable.
x-paintedwolf-scenarios:
  - id: default
    vars:
      path: .paintedwolf/rules.md
