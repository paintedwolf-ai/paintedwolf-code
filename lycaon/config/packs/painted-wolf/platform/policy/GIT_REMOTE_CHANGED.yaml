spec_version: "1.0"
id: GIT_REMOTE_CHANGED
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "GIT_REMOTE_CHANGED"
effect: block
category: recoverable
emit: guard:command_git_remote
message: The Git remote changed during authorization
what: The Git remote changed while its hosts were being authorized.
cause: The repository's remote URLs resolved differently after authorization, so Git did not contact any remote.
why: Authorization covers the remotes that were resolved; a changed remote needs its own decision.
fix: Run the command again so the current remotes are authorized.
instead: Do not reach the remote through another network client or an external git
scenarios:
  - id: default
    vars:
      tool: command
      session_role: implement
