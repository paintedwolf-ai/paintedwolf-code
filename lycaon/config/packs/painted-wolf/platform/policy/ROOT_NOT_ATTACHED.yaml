spec_version: "1.0"
id: ROOT_NOT_ATTACHED
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.attached_folders, paintedwolf.path, paintedwolf.rejection_code, paintedwolf.root_label, paintedwolf.root_status]
when: paintedwolf.rejection_code == "ROOT_NOT_ATTACHED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:path
message: folder no longer attached at this path or label
what: '{{ paintedwolf.path }} names folder {{ paintedwolf.root_label }}, which was {{ paintedwolf.root_status }}.'
cause: The project's folders changed after this path or label was written. The old path and label no longer carry the folder's access.
why: A folder that is no longer attached is not treated as an arbitrary host path, so the path is refused rather than reviewed for approval.
fix: 'Use a folder attached now: {{ paintedwolf.attached_folders }}. A moved or renamed folder keeps its files under its new @label.'
instead: Address the folder by its current @label
x-paintedwolf-scenarios:
  - id: default
    vars:
      path: '@web/src/main.go'
      root_label: web
      root_status: removed
      attached_folders: ['@api (session folder)']
      tool: command