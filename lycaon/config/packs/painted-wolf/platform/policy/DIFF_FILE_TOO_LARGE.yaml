oar: '1.0'
id: DIFF_FILE_TOO_LARGE
kind: schema
anchor: tool.rejected
selector:
  tool:
  - diff
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.max_path_bytes
  - paintedwolf.path
  - paintedwolf.size
  - paintedwolf.resource_limit
when: paintedwolf.rejection_code == "DIFF_FILE_TOO_LARGE"
effect: block
copy:
  what: diff path {{ paintedwolf.path }} exceeds max_path_bytes {{ paintedwolf.max_path_bytes }} (size {{ paintedwolf.size
    }}).
  cause: An input exceeds the host’s per-file diff budget.
  why: The host bounds input memory and comparison cost at {{ paintedwolf.max_path_bytes }} bytes per file.
  fix: Use an offered bounded read to inspect the relevant text, or compare smaller intended inputs. A partial
    read is not a full-file diff; report that limit instead of claiming a complete comparison.
  instead: Branch on Code
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:diff
x-paintedwolf-message: diff input file exceeds max_path_bytes
x-paintedwolf-scenarios:
- id: default
  vars:
    detail: bad args
    max_path_bytes: 2097152
    path: internal/foo.go
    profile: implement
    size: 3000000
    tool: diff
  expect_contains:
  - 'Rejected:'
  - 'Code: DIFF_FILE_TOO_LARGE'
