spec_version: "1.0"
id: SECRET_REFERENCE_NOT_FOUND
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SECRET_REFERENCE_NOT_FOUND"
effect: block
category: recoverable
emit: guard:tool
message: The managed secret reference was not found
what: The managed secret reference was not found.
cause: Its metadata does not exist in the current host store.
why: Missing capability identifiers never resolve to guessed or newly generated values.
fix: Use a live reference visible to this chat. If none is available, report the dependency through the current session’s available completion or user-response surface.
instead: Do not substitute a model-generated value
scenarios:
  - id: default
    vars:
      session_role: implement
      tool: command
