oar: '1.0'
id: SECRET_REFERENCE_NOT_FOUND
kind: schema
anchor: tool.rejected
requires:
  facts:
  - paintedwolf.rejection_code
  profiles:
  - tool
when: paintedwolf.rejection_code == "SECRET_REFERENCE_NOT_FOUND"
effect: block
copy:
  what: The managed secret reference was not found.
  cause: Its metadata does not exist in the current host store.
  why: Missing capability identifiers never resolve to guessed or newly generated values.
  fix: Use a live reference visible to this chat. If none is available, report the dependency through the current
    session’s available completion or user-response surface.
  instead: Do not substitute a model-generated value
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
x-paintedwolf-message: The managed secret reference was not found
x-paintedwolf-scenarios:
- id: default
  vars:
    profile: implement
    tool: command
  expect_contains:
  - 'Rejected:'
  - 'Code: SECRET_REFERENCE_NOT_FOUND'
