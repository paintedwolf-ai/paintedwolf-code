oar: '1.0'
id: CWD_OUT_OF_SCOPE
kind: schema
anchor: tool.rejected
selector:
  tool:
    - command
    - verify
    - terminal_open
requires:
  profiles:
    - tool
  facts:
    - paintedwolf.rejection_code
    - paintedwolf.cwd
when: paintedwolf.rejection_code == "CWD_OUT_OF_SCOPE"
effect: block
copy:
  what: The requested working directory {{ paintedwolf.cwd }} is outside this invocation's project read scope.
  cause: Working directory must resolve within attached project roots and read scope.
  why: Per-call cwd is validated like any path op — out-of-scope paths are rejected before the command runs.
  fix: Use an existing directory inside the attached project scope; `@label/sub/path` identifies an attached non-primary root.
  instead: ''
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
x-paintedwolf-message: '`command`/`terminal_open` cwd outside project scope'
x-paintedwolf-scenarios:
  - id: default
    vars:
      cwd: /etc
      profile: implement
      tool: command
    expect_contains:
      - 'Rejected:'
      - 'Code: CWD_OUT_OF_SCOPE'
      - read scope
