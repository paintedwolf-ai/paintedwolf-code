spec_version: "1.0"
id: CHMOD_SYMLINK_ESCAPE
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - chmod
requires_facts: [paintedwolf.operation, paintedwolf.path, paintedwolf.path_escape, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "CHMOD_SYMLINK_ESCAPE"
effect: block
category: recoverable
emit: guard:chmod
message: chmod symlink target escapes workspace
what: chmod on {{ paintedwolf.path }} was rejected because the symlink target escapes the workspace.
cause: The link resolves outside the permitted workspace or write scope.
why: The resolved target needs its own write authority.
fix: Operate on an intended in-scope target only. Do not replace or retarget a link merely to evade the boundary.
instead: Branch on Code; resolve symlink to an in-boundary path
scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      profile: coordinator
      tool: chmod
