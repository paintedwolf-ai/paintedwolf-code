spec_version: "1.0"
id: SUMMARIZE_CURSOR_STALE
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.operation, paintedwolf.rejection_code]
when: paintedwolf.operation == "summarize" && paintedwolf.rejection_code == "SUMMARIZE_CURSOR_STALE"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:summarize
message: '`summarize` cursor is stale for this scope'
what: '`summarize` received a cursor that is not valid for this scope and source generation.'
cause: The source changed or the cursor belongs to another path set or pattern.
why: A cursor advances only the exact view that issued it.
fix: Restart summarize without cursor on the same intended scope. Earlier pages may describe a different source generation; do not combine them as though one consistent view.
instead: Remove cursor and retry the same scope once
x-paintedwolf-scenarios:
  - id: default
    vars:
      profile: coordinator
      tool: summarize
