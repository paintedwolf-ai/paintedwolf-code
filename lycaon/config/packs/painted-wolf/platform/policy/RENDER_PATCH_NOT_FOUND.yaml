spec_version: "1.0"
id: RENDER_PATCH_NOT_FOUND
kind: schema
on: tool.rejected
selector:
  tools:
    - render_view
requires_facts: [paintedwolf.handle, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "RENDER_PATCH_NOT_FOUND"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:render_view
message: patch target string not found in handle markup
what: '{{ tool }} could not find old_string in render handle "{{ paintedwolf.handle }}".'
cause: The exact target string to replace does not match the handle's stored markup.
why: Surgical patching requires an exact substring match in the handle's current markup.
fix: Check the handle's current markup or re-render the view with full markup to establish a new baseline.
instead: Branch on Code RENDER_PATCH_NOT_FOUND; provide full markup or check the target string
x-paintedwolf-scenarios:
  - id: default
    vars:
      handle: mockup-1
      profile: coordinator
      tool: render_view
