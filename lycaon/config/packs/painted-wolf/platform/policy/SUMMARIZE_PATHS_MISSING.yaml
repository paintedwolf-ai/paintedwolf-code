spec_version: "1.0"
id: SUMMARIZE_PATHS_MISSING
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - summarize
requires_facts: [paintedwolf.missing_paths, paintedwolf.next_steps, paintedwolf.operation, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SUMMARIZE_PATHS_MISSING"
effect: block
category: recoverable
emit: guard:summarize
message: requested summary inputs include missing paths
what: 'Some requested summarize inputs do not exist: {{ paintedwolf.missing_paths }}.'
cause: Each path or paths entry must be an existing file or directory — a bare relative path resolves in the session folder, or use @label/path for another attached folder.
why: A summary must preserve the requested input scope; silently dropping missing entries would make it incomplete.
fix: '{{ paintedwolf.next_steps }}'
instead: Branch on Code; fix paths and retry once
scenarios:
  - id: default
    vars:
      path: missing.go
      profile: coordinator
      tool: summarize
