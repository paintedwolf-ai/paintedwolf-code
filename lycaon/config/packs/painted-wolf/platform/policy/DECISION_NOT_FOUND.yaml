oar: '1.0'
id: DECISION_NOT_FOUND
kind: policy
anchor: tool.rejected
requires:
  profiles:
  - tool
  facts: [paintedwolf.rejection_code, paintedwolf.worker, paintedwolf.next_steps]
when: paintedwolf.rejection_code == "DECISION_NOT_FOUND"
effect: block
copy:
  what: Worker {{ paintedwolf.worker }} has no pending decision to answer.
  cause: The job id names no worker, or its worker has not asked a decision question.
  why: An answer resumes the worker that asked, so it needs the job id from a needs_decision envelope.
  fix: '{{ paintedwolf.next_steps }}'
  instead: Answer only a worker the roster shows as asking.
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
x-paintedwolf-message: Worker {{ paintedwolf.worker }} has no pending decision to answer.
x-paintedwolf-scenarios:
- id: default
  vars:
    job_id: worker-1
selector:
  tool:
  - answer_decision
