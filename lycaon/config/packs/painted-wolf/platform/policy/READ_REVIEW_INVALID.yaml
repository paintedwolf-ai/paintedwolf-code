spec_version: "1.0"
id: READ_REVIEW_INVALID
kind: policy
on: tool.rejected
selector:
  tools:
    - read_review
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "READ_REVIEW_INVALID"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:workflow
message: The requested review view is unavailable or invalid.
what: The requested review view is unavailable or invalid.
cause: The review view must match the active run, permitted assignment, and returned cursor.
fix: Use view summary or assignments as coordinator; reviewers use view subject with their exact assignment_id and returned cursor.
instead: Pass a valid view selector; ask the coordinator if no assignment is available.
x-paintedwolf-scenarios:
  - id: rejected
    vars:
      tool: read_review
