spec_version: "1.0"
id: JQ_PATH_DENIED
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - jq
requires_facts: [paintedwolf.operation, paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "JQ_PATH_DENIED"
effect: block
category: recoverable
emit: guard:jq
message: jq path is denied
what: Structured querying is denied for {{ paintedwolf.path }}.
cause: The resolved source is protected by the host’s path policy.
why: Sensitive or VCS-internal paths are blocked from structured query tools.
fix: Leave protected input unread. Use another source only if it is intended and permitted; another reader or renamed path cannot override this boundary.
instead: Branch on Code; choose an allowed path
scenarios:
  - id: default
    vars:
      path: .git/config
      profile: implement
      tool: jq
