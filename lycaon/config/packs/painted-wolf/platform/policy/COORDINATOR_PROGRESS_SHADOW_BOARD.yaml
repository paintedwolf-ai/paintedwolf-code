oar: '1.0'
id: COORDINATOR_PROGRESS_SHADOW_BOARD
kind: policy
anchor: tool.rejected
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.path
when: paintedwolf.rejection_code == "COORDINATOR_PROGRESS_SHADOW_BOARD"
effect: block
copy:
  what: Coordinator {{ tool }} on {{ paintedwolf.path }} targets a parallel progress board.
  cause: Progress lives in `session_progress`; blueprints live under `${overlay_dir}/blueprints/**`.
  why: Parallel board files diverge from host progress state.
  fix: Author the `## Progress` checklist with `update_progress`.
  instead: Use `update_progress`
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
x-paintedwolf-message: Coordinator progress must not use a file-board path
x-paintedwolf-scenarios:
- id: plans_board
  vars:
    path: ${overlay_dir}/plans/board.md
    tool: write
  expect_contains:
  - 'Rejected:'
  - 'Code: COORDINATOR_PROGRESS_SHADOW_BOARD'
  - update_progress
x-paintedwolf-audience:
- coordinator
