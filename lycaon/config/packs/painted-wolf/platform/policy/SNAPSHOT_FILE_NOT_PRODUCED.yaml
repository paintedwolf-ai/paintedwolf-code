oar: '1.0'
id: SNAPSHOT_FILE_NOT_PRODUCED
kind: schema
anchor: tool.rejected
selector:
  tool:
  - command
requires:
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.path
  - paintedwolf.env_var
  profiles:
  - tool
when: paintedwolf.rejection_code == "SNAPSHOT_FILE_NOT_PRODUCED"
effect: block
copy:
  what: The expected snapshot{% if paintedwolf.path %} at {{ paintedwolf.path }}{% endif %} was unavailable after the command completed.
  cause: The command exited with status 0, but the host could not read a complete nonempty snapshot.
  why: '{% if paintedwolf.env_var %}This capture supplied its output path in `{{ paintedwolf.env_var }}`.{% endif %}'
  fix: ''
  instead: ''
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command
x-paintedwolf-message: snapshot_capture target file was not produced
x-paintedwolf-scenarios:
- id: default
  vars:
    path: build/screen.png
    profile: coordinator
    tool: command
