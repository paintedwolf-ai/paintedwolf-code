spec_version: "1.0"
id: SECRET_REFERENCE_FAILED
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SECRET_REFERENCE_FAILED"
effect: block
category: recoverable
emit: guard:tool
message: The host could not resolve a managed secret reference
what: The host could not resolve a managed secret reference.
cause: Reference substitution failed before the outbound operation began.
why: An unresolved reference is never passed through or replaced with guessed value material.
fix: Report the host resolution failure and preserve the pending action. Retry only after the underlying host problem is resolved, using a live reference already visible to this chat; do not guess a value or repeatedly substitute references.
instead: Do not reveal or reconstruct the protected value
scenarios:
  - id: default
    vars:
      profile: implement
      tool: command
