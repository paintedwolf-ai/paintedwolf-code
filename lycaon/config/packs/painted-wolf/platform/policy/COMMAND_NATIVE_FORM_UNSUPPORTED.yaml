oar: '1.0'
id: COMMAND_NATIVE_FORM_UNSUPPORTED
kind: policy
anchor: tool.rejected
requires:
  profiles: [tool]
  facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "COMMAND_NATIVE_FORM_UNSUPPORTED"
effect: block
copy:
  what: The requested native form was refused before its effect attempt.
  cause: The runtime does not provide the admission contract required by this form, and no installed program of this name can run it here.
  why: A refused form never refreshes input or replays earlier effects.
  fix: Use a documented supported form from command help, or reach the same result with another supported command. Earlier statements' output and effects are in this result.
  instead: Branch on Code; use a supported form and keep the earlier outcomes in this result.
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_native_admission
x-paintedwolf-message: native operation form is unavailable
x-paintedwolf-scenarios:
  - id: execution-pin-unavailable
    vars:
      tool: command
    expect_contains:
      - 'Code: COMMAND_NATIVE_FORM_UNSUPPORTED'
      - before its effect attempt
      - use a supported form
