oar: '1.0'
id: COMMAND_NATIVE_FORM_UNSUPPORTED
kind: policy
anchor: tool.rejected
requires:
  profiles: [tool]
  facts: [paintedwolf.rejection_code, paintedwolf.command, paintedwolf.source_line, paintedwolf.source_column]
when: paintedwolf.rejection_code == "COMMAND_NATIVE_FORM_UNSUPPORTED"
effect: block
copy:
  what: '{% if paintedwolf.command %}{{ paintedwolf.command }} cannot run in this form{% if paintedwolf.source_line %}{% if paintedwolf.source_column %} at {{ paintedwolf.source_line }}:{{ paintedwolf.source_column }}{% endif %}{% endif %}.{% else %}This command cannot run in the requested form.{% endif %}'
  cause: No supported command or installed program can run this form here.
  why: Earlier commands that finished still count.
  fix: Use a supported form or another command that reaches the same result. Earlier output and changes remain in this result.
  instead: Use a supported command form.
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_native_admission
x-paintedwolf-message: native operation form is unavailable
x-paintedwolf-scenarios:
  - id: execution-pin-unavailable
    vars:
      tool: command
    expect_contains:
      - 'Code: COMMAND_NATIVE_FORM_UNSUPPORTED'
      - cannot run in the requested form
      - supported command form
