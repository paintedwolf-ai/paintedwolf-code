spec_version: "1.0"
id: COMMAND_NATIVE_FORM_UNSUPPORTED
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.command, paintedwolf.rejection_code, paintedwolf.source_column, paintedwolf.source_line]
when: paintedwolf.rejection_code == "COMMAND_NATIVE_FORM_UNSUPPORTED"
effect: block
category: recoverable
emit: guard:command_native_admission
message: native operation form is unavailable
what: '{% if paintedwolf.command %}{{ paintedwolf.command }} cannot run in this form{% if paintedwolf.source_line %}{% if paintedwolf.source_column %} at {{ paintedwolf.source_line }}:{{ paintedwolf.source_column }}{% endif %}{% endif %}.{% else %}This command cannot run in the requested form.{% endif %}'
cause: The native command adapter cannot execute this form.
why: ''
fix: ''
instead: ''
scenarios:
  - id: execution-pin-unavailable
    vars:
      tool: command
