spec_version: "1.0"
id: COORDINATOR_GROUNDING_ESCALATED
kind: invariant
on: coordinator.post_turn
selector: {}
requires_facts: [paintedwolf.grounding_escalated, paintedwolf.grounding_verdict]
when: paintedwolf.grounding_escalated && paintedwolf.grounding_verdict == "COORDINATOR_GROUNDING_ESCALATED"
effect: nudge
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:grounding
message: Repeated ungrounded completion claims — delegation required before continuing
what: Repeated ungrounded completion claims — delegation required before continuing
cause: Prior completion claims lacked grounded worker evidence, tripping the delegation grounding circuit breaker after the last turn.
why: Closing another delegation turn without dispatching work trips the circuit breaker again.
fix: Follow the user's direction and dispatch worker delegation to gather the missing evidence before asserting completion, or report what remains unresolved.
instead: Do not assert completion without grounded worker evidence.
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      session_role: coordinator
      tool: read
