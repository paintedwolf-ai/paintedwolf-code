oar: '1.0'
id: COORDINATOR_GROUNDING_ESCALATED
kind: invariant
anchor: coordinator.post_turn
requires:
  facts:
  - paintedwolf.grounding_escalated
  - paintedwolf.grounding_verdict
when: paintedwolf.grounding_escalated && paintedwolf.grounding_verdict == "COORDINATOR_GROUNDING_ESCALATED"
effect: nudge
copy:
  cause: Repeated ungrounded completion claims — delegation required before continuing
  why: Report the unresolved completion evidence and ask the user how to proceed; the session is paused by the grounding circuit breaker.
  fix: Report the unresolved completion evidence and ask the user how to proceed; the session is paused by the grounding circuit breaker.
  instead: Stop asserting completion and wait for user guidance
  what: Repeated ungrounded completion claims — delegation required before continuing
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:grounding
x-paintedwolf-message: Repeated ungrounded completion claims — delegation required before continuing
x-paintedwolf-scenarios:
- id: default
  vars:
    detail: bad args
    path: src/main.go
    profile: coordinator
    tool: read
  expect_contains:
  - 'Tool feedback'
  - 'Code: COORDINATOR_GROUNDING_ESCALATED'
