oar: '1.0'
id: WAIT_PROBE_SECRET_UNSUPPORTED
kind: schema
anchor: tool.rejected
selector:
  tool:
  - wait
requires:
  facts:
  - paintedwolf.rejection_code
  profiles:
  - tool
when: paintedwolf.rejection_code == "WAIT_PROBE_SECRET_UNSUPPORTED"
effect: block
copy:
  what: A durable readiness probe cannot contain a detected secret.
  cause: Wait conditions are persisted for restart recovery, while protected values must never be written into
    the task database.
  why: Substituting or approving the value here would turn protected material into durable plaintext.
  fix: Use a non-secret health endpoint only if it establishes the needed readiness. An authenticated operation
    requires an offered outbound tool that resolves protected references at execution; it cannot be persisted
    as this probe. Report the dependency if no such operation is available.
  instead: Do not reveal or persist the protected value
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:wait
x-paintedwolf-message: A durable readiness probe cannot contain a detected secret
x-paintedwolf-scenarios:
- id: default
  vars:
    profile: implement
    rule_id: generic-token
    shape: token
    surface: wait_probe
    tool: wait
  expect_contains:
  - 'Rejected:'
  - 'Code: WAIT_PROBE_SECRET_UNSUPPORTED'
