spec_version: "1.0"
id: BACKGROUND_CAP_REACHED
kind: policy
on: tool.rejected
selector:
  tools:
    - command
    - verify
requires_facts: [paintedwolf.background_limit, paintedwolf.background_limit_known, paintedwolf.live_command_handles, paintedwolf.live_terminal_ids, paintedwolf.next_steps, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "BACKGROUND_CAP_REACHED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_background
message: Background process cap reached for session
what: This session's background-process capacity is full{% if paintedwolf.background_limit_known %} (limit {{ paintedwolf.background_limit }}){% endif %}.
cause: '{% if paintedwolf.live_terminal_ids %}Terminal ids at admission: {{ paintedwolf.live_terminal_ids }}.{% endif %}{% if paintedwolf.live_command_handles %} Command handles at admission: {{ paintedwolf.live_command_handles }}.{% endif %}'
why: The shared session limit bounds long-running processes and their retained output.
fix: 'Wait for existing work to finish, or stop only work that is no longer needed. {{ paintedwolf.next_steps }} A process may have completed since this snapshot; preserve useful running work.'
instead: Retry the requested start only after capacity is available; this refused start created no process
x-paintedwolf-scenarios:
  - id: default
    vars:
      background_limit: 4
      live_command_handles: [running-command]
      can_command_stop: true
      profile: implement
      tool: command
