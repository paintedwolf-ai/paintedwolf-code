spec_version: "1.0"
id: SOURCE_VERSION_REQUIRED
kind: schema
on: tool.rejected
selector:
  tools:
    - source_history
requires_facts: [paintedwolf.mode, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SOURCE_VERSION_REQUIRED"
effect: block
category: recoverable
emit: guard:source_history
message: version_id is required for version mode, and for diff mode when base_version_id is given
what: source_history mode {{ paintedwolf.mode }} needs version_id here.
cause: Version mode, and base_version_id in diff mode, need a specific version ID to resolve retained bytes.
why: Retained states in the source ledger are addressed by immutable version IDs.
fix: Pass version_id from an effect row or read receipt. In diff mode, omitting base_version_id as well diffs from the session baseline.
instead: Branch on Code; pass version_id
scenarios:
  - id: default
    vars:
      mode: version
      profile: implement
      tool: source_history
  - id: base_version_id_without_version_id
    vars:
      mode: diff
      profile: implement
      tool: source_history
