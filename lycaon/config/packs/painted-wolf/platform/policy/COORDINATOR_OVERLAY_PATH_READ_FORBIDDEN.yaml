spec_version: "1.0"
id: COORDINATOR_OVERLAY_PATH_READ_FORBIDDEN
kind: policy
on: coordinator.pre_invoke
selector: {}
requires_facts: [paintedwolf.next_steps, paintedwolf.path, paintedwolf.path_is_worker_branch]
when: paintedwolf.path_is_worker_branch
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:path_is_worker_branch
message: 'Coordinator cannot access worker views — use `preview_overlay` by result handle (`path={{ paintedwolf.path }}`)'
what: 'The coordinator request names a private worker workspace path: {{ paintedwolf.path }}.'
cause: Private worker workspace paths are not coordinator filesystem inputs.
why: Result previews carry the worker intent and structured merge/conflict state without bypassing workspace ownership.
fix: '{{ paintedwolf.next_steps }}'
instead: 'Preserve the worker name and result handle. Do not read private worker paths, guess another filesystem route, or restart work merely to inspect changes.'
x-paintedwolf-scenarios:
  - id: default
    vars:
      path: src/main.rs
      tool: read
