oar: '1.0'
id: OUTBOUND_SECRET_SCREEN_FAILED
kind: schema
anchor: tool.rejected
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.host
  - paintedwolf.rule_id
  - paintedwolf.shape
  - paintedwolf.surface
  - paintedwolf.fault_stage
when: paintedwolf.rejection_code == "OUTBOUND_SECRET_SCREEN_FAILED"
effect: block
copy:
  what: The outbound {{ paintedwolf.surface }} secret screen failed at {{ paintedwolf.fault_stage }}; the protected
    send did not proceed.
  cause: The host could not establish a valid screening result. The failure does not establish whether a card
    was displayed or what the user intended.
  why: A screening fault cannot authorize disclosure. Rewording arguments does not repair the host failure.
  fix: Do not treat this as a refusal by the user or retry in a loop. Report the stage {{ paintedwolf.fault_stage
    }} and continue independent work. Retry the protected action only after the host screening failure is resolved.
  instead: Report the screening fault and preserve the unsent action
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:outbound_secret
x-paintedwolf-message: the secret screen could not ask, so nothing was sent
x-paintedwolf-scenarios:
- id: model_raise_failed
  vars:
    surface: model_request
    rule_id: secretmatch:harvest
    host: fireworks-1
    shape: a1b2c3a1b2c3a1b2c3a1 (20 characters)
    fault_stage: raise
    tool: command
  expect_contains:
  - 'Code: OUTBOUND_SECRET_SCREEN_FAILED'
  - raise
- id: mcp_screen_unwired
  vars:
    surface: mcp
    rule_id: gitleaks:openai-api-key
    host: fixture
    shape: "abc-a1b2c3a1b2c3a1b2c3a1b2c3a1b2c3a1b2c3\u2026 (51 characters)"
    fault_stage: screen_unwired
    tool: fetch_url
  expect_contains:
  - 'Code: OUTBOUND_SECRET_SCREEN_FAILED'
  - screen_unwired
- id: command_checkpoints_unwired
  vars:
    surface: command
    rule_id: gitleaks:aws-access-token
    host: any host this command dials
    shape: a1b2c3a1b2c3a1b2c3a1 (20 characters)
    fault_stage: checkpoints_unwired
    tool: command
  expect_contains:
  - 'Code: OUTBOUND_SECRET_SCREEN_FAILED'
  - checkpoints_unwired
