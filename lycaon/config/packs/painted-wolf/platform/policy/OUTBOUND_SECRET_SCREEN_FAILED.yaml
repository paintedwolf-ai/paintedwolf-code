oar: '1.0'
id: OUTBOUND_SECRET_SCREEN_FAILED
kind: schema
anchor: tool.rejected
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.host
  - paintedwolf.rule_id
  - paintedwolf.shape
  - paintedwolf.surface
  - paintedwolf.fault_stage
when: paintedwolf.rejection_code == "OUTBOUND_SECRET_SCREEN_FAILED"
effect: block
copy:
  what: The outbound {{ paintedwolf.surface }} secret screen failed at {{ paintedwolf.fault_stage }}; the protected
    send did not proceed.
  cause: The host could not establish an authorized result for this send. Either a screening step failed, or the
    send carries a value the user gave Painted Wolf Code and no release the user confirmed on this device covers
    it. The failure does not establish whether a card was displayed or what the user intended.
  why: A screening fault cannot authorize disclosure, and only the user, confirmed present on this device, can
    release a value they gave Painted Wolf Code. Rewording arguments repairs neither.
  fix: Do not treat this as a refusal by the user or retry in a loop. Report the stage {{ paintedwolf.fault_stage
    }} and continue independent work. At presence_unavailable or held_unreleased the value belongs to the user
    and only they can release it, so tell them which step needs it; at any other stage, retry the protected action
    only after the host screening failure is resolved.
  instead: Report the screening fault and preserve the unsent action
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:outbound_secret
x-paintedwolf-message: the secret screen could not ask, so nothing was sent
x-paintedwolf-scenarios:
- id: model_raise_failed
  vars:
    surface: model_request
    rule_id: secretmatch:harvest
    host: fireworks-1
    shape: a1b2c3a1b2c3a1b2c3a1 (20 characters)
    fault_stage: raise
    tool: command
  expect_contains:
  - 'Code: OUTBOUND_SECRET_SCREEN_FAILED'
  - raise
- id: mcp_screen_unwired
  vars:
    surface: mcp
    rule_id: gitleaks:openai-api-key
    host: fixture
    shape: "abc-a1b2c3a1b2c3a1b2c3a1b2c3a1b2c3a1b2c3\u2026 (51 characters)"
    fault_stage: screen_unwired
    tool: fetch_url
  expect_contains:
  - 'Code: OUTBOUND_SECRET_SCREEN_FAILED'
  - screen_unwired
- id: file_presence_unavailable
  vars:
    surface: file
    rule_id: managed-secret
    host: ''
    shape: Protected value
    fault_stage: presence_unavailable
    tool: write
  expect_contains:
  - 'Code: OUTBOUND_SECRET_SCREEN_FAILED'
  - presence_unavailable
- id: http_held_unreleased
  vars:
    surface: http_request
    rule_id: managed-secret
    host: ''
    shape: Protected value
    fault_stage: held_unreleased
    tool: http_request
  expect_contains:
  - 'Code: OUTBOUND_SECRET_SCREEN_FAILED'
  - held_unreleased
- id: command_checkpoints_unwired
  vars:
    surface: command
    rule_id: gitleaks:aws-access-token
    host: any host this command dials
    shape: a1b2c3a1b2c3a1b2c3a1 (20 characters)
    fault_stage: checkpoints_unwired
    tool: command
  expect_contains:
  - 'Code: OUTBOUND_SECRET_SCREEN_FAILED'
  - checkpoints_unwired
