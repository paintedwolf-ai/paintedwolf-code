spec_version: "1.0"
id: JQ_PATH_REQUIRED
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - jq
requires_facts: [paintedwolf.operation, paintedwolf.path_required, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "JQ_PATH_REQUIRED"
effect: block
category: recoverable
emit: guard:jq
message: jq requires a path to the document
what: jq was called without a path to a structured document.
cause: The path argument names the JSON, YAML, or TOML file to query — a bare relative path resolves in the session folder, or use @label/path for another attached folder.
why: Structured rejects let agents branch without parsing free-form errors.
fix: Retry jq with path set to the file to query.
instead: Branch on Code; supply a path before retrying jq
scenarios:
  - id: default
    vars:
      profile: explore_readonly
      tool: jq
