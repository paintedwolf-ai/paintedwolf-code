oar: '1.0'
id: COORDINATOR_BATCH_WRONG_PHASE
kind: policy
anchor: coordinator.pre_invoke
requires:
  profiles:
    - tool
  facts:
    - paintedwolf.batch_closed
    - paintedwolf.batch_phase
when: paintedwolf.batch_phase == "synthesize" && tool == "pack_board" && !paintedwolf.batch_closed
effect: block
copy:
  what: "pack_board is unavailable while the batch is in {{ paintedwolf.batch_phase }}."
  cause: "The current batch is ready for synthesis and already carries its board context."
  why: Phase-gated tools keep dispatch/integrate/synthesize/closed boundaries enforceable in code
  fix: "Use the current board and retained evidence to produce the required report. Request a fresh board only on a later request that offers pack_board."
  instead: "Do not restart routing or promotion solely to refresh orientation during synthesis."
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
x-paintedwolf-message: Tool not allowed in current coordinator batch phase
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      profile: coordinator
      tool: pack_board
    expect_contains:
      - 'Rejected:'
      - 'Code: COORDINATOR_BATCH_WRONG_PHASE'
      - pack_board
