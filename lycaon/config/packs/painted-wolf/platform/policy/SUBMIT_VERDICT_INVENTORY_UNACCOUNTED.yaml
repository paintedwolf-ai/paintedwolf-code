oar: '1.0'
id: SUBMIT_VERDICT_INVENTORY_UNACCOUNTED
kind: policy
anchor: tool.rejected
requires:
  profiles: [tool]
  facts:
    - paintedwolf.rejection_code
    - paintedwolf.rejection_reason
    - paintedwolf.offenders_sample
    - paintedwolf.offenders_omitted
when: paintedwolf.rejection_code == "SUBMIT_VERDICT_INVENTORY_UNACCOUNTED"
effect: block
copy:
  what: '{{ paintedwolf.rejection_reason }}{% if paintedwolf.offenders_sample %}: {{ paintedwolf.offenders_sample }}{% if paintedwolf.offenders_omitted %}; {{ paintedwolf.offenders_omitted }} more{% endif %}{% endif %}.'
  cause: The review must account for the run's scanner inventory before advancing to the report.
  why: The report phase cannot investigate groups the review left unassessed.
  fix: 'Use scan_query with view groups on the run-bound scan ids to inspect the remaining groups. Link assessed groups through claims scan_group_ids, or supply set_asides with a reason that holds for every selected group. Path selectors must cover every location in a group; mixed-location or locationless groups need explicit scan_group_ids. Resubmit the complete verdict with the accounting corrected.'
  instead: Keep earlier claim links and inherited set-asides. Do not clear a group merely because it was listed.
x-paintedwolf-category: recoverable
x-paintedwolf-severity: error
x-paintedwolf-message: The review leaves scanner groups unaccounted.
x-paintedwolf-emit: guard:workflow
x-paintedwolf-scenarios:
  - id: missing_groups
    vars:
      rejection_reason: 18 of 241 scanner groups have no assessment and no set-aside
      offenders_sample: 'group:sample · secrets · high · fixture-token · src/example.go'
      offenders_omitted: 17
    expect_contains: ['Code: SUBMIT_VERDICT_INVENTORY_UNACCOUNTED', 'group:sample', 'scan_query', '17 more']
