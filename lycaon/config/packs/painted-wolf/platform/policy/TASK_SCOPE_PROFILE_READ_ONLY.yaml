spec_version: "1.0"
id: TASK_SCOPE_PROFILE_READ_ONLY
kind: policy
on: coordinator.pre_invoke
selector: {}
requires_facts: [paintedwolf.agent_type, paintedwolf.profile_mutation_capable, paintedwolf.scope_mode, paintedwolf.tool_is_task]
when: paintedwolf.tool_is_task && !paintedwolf.profile_mutation_capable && paintedwolf.scope_mode == "write"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
message: Read-only profiles cannot take scope.mode write
what: '**{{ paintedwolf.agent_type }}** uses a read-only tool profile and cannot take **`scope.mode: write`**.'
cause: You started a write-scoped worker with an agent profile that has no mutation tools (no file edits, command execution, or git commit).
why: Write scope provisions a worker workspace and overlay for file changes; a read-only profile cannot author workspace edits or report files.
fix: 'Survey or review → keep this profile with `scope.mode: read`. Authoring file changes → use a mutation-capable profile with `scope.mode: write`.'
instead: 'Branch on Code: pick a mutation-capable profile for write workspaces; keep read-only profiles on read scope.'
x-paintedwolf-scenarios:
  - id: default
    vars:
      agent_type: repo-researcher
      detail: bad args
      path: docs/report.md
      profile: coordinator
      scope_mode: write
      scope_paths:
        - docs/report.md
      tool: task
