oar: '1.0'
id: SOURCE_VERSION_NO_PREDECESSOR
kind: schema
anchor: tool.rejected
selector:
  tool:
    - restore_version
requires:
  profiles:
    - tool
  facts: [paintedwolf.rejection_code, paintedwolf.detail, paintedwolf.path, paintedwolf.next_steps]
when: paintedwolf.rejection_code == "SOURCE_VERSION_NO_PREDECESSOR"
effect: block
copy:
  what: No predecessor version for {{ paintedwolf.path }} — {{ paintedwolf.detail }}.
  cause: The file has no earlier recorded version in this project's source ledger.
  why: Omitted version_id defaults to the immediate predecessor, which requires at least two recorded states.
  fix: '{{ paintedwolf.next_steps }} Otherwise pass an explicit version_id.'
  instead: 'Branch on Code.'
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:restore_version
x-paintedwolf-message: no earlier version recorded for this file
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: file has only one recorded version
      path: main.go
      profile: implement
      source_history_offered: true
      tool: restore_version
  - id: without_source_history
    vars:
      detail: file has only one recorded version
      path: main.go
      profile: plan_write_only
      source_history_offered: false
      tool: restore_version
