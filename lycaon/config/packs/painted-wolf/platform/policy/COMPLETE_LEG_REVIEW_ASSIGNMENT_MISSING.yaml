oar: '1.0'
id: COMPLETE_LEG_REVIEW_ASSIGNMENT_MISSING
kind: policy
anchor: tool.rejected
requires:
  facts: [paintedwolf.rejection_code]
  profiles: [tool]
when: paintedwolf.rejection_code == "COMPLETE_LEG_REVIEW_ASSIGNMENT_MISSING"
effect: block
copy:
  what: This review has no recorded assignment subject.
  cause: The host cannot establish which inputs this worker was assigned.
  why: A completion payload cannot reconstruct missing dispatch context.
  fix: Use request_decision to ask the coordinator to dispatch the supplied work_id as a new review assignment.
  instead: Preserve the evidence already gathered and report this dependency; do not invent a revision.
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
x-paintedwolf-message: A recorded review assignment is required.
x-paintedwolf-scenarios:
- id: missing
  vars: {}
  expect_contains: ['Code: COMPLETE_LEG_REVIEW_ASSIGNMENT_MISSING', request_decision]
