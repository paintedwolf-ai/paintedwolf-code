spec_version: "1.0"
id: MOVE_CROSS_ROOT
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - move
requires_facts: [paintedwolf.operation, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "MOVE_CROSS_ROOT"
effect: block
category: recoverable
emit: guard:move
message: move:cross-root rename is not supported
what: Cross-root rename is not supported
cause: Source and destination name different attached roots.
why: Native move preserves one root identity and never renames across roots.
fix: If the intended transfer is authorized at both roots, use a separate copy, verify the destination content, and delete the source only when that deletion is authorized. This is a non-atomic transfer; preserve both paths and completed receipts until verification succeeds.
instead: Preserve transfer intent and verify before any authorized source deletion
scenarios:
  - id: default
    vars:
      detail: source and destination use different roots
      path: src/main.go
      profile: implement
      tool: move
