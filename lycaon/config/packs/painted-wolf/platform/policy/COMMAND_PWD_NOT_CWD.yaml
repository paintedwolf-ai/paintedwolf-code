spec_version: "1.0"
id: COMMAND_PWD_NOT_CWD
kind: policy
on: tool.rejected
selector:
  tools:
    - command
    - verify
requires_facts: [paintedwolf.cwd, paintedwolf.pwd, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "COMMAND_PWD_NOT_CWD"
effect: block
category: recoverable
emit: guard:command_composition_redirect
message: env.PWD does not set the working directory
what: env.PWD ({{ paintedwolf.pwd }}) does not match the resolved working directory ({{ paintedwolf.cwd }}) for this {{ tool }} call.
cause: cwd comes from the per-call cwd arg (branch-anchored on write workers), not env.PWD.
why: env.PWD is a plain environment variable; it does not chdir.
fix: ''
instead: ''
scenarios:
  - id: default
    vars:
      command: go mod tidy
      cwd: /project
      pwd: /project/subdir
