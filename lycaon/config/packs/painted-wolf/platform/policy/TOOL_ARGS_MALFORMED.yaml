spec_version: "1.0"
id: TOOL_ARGS_MALFORMED
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "TOOL_ARGS_MALFORMED"
effect: block
category: recoverable
emit: guard:tool_args
message: Tool {{ tool }} arguments were not valid JSON — the object never parsed, so none of it reached the tool.
what: Tool {{ tool }} arguments were not valid JSON — the object never parsed, so none of it reached the tool.
cause: The transport did not decode one complete arguments object. The receiving tool was not invoked.
why: A rejection about "missing" fields is misleading here — the keys may have been sent but the malformed JSON was discarded whole, so retrying the same shape keeps failing.
fix: Emit one valid JSON object with argument fields as sibling keys according to this tool’s schema. JSON text is valid inside a body/content field when that field actually accepts it; misplaced argument fields inside a string do not set those arguments.
instead: Repair the arguments object without changing the intended payload
scenarios:
  - id: default
    vars:
      tool: summarize
