spec_version: "1.0"
id: COORDINATOR_CRITERIA_UNMET
kind: invariant
on: coordinator.closeout_check
selector: {}
requires_facts: [paintedwolf.grounding_reason, paintedwolf.grounding_verdict, paintedwolf.leg_id]
when: paintedwolf.grounding_verdict == "COORDINATOR_CRITERIA_UNMET"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:grounding
message: Completion claimed while leg criteria are unmet
what: 'Planned leg {{ paintedwolf.leg_id }} has unmet closeout criteria.'
cause: '{{ paintedwolf.grounding_reason }}'
why: Worker delivery alone does not establish that typed criteria, required evidence, and change disposition are settled.
fix: Inspect the worker's criteria outcomes and change state. Complete the missing verification, instruct the worker for another round when criteria failed, or land pending changes before closing out.
instead: Resolve the unmet criteria on the existing worker and its delivered result before closing out.
x-paintedwolf-scenarios:
  - id: default
    vars:
      grounding_reason: "worker parser-fix result res-1 criteria outcomes: file:modified:src/main.go=failed (file not modified)"
      leg_id: leg-1
      path: src/main.go
      session_role: coordinator
      tool: read
