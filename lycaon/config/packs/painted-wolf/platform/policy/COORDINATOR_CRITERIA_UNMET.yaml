spec_version: "1.0"
id: COORDINATOR_CRITERIA_UNMET
kind: invariant
on: coordinator.closeout_check
selector: {}
requires_facts: [paintedwolf.grounding_reason, paintedwolf.grounding_verdict, paintedwolf.leg_id]
when: paintedwolf.grounding_verdict == "COORDINATOR_CRITERIA_UNMET"
effect: block
category: recoverable
emit: guard:grounding
message: Completion claimed but leg criteria not yet met
what: 'Completed leg {{ paintedwolf.leg_id }} has unmet closeout criteria.'
cause: '{{ paintedwolf.grounding_reason }}'
why: Job completion alone does not establish that required evidence and overlay landing are complete.
fix: Inspect the leg's current criteria and overlay state. Complete the missing verification, summary delivery, or authorized landing step; do not redispatch already completed work to obtain a new receipt.
instead: Resolve the reported criterion using the existing job and its evidence before closing the delegation
scenarios:
  - id: default
    vars:
      grounding_reason: Completion evidence is missing.
      leg_id: leg-1
      path: src/main.go
      session_role: coordinator
      tool: read
