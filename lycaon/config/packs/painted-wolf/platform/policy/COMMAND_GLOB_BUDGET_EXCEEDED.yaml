oar: '1.0'
id: COMMAND_GLOB_BUDGET_EXCEEDED
kind: policy
anchor: tool.rejected
selector:
  tool:
  - command
  - verify
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.pattern
  - paintedwolf.glob_limit
  - paintedwolf.max
when: paintedwolf.rejection_code == "COMMAND_GLOB_BUDGET_EXCEEDED"
effect: block
copy:
  what: The glob `{{ paintedwolf.pattern }}` expands past {{ paintedwolf.max }} {{ paintedwolf.glob_limit }}.
  cause: Glob expansion stopped at the reported bound; the host did not truncate the match set.
  why: ''
  fix: ''
  instead: ''
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_composition_redirect
x-paintedwolf-message: glob expansion exceeded its bound
x-paintedwolf-scenarios:
- id: matches
  vars:
    tool: command
    pattern: '**/*.go'
    glob_limit: matches
    max: '1000'
  expect_contains:
  - 'Code: COMMAND_GLOB_BUDGET_EXCEEDED'
  - '**/*.go'
  - quote it
- id: entries
  vars:
    tool: command
    pattern: '**'
    glob_limit: entries
    max: '50000'
  expect_contains:
  - 'Code: COMMAND_GLOB_BUDGET_EXCEEDED'
  - 50000 entries
