spec_version: "1.0"
id: RENDER_ASSET_DENIED
kind: schema
on: tool.rejected
selector:
  tools:
    - render_view
requires_facts: [paintedwolf.forbidden, paintedwolf.path, paintedwolf.rejection_code, paintedwolf.rejection_reason, paintedwolf.render_asset_origin]
when: paintedwolf.rejection_code == "RENDER_ASSET_DENIED"
effect: block
category: recoverable
emit: guard:visual_render
message: Project asset path or content not allowed
what: 'render_view refused project asset {{ paintedwolf.path }} or its content: {{ paintedwolf.rejection_reason }}.'
cause: The path escapes the project root or sits under .git/, or the file carries active or external content (SVG scripts/foreignObject, CSS @import or url() beyond http://lycaon.asset/).
why: Project assets rasterize offline inside a path jail — nothing outside the project root, no version-control internals, and no content that would script or fetch beyond the hermetic origin.
fix: Reference permitted regular project files. Keep asset SVGs passive (no scripts, handlers, or foreignObject) and CSS hermetic (relative references or {{ paintedwolf.render_asset_origin }} only). Do not modify protected assets merely to bypass the refusal.
instead: Branch on Code RENDER_ASSET_DENIED; use an allowed path or clean the asset content, then retry render_view
scenarios:
  - id: default
    vars:
      detail: bad args
      path: .git/HEAD
      session_role: coordinator
      tool: render_view
