spec_version: "1.0"
id: DECISION_CHANGED
kind: policy
on: tool.rejected
selector:
  tools:
    - answer_decision
requires_facts: [paintedwolf.next_steps, paintedwolf.rejection_code, paintedwolf.worker]
when: paintedwolf.rejection_code == "DECISION_CHANGED"
effect: block
category: recoverable
emit: guard:coordinator
message: The pending decision for worker {{ paintedwolf.worker }} changed.
what: The pending decision for worker {{ paintedwolf.worker }} changed.
cause: The offered decision no longer matches the stored question and options.
why: A decision answer must resume the same suspended worker and answer the current question.
fix: '{{ paintedwolf.next_steps }}'
instead: Inspect the current worker state before retrying.
scenarios:
  - id: default
    vars:
      job_id: worker-1
      status: complete
