oar: '1.0'
id: USE_JQ_NATIVE
kind: policy
anchor: tool.rejected
selector:
  tool:
  - command
  - verify
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.command
  - paintedwolf.example
  - paintedwolf.habit_redirect_match
when: paintedwolf.rejection_code == "USE_JQ_NATIVE"
effect: block
copy:
  what: The parsed command can be represented by the supplied jq call.
  cause: The host parsed the supported command shape and validated the replacement against the tool currently
    offered.
  why: The native query reads JSON, YAML or TOML in a bounded sandbox. A structural overview of a large result
    is not the complete result; inspect coverage.
  fix: Use the supplied replacement_calls entries exactly and in order. Account for each result before continuing;
    native limits and partial-result receipts still apply.
  instead: Use the validated jq replacement and preserve the intended operation
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_habit_redirect
x-paintedwolf-message: Use native jq instead of command jq
x-paintedwolf-scenarios:
- id: default
  vars:
    detail: bad args
    path: config.json
    profile: coordinator
    tool: command
  expect_contains:
  - 'Rejected:'
  - 'Code: USE_JQ_NATIVE'
