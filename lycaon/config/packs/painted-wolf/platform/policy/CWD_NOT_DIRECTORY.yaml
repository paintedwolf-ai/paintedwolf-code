oar: '1.0'
id: CWD_NOT_DIRECTORY
kind: schema
anchor: tool.rejected
selector:
  tool:
  - command
  - verify
  - terminal_open
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.cwd
when: paintedwolf.rejection_code == "CWD_NOT_DIRECTORY"
effect: block
copy:
  what: The requested cwd {{ paintedwolf.cwd }} could not be resolved to an existing directory for {{ tool
    }}.
  cause: Working directory must be a directory under the attached project roots (or under the worker branch
    when on a write leg).
  why: The process needs an existing working directory within its assigned roots.
  fix: Confirm the intended directory through the current root view and pass that path as cwd. Use an attached
    @label only when that root is offered; a worker’s branch remains its execution root. Do not create an unrelated
    directory merely to clear this refusal.
  instead: Branch on Code; fix args and retry once
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
x-paintedwolf-message: '`command`/`terminal_open` cwd is not a directory'
x-paintedwolf-scenarios:
- id: default
  vars:
    cwd: README.md
    profile: implement
    tool: command
  expect_contains:
  - 'Rejected:'
  - 'Code: CWD_NOT_DIRECTORY'
