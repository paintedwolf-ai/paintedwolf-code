oar: '1.0'
id: SECRET_REFERENCE_UNAVAILABLE
kind: schema
anchor: tool.rejected
requires:
  facts: [paintedwolf.rejection_code]
  profiles: [tool]
when: paintedwolf.rejection_code == "SECRET_REFERENCE_UNAVAILABLE"
effect: block
copy:
  what: Managed secret reference resolution is unavailable.
  cause: The outbound tool does not currently have a protected-store resolver.
  why: The host will not pass unresolved reference syntax to the destination.
  fix: Retry after the host service is restored. If it remains unavailable, report the host failure.
  instead: Do not reveal or reconstruct the protected value
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
x-paintedwolf-message: Managed secret reference resolution is unavailable
x-paintedwolf-scenarios:
  - id: default
    vars: {profile: implement, tool: http_request}
    expect_contains: ['Rejected:', 'Code: SECRET_REFERENCE_UNAVAILABLE']
