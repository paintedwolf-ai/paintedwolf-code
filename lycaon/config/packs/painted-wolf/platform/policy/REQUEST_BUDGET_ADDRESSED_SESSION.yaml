spec_version: "1.0"
id: REQUEST_BUDGET_ADDRESSED_SESSION
kind: schema
on: tool.rejected
selector:
  tools:
    - request_budget
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "REQUEST_BUDGET_ADDRESSED_SESSION"
effect: block
category: recoverable
emit: guard:request_budget
message: There is no coordinator above this session to grant more tool rounds.
what: There is no coordinator above this session to grant more tool rounds.
cause: request_budget ran in a session the user addressed directly, not in a spawned leg.
why: A budget request goes to the coordinator that dispatched the leg and owns its ceiling.
fix: Finish within the rounds this turn allows and tell the user what remains.
instead: Branch on Code REQUEST_BUDGET_ADDRESSED_SESSION; do not retry here
scenarios:
  - id: default
    vars:
      profile: explore
      tool: request_budget
