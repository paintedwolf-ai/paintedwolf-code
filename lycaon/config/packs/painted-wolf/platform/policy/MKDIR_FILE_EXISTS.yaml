spec_version: "1.0"
id: MKDIR_FILE_EXISTS
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.operation, paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.operation == "mkdir" && paintedwolf.rejection_code == "MKDIR_FILE_EXISTS"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:mkdir
message: mkdir:mkdir path is an existing file
what: mkdir cannot create a directory at {{ paintedwolf.path }} because that path is an existing non-directory.
cause: An existing directory is acceptable; an existing file or link is not replaced.
why: Directory creation must not discard existing content.
fix: Inspect the intended location and the completed creation receipt. Correct a mistaken path; do not delete or overwrite existing content merely to make mkdir succeed.
instead: Resolve the target conflict before retrying
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      profile: implement
      tool: mkdir
