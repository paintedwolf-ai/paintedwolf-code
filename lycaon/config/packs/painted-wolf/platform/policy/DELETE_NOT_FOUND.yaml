spec_version: "1.0"
id: DELETE_NOT_FOUND
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - delete
requires_facts: [paintedwolf.operation, paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "DELETE_NOT_FOUND"
effect: block
category: recoverable
emit: guard:delete
message: delete path does not exist
what: delete path {{ paintedwolf.path }} does not exist in the workspace.
cause: The requested target is already absent at this path.
why: An absent target needs no deletion, and a different path may identify different work.
fix: Confirm the intended path or omit the absent target from remaining work. Do not create an object merely to delete it. Preserve any earlier completed deletions.
instead: Branch on Code; confirm path or remove from paths[]
scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      profile: coordinator
      tool: delete
