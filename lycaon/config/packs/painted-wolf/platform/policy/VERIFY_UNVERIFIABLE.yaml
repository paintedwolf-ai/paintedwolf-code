oar: '1.0'
id: VERIFY_UNVERIFIABLE
kind: policy
anchor: tool.post_invoke
selector:
  tool:
    - verify
requires:
  profiles:
    - tool
  facts:
    - paintedwolf.confine_applied
    - paintedwolf.confine_signals
    - paintedwolf.denial_subject
    - paintedwolf.destination
when: >-
  paintedwolf.confine_applied && "boundary_refused" in paintedwolf.confine_signals
effect: warn
copy:
  what: verify settled as unverifiable. Confinement stopped the check, so the host has no verdict about the work.
  cause: The host observed a boundary refusal{% if paintedwolf.denial_subject %} for {{ paintedwolf.denial_subject }}{% endif %}{% if paintedwolf.destination %} at
    {{ paintedwolf.destination }}{% endif %}. Other failures in the same run may have independent causes; inspect them separately.
  why: An unverifiable receipt is completed evidence the wrap-up gate cannot treat as passed. It is not an owner failure.
  fix: ''
  instead: ''
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:verify
x-paintedwolf-message: verify reached no verdict because confinement stopped the run
x-paintedwolf-scenarios:
  - id: default
    vars:
      tool: verify
    expect_contains:
      - 'Code: VERIFY_UNVERIFIABLE'
      - unverifiable
      - capability_request
