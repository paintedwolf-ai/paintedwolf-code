spec_version: "1.0"
id: WORKFLOW_OBLIGATION_PENDING
kind: invariant
on: coordinator.pre_invoke
selector: {}
requires_facts: [paintedwolf.phase, paintedwolf.phase_obligation_kinds, paintedwolf.phase_obligation_pending, paintedwolf.tool_is_task]
when: paintedwolf.tool_is_task && paintedwolf.phase_obligation_pending
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
message: Worker dispatch blocked — host obligations are pending
what: Tried to dispatch a worker while workflow phase `{{ paintedwolf.phase }}` has unsettled host obligations ({{ paintedwolf.phase_obligation_kinds }}).
cause: The obligation ledger still has pending work.
why: Later-phase work requires this evidence.
fix: Yield; the host advances when obligations settle.
instead: Dispatch workers after the execution phase begins.
x-paintedwolf-scenarios:
  - id: task_during_phase_obligation
    vars:
      phase: ingest
      phase_obligation_kinds: scan
