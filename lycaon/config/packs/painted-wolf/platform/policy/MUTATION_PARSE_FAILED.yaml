oar: '1.0'
id: MUTATION_PARSE_FAILED
kind: schema
anchor: tool.rejected
selector:
  tool: [write, edit, replace_lines, code_rewrite]
requires:
  profiles: [tool]
  facts:
    - paintedwolf.path
    - paintedwolf.rejection_code
    - paintedwolf.parse_timed_out
    - paintedwolf.parse_canceled
    - paintedwolf.parse_reason
    - paintedwolf.parse_language
    - paintedwolf.parse_phase
    - paintedwolf.parse_timeout_ms
    - paintedwolf.parse_elapsed_ms
    - paintedwolf.parse_source_bytes
    - paintedwolf.parse_reached_bytes
    - paintedwolf.parse_failure
    - paintedwolf.parse_config
    - paintedwolf.parse_errors
when: paintedwolf.rejection_code == "MUTATION_PARSE_FAILED"
effect: block
copy:
  what: '{{ tool }} did not change {{ paintedwolf.path }}: {{ paintedwolf.parse_language }} syntax validation failed inside the host.'
  cause: >-
    {{ paintedwolf.parse_failure }}. Snapshot: {{ paintedwolf.parse_phase }}.
    {% if paintedwolf.parse_errors %}The candidate completed with these diagnostics: {{ paintedwolf.parse_errors }}.{% endif %}
  why: >-
    This rejection is caused by unavailable host analysis. It does not by itself establish that the edit is invalid.
  fix: >-
    {% if paintedwolf.parse_errors %}Repair the reported candidate diagnostics while preserving unrelated content. A clean candidate can be accepted without parsing the original file.{% else %}{% if paintedwolf.parse_timed_out %}Report this host parser timeout with the path and measured limits. The host owner can adjust validation_timeout_ms in {{ paintedwolf.parse_config }} or repair the parser. Retry after that change; preserve the proposed work and continue independent work.{% else %}{% if paintedwolf.parse_canceled %}The request was canceled or its enclosing deadline expired. Preserve the proposed work and resume only under an active request. Raising the parser timeout does not clear cancellation.{% else %}Report the exact parser failure and path to the coordinator or user. A parser resource limit, internal error, or invalid host configuration needs a host-side correction. Preserve the proposed work until the host can validate it.{% endif %}{% endif %}{% endif %}
  instead: '{% if paintedwolf.parse_errors %}Repair the candidate diagnostics and retry{% else %}Preserve the work and report the host failure with these diagnostics{% endif %}'
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:edit
x-paintedwolf-message: source parser did not provide a syntax verdict
x-paintedwolf-scenarios:
  - id: panic
    vars:
      path: Sources/Game/Level.swift
      tool: write
      parse_reason: panic
      parse_timed_out: false
      parse_canceled: false
      parse_language: swift
      parse_phase: candidate
      parse_timeout_ms: 30000
      parse_elapsed_ms: 30001
      parse_source_bytes: 6236
      parse_reached_bytes: 318
      parse_failure: 'swift parsing stopped: panic (timeout 30000 ms, elapsed 30001 ms, source 6236 bytes, reached 318 bytes)'
      parse_config: config/packs/painted-wolf/platform/host/source-parsing.yaml
    expect_contains: ['Code: MUTATION_PARSE_FAILED', 'panic', '6236']
  - id: configuration
    vars:
      path: Sources/Game/Level.swift
      tool: write
      parse_reason: configuration
      parse_timed_out: false
      parse_canceled: false
      parse_language: swift
      parse_phase: candidate
      parse_timeout_ms: 30000
      parse_elapsed_ms: 30001
      parse_source_bytes: 6236
      parse_reached_bytes: 318
      parse_failure: 'swift parsing stopped: configuration (timeout 30000 ms, elapsed 30001 ms, source 6236 bytes, reached 318 bytes)'
      parse_config: config/packs/painted-wolf/platform/host/source-parsing.yaml
    expect_contains: ['Code: MUTATION_PARSE_FAILED', 'configuration', '6236']
  - id: no_tree
    vars:
      path: Sources/Game/Level.swift
      tool: write
      parse_reason: no_tree
      parse_timed_out: false
      parse_canceled: false
      parse_language: swift
      parse_phase: candidate
      parse_timeout_ms: 30000
      parse_elapsed_ms: 30001
      parse_source_bytes: 6236
      parse_reached_bytes: 318
      parse_failure: 'swift parsing stopped: no_tree (timeout 30000 ms, elapsed 30001 ms, source 6236 bytes, reached 318 bytes)'
      parse_config: config/packs/painted-wolf/platform/host/source-parsing.yaml
    expect_contains: ['Code: MUTATION_PARSE_FAILED', 'no_tree', '6236']
  - id: original_failure_with_candidate_diagnostics
    vars:
      path: src/main.swift
      tool: edit
      parse_reason: panic
      parse_timed_out: false
      parse_canceled: false
      parse_language: swift
      parse_phase: original
      parse_failure: 'swift parsing stopped: panic (timeout 30000 ms, elapsed 30017 ms, source 6236 bytes, reached 431 bytes)'
      parse_errors: ['line 5, column 12: missing )']
    expect_contains: ['original', 'line 5, column 12', 'clean candidate']
