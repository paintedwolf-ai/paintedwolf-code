spec_version: "1.0"
id: SURVEY_PATH_ESCAPE
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.path, paintedwolf.path_escape, paintedwolf.receiving_tool_summarize, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SURVEY_PATH_ESCAPE"
effect: block
category: recoverable
emit: guard:survey
message: survey path escapes project sandbox
what: '{{ tool }} could not establish path authority for {{ paintedwolf.path }}.'
cause: This path is outside the attached folders and current access grants.
why: Structured rejects keep sandbox enforcement consistent across read-only survey tools.
fix: If you meant a project file, use a path inside an attached folder (inspect "." or "@label/sub/path" with an offered listing capability). If the user named this exact path, say it is outside the attached folders and ask them to attach that folder; do not respell the path to look reachable. {% if paintedwolf.receiving_tool_summarize %}For nonprotected text you already have, pass `content` and omit `path` and `paths` on this tool.{% endif %}
instead: Preserve the path boundary; do not respell the path or request pasted protected content
scenarios:
  - id: default
    vars:
      path: ../outside
      session_role: explore_readonly
      tool: find
