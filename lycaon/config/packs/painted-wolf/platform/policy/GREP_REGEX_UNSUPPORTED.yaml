spec_version: "1.0"
id: GREP_REGEX_UNSUPPORTED
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "GREP_REGEX_UNSUPPORTED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:grep
message: search pattern construct is outside the declared dialect
what: The search pattern uses a construct outside its declared regex dialect.
cause: Each search dialect accepts only its declared grammar; -P is the bounded pcre-common-v1 subset, and constructs outside it are refused rather than reinterpreted.
why: Running the pattern under another engine or reading it as literal text would change what matches.
fix: Rewrite the pattern within the dialect's grammar, for example a fixed-width lookbehind or a numbered group instead of a named one, or choose the dialect that defines the construct.
instead: Branch on Code; rewrite the pattern within the declared grammar
x-paintedwolf-scenarios:
  - id: default
    vars:
      tool: command
