spec_version: "1.0"
id: WORKER_WORKSPACE_REQUIRED
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "WORKER_WORKSPACE_REQUIRED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
message: Worker type requires a workspace
what: The requested worker type requires an attached project folder.
cause: The requested work needs an attached folder, but this session has none.
why: A workspace-bound worker cannot safely resolve scope or persist project changes without an attached folder.
fix: Attach a project folder, then dispatch this worker again.
instead: Ask the user to attach a folder, then dispatch again
x-paintedwolf-scenarios:
  - id: no_workspace
    vars:
      agent_type: implementer
