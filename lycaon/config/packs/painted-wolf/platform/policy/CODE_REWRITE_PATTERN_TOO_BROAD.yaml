oar: '1.0'
id: CODE_REWRITE_PATTERN_TOO_BROAD
kind: schema
anchor: tool.rejected
selector:
  tool:
    - code_rewrite
requires:
  profiles:
    - tool
  facts:
    - paintedwolf.rejection_code
    - paintedwolf.operator
    - paintedwolf.path
    - paintedwolf.pattern
when: paintedwolf.rejection_code == "CODE_REWRITE_PATTERN_TOO_BROAD"
effect: block
copy:
  what: 'code_rewrite on {{ paintedwolf.path }} rejected pattern {{ paintedwolf.pattern }} — a bare {{ paintedwolf.operator }} between two metavariables matches every such operator in the file, not one meaning of it.'
  cause: '`$A | $B` is every binary or (bitwise, boolean, and type union). `$A + $B` is every addition. A rewrite at that breadth changes sites you did not intend.'
  why: 'Structural match is by tree shape, not by the comment you had in mind. Narrow one operand so the pattern names the sites you mean.'
  fix: 'Make one side concrete — `$T | None`, `foo($A) | $B`, or the exact expression — then dry_run before apply.'
  instead: Branch on Code; narrow the pattern and dry_run
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:structural
x-paintedwolf-message: structural pattern is a bare binary operator
x-paintedwolf-scenarios:
  - id: default
    vars:
      operator: '|'
      path: ntp_check.py
      pattern: '$T | $B'
      profile: implement
      tool: code_rewrite
    expect_contains:
      - 'Rejected:'
      - 'Code: CODE_REWRITE_PATTERN_TOO_BROAD'
