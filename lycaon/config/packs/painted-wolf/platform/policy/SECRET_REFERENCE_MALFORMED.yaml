spec_version: "1.0"
id: SECRET_REFERENCE_MALFORMED
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SECRET_REFERENCE_MALFORMED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
message: An argument contains an incomplete managed secret reference
what: An argument contains an incomplete managed secret reference.
cause: Text begins a reference but does not form one, so no value can be substituted for it.
why: An incomplete reference would reach the command or service as literal text instead of the value it names.
fix: Copy each reference exactly as the host issued it, or list this chat's managed secrets to get it again. Remove reference text that is not meant to be substituted.
instead: Do not rebuild or abbreviate reference text
x-paintedwolf-scenarios:
  - id: default
    vars:
      profile: implement
      tool: command
