spec_version: "1.0"
id: BACKGROUND_HANDLE_REQUIRED
kind: schema
on: tool.rejected
selector:
  tools:
    - command_output
    - command_stop
requires_facts: [paintedwolf.id_required, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "BACKGROUND_HANDLE_REQUIRED"
effect: block
category: recoverable
emit: guard:tool
message: background handle is required
what: '{{ tool }} requires a handle.'
cause: This call did not identify a command job.
why: Reading output or stopping a process must target the intended execution.
fix: Pass the handle from the intended command’s actual spawn or yield result. If no handle was returned, inspect that call’s result; do not invent a handle or start replacement work just to obtain one.
instead: Supply the intended returned handle, or use the completed result
scenarios:
  - id: default
    vars:
      handle: bg-1
      path: src/main.go
      profile: coordinator
      tool: command_output
