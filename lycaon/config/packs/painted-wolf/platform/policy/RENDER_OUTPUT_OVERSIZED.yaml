spec_version: "1.0"
id: RENDER_OUTPUT_OVERSIZED
kind: schema
on: tool.rejected
selector:
  tools:
    - render_view
requires_facts: [paintedwolf.bytes, paintedwolf.max_bytes, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "RENDER_OUTPUT_OVERSIZED"
effect: block
category: recoverable
emit: guard:visual_render
message: Rasterized mockup PNG exceeds artifact byte cap
what: The screenshot was {{ paintedwolf.bytes }} bytes and could not normalize into the {{ paintedwolf.max_bytes }}-byte artifact bound.
cause: Viewport or markup complexity produced an oversized PNG even after normalization.
why: Visual artifacts must fit store and multimodal transport limits.
fix: Reduce intended output dimensions or complexity, then retry. If showing only part of the design, report the limited coverage rather than claiming a complete render.
instead: Branch on Code RENDER_OUTPUT_OVERSIZED; shrink viewport or simplify markup
scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      session_role: coordinator
      tool: render_view
