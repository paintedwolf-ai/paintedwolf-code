oar: '1.0'
id: READ_BINARY_DENIED
kind: schema
anchor: tool.rejected
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.bytes
  - paintedwolf.path
  - paintedwolf.binary_denied
  - paintedwolf.can_stat
  - paintedwolf.can_view_image
  - paintedwolf.workspace_image_supported
  - paintedwolf.rejection_reason
when: paintedwolf.rejection_code == "READ_BINARY_DENIED"
effect: block
copy:
  what: '{{ tool }} could not decode {{ paintedwolf.path }} ({{ paintedwolf.bytes }} input bytes) as supported bounded
    text.'
  cause: 'The text reader reported: {{ paintedwolf.rejection_reason }}.'
  why: Binary content, unsupported encoding, or a decoding bound cannot be treated as readable source text.
  fix: '{% if paintedwolf.workspace_image_supported %}{% if paintedwolf.can_view_image %}Use view_image to inspect this asset, then assess the returned evidence.{% else %}{% if paintedwolf.can_stat %}Use stat if metadata answers the question.{% endif %}{% endif %}{% else %}{% if paintedwolf.can_stat %}Use stat if metadata answers the question.{% endif %}{% endif %} A different text file cannot substitute for required evidence from this asset. Preserve any unresolved content requirement.'
  instead: Diagnose the text-decoding failure; do not invent replacement evidence
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:read
x-paintedwolf-message: read refused binary file content
x-paintedwolf-scenarios:
- id: default
  vars:
    bytes: 6148
    path: .DS_Store
    profile: explore_readonly
    tool: read
  expect_contains:
  - 'Rejected:'
  - 'Code: READ_BINARY_DENIED'
- id: image_file
  vars:
    bytes: 4096
    workspace_image_supported: true
    can_view_image: true
    path: assets/logo.png
    profile: coordinator
    tool: read
  expect_contains:
  - 'Rejected:'
  - 'Code: READ_BINARY_DENIED'
  - 'Use view_image to inspect this asset, then assess the returned evidence.'
