oar: '1.0'
id: TOOL_ARGS_INVALID
kind: schema
anchor: tool.rejected
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.suggested_tool
  - paintedwolf.rejection_reason
  - paintedwolf.rejection_field
  - paintedwolf.relocated_field
  - paintedwolf.nested_under
  - paintedwolf.expected_path
  - paintedwolf.did_you_mean
  - paintedwolf.unparsed_json
  - paintedwolf.expected_type
  - paintedwolf.conflict_keys
  - paintedwolf.replacement_args_json
when: paintedwolf.rejection_code == "TOOL_ARGS_INVALID"
effect: block
copy:
  what: '{% if paintedwolf.relocated_field %}Argument `{{ paintedwolf.relocated_field }}` was placed at root; it belongs under `{{ paintedwolf.nested_under }}`{% else %}{% if paintedwolf.did_you_mean %}Unknown argument `{{ paintedwolf.rejection_field }}`: did you mean `{{ paintedwolf.did_you_mean }}`?{% else %}{% if paintedwolf.conflict_keys %}Conflicting arguments provided: pass only one of {{ paintedwolf.conflict_keys }}{% else %}{% if paintedwolf.unparsed_json %}Argument `{{ paintedwolf.rejection_field }}` was passed as a JSON string instead of a native {{ paintedwolf.expected_type }}{% else %}Tool arguments failed validation: {{ paintedwolf.rejection_reason }}{% endif %}{% endif %}{% endif %}{% endif %}'
  cause: '{% if paintedwolf.relocated_field %}The tool schema does not accept `{{ paintedwolf.relocated_field }}` at root; it must be nested under `{{ paintedwolf.nested_under }}`.{% else %}{% if paintedwolf.did_you_mean %}The property `{{ paintedwolf.rejection_field }}` is not defined on this tool; `{{ paintedwolf.did_you_mean }}` is declared.{% else %}{% if paintedwolf.conflict_keys %}The supplied arguments violate mutual exclusivity.{% else %}{% if paintedwolf.unparsed_json %}The tool schema expects a structured JSON {{ paintedwolf.expected_type }}, but received a string literal containing escaped JSON.{% else %}Tool arguments failed validation: {{ paintedwolf.rejection_reason }}{% endif %}{% endif %}{% endif %}{% endif %}'
  why: The published tool schema defines field names, types, required values, and structure. Intrinsic diagnostics identify the violated field, misplaced nesting, or conflicting parameters.
  fix: |
    {% if paintedwolf.replacement_args_json %}Reissue the call with repaired arguments:
    ```json
    {{ paintedwolf.replacement_args_json }}
    ```
    {% else %}{% if paintedwolf.relocated_field %}Reissue the call with `{{ paintedwolf.relocated_field }}` nested inside `{{ paintedwolf.nested_under }}`.{% else %}{% if paintedwolf.did_you_mean %}Use `{{ paintedwolf.did_you_mean }}` instead of `{{ paintedwolf.rejection_field }}`.{% else %}{% if paintedwolf.suggested_tool %}Correct the named field using this tool's schema, or use `{{ paintedwolf.suggested_tool }}` to replace the whole file.{% else %}Correct the field type, required value, or structure named in the diagnostic, then retry only the rejected call.{% endif %}{% endif %}{% endif %}{% endif %}
  instead: '{% if paintedwolf.suggested_tool %}Fix the argument object, or switch to `{{ paintedwolf.suggested_tool }}`.{% else %}Repair the rejected argument object and retry.{% endif %}'
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool_args
x-paintedwolf-message: '{% if paintedwolf.relocated_field %}Argument `{{ paintedwolf.relocated_field }}` belongs under `{{ paintedwolf.nested_under }}`{% else %}{% if paintedwolf.did_you_mean %}Unknown argument `{{ paintedwolf.rejection_field }}`: did you mean `{{ paintedwolf.did_you_mean }}`?{% else %}{% if paintedwolf.conflict_keys %}Conflicting arguments provided: pass only one of {{ paintedwolf.conflict_keys }}{% else %}{% if paintedwolf.unparsed_json %}Argument `{{ paintedwolf.rejection_field }}` was passed as a JSON string instead of a native {{ paintedwolf.expected_type }}{% else %}Tool arguments failed validation: {{ paintedwolf.rejection_reason }}{% endif %}{% endif %}{% endif %}{% endif %}'
x-paintedwolf-scenarios:
- id: default
  vars:
    detail: bad args
    path: src/main.go
    profile: coordinator
    tool: read
  expect_contains:
  - 'Rejected:'
  - 'Code: TOOL_ARGS_INVALID'
  - Fix
- id: mutation-sibling
  vars:
    detail: missing old_string
    path: ntp_check.py
    profile: implement
    suggested_tool: write
    tool: edit
  expect_contains:
  - 'Code: TOOL_ARGS_INVALID'
  - write
- id: relocated-field
  vars:
    tool: command
    profile: coordinator
    relocated_field: host_resources
    nested_under: capability_request
  expect_contains:
  - 'Code: TOOL_ARGS_INVALID'
  - 'belongs under `capability_request`'
- id: did-you-mean
  vars:
    tool: command
    profile: coordinator
    rejection_field: timeout
    did_you_mean: timeout_ms
  expect_contains:
  - 'Code: TOOL_ARGS_INVALID'
  - 'did you mean `timeout_ms`'
- id: unparsed-json
  vars:
    tool: http_request
    profile: implement
    rejection_field: body_json
    unparsed_json: true
    expected_type: object
  expect_contains:
  - 'Code: TOOL_ARGS_INVALID'
  - 'instead of a native object'
