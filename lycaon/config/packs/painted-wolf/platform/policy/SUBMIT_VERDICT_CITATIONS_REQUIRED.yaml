oar: '1.0'
id: SUBMIT_VERDICT_CITATIONS_REQUIRED
kind: policy
anchor: tool.rejected
requires:
  profiles:
    - tool
  facts:
    - paintedwolf.rejection_code
    - paintedwolf.review_expected_call
    - paintedwolf.review_observed_handles
    - paintedwolf.can_recall
when: paintedwolf.rejection_code == "SUBMIT_VERDICT_CITATIONS_REQUIRED"
effect: block
copy:
  what: "The terminal verdict carried no usable top-level citations."
  cause: "cited_evidence and cited_urls were empty or absent."
  why: "Terminal adjudication must trace to observed evidence and every owed reviewer."
  fix: "Use the current call shape: {{ paintedwolf.review_expected_call }}. Evidence-handle objects use handle. Available observed sample: {{ paintedwolf.review_observed_handles }}.{% if paintedwolf.can_recall %} Recover a retained observation with `recall(query=\"handle:read#3\")`, passing its exact handle, before citing it.{% else %} Cite only handles shown in this chat or the observed sample.{% endif %}"
  instead: "Add citations from retained review evidence and resubmit; do not invent tokens or repeat completed reviews merely to cite them."
x-paintedwolf-category: recoverable
x-paintedwolf-severity: error
x-paintedwolf-message: Terminal verdict requires top-level cited_evidence or cited_urls from observed tool results.
x-paintedwolf-scenarios:
  - id: recall_callable
    vars:
      can_recall: true
    expect_contains:
      - 'Code: SUBMIT_VERDICT_CITATIONS_REQUIRED'
      - 'recall(query='
  - id: recall_not_callable
    vars:
      can_recall: false
    expect_contains:
      - 'Code: SUBMIT_VERDICT_CITATIONS_REQUIRED'
      - 'Cite only handles shown'
  - id: missing
    vars:
      review_expected_call: 'submit_verdict(verdict={verdict: CHALLENGED}, cited_evidence=[{"handle":"reviewer:read#1"}], cited_urls=[])'
    expect_contains: ['Code: SUBMIT_VERDICT_CITATIONS_REQUIRED', 'handle', 'top-level']
x-paintedwolf-emit: guard:workflow
