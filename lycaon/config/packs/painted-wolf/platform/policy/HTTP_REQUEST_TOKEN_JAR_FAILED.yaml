oar: '1.0'
id: HTTP_REQUEST_TOKEN_JAR_FAILED
kind: schema
anchor: tool.rejected
selector:
  tool:
  - http_request
requires:
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.token_jar_name
  profiles:
  - tool
when: paintedwolf.rejection_code == "HTTP_REQUEST_TOKEN_JAR_FAILED"
effect: block
copy:
  what: Token jar {{ paintedwolf.token_jar_name }} could not be opened; no request was sent.
  cause: A token jar is a managed secret visible to this chat; it was revoked, unreadable, or the secret store is unavailable. The rejection data names the jar and the reason.
  why: Token values are credentials, so the host keeps them in the protected store and never in the transcript.
  fix: Ensure the secret store is available. Use a fresh token jar name if starting a new session. Do not copy token values into arguments or chat.
  instead: Branch on Code HTTP_REQUEST_TOKEN_JAR_FAILED; use another jar name or resolve store availability
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:http_request
x-paintedwolf-message: http_request token jar unavailable
x-paintedwolf-scenarios:
- id: default
  vars:
    jar: auth_api
    reason: secret reference is revoked
    profile: implement
    tool: http_request
    token_jar_name: auth_api
  expect_contains:
  - 'Rejected:'
  - 'Code: HTTP_REQUEST_TOKEN_JAR_FAILED'
