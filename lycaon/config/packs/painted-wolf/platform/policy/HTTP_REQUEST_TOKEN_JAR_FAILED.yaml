spec_version: "1.0"
id: HTTP_REQUEST_TOKEN_JAR_FAILED
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.operation, paintedwolf.rejection_code, paintedwolf.token_jar_name]
when: (paintedwolf.operation == "http_request" || paintedwolf.operation == "command") && paintedwolf.rejection_code == "HTTP_REQUEST_TOKEN_JAR_FAILED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:http_request
message: The token jar is unavailable
what: The host could not open or update the named token jar.
cause: The jar may have expired, been revoked or become unavailable in the vault.
fix: Check the jar state and command receipt before retrying. Pass --managed-token-jar with the intended session name.
instead: Inspect the named token jar in the capability inventory.
x-paintedwolf-scenarios:
  - id: default
    vars:
      jar: auth_api
      reason: secret reference is revoked
      profile: implement
      tool: command
      token_jar_name: auth_api
