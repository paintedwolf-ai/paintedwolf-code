oar: '1.0'
id: COMMAND_PLATFORM_UNAVAILABLE
kind: policy
anchor: tool.rejected
selector:
  tool:
  - command
  - verify
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
when: paintedwolf.rejection_code == "COMMAND_PLATFORM_UNAVAILABLE"
effect: block
copy:
  what: This native command operation is unavailable on the current platform.
  cause: The platform adapter cannot provide the required confined path operation.
  why: A successful command must preserve exact identity and the existing authority boundary.
  fix: Inspect the typed operation details and available command forms. This refusal does not authorize external fallback or replay of earlier effects.
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_composition_redirect
x-paintedwolf-message: native command operation is unavailable
x-paintedwolf-scenarios:
- id: unavailable_path_operation
  vars:
    tool: command
  expect_contains:
  - 'Code: COMMAND_PLATFORM_UNAVAILABLE'
  - exact identity
  - earlier effects
