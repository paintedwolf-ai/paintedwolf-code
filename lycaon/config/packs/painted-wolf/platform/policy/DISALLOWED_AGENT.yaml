spec_version: "1.0"
id: DISALLOWED_AGENT
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code, paintedwolf.workflow_allowed_agents]
when: paintedwolf.rejection_code == "DISALLOWED_AGENT"
effect: block
x-paintedwolf-audience:
  - coordinator
x-paintedwolf-category: recoverable
x-paintedwolf-emit: rule:spec
message: Agent type is not in the workflow allowed_agents allowlist
what: The requested agent_type is not in the workflow allowed_agents allowlist.
cause: The active workflow restricts which worker profiles can start in this phase, and agent_type is outside that allowlist.
why: Workflow phases bind allowed worker profiles to preserve phase posture and review boundaries.
fix: '{% if paintedwolf.workflow_allowed_agents %}Choose an agent from the current dispatch roster: {{ paintedwolf.workflow_allowed_agents }}.{% else %}The current workflow does not offer the requested agent. Inspect the current worker roster and workflow phase before starting work, or instruct an eligible waiting worker; do not substitute an unoffered worker.{% endif %}'
instead: 'Use only workflow-allowed agent ids.'
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      profile: coordinator
      tool: task
