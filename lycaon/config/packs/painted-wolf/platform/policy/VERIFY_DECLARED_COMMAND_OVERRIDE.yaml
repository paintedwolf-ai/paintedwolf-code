oar: '1.0'
id: VERIFY_DECLARED_COMMAND_OVERRIDE
kind: policy
anchor: tool.rejected
selector:
  tool:
  - verify
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.declared
  - paintedwolf.requested
  - paintedwolf.can_command
when: paintedwolf.rejection_code == "VERIFY_DECLARED_COMMAND_OVERRIDE"
effect: block
copy:
  what: This project declares `{{ paintedwolf.declared }}`, but this invocation requested `{{ paintedwolf.requested }}`.
  cause: The requested check does not match the declared project check; it was refused before execution.
  why: ''
  fix: Omit the `command` argument and the `pipeline` argument to run `{{ paintedwolf.declared }}`.{% if paintedwolf.can_command %} Use the offered command tool for a narrower
    check; its result does not replace the declared check.{% endif %}
  instead: ''
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_composition_redirect
x-paintedwolf-message: verify runs the declared command, not a substitute
x-paintedwolf-scenarios:
- id: default
  vars:
    declared: ./task check
    requested: go test ./internal/foo/...
