spec_version: "1.0"
id: VERIFY_DECLARED_COMMAND_OVERRIDE
kind: policy
on: tool.rejected
selector:
  tools:
    - verify
requires_facts: [paintedwolf.declared, paintedwolf.next_steps, paintedwolf.rejection_code, paintedwolf.requested]
when: paintedwolf.rejection_code == "VERIFY_DECLARED_COMMAND_OVERRIDE"
effect: block
category: recoverable
emit: guard:command_composition_redirect
message: verify runs the declared command, not a substitute
what: This project declares `{{ paintedwolf.declared }}`, but this invocation requested `{{ paintedwolf.requested }}`.
cause: The requested check does not match the declared project check; it was refused before execution.
why: ''
fix: 'Omit the `command` argument and the `pipeline` argument to run `{{ paintedwolf.declared }}`. {{ paintedwolf.next_steps }}'
instead: ''
scenarios:
  - id: default
    vars:
      declared: ./task check
      requested: go test ./internal/foo/...
