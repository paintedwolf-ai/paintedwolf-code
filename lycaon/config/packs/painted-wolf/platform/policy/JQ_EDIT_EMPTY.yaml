spec_version: "1.0"
id: JQ_EDIT_EMPTY
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.operation, paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.operation == "jq_edit" && paintedwolf.rejection_code == "JQ_EDIT_EMPTY"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:jq_edit
message: jq_edit program produced no document
what: The jq program produced no document for {{ paintedwolf.path }}; nothing was written.
cause: The program emitted no value, for example through select, empty, or a failed optional path.
why: Writing an empty result would erase the document rather than edit it.
fix: Make the program return the whole updated document, for example `.key = value` or `del(.key)` instead of a filter that selects nothing.
instead: Branch on Code; return the full document from the program
x-paintedwolf-scenarios:
  - id: default
    vars:
      path: config.json
      profile: implement
      tool: jq_edit
