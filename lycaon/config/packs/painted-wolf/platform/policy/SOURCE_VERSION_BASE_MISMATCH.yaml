spec_version: "1.0"
id: SOURCE_VERSION_BASE_MISMATCH
kind: schema
on: tool.rejected
selector:
  tools:
    - restore_version
requires_facts: [paintedwolf.detail, paintedwolf.next_steps, paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SOURCE_VERSION_BASE_MISMATCH"
effect: block
category: recoverable
emit: guard:restore_version
message: current file version does not match base_version_id
what: Base version mismatch for {{ paintedwolf.path }} — {{ paintedwolf.detail }}.
cause: The current file version does not match the expected base_version_id (compare-and-swap conflict).
why: The base_version_id guard protects against overwriting concurrent edits made by others or in another window.
fix: '{{ paintedwolf.next_steps }}'
instead: 'Branch on Code.'
scenarios:
  - id: default
    vars:
      detail: current version v2 does not match expected v1
      path: main.go
      session_role: implement
      source_history_offered: true
      tool: restore_version
  - id: without_source_history
    vars:
      detail: current version v2 does not match expected v1
      path: main.go
      session_role: plan_write_only
      source_history_offered: false
      tool: restore_version
