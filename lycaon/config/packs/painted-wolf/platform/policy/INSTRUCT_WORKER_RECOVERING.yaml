oar: '1.0'
id: INSTRUCT_WORKER_RECOVERING
kind: schema
anchor: tool.rejected
selector:
  tool:
    - instruct_worker
requires:
  facts: [paintedwolf.rejection_code]
  profiles:
    - tool
when: paintedwolf.rejection_code == "INSTRUCT_WORKER_RECOVERING"
effect: block
copy:
  what: 'The worker''s workspace needs recovery first.'
  cause: Settlement, landing or workspace preparation left a blocker that must be resolved.
  why: A new round on an unrecovered workspace could lose or mix work.
  fix: Resolve the recovery the roster names, then instruct the worker.
  instead: Branch on Code INSTRUCT_WORKER_RECOVERING; do not retry the same call
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:instruct_worker
x-paintedwolf-message: 'The worker''s workspace needs recovery first.'
x-paintedwolf-scenarios:
  - id: default
    vars:
      profile: coordinator
      tool: instruct_worker
