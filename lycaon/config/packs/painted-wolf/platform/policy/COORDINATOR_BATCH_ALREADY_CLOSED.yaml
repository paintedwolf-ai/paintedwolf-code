oar: '1.0'
id: COORDINATOR_BATCH_ALREADY_CLOSED
kind: policy
anchor: coordinator.pre_invoke
requires:
  profiles:
    - tool
  facts:
    - paintedwolf.batch_closed
    - paintedwolf.last_assistant
when: paintedwolf.batch_closed && (paintedwolf.last_assistant != "" || tool == "pack_board")
effect: block
copy:
  what: "The current batch has already delivered its accepted report."
  cause: "The accepted-report latch or durable closed batch state forbids this further orientation or report action."
  why: The in-turn latch and batch_phase=closed mirror enforce one report per batch
  fix: "Preserve the accepted synthesis and end this turn. The host admits a new batch when the next applicable user turn begins."
  instead: "Do not repeat pack_board or the closing report for the batch that is already closed."
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
x-paintedwolf-message: Coordinator batch is closed — one synthesis per batch
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      profile: coordinator
      tool: pack_board
    expect_contains:
      - 'Rejected:'
      - 'Code: COORDINATOR_BATCH_ALREADY_CLOSED'
