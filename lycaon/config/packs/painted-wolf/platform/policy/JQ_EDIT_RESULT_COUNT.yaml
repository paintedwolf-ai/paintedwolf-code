oar: '1.0'
id: JQ_EDIT_RESULT_COUNT
kind: schema
anchor: tool.rejected
selector:
  tool:
    - jq_edit
requires:
  profiles:
    - tool
  facts:
    - paintedwolf.rejection_code
    - paintedwolf.path
    - paintedwolf.count
when: paintedwolf.rejection_code == "JQ_EDIT_RESULT_COUNT"
effect: block
copy:
  what: The jq program produced {{ paintedwolf.count }} documents from the single document {{ paintedwolf.path }}; nothing was written.
  cause: The program emits several values, for example by iterating with `.[]` or using `,` at the top level.
  why: A single document written back as a stream would change what the file is.
  fix: Update the document inside one expression, for example `.items |= map(...)` instead of `.items[] | ...`.
  instead: Branch on Code; make the program return one document
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:jq_edit
x-paintedwolf-message: jq_edit program produced several documents from one
x-paintedwolf-scenarios:
  - id: default
    vars:
      count: '3'
      path: config.json
      profile: implement
      tool: jq_edit
    expect_contains:
      - 'Rejected:'
      - 'Code: JQ_EDIT_RESULT_COUNT'
