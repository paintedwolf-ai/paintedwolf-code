oar: '1.0'
id: EDITOR_DOCUMENT_READ_REQUIRED
kind: policy
anchor: tool.rejected
selector:
  tool: [write, edit, replace_lines, code_rewrite, jq_edit, restore_version]
requires:
  profiles: [tool]
  facts: [paintedwolf.rejection_code, paintedwolf.path]
when: paintedwolf.rejection_code == "EDITOR_DOCUMENT_READ_REQUIRED"
effect: block
copy:
  what: 'Read `{{ paintedwolf.path }}` before editing its shared document.'
  cause: 'No eligible source observation for this file was available before this response. Partial summaries and grep do not establish an edit base. Your own successful write permits further edits in the same response.'
  why: A write must be based on text you have seen so concurrent changes can be preserved.
  fix: Call `read` for `{{ paintedwolf.path }}`. After its result, recompute the edit using source text without displayed line labels.
  instead: Read this file now; retry the mutation in your next response.
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:editor_document
x-paintedwolf-message: shared document requires an agent read
x-paintedwolf-scenarios:
  - id: default
    vars:
      path: src/main.go
      profile: implement
      tool: edit
    expect_contains:
      - 'Rejected:'
      - 'Code: EDITOR_DOCUMENT_READ_REQUIRED'
