spec_version: "1.0"
id: EDIT_OLD_STRING_AMBIGUOUS
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - edit
requires_facts: [paintedwolf.occurrences, paintedwolf.operation, paintedwolf.path, paintedwolf.rejection_code, paintedwolf.selector_ambiguous]
when: paintedwolf.rejection_code == "EDIT_OLD_STRING_AMBIGUOUS"
effect: block
category: recoverable
emit: guard:edit
message: edit old_string matches more than once
what: edit on {{ paintedwolf.path }} found {{ paintedwolf.occurrences }} matches for the searched text — a single-occurrence edit needs a unique target.
cause: edit replaces a single exact substring by default; multiple matches make the target ambiguous.
why: Silent first-match replacement would edit the wrong site — either widen the searched text with surrounding context until it is unique, or set replace_all to change every occurrence.
fix: For a single edit, include more neighboring context so the searched text is unique. Set replace_all true only when changing every matching occurrence is intended.
instead: Branch on Code; set replace_all true for all sites, else widen the searched text until unique
scenarios:
  - id: default
    vars:
      occurrences: 2
      path: internal/foo.go
      profile: implement
      tool: edit
