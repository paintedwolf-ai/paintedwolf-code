spec_version: "1.0"
id: DELETE_IS_DIRECTORY
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation: [delete]
requires_facts: [paintedwolf.operation, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "DELETE_IS_DIRECTORY"
effect: block
category: recoverable
emit: guard:delete
message: This delete call is restricted to files
what: This delete call is restricted to files, but the selected path is a directory.
cause: Exact rm translation preserves rm's default refusal to remove directories.
why: Removing even an empty directory is a distinct destructive action.
fix: If the user explicitly requested removal of the empty directory, call delete again without files_only.
instead: Do not broaden the target set or remove a non-empty directory
scenarios:
  - id: default
    vars: {path: tmp, session_role: implement, tool: delete}
