oar: '1.0'
id: USE_FIND_NOT_COMMAND
kind: policy
anchor: tool.rejected
selector:
  tool:
  - command
  - verify
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.command
  - paintedwolf.example
  - paintedwolf.habit_redirect_match
when: paintedwolf.rejection_code == "USE_FIND_NOT_COMMAND"
effect: block
copy:
  what: The parsed command can be represented by the supplied find call.
  cause: The host parsed the supported command shape and validated the replacement against the tool currently
    offered.
  why: The supplied call preserves the parsed discovery scope and supported flags; follow native result coverage
    and pagination.
  fix: Use the supplied replacement_calls entries exactly and in order. Account for each result before continuing;
    native limits and partial-result receipts still apply.
  instead: Use the validated find replacement and preserve the intended operation
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_habit_redirect
x-paintedwolf-message: Use native find instead of command find/tree
x-paintedwolf-scenarios:
- id: default
  vars:
    detail: bad args
    path: src/main.go
    profile: coordinator
    tool: command
  expect_contains:
  - 'Rejected:'
  - 'Code: USE_FIND_NOT_COMMAND'
