oar: '1.0'
id: SECRET_REFERENCE_INVALID
kind: schema
anchor: tool.rejected
requires:
  facts: [paintedwolf.rejection_code]
  profiles: [tool]
when: paintedwolf.rejection_code == "SECRET_REFERENCE_INVALID"
effect: block
copy:
  what: The managed secret reference is malformed.
  cause: The reference token does not contain the exact host-issued syntax and identifier.
  why: The host resolves only unambiguous capability references.
  fix: Copy a reference exactly from lifecycle-tool output or the visible secret list, then retry.
  instead: Do not edit the reference identifier or guess a protected value
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
x-paintedwolf-message: The managed secret reference is malformed
x-paintedwolf-scenarios:
  - id: default
    vars: {profile: implement, tool: command}
    expect_contains: ['Rejected:', 'Code: SECRET_REFERENCE_INVALID']
