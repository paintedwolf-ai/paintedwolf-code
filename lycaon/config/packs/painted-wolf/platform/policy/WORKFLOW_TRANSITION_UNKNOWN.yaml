oar: '1.0'
id: WORKFLOW_TRANSITION_UNKNOWN
kind: policy
anchor: tool.rejected
requires:
  profiles:
    - tool
  facts:
    - paintedwolf.rejection_code
when: paintedwolf.rejection_code == "WORKFLOW_TRANSITION_UNKNOWN"
effect: block
copy:
  what: The transition_id is not declared on the current phase
  cause: transition_id must match a transitions[].id on the active phase
  why: Call workflow_transition only with an id from the Phase exit choice arms
  fix: Use a transition_id listed in the active-workflow Phase exit section
  instead: Use a transition_id listed in the active-workflow Phase exit section
x-paintedwolf-category: recoverable
x-paintedwolf-severity: error
x-paintedwolf-message: unknown choice transition_id for the current phase
x-paintedwolf-scenarios:
- id: default
  vars:
    phase: decide
    tool: workflow_transition
    transition_id: missing
  expect_contains:
  - 'Code: WORKFLOW_TRANSITION_UNKNOWN'
  - transition
x-paintedwolf-emit: guard:workflow
