spec_version: "1.0"
id: READ_ARGS_CONFLICT
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.admitted_read_addressing_forms, paintedwolf.command_loader_call, paintedwolf.conflict, paintedwolf.detail, paintedwolf.operation, paintedwolf.read_addressing_forms_loadable_without_schema, paintedwolf.read_range_call, paintedwolf.read_symbol_call, paintedwolf.read_window_calls, paintedwolf.rejection_code]
when: paintedwolf.operation == "read" && paintedwolf.rejection_code == "READ_ARGS_CONFLICT"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
message: 'read arguments conflict: {{ paintedwolf.detail }}'
what: 'The read operation received mutually exclusive or conflicting arguments: {{ paintedwolf.detail }}.'
cause: One addressing shape selects the content. Symbol anchors cannot combine with line ranges or window bounds; line ranges cannot combine with window bounds.
why: Mixed addressing leaves no single content window to deliver, so the call is refused rather than guessed.
fix: '{% if paintedwolf.admitted_read_addressing_forms %}Keep the intended path and address it one way inside command{% if paintedwolf.command_loader_call %} after loading it with {{ paintedwolf.command_loader_call }}{% endif %}:{% if paintedwolf.read_symbol_call %} For a symbol, use `{{ paintedwolf.read_symbol_call }}`.{% endif %}{% if paintedwolf.read_range_call %} For a line range, use `{{ paintedwolf.read_range_call }}`.{% endif %}{% if paintedwolf.read_window_calls %} For a window, use {{ paintedwolf.read_window_calls }}.{% endif %}{% else %}{% if paintedwolf.read_addressing_forms_loadable_without_schema %}Keep the intended path and choose one addressing shape according to the schema, or call {{ paintedwolf.command_loader_call }} to inspect its projected schema.{% else %}Keep the intended path and choose one addressing shape according to the schema; remove only the conflicting selectors reported above; preserve the intended coverage.{% endif %}{% endif %}'
instead: Branch on Code; fix args and retry once
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: conflict
      path: src/main.go
      profile: coordinator
      tool: read
  - id: command-leg
    vars:
      admitted_read_addressing_forms: [rg -n SYMBOL FILE, 'sed -n 1,10p FILE', head FILE, tail FILE]
      detail: conflict
      path: src/main.go
      profile: coordinator
      read_range_call: 'sed -n 1,10p FILE'
      read_symbol_call: rg -n SYMBOL FILE
      read_window_calls: [head FILE, tail FILE]
      tool: read
    expect_contains:
      - '`sed -n 1,10p FILE`'
