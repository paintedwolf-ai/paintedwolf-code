spec_version: "1.0"
id: COMMAND_OUTPUT_NO_LIVE_JOB
kind: schema
on: tool.rejected
selector:
  tools:
    - command_output
    - command_stop
requires_facts: [paintedwolf.handle, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "COMMAND_OUTPUT_NO_LIVE_JOB"
effect: block
category: recoverable
emit: guard:tool
message: no live command job for handle {{ paintedwolf.handle }}
what: No live command job exists in this session, so handle {{ paintedwolf.handle }} cannot be polled or stopped.
cause: The requested handle was not found, and the session has no running command jobs. This does not establish whether the handle expired, belongs elsewhere or was never issued.
why: ''
fix: Inspect the intended command’s retained result and lifecycle. Use a handle only if that execution actually returned one and it is still retained. Do not restart completed work just to obtain a pollable job.
instead: ''
scenarios:
  - id: default
    vars:
      handle: command-1
      path: src/main.go
      profile: coordinator
      tool: command_output
