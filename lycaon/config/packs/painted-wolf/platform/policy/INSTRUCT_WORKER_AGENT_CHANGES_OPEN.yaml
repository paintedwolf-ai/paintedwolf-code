spec_version: "1.0"
id: INSTRUCT_WORKER_AGENT_CHANGES_OPEN
kind: schema
on: tool.rejected
selector:
  tools:
    - instruct_worker
requires_facts: [paintedwolf.next_steps, paintedwolf.overlay_id, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "INSTRUCT_WORKER_AGENT_CHANGES_OPEN"
effect: block
category: recoverable
emit: guard:instruct_worker
message: The worker still has changes that are not landed or rejected.
what: The worker still has changes that are not landed or rejected.
cause: Moving a write worker to a read agent would leave its changes without a workspace.
why: 'Shelved changes count: they can still be landed or rejected.'
fix: '{{ paintedwolf.next_steps }}'
instead: Branch on Code INSTRUCT_WORKER_AGENT_CHANGES_OPEN; do not retry the same call
scenarios:
  - id: default
    vars:
      profile: coordinator
      tool: instruct_worker
