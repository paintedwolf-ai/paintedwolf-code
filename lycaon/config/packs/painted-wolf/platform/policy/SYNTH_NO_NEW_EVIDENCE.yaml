# SYNTH_NO_NEW_EVIDENCE — second synthesis cites only evidence from a prior closeout.

spec_version: "1.0"
id: SYNTH_NO_NEW_EVIDENCE
kind: invariant
on: coordinator.closeout_check
selector: {}
requires_facts: [paintedwolf.offender_count, paintedwolf.offenders_omitted, paintedwolf.offenders_sample, paintedwolf.reject_observation, paintedwolf.surface]
when: paintedwolf.surface != "implement_investigate" && paintedwolf.reject_observation == "closeout_no_new_evidence"
effect: block
category: recoverable
emit: guard:coordinator_synthesis
message: Synthesis cited only evidence from a prior closeout
what: Synthesis repeated {{ paintedwolf.offender_count }} citation(s) already committed in an earlier report this turn — no new evidence.
cause: The current cited evidence locations and URLs are all present in the earlier committed report
why: '{{ paintedwolf.offenders_sample }}{% if paintedwolf.offenders_omitted %} +{{ paintedwolf.offenders_omitted }} more{% endif %}'
fix: Keep the earlier report as the delivered result. Do not dispatch work merely to manufacture new citations or repeat the same report. If required work remains, preserve that gap for an actionable turn; the report-only turn does not reopen tools.
instead: Park until new worker results or a user instruction; the host will not assemble a duplicate report
evidence:
  ui_label: New evidence
  ui_check_id: closeout_new_evidence
scenarios:
  - id: subset_repeat
    vars:
      offender_count: 1
      offenders_omitted: 0
      offenders_sample: path:AGENTS.md
