oar: '1.0'
id: VERIFY_COMMAND_UNDECLARED
kind: policy
anchor: coordinator.pre_invoke
selector:
  tool:
    - verify
requires:
  profiles:
    - tool
  facts:
    - paintedwolf.verify_declared
    - paintedwolf.verify_has_command
when: tool == "verify" && !paintedwolf.verify_has_command && !paintedwolf.verify_declared
effect: block
copy:
  what: No verification command was supplied, and this project has no declared check.
  cause: There is no selected check for verify to execute.
  why: ''
  fix: Pass the intended project check explicitly in `command`.
  instead: ''
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
x-paintedwolf-message: '`verify()` has no command to run'
x-paintedwolf-scenarios:
- id: default
  vars:
    profile: coordinator
    tool: verify
  expect_contains:
  - 'Code: VERIFY_COMMAND_UNDECLARED'
  - command
