spec_version: "1.0"
id: VERIFY_COMMAND_UNDECLARED
kind: policy
on: coordinator.pre_invoke
selector:
  tools:
    - verify
requires_facts: [paintedwolf.verify_declared, paintedwolf.verify_has_command]
when: tool == "verify" && !paintedwolf.verify_has_command && !paintedwolf.verify_declared
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
message: '`verify()` has no command to run'
what: No verification command was supplied, and this project has no declared check.
cause: There is no selected check for verify to execute.
why: ''
fix: 'Pass the intended project check explicitly in the `command` argument.'
instead: ''
x-paintedwolf-scenarios:
  - id: default
    vars:
      profile: coordinator
      tool: verify
