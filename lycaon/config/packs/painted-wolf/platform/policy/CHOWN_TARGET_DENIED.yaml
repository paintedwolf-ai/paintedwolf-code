spec_version: "1.0"
id: CHOWN_TARGET_DENIED
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - chown
requires_facts: [paintedwolf.operation, paintedwolf.ownership_field, paintedwolf.ownership_gid, paintedwolf.ownership_target, paintedwolf.ownership_uid, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "CHOWN_TARGET_DENIED"
effect: block
category: recoverable
emit: guard:chown
message: chown:chown target uid or gid not allowed
what: The requested ownership target {{ paintedwolf.ownership_target }} is unavailable for chown.
cause: The requested identity differs from the identity this host permits.
why: This host permits only its current user ID {{ paintedwolf.ownership_uid }} and group ID {{ paintedwolf.ownership_gid }}.
fix: Use the exact permitted numeric UID and GID only when that matches the requested ownership change. The native form accepts UID[:GID], without account-name lookup. Otherwise report the limitation; do not guess another account, elevate the host, or switch tools to bypass it.
instead: Branch on Code CHOWN_TARGET_DENIED; retain the current-identity boundary
scenarios:
  - id: default
    vars:
      detail: bad args
      path: scripts/run.sh
      profile: implement
      tool: chown
