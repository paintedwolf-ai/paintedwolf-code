oar: '1.0'
id: SECRET_REFERENCE_OUTSIDE_SINK
kind: schema
anchor: tool.rejected
requires:
  facts:
  - paintedwolf.rejection_code
  profiles:
  - tool
when: paintedwolf.rejection_code == "SECRET_REFERENCE_OUTSIDE_SINK"
effect: block
copy:
  what: A managed secret reference reached an argument that does not resolve it.
  cause: Only an operation's declared value arguments resolve references. A builtin's arguments, a path, and here-document text stay literal.
  why: Writing the reference as text would leave a file that looks configured and holds no value.
  fix: >-
    For a config file, use `edit --path FILE --old-string OLD --new-string 'KEY=<reference>'` or `replace-lines --content`.
    For JSON, YAML, or TOML, use `jq-edit --path FILE --query '.key = $value' --arg value '<reference>'`.
    For a process, set it on the command: `KEY='<reference>' ./program`.
  instead: Do not put a reference in a here-document, `printf`, or a path
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
x-paintedwolf-message: A managed secret reference reached an argument that does not resolve it
x-paintedwolf-scenarios:
- id: default
  vars:
    profile: implement
    tool: command
