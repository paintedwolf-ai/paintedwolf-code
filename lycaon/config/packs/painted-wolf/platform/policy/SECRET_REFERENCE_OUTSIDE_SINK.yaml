spec_version: "1.0"
id: SECRET_REFERENCE_OUTSIDE_SINK
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.admitted_secret_config_forms, paintedwolf.command_external_reachable, paintedwolf.command_jq_edit_reachable, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SECRET_REFERENCE_OUTSIDE_SINK"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
message: A managed secret reference reached an argument that does not resolve it
what: A managed secret reference reached an argument that does not resolve it.
cause: Only an operation's declared value arguments resolve references. A builtin's arguments, a path, and here-document text stay literal.
why: Writing the reference as text would leave a file that looks configured and holds no value.
fix: >-
  {% if paintedwolf.admitted_secret_config_forms %}For a config file, use {{ paintedwolf.admitted_secret_config_forms }} in command. {% endif %}{% if paintedwolf.command_jq_edit_reachable %}For JSON, YAML, or TOML, use `jq-edit --path FILE --query '.key = $value' --arg value '<reference>'` in command. {% endif %}{% if paintedwolf.command_external_reachable %}For a process, set it on the command: `KEY='<reference>' ./program`.{% else %}Pass the reference only in an offered tool field that resolves secret references.{% endif %}
instead: Do not put a reference in a here-document, `printf`, or a path
x-paintedwolf-scenarios:
  - id: default
    vars:
      admitted_secret_config_forms: "`edit --path FILE --old-string OLD --new-string 'KEY=<reference>'` or `replace-lines --content`"
      command_external_reachable: true
      command_jq_edit_reachable: true
      profile: implement
      tool: command
    expect_contains:
      - 'edit --path FILE --old-string OLD'
  - id: read-only
    vars:
      admitted_secret_config_forms: ""
      command_external_reachable: true
      command_jq_edit_reachable: false
      profile: worker_readonly
      tool: command
    expect_contains:
      - 'For a process, set it on the command'
