spec_version: "1.0"
id: JQ_EDIT_LOSSY
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.admitted_mutation_forms, paintedwolf.command_loader_call, paintedwolf.format, paintedwolf.kind, paintedwolf.line, paintedwolf.mutation_forms_loadable_without_schema, paintedwolf.operation, paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.operation == "jq_edit" && paintedwolf.rejection_code == "JQ_EDIT_LOSSY"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:jq_edit
message: jq_edit rewrite would lose source syntax
what: 'Rewriting {{ paintedwolf.path }} as {{ paintedwolf.format }} would lose a {{ paintedwolf.kind }}{% if paintedwolf.line %} at line {{ paintedwolf.line }}{% endif %}; nothing was written.'
cause: The document holds syntax a structured rewrite cannot carry, such as TOML comments or datetimes, YAML anchors and aliases, or a YAML tag on a value the program changed.
why: A write that silently drops comments, references, or types changes more than the program asked for.
fix: '{% if paintedwolf.admitted_mutation_forms %}Make this change in command{% if paintedwolf.command_loader_call %} after loading it with {{ paintedwolf.command_loader_call }}{% endif %} ({{ paintedwolf.admitted_mutation_forms }}), keeping surrounding text as written.{% else %}{% if paintedwolf.mutation_forms_loadable_without_schema %}Call {{ paintedwolf.command_loader_call }} to inspect its projected schema for text-preserving edits.{% else %}This rewrite needs a surface that can write files; the lossless structured rewrites are not offered on this read-only profile.{% endif %}{% endif %}'
instead: Branch on Code; edit the text directly
x-paintedwolf-scenarios:
  - id: default
    vars:
      admitted_mutation_forms: [edit --path FILE --old-string OLD --new-string NEW, replace-lines --path FILE --start 1 --end 1 --content NEW]
      format: toml
      kind: comment
      line: '3'
      path: Cargo.toml
      profile: implement
      tool: jq_edit
    expect_contains:
      - edit --path FILE
  - id: read-only
    vars:
      admitted_mutation_forms: []
      format: toml
      kind: comment
      line: '3'
      path: Cargo.toml
      profile: worker_readonly
      tool: jq_edit
    expect_contains:
      - read-only profile
