spec_version: "1.0"
id: CHOWN_UNSUPPORTED
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.operation, paintedwolf.rejection_code, paintedwolf.unsupported]
when: paintedwolf.operation == "chown" && paintedwolf.rejection_code == "CHOWN_UNSUPPORTED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:chown
message: chown:chown not supported on this platform
what: This host does not implement ownership changes.
cause: The current platform has no supported native ownership operation.
why: Argument changes cannot add an unavailable platform capability.
fix: Report the ownership requirement as unresolved and use the appropriate host or user workflow if it is necessary. Do not retry changed arguments or substitute an unreviewed command.
instead: Branch on Code CHOWN_UNSUPPORTED; retain the platform limitation
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: bad args
      path: scripts/run.sh
      profile: implement
      tool: chown
