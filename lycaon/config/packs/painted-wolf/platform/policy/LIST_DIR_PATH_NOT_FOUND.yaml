spec_version: "1.0"
id: LIST_DIR_PATH_NOT_FOUND
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.operation, paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.operation == "list_dir" && paintedwolf.rejection_code == "LIST_DIR_PATH_NOT_FOUND"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:list_dir
message: list_dir path does not exist
what: The listing path {{ paintedwolf.path }} does not exist.
cause: The path argument must name an existing directory under the attached project roots.
why: Structured rejects let agents branch without parsing free-form stat errors.
fix: Inspect the nearest existing parent, then list a directory shown there.
instead: Branch on Code; choose an existing directory before listing again
x-paintedwolf-scenarios:
  - id: default
    vars:
      path: missing/dir
      profile: explore_readonly
      tool: list_dir
