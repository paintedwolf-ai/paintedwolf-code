oar: '1.0'
id: CHOWN_PATH_DENIED
kind: schema
anchor: tool.rejected
selector:
  tool:
  - chown
requires:
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.path
  profiles:
  - filesystem
  - tool
when: paintedwolf.rejection_code == "CHOWN_PATH_DENIED"
effect: block
copy:
  cause: The target crosses a host write-protection boundary.
  why: Ownership changes cannot override protected-path authority.
  fix: Leave the protected target unchanged. Do not substitute a different tool or identity to bypass this
    boundary.
  instead: Branch on Code CHOWN_PATH_DENIED; preserve the protected target
  what: Ownership changes are denied for {{ paintedwolf.path }}.
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:chown
x-paintedwolf-message: chown:chown path matches deny glob
x-paintedwolf-scenarios:
- id: default
  vars:
    detail: bad args
    path: scripts/run.sh
    profile: implement
    tool: chown
  expect_contains:
  - 'Rejected:'
  - 'Code: CHOWN_PATH_DENIED'
