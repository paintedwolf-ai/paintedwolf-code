spec_version: "1.0"
id: CHOWN_PATH_DENIED
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - chown
requires_facts: [paintedwolf.operation, paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "CHOWN_PATH_DENIED"
effect: block
category: recoverable
emit: guard:chown
message: chown:chown path matches deny glob
what: Ownership changes are denied for {{ paintedwolf.path }}.
cause: The target crosses a host write-protection boundary.
why: Ownership changes cannot override protected-path authority.
fix: Leave the protected target unchanged. Do not substitute a different tool or identity to bypass this boundary.
instead: Branch on Code CHOWN_PATH_DENIED; preserve the protected target
scenarios:
  - id: default
    vars:
      detail: bad args
      path: scripts/run.sh
      profile: implement
      tool: chown
