spec_version: "1.0"
id: SUMMARIZE_PATTERN_NEEDS_PATH
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - summarize
requires_facts: [paintedwolf.operation, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SUMMARIZE_PATTERN_NEEDS_PATH"
effect: block
category: recoverable
emit: guard:summarize
message: '`summarize` pattern requires path as a sibling key'
what: '`summarize` received pattern but no path or paths — content grep must be scoped.'
cause: pattern is RE2 content grep under path, not a repo-wide filename filter.
why: Unscoped pattern walks the whole tree and returns unrelated files; path anchors gather to the area you mean.
fix: Retry with path plus pattern, e.g. {"task":"…","path":"lycaon/internal/session","pattern":"Abort"}.
instead: Add path (or paths) as a sibling key alongside pattern and retry once
scenarios:
  - id: default
    vars:
      session_role: coordinator
      tool: summarize
