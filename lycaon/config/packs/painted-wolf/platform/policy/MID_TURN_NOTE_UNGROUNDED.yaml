spec_version: "1.0"
id: MID_TURN_NOTE_UNGROUNDED
kind: invariant
on: coordinator.mid_turn_note
selector: {}
requires_facts: [paintedwolf.mid_turn_citation_attempted, paintedwolf.mid_turn_citations_required, paintedwolf.observed_handles_sample, paintedwolf.observed_paths_sample, paintedwolf.reject_observation]
when: paintedwolf.reject_observation == "mid_turn_note_ungrounded" && paintedwolf.mid_turn_citations_required && !paintedwolf.mid_turn_citation_attempted
effect: warn
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:mid_turn_note
message: Mid-turn text cited nothing and was withheld.
what: '[HOST: MESSAGE WITHHELD FROM USER] Your text alongside the last tool calls cited nothing.'
cause: 'This request already has citable observations, so an update must cite at least one.'
why: 'Unpublished draft: the user has not received this text as an assistant update. The tools in this response already ran and their results appear above; do not re-run them.'
fix: 'Cite what the update reports: a file as [path:line], or a handle printed in a tool result, such as [task#1] for a dispatch. A dispatch citation proves the dispatch, not the worker''s results.{% if paintedwolf.observed_handles_sample %} Observed handles: {{ paintedwolf.observed_handles_sample }}.{% endif %}{% if paintedwolf.observed_paths_sample %} Observed paths: {{ paintedwolf.observed_paths_sample }}.{% endif %} Continue from the tool results above without re-running completed tool calls. Publish a brief update with valid inline citations, or include the relevant explanation in your final reply.'
instead: 'Branch on Code MID_TURN_NOTE_UNGROUNDED; continue from the tool results above without re-running completed tool calls or repeating the same text uncited'
x-paintedwolf-scenarios:
  - id: default
    vars:
      session_role: 'coordinator'
      observed_handles_sample: 'task#1, read#2'
