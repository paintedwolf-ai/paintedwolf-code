oar: '1.0'
id: SHELVE_OVERLAY_NO_CHANGES
kind: schema
anchor: tool.rejected
selector:
  tool:
    - shelve_overlay
requires:
  facts: [paintedwolf.rejection_code]
  profiles:
    - tool
when: paintedwolf.rejection_code == "SHELVE_OVERLAY_NO_CHANGES"
effect: block
copy:
  what: That result changed nothing, so there is nothing to shelve.
  cause: 'The result''s round published no changes.'
  why: Shelving records why changes wait unlanded.
  fix: Account for the result on the checklist instead.
  instead: Branch on Code SHELVE_OVERLAY_NO_CHANGES; do not retry the same call
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:shelve_overlay
x-paintedwolf-message: That result changed nothing, so there is nothing to shelve.
x-paintedwolf-scenarios:
  - id: default
    vars:
      profile: coordinator
      tool: shelve_overlay
