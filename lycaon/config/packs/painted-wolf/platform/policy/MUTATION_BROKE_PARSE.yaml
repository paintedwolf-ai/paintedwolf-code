spec_version: "1.0"
id: MUTATION_BROKE_PARSE
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.admitted_mutation_forms, paintedwolf.can_command, paintedwolf.command_loader_call, paintedwolf.command_surface, paintedwolf.command_tee_reachable, paintedwolf.mutation_forms_loadable_without_schema, paintedwolf.mutation_new_path, paintedwolf.operation, paintedwolf.parse_error, paintedwolf.parse_errors, paintedwolf.path, paintedwolf.python_indent_lines, paintedwolf.rejection_code, paintedwolf.syntax_diagnostics_truncated, paintedwolf.syntax_override_commands]
when: paintedwolf.operation in ["edit", "replace_lines", "code_rewrite", "write", "command"] && paintedwolf.rejection_code == "MUTATION_BROKE_PARSE"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:edit
message: mutation would break parse; not applied
what: '{{ tool }} on {{ paintedwolf.path }} was not applied because the parser reports a syntax error in the proposed file ({{ paintedwolf.parse_error }}).'
cause: >-
  {% if paintedwolf.parse_errors %}Syntax diagnostics: {{ paintedwolf.parse_errors }}. {% if paintedwolf.syntax_diagnostics_truncated %}Additional syntax faults were omitted.{% endif %} {% else %}The completed parser found a syntax regression.{% endif %} {% if paintedwolf.python_indent_lines %}Indentation near the edit: {{ paintedwolf.python_indent_lines }}.{% endif %}
why: A successful-looking broken mutation makes later locations and verification evidence unreliable. The host keeps the previous bytes, or leaves a rejected new path absent.
fix: >-
  The reported locations refer to the rejected candidate, not saved file contents. {% if paintedwolf.mutation_new_path %}This path was absent before this mutation; the rejected candidate was not created. Correct the candidate and retry {% if paintedwolf.command_surface %}{% if paintedwolf.can_command %}a complete staged command redirect{% else %}one complete mutation{% endif %}{% else %}one complete mutation{% endif %}. If the path has since been created, read its current contents before replacing it. {% else %}Read the current file before repairing it; rejected candidate text is not a saved edit base. Correct the candidate with {% if paintedwolf.command_surface %}{% if paintedwolf.admitted_mutation_forms %}one atomic mutation in command{% if paintedwolf.command_loader_call %} after loading it with {{ paintedwolf.command_loader_call }}{% endif %} ({{ paintedwolf.admitted_mutation_forms }}) whose span covers the whole change{% else %}{% if paintedwolf.mutation_forms_loadable_without_schema %}one atomic mutation covering the whole change, or call {{ paintedwolf.command_loader_call }} to inspect its projected schema{% else %}one atomic mutation covering the whole change{% endif %}{% endif %}{% else %}one atomic mutation covering the whole change{% endif %}.{% endif %} Resolve this rejected source mutation before running checks that require its proposed contents. If the proposed syntax is intentional, intermediate, or the parser diagnostic is inaccurate, {% if paintedwolf.command_surface %}{% if paintedwolf.command_tee_reachable %}use `tee --syntax-override-reason TEXT PATH` with the complete candidate on stdin. The catalog supports this option on `{{ paintedwolf.syntax_override_commands }}`. Redirects accept no override. The reason applies only to that operation. {% endif %}{% else %}supply `syntax_override_reason` on the mutation call to proceed.{% endif %}
instead: Correct the candidate and retry one atomic mutation
x-paintedwolf-scenarios:
  - id: default
    vars:
      parse_error: 'line 55: raise ValueError'
      path: ntp_check.py
      profile: implement
      tool: replace_lines
    expect_contains:
      - 'supply `syntax_override_reason`'
  - id: command-leg
    vars:
      admitted_mutation_forms: [edit --path FILE --old-string OLD --new-string NEW, replace-lines --path FILE --start 1 --end 1 --content NEW]
      can_command: true
      command_tee_reachable: true
      native_operation: replace_lines
      parse_error: 'line 55: raise ValueError'
      path: ntp_check.py
      profile: implement
      tool: command
    expect_contains:
      - 'tee --syntax-override-reason'
  - id: command-redirect
    vars:
      admitted_mutation_forms: [edit --path FILE --old-string OLD --new-string NEW, replace-lines --path FILE --start 1 --end 1 --content NEW]
      can_command: true
      command_tee_reachable: true
      parse_error: 'missing newline'
      path: Dockerfile
      tool: command
      profile: implement
    expect_contains:
      - 'tee --syntax-override-reason'
