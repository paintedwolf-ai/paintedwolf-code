spec_version: "1.0"
id: EXTRACT_PATH_DENIED
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.operation, paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.operation == "extract_archive" && paintedwolf.rejection_code == "EXTRACT_PATH_DENIED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:extract_archive
message: extract_archive path matches deny glob
what: Archive extraction is denied for protected path {{ paintedwolf.path }}.
cause: The destination or entry crosses a host write-protection boundary.
why: Archive content cannot grant permission to write protected paths.
fix: Keep the protected target unchanged. Review any retained extracted-entry receipt before continuing; earlier entries may already have landed. Do not change tools or widen a write glob to bypass this floor.
instead: Preserve completed entries and the protected-path boundary
x-paintedwolf-scenarios:
  - id: default
    vars:
      path: .git/objects
      profile: implement
      tool: extract_archive
