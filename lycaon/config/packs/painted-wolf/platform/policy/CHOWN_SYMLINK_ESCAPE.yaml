spec_version: "1.0"
id: CHOWN_SYMLINK_ESCAPE
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - chown
requires_facts: [paintedwolf.operation, paintedwolf.path, paintedwolf.path_escape, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "CHOWN_SYMLINK_ESCAPE"
effect: block
category: recoverable
emit: guard:chown
message: chown:chown symlink target escapes scope
what: The link target for {{ paintedwolf.path }} is outside the permitted ownership-change scope.
cause: The resolved target leaves the workspace or write scope.
why: The resolved target needs its own write authority.
fix: Use an intended in-scope target only; do not replace or retarget links merely to evade the boundary.
instead: Branch on Code CHOWN_SYMLINK_ESCAPE; preserve resolved-target authority
scenarios:
  - id: default
    vars:
      detail: bad args
      path: scripts/run.sh
      session_role: implement
      tool: chown
