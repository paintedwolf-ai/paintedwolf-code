oar: '1.0'
id: SURFACE_NOTE_HANDLE_UNGROUND
kind: schema
anchor: tool.rejected
selector:
  tool:
    - surface_note
requires:
  profiles:
    - tool
  facts:
    - paintedwolf.rejection_code
    - paintedwolf.observed_paths_count
    - paintedwolf.observed_paths_omitted
    - paintedwolf.observed_paths_sample
    - paintedwolf.offender_count
    - paintedwolf.offenders_omitted
    - paintedwolf.offenders_sample
    - paintedwolf.can_recall
when: paintedwolf.rejection_code == "SURFACE_NOTE_HANDLE_UNGROUND"
effect: block
copy:
  what: '{{ paintedwolf.offender_count }} citation(s) did not bind to observed evidence: {{ paintedwolf.offenders_sample }}{% if paintedwolf.offenders_omitted %} +{{ paintedwolf.offenders_omitted }} more{% endif %}'
  cause: A note requires at least one primary grounded citation observed in this session. An unseen handle ordinal, a line range, a bare path, and survey-only handles or digest spans (such as `list#…` or `find#…` without a primary handle) fail to ground a note.
  why: Every note citation resolves to something observed in this session, so the user can check it.
  fix: 'Replace the offending token only. Keep cited_evidence. Cite at least one primary grounded handle (such as `read#…`, `write#…`, `edit#…`, `command#…`, or `page#…`) exactly as printed in a [kind#ordinal] tag you have already seen, or path:line with a single line number; survey handles (`list#…`, `find#…`) cannot ground a note on their own and must be paired with or replaced by a primary handle. {% if paintedwolf.can_recall %}Find the right handle with `recall(query="path:src/a.go")` for an observed path, or confirm one with `recall(query="handle:read#3")`, and cite the handle it returns. {% else %}If the observation is no longer in context, re-read the path and cite the new tag. {% endif %}Observed paths ({{ paintedwolf.observed_paths_count }}): {{ paintedwolf.observed_paths_sample }}{% if paintedwolf.observed_paths_omitted %} +{{ paintedwolf.observed_paths_omitted }} more{% endif %}'
  instead: Branch on Code SURFACE_NOTE_HANDLE_UNGROUND; correct the named token and retry — do not drop cited_evidence, and do not resend the same summary uncited
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:surface_note
# Note retries use the shared grounding friction budget.
x-paintedwolf-message: A note citation did not bind to observed evidence.
x-paintedwolf-scenarios:
  - id: recall_callable
    vars:
      profile: coordinator
      tool: surface_note
      offender_count: 1
      offenders_omitted: 0
      offenders_sample: read#9
      observed_paths_count: 1
      observed_paths_omitted: 0
      observed_paths_sample: src/a.go
      can_recall: true
  - id: recall_not_callable
    vars:
      profile: coordinator
      tool: surface_note
      offender_count: 1
      offenders_omitted: 0
      offenders_sample: read#9
      observed_paths_count: 1
      observed_paths_omitted: 0
      observed_paths_sample: src/a.go
      can_recall: false
  - id: default
    vars:
      profile: coordinator
      tool: surface_note
      offender_count: 1
      offenders_omitted: 0
      offenders_sample: missing.go:1
      observed_paths_count: 1
      observed_paths_omitted: 0
      observed_paths_sample: src/a.go
  - id: unseen_handle_ordinal
    vars:
      profile: coordinator
      tool: surface_note
      offender_count: 1
      offenders_omitted: 0
      offenders_sample: command#12
      observed_paths_count: 2
      observed_paths_omitted: 0
      observed_paths_sample: ntp.go, main.go
