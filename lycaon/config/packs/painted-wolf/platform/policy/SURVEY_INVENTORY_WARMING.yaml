spec_version: "1.0"
id: SURVEY_INVENTORY_WARMING
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - grep
      - find
      - wc
requires_facts: [paintedwolf.operation, paintedwolf.rejection_code, paintedwolf.timeout_ms]
when: paintedwolf.rejection_code == "SURVEY_INVENTORY_WARMING"
effect: block
category: recoverable
emit: guard:grep
message: Source catalog is still warming
what: 'The source catalog has no complete generation yet; the wait for one ended at {{ paintedwolf.timeout_ms }}ms.'
cause: Discovery of the project tree has not covered it, so the tool has no file list to read.
why: Warming is not an empty result. Nothing here says the tree holds no matches.
fix: "Scope path to a directory you already know, or retry after other work while discovery continues. Do not conclude the pattern or file is absent."
instead: Branch on Code; retry later or narrow the path
scenarios:
  - id: default
    vars:
      profile: coordinator
      tool: find
      timeout_ms: 2000
