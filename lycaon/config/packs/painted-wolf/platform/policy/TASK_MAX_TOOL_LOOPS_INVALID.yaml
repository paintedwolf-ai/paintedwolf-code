spec_version: "1.0"
id: TASK_MAX_TOOL_LOOPS_INVALID
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.host_max, paintedwolf.max_tool_loops, paintedwolf.min_required, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "TASK_MAX_TOOL_LOOPS_INVALID"
effect: block
category: recoverable
emit: guard:task
message: '`task()` max_tool_loops {{ paintedwolf.max_tool_loops }} is out of range (maximum {{ paintedwolf.host_max }}, minimum {{ paintedwolf.min_required }})'
what: Requested max_tool_loops {{ paintedwolf.max_tool_loops }} falls outside the current host range {{ paintedwolf.min_required }}–{{ paintedwolf.host_max }}.
cause: You sent max_tool_loops {{ paintedwolf.max_tool_loops }} outside **[{{ paintedwolf.min_required }}, {{ paintedwolf.host_max }}]**.
why: An explicit worker budget must remain the requested budget; the host does not silently clamp it.
fix: Omit `max_tool_loops` to use the task scope default, or set a value between **{{ paintedwolf.min_required }}** and **{{ paintedwolf.host_max }}**.
instead: Branch on Code; set max_tool_loops within host bounds or omit it
scenarios:
  - id: below_min
    vars:
      host_max: 40
      max_tool_loops: 1
      min_required: 2
  - id: above_host_cap
    vars:
      host_max: 40
      max_tool_loops: 41
      min_required: 2
