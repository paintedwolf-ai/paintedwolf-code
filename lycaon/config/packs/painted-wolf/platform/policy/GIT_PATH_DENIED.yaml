spec_version: "1.0"
id: GIT_PATH_DENIED
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "GIT_PATH_DENIED"
effect: block
category: recoverable
emit: guard:tool
message: git path denied for {{ tool }}
what: '{{ tool }} refused path {{ paintedwolf.path }} outside the allowed git scope.'
cause: Git tools only operate on sandbox-relative paths inside the project.
why: Structured rejects let agents branch without parsing free-form errors.
fix: Use the intended path only within the active repository and its permitted read/write scope. Do not choose another Git operation to bypass the same path boundary.
instead: Branch on Code; fix args and retry once
scenarios:
  - id: default
    vars:
      path: src/main.go
      session_role: coordinator
      tool: git_diff
