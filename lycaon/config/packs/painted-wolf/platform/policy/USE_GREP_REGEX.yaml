oar: '1.0'
id: USE_GREP_REGEX
kind: policy
anchor: tool.rejected
selector:
  tool:
  - command
  - verify
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.args_hint
  - paintedwolf.command
  - paintedwolf.example
  - paintedwolf.habit_redirect_match
when: paintedwolf.rejection_code == "USE_GREP_REGEX"
effect: block
copy:
  what: The parsed command can be represented by the supplied grep call.
  cause: The host parsed the supported command shape and validated the replacement against the tool currently
    offered.
  why: The supplied flags preserve the intended match mode. Regex mode uses RE2; literal and structural modes
    are distinct and must not be substituted silently.
  fix: Use the supplied replacement_calls entries exactly and in order. Account for each result before continuing;
    native limits and partial-result receipts still apply.
  instead: Use the validated grep replacement and preserve the intended operation
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_habit_redirect
x-paintedwolf-message: Use native grep instead of command rg/grep
x-paintedwolf-scenarios:
- id: default
  vars:
    detail: bad args
    path: src/main.go
    profile: coordinator
    tool: command
  expect_contains:
  - 'Rejected:'
  - 'Code: USE_GREP_REGEX'
