spec_version: "1.0"
id: DELETE_NOT_EMPTY
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - delete
requires_facts: [paintedwolf.entries, paintedwolf.operation, paintedwolf.path, paintedwolf.rejection_code, paintedwolf.selector_empty]
when: paintedwolf.rejection_code == "DELETE_NOT_EMPTY"
effect: block
category: recoverable
emit: guard:delete
message: delete rejected non-empty directory
what: delete rejected non-empty directory {{ paintedwolf.path }} ({{ paintedwolf.entries }} entries).
cause: delete removes files and empty directories; this target still contains entries.
why: Deleting those entries is additional destructive work that the directory request alone does not authorize.
fix: Inspect the contents. Delete children first only if their removal is part of the intended task, then remove the empty directory. Otherwise leave it and report what remains. Preserve any earlier completed deletions.
instead: Confirm child-deletion intent before making the directory empty
scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      session_role: coordinator
      tool: delete
