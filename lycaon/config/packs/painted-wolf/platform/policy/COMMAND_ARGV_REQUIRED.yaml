spec_version: "1.0"
id: COMMAND_ARGV_REQUIRED
kind: policy
on: tool.rejected
selector:
  tools:
    - command
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "COMMAND_ARGV_REQUIRED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_composition_redirect
message: command() needs explicit command text
what: '`{{ tool }}` requires explicit `command` text.'
cause: This invocation supplied no command text.
why: ''
fix: Supply the intended program or executable in `command`.
instead: ''
x-paintedwolf-scenarios:
  - id: default
    vars:
      tool: command
