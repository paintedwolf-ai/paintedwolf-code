oar: '1.0'
id: COMMAND_ARGV_REQUIRED
kind: policy
anchor: tool.rejected
selector:
  tool:
    - command
requires:
  facts: [paintedwolf.rejection_code]
  profiles:
    - tool
when: paintedwolf.rejection_code == "COMMAND_ARGV_REQUIRED"
effect: block
copy:
  what: '`command` was called without program text.'
  cause: The host does not remember an earlier program; an empty call is not a retry.
  why: Every call carries the whole program it runs.
  fix: 'Pass the program text in `command`.'
  instead: 'Retry with the program text in `command`'
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_composition_redirect
x-paintedwolf-message: command needs program text
x-paintedwolf-scenarios:
  - id: default
    vars:
      tool: command
    expect_contains:
      - 'Rejected:'
      - 'Code: COMMAND_ARGV_REQUIRED'
      - without program text
