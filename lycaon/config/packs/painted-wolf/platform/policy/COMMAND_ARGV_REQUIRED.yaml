oar: '1.0'
id: COMMAND_ARGV_REQUIRED
kind: policy
anchor: tool.rejected
selector:
  tool:
    - command
requires:
  facts: [paintedwolf.rejection_code]
  profiles:
    - tool
when: paintedwolf.rejection_code == "COMMAND_ARGV_REQUIRED"
effect: block
copy:
  what: '`command()` was called without explicit `command` text.'
  cause: The host does not remember the previous command. Omitting its text is not a retry.
  why: Every invocation must carry the program or captured argv line to run.
  fix: 'Supply the executable or program text in `command` on this call.'
  instead: 'Retry `command()` with explicit `command` text'
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_composition_redirect
x-paintedwolf-message: command() needs explicit command text
x-paintedwolf-scenarios:
  - id: default
    vars:
      tool: command
    expect_contains:
      - 'Rejected:'
      - 'Code: COMMAND_ARGV_REQUIRED'
      - without explicit `command` text
