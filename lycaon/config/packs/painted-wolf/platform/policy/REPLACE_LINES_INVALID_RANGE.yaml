oar: '1.0'
id: REPLACE_LINES_INVALID_RANGE
kind: schema
anchor: tool.rejected
selector:
  paintedwolf.operation:
  - replace_lines
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.operation
  - paintedwolf.rejection_code
  - paintedwolf.end_line
  - paintedwolf.path
  - paintedwolf.start_line
  - paintedwolf.rejection_reason
  - paintedwolf.native_operation
when: paintedwolf.rejection_code == "REPLACE_LINES_INVALID_RANGE"
effect: block
copy:
  what: The line-range replacement on {{ paintedwolf.path }} rejected range {{ paintedwolf.start_line }}–{{ paintedwolf.end_line
    }} — {{ paintedwolf.rejection_reason }}.
  cause: start_line and end_line are 1-based inclusive; end_line must be >= start_line.
  why: Line-range edits need a valid window before splicing file content.
  fix: '{% if paintedwolf.native_operation %}Re-read the intended span with `sed -n ''A,Bp''` or `cat -n` inside
    command, then pass --start and --end from that line range.{% else %}Re-read the intended span, then pass
    start_line and end_line from that block''s line range.{% endif %}'
  instead: Branch on Code; fix the line range and retry with a valid 1-based range
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:replace_lines
x-paintedwolf-message: replace_lines line range is invalid
x-paintedwolf-scenarios:
- id: default
  vars:
    end_line: 10
    path: internal/foo.go
    profile: implement
    reason: end_line must be >= start_line
    start_line: 20
    tool: replace_lines
- id: command-leg
  vars:
    end_line: 10
    native_operation: replace_lines
    path: internal/foo.go
    profile: implement
    reason: end_line must be >= start_line
    start_line: 20
    tool: command
  expect_contains:
  - '--start'
