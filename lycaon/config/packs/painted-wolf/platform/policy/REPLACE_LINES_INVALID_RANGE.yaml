spec_version: "1.0"
id: REPLACE_LINES_INVALID_RANGE
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - replace_lines
requires_facts: [paintedwolf.end_line, paintedwolf.native_operation, paintedwolf.operation, paintedwolf.path, paintedwolf.rejection_code, paintedwolf.rejection_reason, paintedwolf.start_line]
when: paintedwolf.rejection_code == "REPLACE_LINES_INVALID_RANGE"
effect: block
category: recoverable
emit: guard:replace_lines
message: replace_lines line range is invalid
what: The line-range replacement on {{ paintedwolf.path }} rejected range {{ paintedwolf.start_line }}–{{ paintedwolf.end_line }} — {{ paintedwolf.rejection_reason }}.
cause: start_line and end_line are 1-based inclusive; end_line must be >= start_line.
why: Line-range edits need a valid window before splicing file content.
fix: '{% if paintedwolf.native_operation %}Re-read the intended span with `sed -n ''A,Bp''` or `cat -n` inside command, then pass --start and --end from that line range.{% else %}Re-read the intended span, then pass start_line and end_line from that block''s line range.{% endif %}'
instead: Branch on Code; fix the line range and retry with a valid 1-based range
scenarios:
  - id: default
    vars:
      end_line: 10
      path: internal/foo.go
      session_role: implement
      reason: end_line must be >= start_line
      start_line: 20
      tool: replace_lines
  - id: command-leg
    vars:
      end_line: 10
      native_operation: replace_lines
      path: internal/foo.go
      session_role: implement
      reason: end_line must be >= start_line
      start_line: 20
      tool: command
    expect_contains:
      - '--start'
