spec_version: "1.0"
id: SUBMIT_VERDICT_REVIEW_REQUIRED
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SUBMIT_VERDICT_REVIEW_REQUIRED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:workflow
message: Required review work is outstanding.
what: Required review evidence is unavailable for these inputs.
cause: A declared review assignment needs a completed applicable result.
why: Editing the verdict cannot supply another worker's assessment.
fix: Follow the returned action and exact work_ids. For dispatch_work, dispatch the named assignment; for wait_for_work, wait for the workers already running.
instead: Reconcile the resulting evidence before resubmitting the verdict.
x-paintedwolf-scenarios:
  - id: required
    vars: {}
