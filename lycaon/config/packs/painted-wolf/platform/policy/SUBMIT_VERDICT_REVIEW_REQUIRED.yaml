oar: '1.0'
id: SUBMIT_VERDICT_REVIEW_REQUIRED
kind: policy
anchor: tool.rejected
requires:
  facts: [paintedwolf.rejection_code]
  profiles: [tool]
when: paintedwolf.rejection_code == "SUBMIT_VERDICT_REVIEW_REQUIRED"
effect: block
copy:
  what: Required review evidence is unavailable for these inputs.
  cause: A declared review assignment needs a completed applicable result.
  why: Editing the verdict cannot supply another worker's assessment.
  fix: Follow the returned action and exact work_ids or job_ids. For dispatch_work, dispatch the named assignment; for wait_for_work, wait for the active jobs.
  instead: Reconcile the resulting evidence before resubmitting the verdict.
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:workflow
x-paintedwolf-message: Required review work is outstanding.
x-paintedwolf-scenarios:
- id: required
  vars: {}
  expect_contains: ['Code: SUBMIT_VERDICT_REVIEW_REQUIRED', 'work_ids']
