spec_version: "1.0"
id: CHOWN_NOT_FOUND
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - chown
requires_facts: [paintedwolf.operation, paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "CHOWN_NOT_FOUND"
effect: block
category: recoverable
emit: guard:chown
message: chown:chown path does not exist
what: The target for chown path {{ paintedwolf.path }} does not exist.
cause: The requested path or its resolved target is absent.
why: Ownership changes require an existing target.
fix: Confirm the intended path with an offered discovery tool, or remove an unintended missing path. Do not create files solely to make the ownership operation succeed.
instead: Branch on Code CHOWN_NOT_FOUND; resolve the intended existing path
scenarios:
  - id: default
    vars:
      detail: bad args
      path: scripts/run.sh
      session_role: implement
      tool: chown
