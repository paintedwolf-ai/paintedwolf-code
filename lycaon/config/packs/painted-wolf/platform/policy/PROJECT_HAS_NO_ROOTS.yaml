spec_version: "1.0"
id: PROJECT_HAS_NO_ROOTS
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.receiving_tool_summarize, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "PROJECT_HAS_NO_ROOTS"
effect: block
category: recoverable
emit: rule:no_folder
message: project has no folder attached
what: File and shell tools need a folder on this project — none is attached yet.
cause: The project was created chat-first or the last folder was removed.
why: Tools must not invent a workspace path when no folder is bound.
fix: Ask the user to attach a folder (Folders button). File tools become available on the next turn after attach. {% if paintedwolf.receiving_tool_summarize %}For nonprotected text you already have, pass `content` and omit `path` and `paths` on this tool.{% endif %}
instead: Chat, web research, and plan-read tools remain available until a folder is attached
scenarios:
  - id: default
    vars:
      tool: read
