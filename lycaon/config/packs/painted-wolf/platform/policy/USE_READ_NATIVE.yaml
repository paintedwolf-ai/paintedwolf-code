oar: '1.0'
id: USE_READ_NATIVE
kind: policy
anchor: tool.rejected
selector:
  tool:
  - command
  - verify
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.tool_loadable
  - paintedwolf.can_request_tools
  - paintedwolf.native_replacement_tools
when: paintedwolf.rejection_code == "USE_READ_NATIVE"
effect: block
copy:
  what: 'The parsed command has a validated native representation.'
  cause: '{% if paintedwolf.tool_loadable %}{% if paintedwolf.can_request_tools %}Required native schemas are not offered on this call; the compiled tool plan permits loading them{% else %}No validated loading route is available from this call; use an appropriate offered capability or report the missing recovery context.{% endif %}{% else %}The host validated the complete replacement against registered, permitted tools offered on this call{% endif %}.'
  why: Native read returns numbered lines, truncation state and symbol anchors. Follow its actual coverage
    and paging fields; an outline is an index, not the complete file.
  fix: '{% if paintedwolf.tool_loadable %}{% if paintedwolf.can_request_tools %}For each of these exact tool names: {{ paintedwolf.native_replacement_tools }}, call `request_tools` separately with `need` containing only that name. Its schemas arrive on the next model call; then perform the original operation using those native schemas. Loading grants no additional permissions.{% else %}No validated loading route is available from this call; use an appropriate offered capability or report the missing recovery context.{% endif %}{% else %}If `replacement_calls` are present, use every entry exactly and in order. If details were omitted, reconstruct the original operation using the offered native schemas; do not execute a partial recipe. Account for each result before continuing.{% endif %}'
  instead: '{% if paintedwolf.tool_loadable %}{% if paintedwolf.can_request_tools %}Load `{{ paintedwolf.native_replacement_tools }}` before performing the native operation{% else %}No validated loading route is available from this call; use an appropriate offered capability or report the missing recovery context.{% endif %}{% else %}Use the complete replacement when present, or reconstruct the operation using the current native schemas{% endif %}'
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_habit_redirect
x-paintedwolf-message: Use native read instead of command cat/head/sed -n
x-paintedwolf-scenarios:
- id: default
  vars:
    command: sed -n '1,200p' docs/den.md
    program: sed
    path: docs/den.md
    example: read path="docs/den.md" offset=1 limit=200
    args_hint: Pass path with 1-based offset + limit, or ranges[] for up to 8 spans in one call; mode outline
      for a symbol index instead of lines.
    profile: coordinator
    tool: command
  expect_contains:
  - 'Rejected:'
  - 'Code: USE_READ_NATIVE'
