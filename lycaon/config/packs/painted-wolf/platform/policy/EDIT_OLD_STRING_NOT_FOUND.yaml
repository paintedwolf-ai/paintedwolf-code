oar: '1.0'
id: EDIT_OLD_STRING_NOT_FOUND
kind: schema
anchor: tool.rejected
selector:
  tool:
  - edit
requires:
  profiles:
  - filesystem
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.old_string_chars
  - paintedwolf.path
  - paintedwolf.total_lines
  - paintedwolf.replacement_matches
  - paintedwolf.replacement_line
when: paintedwolf.rejection_code == "EDIT_OLD_STRING_NOT_FOUND"
effect: block
copy:
  what: edit on {{ paintedwolf.path }} could not find old_string ({{ paintedwolf.old_string_chars }} chars)
    in the current file ({{ paintedwolf.total_lines }} lines).
  cause: old_string must match the file text exactly. Stale content, copied line-number prefixes, or literal
    backslash-escape text can cause misses; valid JSON Unicode escapes are decoded before matching.
  why: The replacement must match exact source bytes.
  fix: >-
    {% if paintedwolf.replacement_matches %}The requested nonempty new_string already occurs
    {{ paintedwolf.replacement_matches }} time(s) in the edit basis, first at line
    {{ paintedwolf.replacement_line }}. This call made no change; this observation does not prove an earlier
    edit succeeded. Read {{ paintedwolf.path }} to check whether the intended change is already satisfied
    before attempting another mutation.{% else %}Read {{ paintedwolf.path }} again; use read_hint when present.
    Check whether the intended change is still needed. If it is, copy a fresh verbatim substring into old_string,
    without displayed line labels and preserving indentation.{% endif %}
  instead: Inspect source_history when attribution is needed. Do not repeat the same edit or replace the whole
    file merely to bypass a missing match.

x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:edit
x-paintedwolf-message: edit old_string not found in file
x-paintedwolf-scenarios:
- id: default
  vars:
    old_string_chars: 42
    path: internal/foo.go
    profile: implement
    tool: edit
    total_lines: 120
  expect_contains:
  - 'Rejected:'
  - 'Code: EDIT_OLD_STRING_NOT_FOUND'

- id: replacement_present
  vars:
    change_count: 2
    old_string_chars: 42
    path: internal/foo.go
    profile: implement
    tool: edit
    total_lines: 120
    replacement_matches: 1
    replacement_line: 7
  expect_contains:
  - 'already occurs'
  - 'This call made no change'
  - 'does not prove an earlier'
