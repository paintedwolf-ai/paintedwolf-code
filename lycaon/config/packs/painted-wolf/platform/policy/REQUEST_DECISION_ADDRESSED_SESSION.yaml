oar: '1.0'
id: REQUEST_DECISION_ADDRESSED_SESSION
kind: schema
anchor: tool.rejected
selector:
  tool:
    - request_decision
requires:
  facts: [paintedwolf.rejection_code]
  profiles:
    - tool
when: paintedwolf.rejection_code == "REQUEST_DECISION_ADDRESSED_SESSION"
effect: block
copy:
  what: There is no coordinator above this session to answer a decision request.
  cause: request_decision ran in a session the user addressed directly, not in a spawned leg.
  why: The request parks a worker job and wakes the coordinator that dispatched it.
  fix: Ask the user with ask_user when it is on your surface, or state the options in your answer.
  instead: Branch on Code REQUEST_DECISION_ADDRESSED_SESSION; ask the user directly, do not retry here
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:request_decision
x-paintedwolf-message: There is no coordinator above this session to answer a decision request.
x-paintedwolf-scenarios:
  - id: default
    vars:
      profile: explore
      tool: request_decision
    expect_contains:
      - 'Rejected:'
      - 'Code: REQUEST_DECISION_ADDRESSED_SESSION'
      - no coordinator above this session
