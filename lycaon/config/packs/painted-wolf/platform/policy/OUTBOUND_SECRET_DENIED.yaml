oar: '1.0'
id: OUTBOUND_SECRET_DENIED
kind: schema
anchor: tool.rejected
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.host
  - paintedwolf.rule_id
  - paintedwolf.shape
  - paintedwolf.surface
  - paintedwolf.user_guidance
when: paintedwolf.rejection_code == "OUTBOUND_SECRET_DENIED"
effect: block
copy:
  what: A value matching a secret pattern ({{ paintedwolf.rule_id }}) was detected in outbound {{ paintedwolf.surface
    }} toward {{ paintedwolf.host }} ({{ paintedwolf.shape }}), so the host did not send it.
  cause: The secret screen did not authorize this outbound payload. This result alone does not establish whether
    a new approval card was shown.
  why: The protected payload was withheld. A chat response or request_decision cannot grant secret-release
    authority.
  fix: '{% if paintedwolf.user_guidance %}Follow the user''s direction within the protected send boundary:
    {{ paintedwolf.user_guidance }}{% else %}Remove the secret only if a redacted request still satisfies the
    intended task. Sending the protected value requires authorization through the host secret-release flow.{%
    endif %}'
  instead: Preserve the withheld value; use an authorized redacted request or report the blocked send
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:outbound_secret
x-paintedwolf-message: a detected secret was not sent outbound
x-paintedwolf-scenarios:
- id: web_search_denied
  vars:
    surface: web_search
    rule_id: gitleaks:aws-access-token
    host: brave
    shape: a1b2c3a1b2c3a1b2c3a1 (20 characters)
    tool: web_search
  expect_contains:
  - 'Code: OUTBOUND_SECRET_DENIED'
  - web_search
- id: fetch_url_denied
  vars:
    surface: fetch_url
    rule_id: gitleaks:aws-access-token
    host: example.com
    shape: a1b2c3a1b2c3a1b2c3a1 (20 characters)
    tool: fetch_url
  expect_contains:
  - 'Code: OUTBOUND_SECRET_DENIED'
  - fetch_url
- id: mcp_denied
  vars:
    surface: mcp
    rule_id: gitleaks:openai-api-key
    host: fixture
    shape: abc-a1b2c3a1b2c3a1b2c3a1b2c3a1b2c3a1b2c3… (51 characters)
    tool: fetch_url
  expect_contains:
  - 'Code: OUTBOUND_SECRET_DENIED'
  - mcp
- id: fetch_url_denied_with_guidance
  vars:
    surface: fetch_url
    rule_id: gitleaks:aws-access-token
    host: example.com
    shape: a1b2c3a1b2c3a1b2c3a1 (20 characters)
    tool: fetch_url
    user_guidance: Remove the credential and use the public endpoint.
  expect_contains:
  - 'Code: OUTBOUND_SECRET_DENIED'
  - Follow the user
  - public endpoint
