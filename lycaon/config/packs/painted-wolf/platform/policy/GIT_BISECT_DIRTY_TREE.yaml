spec_version: "1.0"
id: GIT_BISECT_DIRTY_TREE
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "GIT_BISECT_DIRTY_TREE"
effect: block
category: recoverable
emit: guard:git_bisect_dirty_tree
message: Git bisect needs a clean working tree
what: git bisect start needs a working tree without tracked changes.
cause: 'Tracked changes are present{% if paintedwolf.path %}, starting with {{ paintedwolf.path }}{% endif %}.'
why: Each bisect step checks out another commit, which would mix those changes into every test.
fix: Run the bisect in a separate worktree, for example `git worktree add @scratch/bisect HEAD`, then `cd @scratch/bisect` and start the bisect there.
instead: Leave the current changes in place; commit or stash them only if that is part of the task.
scenarios:
  - id: dirty
    vars:
      tool: command
      profile: coordinator
      path: src/main.go
