oar: '1.0'
id: GREP_DEADLINE_EXCEEDED
kind: schema
anchor: tool.rejected
selector:
  tool:
    - grep
requires:
  profiles:
    - tool
  facts:
    - paintedwolf.rejection_code
    - paintedwolf.timeout_ms
    - paintedwolf.files_searched
    - paintedwolf.largest_subtree
when: paintedwolf.rejection_code == "GREP_DEADLINE_EXCEEDED"
effect: block
copy:
  what: 'Search exceeded its {{ paintedwolf.timeout_ms }}ms execution budget after {{ paintedwolf.files_searched }} files; coverage is incomplete.'
  cause: '{% if paintedwolf.largest_subtree %}Most of the budget went to {{ paintedwolf.largest_subtree }}.{% else %}The selected content could not be searched within the execution budget.{% endif %}'
  why: Search execution is bounded to keep the host responsive; this is not evidence of absence.
  fix: "Partition the same scope by path or path_glob and search each partition{% if paintedwolf.largest_subtree %}, starting with the subtree that consumed the budget{% endif %}. Pass include_ignored=false only when the task does not need ignored files."
  instead: Branch on Code; partition the search scope and retry
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:grep
x-paintedwolf-message: Search exceeded its execution budget
x-paintedwolf-scenarios:
  - id: default
    vars:
      profile: coordinator
      tool: grep
      timeout_ms: 60000
      files_searched: 18240
      largest_subtree: 'node_modules (16011 files)'
    expect_contains:
      - 'Rejected:'
      - 'Code: GREP_DEADLINE_EXCEEDED'
      - 'after 18240 files'
      - 'Most of the budget went to node_modules (16011 files)'
