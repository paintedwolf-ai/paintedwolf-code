spec_version: "1.0"
id: SOURCE_HISTORY_MODE_INVALID
kind: schema
on: tool.rejected
selector:
  tools:
    - source_history
requires_facts: [paintedwolf.mode, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SOURCE_HISTORY_MODE_INVALID"
effect: block
category: recoverable
emit: guard:source_history
message: source_history mode must be effects, lines, mine, version, diff, or overview
what: source_history does not know mode {{ paintedwolf.mode }}.
cause: mode selects the question — effects (what changed this file), lines (who wrote these lines), mine (what did this session author), version (read historical content), diff (compare versions), or overview (what changed this session).
why: A structured reject names the closed mode set instead of guessing the caller's intent.
fix: Retry with mode effects, lines, mine, version, diff, or overview. Omitting mode defaults to effects with a path, overview without one.
instead: Branch on Code; pick one of the six modes
scenarios:
  - id: default
    vars:
      mode: blame
      profile: implement
      tool: source_history
