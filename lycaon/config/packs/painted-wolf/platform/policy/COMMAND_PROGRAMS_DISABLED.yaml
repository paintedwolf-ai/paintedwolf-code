spec_version: "1.0"
id: COMMAND_PROGRAMS_DISABLED
kind: schema
on: tool.rejected
selector:
  tools:
    - command
    - verify
requires_facts: [paintedwolf.can_command_output, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "COMMAND_PROGRAMS_DISABLED"
effect: block
x-paintedwolf-category: blocked
x-paintedwolf-emit: guard:tool
message: command programs are turned off on this host
what: Command programs are turned off on this host, so this program did not start.
cause: This host currently admits no new command programs.
why: ''
fix: ''
instead: ''
x-paintedwolf-scenarios:
  - id: default
    vars:
      tool: command
