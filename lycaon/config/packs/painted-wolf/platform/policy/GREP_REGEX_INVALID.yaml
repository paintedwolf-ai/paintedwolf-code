oar: '1.0'
id: GREP_REGEX_INVALID
kind: schema
anchor: tool.rejected
selector:
  tool:
    - grep
requires:
  profiles:
    - tool
  facts:
    - paintedwolf.rejection_code
    - paintedwolf.detail
when: paintedwolf.rejection_code == "GREP_REGEX_INVALID"
effect: block
copy:
  what: 'grep received an invalid regex pattern: {{ paintedwolf.detail }}.'
  cause: Use RE2 syntax (Go regexp). For literal dots or brackets, escape them or set regex false for substring search.
  why: Use RE2 syntax (Go regexp). For literal dots or brackets, escape them or set regex false for substring search.
  fix: Fix the pattern and retry grep with regex true, or use regex false for a plain substring search.
  instead: Branch on Code; fix pattern or disable regex
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:grep
x-paintedwolf-message: grep regex pattern is invalid
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      profile: coordinator
      tool: grep
    expect_contains:
      - 'Rejected:'
      - 'Code: GREP_REGEX_INVALID'
