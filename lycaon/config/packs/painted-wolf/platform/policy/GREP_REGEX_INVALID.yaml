spec_version: "1.0"
id: GREP_REGEX_INVALID
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.command_grep_reachable, paintedwolf.detail, paintedwolf.native_operation, paintedwolf.operation, paintedwolf.rejection_code]
when: paintedwolf.operation == "grep" && paintedwolf.rejection_code == "GREP_REGEX_INVALID"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:grep
message: grep regex pattern is invalid
what: 'grep received an invalid regex pattern: {{ paintedwolf.detail }}.'
cause: Use RE2 syntax (Go regexp). For literal dots or brackets, escape them{% if paintedwolf.native_operation %}, or pass -F for a literal substring search{% else %}, or set regex false for substring search{% endif %}.
why: An unmatched metacharacter makes the whole pattern unparseable, so no search can run until the pattern is repaired.
fix: '{% if paintedwolf.native_operation %}{% if paintedwolf.command_grep_reachable %}Fix the pattern and retry grep in command; pass -F for a plain substring search.{% else %}Fix the RE2 pattern or pass -F for a plain substring search; that grep form is not offered on this request.{% endif %}{% else %}Fix the RE2 pattern with regex true, or set regex false for a plain substring search.{% endif %}'
instead: Branch on Code; fix pattern or search literally
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      profile: coordinator
      tool: grep
  - id: command-leg
    vars:
      command_grep_reachable: true
      detail: bad args
      native_operation: grep
      path: src/main.go
      profile: coordinator
      tool: command
    expect_contains:
      - '-F'
