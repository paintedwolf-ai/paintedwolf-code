oar: '1.0'
id: COMMAND_LIMIT_EXCEEDED
kind: policy
anchor: tool.rejected
selector:
  tool:
  - command
  - verify
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.resource_unit
  - paintedwolf.limit_id
  - paintedwolf.maximum
  - paintedwolf.observed
when: paintedwolf.rejection_code == "COMMAND_LIMIT_EXCEEDED"
effect: block
copy:
  what: 'This command reached its {{ paintedwolf.limit_id }} limit ({{ paintedwolf.observed }} {{ paintedwolf.resource_unit }}; maximum {{ paintedwolf.maximum }}).'
  cause: 'The command stopped at this statement. Earlier completed steps and their results remain recorded.'
  why: 'Memory limit counts include the proposed allocation and held storage. These counts describe admission capacity rather than measured RAM usage.'
  fix: 'Check completed steps. For remaining work, use smaller input batches, a streaming query, fewer concurrent children or a shorter program. Reduce retained output when its quota is full.'
  instead: 'Check the recorded results before retrying the remaining work.'
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_composition_redirect
x-paintedwolf-message: command reached a resource limit
x-paintedwolf-scenarios:
- id: captured_unit
  vars:
    tool: command
    limit_id: ast_nodes
    resource_unit: nodes
    maximum: 8192
    observed: 8193
  expect_contains:
  - 'Code: COMMAND_LIMIT_EXCEEDED'
  - ast_nodes
  - Check the recorded results

- id: retained_memory
  vars:
    tool: command
    limit_id: program_state_bytes
    resource_unit: bytes
    maximum: 67108864
    observed: 117433808
  expect_contains:
  - smaller input batches
  - proposed allocation
- id: query_value
  vars:
    tool: command
    limit_id: query_value_bytes
    resource_unit: bytes
    maximum: 20971520
    observed: 20971521
  expect_contains:
  - streaming query
