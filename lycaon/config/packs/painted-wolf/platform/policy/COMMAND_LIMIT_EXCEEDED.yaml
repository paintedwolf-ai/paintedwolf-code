oar: '1.0'
id: COMMAND_LIMIT_EXCEEDED
kind: policy
anchor: tool.rejected
selector:
  tool:
  - command
  - verify
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.resource_unit
  - paintedwolf.limit_id
  - paintedwolf.maximum
  - paintedwolf.observed
when: paintedwolf.rejection_code == "COMMAND_LIMIT_EXCEEDED"
effect: block
copy:
  what: 'command: {{ paintedwolf.limit_id }} limit exceeded ({{ paintedwolf.observed }} > {{ paintedwolf.maximum }} {{ paintedwolf.resource_unit }}).'
  cause: 'The program reached a host limit. Earlier completed changes remain in effect.'
  why: 'The limit does not undo work that already finished.'
  fix: 'Use smaller inputs or reduce buffered work. Check earlier changes before retrying.'
  instead: 'Check the result before retrying commands that change files.'
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_composition_redirect
x-paintedwolf-message: command reached a resource limit
x-paintedwolf-scenarios:
- id: captured_unit
  vars:
    tool: command
    limit_id: ast_nodes
    resource_unit: nodes
    maximum: 8192
    observed: 8193
  expect_contains:
  - 'Code: COMMAND_LIMIT_EXCEEDED'
  - ast_nodes
