spec_version: "1.0"
id: COMMAND_LIMIT_EXCEEDED
kind: policy
on: tool.rejected
selector:
  tools:
    - command
    - verify
requires_facts: [paintedwolf.children_started, paintedwolf.children_started_known, paintedwolf.deadline_expired, paintedwolf.diagnostic_top_level, paintedwolf.limit_id, paintedwolf.limit_observation_known, paintedwolf.maximum, paintedwolf.next_steps, paintedwolf.observed, paintedwolf.rejection_code, paintedwolf.resource_unit, paintedwolf.wait_refused, paintedwolf.waiting_statement]
when: paintedwolf.rejection_code == "COMMAND_LIMIT_EXCEEDED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_composition_redirect
message: command reached a resource limit
what: '{% if paintedwolf.deadline_expired %}The program reached its {{ paintedwolf.limit_id }} of {{ paintedwolf.maximum }} ms and was ended after {{ paintedwolf.observed }} ms{% if paintedwolf.waiting_statement %}, while waiting in `{{ paintedwolf.waiting_statement }}`{% endif %}.{% if paintedwolf.children_started_known %}{% if paintedwolf.children_started %} Commands started before the end: {{ paintedwolf.children_started }}.{% else %} No command had started.{% endif %}{% endif %}{% else %}{% if paintedwolf.wait_refused %}`{{ paintedwolf.waiting_statement }}` would end {{ paintedwolf.observed }} ms after the program started, past its {{ paintedwolf.limit_id }} of {{ paintedwolf.maximum }} ms, so it was refused before waiting.{% else %}A command resource limit was reached{% if paintedwolf.limit_id %}: {{ paintedwolf.limit_id }}{% endif %}.{% if paintedwolf.limit_observation_known %} Observed {{ paintedwolf.observed }}{% if paintedwolf.resource_unit %} {{ paintedwolf.resource_unit }}{% endif %}; maximum {{ paintedwolf.maximum }}.{% endif %}{% endif %}{% endif %}'
cause: '{% if paintedwolf.diagnostic_top_level %}The submitted source was refused before evaluation.{% else %}{% if paintedwolf.deadline_expired %}The host ended the program at its lifetime; statements after that point did not run, and the status is 124.{% else %}The command stopped at the recorded boundary.{% endif %}{% endif %}'
fix: '{% if paintedwolf.diagnostic_top_level %}Reduce the size or complexity of the submitted shell source before resubmitting it.{% endif %}{% if paintedwolf.deadline_expired %}Split the work so each program ends within its lifetime. {{ paintedwolf.next_steps }}{% endif %}{% if paintedwolf.wait_refused %}Wait for less than the program lifetime; a later call can wait again. {{ paintedwolf.next_steps }}{% endif %}'
instead: ''
x-paintedwolf-scenarios:
  - id: captured_unit
    vars:
      tool: command
      limit_id: ast_nodes
      resource_unit: nodes
      maximum: 8192
      observed: 8193
  - id: top_level_source
    vars:
      tool: command
      limit_id: source_bytes
      resource_unit: bytes
      maximum: 65536
      observed: 65537
      diagnostic_top_level: true
  - id: lifetime_expired_waiting
    vars:
      tool: command
      limit_id: program_lifetime_ms
      resource_unit: milliseconds
      maximum: 3600000
      observed: 3600000
      deadline_expired: true
      waiting_statement: wait %1
      children_started: 2
  - id: lifetime_expired_before_launch
    vars:
      tool: verify
      limit_id: program_lifetime_ms
      resource_unit: milliseconds
      maximum: 3600000
      observed: 3600000
      deadline_expired: true
      children_started: 0
  - id: wait_refused
    vars:
      tool: command
      limit_id: program_lifetime_ms
      resource_unit: milliseconds
      maximum: 3600000
      observed: 7200000
      wait_refused: true
      waiting_statement: sleep 7200
