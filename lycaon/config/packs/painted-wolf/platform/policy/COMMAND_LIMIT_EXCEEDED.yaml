oar: '1.0'
id: COMMAND_LIMIT_EXCEEDED
kind: policy
anchor: tool.rejected
selector:
  tool:
  - command
  - verify
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.resource_unit
  - paintedwolf.limit_id
  - paintedwolf.maximum
  - paintedwolf.observed
when: paintedwolf.rejection_code == "COMMAND_LIMIT_EXCEEDED"
effect: block
copy:
  what: 'This command reached its {{ paintedwolf.limit_id }} limit ({{ paintedwolf.observed }} {{ paintedwolf.resource_unit }}; maximum {{ paintedwolf.maximum }}).'
  cause: 'The command stopped at this statement. Earlier completed steps and their results remain recorded.'
  why: '{% if paintedwolf.limit_id == "program_state_bytes" or paintedwolf.limit_id == "evaluation_memory_bytes" %}The host refused a memory reservation. The observed bytes include the proposed allocation; they are not measured RAM usage.{% else %}The host cannot run another step once the limit is reached.{% endif %}'
  fix: '{% if paintedwolf.limit_id == "program_state_bytes" or paintedwolf.limit_id == "evaluation_memory_bytes" %}Check completed steps, then use smaller input batches or a streaming operation. Reduce concurrent children when they share this budget.{% elif paintedwolf.limit_id == "query_value_bytes" or paintedwolf.limit_id == "whole_file_bytes" or paintedwolf.limit_id == "record_bytes" %}Use a streaming query or process smaller records without collecting the complete input.{% elif paintedwolf.limit_id == "ast_nodes" or paintedwolf.limit_id == "program_bytes" or paintedwolf.limit_id == "source_bytes" %}Submit a shorter program for the remaining work.{% elif paintedwolf.limit_id == "spill_bytes" or paintedwolf.limit_id == "session_spill_bytes" %}Reduce the remaining result volume or free retained output capacity before continuing.{% else %}Check completed steps, then reduce the remaining input, output or work per operation.{% endif %}'
  instead: 'Check the recorded results before retrying the remaining work.'
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_composition_redirect
x-paintedwolf-message: command reached a resource limit
x-paintedwolf-scenarios:
- id: captured_unit
  vars:
    tool: command
    limit_id: ast_nodes
    resource_unit: nodes
    maximum: 8192
    observed: 8193
  expect_contains:
  - 'Code: COMMAND_LIMIT_EXCEEDED'
  - ast_nodes
  - Check the recorded results

- id: retained_memory
  vars:
    tool: command
    limit_id: program_state_bytes
    resource_unit: bytes
    maximum: 67108864
    observed: 117433808
  expect_contains:
  - smaller input batches
  - proposed allocation
- id: query_value
  vars:
    tool: command
    limit_id: query_value_bytes
    resource_unit: bytes
    maximum: 20971520
    observed: 20971521
  expect_contains:
  - streaming query
