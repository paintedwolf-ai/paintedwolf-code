spec_version: "1.0"
id: COMMAND_LIMIT_EXCEEDED
kind: policy
on: tool.rejected
selector:
  tools:
    - command
    - verify
requires_facts: [paintedwolf.diagnostic_top_level, paintedwolf.limit_id, paintedwolf.limit_observation_known, paintedwolf.maximum, paintedwolf.observed, paintedwolf.rejection_code, paintedwolf.resource_unit]
when: paintedwolf.rejection_code == "COMMAND_LIMIT_EXCEEDED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_composition_redirect
message: command reached a resource limit
what: 'A command resource limit was reached{% if paintedwolf.limit_id %}: {{ paintedwolf.limit_id }}{% endif %}.{% if paintedwolf.limit_observation_known %} Observed {{ paintedwolf.observed }}{% if paintedwolf.resource_unit %} {{ paintedwolf.resource_unit }}{% endif %}; maximum {{ paintedwolf.maximum }}.{% endif %}'
cause: '{% if paintedwolf.diagnostic_top_level %}The submitted source was refused before evaluation.{% else %}The command stopped at the recorded boundary.{% endif %}'
fix: '{% if paintedwolf.diagnostic_top_level %}Reduce the size or complexity of the submitted shell source before resubmitting it.{% endif %}'
instead: ''
x-paintedwolf-scenarios:
  - id: captured_unit
    vars:
      tool: command
      limit_id: ast_nodes
      resource_unit: nodes
      maximum: 8192
      observed: 8193
  - id: top_level_source
    vars:
      tool: command
      limit_id: source_bytes
      resource_unit: bytes
      maximum: 65536
      observed: 65537
      diagnostic_top_level: true
