spec_version: "1.0"
id: GIT_RESTORE_BULK_DENIED
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - git_restore
requires_facts: [paintedwolf.bulk_denied, paintedwolf.max_paths, paintedwolf.operation, paintedwolf.rejection_code, paintedwolf.requested]
when: paintedwolf.rejection_code == "GIT_RESTORE_BULK_DENIED"
effect: block
category: recoverable
emit: guard:tool
message: git_restore bulk path list denied
what: git_restore received {{ paintedwolf.requested }} paths; the current bound is {{ paintedwolf.max_paths }}.
cause: The explicit restore set exceeds the per-call path bound.
why: Restoring paths replaces work and must retain the reviewed target/source intent.
fix: Split only the authorized restore targets into batches of at most {{ paintedwolf.max_paths }}, retaining the intended restore source. Do not add paths or discard unrelated work.
instead: Branch on Code; fix args and retry once
scenarios:
  - id: default
    vars:
      path: src/main.go
      profile: coordinator
      tool: git_restore
