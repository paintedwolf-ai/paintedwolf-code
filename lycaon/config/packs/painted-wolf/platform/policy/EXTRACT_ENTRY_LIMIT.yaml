oar: '1.0'
id: EXTRACT_ENTRY_LIMIT
kind: schema
anchor: tool.rejected
selector:
  tool:
  - extract_archive
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.entries
  - paintedwolf.max_entries
  - paintedwolf.extraction_started
  - paintedwolf.dest
  - paintedwolf.extracted_entries
  - paintedwolf.extracted_bytes
  - paintedwolf.extracted_paths_sample
  - paintedwolf.extracted_paths_omitted
when: paintedwolf.rejection_code == "EXTRACT_ENTRY_LIMIT"
effect: block
copy:
  what: Extraction stopped at the {{ paintedwolf.max_entries }}-entry limit before writing the next entry.
  cause: Entry count cap prevents huge directory fan-out during unpack.
  why: Bounded unpack limits work per call.
  fix: 'Split the archive into bounded parts upstream. Inspect the completed extraction before choosing
    a destination for the remaining part.{% if paintedwolf.extraction_started %} Extraction stopped in
    {{ paintedwolf.dest }} after committing {{ paintedwolf.extracted_entries }} entries ({{ paintedwolf.extracted_bytes
    }} bytes).{% if paintedwolf.extracted_paths_sample %} Completed path sample: {{ paintedwolf.extracted_paths_sample }}.{% endif %}{% if paintedwolf.extracted_paths_omitted %} {{ paintedwolf.extracted_paths_omitted }} additional completed paths are retained in the structured result.{% endif %} The destination and parent directories may also have been created; completed changes remain
    in place. Inspect them before retrying so you do not overwrite work.{% endif %}'
  instead: Do not retry the unchanged archive; the entry cap still applies.
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:extract_archive
x-paintedwolf-message: extract_archive exceeds max_entries
x-paintedwolf-scenarios:
- id: default
  vars:
    entries: 600
    max_entries: 500
    profile: implement
    tool: extract_archive
  expect_contains:
  - 'Rejected:'
  - 'Code: EXTRACT_ENTRY_LIMIT'
- id: partial_extraction
  vars:
    max_entries: 500
    extraction_started: true
    dest: out
    extracted_entries: 500
    extracted_bytes: 500
    extracted_paths_sample:
    - out/first.txt
  expect_contains:
  - after committing 500
  - out/first.txt
  - remain in place
