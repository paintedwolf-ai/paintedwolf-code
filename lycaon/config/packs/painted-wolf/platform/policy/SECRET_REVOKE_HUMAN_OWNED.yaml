oar: '1.0'
id: SECRET_REVOKE_HUMAN_OWNED
kind: schema
anchor: tool.rejected
selector:
  tool:
  - secret_revoke
requires:
  facts:
  - paintedwolf.rejection_code
  profiles:
  - tool
when: paintedwolf.rejection_code == "SECRET_REVOKE_HUMAN_OWNED"
effect: block
copy:
  what: That managed secret was entered by a person, so it is not yours to revoke.
  cause: Its origin is a human act — an ask response, a marked file or composer value, or a settings entry.
  why: Revoking is permanent and the reference never resolves again, so ending a person's own credential would
    cost them a re-entry they never asked for.
  fix: Leave it in place. If it should go, say so in your reply and let the person revoke it in project settings.
  instead: Leave human-owned credentials in place; only revoke a reference when this task has authority to
    end it
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
x-paintedwolf-message: That managed secret was entered by a person, so it is not yours to revoke
x-paintedwolf-scenarios:
- id: default
  vars:
    profile: implement
    tool: secret_revoke
  expect_contains:
  - 'Rejected:'
  - 'Code: SECRET_REVOKE_HUMAN_OWNED'
