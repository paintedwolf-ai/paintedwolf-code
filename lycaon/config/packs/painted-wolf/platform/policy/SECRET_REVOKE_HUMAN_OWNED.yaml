spec_version: "1.0"
id: SECRET_REVOKE_HUMAN_OWNED
kind: schema
on: tool.rejected
selector:
  tools:
    - secret_revoke
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SECRET_REVOKE_HUMAN_OWNED"
effect: block
category: recoverable
emit: guard:tool
message: That managed secret holds a person's value, so it is not yours to revoke
what: That managed secret holds a person's value, so it is not yours to revoke.
cause: A person supplied its current value — an ask response, a marked file or composer value, a settings entry, a protected detection, a replacement, or a generated value they chose to hold.
why: Revoking is permanent and the reference never resolves again, so ending a person's own credential would cost them a re-entry they never asked for.
fix: Leave it in place. If it should go, say so in your reply and let the person revoke it in project settings.
instead: Leave human-owned credentials in place; only revoke a reference when this task has authority to end it
scenarios:
  - id: default
    vars:
      session_role: implement
      tool: secret_revoke
