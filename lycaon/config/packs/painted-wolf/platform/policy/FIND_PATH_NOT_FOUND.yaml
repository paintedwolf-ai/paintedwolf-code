spec_version: "1.0"
id: FIND_PATH_NOT_FOUND
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - find
requires_facts: [paintedwolf.operation, paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "FIND_PATH_NOT_FOUND"
effect: block
category: recoverable
emit: guard:find
message: find walk root does not exist
what: find walk root {{ paintedwolf.path }} does not exist.
cause: The path argument must name an existing file or directory under the attached project roots.
why: Structured rejects let agents branch without parsing free-form stat errors.
fix: Inspect the intended parent with an offered listing or metadata capability, then retry with an observed search root.
instead: Branch on Code; pick an existing path before retrying find
scenarios:
  - id: default
    vars:
      path: missing/dir
      profile: explore_readonly
      tool: find
