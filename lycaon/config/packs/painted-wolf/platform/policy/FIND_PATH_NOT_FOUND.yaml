oar: '1.0'
id: FIND_PATH_NOT_FOUND
kind: schema
anchor: tool.rejected
selector:
  tool:
    - find
requires:
  profiles:
    - filesystem
    - tool
  facts:
    - paintedwolf.rejection_code
    - paintedwolf.path
when: paintedwolf.rejection_code == "FIND_PATH_NOT_FOUND"
effect: block
copy:
  what: find walk root {{ paintedwolf.path }} does not exist.
  cause: The path argument must name an existing file or directory under the attached project roots.
  why: Structured rejects let agents branch without parsing free-form stat errors.
  fix: Verify the repo-relative path with list_dir or stat, then retry find with a valid root.
  instead: Branch on Code; pick an existing path before retrying find
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:find
x-paintedwolf-message: find walk root does not exist
x-paintedwolf-scenarios:
  - id: default
    vars:
      path: missing/dir
      profile: explore_readonly
      tool: find
    expect_contains:
      - 'Rejected:'
      - 'Code: FIND_PATH_NOT_FOUND'
