oar: '1.0'
id: SECRET_REFERENCE_AGENT_USE_EXPIRED
kind: schema
anchor: tool.rejected
requires:
  facts: [paintedwolf.rejection_code]
  profiles: [tool]
when: paintedwolf.rejection_code == "SECRET_REFERENCE_AGENT_USE_EXPIRED"
effect: block
copy:
  what: The managed secret reference is past its agent-use deadline.
  cause: Its configured agent-use lifetime ended before this operation.
  why: The agent cannot substitute a capability after that deadline.
  fix: Ask the user to set a new agent-use deadline or provide a different live reference visible to this chat.
  instead: Do not retry the reference without a user-authorized deadline change
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
x-paintedwolf-message: The managed secret reference is past its agent-use deadline
x-paintedwolf-scenarios:
  - id: default
    vars: {profile: implement, tool: http_request}
    expect_contains: ['Rejected:', 'Code: SECRET_REFERENCE_AGENT_USE_EXPIRED']
