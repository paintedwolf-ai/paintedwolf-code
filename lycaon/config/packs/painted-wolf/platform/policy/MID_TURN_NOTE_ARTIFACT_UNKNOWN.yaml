oar: '1.0'
id: MID_TURN_NOTE_ARTIFACT_UNKNOWN
kind: invariant
anchor: coordinator.mid_turn_note
requires:
  facts:
    - paintedwolf.offender_count
    - paintedwolf.offenders_omitted
    - paintedwolf.offenders_sample
    - paintedwolf.reject_observation
    - paintedwolf.surface_presentable_ids
when: paintedwolf.reject_observation == "mid_turn_note_artifact_unknown"
effect: warn
copy:
  what: '[HOST: MESSAGE WITHHELD FROM USER] {{ paintedwolf.offender_count }} artifact directive(s) name an artifact this session has not seen: {{ paintedwolf.offenders_sample }}{% if paintedwolf.offenders_omitted %} +{{ paintedwolf.offenders_omitted }} more{% endif %}'
  cause: '[artifact:<uuid>] takes ids this session has seen, from tool results, worker proof, or attachments. A made-up id resolves to nothing.'
  why: 'Unpublished draft: the user has not received this text as an assistant update. The tools in this response already ran and their results appear above; do not re-run them.'
  fix: '{% if paintedwolf.surface_presentable_ids %}Presentable ids: {{ paintedwolf.surface_presentable_ids }}. Use one only if it supports the update. {% else %}This session has no presentable image yet. Produce one before presenting it. {% endif %}Continue from the tool results above without re-running completed tool calls. Publish a brief update with valid inline citations, or include the relevant explanation in your final reply.'
  instead: 'Branch on Code MID_TURN_NOTE_ARTIFACT_UNKNOWN; continue from the tool results above and use an observed artifact id or omit the directive'
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:mid_turn_note
x-paintedwolf-message: A mid-turn artifact directive was not presentable and the text was withheld.
x-paintedwolf-scenarios:
  - id: default
    vars:
      profile: 'coordinator'
      offender_count: 1
      offenders_omitted: 0
      offenders_sample: '11111111-1111-4111-8111-111111111111'
      surface_presentable_ids: '22222222-2222-4222-8222-222222222222'
