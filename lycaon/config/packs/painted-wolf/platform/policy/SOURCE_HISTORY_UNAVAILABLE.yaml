spec_version: "1.0"
id: SOURCE_HISTORY_UNAVAILABLE
kind: schema
on: tool.rejected
selector:
  tools:
    - source_history
requires_facts: [paintedwolf.detail, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SOURCE_HISTORY_UNAVAILABLE"
effect: block
category: recoverable
emit: guard:source_history
message: source ledger not configured for this session
what: source_history cannot answer — {{ paintedwolf.detail }}.
cause: The session runs without a configured source ledger, so no recorded provenance exists to query.
why: Absence of the ledger is stated rather than answered with an empty history, which would read as "nothing ever changed".
fix: Treat provenance as unknown. Offered Git history tools can establish committed history; reading current bytes cannot establish authorship or prove no changes occurred.
instead: Branch on Code; treat provenance as unknown, not empty
scenarios:
  - id: default
    vars:
      detail: the source ledger is not configured for this session
      profile: implement
      tool: source_history
