oar: '1.0'
id: SECRET_REFERENCE_LIMIT
kind: schema
anchor: tool.rejected
requires:
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.secret_reference_count
  - paintedwolf.secret_reference_limit
  profiles:
  - tool
when: paintedwolf.rejection_code == "SECRET_REFERENCE_LIMIT"
effect: block
copy:
  what: This call reached at least {{ paintedwolf.secret_reference_count }} distinct managed references; the
    bound is {{ paintedwolf.secret_reference_limit }}.
  cause: Reference substitution exceeded the per-call resource bound.
  why: Resolution is bounded before any outbound operation begins.
  fix: Keep each call within the actual distinct-reference bound. Split only independent intended operations;
    if the request must remain atomic, report the limit rather than silently changing its semantics.
  instead: Keep each call within the published reference limit
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
x-paintedwolf-message: This call contains too many managed secret references
x-paintedwolf-scenarios:
- id: default
  vars:
    profile: implement
    tool: http_request
  expect_contains:
  - 'Rejected:'
  - 'Code: SECRET_REFERENCE_LIMIT'
