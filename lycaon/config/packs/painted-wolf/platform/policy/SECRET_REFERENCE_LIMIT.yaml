spec_version: "1.0"
id: SECRET_REFERENCE_LIMIT
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code, paintedwolf.secret_reference_count, paintedwolf.secret_reference_limit]
when: paintedwolf.rejection_code == "SECRET_REFERENCE_LIMIT"
effect: block
category: recoverable
emit: guard:tool
message: This call contains too many managed secret references
what: This call reached at least {{ paintedwolf.secret_reference_count }} distinct managed references; the bound is {{ paintedwolf.secret_reference_limit }}.
cause: Reference substitution exceeded the per-call resource bound.
why: Resolution is bounded before any outbound operation begins.
fix: Keep each call within the actual distinct-reference bound. Split only independent intended operations; if the request must remain atomic, report the limit rather than silently changing its semantics.
instead: Keep each call within the published reference limit
scenarios:
  - id: default
    vars:
      profile: implement
      tool: http_request
