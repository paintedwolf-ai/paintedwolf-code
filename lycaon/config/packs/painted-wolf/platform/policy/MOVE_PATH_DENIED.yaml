spec_version: "1.0"
id: MOVE_PATH_DENIED
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.operation, paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.operation == "move" && paintedwolf.rejection_code == "MOVE_PATH_DENIED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:move
message: move:move path matches deny glob
what: Moving {{ paintedwolf.path }} is denied by the host path policy.
cause: A source or destination is protected.
why: A rejected item does not undo earlier successful moves in the batch.
fix: Preserve completed moves. Correct a mistaken target only within existing authority; another tool or renamed path cannot bypass the boundary.
instead: Resolve the reported item and preserve completed move receipts
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      profile: implement
      tool: move
