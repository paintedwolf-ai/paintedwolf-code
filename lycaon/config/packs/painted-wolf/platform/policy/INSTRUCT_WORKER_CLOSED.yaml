spec_version: "1.0"
id: INSTRUCT_WORKER_CLOSED
kind: schema
on: tool.rejected
selector:
  tools:
    - instruct_worker
requires_facts: [paintedwolf.next_steps, paintedwolf.overlay_id, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "INSTRUCT_WORKER_CLOSED"
effect: block
category: recoverable
emit: guard:instruct_worker
message: The worker is closed.
what: The worker is closed.
cause: It was withdrawn, or its session can no longer be used.
why: A closed worker keeps its history but starts no new rounds.
fix: '{{ paintedwolf.next_steps }}'
instead: Branch on Code INSTRUCT_WORKER_CLOSED; do not retry the same call
scenarios:
  - id: default
    vars:
      profile: coordinator
      tool: instruct_worker
