oar: '1.0'
id: INSTRUCT_WORKER_CLOSED
kind: schema
anchor: tool.rejected
selector:
  tool:
    - instruct_worker
requires:
  facts: [paintedwolf.rejection_code]
  profiles:
    - tool
when: paintedwolf.rejection_code == "INSTRUCT_WORKER_CLOSED"
effect: block
copy:
  what: The worker is closed.
  cause: It was withdrawn, or its session can no longer be used.
  why: A closed worker keeps its history but starts no new rounds.
  fix: Start a new worker with task; use base_overlay_id to build on its result.
  instead: Branch on Code INSTRUCT_WORKER_CLOSED; do not retry the same call
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:instruct_worker
x-paintedwolf-message: The worker is closed.
x-paintedwolf-scenarios:
  - id: default
    vars:
      profile: coordinator
      tool: instruct_worker
