spec_version: "1.0"
id: COMMAND_TLS_VERIFICATION_REQUIRED
kind: policy
on: tool.rejected
selector:
  tools:
    - command
    - verify
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "COMMAND_TLS_VERIFICATION_REQUIRED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_composition_redirect
message: TLS verification cannot be disabled
what: The request asked to skip TLS certificate verification.
cause: curl -k or --insecure turns off server certificate checks.
why: The egress policy has no unverified TLS mode. A connection whose certificate is not checked cannot establish which host received the request or its credentials. No request was sent.
fix: Remove -k. For a local development server, use http:// on its loopback port or a certificate the system trusts.
instead: Send the request without -k; do not retry through an external program.
x-paintedwolf-scenarios:
  - id: insecure_option
    vars:
      tool: command
