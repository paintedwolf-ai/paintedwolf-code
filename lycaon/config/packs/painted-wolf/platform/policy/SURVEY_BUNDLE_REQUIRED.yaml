spec_version: "1.0"
id: SURVEY_BUNDLE_REQUIRED
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.command_form, paintedwolf.operation, paintedwolf.rejection_code]
when: paintedwolf.operation == "survey_repo" && paintedwolf.rejection_code == "SURVEY_BUNDLE_REQUIRED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:survey
message: survey_repo requires a catalog bundle id
what: '{% if paintedwolf.command_form %}{{ paintedwolf.command_form }}{% else %}survey_repo{% endif %} was called without a bundle argument.'
cause: bundle is required — pick a catalog bundle id from the tool schema.
why: Composite survey runs a fixed probe bundle; the host cannot infer which catalog pattern to execute.
fix: Select the intended bundle ID from the current {% if paintedwolf.command_form %}{{ paintedwolf.command_form }}{% else %}survey_repo{% endif %} schema/catalog. The host cannot infer a bundle from an unstructured task description.
instead: Branch on Code; retry with a valid bundle id from your Tools section
x-paintedwolf-scenarios:
  - id: default
    vars:
      profile: explore_readonly
      tool: survey_repo
  - id: command-leg
    vars:
      command_form: repo-map
      native_operation: survey_repo
      profile: explore_readonly
      tool: command
    expect_contains:
      - 'repo-map'
