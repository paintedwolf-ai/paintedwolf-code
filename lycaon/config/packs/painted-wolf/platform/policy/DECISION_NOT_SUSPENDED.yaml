oar: '1.0'
id: DECISION_NOT_SUSPENDED
kind: policy
anchor: tool.rejected
requires:
  profiles:
  - tool
  facts: [paintedwolf.rejection_code, paintedwolf.worker, paintedwolf.status, paintedwolf.next_steps]
when: paintedwolf.rejection_code == "DECISION_NOT_SUSPENDED"
effect: block
copy:
  what: Worker {{ paintedwolf.worker }} is {{ paintedwolf.status }} and cannot resume from a decision.
  cause: The decision is unchanged, but the job has not entered the suspended state.
  why: A decision answer must resume the same suspended worker and answer the current question.
  fix: '{{ paintedwolf.next_steps }} Answer only after the worker asks; do not answer the same question repeatedly.'
  instead: Inspect the current worker state before retrying.
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
x-paintedwolf-message: Worker {{ paintedwolf.worker }} is {{ paintedwolf.status }} and cannot resume from
  a decision.
x-paintedwolf-scenarios:
- id: default
  vars:
    job_id: worker-1
    status: complete
selector:
  tool:
  - answer_decision
