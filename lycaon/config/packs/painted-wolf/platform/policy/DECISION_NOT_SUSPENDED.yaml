spec_version: "1.0"
id: DECISION_NOT_SUSPENDED
kind: policy
on: tool.rejected
selector:
  tools:
    - answer_decision
requires_facts: [paintedwolf.job_id, paintedwolf.next_steps, paintedwolf.rejection_code, paintedwolf.status]
when: paintedwolf.rejection_code == "DECISION_NOT_SUSPENDED"
effect: block
category: recoverable
emit: guard:coordinator
message: Worker {{ paintedwolf.job_id }} is {{ paintedwolf.status }} and cannot resume from a decision.
what: Worker {{ paintedwolf.job_id }} is {{ paintedwolf.status }} and cannot resume from a decision.
cause: The decision is unchanged, but the job has not entered the suspended state.
why: A decision answer must resume the same suspended worker and answer the current question.
fix: '{{ paintedwolf.next_steps }} If it is running, wait for its decision envelope before answering. If it is terminal, report the inconsistent state instead of repeatedly answering.'
instead: Inspect the current worker state before retrying.
scenarios:
  - id: default
    vars:
      job_id: worker-1
      status: complete
