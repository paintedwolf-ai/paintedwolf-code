spec_version: "1.0"
id: FIND_INVALID_TYPE
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - find
requires_facts: [paintedwolf.native_operation, paintedwolf.operation, paintedwolf.rejection_code, paintedwolf.type]
when: paintedwolf.rejection_code == "FIND_INVALID_TYPE"
effect: block
category: recoverable
emit: guard:find
message: find type argument is invalid
what: '{% if paintedwolf.native_operation %}find received invalid -type value {{ paintedwolf.type }} — want f (file), d (directory), or l (symlink).{% else %}find received invalid type {{ paintedwolf.type }} — want file, dir, or any.{% endif %}'
cause: '{% if paintedwolf.native_operation %}The -type filter takes kind codes: f files, d directories, l symlinks.{% else %}The type filter must be one of file, dir, or any.{% endif %}'
why: Structured find filters keep walk semantics predictable under sandbox caps.
fix: '{% if paintedwolf.native_operation %}Retry find with -type f for files, -type d for directories, or -type l for symlinks, or omit -type.{% else %}Retry find with type file, dir, or any (or omit type).{% endif %}'
instead: Branch on Code; fix the type argument
scenarios:
  - id: default
    vars:
      path: src/
      session_role: explore_readonly
      tool: find
      type: symlink
  - id: command-leg
    vars:
      native_operation: find
      path: src/
      session_role: explore_readonly
      tool: command
      type: link
    expect_contains:
      - '-type f'
