spec_version: "1.0"
id: FIND_INVALID_TYPE
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.command_find_reachable, paintedwolf.native_operation, paintedwolf.operation, paintedwolf.rejection_code, paintedwolf.type]
when: paintedwolf.operation == "find" && paintedwolf.rejection_code == "FIND_INVALID_TYPE"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:find
message: find type argument is invalid
what: '{% if paintedwolf.native_operation %}find received invalid -type value {{ paintedwolf.type }} — want f (file), d (directory), or l (symlink).{% else %}find received invalid type {{ paintedwolf.type }} — want file, dir, or any.{% endif %}'
cause: '{% if paintedwolf.native_operation %}The -type filter takes kind codes: f files, d directories, l symlinks.{% else %}The type filter must be one of file, dir, or any.{% endif %}'
why: Structured find filters keep walk semantics predictable under sandbox caps.
fix: '{% if paintedwolf.native_operation %}{% if paintedwolf.command_find_reachable %}Retry find in command with -type f for files, -type d for directories, or -type l for symlinks, or omit -type.{% else %}Pass -type f for files, -type d for directories, or -type l for symlinks, or omit -type; that find form is not offered on this request.{% endif %}{% else %}Pass type file, dir, or any (or omit type) when calling this operation.{% endif %}'
instead: Branch on Code; fix the type argument
x-paintedwolf-scenarios:
  - id: default
    vars:
      path: src/
      profile: explore_readonly
      tool: find
      type: symlink
  - id: command-leg
    vars:
      command_find_reachable: true
      native_operation: find
      path: src/
      profile: explore_readonly
      tool: command
      type: link
    expect_contains:
      - '-type f'
