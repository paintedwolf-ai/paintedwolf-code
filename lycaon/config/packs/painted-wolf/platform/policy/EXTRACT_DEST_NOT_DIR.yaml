spec_version: "1.0"
id: EXTRACT_DEST_NOT_DIR
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - extract_archive
requires_facts: [paintedwolf.dest, paintedwolf.operation, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "EXTRACT_DEST_NOT_DIR"
effect: block
category: recoverable
emit: guard:tool
message: extract destination is not a directory
what: The archive extraction destination {{ paintedwolf.dest }} exists but is not a directory.
cause: Destination must be an existing directory or a creatable directory path.
why: The destination is separate from the archive input and must contain the extracted entries.
fix: Choose the intended directory destination. Do not delete or overwrite the existing non-directory target just to make extraction succeed.
instead: Branch on Code; fix args and retry once
scenarios:
  - id: default
    vars:
      path: out.txt
      profile: coordinator
      tool: extract_archive
      dest: existing-file
