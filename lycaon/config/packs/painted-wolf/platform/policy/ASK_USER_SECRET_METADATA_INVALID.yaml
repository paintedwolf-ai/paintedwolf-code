spec_version: "1.0"
id: ASK_USER_SECRET_METADATA_INVALID
kind: schema
on: tool.rejected
selector:
  tools:
    - ask_user
requires_facts: [paintedwolf.rejection_code, paintedwolf.rejection_field]
when: paintedwolf.rejection_code == "ASK_USER_SECRET_METADATA_INVALID"
effect: block
category: recoverable
emit: guard:tool
message: The protected response metadata is invalid
what: The protected response metadata is invalid{% if paintedwolf.rejection_field %} at {{ paintedwolf.rejection_field }}{% endif %}.
cause: A secret name, purpose, scope, or lifetime is outside the published schema.
why: The host must validate the lifecycle before accepting protected material.
fix: Correct the secret metadata named by the tool schema, then retry once.
instead: Keep the response typed as secret; never request the value as text
scenarios:
  - id: default
    vars:
      profile: coordinator
      tool: ask_user
