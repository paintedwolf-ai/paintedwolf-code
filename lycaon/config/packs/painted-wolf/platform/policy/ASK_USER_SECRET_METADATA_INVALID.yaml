oar: '1.0'
id: ASK_USER_SECRET_METADATA_INVALID
kind: schema
anchor: tool.rejected
selector:
  tool:
  - ask_user
requires:
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.rejection_field
  profiles:
  - tool
when: paintedwolf.rejection_code == "ASK_USER_SECRET_METADATA_INVALID"
effect: block
copy:
  what: The protected response metadata is invalid{% if paintedwolf.rejection_field %} at {{ paintedwolf.rejection_field
    }}{% endif %}.
  cause: A secret name, purpose, scope, or lifetime is outside the published schema.
  why: The host must validate the lifecycle before accepting protected material.
  fix: Correct the secret metadata named by the tool schema, then retry once.
  instead: Keep the response typed as secret; never request the value as text
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
x-paintedwolf-message: The protected response metadata is invalid
x-paintedwolf-scenarios:
- id: default
  vars:
    profile: coordinator
    tool: ask_user
  expect_contains:
  - 'Rejected:'
  - 'Code: ASK_USER_SECRET_METADATA_INVALID'
