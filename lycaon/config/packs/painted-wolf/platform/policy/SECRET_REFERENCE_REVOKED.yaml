spec_version: "1.0"
id: SECRET_REFERENCE_REVOKED
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SECRET_REFERENCE_REVOKED"
effect: block
category: recoverable
emit: guard:tool
message: The managed secret reference is revoked
what: The managed secret reference is revoked.
cause: Its lifecycle metadata permanently disables the protected value.
why: Revoked capabilities cannot be reused or restored by reference.
fix: Use a new live reference visible to this chat. If none is available, report the dependency through the current session’s available completion or user-response surface.
instead: Do not retry the revoked reference
scenarios:
  - id: default
    vars:
      session_role: implement
      tool: command
