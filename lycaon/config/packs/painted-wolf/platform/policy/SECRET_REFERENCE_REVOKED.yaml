oar: '1.0'
id: SECRET_REFERENCE_REVOKED
kind: schema
anchor: tool.rejected
requires:
  facts:
  - paintedwolf.rejection_code
  profiles:
  - tool
when: paintedwolf.rejection_code == "SECRET_REFERENCE_REVOKED"
effect: block
copy:
  what: The managed secret reference is revoked.
  cause: Its lifecycle metadata permanently disables the protected value.
  why: Revoked capabilities cannot be reused or restored by reference.
  fix: Use a new live reference visible to this chat. If none is available, report the dependency through the
    current session’s available completion or user-response surface.
  instead: Do not retry the revoked reference
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
x-paintedwolf-message: The managed secret reference is revoked
x-paintedwolf-scenarios:
- id: default
  vars:
    profile: implement
    tool: command
  expect_contains:
  - 'Rejected:'
  - 'Code: SECRET_REFERENCE_REVOKED'
