spec_version: "1.0"
id: RECALL_LIVE_CODE_NOT_IN_SCOPE
kind: schema
on: tool.rejected
selector:
  tools:
    - recall
requires_facts: [paintedwolf.can_find, paintedwolf.can_grep, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "RECALL_LIVE_CODE_NOT_IN_SCOPE"
effect: block
category: recoverable
emit: guard:recall
message: recall reads the record, not the working tree.
what: recall reads the record, not the working tree.
cause: The query asked for kind:code or kind:file, which are matches against files as they are now.
why: The two answer different questions. A recalled observation is dated and may be stale; a tree match is current. One result shape carrying both would leave no way to tell which one you got.
fix: '{% if paintedwolf.can_grep %}Use grep for current-tree content.{% endif %}{% if paintedwolf.can_find %} Use find for current paths.{% endif %} Current-source evidence requires an offered source tool; recall retrieves dated observations, including completed legs, and cannot establish current file contents.'
instead: Use an offered current-source tool, or report the missing evidence
scenarios:
  - id: default
    vars:
      profile: coordinator
      tool: recall
