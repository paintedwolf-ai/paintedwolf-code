spec_version: "1.0"
id: SOURCE_VERSION_NOT_FOUND
kind: schema
on: tool.rejected
selector:
  tools:
    - source_history
    - restore_version
requires_facts: [paintedwolf.detail, paintedwolf.next_steps, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SOURCE_VERSION_NOT_FOUND"
effect: block
category: recoverable
emit: guard:source_history
message: source version was not found
what: Source version not found — {{ paintedwolf.detail }}.
cause: The requested version id does not exist in this project's source ledger.
why: Version lookups are scoped to the current project and validated against recorded history.
fix: '{{ paintedwolf.next_steps }}'
instead: 'Branch on Code.'
scenarios:
  - id: default
    vars:
      detail: version v_missing was not found
      session_role: implement
      source_history_offered: true
      tool: source_history
  - id: without_source_history
    vars:
      detail: version v_missing was not found
      session_role: plan_write_only
      source_history_offered: false
      tool: restore_version
