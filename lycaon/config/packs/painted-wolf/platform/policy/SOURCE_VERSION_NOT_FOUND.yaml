oar: '1.0'
id: SOURCE_VERSION_NOT_FOUND
kind: schema
anchor: tool.rejected
selector:
  tool:
    - source_history
    - restore_version
requires:
  profiles:
    - tool
  facts:
    - paintedwolf.rejection_code
    - paintedwolf.detail
    - paintedwolf.source_history_offered
when: paintedwolf.rejection_code == "SOURCE_VERSION_NOT_FOUND"
effect: block
copy:
  what: Source version not found — {{ paintedwolf.detail }}.
  cause: The requested version id does not exist in this project's source ledger.
  why: Version lookups are scoped to the current project and validated against recorded history.
  fix: >-
    {% if paintedwolf.source_history_offered %}Check effects for valid version IDs recorded for this file.
    {% else %}Omit version_id to restore the immediate predecessor, or pass a version ID a result in this session named.{% endif %}
  instead: >-
    {% if paintedwolf.source_history_offered %}Branch on Code; verify version_id from effects
    {% else %}Branch on Code{% endif %}
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:source_history
x-paintedwolf-message: source version was not found
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: version v_missing was not found
      profile: implement
      source_history_offered: true
      tool: source_history
    expect_contains:
      - 'Rejected:'
      - 'Code: SOURCE_VERSION_NOT_FOUND'
      - Check effects
  - id: without_source_history
    vars:
      detail: version v_missing was not found
      profile: plan_write_only
      source_history_offered: false
      tool: restore_version
    expect_contains:
      - 'Code: SOURCE_VERSION_NOT_FOUND'
      - Omit version_id
