spec_version: "1.0"
id: CHMOD_MODE_DENIED
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - chmod
requires_facts: [paintedwolf.chmod_allowed_modes, paintedwolf.mode, paintedwolf.mode_denied, paintedwolf.operation, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "CHMOD_MODE_DENIED"
effect: block
category: recoverable
emit: guard:chmod
message: chmod mode is not in the allowlist
what: chmod mode {{ paintedwolf.mode }} is not in the bundled allowlist.
cause: The requested permission mode or its symbolic result is not permitted.
why: Permission changes must stay within the host’s allowed ordinary modes.
fix: 'Choose the intended mode from the current allowed octal set: {{ paintedwolf.chmod_allowed_modes }}. Symbolic changes must also resolve to an allowed mode. Preserve the task’s intended access; do not select a broader mode merely to clear this refusal.'
instead: Branch on Code CHMOD_MODE_DENIED; use an allowed permission mode that meets the task
scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      session_role: coordinator
      tool: chmod
