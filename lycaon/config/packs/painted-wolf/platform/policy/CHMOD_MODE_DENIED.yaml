oar: '1.0'
id: CHMOD_MODE_DENIED
kind: schema
anchor: tool.rejected
selector:
  tool:
  - chmod
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.mode
  - paintedwolf.mode_denied
  - paintedwolf.chmod_allowed_modes
when: paintedwolf.rejection_code == "CHMOD_MODE_DENIED"
effect: block
copy:
  what: chmod mode {{ paintedwolf.mode }} is not in the bundled allowlist.
  cause: The requested permission mode or its symbolic result is not permitted.
  why: Permission changes must stay within the host’s allowed ordinary modes.
  fix: 'Choose the intended mode from the current allowed octal set: {{ paintedwolf.chmod_allowed_modes }}.
    Symbolic changes must also resolve to an allowed mode. Preserve the task’s intended access; do not select
    a broader mode merely to clear this refusal.'
  instead: Branch on Code CHMOD_MODE_DENIED; use an allowed permission mode that meets the task
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:chmod
x-paintedwolf-message: chmod mode is not in the allowlist
x-paintedwolf-scenarios:
- id: default
  vars:
    detail: bad args
    path: src/main.go
    profile: coordinator
    tool: chmod
  expect_contains:
  - 'Rejected:'
  - 'Code: CHMOD_MODE_DENIED'
