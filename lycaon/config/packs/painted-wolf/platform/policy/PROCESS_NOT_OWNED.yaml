oar: '1.0'
id: PROCESS_NOT_OWNED
kind: policy
anchor: tool.rejected
requires:
  facts: [paintedwolf.rejection_code]
  profiles: [tool]
when: paintedwolf.rejection_code == "PROCESS_NOT_OWNED"
effect: block
copy:
  what: The target process was not started by this session.
  cause: The host signals only processes descended from this session's own launches, and no launch of this session started this one.
  why: Other processes on this computer belong to the person or to other work; approval does not make them this session's to signal.
  fix: Signal only processes this session started, using process_list references or command job handles. Ask the user to stop any other process themselves.
  instead: Branch on Code; do not retry with another reference, PID, name, or command for the same process. Ask the user to stop it themselves.
x-paintedwolf-category: policy
x-paintedwolf-emit: guard:host_process
x-paintedwolf-message: The target process was not started by this session.
x-paintedwolf-scenarios:
- id: default
  vars: {}
  expect_contains: ['Rejected:', 'Code: PROCESS_NOT_OWNED']
