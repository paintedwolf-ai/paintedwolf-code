spec_version: "1.0"
id: PROCESS_UNSUPPORTED
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.admitted_process_capability_fields, paintedwolf.next_steps, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "PROCESS_UNSUPPORTED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:host_process
message: This host does not support instance-bound process operations.
what: This host does not support instance-bound process operations.
cause: The host could not complete the structured process operation.
why: A process reference identifies one process instance; ordinary operating-system permissions still apply.
fix: '{% if paintedwolf.next_steps %}{{ paintedwolf.next_steps }}{% else %}This request cannot run host process commands; report the unsupported process operation.{% endif %}'
instead: Branch on Code; report the unsupported process operation if no host process capability is offered.
x-paintedwolf-scenarios:
  - id: default
    vars: {}
