spec_version: "1.0"
id: COORDINATOR_ORCHESTRATE_WRITE_DENIED
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.can_task, paintedwolf.rejection_code, paintedwolf.turn_surface]
when: paintedwolf.rejection_code == "COORDINATOR_ORCHESTRATE_WRITE_DENIED"
effect: block
x-paintedwolf-audience:
  - coordinator
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
message: Coordinator attempted a product source write on an orchestrate surface
what: 'The current {{ paintedwolf.turn_surface }} surface does not offer {{ tool }}.'
cause: Product mutations are outside the active coordinator surface; the attempted call did not run.
why: Product mutations are outside the active coordinator surface; the attempted call did not run.
fix: '{% if paintedwolf.can_task %}Dispatch task with a scoped brief, required write scope, and completion criteria for the edit; inspect the returned overlay before promotion.{% else %}Use the current schemas and workflow phase to find the authorized next step, or report that this surface cannot perform the edit.{% endif %}'
instead: Continue through the current workflow without retrying an unavailable mutation tool
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      profile: coordinator
      tool: edit
