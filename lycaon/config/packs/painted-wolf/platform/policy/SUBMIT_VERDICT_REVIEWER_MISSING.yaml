spec_version: "1.0"
id: SUBMIT_VERDICT_REVIEWER_MISSING
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code, paintedwolf.review_missing_reviewers]
when: paintedwolf.rejection_code == "SUBMIT_VERDICT_REVIEWER_MISSING"
effect: block
x-paintedwolf-severity: error
category: recoverable
emit: guard:workflow
message: Terminal verdict is missing one or more required reviewer envelopes.
what: "Required reviewer envelopes are missing: {{ paintedwolf.review_missing_reviewers }}."
cause: "These reviewers have no successful task envelope for the active review."
why: "The host cannot adjudicate an owed review that has not completed."
fix: "Inspect existing worker and decision state before dispatching. Wait for an already running required review; request only an absent required review through offered controls. If that review conflicts with user limits, resolve the conflict with the user first."
instead: "Preserve completed reviews and valid citations. Keep the phase incomplete when required review cannot be obtained."
scenarios:
  - id: missing_skeptic
    vars: {review_missing_reviewers: [skeptic]}
