spec_version: "1.0"
id: HELD_CALL_DUPLICATE_RUNNING
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - find
      - grep
      - wc
      - list_dir
      - summarize
      - survey_repo
      - diff
      - git_status
      - git_diff
      - git_log
      - git_show
      - git_blame
      - git_compare
      - git_branches
      - git_ref
      - git_stash_list
requires_facts: [paintedwolf.handle, paintedwolf.next_steps, paintedwolf.operation, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "HELD_CALL_DUPLICATE_RUNNING"
effect: block
category: recoverable
emit: guard:held_call
message: identical call already held
what: This exact call is already running as held call {{ paintedwolf.handle }}.
cause: An identical call outlived its foreground wait and is still running.
why: Repeating it starts the same work again and cannot return a newer result.
fix: '{{ paintedwolf.next_steps }}'
instead: Continue with the running call
scenarios:
  - id: default
    vars:
      handle: held-1
      session_role: coordinator
      tool: find
