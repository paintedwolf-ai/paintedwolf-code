oar: '1.0'
id: ENV_KEY_INVALID
kind: policy
anchor: tool.rejected
selector:
  tool:
  - command
  - verify
requires:
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.rejection_reason
  profiles:
  - tool
when: paintedwolf.rejection_code == "ENV_KEY_INVALID"
effect: block
copy:
  what: 'An environment variable name was refused{% if paintedwolf.rejection_reason %}: {{ paintedwolf.rejection_reason }}{% endif %}.'
  cause: Environment names must match [A-Za-z_][A-Za-z0-9_]*. Scrub-critical names and prefixes remain blocked case-insensitively.
  why: ''
  fix: ''
  instead: ''
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_env_input
x-paintedwolf-message: Invalid or blocked inline env key
x-paintedwolf-scenarios:
- id: blocked_git
  vars:
    profile: implement
    reason: blocked env key GIT_EXEC_PATH
    tool: command
