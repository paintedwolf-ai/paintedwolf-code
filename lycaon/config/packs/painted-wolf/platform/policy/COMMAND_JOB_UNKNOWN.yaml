spec_version: "1.0"
id: COMMAND_JOB_UNKNOWN
kind: schema
on: tool.rejected
selector:
  tools:
    - command
    - verify
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "COMMAND_JOB_UNKNOWN"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:tool
message: the job reference names no job of this session
what: The job reference did not resolve in this invocation's job scope.
cause: Shell job references do not identify arbitrary host processes.
why: ''
fix: Use `jobs` to inspect current job references. Select only the job matching the intended work; an unknown reference does not identify a replacement process to signal.
instead: ''
x-paintedwolf-scenarios:
  - id: default
    vars:
      tool: command
