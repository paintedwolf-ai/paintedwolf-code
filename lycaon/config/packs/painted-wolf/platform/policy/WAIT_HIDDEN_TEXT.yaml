oar: '1.0'
id: WAIT_HIDDEN_TEXT
kind: policy
anchor: coordinator.pre_invoke
selector:
  tool: [wait]
requires:
  profiles: [tool]
  facts:
    - paintedwolf.surface_note_offered
    - paintedwolf.tool_turn_has_text
    - paintedwolf.tool_turn_has_agent_note
when: paintedwolf.surface_note_offered && paintedwolf.tool_turn_has_text && !paintedwolf.tool_turn_has_agent_note
effect: block
copy:
  what: '`wait` has not started; this tool turn contains assistant text hidden from the user'
  cause: No user-visible note was committed in this batch
  why: Waiting parks the turn without publishing that text
  fix: 'If the user needs an update, send a grounded `surface_note` and `wait` together. Otherwise call `wait` with empty assistant text.'
  instead: 'Retry with the same wait conditions after choosing either recovery path.'
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
x-paintedwolf-message: Hidden assistant text before wait
x-paintedwolf-scenarios:
  - id: default
    vars:
      profile: coordinator
      tool: wait
    expect_contains:
      - 'Code: WAIT_HIDDEN_TEXT'
      - surface_note
      - empty assistant text
