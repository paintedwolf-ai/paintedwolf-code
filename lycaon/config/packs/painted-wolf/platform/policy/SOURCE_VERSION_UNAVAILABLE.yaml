spec_version: "1.0"
id: SOURCE_VERSION_UNAVAILABLE
kind: schema
on: tool.rejected
selector:
  tools:
    - source_history
    - restore_version
requires_facts: [paintedwolf.detail, paintedwolf.rejection_code, paintedwolf.side, paintedwolf.state]
when: paintedwolf.rejection_code == "SOURCE_VERSION_UNAVAILABLE"
effect: block
category: recoverable
emit: guard:source_history
message: content for source version is unavailable
what: Content for source version is unavailable{% if paintedwolf.side %} on the {{ paintedwolf.side }} side ({{ paintedwolf.state }}){% endif %} — {{ paintedwolf.detail }}.
cause: The version is recorded in the ledger, but its exact bytes were not captured or are no longer addressable.
why: Large files, binary content, and metadata-only observations retain ledger coordinates without content blobs.
fix: Inspect metadata via mode effects or lines instead of requesting content.
instead: Branch on Code; query metadata instead of content
scenarios:
  - id: default
    vars:
      detail: exact content for this version is unavailable
      session_role: implement
      tool: source_history
  - id: diff_side
    vars:
      detail: version v1 has no text to diff
      side: base
      state: binary
      session_role: implement
      tool: source_history
