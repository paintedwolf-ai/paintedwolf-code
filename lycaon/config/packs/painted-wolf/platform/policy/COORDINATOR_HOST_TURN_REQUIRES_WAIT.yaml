spec_version: "1.0"
id: COORDINATOR_HOST_TURN_REQUIRES_WAIT
kind: invariant
on: coordinator.closeout_check
selector: {}
requires_facts: [paintedwolf.batch_closed, paintedwolf.is_host_cycle_turn, paintedwolf.last_assistant, paintedwolf.pending_overlay_promote, paintedwolf.progress_has_open_steps, paintedwolf.surface_may_finish, paintedwolf.turn_tools, paintedwolf.workers_idle]
when: '!paintedwolf.batch_closed && paintedwolf.is_host_cycle_turn && size(paintedwolf.turn_tools) == 0 && paintedwolf.last_assistant != "" && ((paintedwolf.workers_idle && paintedwolf.progress_has_open_steps) || !(paintedwolf.workers_idle && !paintedwolf.pending_overlay_promote && paintedwolf.surface_may_finish))'
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
message: 'Host cycle turn ended with prose only — call `wait()` or actionable work'
what: A host cycle turn ([host:loop-wake], or a turn the host opened to report a worker finished) ended with assistant prose and no tool calls
cause: 'The host cycle still has open checklist work, a worker working or asking, an unaccounted complete result, unresolved changes, or a surface that requires a tool action; shelved changes and waiting workers do not count as open work'
why: 'Finishing one wave does not settle the remaining batch. An explicit action keeps progress and wake conditions aligned'
fix: 'Account for completed results, resolve open changes (promote, reject, or shelve), instruct workers on partial work, and dispatch ready independent workers. Wait only for an actual outstanding condition. End with synthesis only when no worker is working or asking, open changes are resolved, no blocking checklist work remains, and the surface permits it'
instead: 'Actionable work → account, instruct, or dispatch; outstanding work → wait; settled work on a synthesis surface → user prose'
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      session_role: coordinator
      tool: wait
