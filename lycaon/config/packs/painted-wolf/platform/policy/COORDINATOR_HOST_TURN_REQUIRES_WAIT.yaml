oar: '1.0'
id: COORDINATOR_HOST_TURN_REQUIRES_WAIT
kind: invariant
anchor: coordinator.closeout_check
requires:
  facts:
    - paintedwolf.batch_closed
    - paintedwolf.is_host_cycle_turn
    - paintedwolf.last_assistant
    - paintedwolf.pending_overlay_promote
    - paintedwolf.progress_has_open_steps
    - paintedwolf.surface_may_finish
    - paintedwolf.turn_tools
    - paintedwolf.workers_idle
when: '!paintedwolf.batch_closed && paintedwolf.is_host_cycle_turn && size(paintedwolf.turn_tools) == 0 && paintedwolf.last_assistant != "" && ((paintedwolf.workers_idle && paintedwolf.progress_has_open_steps) || !(paintedwolf.workers_idle && !paintedwolf.pending_overlay_promote && paintedwolf.surface_may_finish))'
effect: block
copy:
  what: A host cycle turn ([host:loop-wake], or a turn the host opened to report a worker finished) ended with assistant prose and no tool calls
  cause: 'The host cycle still has open checklist work, workers in flight, pending overlays, or a surface that requires a tool action'
  why: 'Finishing one wave does not complete the remaining checklist. An explicit action keeps progress and wake conditions aligned'
  fix: 'Reconcile completed legs and overlays, repair partial work, and dispatch the next independent ready legs. Wait only for an actual outstanding condition. End with synthesis only when workers are idle, overlays are settled, no blocking checklist work remains, and the surface permits it'
  instead: 'Actionable work → reconcile or dispatch; outstanding work → wait; settled work on a synthesis surface → user prose'
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
x-paintedwolf-message: 'Host cycle turn ended with prose only — call `wait()` or actionable work'
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      profile: coordinator
      tool: wait
    expect_contains:
      - 'Rejected:'
      - 'Code: COORDINATOR_HOST_TURN_REQUIRES_WAIT'
