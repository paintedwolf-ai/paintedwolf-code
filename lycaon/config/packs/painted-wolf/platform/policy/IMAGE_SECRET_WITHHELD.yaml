spec_version: "1.0"
id: IMAGE_SECRET_WITHHELD
kind: schema
on: tool.rejected
selector:
  tools:
    - view_image
requires_facts: [paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "IMAGE_SECRET_WITHHELD"
effect: block
category: recoverable
emit: guard:view_image
message: view_image perception withheld by the secret screen
what: '{{ tool }} did not send {{ paintedwolf.path }} to the model.'
cause: The image carries text the secret screen flagged or could not read, and the send was declined or could not be put to a person.
why: A person decides whether an image that may hold a credential reaches the model provider.
fix: Continue without viewing this image, or report that it needs review.
instead: Branch on Code IMAGE_SECRET_WITHHELD; do not retry the same image
scenarios:
  - id: default
    vars:
      path: docs/screenshot.png
      profile: coordinator
      tool: view_image
