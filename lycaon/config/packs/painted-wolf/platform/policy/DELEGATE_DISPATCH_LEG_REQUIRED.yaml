spec_version: "1.0"
id: DELEGATE_DISPATCH_LEG_REQUIRED
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "DELEGATE_DISPATCH_LEG_REQUIRED"
effect: block
category: recoverable
emit: guard:coordinator
message: A pending delegation leg must be identified before dispatch
what: The dispatch request did not identify a pending delegation leg.
cause: No leg_id was supplied and the delegation has no pending leg to infer.
why: Dispatching without one durable leg identity could duplicate or misattribute worker work.
fix: Inspect the delegation roster and provide the pending leg_id.
instead: Branch on the code and dispatch a specific pending leg
scenarios:
  - id: missing_leg
    vars:
      delegation_id: dep-1
