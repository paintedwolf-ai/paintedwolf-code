spec_version: "1.0"
id: COORDINATOR_UNGROUNDED_CLAIM
kind: invariant
on: coordinator.closeout_check
selector: {}
requires_facts: [paintedwolf.closeout_criteria_unmet, paintedwolf.closeout_round_incomplete, paintedwolf.grounding_verdict, paintedwolf.leg_id, paintedwolf.next_steps, paintedwolf.overlay_id, paintedwolf.unmet_criteria, paintedwolf.worker]
when: paintedwolf.grounding_verdict == "COORDINATOR_UNGROUNDED_CLAIM"
effect: block
on_fire:
  - increment_breaker
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:grounding
message: Completion claimed without a completed worker round behind it
what: 'Planned work {{ paintedwolf.leg_id }} has no completed, reported round behind it.'
cause: '{% if paintedwolf.closeout_round_incomplete %}The latest round of worker {{ paintedwolf.worker }} ended without completing.{% endif %}{% if paintedwolf.closeout_criteria_unmet %}Result {{ paintedwolf.overlay_id }} from worker {{ paintedwolf.worker }} does not meet: {{ paintedwolf.unmet_criteria }}.{% endif %}'
why: Planned work counts as done only when a worker round completed and reported.
fix: '{{ paintedwolf.next_steps }}'
instead: Claim the work complete only after a round completes and reports.
x-paintedwolf-scenarios:
  - id: round-incomplete
    vars:
      closeout_round_incomplete: true
      leg_id: leg-1
      worker: parser-fix
      overlay_id: res-1
      session_role: coordinator
  - id: summary-missing
    vars:
      closeout_criteria_unmet: true
      leg_id: leg-1
      worker: parser-fix
      overlay_id: res-1
      unmet_criteria: ["summary:present"]
      session_role: coordinator
