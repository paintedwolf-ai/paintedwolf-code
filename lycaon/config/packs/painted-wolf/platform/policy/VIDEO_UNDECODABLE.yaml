spec_version: "1.0"
id: VIDEO_UNDECODABLE
kind: schema
on: tool.rejected
selector:
  tools:
    - view_video
requires_facts: [paintedwolf.mime, paintedwolf.path, paintedwolf.rejection_code, paintedwolf.rejection_reason]
when: paintedwolf.rejection_code == "VIDEO_UNDECODABLE"
effect: block
category: recoverable
emit: guard:view_video
message: view_video could not decode the video
what: '{{ tool }} could not draw frames from {% if paintedwolf.path %}{{ paintedwolf.path }}{% else %}the video{% endif %}{% if paintedwolf.rejection_reason %} ({{ paintedwolf.rejection_reason }}){% endif %}.'
cause: The managed browser has no decoder for this file's codec, or the file is truncated. H.264, VP8, VP9, and AV1 decode; HEVC does not.
why: Frames come from the browser's own decoders, so a video it cannot play has no frames to show.
fix: Ask for the recording in MP4 (H.264) or WebM, or re-encode it with a tool in the project, then view the new file.
instead: Branch on Code VIDEO_UNDECODABLE; view a re-encoded file
scenarios:
  - id: default
    vars:
      mime: video/mp4
      path: recordings/bug.mov
      reason: media_error
      tool: view_video
