spec_version: "1.0"
id: PROCESS_REQUEST_INVALID
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "PROCESS_REQUEST_INVALID"
effect: block
category: recoverable
emit: guard:host_process
message: The process request is invalid.
what: The process request is invalid.
cause: The host could not complete the structured process operation.
why: A process reference identifies one process instance; ordinary operating-system permissions still apply.
fix: Use the declared schema and a supported signal.
instead: Branch on Code; Use the declared schema and a supported signal.
scenarios:
  - id: default
    vars: {}
