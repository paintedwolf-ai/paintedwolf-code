oar: '1.0'
id: SYNTH_HANDLE_NOT_IN_LEGS
kind: invariant
anchor: coordinator.closeout_check
requires:
  facts:
    - paintedwolf.offender_count
    - paintedwolf.offenders_omitted
    - paintedwolf.offenders_sample
    - paintedwolf.surface
    - paintedwolf.unobserved_cited_handles
when: paintedwolf.surface != "implement_investigate" && size(paintedwolf.unobserved_cited_handles) > 0
effect: block
copy:
  what: Synthesis cited {{ paintedwolf.offender_count }} evidence item(s) not seen in your tool results or worker results for this chat.
  cause: An evidence handle or path did not match the evidence ledger for this chat
  why: '{{ paintedwolf.offenders_sample }}{% if paintedwolf.offenders_omitted %} +{{ paintedwolf.offenders_omitted }} more{% endif %}'
  fix: 'Copy an exact printed handle into `evidence`, or cite path/line/excerpt from your or a worker''s tool results. Move URLs to cited_urls. Omit entries with no matching receipt.'
  instead: Repair the trailing citation metadata using only evidence already present in this chat
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator_synthesis
x-paintedwolf-evidence:
  ui_label: Evidence handles
  ui_check_id: evidence_handles
  in_session_retry: true
x-paintedwolf-message: Synthesis cited evidence not seen in tool results for this chat
x-paintedwolf-scenarios:
  - id: ungrounded_path
    vars:
      offender_count: 1
      offenders_omitted: 0
      offenders_sample: phantom.go:1 ("package phantom")
    expect_contains:
      - 'Rejected:'
      - 'Code: SYNTH_HANDLE_NOT_IN_LEGS'
