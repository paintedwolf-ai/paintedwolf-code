spec_version: "1.0"
id: TASK_DECISION_PENDING
kind: policy
on: tool.rejected
selector:
  tools:
    - task
requires_facts: [paintedwolf.child_session_id, paintedwolf.job_id, paintedwolf.next_steps, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "TASK_DECISION_PENDING"
effect: block
category: recoverable
emit: guard:coordinator
message: Cannot resume child_session_id {{ paintedwolf.child_session_id }} — job {{ paintedwolf.job_id }} still needs answer_decision
what: Child session `{{ paintedwolf.child_session_id }}` still has an unanswered `needs_decision` from job `{{ paintedwolf.job_id }}`.
cause: 'Resuming the child ignores the pending decision stash: the worker is waiting on the decision, not a new assignment.'
why: Re-queuing the same leg without answering restarts work that already escalated a choice; the host preserves the child for an answered resume.
fix: '{{ paintedwolf.next_steps }} The host resumes the worker automatically. Do not resume the same child until the decision is cleared.'
instead: Branch on Code; answer the pending decision before any child_session_id resume.
scenarios:
  - id: default
    vars:
      child_session_id: child-1
      job_id: job-1
