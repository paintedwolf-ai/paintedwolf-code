spec_version: "1.0"
id: SKILL_RESOURCE_UNKNOWN
kind: schema
on: tool.rejected
selector:
  tools:
    - skills_read
requires_facts: [paintedwolf.available, paintedwolf.name, paintedwolf.rejection_code, paintedwolf.resource, paintedwolf.unknown_target]
when: paintedwolf.rejection_code == "SKILL_RESOURCE_UNKNOWN"
effect: block
category: recoverable
emit: guard:skills_read
message: '{% if paintedwolf.available %}Skill {{ paintedwolf.name }} has no resource {{ paintedwolf.resource }}. Available: {{ paintedwolf.available }}{% else %}Skill {{ paintedwolf.name }} has no supporting resources (requested {{ paintedwolf.resource }}){% endif %}'
what: Skill {{ paintedwolf.name }} has no readable resource at {{ paintedwolf.resource }}.
cause: '{% if paintedwolf.available %}The path is not a regular bundled file listed for this skill.{% else %}Skill {{ paintedwolf.name }} has no supporting resource files; its full procedure is in SKILL.md.{% endif %}'
why: Skill resources are confined to their own directory and selected by exact relative path.
fix: '{% if paintedwolf.available %}Call skills_read for the skill instructions, then use one of its listed files: {{ paintedwolf.available }}{% else %}Follow the skill instructions from SKILL.md; omit resource when calling skills_read for {{ paintedwolf.name }}.{% endif %}'
instead: '{% if paintedwolf.available %}Branch on Code SKILL_RESOURCE_UNKNOWN; choose a listed skill resource{% else %}Branch on Code SKILL_RESOURCE_UNKNOWN; do not request a supporting resource for {{ paintedwolf.name }}{% endif %}'
scenarios:
  - id: default
    vars:
      name: verify-a-change
      resource: references/missing.md
      available:
        - references/failure-triage.md
      session_role: implement
      tool: skills_read
  - id: empty_available
    vars:
      name: prepare-a-release
      resource: references/missing.md
      available: []
      session_role: implement
      tool: skills_read
