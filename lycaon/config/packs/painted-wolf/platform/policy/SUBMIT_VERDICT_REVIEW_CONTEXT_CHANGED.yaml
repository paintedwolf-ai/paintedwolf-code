oar: '1.0'
id: SUBMIT_VERDICT_REVIEW_CONTEXT_CHANGED
kind: policy
anchor: tool.rejected
requires:
  facts: [paintedwolf.rejection_code]
  profiles: [tool]
when: paintedwolf.rejection_code == "SUBMIT_VERDICT_REVIEW_CONTEXT_CHANGED"
effect: block
copy:
  what: The review context changed after this submission was prepared.
  cause: The submitted revision does not identify the current reconciliation inputs.
  why: Existing accepted results remain recorded; their applicability is checked separately.
  fix: Read pack_board with review_view summary and reconcile the changed inputs before using its revision.
  instead: Reconcile the resulting evidence before resubmitting the verdict.
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:workflow
x-paintedwolf-message: Required review work is outstanding.
x-paintedwolf-scenarios:
- id: required
  vars: {}
  expect_contains: ['Code: SUBMIT_VERDICT_REVIEW_CONTEXT_CHANGED', 'review_view']
