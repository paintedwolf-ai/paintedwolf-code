oar: '1.0'
id: CITATION_REPAIR_INVALID
kind: invariant
anchor: coordinator.closeout_check
requires:
  facts:
    - paintedwolf.offender_count
    - paintedwolf.offenders_omitted
    - paintedwolf.offenders_sample
    - paintedwolf.reject_observation
when: paintedwolf.reject_observation == "citation_repair_invalid"
effect: block
copy:
  what: 'The host applied none of this citation repair: {{ paintedwolf.offenders_sample }}{% if paintedwolf.offenders_omitted %} +{{ paintedwolf.offenders_omitted }} more{% endif %}.'
  cause: 'A repair changes all its citations or none. `unknown_target` names no citation; `stale_target` names one from an earlier version; `duplicate_target` repeats one; `wrong_kind` replaces a link with a citation or a citation with a link; `outside_repair` was sent with no repair open; `citations_without_targets` lists citations with no `c1 =>` target; `narrative_changed` altered the retained text.'
  why: The retained answer is unchanged, and the host cannot guess which citation you meant.
  fix: 'Send one `[cite: c1 => read#5:42]` per rejected citation, using the IDs in the repair message, or `[cite: c2 => <https://example.test/observed-page>]` for a link. Or return the same answer with only its citations changed.'
  instead: Keep the retained text as it is. To change your conclusions, use an offered tool, then write a fresh report.
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator_synthesis
x-paintedwolf-evidence:
  ui_label: Citation repair
  ui_check_id: citation_repair
  in_session_retry: true
x-paintedwolf-message: The citation repair could not be applied
x-paintedwolf-scenarios:
  - id: unknown_target
    vars:
      offender_count: 1
      offenders_omitted: 0
      offenders_sample: c9 read#5:42 unknown_target
    expect_contains:
      - 'Rejected:'
      - 'Code: CITATION_REPAIR_INVALID'
      - unknown_target
      - '[cite: c1 =>'
