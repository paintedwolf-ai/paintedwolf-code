spec_version: "1.0"
id: COMMAND_SYNTAX_UNSUPPORTED
kind: policy
on: tool.rejected
selector:
  tools:
    - command
    - verify
requires_facts: [paintedwolf.diagnostic_pre_evaluation, paintedwolf.diagnostic_top_level, paintedwolf.expected_form, paintedwolf.parser_message, paintedwolf.rejection_code, paintedwolf.source_column, paintedwolf.source_line]
when: paintedwolf.rejection_code == "COMMAND_SYNTAX_UNSUPPORTED"
effect: block
category: recoverable
emit: guard:command_composition_redirect
message: command syntax unit was not admitted
what: 'Unsupported shell form{% if paintedwolf.source_line %} at {{ paintedwolf.source_line }}:{{ paintedwolf.source_column }}{% endif %}{% if paintedwolf.parser_message %}: {{ paintedwolf.parser_message }}{% else %}{% if paintedwolf.expected_form %}: {{ paintedwolf.expected_form }}{% endif %}{% endif %}.'
cause: '{% if paintedwolf.diagnostic_top_level %}The submitted source was refused before evaluation.{% else %}{% if paintedwolf.diagnostic_pre_evaluation %}This source unit did not execute. Earlier commands that finished still count.{% else %}Earlier commands that finished still count.{% endif %}{% endif %}'
fix: '{% if paintedwolf.expected_form %}Supported form: {{ paintedwolf.expected_form }}. Preserve the intended operation and earlier effects.{% endif %}'
instead: ''
scenarios:
  - id: captured_unit
    vars:
      tool: command
      source_line: 3
      source_column: 7
      expected_form: supported syntax
