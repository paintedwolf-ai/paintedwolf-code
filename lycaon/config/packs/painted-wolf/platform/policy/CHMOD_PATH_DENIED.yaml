spec_version: "1.0"
id: CHMOD_PATH_DENIED
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.operation, paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.operation == "chmod" && paintedwolf.rejection_code == "CHMOD_PATH_DENIED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:chmod
message: chmod path matches a hard deny glob
what: Permission changes are denied for {{ paintedwolf.path }}.
cause: The target crosses a host write-protection boundary.
why: Permission changes cannot bypass protected-path authority.
fix: Leave the protected target unchanged. A different path is appropriate only if it is the task’s actual intended target; another tool or matching write glob cannot override this floor.
instead: Branch on Code CHMOD_PATH_DENIED; preserve the protected-path boundary
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      profile: coordinator
      tool: chmod
