spec_version: "1.0"
id: GIT_COMMIT_NO_SESSION_AUTHORSHIP
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - git_commit
requires_facts: [paintedwolf.git_changed_path_count, paintedwolf.operation, paintedwolf.path_required, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "GIT_COMMIT_NO_SESSION_AUTHORSHIP"
effect: block
category: recoverable
emit: guard:tool
message: git_commit found no paths authored by this session
what: git_commit could not establish any paths authored by this session in the active root; {{ paintedwolf.git_changed_path_count }} changed paths were observed.
cause: No session-authored staging set was available from the ledger. This may reflect missing authorship evidence or no authored changes.
why: Absent authorship evidence does not prove that another actor changed every file, and it does not authorize staging the whole tree.
fix: Inspect the actual changes and commit authorization. Supply explicit paths only when committing those changes is intended and authorized; otherwise leave the tree unchanged.
instead: Branch on Code; pass paths or leave the tree alone
scenarios:
  - id: default
    vars:
      session_role: coordinator
      tool: git_commit
