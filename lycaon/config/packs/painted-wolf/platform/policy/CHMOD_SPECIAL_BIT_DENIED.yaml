oar: '1.0'
id: CHMOD_SPECIAL_BIT_DENIED
kind: schema
anchor: tool.rejected
selector:
  tool:
  - chmod
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.mode
when: paintedwolf.rejection_code == "CHMOD_SPECIAL_BIT_DENIED"
effect: block
copy:
  what: chmod rejected special permission bits in mode {{ paintedwolf.mode }}.
  cause: Setuid, setgid and sticky bits are outside this tool’s permitted modes.
  why: Special permission bits change execution or directory-access semantics beyond ordinary rwx permissions.
  fix: Use an ordinary allowed permission mode that satisfies the task. If special bits are actually required,
    report this limitation instead of substituting broader access.
  instead: Branch on Code CHMOD_SPECIAL_BIT_DENIED; do not request special permission bits
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:chmod
x-paintedwolf-message: chmod rejected setuid, setgid, or sticky bits
x-paintedwolf-scenarios:
- id: default
  vars:
    detail: bad args
    path: src/main.go
    profile: coordinator
    tool: chmod
  expect_contains:
  - 'Rejected:'
  - 'Code: CHMOD_SPECIAL_BIT_DENIED'
