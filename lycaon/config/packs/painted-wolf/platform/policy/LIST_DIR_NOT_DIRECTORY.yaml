spec_version: "1.0"
id: LIST_DIR_NOT_DIRECTORY
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.admitted_file_read_forms, paintedwolf.command_loader_call, paintedwolf.file_read_forms_loadable_without_schema, paintedwolf.operation, paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.operation == "list_dir" && paintedwolf.rejection_code == "LIST_DIR_NOT_DIRECTORY"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:list_dir
message: list_dir path is not a directory
what: The listing path {{ paintedwolf.path }} is not a directory.
cause: A listing traverses directories; the selected path names a file.
why: File content and directory membership are separate observations.
fix: '{% if paintedwolf.admitted_file_read_forms %}Read the selected file’s content inside command{% if paintedwolf.command_loader_call %} after loading it with {{ paintedwolf.command_loader_call }}{% endif %} ({{ paintedwolf.admitted_file_read_forms }}).{% else %}{% if paintedwolf.file_read_forms_loadable_without_schema %}Call {{ paintedwolf.command_loader_call }} to inspect its projected schema for file reads, or choose a reader offered on the current surface.{% else %}File content requires a reader offered on the current surface.{% endif %}{% endif %} For directory membership, list the intended parent directory instead.'
instead: Choose a directory to list, or use an offered file reader
x-paintedwolf-scenarios:
  - id: default
    vars:
      path: docs/README.md
      profile: explore_readonly
      tool: list_dir
  - id: command-leg
    vars:
      admitted_file_read_forms: [cat FILE, head FILE, 'sed -n 1,10p FILE']
      path: docs/README.md
      profile: explore_readonly
      tool: list_dir
    expect_contains:
      - cat FILE
