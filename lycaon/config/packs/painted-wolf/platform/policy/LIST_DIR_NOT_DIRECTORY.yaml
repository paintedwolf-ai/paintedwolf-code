spec_version: "1.0"
id: LIST_DIR_NOT_DIRECTORY
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.admitted_file_read_forms, paintedwolf.operation, paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.operation == "list_dir" && paintedwolf.rejection_code == "LIST_DIR_NOT_DIRECTORY"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:list_dir
message: list_dir path is not a directory
what: The listing path {{ paintedwolf.path }} is not a directory.
cause: A listing traverses directories; the selected path names a file.
why: File content and directory membership are separate observations.
fix: '{% if paintedwolf.admitted_file_read_forms %}Read the selected file’s content with {{ paintedwolf.admitted_file_read_forms }} inside command.{% else %}File content requires a reader offered on the current surface.{% endif %} For directory membership, list the intended parent directory instead.'
instead: Choose a directory to list, or use an offered file reader
x-paintedwolf-scenarios:
  - id: default
    vars:
      path: docs/README.md
      profile: explore_readonly
      tool: list_dir
  - id: command-leg
    vars:
      admitted_file_read_forms: '`cat`, `head`, or `sed -n`'
      path: docs/README.md
      profile: explore_readonly
      tool: list_dir
    expect_contains:
      - '`cat`'
