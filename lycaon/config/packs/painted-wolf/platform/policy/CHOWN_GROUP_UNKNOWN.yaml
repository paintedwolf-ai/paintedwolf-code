spec_version: "1.0"
id: CHOWN_GROUP_UNKNOWN
kind: schema
on: tool.rejected
selector:
  ledger:
    paintedwolf.operation:
      - chown
requires_facts: [paintedwolf.operation, paintedwolf.ownership_field, paintedwolf.ownership_gid, paintedwolf.ownership_target, paintedwolf.ownership_uid, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "CHOWN_GROUP_UNKNOWN"
effect: block
category: recoverable
emit: guard:chown
message: chown:chown group name not found
what: The requested group {{ paintedwolf.ownership_target }} is unavailable for chown.
cause: Host account lookup could not resolve this group.
why: This host permits only its current user ID {{ paintedwolf.ownership_uid }} and group ID {{ paintedwolf.ownership_gid }}.
fix: Use current or the exact permitted identity only when that matches the requested ownership change. Otherwise report the limitation; do not guess another account, elevate the host, or switch tools to bypass it.
instead: Branch on Code CHOWN_GROUP_UNKNOWN; retain the current-identity boundary
scenarios:
  - id: default
    vars:
      detail: bad args
      path: scripts/run.sh
      profile: implement
      tool: chown
