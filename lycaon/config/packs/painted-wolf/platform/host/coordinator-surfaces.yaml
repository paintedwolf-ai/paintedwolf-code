# Coordinator tool surfaces.
# Each surface offers its floor on every model call. loadable names the tools
# the turn may add: the turn decision loads the ones the request needs,
# request_tools loads what the model describes, and loaded tools stand until
# the prompt cache goes cold. Resource families load together. Whatever is
# loadable but not loaded stays requestable, so loadable surfaces carry
# request_tools on the floor.
# Overlay inspection belongs on promotion and synthesis surfaces.
# Workflow delegations use delegate_dispatch; ambient work uses task.
# exit selects report, verdict, plan, or none. prose_finish lets a turn end
# with grounded prose to the person.
# mode_ref selects the base coordinator prompt.

implement_routing:
  activity_label: Planning next steps
  mode_ref: implement-routing
  card:
    label: orchestrate
    rule: No product writes this turn.
  exit: none
  prose_finish: true
  floor: [recall, task, worker_cancel, answer_decision, extend_worker_budget, decline_worker_budget, update_progress, promote_overlay, pack_board, list_dir, web_search, fetch_url, wait, scan_query, scan_summary, scan_list, scan_compare, ask_user, surface_note, request_tools]

implement_dispatch:
  activity_label: Starting workers
  mode_ref: implement-dispatch
  card:
    label: orchestrate
    rule: No product writes this turn.
  exit: none
  floor: [recall, task, worker_cancel, answer_decision, extend_worker_budget, decline_worker_budget, update_progress, promote_overlay, reject_overlay, wait, ask_user, submit_verdict, surface_note]

# Report assembly surface.
implement_synthesis:
  activity_label: Putting it together
  mode_ref: implement-synthesis
  card:
    label: wrapup
    rule: One user report from receipts in this chat.
  exit: report
  prose_finish: true
  floor: [recall, read, grep, find, jq, list_dir, survey_repo, summarize, scan_pack, web_search, fetch_url, render_view, view_image, view_video, update_progress, scan_query, scan_summary, scan_list, scan_compare]

orchestrate_plan:
  activity_label: Planning worker legs
  mode_ref: workflow-orchestrate
  exit: plan
  floor: [recall, read, grep, find, jq, list_dir, survey_repo, summarize, web_search, fetch_url, scan_pack, scan_query, scan_summary, scan_list, scan_compare, fanout_plan, workflow_advance, ask_user, surface_note, request_tools]

# Reconcile chooses report or deeper investigation.
recon_reconcile:
  activity_label: Reconciling scout findings
  mode_ref: workflow-orchestrate
  exit: none
  floor: [recall, read, grep, jq, list_dir, summarize, pack_board, workflow_transition, ask_user, surface_note]

# Pending overlays block new dispatch.
implement_overlay_promote:
  activity_label: Combining results
  mode_ref: implement-overlay-promote
  card:
    label: integrate
    rule: Land or reject pending overlays before new dispatch.
  exit: none
  # skills_read resolves a described need and opens one procedure.
  floor: [recall, promote_overlay, reject_overlay, preview_overlay, worker_cancel, answer_decision, extend_worker_budget, decline_worker_budget, update_progress, task, pack_board, read, grep, jq, list_dir, survey_repo, summarize, skills_read, web_search, fetch_url, http_request, process_list, process_signal, command, verify, secret_generate, secret_list, secret_revoke, wait, scan_query, scan_summary, scan_list, terminal_open, terminal_send, terminal_read, terminal_snapshot, terminal_close, ask_user, surface_note, request_tools]
  # Visual and browser checks load when the landed change needs them.
  loadable: [render_view, view_image, view_video, capture_page, measure_page, page_open, page_act, page_snapshot, page_close]

# The open-intent surface: read the project on the floor, load everything
# else per turn.
implement_investigate:
  activity_label: Exploring the project
  mode_ref: implement-investigate
  card:
    label: investigate
    rule: Empty assistant text while tools run.
  exit: report
  prose_finish: true
  floor:
    - recall
    - read
    - grep
    - summarize
    - skills_read
    - find
    - list_dir
    - update_progress
    - ask_user
    - surface_note
    - request_tools
  loadable:
    # project utilities
    - survey_repo
    - jq
    - stat
    - wc
    # edit
    - write
    - edit
    - replace_lines
    - restore_version
    - code_rewrite
    - jq_edit
    - diff
    - source_history
    - delete
    - copy
    - move
    - mkdir
    - chmod
    - chown
    - extract_archive
    # process and terminal
    - command
    - command_output
    - command_stop
    - process_list
    - process_signal
    - verify
    - wait
    - terminal_open
    - terminal_send
    - terminal_read
    - terminal_snapshot
    - terminal_close
    # git
    - git_status
    - git_diff
    - git_log
    - git_show
    - git_blame
    - git_ref
    - git_branches
    - git_compare
    - git_commit
    - git_restore
    - git_checkout
    - git_merge
    - git_stash
    - git_stash_list
    # visual and browser
    - render_view
    - view_image
    - view_video
    - capture_page
    - measure_page
    - page_open
    - page_act
    - page_snapshot
    - page_close
    # secrets and http
    - secret_generate
    - secret_list
    - secret_revoke
    - http_request
    # web
    - web_search
    - fetch_url
    # scan
    - scan_pack
    - scan_query
    - scan_summary
    - scan_list
    - scan_compare
    # workers
    - task
    - pack_board
    - worker_cancel
    - answer_decision
    - extend_worker_budget
    - decline_worker_budget

# Worker-wait surface. The wait loop re-enters on every worker event, so the
# floor stays closed: no request_tools, nothing loadable, no eager MCP.
implement_park:
  activity_label: Waiting for workers
  mode_ref: implement-park
  card:
    label: waiting on workers
  exit: none
  floor: [recall, task, pack_board, wait, worker_cancel, answer_decision, extend_worker_budget, decline_worker_budget, update_progress, ask_user, surface_note]

