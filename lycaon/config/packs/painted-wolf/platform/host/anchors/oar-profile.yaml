 - name: paintedwolf.denial_subject
   type: string
   observation: Kind of resource a classified refusal named (unmediated, direct_connect, path, socket, listen, loopback_connect); empty when none was named.
 - name: paintedwolf.confine_signals
   type: list<string>
   observation: Closed tokens observed at the confinement boundary (name_resolution_denied, write_denied, socks_proxy, proxy_door_unused, grant and deny outcomes); empty when none were observed.
 - name: paintedwolf.failed_stages
   type: list<string>
   observation: Command lines of the finished invocation's failed stages; empty when all succeeded, while it runs, or when the invocation spawned no process.
 - name: paintedwolf.process_running
   type: bool
   observation: True when the invocation's process was still running when observed.
 - name: paintedwolf.sandbox_refusals
   type: list<string>
   observation: Each operation the kernel reported refusing the invocation's processes, as operation, target, and process; empty when none was reported or the host cannot read the reports.
 - name: paintedwolf.refused_write_paths
   type: list<string>
   observation: Paths the kernel refused the invocation's processes for writing, at any layer; empty when none.
 - name: paintedwolf.refused_write_grants
   type: list<string>
   observation: The capability_request.write_root path whose approval would open each refused write path that a reviewed grant can open; empty when none.
 - name: paintedwolf.refused_read_paths
   type: list<string>
   observation: Paths the kernel refused the invocation's processes for reading, at any layer; empty when none.
 - name: paintedwolf.refused_read_grants
   type: list<string>
   observation: The capability_request.read_path path whose approval would open each refused read path that a reviewed grant can open; empty when none.
 - name: paintedwolf.receiving_tool_summarize
   type: bool
   observation: The receiving tool identity is summarize.
 - name: paintedwolf.refused_terminal_read_paths
   type: list<string>
   observation: Kernel-observed read paths whose floor no approval opens.
 - name: paintedwolf.refused_terminal_write_paths
   type: list<string>
   observation: Kernel-observed write paths whose floor no approval opens.
 - name: paintedwolf.sandbox_refusal_witness
   type: string
   observation: The confinement reporting layer's declared witness (kernel, incomplete, or unavailable); empty without an observed invocation.
 - name: paintedwolf.refused_socket_paths
   type: list<string>
   observation: Unix socket paths the kernel refused the invocation's processes a connection to; empty when none.
 - name: paintedwolf.refused_connect_ports
   type: list<string>
   observation: Ports of TCP or UDP connections the kernel refused the invocation's processes; the kernel does not name the peer address. Empty when none.
 - name: paintedwolf.refused_listen_ports
   type: list<string>
   observation: Ports the kernel refused the invocation's processes a listener on; empty when none.
 - name: paintedwolf.refused_signals
   type: list<string>
   observation: Signal deliveries the kernel refused the invocation's processes to processes outside their boundary; empty when none.
 - name: paintedwolf.unsandboxed_refusals
   type: list<string>
   observation: Operations the kernel refused the invocation's processes that no sandbox capability admits, as operation, target, and process; empty when none.
 - name: paintedwolf.worktree_stale_paths
   type: list<string>
   observation: Agent-policy files, relative to the write root, whose Git index entry the command changed while the worktree kept the clean content it had before; empty when the index did not change or no Git repository applies.
 - name: paintedwolf.worktree_leftover_paths
   type: list<string>
   observation: Agent-policy files, relative to the write root, the command removed from the Git index while the worktree kept the file; empty when none.
 - name: paintedwolf.worktree_conflict_paths
   type: list<string>
   observation: Agent-policy files, relative to the write root, that gained unmerged Git index stages during the command; empty when none.
 - name: paintedwolf.credential_length
   type: int
   observation: Number of Unicode scalar values in the literal candidate at credential.assignment.
 - name: paintedwolf.credential_distinct_words
   type: int
   observation: Count of distinct case-folded words split on whitespace, hyphen, underscore, dot, and comma.
 - name: paintedwolf.credential_longest_run
   type: int
   observation: Longest unbroken run of letters, digits, hyphen, underscore, plus, slash, and equals in the literal candidate.
 - name: paintedwolf.credential_run_classes
   type: int
   observation: Number of lower-case, upper-case, and digit classes in the longest run; equal-length ties take the larger class count.
 - name: paintedwolf.credential_fingerprint
   type: string
   observation: Device HMAC fingerprint of the candidate literal, never its plaintext. Provider failure if the device fingerprinter is unavailable.
 - name: paintedwolf.credential_ignored
   type: bool
   observation: Whether the exact candidate is classified as non-secret under current project and device decisions. Protected evidence takes precedence.
 - name: paintedwolf.credential_harvested
   type: bool
   observation: Whether the root session's harvest contains the candidate fingerprint. Provider failure if provenance lookup is unavailable.
 - name: paintedwolf.editorconfig_mismatch
   type: bool
   observation: True when a landed text write broke a rule its .editorconfig chain declares on lines the write inserted or rewrote; false when no rule is declared or the chain could not be read.
 - name: paintedwolf.host_resource_status_for
