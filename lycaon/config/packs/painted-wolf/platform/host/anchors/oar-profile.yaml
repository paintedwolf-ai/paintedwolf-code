# Painted Wolf Code's Open Agent Rules capability document.
#
# What this host provides: which core anchors it implements and under which
# local names, which capability profiles it claims *whole*, every host-tier fact
# it publishes with its type, and the limits it evaluates under. A rule author,
# and a conformance runner, can read this and know what will load before
# attempting it.
#
# Schema: schemas/oar/oar-capability.schema.json (vendored from openagentrules.org)
# Normative: [OAR-FACT-21], [OAR-FACT-24], [OAR-PROF-2], [OAR-PROF-3]
#
# host_facts is checked against internal/oar/catalogue.go by
# TestCapabilityDocumentMatchesCatalogue — a fact added to the engine without
# being declared here fails the build, and vice versa.

oar_capability_version: "1.0"
host: paintedwolf

anchors:
  # Core anchor id -> the local catalog anchor that implements it.
  core:
    tool.pre_invoke: tool.pre_invoke
    tool.handler: tool.handler
    tool.post_invoke: tool.post_invoke
    agent.post_turn: coordinator.post_turn
    agent.finalize: worker.finalize
    model.input: content.input
    model.output: content.output
    model.tool_result: content.tool_result

  unsupported: []
  host:
    - coordinator.pre_invoke
    - session.pre_invoke
    - coordinator.post_turn
    - coordinator.closeout_check
    - worker.finalize
    - worker.report_check
    - content.input
    - content.output
    - content.tool_result
    - credential.assignment
    - tool.rejected

profiles:
  - content-provenance
  - content
  - secrets
  - filesystem
  - mcp
  - session
  - tool

# Steps `flow` matches against, oldest first ([OAR-FACT-12], [OAR-PROF-3]).
activity_window: 16

# Host-registered detectors for secret observations. Conformance corpus reserves
# its own detector refs separately; this host ships secretmatch.
detectors:
  - detector://secretmatch

# Content mutation is implemented: accumulated transforms apply in evaluation
# order against original-coordinate spans ([OAR-OPS-13]–[OAR-OPS-21]).
supports_transform: true

expression_nodes_max: 256

