# Local worker execution plane.
poller:
  max_concurrency: 32
  maintenance_interval_ms: 5000
executor:
  instance_id: auto
  default_execution_target: local
# How many tool-less responses a worker round tolerates, and when its
# coordinator hears about a long or quiet round.
rounds:
  # Consecutive tool-less responses before the round fails with report_missing.
  toolless_response_bound: 3
  # Model calls in one round before the first consumption notice; later
  # notices follow at each doubling.
  consumption_notice_model_calls: 40
  # Time without durable progress before the first quiet notice; later
  # notices follow at each doubling.
  quiet_notice_after_ms: 600000
