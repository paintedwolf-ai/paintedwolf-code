# Inform Binding. Anchor catalog is lifecycle SSOT.
'on': project.roots.changed
selector:
  surface: coordinator
effect: inform
render: coordinator-roots-changed
tier: builtin
invariants:
  trigger_class: host_api
  fires_in:
  - Root attach, detach or patch that adds, removes, renames or changes the primary folder
  - Draft promotion relabeling @Draft to the destination folder basename
  - A session's active folder change, including the primary fallback after a detach
