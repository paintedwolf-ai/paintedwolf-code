# Inform Binding. Anchor catalog is lifecycle SSOT.
'on': coordinator.report.document
selector:
  surface: coordinator
effect: inform
render: coordinator-report-document
tier: builtin
invariants:
  trigger_class: tool_rejection
  fires_in:
  - run report rejected for document fields it still owes (in-session retry with its own
    budget; exhaustion delivers the report marked as not accepted)
  required:
  - report fence
  - findings
  - set_asides
  forbidden:
  - workflow_advance
