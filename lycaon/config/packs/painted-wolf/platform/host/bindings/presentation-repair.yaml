# Inform Binding. Anchor catalog is lifecycle SSOT.
'on': coordinator.presentation.repair
selector:
  surface: coordinator
effect: inform
render: coordinator-presentation-repair
tier: builtin
invariants:
  trigger_class: tool_rejection
  fires_in:
