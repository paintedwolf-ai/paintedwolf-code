surfaces: [http]
notification: { tier: non_catastrophic, scope: app }
context_schema:
  optional:
    - provider_id
title: Could not read tool pins
message: >-
  The device tool-definition pin state could not be read. This provider's
  tools stay at their last published generation.
suggested_action: Check that the config directory is readable, then try again.
scenarios:
  - id: default
    vars: {}
    expect_contains:
      - pin state
      - last published
