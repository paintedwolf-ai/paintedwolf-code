surfaces: [http]
notification: { tier: non_catastrophic, scope: app }
context_schema:
  optional:
    - reason
title: This extension change was rejected
message: "{{ reason }}"
suggested_action: >-
  Check the pack's manifest, version range, and dependencies, then try again.
scenarios:
  - id: default
    vars:
      reason: >-
        extensions install: source https://example.com/pack.git has no valid
        compatible releases: v1.0.0: pack requires extension API ^2.0.0; host
        provides 1.0.0
    expect_contains:
      - extension API
