surfaces: [http]
notification: { tier: non_catastrophic, scope: session }
title: Secret use has expired
message: >-
  This secret's agent-use deadline has passed, so its reference cannot be
  attached or resolved until the deadline changes.
suggested_action: >-
  Open the project's secret settings, choose a new agent-use deadline, then
  attach the reference again.
scenarios:
  - id: default
    vars: {}
    expect_contains:
      - agent-use deadline has passed
      - choose a new agent-use deadline
