surfaces: [http]
notification: { tier: non_catastrophic, scope: session }
context_schema:
  optional:
    - reason
title: Command not available
message: >-
  This command was not run: {{ reason }}
suggested_action: >-
  Try it again from the editor with the file open, or check the pack's settings
  under Settings → Extensions.
scenarios:
  - id: default
    vars:
      reason: a writing editor action requires the tracked document revision
    expect_contains:
      - document revision
