surfaces:
  - worker_failure
notification: { tier: non_catastrophic, scope: session }
title: Worker workspace storage full
message: >-
  {% if reason == "capacity_preflight" -%}
  Preparing this round's isolated workspace requires about {{ required }}, but
  the application-data volume has only {{ available }} available. No worker
  changes were applied to the project.
  {%- else -%}
  The application-data volume ran out of available space while preparing this
  round's isolated workspace. No worker changes were applied to the project.
  {%- endif %}
suggested_action: >-
  Free space or clear retained worker workspaces in Settings so the coordinator
  can instruct the worker again.
scenarios:
  - id: generic
    vars: {}
  - id: capacity_preflight
    vars:
      reason: capacity_preflight
      required: 30.0 GiB
      available: 12.0 GiB
