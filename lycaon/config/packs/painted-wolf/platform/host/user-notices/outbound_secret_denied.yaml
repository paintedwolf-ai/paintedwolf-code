surfaces: [http]
notification: { tier: non_catastrophic, scope: session }
title: Outbound secret blocked
message: >-
  A value matching {{ rule_title }} was detected in an outbound request and you
  declined to send it. The request was not sent.
suggested_action: Remove the secret from the request, or approve sending it if you intended to.
scenarios:
  - id: web_search
    vars:
      surface: web_search
      rule_title: AWS access key ID
      host: brave
      hint: 'AKIA…(20)'
    expect_contains:
      - AWS access key ID
      - declined
      - not sent
  - id: fetch_url
    vars:
      surface: fetch_url
      rule_title: AWS access key ID
      host: example.com
      hint: 'AKIA…(20)'
    expect_contains:
      - declined
      - not sent
  - id: mcp
    vars:
      surface: mcp
      rule_title: OpenAI API key
      host: fixture
      hint: 'sk-s…(51)'
    expect_contains:
      - OpenAI API key
      - declined
