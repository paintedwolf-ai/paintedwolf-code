surfaces: [http]
notification: { tier: non_catastrophic, scope: app }
context_schema:
  optional:
    - provider_id
title: Sign-in did not finish
message: >-
  The authorization server did not complete sign-in for this MCP provider.
suggested_action: >-
  Confirm the provider is reachable and try Sign in again. If it keeps failing,
  sign out and start over, or use the provider's documented redirect setup.
scenarios:
  - id: default
    vars: {}
    expect_contains:
      - authorization
      - Sign in
