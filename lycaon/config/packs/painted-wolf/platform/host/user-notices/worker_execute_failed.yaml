surfaces:
  - worker_failure
notification: { tier: non_catastrophic, scope: session }
title: Worker round could not finish
message: >-
  This round stopped before returning a report to the coordinator. Work saved
  in the worker's workspace is kept, and the coordinator can instruct the
  worker again.
suggested_action: >-
  Open the worker to see where this round stopped, or ask in chat to continue
  from its current state.
scenarios:
  - id: generic
    vars: {}
