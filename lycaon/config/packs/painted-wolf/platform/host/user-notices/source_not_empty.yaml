surfaces: [http]
notification: { tier: non_catastrophic, scope: session }
title: Folder is not empty
message: >-
  That folder still has files or subfolders inside it, so it wasn't moved to
  Trash.
suggested_action: Confirm you want to move the whole folder, or empty it first.
scenarios:
  - id: default
    vars: {}
    expect_contains:
      - not empty
      - Trash
