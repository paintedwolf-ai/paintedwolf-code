surfaces: [http]
notification: { tier: non_catastrophic, scope: session }
title: Credential stores stay out of the jail
message: >-
  That path sits on or above a credential store (SSH keys, cloud CLIs, the app
  config directory, and similar). It cannot be a project folder or a durable
  write grant.
suggested_action: Pick a project directory that does not contain or sit above credential stores.
scenarios:
  - id: default
    vars: {}
    expect_contains:
      - credential store
      - project directory
