surfaces: [http]
notification: { tier: non_catastrophic, scope: project }
title: Confirmation request expired
message: >-
  This one-time confirmation request expired or had already been used. No
  secret was stored or released.
suggested_action: >-
  Try again and complete the operating-system authentication prompt.
scenarios:
  - id: default
    vars: {}
    expect_contains:
      - expired or had already been used
      - complete the operating-system authentication prompt
