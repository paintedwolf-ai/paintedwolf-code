surfaces: [http]
notification: { tier: non_catastrophic, scope: project }
title: Confirmation is unavailable
message: >-
  This app session has no trusted operating-system authenticator connected to
  the engine, so it cannot store or release secrets.
suggested_action: >-
  Open the installed desktop app and try again. Confirmation is unavailable
  when the app is attached to a separately started development engine.
scenarios:
  - id: default
    vars: {}
    expect_contains:
      - no trusted operating-system authenticator
