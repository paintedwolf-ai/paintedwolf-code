surfaces: [http]
notification: { tier: non_catastrophic, scope: project }
title: Secret reveal request expired
message: >-
  This one-time reveal request expired or had already been used. The stored
  value was not released.
suggested_action: >-
  Choose Reveal again and complete the operating-system authentication prompt.
scenarios:
  - id: default
    vars: {}
    expect_contains:
      - expired or had already been used
      - Choose Reveal again
