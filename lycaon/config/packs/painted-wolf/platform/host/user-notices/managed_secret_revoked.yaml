surfaces: [http]
notification: { tier: non_catastrophic, scope: session }
title: Secret is revoked
message: >-
  This secret was revoked, and revoking is permanent. Its reference will never
  resolve again, so it cannot be renamed, given a new deadline, or given a new
  value.
suggested_action: >-
  Add a new secret and update whatever was using the old reference.
scenarios:
  - id: default
    vars: {}
    expect_contains:
      - permanent
      - Add a new secret
