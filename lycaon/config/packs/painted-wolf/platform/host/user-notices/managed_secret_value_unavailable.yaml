surfaces: [http]
notification: { tier: non_catastrophic, scope: project }
title: Secret has no readable value
message: >-
  This secret's name, purpose, and history are intact, but its current protected
  value cannot be read, so nothing can be resolved or revealed from it.
suggested_action: >-
  Set a new value for this secret to repair it under the same reference.
scenarios:
  - id: default
    vars: {}
    expect_contains:
      - cannot be read
      - same reference
