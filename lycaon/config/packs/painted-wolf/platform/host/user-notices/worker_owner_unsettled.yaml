surfaces:
  - worker_failure
notification: { tier: non_catastrophic, scope: session }
title: Worker round subsystem did not settle
message: >-
  A subsystem owner in this round ran and could not commit its outcome.
  The isolated workspace was already prepared; this is not a workspace-setup
  failure, and work saved in the workspace is kept.
suggested_action: >-
  Open the worker to see which tool call could not settle; the coordinator can
  instruct the worker again once ready.
scenarios:
  - id: generic
    vars: {}
