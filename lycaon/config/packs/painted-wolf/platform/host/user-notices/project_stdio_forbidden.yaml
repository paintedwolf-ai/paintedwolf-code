surfaces: [http]
notification: { tier: non_catastrophic, scope: project }
context_schema:
  optional:
    - provider_id
title: This project cannot run a local MCP program
message: >-
  A project overlay may not start a stdio MCP provider. Local programs are a
  device setting.
suggested_action: >-
  Add the provider under Settings → MCP providers, or use a loopback HTTP
  URL from the project.
scenarios:
  - id: default
    vars: {}
    expect_contains:
      - stdio
      - device
