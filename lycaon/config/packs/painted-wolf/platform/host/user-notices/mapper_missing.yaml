surfaces: [http]
notification: { tier: non_catastrophic, scope: session }
title: Scanner needs a results mapper
message: >-
  This scanner entry names no mapper, so its output cannot be read into findings.
suggested_action: >-
  Add a mapper to the entry, or use a scanner that emits SARIF directly.
scenarios:
  - id: default
    vars: {}
    expect_contains:
      - no mapper
      - SARIF
