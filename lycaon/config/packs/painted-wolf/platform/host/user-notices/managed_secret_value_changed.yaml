surfaces: [http]
notification: { tier: non_catastrophic, scope: project }
title: Secret changed during authentication
message: >-
  The stored value changed after this request began, so the completed
  authentication no longer authorizes it. No value was released.
suggested_action: >-
  Try again to authenticate for the current version.
scenarios:
  - id: default
    vars: {}
    expect_contains:
      - no longer authorizes it
      - current version
