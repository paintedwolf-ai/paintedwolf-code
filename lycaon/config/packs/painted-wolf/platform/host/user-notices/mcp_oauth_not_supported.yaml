surfaces: [http]
notification: { tier: non_catastrophic, scope: app }
context_schema:
  optional:
    - provider_id
title: Sign in is not used for this provider
message: >-
  This MCP provider authenticates with a static token, not a browser sign-in.
suggested_action: >-
  Paste the token the provider documents into the Bearer field, then enable
  the provider and test the connection.
scenarios:
  - id: default
    vars: {}
    expect_contains:
      - token
      - Bearer
