  - id: deno
    family: runtimes
    label: Deno
    category: Runtimes
    description: Deno JavaScript and TypeScript runtime available on this device.
    docs_url: https://docs.deno.com/
    surfaces: [process_exec]
    realizations:
      - discover:
          executable:
            names: [deno]
        connections:
          - mode: proxy
  - id: docker
    family: containers.local
    label: Docker
    category: Containers
    description: Docker client with a reachable local daemon available on this device.
    docs_url: https://docs.docker.com/
    surfaces: [process_exec]
    realizations:
      - platforms: [macos, linux]
        discover:
          all:
            - executable:
                names: [docker]
            - path:
                kind: socket
                paths:
                  - "{home}/.docker/run/docker.sock"
                  - "{home}/.colima/default/docker.sock"
                  - "{home}/.rd/docker.sock"
                  - "{home}/.orbstack/run/docker.sock"
                  - "{runtime_dir}/docker.sock"
                  - "/var/run/docker.sock"
                capture: daemon_socket
        connections:
          - mode: local_service
            transport: unix_socket
            target_from: daemon_socket
        write_roots:
          - "{home}/.docker/buildx"
      - platforms: [windows]
        discover:
          all:
            - executable:
                names: [docker]
            - named_pipe:
                names: ['\\.\pipe\docker_engine']
                capture: daemon_pipe
        connections:
          - mode: local_service
            transport: named_pipe
            target_from: daemon_pipe
        write_roots:
          - "{home}/.docker/buildx"
