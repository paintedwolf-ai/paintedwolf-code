steps:
  - when: "size(paintedwolf.live_terminal_ids) > 0"
    tool: "terminal_close"
    pick:
      id: "paintedwolf.live_terminal_ids"
    say: "Use {{ call }} for an existing terminal id."
  - when: "size(paintedwolf.live_command_handles) > 0"
    tool: "command_stop"
    pick:
      handle: "paintedwolf.live_command_handles"
    say: "Use {{ call }} for an existing command handle."
