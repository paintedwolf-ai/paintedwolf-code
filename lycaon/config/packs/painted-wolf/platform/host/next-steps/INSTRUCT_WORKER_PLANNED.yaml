steps:
  - when: "paintedwolf.workflow_work_id != ''"
    tool: "task"
    args:
      workflow_work_id: "{{ paintedwolf.workflow_work_id }}"
    complete: true
    say: "Start the planned leg with {% if load %}{{ load }}, then {% endif %}{{ call }}."
    otherwise: "It starts when its planned leg is started."
