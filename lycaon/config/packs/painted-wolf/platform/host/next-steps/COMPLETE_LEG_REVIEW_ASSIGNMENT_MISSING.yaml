steps:
  - when: "paintedwolf.workflow_work_id != ''"
    tool: "request_decision"
    say: "Use {{ call }} to ask the coordinator to start {{ paintedwolf.workflow_work_id }} as a new review assignment."
    otherwise: "Report that {{ paintedwolf.workflow_work_id }} needs a new review assignment."
  - when: "paintedwolf.workflow_work_id == ''"
    tool: "request_decision"
    say: "Use {{ call }} to ask the coordinator to start the review assignment with its work identity."
    otherwise: "Report that the review assignment needs to be started with its work identity."
