steps:
  - tool: "view_image"
    args:
      path: "{{ paintedwolf.path }}"
    complete: true
    say: "For a still image or an animated GIF, use {{ call }}."
    otherwise: "Inspect {{ paintedwolf.path }} with a tool that matches its container format."
  - program: ["cat", "{{ paintedwolf.path }}"]
    complete: true
    say: "For text, use {{ call }}."
