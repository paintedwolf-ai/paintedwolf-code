steps:
  - tool: "task"
    args:
      scope.mode: "read"
    say: "For read-only survey or review, use {{ call }} with a read-only profile."
    otherwise: "Use a read-only profile for survey, or pass scope.mode: write when starting or instructing a mutation-capable worker."
  - tool: "task"
    args:
      agent_type: "{{ paintedwolf.agent_type }}"
      scope.mode: "write"
    say: "For file edits or host mutations, pass `scope.mode: write` on {{ call }} (or on `instruct_worker` when switching an existing worker to a mutation-capable profile). Optional paths may guide focus."
