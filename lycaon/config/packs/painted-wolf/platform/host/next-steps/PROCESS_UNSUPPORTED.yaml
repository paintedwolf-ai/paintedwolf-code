steps:
  - when: 'paintedwolf.admitted_process_capability_fields != ""'
    tool: "command"
    say: "Use {{ call }} with the required {{ paintedwolf.admitted_process_capability_fields }} field, describing the exact intended operation."
    otherwise: "This request cannot run host process commands; report the unsupported process operation."
  - when: 'paintedwolf.admitted_process_capability_fields == "" && paintedwolf.command_loadable_without_schema'
    tool: "request_tools"
    args:
      need: "command"
    complete: true
    say: "Call {{ call }}. Its schema arrives on the next model call; check whether it admits process capability fields before retrying."
