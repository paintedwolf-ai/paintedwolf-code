# Read protocol only; transient unlock/session lifecycle supports normal desktop reads.
version: 1
services:
  - name: org.freedesktop.secrets
    paths: [/org/freedesktop/secrets]
    interfaces:
      org.freedesktop.Secret.Service:
        methods:
          - {name: OpenSession, signatures: ["sv"], role: open_session}
          - {name: SearchItems, signatures: ["a{ss}"], role: read}
          - {name: GetSecrets, signatures: ["aoo"], role: session_read}
          - {name: ReadAlias, signatures: ["s"], role: read}
          - {name: Unlock, signatures: ["ao"], role: unlock}
      org.freedesktop.Secret.Collection:
        methods:
          - {name: SearchItems, signatures: ["a{ss}"], role: read}
      org.freedesktop.Secret.Item:
        methods:
          - {name: GetSecret, signatures: ["o"], role: session_read}
      org.freedesktop.Secret.Session:
        methods:
          - {name: Close, signatures: [""], role: session_close}
      org.freedesktop.Secret.Prompt:
        methods:
          - {name: Prompt, signatures: ["s"], role: prompt}
          - {name: Dismiss, signatures: [""], role: prompt}
        signals: [Completed]
      org.freedesktop.DBus.Properties:
        methods:
          - {name: Get, signatures: ["ss"], role: property_read}
          - {name: GetAll, signatures: ["s"], role: property_read}
        signals: [PropertiesChanged]
      org.freedesktop.DBus.Introspectable:
        methods:
          - {name: Introspect, signatures: [""], role: read}
