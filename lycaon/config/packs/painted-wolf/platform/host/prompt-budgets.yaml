# Prompt limits. Rendered prompt sizes are UTF-8 bytes measured with fixture
# variables. Model ceilings, attachment caps, and the perception window are
# runtime limits.
version: 1
sizes:
    # Rendered prompt bytes per category. Every prompt past its limit needs an
    # exception; the report warns when a change edits a prompt past its
    # warning line.
    limits:
        worker_personas: {warn: 16000, limit: 20000}
        coordinator_tripartite: {warn: 30000, limit: 36000}
        coordinator_injects: {warn: 4000, limit: 6000}
        agent_templates: {warn: 6000, limit: 8000}
        kicks: {warn: 1500, limit: 3000}
        units: {warn: 2500, limit: 4000}
        coordinator_tool_surfaces: {warn: 32000, limit: 40000}
        worker_tool_surfaces: {warn: 32000, limit: 40000}
    # Each exception admits one prompt up to its cap, with room for ordinary
    # edits, for a reason a reviewer can weigh.
    exceptions:
        coordinator_tool_surfaces:
            implement_overlay_promote:
                cap: 82000
                reason: The integration surface lands or rejects worker overlays and verifies them, so its floor carries overlay, command, verification, terminal, secret, and scan tools.
        worker_tool_surfaces:
            implement:
                cap: 68000
                reason: The only worker profile that runs commands; it keeps command, verification, and terminal tools sticky beside the file editing tools.
        worker_personas:
            implementer:
                cap: 36000
                reason: The worker that implements changes; it alone carries the implement shell archetype and the implement addenda playbook.
        kicks:
            coordinator-process-finished:
                cap: 6000
                reason: Embeds the terminal command envelope, which the fixture renders at its 5,400-byte bound.
            coordinator-process-refused:
                cap: 6000
                reason: Embeds the command refusal envelope, which the fixture renders at its 5,400-byte bound.
absolute_maximums:
    model: accounts/fireworks/models/kimi-k2p7-code
    model_context_window_tokens: 262144
    reserved_session_tokens: 224000
prompt_attachments:
    composer:
        auto_attach_paste_bytes: 16384
        max_inline_text_bytes: 65536
    counts:
        max_attachments: 8
        max_references: 64
        max_images: 4
    transport:
        max_upload_bytes: 134217728
        max_prompt_request_bytes: 4194304
        max_image_bytes: 4194304
    materialization:
        max_body_bytes: 134217728
        max_turn_bytes: 268435456
        max_expansion_ratio: 20
        max_unwrap_depth: 2
    prompt:
        max_body_preview_bytes: 16384
        max_large_text_preview_bytes: 8192
        max_turn_preview_bytes: 32768
    document:
        max_body_bytes: 16777216
        max_extracted_bytes: 16384
        max_worker_memory_bytes: 536870912
        max_pages: 50
        max_slides: 50
        max_parse_seconds: 15
    video:
        max_body_bytes: 134217728
agents_md_inject:
    max_body_bytes: 65536
perception:
    max_tool_images: 8
    drop_batch: 4
