scope: app
title: Credential vault key is missing
message: >-
  The key that opens your saved credentials is no longer held by this device, so they cannot be opened. If you can restore
  the key, for example from a backup of the Keychain or the original configuration folder, restore it and try again.
  Otherwise reset the vault: saved credentials are removed, and projects and conversation history are not deleted.
suggested_action: The key is still missing. Restore it and try again, or reset the vault.
scenarios:
  - id: default
    expect_contains:
      - reset the vault
      - not deleted
  - id: retry-failed
    expect_contains:
      - still missing
