scope: app
title: Could not unlock credential vault
message: >-
  That app password did not open the encrypted credential vault. Check it and
  try again.
suggested_action: The credential vault is still locked. Try the password again or reset the vault.
scenarios:
  - id: default
    expect_contains:
      - did not open
  - id: retry-failed
    expect_contains:
      - reset the vault
