scope: app
title: Credential custodian is unavailable
message: >-
  Your encrypted credentials are preserved. Restore access to this device's protected credential storage, then try again from the installed desktop app.
suggested_action: The custodian is still unavailable. Restore access and reopen the installed app.
scenarios:
  - id: default
    expect_contains:
      - encrypted credentials are preserved
      - installed desktop app
  - id: retry-failed
    expect_contains:
      - custodian is still unavailable
