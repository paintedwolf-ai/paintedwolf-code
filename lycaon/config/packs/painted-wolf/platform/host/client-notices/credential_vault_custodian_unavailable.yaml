scope: app
title: Credential custodian is unavailable
message: >-
  Your encrypted credentials are preserved. Restore the Painted Wolf Code vault identity service, then try again from the installed desktop app. An app password can open this vault only after its key has been exported to password custody.
suggested_action: The custodian is still unavailable. Restore the service and reopen the installed app.
scenarios:
  - id: default
    expect_contains:
      - encrypted credentials are preserved
      - installed desktop app
  - id: retry-failed
    expect_contains:
      - custodian is still unavailable
