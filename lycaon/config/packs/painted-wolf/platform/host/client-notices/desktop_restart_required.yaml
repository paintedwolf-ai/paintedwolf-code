scope: app
title: Restart the installed desktop app
message: >-
  The installed package changed while this desktop was running. Quit Painted
  Wolf Code, finish any package operation, then open it from the installed
  desktop launcher. Your saved credentials are preserved.
suggested_action: Quit the app from its menu, then open the installed desktop launcher.
scenarios:
  - id: default
    expect_contains:
      - installed package changed
      - saved credentials are preserved
  - id: retry-failed
    expect_contains:
      - installed desktop launcher
