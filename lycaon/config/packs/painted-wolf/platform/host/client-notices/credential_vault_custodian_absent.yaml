scope: app
title: Vault identity service is gone
message: >-
  The vault identity service that held the key to your saved credentials is not installed, not running, or cannot
  serve this computer. If an administrator can reinstall or re-enable it, do that and try again. Otherwise reset the
  vault: the key the service held cannot be recovered, so saved credentials are removed; projects and conversation
  history are not deleted.
suggested_action: The vault identity service is still unavailable. Reinstall or re-enable it and try again, or reset the vault.
scenarios:
  - id: default
    expect_contains:
      - cannot be recovered
      - not deleted
  - id: retry-failed
    expect_contains:
      - reset the vault
