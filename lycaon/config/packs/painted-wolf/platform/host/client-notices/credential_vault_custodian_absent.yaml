scope: app
title: Vault identity service is unavailable
message: >-
  Your encrypted credentials are preserved. The vault identity service is not installed,
  not running, or cannot serve this computer. Reinstall or re-enable the service,
  then try again from the installed Painted Wolf Code desktop app.
suggested_action: Restore the vault identity service and try again.
scenarios:
  - id: default
    expect_contains:
      - encrypted credentials are preserved
      - Reinstall or re-enable
  - id: retry-failed
    expect_contains:
      - Restore the vault identity service
