scope: app
title: Finish starting fresh
message: >-
  A clean data store is staged and your previous data is preserved in a
  recovery copy. Finish starting fresh to open initial setup.
suggested_action: >-
  The app could not finish automatically. Quit and reopen it to apply the
  clean data store.
scenarios:
  - id: default
    expect_contains:
      - clean data store is staged
      - previous data is preserved
      - initial setup
