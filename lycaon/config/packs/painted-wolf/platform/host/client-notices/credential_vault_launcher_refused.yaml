scope: app
title: Open the installed desktop app
message: >-
  The vault identity service refused this launcher. Your encrypted credentials are preserved. Quit this copy and open the installed Painted Wolf Code desktop app. Moving to an app password requires a verified connection to the service first.
suggested_action: The launcher is still refused. Open the installed desktop app and try again.
scenarios:
  - id: default
    expect_contains:
      - refused this launcher
      - encrypted credentials are preserved
  - id: retry-failed
    expect_contains:
      - launcher is still refused
