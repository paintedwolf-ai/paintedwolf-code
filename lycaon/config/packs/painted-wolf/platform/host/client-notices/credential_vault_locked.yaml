scope: app
title: Unlock credential vault
message: >-
  Your saved credentials are encrypted. Enter the app password you created on
  this device to finish opening the app.
suggested_action: The credential vault is still locked. Check the password and try again.
scenarios:
  - id: default
    expect_contains:
      - saved credentials are encrypted
  - id: retry-failed
    expect_contains:
      - still locked
