scope: app
title: Protect saved credentials
message: >-
  Create an app password for the encrypted credential vault. You will enter it
  when opening the app on this device, and it cannot be recovered.
suggested_action: The credential vault could not be created. Check the passwords and try again.
scenarios:
  - id: default
    expect_contains:
      - cannot be recovered
  - id: retry-failed
    expect_contains:
      - could not be created
