scope: app
title: Credential vault needs to be reset
message: >-
  The encrypted credential vault or the key that opens it is damaged. Resetting
  removes saved credentials but does not delete projects or conversation history.
suggested_action: The credential vault could not be reset. Quit and reopen the app, then try again.
scenarios:
  - id: default
    expect_contains:
      - does not delete projects
  - id: retry-failed
    expect_contains:
      - could not be reset
