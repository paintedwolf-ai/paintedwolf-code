# Local model questions and host thresholds.
# Evaluator: lycaon/internal/coordinator/turnload
version: 2

# The fastest device that ranks the 16-candidate reference batch within
# reference_ms serves; otherwise decisions fall back immediately.
# Evaluator: lycaon/internal/decide
engine:
  reference_ms: 1000

# Bounded request text and host state passed to each decision head.
state:
  user_text_chars: 1600
  recent_tools: 12
  head_tokens: 512

# Evaluated once per user turn or worker brief.
turn:
  deadline_ms: 10000
  # Loadable schemas join the standing set when P(true) >= load_at and remain
  # until a cold boundary.
  tools:
    question: Which of these tools will completing this request call?
    independent: true
    option_words: 60
    load_at: 0.6
  # Preload at most one skill when the top score reaches preload_at and leads
  # the runner-up by margin.
  skills:
    preload_at: 2.8
    margin: 0.3
  # Omit a unit when its id is in omittable, P(true) < omit_below, and
  # confidence >= confidence_floor. Units needed by a called or requested tool
  # are never omitted.
  guides:
    question: Which of this guidance does completing this request need?
    option_words: 8
    omittable: [native-summarize-tool, native-recall-tool]
    omit_below: 0.3
    confidence_floor: 0.5
  # Joint heads only: a confident answer_only kind can veto tool loading.
  kind:
    veto_tools: false
    confidence_floor: 0.6
    instructions: What kind of work does this request ask for?
    options:
      answer_only: an explanation, opinion, or answer that needs no tools
      inspect: reading and understanding the project without changing it
      change: a bounded edit, fix, or addition the coordinator can make directly
      run: building, testing, running, or verifying something
      delegate: a broad or multi-part change that parallel workers should split

# request_tools schema ranking thresholds.
request:
  deadline_ms: 10000
  load_at: 1.8
  max_loads: 4
  nearest_loads: 0

# skills_read ranking thresholds.
lookup:
  deadline_ms: 10000
  read_at: 2.8
  margin: 0.3

# Ranked once per turn on the first non-skipped loadable tool call.
tool_event:
  deadline_ms: 10000
  read_at: 2.8
  pointer_at: 2.4
  margin: 0.3
  skip: [write, edit, replace_lines, code_rewrite, restore_version]

# Lexical reranking sites. Each site adds weight * relevance to the top
# max_candidates within deadline_ms.
# Evaluator: lycaon/internal/decide
rerank:
  summarize_structure:
    enabled: true
    deadline_ms: 5000
    max_candidates: 48
    chunk: 16
    weight: 2.5
  summarize_definitions:
    enabled: true
    deadline_ms: 5000
    max_candidates: 48
    chunk: 16
    weight: 2.0
  summarize_windows:
    enabled: true
    deadline_ms: 1000
    max_candidates: 32
    chunk: 16
    weight: 1.0
  summarize_neighbors:
    enabled: true
    deadline_ms: 1000
    max_candidates: 32
    chunk: 16
    weight: 1.0
  summarize_call_sites:
    enabled: true
    deadline_ms: 1000
    max_candidates: 32
    chunk: 16
    weight: 1.0
  summarize_imports:
    enabled: true
    deadline_ms: 1000
    max_candidates: 32
    chunk: 16
    weight: 1.0
  summarize_next_actions:
    enabled: true
    deadline_ms: 500
    max_candidates: 16
    chunk: 16
    weight: 1.0
  repomap_tags:
    enabled: true
    deadline_ms: 5000
    max_candidates: 48
    chunk: 16
    weight: 1.0
  project_search:
    enabled: false
    deadline_ms: 300
    max_candidates: 16
    chunk: 16
    weight: 0.1
  web_pages:
    enabled: false
    deadline_ms: 5000
    max_candidates: 24
    chunk: 8
    weight: 0.5

# Continuation detail ranking never changes canonical coverage or recovery.
retention:
  question: Which recorded observations are needed to continue this request?
