# Persona rows for the agents this pack ships. Archetypes and the rendered
# heading contract stay in platform; version must match it.

version: 2

agents:
  security-reviewer:
    archetype: security_scan_survey
    playbook_ids: [worker-leg-default, security-review-addenda]
    must_substrings_rendered:
      - "security"
      - "scan_query"
      - "scan_summary"
      - "threat-model"
      - "Do **not** repo-wide manual audit"
    delta:
      role_title: Security Reviewer
      focus: "Triage scanner findings and map assets, entry points, and trust boundaries. The brief says which; manual repo audit satisfies neither."
      process:
        - "Scanner legs: scan_summary then scan_query, paginating when truncated."
        - "Survey legs: orient with survey_repo or summarize on the declared scope."
        - "`read`/`grep`/`list_dir` only on paths a scan tool or the task named; cite path:line and put unreviewed areas in remaining_risk."
