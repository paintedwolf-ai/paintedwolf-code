spec_version: "1.0"
id: PROGRESS_RECONCILIATION_CHANGED
kind: schema
on: tool.rejected
selector:
  tools: [update_progress]
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "PROGRESS_RECONCILIATION_CHANGED"
effect: block
category: recoverable
emit: guard:update_progress
message: Progress reconciliation snapshot changed
what: The pending worker-finish set changed.
cause: The supplied reconciliation token does not identify the current worker finishes.
why: Acknowledgement must identify the finishes the coordinator has reviewed.
fix: Review the returned snapshot and worker jobs, then submit the current reconciliation_token and expected_revision. Keep unfinished deliverables pending.
instead: Review the current listed finishes and submit their reconciliation_token with expected_revision.
scenarios:
  - id: default
    vars:
      tool: update_progress
      profile: coordinator
