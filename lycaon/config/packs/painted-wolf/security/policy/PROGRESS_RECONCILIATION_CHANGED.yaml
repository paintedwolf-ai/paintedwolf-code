spec_version: "1.0"
id: PROGRESS_RECONCILIATION_CHANGED
kind: schema
on: tool.rejected
selector:
  tools: [update_progress]
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "PROGRESS_RECONCILIATION_CHANGED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:update_progress
message: Progress reconciliation snapshot changed
what: The unacknowledged worker-round settlement set changed.
cause: The supplied reconciliation token does not identify the current settled worker rounds.
why: Acknowledgement must identify the worker rounds the coordinator has reviewed.
fix: Review the returned snapshot and settled worker rounds, then submit the current reconciliation_token and expected_revision. Keep unfinished deliverables pending.
instead: Review the current listed worker rounds and submit their reconciliation_token with expected_revision.
x-paintedwolf-scenarios:
  - id: default
    vars:
      tool: update_progress
      profile: coordinator
