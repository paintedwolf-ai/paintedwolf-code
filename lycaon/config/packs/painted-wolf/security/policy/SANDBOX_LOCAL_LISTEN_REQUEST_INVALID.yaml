spec_version: "1.0"
id: SANDBOX_LOCAL_LISTEN_REQUEST_INVALID
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code, paintedwolf.rejection_reason]
when: paintedwolf.rejection_code == "SANDBOX_LOCAL_LISTEN_REQUEST_INVALID"
effect: block
category: recoverable
emit: guard:sandbox_local_listen
message: structured local listener request invalid
what: The local listener capability request was invalid.
cause: 'The local_listen request failed structured validation: {{ paintedwolf.rejection_reason }}.'
why: Listener authority must use the structured shape so the sandbox profile matches the declared ports.
fix: On an invocation supporting local_listen, use an object with optional ports (1–8 integers from 1 through 65535). An empty object requests any local port; prefer the intended exact port set when known.
instead: Branch on Code; correct or remove the local listener request
scenarios:
  - id: default
    vars: {}
