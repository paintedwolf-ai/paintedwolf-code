spec_version: "1.0"
id: OVERLAY_PROMOTE_NOT_PENDING
kind: policy
on: tool.rejected
selector:
  tools:
    - preview_overlay
    - promote_overlay
    - reject_overlay
requires_facts: [paintedwolf.job_id, paintedwolf.merge_status, paintedwolf.next_steps, paintedwolf.rejection_code, paintedwolf.rejection_reason]
when: paintedwolf.rejection_code == "OVERLAY_PROMOTE_NOT_PENDING"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
message: Overlay {{ paintedwolf.job_id }} is not pending{% if paintedwolf.merge_status %} (merge_status={{ paintedwolf.merge_status }}){% endif %}{% if paintedwolf.rejection_reason %} — {{ paintedwolf.rejection_reason }}{% endif %}
what: Overlay {{ paintedwolf.job_id }} is not pending{% if paintedwolf.merge_status %} (merge_status={{ paintedwolf.merge_status }}){% endif %}{% if paintedwolf.rejection_reason %} — {{ paintedwolf.rejection_reason }}{% endif %}
cause: The overlay was already promoted, rejected, orphaned, or aborted in an earlier turn; or it never had an isolated workspace (read scope or pre-overlay job)
why: Re-promoting a non-pending overlay would either no-op silently or fail mid-merge — both violate the one-overlay-one-event guarantee
fix: 'Re-read the pulse roster''s pending write list. If the overlay landed, treat it as done; if rebasing, wait for resolution; if orphaned, decide rebase-onto-primary vs reject. {{ paintedwolf.next_steps }}'
instead: Branch on Code; verify merge_status against the live roster before retrying
x-paintedwolf-scenarios:
  - id: default
    vars:
      job_id: ov-already-merged
      merge_status: merged
  - id: no_workspace
    vars:
      job_id: ov-read
      reason: no isolated branch
