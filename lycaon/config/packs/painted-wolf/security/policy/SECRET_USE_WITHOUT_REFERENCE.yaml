oar: '1.0'
id: SECRET_USE_WITHOUT_REFERENCE
kind: schema
anchor: tool.rejected
selector:
  tool: [command, verify, terminal_open, terminal_send]
requires:
  profiles: [tool]
  facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SECRET_USE_WITHOUT_REFERENCE"
effect: block
copy:
  what: This invocation declares secret_use but passes no managed secret reference.
  cause: secret_use reviews release of a managed secret passed by reference in this invocation.
  why: A program's own stored login is separate from managed secret release.
  fix: Remove `secret_use` and retry the rejected call. Programs using their own stored login need no declaration.
  instead: Remove secret_use; do not add a credential to satisfy this field
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:secret
x-paintedwolf-message: secret_use needs a managed reference
x-paintedwolf-scenarios:
  - id: no_reference
    vars:
      tool: command
    expect_contains:
      - 'Code: SECRET_USE_WITHOUT_REFERENCE'
      - Remove
