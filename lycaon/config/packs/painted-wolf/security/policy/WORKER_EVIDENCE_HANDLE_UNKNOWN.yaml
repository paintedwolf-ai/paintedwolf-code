oar: '1.0'
id: WORKER_EVIDENCE_HANDLE_UNKNOWN
kind: invariant
anchor: worker.report_check
requires:
  facts:
    - paintedwolf.cited_handle_ranges
    - paintedwolf.observed_paths_sample
    - paintedwolf.observed_urls_sample
    - paintedwolf.offender_count
    - paintedwolf.offenders_omitted
    - paintedwolf.offenders_sample
    - paintedwolf.profile
    - paintedwolf.unobserved_cited_handles
    - paintedwolf.unobserved_cited_urls
when: paintedwolf.profile == "worker" && size(paintedwolf.unobserved_cited_handles) > 0
effect: block
copy:
  what: 'Worker cited {{ paintedwolf.offender_count }} finding reference(s) that did not resolve in this leg evidence.'
  cause: 'A findings evidence handle or path did not match a recorded observation for this leg.'
  why: '{{ paintedwolf.offenders_sample }}{% if paintedwolf.offenders_omitted %} +{{ paintedwolf.offenders_omitted }} more{% endif %}'
  fix: 'Correct complete_leg using an exact observed evidence handle, or a recorded path, line and verbatim excerpt{% if paintedwolf.cited_handle_ranges %}. The cited handles observed {{ paintedwolf.cited_handle_ranges }}; cite a line inside those ranges or read the lines first{% endif %}{% if paintedwolf.observed_paths_sample %}; observed paths include {{ paintedwolf.observed_paths_sample }}{% endif %}. Scanner output is cited with its scan#N handle in evidence, not as file text at a path. For web evidence, cite the exact URL in cited_urls{% if paintedwolf.observed_urls_sample %}; observed URLs include {{ paintedwolf.observed_urls_sample }}{% endif %}.{% if paintedwolf.unobserved_cited_urls %} Also drop or fetch these unobserved URLs: {{ paintedwolf.unobserved_cited_urls }}.{% endif %} Observe missing scope with the offered tools or drop the finding before submitting again.'
  instead: 'Fix or drop only the listed citations and keep the rest of the report; leg_status reflects whether the remaining evidence delivers the assignment. Do not repeat a worker assignment solely to replace a bad citation.'
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:worker_summary
x-paintedwolf-evidence:
  ui_label: Evidence handles
  ui_check_id: evidence_handles
  in_session_retry: true
x-paintedwolf-message: 'Worker finding reference did not resolve in this leg'
x-paintedwolf-scenarios:
  - id: unobserved_path
    vars:
      offender_count: 1
      offenders_omitted: 0
      offenders_sample: internal/missing.go:1
    expect_contains:
      - 'Rejected:'
      - 'Code: WORKER_EVIDENCE_HANDLE_UNKNOWN'
      - complete_leg
  - id: url_in_findings_path
    vars:
      observed_urls_sample: https://bazzite.gg/
      offender_count: 1
      offenders_omitted: 0
      offenders_sample: https:/bazzite.gg:3
    expect_contains:
      - 'Code: WORKER_EVIDENCE_HANDLE_UNKNOWN'
      - cite the exact URL in cited_urls
      - 'observed URLs include https://bazzite.gg/'
  - id: scan_text_cited_as_file
    vars:
      offender_count: 1
      offenders_omitted: 0
      offenders_sample: lycaon/go.mod:1
      unobserved_cited_urls:
        - https://example.com/unfetched
    expect_contains:
      - 'scan#N handle in evidence'
      - 'Also drop or fetch these unobserved URLs: https://example.com/unfetched'
  - id: line_outside_observed_range
    vars:
      offender_count: 1
      offenders_omitted: 0
      offenders_sample: internal/auth.go:412
      cited_handle_ranges: 'read#3 internal/auth.go lines 1-120'
    expect_contains:
      - 'The cited handles observed read#3 internal/auth.go lines 1-120'
      - 'cite a line inside those ranges'
