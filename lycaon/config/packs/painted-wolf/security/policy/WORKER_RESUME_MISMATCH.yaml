spec_version: "1.0"
id: WORKER_RESUME_MISMATCH
kind: policy
on: tool.rejected
selector:
  tools:
    - task
requires_facts: [paintedwolf.child_session_id, paintedwolf.rejection_code, paintedwolf.resume_field, paintedwolf.resume_recorded, paintedwolf.resume_requested]
when: paintedwolf.rejection_code == "WORKER_RESUME_MISMATCH"
effect: block
category: recoverable
emit: guard:coordinator
message: Resume of child {{ paintedwolf.child_session_id }} changes its {{ paintedwolf.resume_field }}
what: 'The resume names {{ paintedwolf.resume_field }} `{{ paintedwolf.resume_requested }}`, but child {{ paintedwolf.child_session_id }} runs as `{{ paintedwolf.resume_recorded }}`.'
cause: A resume continues the same child, so it keeps the agent and scope mode its earlier legs used.
why: Changing either would run a different worker against a transcript and workspace built for the first.
fix: Omit {{ paintedwolf.resume_field }} to resume the child as it is, or dispatch a fresh task without child_session_id for different work.
instead: Resume without restating {{ paintedwolf.resume_field }}, or start a new task
scenarios:
  - id: agent
    vars:
      child_session_id: c112d656
      resume_field: agent_type
      resume_recorded: security-reviewer
      resume_requested: implementer
