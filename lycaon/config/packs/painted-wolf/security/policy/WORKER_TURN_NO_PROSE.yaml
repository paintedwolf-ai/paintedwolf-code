oar: '1.0'
id: WORKER_TURN_NO_PROSE
kind: invariant
anchor: worker.report_check
requires:
  facts:
    - paintedwolf.profile
    - paintedwolf.worker_attempted_mutation
    - paintedwolf.worker_summary_present
when: paintedwolf.profile == "worker" && !paintedwolf.worker_summary_present && !paintedwolf.worker_attempted_mutation
effect: block
copy:
  what: 'The worker result has no usable parent-visible brief.'
  cause: 'The completion report did not supply a nonempty brief for the parent.'
  why: 'A missing brief is separate from the status of the underlying work or retained tool observations.'
  fix: 'Inspect the retained worker result and observations. If a worker report turn is resumed, request complete_leg with a concise brief and honest status. Dispatch new work only for an identified gap, using an eligible profile from the current catalog.'
  instead: 'Preserve existing results and report the missing brief without claiming that all worker work must be repeated.'
# The leg is over when this fires; the reader is the dispatching coordinator,
# whose tools the fix names.
x-paintedwolf-audience:
  - coordinator
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:worker_summary
x-paintedwolf-message: 'Worker result has no usable parent-visible brief'
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      profile: coordinator
      tool: read
    expect_contains:
      - 'Rejected:'
      - 'Code: WORKER_TURN_NO_PROSE'
