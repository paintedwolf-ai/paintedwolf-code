spec_version: "1.0"
id: SANDBOX_DIRECT_IP_DENIED
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code, paintedwolf.user_guidance]
when: paintedwolf.rejection_code == "SANDBOX_DIRECT_IP_DENIED"
effect: block
x-paintedwolf-category: user-decision
x-paintedwolf-emit: guard:sandbox_direct_ip
message: direct network authority declined
what: Direct network authority was declined for this action.
cause: The person answered the host approval request without granting this capability.
why: Retrying the same request would disregard that decision.
fix: '{% if paintedwolf.user_guidance %}User direction: {{ paintedwolf.user_guidance }}. Follow that direction before requesting approval for a corrected action.{% else %}Continue within mediated egress. Wait for new user direction before requesting approval again.{% endif %}'
instead: Respect this rejection; fresh user direction permits a new approval request
x-paintedwolf-scenarios:
  - id: default
    vars: {}
