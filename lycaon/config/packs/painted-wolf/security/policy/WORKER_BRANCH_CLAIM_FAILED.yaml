spec_version: "1.0"
id: WORKER_BRANCH_CLAIM_FAILED
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code, paintedwolf.rejection_reason]
when: paintedwolf.rejection_code == "WORKER_BRANCH_CLAIM_FAILED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:worker_branch_claim
message: worker branch claim failed — private overlay unavailable
what: Isolating tool **{{ tool }}** could not claim a private write-worker branch.
cause: The host failed to create or attach the worker overlay (`{{ paintedwolf.rejection_reason }}`).
why: Without a private branch, mutations would land on the live project tree or process tools would run without isolation.
fix: Preserve the current worker, task and overlay identities. Report the failed isolation boundary through the current completion or decision channel. Resume mutation only after the host can attach the required private branch.
instead: Retain existing results and state that this operation was not executed; do not create replacement work or write into the parent workspace to bypass isolation.
x-paintedwolf-scenarios:
  - id: default
    vars:
      agent_type: implementer
      job_id: abc123
      path: src/main.go
      profile: implement
      reason: worker branch claim failed
      tool: write
