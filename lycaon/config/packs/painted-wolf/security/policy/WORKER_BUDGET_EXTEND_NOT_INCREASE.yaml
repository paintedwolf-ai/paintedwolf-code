oar: '1.0'
id: WORKER_BUDGET_EXTEND_NOT_INCREASE
kind: schema
anchor: tool.rejected
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.current_max
  - paintedwolf.max_tool_loops
  - paintedwolf.host_max
  - paintedwolf.worker_budget_at_max
when: paintedwolf.rejection_code == "WORKER_BUDGET_EXTEND_NOT_INCREASE"
effect: block
copy:
  what: extend_worker_budget requires a strictly higher max_tool_loops than the job's effective ceiling
  cause: You sent max_tool_loops {{ paintedwolf.max_tool_loops }} but the effective max is already {{ paintedwolf.current_max
    }}
  why: Worker budgets are monotonic — shrinking or repeating the same cap is rejected
  fix: '{% if paintedwolf.worker_budget_at_max %}The effective budget has reached the host ceiling {{ paintedwolf.host_max
    }}; this tool cannot extend it. Report the remaining work within the current budget.{% else %}Set max_tool_loops
    strictly above {{ paintedwolf.current_max }} and no higher than {{ paintedwolf.host_max }}.{% endif %}'
  instead: Extend only when the current host bounds leave room; otherwise report the remaining work
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:extend_worker_budget
x-paintedwolf-message: max_tool_loops {{ paintedwolf.max_tool_loops }} must exceed current effective max {{
  paintedwolf.current_max }}
x-paintedwolf-scenarios:
- id: default
  vars:
    current_max: 40
    job_id: job-1
    max_tool_loops: 40
  expect_contains:
  - 'Rejected:'
  - 'Code: WORKER_BUDGET_EXTEND_NOT_INCREASE'
