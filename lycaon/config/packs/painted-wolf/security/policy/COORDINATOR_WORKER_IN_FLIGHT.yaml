spec_version: "1.0"
id: COORDINATOR_WORKER_IN_FLIGHT
kind: policy
on: coordinator.pre_invoke
selector: {}
requires_facts: [paintedwolf.active_count, paintedwolf.active_read_count, paintedwolf.active_worker_count, paintedwolf.active_write_count, paintedwolf.max_read_workers, paintedwolf.max_workers, paintedwolf.max_write_workers, paintedwolf.scope_mode, paintedwolf.tool_is_task, paintedwolf.worker_spawn_blocked]
when: paintedwolf.tool_is_task && paintedwolf.worker_spawn_blocked
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
message: Coordinator tried to start a worker while {{ paintedwolf.active_count }} worker round(s) are working or asking (max {{ paintedwolf.max_workers }})
what: 'Starting another worker would exceed the session concurrency limit: {{ paintedwolf.active_count }}/{{ paintedwolf.max_workers }} total, {{ paintedwolf.active_read_count }}/{{ paintedwolf.max_read_workers }} read, and {{ paintedwolf.active_write_count }}/{{ paintedwolf.max_write_workers }} write workers are currently active.'
cause: The total limit or the limit for this {{ paintedwolf.scope_mode }} scope is full.
why: Read, write, and total concurrency have separate limits; capacity in another scope does not open this slot.
fix: 'Wait for an active worker to reach waiting or closed, or instruct a waiting worker in the needed scope once a slot opens before starting another worker.'
instead: 'Wait for an active slot in the requested scope and total concurrency limit, then instruct a waiting worker or start only the remaining work.'
x-paintedwolf-scenarios:
  - id: default
    vars:
      active_count: 32
      detail: bad args
      max_workers: 32
      path: src/main.go
      profile: coordinator
      tool: read
