oar: '1.0'
id: SANDBOX_TRY_READ_PATH
kind: policy
anchor: tool.post_invoke
# command_output cannot carry a capability request; the retry is a fresh
# command or verify call.
selector:
  tool:
    - command
    - verify
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.confine_applied
  - paintedwolf.failed_stages
  - paintedwolf.process_running
  - paintedwolf.can_command_stop
  - paintedwolf.can_command_output
  - paintedwolf.refused_read_paths
  - paintedwolf.refused_read_grants
  - paintedwolf.missing_capability_read_path
when: >-
  paintedwolf.confine_applied
  && size(paintedwolf.refused_read_grants) > 0
  && (size(paintedwolf.failed_stages) > 0 || paintedwolf.process_running)
effect: warn
copy:
  what: In `{{ tool }}`, the sandbox refused reads of protected paths {{ paintedwolf.refused_read_paths }}{% if paintedwolf.process_running %} while the job runs{%
    endif %}.
  cause: The requestable read grants are {{ paintedwolf.refused_read_grants }}. Only these grants can be requested through `capability_request.read_path`; other refused
    paths may remain unavailable. Command output cannot add the field.
  why: ''
  fix: '{% if paintedwolf.process_running %}{% if paintedwolf.can_command_output %}Use command_output on this job''s handle to inspect its outcome. {% endif %}{%
    if paintedwolf.can_command_stop %}If this job is no longer needed, request command_stop once and observe its exit. {% endif %}Do not start replacement work while
    this job is running. {% endif %}{% if paintedwolf.missing_capability_read_path %}{% if paintedwolf.refused_read_grants %}If the operation is still needed, submit only the
    remaining work. Set `capability_request.read_path` to the exact matching entry of {{ paintedwolf.refused_read_grants }} as one string. Preserve completed effects
    and resolve uncertain outcomes before retrying them.{% endif %}{% endif %}'
  instead: ''
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:sandbox
x-paintedwolf-message: the sandbox refused a protected read this invocation needed
x-paintedwolf-scenarios:
  - id: key_material
    vars:
      tool: command
      failed_stages: [ssh-keygen -y -f /Users/person/.ssh/id_ed25519]
      refused_read_paths: [/Users/person/.ssh/id_ed25519]
      refused_read_grants: [/Users/person/.ssh/id_ed25519]
  - id: keychain_traversal
    vars:
      tool: command
      failed_stages: [gh pr view]
      refused_read_paths:
        - /Users/person/Library/Keychains
        - /Users/person/Library/Keychains/login.keychain-db
      refused_read_grants:
        - /Users/person/Library/Keychains/login.keychain-db
