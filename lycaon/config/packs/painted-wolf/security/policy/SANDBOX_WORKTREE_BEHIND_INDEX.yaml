spec_version: "1.0"
id: SANDBOX_WORKTREE_BEHIND_INDEX
kind: policy
on: tool.post_invoke
selector:
  tools:
    - command
    - verify
requires_facts: [paintedwolf.confine_applied, paintedwolf.worktree_conflict_paths, paintedwolf.worktree_leftover_paths, paintedwolf.worktree_stale_paths]
when: >-
  paintedwolf.confine_applied && (size(paintedwolf.worktree_stale_paths) > 0 || size(paintedwolf.worktree_leftover_paths) > 0 || size(paintedwolf.worktree_conflict_paths) > 0)
effect: warn
on_error: fail_open
category: recoverable
emit: guard:sandbox
message: Git index changed for agent-policy files the sandbox kept in the worktree
what: '`{{ tool }}` changed the Git index for agent-policy files the sandbox kept unchanged in the worktree.'
cause: The worktree still holds the earlier content of {% if paintedwolf.worktree_stale_paths %}{{ paintedwolf.worktree_stale_paths }}{% endif %}{% if paintedwolf.worktree_leftover_paths %} {{ paintedwolf.worktree_leftover_paths }} (no longer in the index){% endif %}{% if paintedwolf.worktree_conflict_paths %} {{ paintedwolf.worktree_conflict_paths }} (unmerged, without conflict markers){% endif %}. Git can exit 0 when it cannot update a file.
why: Later reads, diffs, and commits would mix the index's new state with the worktree's old one.
fix: ''
instead: ''
scenarios:
  - id: branch_switch
    vars:
      tool: command
      worktree_stale_paths:
        - AGENTS.md
        - lycaon/AGENTS.md
      worktree_leftover_paths: []
      worktree_conflict_paths: []
  - id: merge_conflict
    vars:
      tool: command
      worktree_stale_paths: []
      worktree_leftover_paths: []
      worktree_conflict_paths:
        - .paintedwolf/skills/review/SKILL.md
