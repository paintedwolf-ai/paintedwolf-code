spec_version: "1.0"
id: PROGRESS_REVISION_REQUIRED
kind: schema
on: tool.rejected
selector:
  tools: [update_progress]
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "PROGRESS_REVISION_REQUIRED"
effect: block
category: recoverable
emit: guard:update_progress
message: Progress snapshot revision required
what: Replacing an existing checklist requires its current revision and row item_ids.
cause: This replacement omitted expected_revision or item_ids.
why: The observed revision and row identities bind the replacement to the checklist it was prepared from.
fix: Use the returned snapshot to prepare the replacement, then submit its revision as expected_revision and its row identities as item_ids.
instead: Use the current snapshot revision as expected_revision and pass aligned item_ids when replacing the checklist.
scenarios:
  - id: default
    vars:
      tool: update_progress
      session_role: coordinator
