oar: '1.0'
id: SANDBOX_TRY_LOCAL_NETWORK
kind: policy
anchor: tool.post_invoke
# command_output cannot carry a capability request; the retry is a fresh
# command or verify call.
selector:
  tool:
    - command
    - verify
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.confine_applied
  - paintedwolf.failed_stages
  - paintedwolf.process_running
  - paintedwolf.can_command_stop
  - paintedwolf.can_command_output
  - paintedwolf.refused_connect_ports
  - paintedwolf.refused_listen_ports
  - paintedwolf.missing_capability_local_listen
when: >-
  paintedwolf.confine_applied
  && (size(paintedwolf.refused_connect_ports) > 0 || size(paintedwolf.refused_listen_ports) > 0)
  && (size(paintedwolf.failed_stages) > 0 || paintedwolf.process_running)
effect: warn
copy:
  what: In `{{ tool }}`, the sandbox refused{% if paintedwolf.refused_listen_ports %} a listener on port {{ paintedwolf.refused_listen_ports }}{% if paintedwolf.refused_connect_ports
    %} and{% endif %}{% endif %}{% if paintedwolf.refused_connect_ports %} a direct connection to port {{ paintedwolf.refused_connect_ports }}{% endif %}.
  cause: Listening and direct connections are separate capabilities. The kernel names a refused connection by port only, not by address.
  why: ''
  fix: '{% if paintedwolf.process_running %}{% if paintedwolf.can_command_output %}Use command_output on this job''s handle to inspect its outcome. {% endif %}{%
    if paintedwolf.can_command_stop %}If this job is no longer needed, request command_stop once and observe its exit. {% endif %}Do not start replacement work while
    this job is running. {% endif %}{% if paintedwolf.missing_capability_local_listen %}{% if paintedwolf.refused_listen_ports %}For a still-needed listener, submit only remaining
    work with `capability_request.local_listen` declaring the exact port from {{ paintedwolf.refused_listen_ports }}. Preserve completed effects.{% endif %}{% endif
    %}'
  instead: ''
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:sandbox
x-paintedwolf-message: the sandbox refused a listener or direct connection this invocation needed
x-paintedwolf-scenarios:
- id: database_client
  vars:
    tool: command
    failed_stages:
    - psql -h 127.0.0.1 -c select 1
    refused_connect_ports:
    - '5432'
    tool_args: {}
  expect_contains:
  - 'Code: SANDBOX_TRY_LOCAL_NETWORK'
  - '5432'
  - port only, not by address
- id: dev_server
  vars:
    tool: command
    process_running: true
    can_command_stop: true
    can_command_output: true
    refused_listen_ports:
    - '8080'
    tool_args: {}
  expect_contains:
  - 'Code: SANDBOX_TRY_LOCAL_NETWORK'
  - capability_request.local_listen
  - command_stop
