spec_version: "1.0"
id: SANDBOX_TRY_LOCAL_NETWORK
kind: policy
on: tool.post_invoke
# command_output cannot carry a capability request; the retry is a fresh
# command or verify call.
selector:
  tools:
    - command
    - verify
requires_facts: [paintedwolf.confine_applied, paintedwolf.destination, paintedwolf.failed_stages, paintedwolf.missing_capability_local_listen, paintedwolf.next_steps, paintedwolf.process_running, paintedwolf.refused_connect_ports, paintedwolf.refused_listen_ports, paintedwolf.refused_terminal_read_paths, paintedwolf.refused_terminal_write_paths]
when: >-
  paintedwolf.confine_applied && (size(paintedwolf.refused_connect_ports) > 0 || size(paintedwolf.refused_listen_ports) > 0) && (size(paintedwolf.failed_stages) > 0 || paintedwolf.process_running)
effect: warn
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:sandbox
message: the sandbox refused a listener or direct connection this invocation needed
what: In `{{ tool }}`, the sandbox refused{% if paintedwolf.refused_listen_ports %} a listener on port {{ paintedwolf.refused_listen_ports }}{% if paintedwolf.refused_connect_ports %} and{% endif %}{% endif %}{% if paintedwolf.refused_connect_ports %} a direct connection to port {{ paintedwolf.refused_connect_ports }}{% endif %}.
cause: Listening and direct connections are separate capabilities. The kernel names a refused connection by port only, not by address.{% if paintedwolf.refused_terminal_read_paths %} Reads of {{ paintedwolf.refused_terminal_read_paths }} were also refused; these host control-plane paths stay closed and no capability request opens them.{% endif %}{% if paintedwolf.refused_terminal_write_paths %} Writes to {{ paintedwolf.refused_terminal_write_paths }} were also refused; these host control-plane paths stay closed and no capability request opens them.{% endif %}{% if paintedwolf.destination %} The egress broker also refused a connection to `{{ paintedwolf.destination }}`.{% endif %}
why: ''
fix: '{% if paintedwolf.process_running %}{{ paintedwolf.next_steps }} Do not start replacement work while this job is running. {% endif %}{% if paintedwolf.missing_capability_local_listen %}{% if paintedwolf.refused_listen_ports %}For a still-needed listener, submit only remaining work with `capability_request.local_listen` declaring the exact port from {{ paintedwolf.refused_listen_ports }}. Preserve completed effects.{% endif %}{% endif %}'
instead: ''
x-paintedwolf-scenarios:
  - id: database_client
    vars:
      tool: command
      failed_stages:
        - psql -h 127.0.0.1 -c select 1
      refused_connect_ports:
        - '5432'
      tool_args: {}
  - id: dev_server
    vars:
      tool: command
      process_running: true
      can_command_stop: true
      can_command_output: true
      refused_listen_ports:
        - '8080'
      tool_args: {}
