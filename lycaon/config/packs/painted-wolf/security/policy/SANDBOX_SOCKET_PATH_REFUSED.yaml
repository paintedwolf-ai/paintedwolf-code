spec_version: "1.0"
id: SANDBOX_SOCKET_PATH_REFUSED
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.path, paintedwolf.rejection_code, paintedwolf.rejection_reason]
when: paintedwolf.rejection_code == "SANDBOX_SOCKET_PATH_REFUSED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:sandbox_socket
message: structured socket path refused
what: The host could not resolve, inspect or retain socket path {{ paintedwolf.path }}.
cause: 'Resolution failed: {{ paintedwolf.rejection_reason }}.'
why: The operation cannot proceed without the requested socket enforcement contract.
fix: Resolve the reported host filesystem or service-access failure before retrying the intended socket. A blind retry does not repair a permission or I/O failure. On macOS, local-service access requires a protected reference on the service volume. The host selects its temporary location; correct the reported filesystem permissions or use a separately approved service endpoint. Windows builds have no native socket realization; use a separately approved service endpoint. Saved intent and stored credentials remain.
instead: Branch on Code; correct structured args — never parse stderr
x-paintedwolf-scenarios:
  - id: default
    vars: {}
