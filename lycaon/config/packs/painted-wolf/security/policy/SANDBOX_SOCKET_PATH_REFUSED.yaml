oar: '1.0'
id: SANDBOX_SOCKET_PATH_REFUSED
kind: policy
anchor: tool.rejected
requires:
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.path
  - paintedwolf.rejection_reason
  profiles:
  - tool
when: paintedwolf.rejection_code == "SANDBOX_SOCKET_PATH_REFUSED"
effect: block
copy:
  what: The host could not resolve, inspect or retain socket path {{ paintedwolf.path }}.
  cause: 'Resolution failed: {{ paintedwolf.rejection_reason }}.'
  why: The operation cannot proceed without the requested socket enforcement contract.
  fix: Resolve the reported host filesystem or service-access failure before retrying the intended socket. A blind
    retry does not repair a permission or I/O failure. On macOS, native local-service access requires a
    protected reference on the same filesystem and an address within the kernel limit; place the intended
    service on a representable local filesystem or use a separately approved service endpoint. Windows builds
    have no native socket realization; use a separately approved service endpoint. Saved intent and stored
    credentials remain.
  instead: Branch on Code; correct structured args — never parse stderr
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:sandbox_socket
x-paintedwolf-message: structured socket path refused
x-paintedwolf-scenarios:
- id: default
  vars: {}
  expect_contains:
  - 'Code: SANDBOX_SOCKET_PATH_REFUSED'
  - socket path
