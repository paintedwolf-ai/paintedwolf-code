spec_version: "1.0"
id: SANDBOX_TRY_CAPABILITIES
kind: policy
on: tool.post_invoke
# command_output cannot carry a capability request; the retry is a fresh
# command or verify call.
selector:
  tools:
    - command
    - verify
requires_facts: [paintedwolf.confine_applied, paintedwolf.destination, paintedwolf.failed_stages, paintedwolf.missing_capability_credential_store, paintedwolf.missing_capability_host_execution, paintedwolf.missing_capability_local_listen, paintedwolf.missing_capability_process_control, paintedwolf.missing_capability_read_path, paintedwolf.missing_capability_socket_paths, paintedwolf.missing_capability_write_root, paintedwolf.next_steps, paintedwolf.process_running, paintedwolf.refused_connect_ports, paintedwolf.refused_credential_store_paths, paintedwolf.refused_listen_ports, paintedwolf.refused_read_grants, paintedwolf.refused_read_paths, paintedwolf.refused_signals, paintedwolf.refused_socket_host_resources, paintedwolf.refused_socket_paths, paintedwolf.refused_terminal_read_paths, paintedwolf.refused_terminal_write_paths, paintedwolf.refused_write_grants, paintedwolf.refused_write_paths, paintedwolf.socket_path_references, paintedwolf.socket_url_references, paintedwolf.supports_socket_paths, paintedwolf.unsandboxed_refusals]
when: >-
  paintedwolf.confine_applied && (size(paintedwolf.failed_stages) > 0 || paintedwolf.process_running) && (size(paintedwolf.refused_read_grants) > 0 ? 1 : 0) + (size(paintedwolf.refused_write_grants) > 0 ? 1 : 0) + (size(paintedwolf.refused_credential_store_paths) > 0 ? 1 : 0) + (size(paintedwolf.unsandboxed_refusals) > 0 ? 1 : 0) + (size(paintedwolf.refused_listen_ports) > 0 || size(paintedwolf.refused_connect_ports) > 0 ? 1 : 0) + (size(paintedwolf.refused_signals) > 0 ? 1 : 0) + (size(paintedwolf.refused_socket_paths) > 0 ? 1 : 0) >= 2
effect: warn
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:sandbox
message: the sandbox refused more than one capability this invocation needed
what: In `{{ tool }}`, the sandbox refused more than one capability{% if paintedwolf.process_running %} while the job runs{% endif %}.
cause: '{% if paintedwolf.refused_read_grants %}Reads of {{ paintedwolf.refused_read_paths }}, with requestable read grants {{ paintedwolf.refused_read_grants }}. {% endif %}{% if paintedwolf.refused_write_grants %}Writes to {{ paintedwolf.refused_write_paths }}, with requestable write grants {{ paintedwolf.refused_write_grants }}. {% endif %}{% if paintedwolf.refused_credential_store_paths %}OS credential store access at {{ paintedwolf.refused_credential_store_paths }}. {% endif %}{% if paintedwolf.unsandboxed_refusals %}Operations no sandbox capability admits: {{ paintedwolf.unsandboxed_refusals }}. {% endif %}{% if paintedwolf.refused_listen_ports %}A listener on port {{ paintedwolf.refused_listen_ports }}. {% endif %}{% if paintedwolf.refused_connect_ports %}A direct connection to port {{ paintedwolf.refused_connect_ports }}; refused connections are reported by port only. {% endif %}{% if paintedwolf.refused_signals %}Signals to processes outside the boundary: {{ paintedwolf.refused_signals }}. {% endif %}{% if paintedwolf.refused_socket_paths %}Connections to the local sockets {{ paintedwolf.refused_socket_paths }}. {% endif %}Command output cannot widen the boundary, and a refused write can still leave a stage''s exit status at 0.{% if paintedwolf.refused_terminal_read_paths %} Reads of {{ paintedwolf.refused_terminal_read_paths }} were also refused; these host control-plane paths stay closed and no capability request opens them.{% endif %}{% if paintedwolf.refused_terminal_write_paths %} Writes to {{ paintedwolf.refused_terminal_write_paths }} were also refused; these host control-plane paths stay closed and no capability request opens them.{% endif %}{% if paintedwolf.destination %} The egress broker also refused a connection to `{{ paintedwolf.destination }}`.{% endif %}'
why: ''
fix: '{% if paintedwolf.process_running %}{{ paintedwolf.next_steps }} Do not start replacement work while this job is running. {% endif %}If the operation is still needed, submit only the remaining work as one call.{% if paintedwolf.missing_capability_read_path %}{% if paintedwolf.refused_read_grants %} Set `capability_request.read_path` to the exact matching entry of {{ paintedwolf.refused_read_grants }} as one string.{% endif %}{% endif %}{% if paintedwolf.missing_capability_write_root %}{% if paintedwolf.refused_write_grants %} Set `capability_request.write_root` to the exact matching entry of {{ paintedwolf.refused_write_grants }} as one string.{% endif %}{% endif %}{% if paintedwolf.missing_capability_credential_store %}{% if paintedwolf.refused_credential_store_paths %} Set `capability_request.credential_store: true` for read access to the OS credential store.{% endif %}{% endif %}{% if paintedwolf.missing_capability_host_execution %}{% if paintedwolf.unsandboxed_refusals %} Request `capability_request.host_execution` for the refused operation; it requires review outside confinement.{% endif %}{% endif %}{% if paintedwolf.missing_capability_local_listen %}{% if paintedwolf.refused_listen_ports %} Set `capability_request.local_listen` to the exact port from {{ paintedwolf.refused_listen_ports }}.{% endif %}{% endif %}{% if paintedwolf.missing_capability_process_control %}{% if paintedwolf.refused_signals %} Request `capability_request.process_control` for the refused process operation.{% endif %}{% endif %}{% if paintedwolf.supports_socket_paths %}{% if paintedwolf.refused_socket_paths %}{% if paintedwolf.refused_socket_host_resources %} Declare host resource {{ paintedwolf.refused_socket_host_resources }} in `capability_request.host_resources`; the host points its client at the reviewed socket.{% else %}{% if paintedwolf.missing_capability_socket_paths %} Declare the exact service in `capability_request.socket_paths`.{% endif %} External clients use one whole endpoint value: paths `{{ paintedwolf.socket_path_references }}` or Unix URLs `{{ paintedwolf.socket_url_references }}`, with no `unix:` prefix.{% endif %}{% endif %}{% endif %} Put every field in the same `capability_request`. Preserve completed effects and resolve uncertain outcomes before retrying them.'
instead: ''
x-paintedwolf-scenarios:
- id: read_and_write
  vars:
    tool: command
    tool_args: {}
    failed_stages:
    - make install
    refused_read_paths:
    - /Users/person/.ssh/id_ed25519
    refused_read_grants:
    - /Users/person/.ssh/id_ed25519
    refused_write_paths:
    - /work/project/AGENTS.md
    refused_write_grants:
    - /work/project/AGENTS.md
    missing_capability_read_path: true
    missing_capability_write_root: true
    destination: registry.example:443
  expect_contains:
  - '`capability_request.read_path`'
  - '`capability_request.write_root`'
  - registry.example:443
  - 'Code: SANDBOX_TRY_CAPABILITIES'
- id: host_execution_and_socket
  vars:
    tool: command
    tool_args: {}
    failed_stages:
    - docker build -t app .
    unsandboxed_refusals:
    - mount
    missing_capability_host_execution: true
    refused_socket_paths:
    - /Users/person/.colima/default/docker.sock
    refused_socket_host_resources:
    - docker
    supports_socket_paths: true
    refused_terminal_read_paths:
    - /state/store.db
  expect_contains:
  - '`capability_request.host_execution`'
  - '`capability_request.host_resources`'
  - /state/store.db
