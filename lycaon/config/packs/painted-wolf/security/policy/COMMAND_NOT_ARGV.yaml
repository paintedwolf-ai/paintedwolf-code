oar: '1.0'
id: COMMAND_NOT_ARGV
kind: policy
anchor: tool.rejected
selector:
  tool:
  - command
  - verify
  - terminal_open
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.command
  - paintedwolf.shell_metacharacters
  - paintedwolf.use_pipeline_array
  - paintedwolf.use_stdin_param
  - paintedwolf.use_background_param
  - paintedwolf.directory_change
  - paintedwolf.env_assignment
  - paintedwolf.use_substitution_result
  - paintedwolf.scratch_var
  - paintedwolf.sequence_unsupported
  - paintedwolf.reissue_via_command
  - paintedwolf.command_not_argv
  - paintedwolf.terminal_capture
  - paintedwolf.rejection_reason
when: paintedwolf.rejection_code == "COMMAND_NOT_ARGV"
effect: block
copy:
  what: '{% if paintedwolf.shell_metacharacters %}command rejected — unquoted shell metacharacters in `{{ paintedwolf.command }}`{% else %}command `{{ paintedwolf.command }}` is not a single argv vector{% endif %}'
  cause: '{{ paintedwolf.rejection_reason }}'
  why: '{% if paintedwolf.directory_change %}Each invocation starts in its own `cwd`; running `cd` cannot change the directory of later calls.{% else %}A captured or terminal invocation holds exactly one process; `verify` wires literal argv stages without substitutions or here-documents. Ordinary `command` program text, without capture, supports composition, variables, substitutions, and here-documents.{% endif %}'
  fix: '{% if paintedwolf.directory_change %}

    Remove `cd` and its directory argument from `command`. Set `cwd` to that directory and start `command` with the executable. For the workspace root use `cwd: "."`; for a subdirectory use its workspace-relative path.

    {% else %}{% if paintedwolf.terminal_capture %}

    Keep `terminal_capture` on the captured `command` and send one argv line. Its result includes `exit_code`; do not append `echo $?`. For composed execution, omit `terminal_capture` and put the program text in `command`, then capture the final program separately.

    {% else %}{% if paintedwolf.reissue_via_command %}

    Send one literal argv invocation here, or run the composed form under `command` without capture, putting the composition in its program text.

    {% else %}{% if paintedwolf.env_assignment %}

    Put each environment variable in the `env` object of `verify` or `terminal_open`; start `command` with the executable. Use one literal argv invocation for capture. To use assignments in program text, call `command` without capture.

    {% else %}{% if paintedwolf.use_pipeline_array %}

    Use the `verify` tool''s `pipeline` array (e.g. `pipeline: ["git log --oneline", "head -20"]`) or write `|` inside its `command` text, with one argv vector per stage. For other composed execution, use `command` without capture.

    {% else %}{% if paintedwolf.use_stdin_param %}

    Pass the here-document body as the `verify` tool''s `stdin` (literal), or name a file with `< path` or its `stdin_from` argument. For composed programs with here-documents, use `command` without capture.

    {% else %}{% if paintedwolf.use_background_param %}

    `&` detaches a command. Pass `background: true` to `verify` to run one check as a concurrent job and read its handle; use `&&` if you meant "run the next one after this succeeds". Ordinary `command` programs without capture support trailing `&` jobs.

    {% else %}{% if paintedwolf.use_substitution_result %}

    {% if paintedwolf.scratch_var %}Write the scratch path as `@scratch/<path>`: the host resolves it in arguments (`cat @scratch/notes.txt`), `cwd`, and stream redirects. Inside a script, read `$SCRATCH_DIR` from the environment.{% else %}Nothing expands `$(...)`, `$VAR`, or backticks on this argv surface. Run the inner command as its own call, read the value from its result, then pass that value as a literal argument.{% endif %}

    {% else %}{% if paintedwolf.shell_metacharacters %}

    Quote literal arguments that need shell characters inside one stage (e.g. `python3 -c "import x; print(x.Y)"`). The `verify` tool accepts `&&`, `||`, `;`, and `|` across argv stages; use `command` without capture for composed program text.

    {% else %}

    Retry with a literal argv invocation (e.g. `go test ./...`, `pytest .`, `cargo test`). For composed execution, use `command` without capture and put the program in its `command` text.

    {% endif %}{% endif %}{% endif %}{% endif %}{% endif %}{% endif %}{% endif %}{% endif %}{% endif %}'
  instead: '{% if paintedwolf.directory_change %}Set `cwd` and remove `cd` from `command`{% else %}{% if paintedwolf.terminal_capture %}One program per captured call; read `exit_code` from its result{% else %}Use literal argv here, documented `verify` arguments for verification, or `command` without capture for composed programs{% endif %}{% endif %}'
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_surface
x-paintedwolf-message: command rejected
x-paintedwolf-scenarios:
- id: directory_change
  tool: terminal_open
  vars:
    command: cd src && tool --check
    reason: '`cd` changes only its own process; pass cwd'
    directory_change: true
  expect_contains:
  - 'Code: COMMAND_NOT_ARGV'
  - Remove `cd` and its directory argument
  - 'cwd: "."'
  - Set `cwd` and remove `cd` from `command`
- id: capture_sequence
  tool: command
  vars:
    command: tool --check; echo "$?"
    reason: this surface runs one program
    sequence_unsupported: true
    reissue_via_command: true
    terminal_capture: true
  expect_contains:
  - 'Code: COMMAND_NOT_ARGV'
  - omit `terminal_capture`
  - read `exit_code` from its result
- id: capture_pipe
  tool: command
  vars:
    command: tool --check | tee output.txt
    reason: command contains unquoted shell metacharacters
    shell_metacharacters: true
    reissue_via_command: true
    terminal_capture: true
  expect_contains:
  - 'Code: COMMAND_NOT_ARGV'
  - omit `terminal_capture`
  - capture the final program separately
- id: substitution
  tool: verify
  vars:
    command: git checkout $(git rev-parse HEAD)
    profile_id: implement
    reason: 'command contains unquoted shell metacharacters: `$`'
    shell_metacharacters: true
    use_substitution_result: true
  expect_contains:
  - 'Rejected:'
  - 'Code: COMMAND_NOT_ARGV'
  - Nothing expands
  - literal argument
- id: scratch_variable
  tool: verify
  vars:
    command: cat $SCRATCH_DIR/notes.txt
    profile_id: implement
    reason: 'command contains unquoted shell metacharacters: `$`'
    shell_metacharacters: true
    use_substitution_result: true
    scratch_var: true
  expect_contains:
  - 'Rejected:'
  - 'Code: COMMAND_NOT_ARGV'
  - 'cat @scratch/notes.txt'
  - SCRATCH_DIR
- id: background_operator
  tool: verify
  vars:
    command: python3 -m http.server 8000 &
    profile_id: implement
    reason: '`&` backgrounds a command rather than sequencing it: `&`'
    use_background_param: true
  expect_contains:
  - 'Rejected:'
  - 'Code: COMMAND_NOT_ARGV'
  - 'background: true'
- id: environment_assignment
  tool: terminal_open
  vars:
    command: TOKEN=value
    profile_id: implement
    reason: environment assignments belong in env
    env_assignment: true
  expect_contains:
  - 'Code: COMMAND_NOT_ARGV'
  - '`env` object'
  - start `command` with the executable
- id: shell_metacharacters
  tool: verify
  vars:
    command: cat <<'EOF' > out.txt
    profile_id: implement
    reason: 'command contains unquoted shell metacharacters: `<`'
    shell_metacharacters: true
    use_stdin_param: true
  expect_contains:
  - 'Rejected:'
  - 'Code: COMMAND_NOT_ARGV'
  - stdin_from
- id: pipeline_pipe
  tool: verify
  vars:
    command: git log --oneline | head -20
    profile_id: implement
    reason: command contains shell metacharacters
    shell_metacharacters: true
    use_pipeline_array: true
  expect_contains:
  - 'Rejected:'
  - 'Code: COMMAND_NOT_ARGV'
  - pipeline
  - git log --oneline
- id: terminal_pipe
  tool: terminal_open
  vars:
    command: npm run dev | tee dev.log
    profile_id: implement
    reason: 'command contains unquoted shell metacharacters: `|`'
    shell_metacharacters: true
    reissue_via_command: true
  expect_contains:
  - 'Rejected:'
  - 'Code: COMMAND_NOT_ARGV'
  - run the composed form under `command`
- id: terminal_sequence
  tool: terminal_open
  vars:
    command: go build ./... && ./server
    profile_id: implement
    reason: this surface runs one program; `&&`, `||`, and `;` run several
    sequence_unsupported: true
    reissue_via_command: true
  expect_contains:
  - 'Rejected:'
  - 'Code: COMMAND_NOT_ARGV'
  - holds exactly one process
- id: snapshot_sequence
  tool: command
  vars:
    command: tool --check && tool --report
    reason: this surface runs one program
    sequence_unsupported: true
    reissue_via_command: true
  expect_contains:
  - 'Code: COMMAND_NOT_ARGV'
  - holds exactly one process
  - run the composed form under `command` without capture
- id: snapshot_environment_assignment
  tool: command
  vars:
    command: TOKEN=value tool --check
    reason: environment assignments belong in env
    env_assignment: true
  expect_contains:
  - 'Code: COMMAND_NOT_ARGV'
  - Use one literal argv invocation for capture
  - call `command` without capture
