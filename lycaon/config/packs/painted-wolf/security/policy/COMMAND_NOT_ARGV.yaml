oar: '1.0'
id: COMMAND_NOT_ARGV
kind: policy
anchor: tool.rejected
selector:
  tool:
  - command
  - verify
  - terminal_open
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.command
  - paintedwolf.rejection_reason
  - paintedwolf.directory_change
  - paintedwolf.terminal_capture
  - paintedwolf.use_env_param
  - paintedwolf.use_cwd_param
  - paintedwolf.use_pipeline_array
  - paintedwolf.use_stdin_param
  - paintedwolf.use_background_param
  - paintedwolf.can_command
when: paintedwolf.rejection_code == "COMMAND_NOT_ARGV"
effect: block
copy:
  what: 'This invocation could not be admitted as literal executable arguments{% if paintedwolf.command %}: `{{ paintedwolf.command }}`{% endif %}.'
  cause: '{{ paintedwolf.rejection_reason }}'
  why: Each admitted stage uses literal arguments; shell expansions are not evaluated on this surface.
  fix: '{% if paintedwolf.directory_change %}{% if paintedwolf.use_cwd_param %}To select this call''s working directory, use its `cwd` argument and supply the executable
    to run there.{% endif %}

    {% else %}{% if paintedwolf.terminal_capture %}A captured call runs one executable with literal arguments. Its result supplies `exit_code`; shell sequences are
    not part of this capture.

    {% else %}{% if paintedwolf.use_env_param %}This tool accepts literal environment values in its `env` object; supply the executable as the command.

    {% else %}{% if paintedwolf.use_pipeline_array %}This tool accepts a `pipeline` array for its stages; follow its declared argument schema.

    {% else %}{% if paintedwolf.use_stdin_param %}This tool accepts literal input in `stdin`; shell substitutions are not evaluated in that field.

    {% else %}{% if paintedwolf.use_background_param %}This tool''s `background` field requests an independently running job and returns its handle.

    {% endif %}{% endif %}{% endif %}{% endif %}{% endif %}{% endif %}'
  instead: '{% if paintedwolf.can_command %}For a Bash program, the offered command tool accepts program text without capture.{% endif %}'
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:command_surface
x-paintedwolf-message: command rejected
x-paintedwolf-scenarios:
- id: directory_change
  tool: terminal_open
  vars:
    command: cd src && tool --check
    reason: '`cd` changes only its own process; pass cwd'
    directory_change: true
  expect_contains:
  - 'Code: COMMAND_NOT_ARGV'
  - Remove `cd` and its directory argument
  - 'cwd: "."'
  - Set `cwd` and remove `cd` from `command`
- id: capture_sequence
  tool: command
  vars:
    command: tool --check; echo "$?"
    reason: this surface runs one program
    sequence_unsupported: true
    reissue_via_command: true
    terminal_capture: true
  expect_contains:
  - 'Code: COMMAND_NOT_ARGV'
  - omit `terminal_capture`
  - read `exit_code` from its result
- id: capture_pipe
  tool: command
  vars:
    command: tool --check | tee output.txt
    reason: command contains unquoted shell metacharacters
    shell_metacharacters: true
    reissue_via_command: true
    terminal_capture: true
  expect_contains:
  - 'Code: COMMAND_NOT_ARGV'
  - omit `terminal_capture`
  - capture the final program separately
- id: substitution
  tool: verify
  vars:
    command: git checkout $(git rev-parse HEAD)
    profile_id: implement
    reason: 'command contains unquoted shell metacharacters: `$`'
    shell_metacharacters: true
    use_substitution_result: true
  expect_contains:
  - 'Rejected:'
  - 'Code: COMMAND_NOT_ARGV'
  - Nothing expands
  - literal argument
- id: scratch_variable
  tool: verify
  vars:
    command: cat $SCRATCH_DIR/notes.txt
    profile_id: implement
    reason: 'command contains unquoted shell metacharacters: `$`'
    shell_metacharacters: true
    use_substitution_result: true
    scratch_var: true
  expect_contains:
  - 'Rejected:'
  - 'Code: COMMAND_NOT_ARGV'
  - 'cat @scratch/notes.txt'
  - SCRATCH_DIR
- id: background_operator
  tool: verify
  vars:
    command: python3 -m http.server 8000 &
    profile_id: implement
    reason: '`&` backgrounds a command rather than sequencing it: `&`'
    use_background_param: true
  expect_contains:
  - 'Rejected:'
  - 'Code: COMMAND_NOT_ARGV'
  - 'background: true'
- id: environment_assignment
  tool: terminal_open
  vars:
    command: TOKEN=value
    profile_id: implement
    reason: environment assignments belong in env
    env_assignment: true
  expect_contains:
  - 'Code: COMMAND_NOT_ARGV'
  - '`env` object'
  - start `command` with the executable
- id: shell_metacharacters
  tool: verify
  vars:
    command: cat <<'EOF' > out.txt
    profile_id: implement
    reason: 'command contains unquoted shell metacharacters: `<`'
    shell_metacharacters: true
    use_stdin_param: true
  expect_contains:
  - 'Rejected:'
  - 'Code: COMMAND_NOT_ARGV'
  - stdin_from
- id: pipeline_pipe
  tool: verify
  vars:
    command: git log --oneline | head -20
    profile_id: implement
    reason: command contains shell metacharacters
    shell_metacharacters: true
    use_pipeline_array: true
  expect_contains:
  - 'Rejected:'
  - 'Code: COMMAND_NOT_ARGV'
  - pipeline
  - git log --oneline
- id: terminal_pipe
  tool: terminal_open
  vars:
    command: npm run dev | tee dev.log
    profile_id: implement
    reason: 'command contains unquoted shell metacharacters: `|`'
    shell_metacharacters: true
    reissue_via_command: true
  expect_contains:
  - 'Rejected:'
  - 'Code: COMMAND_NOT_ARGV'
  - run the composed form under `command`
- id: terminal_sequence
  tool: terminal_open
  vars:
    command: go build ./... && ./server
    profile_id: implement
    reason: this surface runs one program; `&&`, `||`, and `;` run several
    sequence_unsupported: true
    reissue_via_command: true
  expect_contains:
  - 'Rejected:'
  - 'Code: COMMAND_NOT_ARGV'
  - holds exactly one process
- id: snapshot_sequence
  tool: command
  vars:
    command: tool --check && tool --report
    reason: this surface runs one program
    sequence_unsupported: true
    reissue_via_command: true
  expect_contains:
  - 'Code: COMMAND_NOT_ARGV'
  - holds exactly one process
  - run the composed form under `command` without capture
- id: snapshot_environment_assignment
  tool: command
  vars:
    command: TOKEN=value tool --check
    reason: environment assignments belong in env
    env_assignment: true
  expect_contains:
  - 'Code: COMMAND_NOT_ARGV'
  - Use one literal argv invocation for capture
  - call `command` without capture
