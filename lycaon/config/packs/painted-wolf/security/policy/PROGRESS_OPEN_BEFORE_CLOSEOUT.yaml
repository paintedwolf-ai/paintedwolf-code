spec_version: "1.0"
id: PROGRESS_OPEN_BEFORE_CLOSEOUT
kind: invariant
on: coordinator.closeout_check
selector: {}
requires_facts: [paintedwolf.batch_ready_ignoring_progress, paintedwolf.next_steps, paintedwolf.progress_open_items, paintedwolf.synthesis_delay_count, paintedwolf.workers_idle]
when: paintedwolf.workers_idle && paintedwolf.progress_open_items > 0 && paintedwolf.batch_ready_ignoring_progress && paintedwolf.synthesis_delay_count < 2
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
message: Continue unfinished work or record completed results before answering
what: "This tool-free response would end the turn with {{ paintedwolf.progress_open_items }} progress steps still pending."
cause: Work remains unfinished, or completed work has not been recorded.
why: The final response and checklist must agree with observed results.
fix: 'If work remains, continue with tools and keep its rows pending. {{ paintedwolf.next_steps }} After its result, send the final answer in a separate response with no tool calls. Assistant text beside a tool call reaches the user when its citations are valid.'
instead: 'Repeating the same pending checklist does not resolve this rejection. Do not close unfinished rows to clear it. For a concrete blocker or authorized scope change, mark only the work you will not pursue `- [~]` and report the limitation.'
x-paintedwolf-scenarios:
  - id: open_steps
    vars:
      pending: 2
