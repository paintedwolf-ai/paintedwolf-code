oar: '1.0'
id: PROGRESS_OPEN_BEFORE_CLOSEOUT
kind: invariant
anchor: coordinator.closeout_check
requires:
  facts:
    - paintedwolf.batch_ready_ignoring_progress
    - paintedwolf.progress_open_items
    - paintedwolf.synthesis_delay_count
    - paintedwolf.workers_idle
when: paintedwolf.workers_idle && paintedwolf.progress_open_items > 0 && paintedwolf.batch_ready_ignoring_progress && paintedwolf.synthesis_delay_count < 2
effect: block
copy:
  what: "The closing synthesis was attempted while {{ paintedwolf.progress_open_items }} progress steps remain open."
  cause: The progress checklist doesn't yet reflect where the work actually landed.
  why: The user-facing "done" and the checklist must agree — an open step says that work is still outstanding.
  fix: Make the checklist true via `update_progress`, then deliver your synthesis — `- [x]` done, or `- [~]` for anything you won't pursue (no longer applicable, descoped, or you're stopping early), or `- [>]` for a non-deliverable note. Changing course or handing back partial is fine; just mark the steps you won't reach `- [~]` so the closeout is honest.
  instead: "Reconcile the checklist with observed results, then report honestly. Do not mark required unfinished work done, turn a deliverable into a note, or descope it merely to clear this gate."
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
x-paintedwolf-message: Close out blocked — the progress checklist must reflect reality first
x-paintedwolf-scenarios:
  - id: open_steps
    vars:
      pending: 2
    expect_contains:
      - 'Rejected:'
      - 'Code: PROGRESS_OPEN_BEFORE_CLOSEOUT'
      - update_progress
