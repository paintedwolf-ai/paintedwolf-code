spec_version: "1.0"
id: SANDBOX_LOCAL_LISTEN_DENIED
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code, paintedwolf.user_guidance]
when: paintedwolf.rejection_code == "SANDBOX_LOCAL_LISTEN_DENIED"
effect: block
x-paintedwolf-category: user-decision
x-paintedwolf-emit: guard:sandbox_local_listen
message: local listener authority declined
what: '{{ tool }} was not granted the requested local listener authority.'
cause: Listener authority is not on this invocation.
why: Retrying local_listen loops on the same refusal.
fix: '{% if paintedwolf.user_guidance %}User direction: {{ paintedwolf.user_guidance }}. Follow that direction before requesting approval for a corrected action.{% else %}Continue without the listener and report unmet verification. Wait for new user direction before requesting approval again.{% endif %}'
instead: Respect this rejection; fresh user direction permits a new approval request
x-paintedwolf-scenarios:
  - id: default
    vars:
      tool: command
