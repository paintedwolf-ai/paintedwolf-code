oar: '1.0'
id: SANDBOX_LOCAL_LISTEN_DENIED
kind: policy
anchor: tool.rejected
requires:
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.user_guidance
  profiles:
  - tool
when: paintedwolf.rejection_code == "SANDBOX_LOCAL_LISTEN_DENIED"
effect: block
copy:
  what: '{{ tool }} was not granted the requested local listener authority.'
  cause: Listener authority is not on this invocation.
  why: Retrying local_listen loops on the same refusal.
  fix: '{% if paintedwolf.user_guidance %}User direction: {{ paintedwolf.user_guidance }} {% endif %}Continue with
    work that does not require the denied listener. Use an offered static-render workflow only if it answers the
    intended question; a live-server requirement remains blocked until new user direction.'
  instead: Do not retry local_listen; continue with serverless verification
x-paintedwolf-category: user-decision
x-paintedwolf-emit: guard:sandbox_local_listen
x-paintedwolf-message: local listener authority declined
x-paintedwolf-scenarios:
- id: default
  vars:
    tool: command
  expect_contains:
  - 'Rejected:'
  - 'Code: SANDBOX_LOCAL_LISTEN_DENIED'
