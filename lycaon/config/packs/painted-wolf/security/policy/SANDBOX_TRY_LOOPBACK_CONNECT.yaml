oar: '1.0'
id: SANDBOX_TRY_LOOPBACK_CONNECT
kind: policy
anchor: tool.rejected
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.port
  - paintedwolf.missing_capability_loopback_connect
when: paintedwolf.rejection_code == "SANDBOX_TRY_LOOPBACK_CONNECT"
effect: block
copy:
  what: '`{{ tool }}` requires access to a local service{% if paintedwolf.port %} on port {{ paintedwolf.port }}{% endif %}.'
  cause: The requested port is outside this invocation's reviewed loopback grant.
  why: Listening on a port does not authorize a client connection to it.
  fix: '{% if paintedwolf.missing_capability_loopback_connect %}{% if paintedwolf.port %}For the still-needed local connection, submit only remaining work with `capability_request.loopback_connect:
    {"ports": [{{ paintedwolf.port }}]}`. Preserve completed effects and resolve uncertain outcomes before retrying them.{% endif %}{% endif %}'
  instead: ''
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:sandbox
x-paintedwolf-message: local service connection requires reviewed authority
x-paintedwolf-scenarios:
- id: page_loopback_grant_missing
  vars:
    tool: page_open
    port: '8080'
    tool_args: {}
  expect_contains:
  - 'Code: SANDBOX_TRY_LOOPBACK_CONNECT'
  - capability_request.loopback_connect
  - '8080'
- id: wait_loopback_grant_missing
  vars:
    tool: wait
    tool_args: {}
    port: 8080
  expect_contains:
  - 'Code: SANDBOX_TRY_LOOPBACK_CONNECT'
  - capability_request.loopback_connect
