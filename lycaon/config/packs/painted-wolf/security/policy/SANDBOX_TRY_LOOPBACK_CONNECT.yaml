spec_version: "1.0"
id: SANDBOX_TRY_LOOPBACK_CONNECT
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.missing_capability_loopback_connect, paintedwolf.port, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SANDBOX_TRY_LOOPBACK_CONNECT"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:sandbox
message: local service connection requires reviewed authority
what: '`{{ tool }}` requires access to a local service{% if paintedwolf.port %} on port {{ paintedwolf.port }}{% endif %}.'
cause: The requested port is outside this invocation's reviewed loopback grant.
why: Listening on a port does not authorize a client connection to it.
fix: '{% if paintedwolf.missing_capability_loopback_connect %}{% if paintedwolf.port %}For the still-needed local connection, submit only remaining work with `capability_request.loopback_connect: {"ports": [{{ paintedwolf.port }}]}`. Preserve completed effects and resolve uncertain outcomes before retrying them.{% endif %}{% endif %}'
instead: ''
x-paintedwolf-scenarios:
  - id: page_loopback_grant_missing
    vars:
      tool: page_open
      port: '8080'
      tool_args: {}
  - id: wait_loopback_grant_missing
    vars:
      tool: wait
      tool_args: {}
      port: 8080
