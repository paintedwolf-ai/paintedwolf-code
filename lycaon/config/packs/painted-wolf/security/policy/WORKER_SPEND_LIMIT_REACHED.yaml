spec_version: "1.0"
id: WORKER_SPEND_LIMIT_REACHED
kind: invariant
on: worker.report_check
selector: {}
requires_facts: [paintedwolf.resource_limit]
when: paintedwolf.resource_limit
effect: block
x-paintedwolf-audience:
  - coordinator
category: recoverable
emit: guard:worker_summary
message: 'Worker stopped at the spend limit'
what: 'The worker stopped at the armed spend limit before it reported.'
cause: 'The session reached the spend limit a person armed, so the round made no further model call.'
why: 'The limit ended the round, not the work. What the worker changed is kept with its job.'
fix: 'Preview what it changed and decide whether to land it. Starting or resuming workers waits until the person raises the limit.'
instead: 'Report what the worker kept and what remains; do not present the round as complete.'
scenarios:
  - id: default
    vars:
      session_role: coordinator
      tool: task
