oar: '1.0'
id: WORKER_CANCEL_NOT_FOUND
kind: policy
anchor: tool.rejected
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.job_id
when: paintedwolf.rejection_code == "WORKER_CANCEL_NOT_FOUND"
effect: block
copy:
  what: worker_cancel job_id must match a job spawned from this session
  cause: The job id is missing or stale
  why: The job id is missing or stale
  fix: Use job_id from `task()` enqueue JSON or the pulse roster for an in-flight job
  instead: Pass a valid job_id from `task()` enqueue or pulse roster
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
x-paintedwolf-message: No worker job {{ paintedwolf.job_id }} exists for worker_cancel
x-paintedwolf-scenarios:
- id: default
  vars:
    job_id: job-missing
  expect_contains:
  - 'Rejected:'
  - 'Code: WORKER_CANCEL_NOT_FOUND'
selector:
  tool:
  - worker_cancel
