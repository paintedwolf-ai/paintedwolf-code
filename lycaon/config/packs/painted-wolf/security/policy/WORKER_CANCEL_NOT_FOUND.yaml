spec_version: "1.0"
id: WORKER_CANCEL_NOT_FOUND
kind: policy
on: tool.rejected
selector:
  tools:
    - worker_cancel
requires_facts: [paintedwolf.rejection_code, paintedwolf.worker]
when: paintedwolf.rejection_code == "WORKER_CANCEL_NOT_FOUND"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
message: '{% if paintedwolf.worker %}Worker `{{ paintedwolf.worker }}`{% else %}This worker{% endif %} has no job to cancel'
what: '{% if paintedwolf.worker %}Worker `{{ paintedwolf.worker }}`{% else %}This worker{% endif %} has no job in this session to cancel.'
cause: 'The worker''s job no longer exists.'
why: 'There is nothing to stop.'
fix: 'Check the worker on the roster before cancelling.'
instead: 'Cancel only a worker the roster shows working, waiting or asking.'
x-paintedwolf-scenarios:
  - id: default
    vars:
      worker: parser-fix
