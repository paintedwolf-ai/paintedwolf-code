spec_version: "1.0"
id: PROGRESS_DOCUMENT_TOO_LARGE
kind: schema
on: tool.rejected
selector:
  tools: [update_progress]
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "PROGRESS_DOCUMENT_TOO_LARGE"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:update_progress
message: Progress document exceeds size budget
what: The checklist exceeds its document size budget.
cause: The proposed progress document contains too many characters.
why: The stored and returned checklist must contain the complete submitted document.
fix: Keep one concise row per deliverable and shorten the document within the reported character limit.
instead: Submit one concise row per deliverable within the reported character limit.
x-paintedwolf-scenarios:
  - id: default
    vars:
      tool: update_progress
      profile: coordinator
      max_characters: 8000
