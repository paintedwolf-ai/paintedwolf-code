spec_version: "1.0"
id: WORKER_REPORT_REQUIRED
kind: invariant
on: worker.report_check
selector: {}
requires_facts: [paintedwolf.next_steps, paintedwolf.reject_observation]
when: paintedwolf.reject_observation == "worker_report_required"
effect: block
category: recoverable
emit: guard:worker_summary
message: Worker report required
what: 'This worker job has no accepted completion report.'
cause: 'A prose response does not submit a structured report.'
why: 'The round continues with your tools. Repeated responses without a tool call end it as failed, keeping your work.'
fix: 'Continue any unfinished work. {{ paintedwolf.next_steps }}'
instead: 'Reuse completed work and its evidence.'
scenarios:
  - id: tools_available
    vars:
      session_role: worker
      tool: complete_leg
      can_complete_leg: true
  - id: tools_unavailable
    vars:
      session_role: worker
      can_complete_leg: false
