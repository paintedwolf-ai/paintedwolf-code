spec_version: "1.0"
id: PROGRESS_PENDING_AFTER_OPTIONAL
kind: schema
on: tool.rejected
selector:
  tools:
    - update_progress
requires_facts: [paintedwolf.label, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "PROGRESS_PENDING_AFTER_OPTIONAL"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:update_progress
message: Pending progress row follows an optional row
what: 'Pending row "{{ paintedwolf.label }}" appears after a `state: "optional"` row.'
cause: Optional rows must trail the plan — a `"pending"` row after `"optional"` would order active work behind non-blocking notes
why: '`state: "optional"` marks trailing non-blocking notes; any still-open deliverable must precede them'
fix: Place required `"pending"` rows before `"optional"` rows (for example by inserting with `after_id` before the first optional row or reordering via `replace`). Mark a row `"optional"` only when it is outside required completion; do not relabel required work to clear this rejection.
instead: Branch on Code; place `"pending"` rows before `"optional"` rows and retry update_progress
x-paintedwolf-scenarios:
  - id: default
    vars:
      label: Verify rollout
      tool: update_progress
