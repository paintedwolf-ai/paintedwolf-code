oar: '1.0'
id: WORKER_BUDGET_EXTEND_NOT_RUNNING
kind: schema
anchor: tool.rejected
requires:
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.job_id
  - paintedwolf.not_running
  profiles:
  - tool
when: paintedwolf.rejection_code == "WORKER_BUDGET_EXTEND_NOT_RUNNING"
effect: block
copy:
  what: '`extend_worker_budget(job_id, max_tool_loops)` only applies while a worker job is pending or
    running'
  cause: Job {{ paintedwolf.job_id }} is terminal, unknown, or has no child session yet
  why: Raising max_tool_loops mid-flight hot-reloads the child session; finished jobs need `task(child_session_id=…)`
    resume instead
  fix: Use job_id from pack_board or `task()` enqueue for an in-flight job, or resume with `task(child_session_id=…,
    max_tool_loops=…, brief={…})`
  instead: Branch on Code; extend only running/pending jobs or resume on child_session_id
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:extend_worker_budget
x-paintedwolf-message: Worker job {{ paintedwolf.job_id }} is not running — extend_worker_budget only
  applies to pending or running jobs
x-paintedwolf-scenarios:
- id: default
  vars:
    job_id: job-done
  expect_contains:
  - 'Rejected:'
  - 'Code: WORKER_BUDGET_EXTEND_NOT_RUNNING'
selector:
  tool:
  - extend_worker_budget
