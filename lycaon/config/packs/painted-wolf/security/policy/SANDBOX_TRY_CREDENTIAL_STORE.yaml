spec_version: "1.0"
id: SANDBOX_TRY_CREDENTIAL_STORE
kind: policy
on: tool.post_invoke
# command_output cannot carry a capability request; the retry is a fresh
# command or verify call.
selector:
  tools:
    - command
    - verify
requires_facts: [paintedwolf.completed_stages, paintedwolf.confine_applied, paintedwolf.destination, paintedwolf.failed_stages, paintedwolf.gh_credential_store_refused, paintedwolf.missing_capability_credential_store, paintedwolf.next_steps, paintedwolf.process_running, paintedwolf.refused_credential_store_paths, paintedwolf.refused_terminal_read_paths, paintedwolf.refused_terminal_write_paths]
when: >-
  paintedwolf.confine_applied && size(paintedwolf.refused_credential_store_paths) > 0 && (size(paintedwolf.failed_stages) > 0 || paintedwolf.process_running)
effect: warn
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:sandbox
message: the sandbox refused OS credential store access this invocation needed
what: In `{{ tool }}`{% if paintedwolf.failed_stages %} ({{ paintedwolf.failed_stages }}){% endif %}, the sandbox refused access to the host OS credential store at {{ paintedwolf.refused_credential_store_paths }}{% if paintedwolf.process_running %} while the job runs{% endif %}.
cause: '{% if paintedwolf.missing_capability_credential_store %}This invocation did not declare OS credential-store access.{% endif %}{% if paintedwolf.gh_credential_store_refused %} Because `gh` could not read the host credential store inside this boundary, stored token validity outside the sandbox is undetermined; do not treat `gh` authentication failure text here as an invalid or expired token.{% endif %}{% if paintedwolf.completed_stages %} Earlier completed stages ({{ paintedwolf.completed_stages }}) already succeeded and their local effects remain intact.{% endif %}{% if paintedwolf.refused_terminal_read_paths %} Reads of {{ paintedwolf.refused_terminal_read_paths }} were also refused; these host control-plane paths stay closed and no capability request opens them.{% endif %}{% if paintedwolf.refused_terminal_write_paths %} Writes to {{ paintedwolf.refused_terminal_write_paths }} were also refused; these host control-plane paths stay closed and no capability request opens them.{% endif %}{% if paintedwolf.destination %} The egress broker also refused a connection to `{{ paintedwolf.destination }}`.{% endif %}'
why: ''
fix: '{% if paintedwolf.process_running %}{{ paintedwolf.next_steps }} Do not start replacement work while this job is running. {% endif %}{% if paintedwolf.missing_capability_credential_store %}Only if an authenticated operation{% if paintedwolf.failed_stages %} such as {{ paintedwolf.failed_stages }}{% endif %} is still needed, submit only that remaining operation with `capability_request.credential_store: true` for read access to the OS credential store.{% if paintedwolf.completed_stages %} Keep completed results from {{ paintedwolf.completed_stages }} (such as `FETCH_HEAD`) without re-running them.{% else %} Preserve completed effects and resolve uncertain outcomes before retrying them.{% endif %}{% endif %}'
instead: ''
x-paintedwolf-scenarios:
  - id: macos_login_keychain
    vars:
      tool: command
      failed_stages:
        - gh pr view
      refused_credential_store_paths:
        - /Users/person/Library/Keychains/login.keychain-db
      tool_args: {}
  - id: linux_secret_service
    vars:
      tool: command
      failed_stages:
        - gh auth status
      refused_credential_store_paths:
        - /run/user/1000/bus
      tool_args: {}
  - id: mixed_fetch_and_gh_auth
    vars:
      tool: command
      tool_args: {}
      completed_stages:
        - git fetch https://github.com/org/repo.git main
      failed_stages:
        - gh auth status
      gh_credential_store_refused: true
      missing_capability_credential_store: true
      refused_credential_store_paths:
        - /Users/person/Library/Keychains/login.keychain-db
    expect_contains:
      - gh auth status
      - token validity outside the sandbox is undetermined
      - FETCH_HEAD
