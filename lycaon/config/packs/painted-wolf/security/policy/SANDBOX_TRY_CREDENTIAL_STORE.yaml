spec_version: "1.0"
id: SANDBOX_TRY_CREDENTIAL_STORE
kind: policy
on: tool.post_invoke
# command_output cannot carry a capability request; the retry is a fresh
# command or verify call.
selector:
  tools:
    - command
    - verify
requires_facts: [paintedwolf.confine_applied, paintedwolf.destination, paintedwolf.failed_stages, paintedwolf.missing_capability_credential_store, paintedwolf.next_steps, paintedwolf.process_running, paintedwolf.refused_credential_store_paths, paintedwolf.refused_terminal_read_paths, paintedwolf.refused_terminal_write_paths]
when: >-
  paintedwolf.confine_applied && size(paintedwolf.refused_credential_store_paths) > 0 && (size(paintedwolf.failed_stages) > 0 || paintedwolf.process_running)
effect: warn
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:sandbox
message: the sandbox refused OS credential store access this invocation needed
what: In `{{ tool }}`, the sandbox refused access to the host OS credential store at {{ paintedwolf.refused_credential_store_paths }}{% if paintedwolf.process_running %} while the job runs{% endif %}.
cause: '{% if paintedwolf.missing_capability_credential_store %}This invocation did not declare OS credential-store access.{% endif %}{% if paintedwolf.refused_terminal_read_paths %} Reads of {{ paintedwolf.refused_terminal_read_paths }} were also refused; these host control-plane paths stay closed and no capability request opens them.{% endif %}{% if paintedwolf.refused_terminal_write_paths %} Writes to {{ paintedwolf.refused_terminal_write_paths }} were also refused; these host control-plane paths stay closed and no capability request opens them.{% endif %}{% if paintedwolf.destination %} The egress broker also refused a connection to `{{ paintedwolf.destination }}`.{% endif %}'
why: ''
fix: '{% if paintedwolf.process_running %}{{ paintedwolf.next_steps }} Do not start replacement work while this job is running. {% endif %}{% if paintedwolf.missing_capability_credential_store %}If the operation is still needed, submit only the remaining work. Request `capability_request.credential_store: true` for read access to the OS credential store. Preserve completed effects and resolve uncertain outcomes before retrying them.{% endif %}'
instead: ''
x-paintedwolf-scenarios:
  - id: macos_login_keychain
    vars:
      tool: command
      failed_stages:
        - gh pr view
      refused_credential_store_paths:
        - /Users/person/Library/Keychains/login.keychain-db
      tool_args: {}
  - id: linux_secret_service
    vars:
      tool: command
      failed_stages:
        - gh auth status
      refused_credential_store_paths:
        - /run/user/1000/bus
      tool_args: {}
