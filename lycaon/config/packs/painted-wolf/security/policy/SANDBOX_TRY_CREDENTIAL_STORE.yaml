oar: '1.0'
id: SANDBOX_TRY_CREDENTIAL_STORE
kind: policy
anchor: tool.post_invoke
# command_output cannot carry a capability request; the retry is a fresh
# command or verify call.
selector:
  tool:
    - command
    - verify
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.confine_applied
  - paintedwolf.failed_stages
  - paintedwolf.process_running
  - paintedwolf.can_command_stop
  - paintedwolf.can_command_output
  - paintedwolf.refused_credential_store_paths
  - paintedwolf.missing_capability_credential_store
when: >-
  paintedwolf.confine_applied
  && size(paintedwolf.refused_credential_store_paths) > 0
  && (size(paintedwolf.failed_stages) > 0 || paintedwolf.process_running)
effect: warn
copy:
  what: In `{{ tool }}`, the sandbox refused access to the host OS credential store at {{ paintedwolf.refused_credential_store_paths }}{% if paintedwolf.process_running
    %} while the job runs{% endif %}.
  cause: 'A confined command cannot read the host OS credential store (macOS login keychain, Linux Secret Service or KWallet) unless it declares `capability_request.credential_store:
    true`.'
  why: ''
  fix: '{% if paintedwolf.process_running %}{% if paintedwolf.can_command_output %}Use command_output on this job''s handle to inspect its outcome. {% endif %}{%
    if paintedwolf.can_command_stop %}If this job is no longer needed, request command_stop once and observe its exit. {% endif %}Do not start replacement work while
    this job is running. {% endif %}{% if paintedwolf.missing_capability_credential_store %}If the operation is still needed, submit only the remaining work. Request `capability_request.credential_store:
    true` for read access to the OS credential store. Preserve completed effects and resolve uncertain outcomes before retrying them.{% endif %}'
  instead: ''
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:sandbox
x-paintedwolf-message: the sandbox refused OS credential store access this invocation needed
x-paintedwolf-scenarios:
  - id: macos_login_keychain
    vars:
      tool: command
      failed_stages: [gh pr view]
      refused_credential_store_paths: [/Users/person/Library/Keychains/login.keychain-db]
    expect_contains:
      - 'Code: SANDBOX_TRY_CREDENTIAL_STORE'
      - 'capability_request.credential_store: true'
      - login.keychain-db
  - id: linux_secret_service
    vars:
      tool: command
      failed_stages: [gh auth status]
      refused_credential_store_paths: [/run/user/1000/bus]
    expect_contains:
      - 'Code: SANDBOX_TRY_CREDENTIAL_STORE'
      - 'capability_request.credential_store: true'
      - /run/user/1000/bus
