oar: '1.0'
id: SANDBOX_TRY_CREDENTIAL_STORE
kind: policy
anchor: tool.post_invoke
# command_output cannot carry a capability request; the retry is a fresh
# command or verify call.
selector:
  tool:
    - command
    - verify
requires:
  profiles:
    - tool
  facts:
    - paintedwolf.confine_applied
    - paintedwolf.failed_stages
    - paintedwolf.process_running
    - paintedwolf.can_command_stop
    - paintedwolf.can_command_output
    - paintedwolf.refused_credential_store_paths
when: >-
  paintedwolf.confine_applied
  && size(paintedwolf.refused_credential_store_paths) > 0
  && (size(paintedwolf.failed_stages) > 0 || paintedwolf.process_running)
effect: warn
copy:
  what: >-
    In `{{ tool }}`, the sandbox refused access to the host OS credential
    store at {{ paintedwolf.refused_credential_store_paths }}{% if paintedwolf.process_running %}
    while the job runs{% else %}, and {{ paintedwolf.failed_stages }} failed{% endif %}.
  cause: >-
    A confined command cannot read the host OS credential store (macOS login
    keychain, Linux Secret Service or KWallet) unless it declares
    `capability_request.credential_store: true`.
  why: >-
    Repeating the command without the declaration is refused again.
  fix: >-
    {% if paintedwolf.process_running %}If this job needs the refused operation,
    {% if paintedwolf.can_command_stop %}request `command_stop` once.{% else %}Report the
    need to stop this job; no stop tool is offered.{% endif %}
    {% if paintedwolf.can_command_output %}Use `command_output` on its handle to observe
    exit.{% else %}Wait for its observed exit.{% endif %} A stop request alone does not
    establish exit. Do not reissue while the job is running. After it exits, review the outcome.
    {% endif %}Preserve completed effects. If the task still needs the refused operation, reissue
    the same command with `capability_request.credential_store: true` rather than
    `read_path` or `host_execution`; approval follows the project posture before it runs.
  instead: >-
    {% if paintedwolf.process_running %}Resolve the running job before retrying;
    a stop request alone does not establish exit.{% else %}Preserve completed effects;
    retry with the required capability only if the operation is still needed.{% endif %}
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:sandbox
x-paintedwolf-message: the sandbox refused OS credential store access this invocation needed
x-paintedwolf-scenarios:
  - id: macos_login_keychain
    vars:
      tool: command
      failed_stages: [gh pr view]
      refused_credential_store_paths: [/Users/person/Library/Keychains/login.keychain-db]
    expect_contains:
      - 'Code: SANDBOX_TRY_CREDENTIAL_STORE'
      - 'capability_request.credential_store: true'
      - login.keychain-db
  - id: linux_secret_service
    vars:
      tool: command
      failed_stages: [gh auth status]
      refused_credential_store_paths: [/run/user/1000/bus]
    expect_contains:
      - 'Code: SANDBOX_TRY_CREDENTIAL_STORE'
      - 'capability_request.credential_store: true'
      - /run/user/1000/bus
