spec_version: "1.0"
id: CREDENTIAL_LITERAL
kind: policy
on: credential.assignment
selector: {}
requires_facts: [paintedwolf.assignment, paintedwolf.credential_distinct_words, paintedwolf.credential_fingerprint, paintedwolf.credential_harvested, paintedwolf.credential_ignored, paintedwolf.credential_length, paintedwolf.credential_longest_run, paintedwolf.credential_run_classes, paintedwolf.listed, paintedwolf.next_steps, paintedwolf.scoped_fire_count]
when: >-
  !paintedwolf.credential_ignored && !paintedwolf.credential_harvested && paintedwolf.scoped_fire_count == 0 && !paintedwolf.listed && ((paintedwolf.credential_length >= 20 && paintedwolf.credential_distinct_words >= 4) || (paintedwolf.credential_longest_run >= 16 && paintedwolf.credential_run_classes >= 2))
effect: warn
on_error: fail_open
on_fire:
  - increment_counter
x-paintedwolf-counter-scope: paintedwolf.credential_fingerprint
category: informational
emit: guard:secret_mint
message: a possible credential was supplied as a literal
what: >-
  A possible credential in `{{ paintedwolf.assignment }}` was supplied as a literal.
cause: >-
  The argument or field matches a credential slot in the host's catalog. This is a heuristic observation; it does not establish that the value is a credential or that you created it.
why: >-
  Literal credentials may remain visible in ordinary history. This warning neither protects the value nor proves whether another screen recognized it.
fix: 'If this is a credential, use a managed reference rather than an exposed literal. {{ paintedwolf.next_steps }} Pass managed references to commands, process environment, or file-writing tools (such as `.env`); the host writes the value when the file is saved; your approval posture decides whether you''re asked first. Ordinary data and deliberately weak test fixtures need no correction. Inspect the completed operation before deciding whether anything needs to be repeated.'
instead: >-
  Check whether this value is a credential. Use protected generation or input when needed; continue when the value is ordinary data or an intentionally weak fixture.
scenarios:
  - id: literal_value
    vars: {tool: command, assignment: client_secret, listed: false}
