oar: '1.0'
id: CREDENTIAL_LITERAL
kind: policy
anchor: credential.assignment
requires:
  profiles: [tool]
  facts:
    - paintedwolf.credential_length
    - paintedwolf.credential_distinct_words
    - paintedwolf.credential_longest_run
    - paintedwolf.credential_run_classes
    - paintedwolf.credential_fingerprint
    - paintedwolf.credential_ignored
    - paintedwolf.credential_harvested
    - paintedwolf.assignment
    - paintedwolf.listed
    - paintedwolf.can_secret_generate
    - paintedwolf.can_request_tools
    - paintedwolf.can_ask_user
when: >-
  !paintedwolf.credential_ignored && !paintedwolf.credential_harvested && fire_count == 0 && !paintedwolf.listed &&
  ((paintedwolf.credential_length >= 20 && paintedwolf.credential_distinct_words >= 4) ||
   (paintedwolf.credential_longest_run >= 16 && paintedwolf.credential_run_classes >= 2))
counter_scope: paintedwolf.credential_fingerprint
on_fire:
  - increment_counter
on_error: fail_open
effect: warn
copy:
  what: >-
    A possible credential in `{{ paintedwolf.assignment }}` was supplied as a literal.
  cause: >-
    The argument or field matches a credential slot in the host's catalog.
    This is a heuristic observation; it does not establish that the value is a
    credential or that you created it.
  why: >-
    Literal credentials may remain visible in ordinary history.
    This warning neither protects the value nor proves whether another screen recognized it.
  fix: >-
    If this is a credential, use a managed reference rather than an exposed literal.
    {% if paintedwolf.can_secret_generate %}For a new credential, use `secret_generate` and carry its returned reference.{% else %}{% if paintedwolf.can_request_tools %}For a new credential, use `request_tools` to check for `secret_generate` and load it when available; carry its returned managed reference.{% else %}If you need a new credential, report that need to the coordinating session for protected generation.{% endif %}{% endif %}
    {% if paintedwolf.can_ask_user %}For an existing credential, use its managed reference or request it with `ask_user(response_type: secret)`.{% else %}{% if paintedwolf.can_request_tools %}If an existing credential is missing, use `request_tools` to check for `ask_user` and load it when available, then request protected input with `ask_user(response_type: secret)`.{% else %}If an existing credential is missing, report the need for protected input to the coordinating session; do not request plaintext in a report.{% endif %}{% endif %}
    Pass managed references to commands, process environment, or file-writing tools (such as `.env`); the host writes the value when the file is saved; your approval posture decides whether you're asked first.
    Ordinary data and deliberately weak test fixtures need no correction.
    Inspect the completed operation before deciding whether anything needs to be repeated.
  instead: >-
    Check whether this value is a credential. Use protected generation or input when needed;
    continue when the value is ordinary data or an intentionally weak fixture.
x-paintedwolf-category: informational
x-paintedwolf-emit: guard:secret_mint
x-paintedwolf-message: a possible credential was supplied as a literal
x-paintedwolf-scenarios:
  - id: literal_value
    vars: {tool: command, assignment: client_secret, listed: false}
    expect_contains: ['Code: CREDENTIAL_LITERAL', 'heuristic observation', 'managed reference']
