oar: '1.0'
id: SANDBOX_TRY_HOST_EXECUTION
kind: policy
anchor: tool.post_invoke
# command_output cannot carry a capability request; the retry is a fresh
# command or verify call.
selector:
  tool:
    - command
    - verify
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.confine_applied
  - paintedwolf.failed_stages
  - paintedwolf.process_running
  - paintedwolf.can_command_stop
  - paintedwolf.can_command_output
  - paintedwolf.unsandboxed_refusals
  - paintedwolf.missing_capability_host_execution
when: >-
  paintedwolf.confine_applied
  && size(paintedwolf.unsandboxed_refusals) > 0
  && (size(paintedwolf.failed_stages) > 0 || paintedwolf.process_running)
effect: warn
copy:
  what: In `{{ tool }}`, the sandbox refused {{ paintedwolf.unsandboxed_refusals }}{% if paintedwolf.process_running %}, and the job is still running{% endif %}.
  cause: '{% if paintedwolf.missing_capability_host_execution %}This invocation did not request host execution.{% endif %}'
  why: ''
  fix: '{% if paintedwolf.process_running %}{% if paintedwolf.can_command_output %}Use command_output on this job''s handle to inspect its outcome. {% endif %}{%
    if paintedwolf.can_command_stop %}If this job is no longer needed, request command_stop once and observe its exit. {% endif %}Do not start replacement work while
    this job is running. {% endif %}{% if paintedwolf.missing_capability_host_execution %}{% if paintedwolf.unsandboxed_refusals %}If the operation is still needed,
    submit only the remaining work. Request `capability_request.host_execution` alone for the refused operation; it requires review outside confinement. Preserve
    completed effects and resolve uncertain outcomes before retrying them.{% endif %}{% endif %}'
  instead: ''
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:sandbox
x-paintedwolf-message: the sandbox refused an operation no sandbox capability admits
x-paintedwolf-scenarios:
- id: vm_network_socket
  vars:
    tool: command
    process_running: true
    can_command_stop: true
    can_command_output: true
    unsandboxed_refusals:
    - network-bind /Users/person/.colima/_lima/_networks/user-v2/user-v2_fd.sock (limactl)
    tool_args: {}
  expect_contains:
  - 'Code: SANDBOX_TRY_HOST_EXECUTION'
  - capability_request.host_execution
  - command_stop
  - may never finish
  - user-v2_fd.sock
- id: finished_failure
  vars:
    tool: verify
    failed_stages:
    - make install
    unsandboxed_refusals:
    - iokit-open AppleUSBHostDevice (make)
    tool_args: {}
  expect_contains:
  - 'Code: SANDBOX_TRY_HOST_EXECUTION'
  - capability_request.host_execution
