spec_version: "1.0"
id: WORKER_CANCEL_TERMINAL
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code, paintedwolf.status, paintedwolf.worker]
when: paintedwolf.rejection_code == "WORKER_CANCEL_TERMINAL"
effect: block
category: recoverable
emit: guard:coordinator
message: '{% if paintedwolf.worker %}Worker `{{ paintedwolf.worker }}`{% else %}This worker{% endif %} is already {{ paintedwolf.status }} and cannot be cancelled'
what: '{% if paintedwolf.worker %}The round of worker `{{ paintedwolf.worker }}`{% else %}This round{% endif %} already ended ({{ paintedwolf.status }}).'
cause: 'The round already finished or was cancelled.'
why: 'There is no running round to stop.'
fix: 'Read the round''s completion or cancellation notice instead of cancelling again.'
instead: 'Use the existing notice; do not cancel a round that has ended.'
scenarios:
  - id: default
    vars:
      worker: parser-fix
      status: complete
