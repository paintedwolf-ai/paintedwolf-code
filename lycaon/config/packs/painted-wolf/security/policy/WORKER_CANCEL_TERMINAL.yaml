spec_version: "1.0"
id: WORKER_CANCEL_TERMINAL
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.job_id, paintedwolf.rejection_code, paintedwolf.status]
when: paintedwolf.rejection_code == "WORKER_CANCEL_TERMINAL"
effect: block
category: recoverable
emit: guard:coordinator
message: Worker job {{ paintedwolf.job_id }} is already {{ paintedwolf.status }} and cannot be canceled
what: worker_cancel only applies to pending, running, or held jobs
cause: The job already finished or was canceled
why: The job already finished or was canceled
fix: 'Read the completion or cancellation envelope on the transcript instead of cancelling it again.'
instead: Use the existing envelope on the transcript — do not cancel terminal jobs
scenarios:
  - id: default
    vars:
      job_id: job-done
      status: complete
