oar: '1.0'
id: PROGRESS_ITEM_NOT_CLOSED
kind: policy
anchor: coordinator.pre_invoke
requires:
  profiles:
    - tool
  facts:
    - paintedwolf.pending
    - paintedwolf.progress_closure_armed
    - paintedwolf.progress_gated_tool
    - paintedwolf.progress_open_items
    - paintedwolf.settled_work
when: paintedwolf.progress_closure_armed && paintedwolf.progress_gated_tool
effect: block
copy:
  what: 'Worker finishes await acknowledgement before **`{{ tool }}`**{% if paintedwolf.settled_work %}: {{ paintedwolf.settled_work }}{% endif %}.'
  cause: The worker finishes have not been acknowledged in current progress state.
  why: Completed work that the checklist does not show hides real progress from the user.
  fix: >-
    Call `update_progress` with the current reconciliation_token and expected_revision to acknowledge the listed worker finishes. Close only deliverables actually finished.
    If it finished only part of a row, revise the plan honestly and copy the current snapshot's
    reconciliation_token and expected_revision to acknowledge its listed worker jobs.
    Keep unfinished rows pending. An unchanged document can acknowledge that token;
    an unchanged document without acknowledgement does not clear this reject.
    Then immediately retry the authorized `{{ tool }}` action.
  instead: Acknowledge the listed worker finishes with the current reconciliation_token and expected_revision, then retry the authorized action
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
x-paintedwolf-message: Reconcile Progress rows before more progress-gated work
x-paintedwolf-scenarios:
  - id: not_closed
    vars:
      pending: 3
      tool: task
      settled_work:
        - 'security-reviewer `job-1`: Loopback API authentication'
    expect_contains:
      - 'Rejected:'
      - 'Code: PROGRESS_ITEM_NOT_CLOSED'
      - update_progress
      - Loopback API authentication
      - unchanged
      - revise
      - immediately
