spec_version: "1.0"
id: PROGRESS_ITEM_NOT_CLOSED
kind: hint
severity: block
emit: guard:coordinator
x-paintedwolf-status: deprecated
x-paintedwolf-successor: PROGRESS_RECONCILIATION_REQUIRED
x-paintedwolf-category: recoverable
message: Reconcile Progress rows before more progress-gated work
what: Worker output completed while progress steps were open, and a progress-gated tool was called before the checklist recorded it.
cause: The checklist had not changed since that work completed.
why: Completed work that the checklist does not show hides real progress from the user.
fix: Record the completed work in the checklist, then retry the gated tool. Resubmitting the identical checklist does not clear this reject.
instead: Record the completed work, then retry on the next call.
