spec_version: "1.0"
id: OVERLAY_REJECT_WORKER_WORKING
kind: policy
on: tool.rejected
selector:
  tools:
    - reject_overlay
requires_facts: [paintedwolf.next_steps, paintedwolf.overlay_id, paintedwolf.rejection_code, paintedwolf.worker]
when: paintedwolf.rejection_code == "OVERLAY_REJECT_WORKER_WORKING"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
message: '{% if paintedwolf.worker %}Worker `{{ paintedwolf.worker }}`{% else %}The worker{% endif %} is working on a later round that builds on {% if paintedwolf.overlay_id %}result `{{ paintedwolf.overlay_id }}`{% else %}this result{% endif %}'
what: '{% if paintedwolf.worker %}Worker `{{ paintedwolf.worker }}`{% else %}The worker{% endif %} is working on a later round that builds on {% if paintedwolf.overlay_id %}result `{{ paintedwolf.overlay_id }}`{% else %}this result{% endif %}'
cause: 'Each round continues from the worker''s earlier changes, so the running round already contains these.'
why: 'Rejecting them now would leave the running round''s result holding changes that were rejected.'
fix: '{{ paintedwolf.next_steps }}'
instead: 'Branch on Code; reject once the worker has no round running'
x-paintedwolf-scenarios:
  - id: default
    vars:
      overlay_id: result-1
      worker: parser-fix
