spec_version: "1.0"
id: WRITE_SCOPE_DENIED
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.path, paintedwolf.patterns_list, paintedwolf.redirect, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "WRITE_SCOPE_DENIED"
effect: block
category: recoverable
emit: guard:write_scope
message: path outside profile write scope
what: '{{ tool }} path {{ paintedwolf.path }} is outside profile {{ profile }} write scope.'
cause: The path must match at least one allowed write glob for this profile.
why: All mutations and file redirects must stay within the active write contract.
fix: 'Allowed write globs for this profile:

  {{ paintedwolf.patterns_list }}

  {% if paintedwolf.redirect %}If saving output was optional, omit the output-file destination and inspect the bounded result tail. If a file is required, its destination must both serve the intended task and be in scope.{% else %}Use an in-scope path only when it is the intended destination. Otherwise report the scope dependency; changing mutation tools does not expand authority.{% endif %}'
instead: Preserve the intended destination and respect the active write scope
scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      patterns_list: '- `${overlay_dir}/blueprints/**`'
      profile: plan_write_only
      tool: write
  - id: command_redirect
    vars:
      detail: bad args
      kind: redirect
      path: weather_output.txt
      patterns_list: '- `${overlay_dir}/blueprints/**`'
      profile: plan_writer
      tool: command
  - id: verify_redirect
    vars:
      detail: bad args
      kind: redirect
      path: out.log
      patterns_list: '- `${overlay_dir}/blueprints/**`'
      profile: plan_writer
      tool: verify
