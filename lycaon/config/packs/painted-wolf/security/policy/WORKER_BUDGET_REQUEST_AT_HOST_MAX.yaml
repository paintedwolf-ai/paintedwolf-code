spec_version: "1.0"
id: WORKER_BUDGET_REQUEST_AT_HOST_MAX
kind: policy
on: tool.rejected
selector:
  tools:
    - request_budget
requires_facts: [paintedwolf.host_max, paintedwolf.max_tool_loops, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "WORKER_BUDGET_REQUEST_AT_HOST_MAX"
effect: block
category: recoverable
emit: guard:request_budget
message: This leg's ceiling is already the host maximum
what: This leg's ceiling of {{ paintedwolf.max_tool_loops }} tool rounds is already the host maximum.
cause: The host bounds every worker ceiling at {{ paintedwolf.host_max }}, and no grant can exceed it.
why: A request the coordinator cannot grant would only spend its attention.
fix: Finish the work already in progress, then return an honest partial report that names what is left in remaining_risk and suggested_next_task.
instead: Report the remaining work; do not repeat request_budget
scenarios:
  - id: default
    vars:
      max_tool_loops: 120
      host_max: 120
