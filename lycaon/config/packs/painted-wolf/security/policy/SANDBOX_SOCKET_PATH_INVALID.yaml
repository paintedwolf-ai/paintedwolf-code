spec_version: "1.0"
id: SANDBOX_SOCKET_PATH_INVALID
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code, paintedwolf.rejection_reason]
when: paintedwolf.rejection_code == "SANDBOX_SOCKET_PATH_INVALID"
effect: block
category: recoverable
emit: guard:sandbox_socket
message: the structured socket path request is invalid
what: 'The requested socket (`capability_request.socket_paths` or a tool''s socket argument) was rejected before use because one or more paths failed host validation. Raw model paths never reach the sandbox profile.'
cause: 'The structured path failed validation: {{ paintedwolf.rejection_reason }}.'
why: AF_UNIX grants must name exact absolute paths the host can validate before any process starts.
fix: Use nonempty valid UTF-8 absolute paths without NUL, naming the intended service sockets. Correct the reported input and retain the requested service scope; do not infer socket paths by parsing stderr.
instead: Branch on Code; correct structured args — never parse stderr
scenarios:
  - id: command_socket_path_invalid
    vars: {}
