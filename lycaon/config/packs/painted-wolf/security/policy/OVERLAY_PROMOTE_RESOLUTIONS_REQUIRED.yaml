spec_version: "1.0"
id: OVERLAY_PROMOTE_RESOLUTIONS_REQUIRED
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.job_id, paintedwolf.next_steps, paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "OVERLAY_PROMOTE_RESOLUTIONS_REQUIRED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
message: promote_overlay needs resolutions for overlay {{ paintedwolf.job_id }}{% if paintedwolf.path %} on `{{ paintedwolf.path }}`{% endif %} — at least one conflict path is missing merged content
what: Overlay {{ paintedwolf.job_id }} needs resolutions{% if paintedwolf.path %} for `{{ paintedwolf.path }}`{% endif %}
cause: 'Promotion was called on a conflicting overlay without a resolutions array, or a conflict path was omitted'
why: The host cannot guess merged content — the coordinator must supply explicit primary patches after reading preview hunks or spill_path
fix: '{{ paintedwolf.next_steps }} For overlapping_edit pass resolutions=[{path, hunks}] back-to-front; for line_shift pass [{path, content}] from primary + branch_delta / spill.'
instead: 'Preview first, then give tier-appropriate resolutions for every conflict path, then promote.'
x-paintedwolf-scenarios:
  - id: default
    vars:
      job_id: job-resolve
  - id: missing_path
    vars:
      job_id: job-resolve
      path: internal/auth/login.go
