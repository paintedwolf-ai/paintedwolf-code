spec_version: "1.0"
id: WORKER_BUDGET_EXTEND_SESSION_MISMATCH
kind: schema
on: tool.rejected
selector:
  tools:
    - extend_worker_budget
requires_facts: [paintedwolf.job_id, paintedwolf.next_steps, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "WORKER_BUDGET_EXTEND_SESSION_MISMATCH"
effect: block
category: recoverable
emit: guard:extend_worker_budget
message: Worker job {{ paintedwolf.job_id }} does not belong to this coordinator session
what: extend_worker_budget may only target jobs spawned from the caller session
cause: job_id {{ paintedwolf.job_id }} belongs to another parent session
why: Worker budget extend is a coordinator→worker control plane action scoped to your session
fix: 'Use job_id from your worker enqueue result. {{ paintedwolf.next_steps }}'
instead: Branch on Code; pass a job_id belonging to this session
scenarios:
  - id: default
    vars:
      job_id: job-other
