oar: '1.0'
id: SANDBOX_TRY_PROCESS_CONTROL
kind: policy
anchor: tool.post_invoke
# command_output cannot carry a capability request; the retry is a fresh
# command or verify call.
selector:
  tool:
    - command
    - verify
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.confine_applied
  - paintedwolf.failed_stages
  - paintedwolf.process_running
  - paintedwolf.can_command_stop
  - paintedwolf.can_command_output
  - paintedwolf.refused_signals
  - paintedwolf.missing_capability_process_control
when: >-
  paintedwolf.confine_applied
  && size(paintedwolf.refused_signals) > 0
  && (size(paintedwolf.failed_stages) > 0 || paintedwolf.process_running)
effect: warn
copy:
  what: 'In `{{ tool }}`, the sandbox refused signals to processes outside the command''s boundary: {{ paintedwolf.refused_signals }}.'
  cause: '{% if paintedwolf.missing_capability_process_control %}This invocation did not declare process-control access.{% endif %}'
  why: ''
  fix: '{% if paintedwolf.process_running %}{% if paintedwolf.can_command_output %}Use command_output on this job''s handle to inspect its outcome. {% endif %}{%
    if paintedwolf.can_command_stop %}If this job is no longer needed, request command_stop once and observe its exit. {% endif %}Do not start replacement work while
    this job is running. {% endif %}{% if paintedwolf.missing_capability_process_control %}{% if paintedwolf.refused_signals %}If the operation is still needed, submit
    only the remaining work. Request `capability_request.process_control` for the refused process operation. Preserve completed effects and resolve uncertain outcomes
    before retrying them.{% endif %}{% endif %}'
  instead: ''
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:sandbox
x-paintedwolf-message: the sandbox refused a signal to a process outside the boundary
x-paintedwolf-scenarios:
- id: stop_server
  vars:
    tool: command
    failed_stages:
    - kill 4121
    refused_signals:
    - signal (kill)
    tool_args: {}
  expect_contains:
  - 'Code: SANDBOX_TRY_PROCESS_CONTROL'
  - capability_request.process_control
