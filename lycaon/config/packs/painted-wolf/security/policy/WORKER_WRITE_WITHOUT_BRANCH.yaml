spec_version: "1.0"
id: WORKER_WRITE_WITHOUT_BRANCH
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.path, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "WORKER_WRITE_WITHOUT_BRANCH"
effect: block
category: recoverable
emit: guard:worker_write
message: worker mutation blocked — no write branch is active
what: Worker mutation on **{{ paintedwolf.path }}** blocked — no private write branch for this job.
cause: This worker job has no active private write branch.
why: Mutations require a claimed write branch; otherwise they would hit the live project tree.
fix: Stop mutations and report the missing write workspace through an available finding or completion channel. The coordinator or host must establish a valid write workspace before mutation can resume; changing a tool argument cannot repair this state.
instead: Report the missing worker write workspace
scenarios:
  - id: default
    vars:
      agent_type: implementer
      job_id: abc123
      path: src/main.go
      session_role: implement
      tool: write
