oar: '1.0'
id: SANDBOX_CONTROL_PLANE_DENIED
kind: policy
anchor: tool.rejected
# No tool selector: any tool that names a path can reach this code.
requires:
  profiles:
    - tool
  facts:
    - paintedwolf.rejection_code
    - paintedwolf.path
when: paintedwolf.rejection_code == "SANDBOX_CONTROL_PLANE_DENIED"
effect: block
copy:
  what: 'This operation would reach the app''s own state through {{ paintedwolf.path }}.'
  cause: File and folder approvals do not cover the app's settings, credentials, tool definitions or policy.
  why: The app uses those files to decide what tools may do.
  fix: >-
    Attach a folder outside the app's own state. If needed, ask the person
    to copy or export content into an attached folder. Changes to the app's
    configuration belong in Settings.
  instead: Continue without this path. Ask the person to export needed content or change the app settings.
x-paintedwolf-category: control-plane
x-paintedwolf-emit: guard:sandbox_control_plane
x-paintedwolf-message: host control-plane access is unavailable to agents
x-paintedwolf-scenarios:
  - id: read_path
    vars:
      capability: read_path
      path: ${config_dir}/approvals.yaml
      tool: command
  - id: survey
    vars:
      mode: read
      path: ${config_dir}/debug/sessions
      tool: list_dir
  - id: write
    vars:
      mode: write
      path: ${config_dir}/packs/stock/skills/verify-a-change/SKILL.md
      tool: write
