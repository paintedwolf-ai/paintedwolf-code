spec_version: "1.0"
id: PROGRESS_SYNTHESIS_RECONCILE_ONLY
kind: invariant
on: coordinator.pre_invoke
selector:
  tools: [update_progress]
requires_facts: [paintedwolf.progress_reconcile_needed, paintedwolf.surface]
when: paintedwolf.surface == "implement_synthesis" && paintedwolf.progress_reconcile_needed
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
message: Report-turn update_progress may only reconcile existing rows
what: You called **`update_progress`** on **`implement_synthesis`**, but the call attempted `replace`, `add`, `remove`, row relabeling, or reopening a finished row.
cause: On the read-only report turn, update_progress may only update existing pending rows to done or na — not replace, add, remove, relabel, or reopen rows
why: New plan scope belongs on **`implement_investigate`** before the report turn; synthesis holds the report once the plan is terminal
fix: Update existing rows with `update` (`state` set to `"done"` or `"na"`) only — omit `replace`, `add`, `remove`, and `label`, and do not reopen terminal rows — then deliver the final report
instead: Reconcile existing rows in place with `update` (`state` set to `"done"` or `"na"` only), then deliver the final report
x-paintedwolf-scenarios:
  - id: new_scope
