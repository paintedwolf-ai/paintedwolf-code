emit: banner
category: informational
severity: info
message: values were sent redacted; a receipt names the send
what: Values were sent redacted before this request left the machine.
cause: A value matched the outbound credential screen; the send completed with
  placeholders.
why: Result text cannot release a value. Only the cited receipt can raise the
  question, and only the user can answer it.
fix: If redaction prevented the operation, first inspect its recorded outcome and any partial effects. Only when retry is safe and this tool accepts `unredact`, reissue the call with the receipt token below so the host can ask the user. Do not duplicate a completed mutation or use a different tool to evade the screen. Otherwise continue with the existing result; the token is single-use and expires with this task.
instead: Request receipt-based release only when needed and safe to retry
scenarios:
- id: fetch_receipt
  vars:
    tool: fetch_url
  expect_contains:
  - 'Code: SECRET_REDACTED_RECEIPT'
  - unredact
id: SECRET_REDACTED_RECEIPT
