spec_version: "1.0"
id: SANDBOX_SOCKET_PATH_DENIED
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code, paintedwolf.user_guidance]
when: paintedwolf.rejection_code == "SANDBOX_SOCKET_PATH_DENIED"
effect: block
category: user-decision
emit: guard:sandbox_socket
message: local-service socket authority declined
what: Local-service socket authority was declined for this action.
cause: The person answered the host approval request without granting the requested socket paths.
why: Retrying the same request would disregard that decision.
fix: '{% if paintedwolf.user_guidance %}User direction: {{ paintedwolf.user_guidance }}. Follow that direction before requesting approval for a corrected action.{% else %}Continue without those local services. Wait for new user direction before requesting approval again.{% endif %}'
instead: Respect this rejection; fresh user direction permits a new approval request
scenarios:
  - id: default
    vars: {}
