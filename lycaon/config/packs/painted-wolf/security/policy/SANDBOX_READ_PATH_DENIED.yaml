oar: '1.0'
id: SANDBOX_READ_PATH_DENIED
kind: policy
anchor: tool.rejected
requires:
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.user_guidance
  - paintedwolf.path
  profiles:
  - tool
when: paintedwolf.rejection_code == "SANDBOX_READ_PATH_DENIED"
effect: block
copy:
  what: '{{ tool }} was not granted read access to {{ paintedwolf.path }}.'
  cause: Read authority is not on this invocation.
  why: Retrying the same read_path request loops on the same refusal.
  fix: '{% if paintedwolf.user_guidance %}User direction: {{ paintedwolf.user_guidance }} {% endif %}Continue
    without the content and report what is missing. If the task cannot proceed without that path, wait for
    new user direction.'
  instead: Branch on Code; continue without the content — do not re-request the denied path
x-paintedwolf-category: user-decision
x-paintedwolf-emit: guard:sandbox_read_path
x-paintedwolf-message: this command cannot read the protected path
x-paintedwolf-scenarios:
- id: command_read_path_denied
  vars:
    tool: command
  expect_contains:
  - 'Code: SANDBOX_READ_PATH_DENIED'
  - without the content
