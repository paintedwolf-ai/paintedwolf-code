spec_version: "1.0"
id: OVERLAY_PROMOTE_SESSION_MISMATCH
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.overlay_id, paintedwolf.rejection_code, paintedwolf.worker]
when: paintedwolf.rejection_code == "OVERLAY_PROMOTE_SESSION_MISMATCH"
effect: block
category: recoverable
emit: guard:coordinator
message: '{% if paintedwolf.overlay_id %}Result `{{ paintedwolf.overlay_id }}`{% else %}This result{% endif %}{% if paintedwolf.worker %} from worker `{{ paintedwolf.worker }}`{% endif %} belongs to another coordinator session'
what: '{% if paintedwolf.overlay_id %}Result `{{ paintedwolf.overlay_id }}`{% else %}This result{% endif %}{% if paintedwolf.worker %} from worker `{{ paintedwolf.worker }}`{% endif %} belongs to another coordinator session and cannot be acted on from here.'
cause: 'The handle was copied from another session.'
why: 'Acting on another session''s results would bypass the coordinator that started the worker.'
fix: 'Act only on results from this session''s roster.'
instead: 'Branch on Code; use handles from this session''s roster'
scenarios:
  - id: default
    vars:
      overlay_id: result-foreign
