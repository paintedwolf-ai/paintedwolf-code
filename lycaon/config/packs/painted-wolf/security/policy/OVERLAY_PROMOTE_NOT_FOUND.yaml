spec_version: "1.0"
id: OVERLAY_PROMOTE_NOT_FOUND
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.overlay_id, paintedwolf.rejection_code, paintedwolf.worker]
when: paintedwolf.rejection_code == "OVERLAY_PROMOTE_NOT_FOUND"
effect: block
category: recoverable
emit: guard:coordinator
message: '{% if paintedwolf.overlay_id %}No pending changes for result `{{ paintedwolf.overlay_id }}`{% else %}No pending changes for this result{% endif %} in this session'
what: '{% if paintedwolf.overlay_id %}Result `{{ paintedwolf.overlay_id }}`{% else %}This result{% endif %} has no changes in this session to act on.'
cause: 'The handle is from an earlier result, its changes were already landed or rejected, or it was mistyped.'
why: 'There are no changes to act on; repeating the call will keep failing.'
fix: 'Use the result handle the roster shows for the worker, or treat the work as finished.'
instead: 'Branch on Code; check the handle against the roster'
scenarios:
  - id: default
    vars:
      overlay_id: result-missing
