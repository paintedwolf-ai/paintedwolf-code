spec_version: "1.0"
id: PROGRESS_NO_OPEN_STEP
kind: schema
on: tool.rejected
selector:
  tools:
    - update_progress
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "PROGRESS_NO_OPEN_STEP"
effect: block
category: recoverable
emit: guard:update_progress
message: Progress checklist must start with at least one open step
what: Initial progress checklist contains no open `- [ ]` steps.
cause: Starting a progress checklist requires at least one open `- [ ]` deliverable for the current request.
why: A checklist with zero open steps tracks no active work.
fix: >-
  Include at least one open `- [ ]` row for the deliverables planned for this request. If no work remains for this request, continue without a checklist (no closeout gate requires one unless gated tools were attempted).
instead: Branch on Code; include at least one open `- [ ]` step or continue without update_progress if no work remains
scenarios:
  - id: default
    vars:
      tool: update_progress
