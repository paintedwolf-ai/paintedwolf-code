spec_version: "1.0"
id: PROGRESS_MISSING
kind: policy
on: coordinator.pre_invoke
selector: {}
requires_facts: [paintedwolf.next_steps, paintedwolf.progress_gated_tool, paintedwolf.progress_missing, paintedwolf.review_loop_active, paintedwolf.session_posture]
when: paintedwolf.progress_gated_tool && paintedwolf.progress_missing && !paintedwolf.review_loop_active && paintedwolf.session_posture != "spec"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
message: Progress-gated tools require progress rows first
what: '**`{{ tool }}`** did not run: the current request has no active progress rows.'
cause: 'Edits and delegated work start only after the deliverables are seeded in progress. A plan completed for an earlier request does not cover a new request.'
why: A progress update does not run the rejected call.
fix: '{{ paintedwolf.next_steps }} Replace the labels with the requested deliverables; use `state: "optional"` for trailing report-only notes. After it succeeds, retry the rejected **`{{ tool }}`** call with its original arguments. A different edit or dispatch tool has the same prerequisite.'
instead: 'Seed the progress rows, then retry the same rejected call.'
x-paintedwolf-scenarios:
  - id: missing_checklist_task
    vars:
      session_posture: build
      tool: task
  - id: missing_checklist_write
    vars:
      session_posture: build
      tool: write
