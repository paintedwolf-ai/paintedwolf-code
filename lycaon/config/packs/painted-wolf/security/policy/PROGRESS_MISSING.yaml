oar: '1.0'
id: PROGRESS_MISSING
kind: policy
anchor: coordinator.pre_invoke
requires:
  profiles:
    - tool
    - session
  facts:
    - paintedwolf.progress_gated_tool
    - paintedwolf.progress_missing
    - paintedwolf.review_loop_active
when: paintedwolf.progress_gated_tool && paintedwolf.progress_missing && !paintedwolf.review_loop_active && session_posture != "spec"
effect: block
copy:
  what: '**`{{ tool }}`** did not run: this session has no progress checklist yet.'
  cause: Edits and delegated work start only after the deliverables are recorded with update_progress.
  why: Workers and the final report rely on the recorded deliverables.
  fix: Call **`update_progress`** with a **`## Progress`** heading and one pending **`- [ ]`** row for each deliverable in the request (use **`- [>]`** for optional report-only rows). Then retry **`{{ tool }}`**. Do not switch to a different edit or dispatch tool to avoid this step.
  instead: Call **`update_progress`**, then retry **`{{ tool }}`**
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:coordinator
x-paintedwolf-message: Progress-gated tools require a progress checklist first
x-paintedwolf-scenarios:
  - id: missing_checklist_task
    vars:
      session_posture: build
      tool: task
    expect_contains:
      - 'Rejected:'
      - 'Code: PROGRESS_MISSING'
      - update_progress
      - '## Progress'
      - did not run
      - retry
  - id: missing_checklist_write
    vars:
      session_posture: build
      tool: write
    expect_contains:
      - 'Rejected:'
      - 'Code: PROGRESS_MISSING'
      - update_progress
      - '## Progress'
      - did not run
      - retry
