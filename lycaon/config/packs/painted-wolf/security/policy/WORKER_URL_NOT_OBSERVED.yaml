spec_version: "1.0"
id: WORKER_URL_NOT_OBSERVED
kind: invariant
on: worker.report_check
selector: {}
requires_facts: [paintedwolf.next_steps, paintedwolf.observed_urls_sample, paintedwolf.offender_count, paintedwolf.offenders_omitted, paintedwolf.offenders_sample, paintedwolf.profile_fetches_urls, paintedwolf.session_role, paintedwolf.unobserved_cited_urls]
when: paintedwolf.session_role == "worker" && size(paintedwolf.unobserved_cited_urls) > 0
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:worker_summary
message: cited_urls entry not observed in web tool evidence
what: Worker cited {{ paintedwolf.offender_count }} URL(s) not observed in web tool results.
cause: 'cited_urls must match URLs returned by web research this leg'
why: '{{ paintedwolf.offenders_sample }}{% if paintedwolf.offenders_omitted %} +{{ paintedwolf.offenders_omitted }} more{% endif %}'
fix: 'Drop the unobserved URLs from cited_urls and state the claim without them; a leg may report what it could not verify, and this is the exit every worker can take.{% if paintedwolf.observed_urls_sample %} URLs you did observe this leg: {{ paintedwolf.observed_urls_sample }}.{% endif %} {{ paintedwolf.next_steps }}'
instead: >-
  Cite only observed URLs, or drop the citation and name the gap in remaining_risk — do not re-emit the same unobserved URL.
x-paintedwolf-evidence:
  ui_label: URL citations
  ui_check_id: url_citations
  in_session_retry: true
x-paintedwolf-scenarios:
  - id: ungrounded_url
    vars:
      observed_urls_sample: https://example.com/seen
      offender_count: 1
      offenders_omitted: 0
      offenders_sample: https://example.com/missing
