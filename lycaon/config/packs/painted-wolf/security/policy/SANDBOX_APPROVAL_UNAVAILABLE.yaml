spec_version: "1.0"
id: SANDBOX_APPROVAL_UNAVAILABLE
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code, paintedwolf.rejection_reason]
when: paintedwolf.rejection_code == "SANDBOX_APPROVAL_UNAVAILABLE"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:sandbox_approval
message: capability approval was unavailable
what: The requested capability could not reach its approval boundary.
cause: '{% if paintedwolf.rejection_reason %}{{ paintedwolf.rejection_reason }}{% else %}The host did not install the reviewed authority on this invocation.{% endif %}'
why: This is an approval-path failure, not a security verdict about the requested effect.
fix: Retry after the approval surface is available, or use an invocation that stays within the authority already installed.
instead: Branch on Code; do not report the requested effect as forbidden
x-paintedwolf-scenarios:
  - id: default
    vars:
      reason: approval did not install authority
