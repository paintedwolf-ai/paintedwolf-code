oar: '1.0'
id: DOOM_LOOP_REPEAT
kind: invariant
anchor: tool.rejected
requires:
  profiles:
  - tool
  facts: [paintedwolf.code, paintedwolf.count, paintedwolf.worker_leg, paintedwolf.repeat_count, paintedwolf.same_code_reject_run, paintedwolf.deferred_unactivated, paintedwolf.handle, paintedwolf.next_steps]
when: paintedwolf.repeat_count >= 8 || paintedwolf.same_code_reject_run >= 2
effect: block
on_fire:
- increment_counter
copy:
  cause: The same tool+args invocation keeps repeating without a changed outcome
  why: Replaying or cosmetically varying a call with no new outcome burns budget without advancing the current
    objective.
  fix: '{% if paintedwolf.handle %}Do not read this handle with the same cursor again. {% else %}{% if paintedwolf.code %}Follow the original rejection: correct invalid arguments or complete its named prerequisite before retrying. If that prerequisite is available, take it now; the corrected call remains available. {% else %}Reuse the returned result; do not repeat this unchanged invocation. {% endif %}{% if paintedwolf.worker_leg %}Answer the leg from existing evidence. {% else %}Follow the active workflow Phase exit or current next action; use another tool when it supplies the named prerequisite or missing fact. {% endif %}{% endif %}{{ paintedwolf.next_steps }}'
  instead: '{% if paintedwolf.handle %}Wait on handle `{{ paintedwolf.handle }}`; after wake, continue from its terminal envelope or the last returned `next_cursor`. {% else %}{% if paintedwolf.worker_leg %}A partial leg with cited evidence is a result; more calls against this block are not.{% else %}Resume the current next action. {% if paintedwolf.code %}Correct the arguments or complete the named prerequisite before retrying.{% else %}Reuse the completed result. If all work is complete, send the final answer with no tool calls.{% endif %} {% endif %}{% endif %}'
  what: 'Identical {{ tool }} call blocked{% if paintedwolf.code %} — the previous attempts all rejected with
    Code: {{ paintedwolf.code }}, so unchanged retries remain blocked{% else %} after {{ paintedwolf.count }} repeats{%
    endif %}.'
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:doom_loop
x-paintedwolf-message: 'Identical {{ tool }} call blocked{% if paintedwolf.code %} — the previous attempts
  all rejected with Code: {{ paintedwolf.code }}, so unchanged retries remain blocked{% else %} after {{ paintedwolf.count
  }} repeats{% endif %}.'
x-paintedwolf-scenarios:
- id: default
  vars:
    detail: bad args
    path: src/main.go
    profile: coordinator
    tool: read
- id: worker_leg
  vars:
    detail: bad args
    path: src/main.go
    profile: explore_readonly
    tool: grep
    worker_leg: true
    can_complete_leg: true
- id: command_output
  vars:
    count: 8
    handle: cmd_docker_01
    profile: coordinator
    tool: command_output
