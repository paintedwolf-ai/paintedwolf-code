oar: '1.0'
id: SANDBOX_BOUNDARY_REFUSED
kind: policy
anchor: tool.post_invoke
selector:
  tool:
    - command
    - command_output
    - terminal_open
    - terminal_send
    - terminal_read
    - terminal_snapshot
    - terminal_close
requires:
  profiles:
    - tool
  facts:
    - paintedwolf.confine_applied
    - paintedwolf.confine_signals
    - paintedwolf.destination
when: >-
  paintedwolf.confine_applied
  && "boundary_refused" in paintedwolf.confine_signals
  && !("remote_package_destination_denied" in paintedwolf.confine_signals)
effect: warn
copy:
  what: >-
    The egress broker refused a connection from `{{ tool }}`{% if paintedwolf.destination %}
    to `{{ paintedwolf.destination }}`{% endif %}.
  cause: The observed destination was not allowed by the invocation's egress policy.
  why: This refusal identifies a connection; it does not determine the outcome of the entire command.
  fix: >-
    For package installs, use recognized package managers. The broker already
    reached this destination's decision, so direct_ip or host_execution would
    only route around it. If the destination is required, name it to the person.
  instead: Use the observed destination when requesting the required access
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:sandbox
x-paintedwolf-message: egress broker refused an observed destination
x-paintedwolf-scenarios:
  - id: command_broker_denial
    vars:
      tool: command
      destination: service.example:8443
    expect_contains:
      - 'Code: SANDBOX_BOUNDARY_REFUSED'
      - egress broker
      - service.example:8443
  - id: background_broker_denial
    vars:
      tool: command_output
      destination: service.example
    expect_contains:
      - 'Code: SANDBOX_BOUNDARY_REFUSED'
      - service.example
