oar: '1.0'
id: SANDBOX_TRY_SOCKET_PATH
kind: policy
anchor: tool.post_invoke
# command_output cannot carry a capability request; the retry is a fresh
# command or verify call.
selector:
  tool:
    - command
    - verify
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.confine_applied
  - paintedwolf.failed_stages
  - paintedwolf.process_running
  - paintedwolf.can_command_stop
  - paintedwolf.can_command_output
  - paintedwolf.refused_socket_paths
  - paintedwolf.missing_capability_socket_paths
  - paintedwolf.supports_socket_paths
when: >-
  paintedwolf.confine_applied
  && size(paintedwolf.refused_socket_paths) > 0
  && (size(paintedwolf.failed_stages) > 0 || paintedwolf.process_running)
effect: warn
copy:
  what: In `{{ tool }}`, the sandbox refused connections to the local sockets {{ paintedwolf.refused_socket_paths }}.
  cause: Socket access requires a declaration and authorization; an external client must also select its bound endpoint.
  why: ''
  fix: '{% if paintedwolf.process_running %}{% if paintedwolf.can_command_output %}Use command_output on this job''s handle to inspect its outcome. {%
    endif %}{% if paintedwolf.can_command_stop %}If unneeded, request command_stop once and observe exit. {% endif %}Do not replace running work. {% endif
    %}{% if paintedwolf.supports_socket_paths %}{% if paintedwolf.refused_socket_paths %}{% if paintedwolf.missing_capability_socket_paths %}Declare the
    exact service in `capability_request.socket_paths`. {% endif %}For external clients, set their endpoint option to the whole bound endpoint reference from that field''s
    schema; native socket arguments use the path. If already bound, inspect the refusal before retrying. Preserve completed effects
    and resolve uncertain outcomes first.{% endif %}{% endif %}'
  instead: ''
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:sandbox
x-paintedwolf-message: the sandbox refused a local socket connection this invocation needed
x-paintedwolf-scenarios:
- id: container_engine
  vars:
    tool: command
    failed_stages:
    - docker build -t app .
    refused_socket_paths:
    - /Users/person/.colima/default/docker.sock
    tool_args: {}
  expect_contains:
  - 'Code: SANDBOX_TRY_SOCKET_PATH'
  - capability_request.socket_paths
  - /Users/person/.colima/default/docker.sock
