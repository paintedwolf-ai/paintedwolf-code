oar: '1.0'
id: SANDBOX_TRY_SOCKET_PATH
kind: policy
anchor: tool.post_invoke
# command_output cannot carry a capability request; the retry is a fresh
# command or verify call.
selector:
  tool:
    - command
    - verify
requires:
  profiles:
  - tool
  facts: [paintedwolf.confine_applied, paintedwolf.failed_stages, paintedwolf.process_running, paintedwolf.refused_socket_paths, paintedwolf.missing_capability_socket_paths, paintedwolf.supports_socket_paths, paintedwolf.next_steps, paintedwolf.socket_path_references, paintedwolf.socket_url_references]
when: >-
  paintedwolf.confine_applied
  && size(paintedwolf.refused_socket_paths) > 0
  && (size(paintedwolf.failed_stages) > 0 || paintedwolf.process_running)
effect: warn
copy:
  what: In `{{ tool }}`, the sandbox refused connections to the local sockets {{ paintedwolf.refused_socket_paths }}.
  cause: Socket access requires a declaration and authorization; an external client must also select its bound endpoint.
  why: ''
  fix: >-
    {% if paintedwolf.process_running %}{{ paintedwolf.next_steps }} Do not start replacement work while this job is running. {% endif %}{% if paintedwolf.supports_socket_paths %}{% if paintedwolf.refused_socket_paths %}{% if paintedwolf.missing_capability_socket_paths %}Declare the exact service in `capability_request.socket_paths`. {% endif %}For external clients, use one whole endpoint value: paths `{{ paintedwolf.socket_path_references }}`or Unix URLs `{{ paintedwolf.socket_url_references }}`. Do not add a `unix:` prefix. Native socket arguments use the path. Saved approval does not select the endpoint. Preserve completed effects and resolve uncertain outcomes first.{% endif %}{% endif %}
  instead: ''
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:sandbox
x-paintedwolf-message: the sandbox refused a local socket connection this invocation needed
x-paintedwolf-scenarios:
- id: container_engine
  vars:
    tool: command
    failed_stages:
    - docker build -t app .
    refused_socket_paths:
    - /Users/person/.colima/default/docker.sock
    tool_args: {}
