# Character equivalence classes tolerated when screening OCR-recognized text
# for secrets. Each class groups single-rune glyphs that optical character
# recognition engines misread as one another in terminal and browser renders.
version: 1
classes:
  - glyphs: ["0", "O"]
    reason: digit zero and uppercase letter O share oval geometry in proportional and monospace fonts
  - glyphs: ["1", "I", "l"]
    reason: digit one, uppercase letter I, and lowercase letter l share vertical-stroke geometry
  - glyphs: ["5", "S"]
    reason: digit five and uppercase letter S share curved upper-lower loop geometry at small point sizes
  - glyphs: ["7", "/"]
    reason: digit seven and forward slash share diagonal stroke geometry when top serif or crossbar blurs
