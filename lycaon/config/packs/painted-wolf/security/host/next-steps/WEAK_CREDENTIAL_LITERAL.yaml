steps:
  - tool: "secret_generate"
    say: "For a new credential, use {% if load %}{{ load }}, then {% endif %}{{ call }} and carry its returned reference."
    otherwise: "If you need a new credential, report that need to the coordinating session for protected generation."
  - tool: "ask_user"
    when: "paintedwolf.ask_user_secret_allowed || paintedwolf.worker_leg"
    args:
      response_type: "secret"
    say: "For an existing credential, use its managed reference or request it with {% if load %}{{ load }}, then {% endif %}{{ call }}."
    otherwise: "If an existing credential is missing, report the need for protected input to the coordinating session; do not request plaintext in a report."
  - tool: "request_tools"
    when: "paintedwolf.ask_user_loadable_without_schema"
    args:
      need: "ask_user"
    complete: true
    say: "For an existing credential, use its managed reference or call {% if load %}{{ load }}, then {% endif %}{{ call }} first; its schema arrives on the next model call so you can check whether protected input is admitted."
