steps:
  - tool: "pack_board"
    complete: true
    say: "Use job_id from {{ call }} for an in-flight job."
    otherwise: "Extend only a pending or running job, or resume a finished worker on its preserved child session."
  - tool: "task"
    args:
      child_session_id: "{{ paintedwolf.child_session_id }}"
    say: "Or resume a finished worker with {{ call }}."
