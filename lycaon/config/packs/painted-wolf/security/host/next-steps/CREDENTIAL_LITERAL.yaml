steps:
  - tool: "secret_generate"
    say: "For a new credential, use {{ call }} and carry its returned reference."
    otherwise: "If you need a new credential, report that need to the coordinating session for protected generation."
  - tool: "ask_user"
    args:
      response_type: "secret"
    say: "For an existing credential, use its managed reference or request it with {{ call }}."
    otherwise: "If an existing credential is missing, report the need for protected input to the coordinating session; do not request plaintext in a report."
