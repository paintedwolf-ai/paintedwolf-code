title: Install an SSH key on another machine
id: 2bb97b0d-8251-4d6a-85d8-e46c7fa420ef
description: Appends a public key to another host's authorized_keys, so that key can log in from now on.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  # Creating a local user is local-account-grant's claim; this rule covers writing
  # a key onto a remote host.
  selection_ssh_copy:
    Image: ssh-copy-id
  filter_rehearsal:
    Argv|re: '^(--help|-n)$'
  filter_local:
    EffectReach: local
  condition: selection_ssh_copy and not filter_rehearsal and not filter_local
