title: Stop or disable a system service
id: c41ce3c3-764c-40b9-90e6-de1c94e96557
description: Stops, disables, or unloads a service the machine runs in the background.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.local
level: medium
detection:
  selection_systemd:
    Image:
      - systemctl
      - service
    CommandLine|contains:
      - ' stop'
      - ' disable'
      - ' mask'
  selection_launchd:
    Image: launchctl
    CommandLine|contains:
      - ' unload'
      - ' bootout'
      - ' disable'
  filter_rehearsal:
    Argv|re: '^(--help|status|list)$'
  filter_local:
    EffectReach: local
  condition: (selection_systemd or selection_launchd) and not filter_rehearsal and not filter_local
