title: Delete Sanity documents
id: f56307d6-cf84-400c-828b-8ce7cee0f923
description: Permanently deletes one or more documents from a dataset by id.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
