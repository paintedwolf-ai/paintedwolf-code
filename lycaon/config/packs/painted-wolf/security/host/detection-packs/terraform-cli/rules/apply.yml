title: Apply an infrastructure change
id: 6c74206d-7783-40b4-ba20-ebab11ab24a5
description: Applies a Terraform plan, changing real infrastructure.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
level: medium
detection:
  selection_image:
    Image:
      - terraform
      - tofu
      - terragrunt
      - tf
  verbs_apply:
    CommandLine|contains:
      - ' apply'
      - ' import '
      - ' taint '
  filter_plan:
    CommandLine|contains: ' plan '
  filter_rehearsal:
    Argv|re: '^(-help|--help|-h)$'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_apply and not filter_plan and not filter_rehearsal and not filter_local
