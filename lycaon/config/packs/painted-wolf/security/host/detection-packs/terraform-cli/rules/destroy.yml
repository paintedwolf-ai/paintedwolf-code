title: Destroy managed infrastructure
id: 7632d9b1-feb9-4d5c-a636-5b5af7bd43be
description: Destroys all infrastructure managed by the current Terraform state.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-07-28'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_image:
    Image:
      - terraform
      - tofu
      - terragrunt
      - tf
  selection_destroy:
    CommandLine|contains:
      - ' destroy'
      - ' -destroy'
  # -destroy is also how a plan asks for a destroy plan, which computes and
  # writes nothing. The plan verb separates the two.
  filter_plan:
    CommandLine|contains: ' plan '
  filter_rehearsal:
    Argv|re: '^(-help|--help|-h)$'
  filter_local:
    EffectReach: local
  condition: selection_image and selection_destroy and not filter_plan and not filter_rehearsal and not filter_local
