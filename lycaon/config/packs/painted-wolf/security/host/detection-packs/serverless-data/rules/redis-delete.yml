title: Delete an Upstash Redis database
id: 5aad22ab-9846-4c93-8b7d-7c727b35eec5
description: Deletes a serverless Redis database and all data stored in it.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
