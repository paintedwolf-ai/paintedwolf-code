title: Delete an Algolia index
id: 61241a35-f127-4fdc-9780-95148e341359
description: Deletes an index along with its records, settings, synonyms, and rules.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_verb:
    Image: algolia
    CommandLine|contains: ' indices delete'
  selection_confirm:
    CommandLine|re: '(?i)\s(--confirm|-y)\b'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_verb and selection_confirm and not filter_rehearsal and not filter_local
