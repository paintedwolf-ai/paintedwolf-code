title: Delete Algolia records
id: e4ac57f4-f6d6-4e90-ac95-5a18f50efcbb
description: Deletes records from an index by id or filter, leaving the index and its settings in place.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
level: medium
detection:
  selection_verb:
    Image: algolia
    CommandLine|contains: ' objects delete'
  selection_confirm:
    CommandLine|re: '(?i)\s(--confirm|-y)\b'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_verb and selection_confirm and not filter_rehearsal and not filter_local
