title: Delete a Modal volume
id: 96d7f0a6-27b7-4e21-be34-2a239a8994c1
description: Permanently deletes a named Modal Volume and all of the data it holds.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_verb:
    Image: modal
    CommandLine|contains: ' volume delete'
  selection_confirm:
    CommandLine|contains:
      - ' -y'
      - ' --yes'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_verb and selection_confirm and not filter_rehearsal and not filter_local
