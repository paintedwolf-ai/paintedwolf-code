title: Delete a Modal secret
id: 9be0d9c7-4a10-47a6-a691-a9449710ca3e
description: Permanently deletes a named Modal Secret, removing it from every app that references it.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_verb:
    Image: modal
    CommandLine|contains: ' secret delete'
  selection_confirm:
    CommandLine|contains:
      - ' -y'
      - ' --yes'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_verb and selection_confirm and not filter_rehearsal and not filter_local
