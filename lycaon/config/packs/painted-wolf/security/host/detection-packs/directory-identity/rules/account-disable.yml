title: Disable or suspend a directory account
id: 2d8ab0f9-779d-4af5-9776-ed22a2e42d02
description: Suspends a directory account so it can no longer sign in.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
level: medium
detection:
  selection_powershell:
    Image:
      - powershell
      - powershell.exe
      - pwsh
      - pwsh.exe
    CommandLine|contains: 'Disable-ADAccount'
  selection_gam:
    Image: gam
    CommandLine|contains: ' suspended on'
  filter_rehearsal:
    CommandLine|re: '(?i)\s(--help|-whatif)(?:["\x27]|\s)'
  filter_local:
    EffectReach: local
  condition: (selection_powershell or selection_gam) and not filter_rehearsal and not filter_local
