title: Revoke a Resend API key
id: 5b1f4137-2f4c-4053-818d-c6fecdf6f354
description: Deletes an API key, breaking any integration still using it until it is replaced.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
level: medium
detection:
  selection_verb:
    Image: resend
    CommandLine|contains: ' api-keys delete'
  selection_confirm:
    CommandLine|contains: '--yes'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_verb and selection_confirm and not filter_rehearsal and not filter_local
