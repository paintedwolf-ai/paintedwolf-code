title: Remove the GitOps controller from a cluster
id: ef68fda7-3f28-4f55-9329-f0ed3d12de87
description: Uninstalls the controller and its custom resources, so nothing reconciles the cluster against the repository any more.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-08'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_flux:
    Image: flux
    CommandLine|contains: ' uninstall'
  filter_rehearsal:
    Argv|re: '^(--help|-h|--dry-run(=.*)?)$'
  filter_local:
    EffectReach: local
  condition: selection_flux and not filter_rehearsal and not filter_local
