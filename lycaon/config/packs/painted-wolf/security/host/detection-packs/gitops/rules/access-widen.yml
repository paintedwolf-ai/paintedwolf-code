title: Widen who may deploy through Argo CD
id: 8daf64a3-bc68-407f-a795-e2408beb7893
description: Adds a policy, group, or allowed cluster resource to a project role, or changes an account password.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-08'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  # `deny-cluster-resource` and the `remove-*` verbs narrow access, so they are
  # not matched.
  selection_argocd:
    Image: argocd
    CommandLine|contains:
      - ' proj role add-policy'
      - ' proj role add-group'
      - ' proj allow-cluster-resource'
      - ' proj allow-namespace-resource'
      - ' account update-password'
  filter_rehearsal:
    Argv:
      - '--help'
      - '-h'
  filter_local:
    EffectReach: local
  condition: selection_argocd and not filter_rehearsal and not filter_local
