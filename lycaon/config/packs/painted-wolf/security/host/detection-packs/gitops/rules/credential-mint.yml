title: Mint an Argo CD token or rotate cluster credentials
id: dd499aea-0b1d-4d9a-ad62-9c30ceca6842
description: Issues a token that can drive deployments, or rotates the credentials Argo CD uses against a cluster.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-08'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_argocd:
    Image: argocd
    CommandLine|contains:
      - ' account generate-token'
      - ' proj role create-token'
      - ' cluster rotate-auth'
  filter_rehearsal:
    Argv:
      - '--help'
      - '-h'
  filter_local:
    EffectReach: local
  condition: selection_argocd and not filter_rehearsal and not filter_local
