title: Rewrite infrastructure state
id: 11778b21-e2fc-4f34-a375-388a87284844
description: Removes or reassigns entries in stack state, detaching them from real resources.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image:
      - pulumi
      - cdktf
  verbs_state_rewrite:
    CommandLine|contains:
      - ' state delete'
      - ' state unprotect'
      - ' cancel'
      - ' import '
      - ' refresh --yes'
  filter_rehearsal:
    Argv|re: '^(--help|-h|preview)$'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_state_rewrite and not filter_rehearsal and not filter_local
