title: Deploy a destructive metadata change
id: 91a15e67-ce7e-4292-b21d-6224b4ef0027
description: Deploys a change that deletes metadata components from the target org.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image:
      - sf
      - sfdx
  selection_deploy:
    CommandLine|contains: ' deploy start'
  selection_destructive:
    CommandLine|contains:
      - '-destructive-changes'
      - ' --purge-on-delete'
  filter_rehearsal:
    Argv|re: '^(--help|-h|--check-only|--dry-run(=.*)?)$'
  filter_local:
    EffectReach: local
  condition: selection_image and selection_deploy and selection_destructive and not filter_rehearsal and not filter_local
