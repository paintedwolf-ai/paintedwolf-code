title: Bulk-delete Salesforce records
id: d98783b9-f32e-40eb-b37e-5238b0841d85
description: Deletes every record an input file names from a Salesforce object.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
# Deleted records land in the org's Recycle Bin for a retention window, so this
# is recoverable in the way database-cli's unfiltered-write is — expensive to
# clean up, not unrecoverable.
tags:
  - lycaon.effect.external
level: medium
detection:
  selection_image:
    Image:
      - sf
      - sfdx
  selection_bulk_delete:
    CommandLine|contains: ' data delete bulk'
  filter_hard_delete:
    CommandLine|contains: ' --hard-delete'
  filter_rehearsal:
    Argv:
      - '--help'
      - '-h'
  filter_local:
    EffectReach: local
  condition: selection_image and selection_bulk_delete and not filter_hard_delete and not filter_rehearsal and not filter_local
