title: Permanently bulk-delete Salesforce records
id: c941e9b0-f4d8-4807-a01b-7997b7367780
description: Deletes every record an input file names from a Salesforce object, bypassing the Recycle Bin entirely.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-08'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_image:
    Image:
      - sf
      - sfdx
  selection_bulk_delete:
    CommandLine|contains: ' data delete bulk'
  selection_hard_delete:
    CommandLine|contains: ' --hard-delete'
  filter_rehearsal:
    Argv:
      - '--help'
      - '-h'
  filter_local:
    EffectReach: local
  condition: selection_image and selection_bulk_delete and selection_hard_delete and not filter_rehearsal and not filter_local
