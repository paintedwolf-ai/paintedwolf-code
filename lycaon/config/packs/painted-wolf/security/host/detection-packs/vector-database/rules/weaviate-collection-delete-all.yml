title: Delete every Weaviate collection
id: afc24841-3f52-4363-b9ed-c273dd45d193
description: Permanently deletes every collection in the Weaviate instance, wiping all stored data.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-08'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_verb:
    Image: weaviate-cli
    CommandLine|contains: ' delete collection'
  selection_all:
    CommandLine|contains: ' --all'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_verb and selection_all and not filter_rehearsal and not filter_local
