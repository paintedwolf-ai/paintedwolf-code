title: Delete a Pinecone index or stored copy
id: 41a2b4d7-2f67-4b29-948e-46f28fb22a63
description: Permanently deletes an entire Pinecone index, or a collection or backup taken from one.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-08'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  # A collection and a backup are the stored copies you would restore an index
  # from, so deleting one is the same effect class as deleting the index.
  selection_verb:
    Image: pc
    CommandLine|contains:
      - ' index delete'
      - ' index collection delete'
      - ' index backup delete'
  selection_confirm:
    CommandLine|contains:
      - ' --skip-confirmation'
      - ' --json'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_verb and selection_confirm and not filter_rehearsal and not filter_local
