title: Delete a Weaviate collection
id: 6a380f86-7bed-4210-a144-be90279239a6
description: Permanently deletes a named Weaviate collection and every object in it.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-08'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_verb:
    Image: weaviate-cli
    CommandLine|contains: ' delete collection'
  filter_all:
    CommandLine|contains: ' --all'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_verb and not filter_all and not filter_rehearsal and not filter_local
