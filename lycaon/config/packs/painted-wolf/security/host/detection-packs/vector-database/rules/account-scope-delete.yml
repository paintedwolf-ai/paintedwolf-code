title: Delete a Pinecone project or organization
id: 0e2c7f4a-38e6-4a45-9f4b-0ac3b0d7c5f1
description: Permanently deletes a Pinecone project or organization along with every index and vector under it.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-08'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  # Strictly wider than an index delete: this takes every index in the scope
  # with it, which is why it sits a band above index-delete.
  selection_verb:
    Image: pc
    CommandLine|contains:
      - ' project delete'
      - ' organization delete'
  selection_confirm:
    CommandLine|contains:
      - ' --skip-confirmation'
      - ' --json'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_verb and selection_confirm and not filter_rehearsal and not filter_local
