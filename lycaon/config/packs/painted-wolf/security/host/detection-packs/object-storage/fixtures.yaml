  - rclone delete prod:backups/2026
  - rclone deletefile prod:backups/manifest.json
  - rclone rmdirs prod:backups
  - mc rm --recursive --force prod/backups
  - mc rb prod/backups
  - s5cmd rm 's3://prod-backups/*'
