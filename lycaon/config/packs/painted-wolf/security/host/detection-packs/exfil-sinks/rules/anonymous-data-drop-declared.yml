title: Declares an anonymous paste or file-drop service as a destination
id: 63c5b3ee-d82a-4e2f-866f-bdb563aae96a
description: >-
  A command line, a structured tool argument, or a direct-IP capability's
  declared hostname names a no-signup paste or file-upload host. These hosts
  do have an occasional legitimate read side, so a hit here cannot tell that
  apart from a secret dropped for pickup.
references:
  - https://attack.mitre.org/techniques/T1567/002/
author: Painted Wolf Code
date: '2026-08-21'
modified: '2026-09-01'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
level: medium
detection:
  # Ambiguous bare names match only the hostname field.
  selection_command:
    CommandLine|contains:
      - pastebin.com
      - 0x0.st
      - transfer.sh
      - file.io
      - termbin.com
      - catbox.moe
      - clbin.com
      - rentry.co
      - privatebin.net
      - privatebin.io
      - dpaste.com
      - ghostbin.com
      - gofile.io
      - filebin.net
      - //temp.sh
      - //paste.rs
  selection_toolarg:
    ToolArg|contains:
      - pastebin.com
      - 0x0.st
      - transfer.sh
      - file.io
      - termbin.com
      - catbox.moe
      - clbin.com
      - rentry.co
      - privatebin.net
      - privatebin.io
      - dpaste.com
      - ghostbin.com
      - gofile.io
      - filebin.net
      - //temp.sh
      - //paste.rs
  selection_declared:
    DeclaredDestination|contains:
      - pastebin.com
      - 0x0.st
      - transfer.sh
      - file.io
      - termbin.com
      - catbox.moe
      - clbin.com
      - rentry.co
      - privatebin.net
      - privatebin.io
      - dpaste.com
      - ghostbin.com
      - gofile.io
      - filebin.net
      - temp.sh
      - paste.rs
  filter_rehearsal:
    Argv|re: '^(--help|--dry-run(=.*)?)$'
  filter_local:
    EffectReach: local
  condition: (selection_command or selection_toolarg or selection_declared) and not filter_rehearsal and not filter_local
