title: Declares a consumer file storage service as a destination
id: 1416e31e-a0b8-460a-bbbc-615340bd0c17
description: >-
  A command line, a structured tool argument, or a direct-IP capability's
  declared hostname names a personal cloud drive or send-a-file service. These
  sit behind an account and have a real read side, so a hit cannot tell a
  restore from a copy of the tree leaving.
references:
  - https://attack.mitre.org/techniques/T1567/002/
  - https://www.dropbox.com/developers/documentation/http/overview
  - https://developer.box.com/guides/api-calls/allowing-domain-access/
author: Painted Wolf Code
date: '2026-09-01'
modified: '2026-09-01'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
level: medium
detection:
  # Named hosts avoid ambiguous apex matches.
  selection_command:
    CommandLine|contains:
      - dropbox.com
      - dropboxapi.com
      - drive.google.com
      - api.box.com
      - upload.box.com
      - app.box.com
      - boxcloud.com
      - mega.nz
      - mega.co.nz
      - wetransfer.com
  selection_toolarg:
    ToolArg|contains:
      - dropbox.com
      - dropboxapi.com
      - drive.google.com
      - api.box.com
      - upload.box.com
      - app.box.com
      - boxcloud.com
      - mega.nz
      - mega.co.nz
      - wetransfer.com
  selection_declared:
    DeclaredDestination|contains:
      - dropbox.com
      - dropboxapi.com
      - drive.google.com
      - api.box.com
      - upload.box.com
      - app.box.com
      - boxcloud.com
      - mega.nz
      - mega.co.nz
      - wetransfer.com
  filter_rehearsal:
    Argv|re: '^(--help|--dry-run(=.*)?)$'
  filter_local:
    EffectReach: local
  condition: (selection_command or selection_toolarg or selection_declared) and not filter_rehearsal and not filter_local
