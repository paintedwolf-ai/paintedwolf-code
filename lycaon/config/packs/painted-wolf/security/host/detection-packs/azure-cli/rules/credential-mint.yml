title: Reset an application credential
id: 2361c7a7-1d56-4729-a9e7-5a14d3a006e6
description: >-
  Resets an application or service principal secret and prints the new value,
  which authenticates as that identity until it expires.
references:
  - https://learn.microsoft.com/en-us/cli/azure/reference-index
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-09-01'
modified: '2026-09-01'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_image:
    Image: az
  verbs_credential_reset:
    CommandLine|contains:
      - ' ad app credential reset'
      - ' ad sp credential reset'
  filter_rehearsal:
    Argv|re: '^(--help|-h|--what-if)$'
  filter_local:
    EffectReach: local
  condition: >-
    selection_image and verbs_credential_reset
    and not filter_rehearsal and not filter_local
