title: Fetch session credentials
id: f3e28de0-0ba3-4ccc-a458-e3d5dd56ef08
description: Fetches an access token or writes cluster credentials into a local config.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
level: medium
detection:
  selection_image:
    Image: az
  verbs_session_credentials:
    CommandLine|contains:
      - ' get-access-token'
      - ' get-credentials'
      - ' acr login'
  filter_rehearsal:
    Argv|re: '^(--help|-h|--what-if)$'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_session_credentials and not filter_rehearsal and not filter_local
