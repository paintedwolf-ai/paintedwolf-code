title: Read stored secret material
id: 27da0ddf-471b-470c-822d-5a84393afd92
description: Reads a vault secret, account key, or connection string.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image: az
  # Each phrase names the secret and the read together, so a bare ` show` — which
  # is how every Azure resource is inspected — cannot reach this rule. Cluster
  # credential fetches sit at medium in session-credentials.
  verbs_secret_access:
    CommandLine|contains:
      - ' secret show'
      - ' key show'
      - ' keys list'
      - ' list-keys'
      - ' connection-string list'
      - ' show-connection-string'
      - ' regenerate-key'
      - ' renew-key'
  filter_rehearsal:
    Argv|re: '^(--help|-h|--what-if)$'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_secret_access and not filter_rehearsal and not filter_local
