title: Run a command on a managed Azure resource
id: 2cf724cf-2320-4b82-8851-8a4bc381de2f
description: >-
  Runs an arbitrary command inside a virtual machine, scale set, container, or AKS
  cluster the caller has no session on.
references:
  - https://learn.microsoft.com/en-us/cli/azure/reference-index
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-09-01'
modified: '2026-09-01'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_image:
    Image: az
  verbs_remote_execution:
    CommandLine|contains:
      - ' run-command invoke'
      - ' container exec'
      - ' aks command invoke'
  filter_rehearsal:
    Argv|re: '^(--help|-h|--what-if)$'
  filter_local:
    EffectReach: local
  condition: >-
    selection_image and verbs_remote_execution
    and not filter_rehearsal and not filter_local
