title: Permanently purge a Key Vault or key
id: 24fd2f65-60a4-40f4-ac04-900ed801cada
description: Permanently purges a Key Vault or key, bypassing soft delete recovery.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-07-28'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_image:
    Image: az
  selection_purge:
    CommandLine|contains|all:
      - ' keyvault '
      - ' purge'
  filter_rehearsal:
    Argv:
      - '--help'
      - '-h'
  filter_local:
    EffectReach: local
  condition: selection_image and selection_purge and not filter_rehearsal and not filter_local
