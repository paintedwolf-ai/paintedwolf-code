title: Read stored secret material
id: 65d361e4-2894-4307-b190-5017ff096ab4
description: Reads a stored secret version or decrypts ciphertext with a managed key.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image: gcloud
  grp_secret:
    CommandLine|contains:
      - ' secrets '
      - ' kms '
  # Short-lived scoped tokens sit at medium in session-credentials; this rule is
  # for stored secret material.
  verbs_secret_access:
    CommandLine|contains:
      - ' versions access'
      - ' decrypt'
  filter_rehearsal:
    Argv|re: '^(--help|-h|help)$'
  filter_local:
    EffectReach: local
  condition: selection_image and grp_secret and verbs_secret_access and not filter_rehearsal and not filter_local
