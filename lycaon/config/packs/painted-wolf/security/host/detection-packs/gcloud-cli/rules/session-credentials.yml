title: Fetch session credentials
id: 731b49dd-4848-4c4b-889b-8057875c4f0d
description: Prints a short-lived token or writes cluster credentials into a local config.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
level: medium
detection:
  selection_image:
    Image: gcloud
  verbs_session_credentials:
    CommandLine|contains:
      - ' print-access-token'
      - ' print-identity-token'
      - ' get-credentials'
      - ' --impersonate-service-account'
  filter_rehearsal:
    Argv|re: '^(--help|-h|help)$'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_session_credentials and not filter_rehearsal and not filter_local
