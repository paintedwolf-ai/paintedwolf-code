title: Delete a service account or a folder
id: b49c5617-17e2-4d58-b510-0a49a88edfd6
description: >-
  Removes a service account, or a folder holding projects, taking the access and
  the resources scoped beneath it.
references:
  - https://cloud.google.com/sdk/gcloud/reference
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-09-01'
modified: '2026-09-01'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_image:
    Image: gcloud
  verbs_identity_destroy:
    CommandLine|contains:
      - ' iam service-accounts delete'
      - ' resource-manager folders delete'
      - ' iam workload-identity-pools delete'
  filter_rehearsal:
    Argv|re: '^(--help|-h|help)$'
  filter_local:
    EffectReach: local
  condition: >-
    selection_image and verbs_identity_destroy
    and not filter_rehearsal and not filter_local
