title: Delete a managed cloud resource
id: a1ca4638-b9c2-4843-a719-4d3c64ce2aa1
description: Deletes a database, cluster, bucket, or other managed GCP resource.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image: gcloud
  grp_resource:
    CommandLine|contains:
      - ' compute '
      - ' container '
      - ' sql '
      - ' functions '
      - ' run '
      - ' app '
      - ' dataproc '
      - ' bigtable '
      - ' spanner '
      - ' filestore '
      - ' redis '
      - ' pubsub '
      - ' artifacts '
      - ' deployment-manager '
      - ' composer '
      - ' dataflow '
      - ' memorystore '
  # ` storage ` is absent: storage-object-destroy owns buckets and objects.
  # `remove-` is absent: remove-iam-policy-binding revokes access rather than
  # destroying the resource, and it belongs to no rule here.
  verbs_resource_destroy:
    CommandLine|contains:
      - ' delete'
      - ' destroy'
  # A firewall rule removal is an access change; public-exposure owns it.
  filter_firewall:
    CommandLine|contains: ' firewall-rules delete'
  filter_rehearsal:
    Argv|re: '^(--help|-h|help)$'
  filter_local:
    EffectReach: local
  condition: >-
    selection_image and grp_resource and verbs_resource_destroy
    and not filter_firewall and not filter_rehearsal and not filter_local
