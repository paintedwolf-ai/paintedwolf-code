title: Delete Cloud Storage objects or a bucket
id: 83086e22-8c79-42cd-900a-5a55eea3909d
description: Removes objects under a Cloud Storage prefix, or an entire bucket.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-08'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  # Storage uses `rm`/`rb` where the rest of gcloud uses `delete`, so the verb
  # axis the other rules share never reaches it — and gsutil is a second binary
  # that resource-destroy's `Image: gcloud` cannot see at all.
  selection_image:
    Image:
      - gsutil
      - gcloud
  verbs_storage_destroy:
    CommandLine|re:
      - '(?i)\srm\s+(.*\s)?(-{1,2}[a-z]*r\b|--recursive\b)'
      - '(?i)\srb\s'
      - '(?i)\sbuckets\s+delete\b'
  selection_storage_scope:
    CommandLine|contains:
      - 'gs://'
      - ' storage '
  filter_rehearsal:
    Argv|re: '^(--help|-h|--dry-run(=.*)?|help)$'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_storage_destroy and selection_storage_scope and not filter_rehearsal and not filter_local
