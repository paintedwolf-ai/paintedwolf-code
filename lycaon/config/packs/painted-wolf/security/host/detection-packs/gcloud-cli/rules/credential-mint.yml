title: Mint a service account key
id: 8b746899-1a60-4d80-b87c-a51ee0afdb41
description: Creates a downloadable long-lived service account key.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_image:
    Image: gcloud
  # The operation names the effect, so no service axis is needed. `kms keys
  # create` is not matched: it creates a key resource, not an exportable
  # credential.
  verbs_credential_mint:
    CommandLine|contains: ' service-accounts keys create'
  filter_rehearsal:
    Argv|re: '^(--help|-h|help)$'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_credential_mint and not filter_rehearsal and not filter_local
