title: Delete or disable a logging or detection control
id: a43beefe-dc32-4b12-930c-2917a4e5c86f
description: Deletes or disables GCP logging or security detection controls.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-07-28'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_image:
    Image: gcloud
  grp_audit:
    CommandLine|contains:
      - ' logging '
      - ' scc '
      - ' asset '
      - ' audit-config '
  verbs_audit_destroy:
    CommandLine|contains:
      - ' delete'
      - ' destroy'
      - ' remove-'
      - ' disable'
      - ' purge'
      - ' undeploy'
      - ' clear'
  filter_rehearsal:
    Argv|re: '^(--help|-h|help)$'
  filter_local:
    EffectReach: local
  condition: selection_image and grp_audit and verbs_audit_destroy and not filter_rehearsal and not filter_local
