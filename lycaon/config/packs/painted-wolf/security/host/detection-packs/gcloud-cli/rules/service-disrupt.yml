title: Stop or scale down a running resource
id: fe6fe498-ed01-437f-8fa9-4133c30b0348
description: Stops, suspends, or scales down a running Google Cloud resource.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
level: medium
detection:
  selection_image:
    Image: gcloud
  grp_resource:
    CommandLine|contains:
      - ' compute '
      - ' container '
      - ' sql '
      - ' run '
      - ' app '
      - ' dataproc '
      - ' functions '
  verbs_service_disrupt:
    CommandLine|contains:
      - ' stop'
      - ' suspend'
      - ' reset'
      - ' resize'
      - ' update-traffic'
  filter_rehearsal:
    Argv|re: '^(--help|-h|help)$'
  filter_local:
    EffectReach: local
  condition: selection_image and grp_resource and verbs_service_disrupt and not filter_rehearsal and not filter_local
