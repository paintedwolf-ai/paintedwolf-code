title: Grant or widen IAM access
id: b520a45f-ad71-4362-ab60-4dfd790fd810
description: Adds or replaces an IAM policy binding, or creates or widens a role.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_image:
    Image: gcloud
  grp_identity:
    CommandLine|contains:
      - ' iam '
      - ' projects '
      - ' organizations '
      - ' resource-manager '
  verbs_iam_grant:
    CommandLine|contains:
      - ' add-iam-policy-binding'
      - ' set-iam-policy'
      - ' roles create'
      - ' roles update'
      - ' add-members'
  filter_rehearsal:
    Argv|re: '^(--help|-h|help)$'
  filter_local:
    EffectReach: local
  condition: selection_image and grp_identity and verbs_iam_grant and not filter_rehearsal and not filter_local
