title: Disable a workflow or archive a repository
id: 07fb74b8-510a-4d71-80f2-5deee176b884
description: Stops a workflow from running, or puts a repository into read-only state.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-08'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
level: medium
detection:
  # Both are reversible — `workflow enable` and `repo unarchive` put things back
  # — so this stays out of the bands that fire by default.
  selection_image:
    Image:
      - gh
      - glab
      - tea
  selection_disable:
    CommandLine|contains:
      - ' workflow disable'
      - ' repo archive'
  filter_rehearsal:
    Argv:
      - '--help'
      - '-h'
  filter_local:
    EffectReach: local
  condition: selection_image and selection_disable and not filter_rehearsal and not filter_local
