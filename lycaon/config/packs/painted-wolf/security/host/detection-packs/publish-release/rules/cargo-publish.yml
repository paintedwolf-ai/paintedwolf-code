title: Publish a crate
id: c2193519-f32a-4079-9aa8-cd71c781065a
description: Publishes a Rust crate to a registry.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-07-28'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image: cargo
  selection_publish:
    CommandLine|contains: ' publish'
  filter_rehearsal:
    Argv|re: '^(--dry-run(=.*)?|--help|-h)$'
  filter_local:
    EffectReach: local
  condition: selection_image and selection_publish and not filter_rehearsal and not filter_local
