title: Withdraw a published package version
id: a01e2593-e74c-4e7f-ae2e-9afedba29d7a
description: Unpublishes or yanks a released version that others may already depend on.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_npm:
    Image:
      - npm
      - pnpm
      - yarn
      - bun
    CommandLine|contains: ' unpublish'
  selection_cargo:
    Image: cargo
    CommandLine|contains: ' yank'
  selection_release:
    Image:
      - gh
      - glab
      - tea
    CommandLine|contains|all:
      - ' release '
      - ' delete'
  filter_rehearsal:
    Argv|re: '^(--help|-h|--dry-run(=.*)?)$'
  filter_local:
    EffectReach: local
  condition: (selection_npm or selection_cargo or selection_release) and not filter_rehearsal and not filter_local
