title: Grant publish rights on a package
id: 4ae256e5-6ed2-4c14-a172-f92566569852
description: Adds a user as an owner of a published package, letting them publish new versions under it.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_image:
    Image:
      - npm
      - pnpm
      - yarn
      - bun
  # Removing an owner is not matched: it revokes standing access rather than
  # granting it.
  selection_owner_add:
    CommandLine|contains: ' owner add'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_image and selection_owner_add and not filter_rehearsal and not filter_local
