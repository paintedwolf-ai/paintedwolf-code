title: Force-push a branch
id: b20f225f-a41a-4c05-ba3d-0f0fea5b18c7
description: Force-pushes a branch, rewriting remote history.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-07-28'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image: git
  selection_push:
    CommandLine|contains: ' push'
  selection_force:
    CommandLine|contains:
      - ' --force'
      - ' -f '
      - ' --force-with-lease'
  # A leading + on a refspec is the third force syntax (git push origin +main).
  selection_force_refspec:
    Argv|startswith: '+'
  filter_rehearsal:
    Argv|re: '^(--dry-run|-n|--help|-h)$'
  filter_local:
    EffectReach: local
  condition: selection_image and selection_push and (selection_force or selection_force_refspec) and not filter_rehearsal and not filter_local
