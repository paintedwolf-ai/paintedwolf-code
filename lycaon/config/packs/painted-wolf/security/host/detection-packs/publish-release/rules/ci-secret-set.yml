title: Change a CI secret or deploy key
id: 8abaf16a-b9ff-4ddc-980f-f870403a8055
description: Sets a repository secret or deploy key that CI runs will use.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image:
      - gh
      - glab
      - tea
  verbs_ci_secret:
    CommandLine|contains:
      - ' secret set'
      - ' secret delete'
      - ' deploy-key add'
      - ' variable set'
  filter_rehearsal:
    Argv:
      - '--help'
      - '-h'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_ci_secret and not filter_rehearsal and not filter_local
