title: Upload a package to PyPI
id: 7b80a473-ac74-4acc-8c0b-25a105e1c809
description: Uploads a Python package to a package index.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-07-28'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_twine:
    Image: twine
    CommandLine|contains: ' upload'
  selection_publishers:
    Image:
      - uv
      - poetry
      - flit
      - hatch
    CommandLine|contains: ' publish'
  filter_rehearsal:
    Argv|re: '^(--dry-run(=.*)?|--help|-h)$'
  filter_local:
    EffectReach: local
  condition: (selection_twine or selection_publishers) and not filter_rehearsal and not filter_local
