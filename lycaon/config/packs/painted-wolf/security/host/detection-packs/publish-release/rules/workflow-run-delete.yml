title: Delete a workflow run's record
id: 525e72e0-e9f0-42f9-ba3d-903753e0e395
description: Removes a CI run and its logs, so what that build did can no longer be read back.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-08'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image:
      - gh
      - glab
      - tea
  selection_run_delete:
    CommandLine|contains: ' run delete'
  filter_rehearsal:
    Argv:
      - '--help'
      - '-h'
  filter_local:
    EffectReach: local
  condition: selection_image and selection_run_delete and not filter_rehearsal and not filter_local
