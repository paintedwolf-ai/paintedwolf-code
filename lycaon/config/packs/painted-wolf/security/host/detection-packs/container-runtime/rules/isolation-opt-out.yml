title: Run a container without isolation
id: d2b20d65-6afb-4dc2-b149-bbfb6c6c18e2
description: Starts a container with host namespaces, host mounts, or full privileges.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.local
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image:
      - docker
      - podman
      - nerdctl
  # These flags hand the container the host it was meant to be separated from,
  # which reaches past what the sandbox can see.
  verbs_isolation_optout:
    CommandLine|contains:
      - ' --privileged'
      - ' --pid=host'
      - ' --net=host'
      - ' --network=host'
      - ' --ipc=host'
      - ' --userns=host'
      - ' --cap-add=sys_admin'
      - ' -v /:/'
      - ' --volume /:/'
      - ' -v /var/run/docker.sock'
      - ' --volume /var/run/docker.sock'
  # `-h` sets a container hostname here, never help.
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_isolation_optout and not filter_rehearsal and not filter_local
