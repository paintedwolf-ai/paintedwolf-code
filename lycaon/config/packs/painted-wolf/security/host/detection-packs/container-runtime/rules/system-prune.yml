title: Prune all unused container state
id: 84e0c88e-ac32-448e-8b1e-e37d8c22a3b7
description: Removes every unused image, container, network, and build cache at once.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.local
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image:
      - docker
      - podman
      - nerdctl
  verbs_prune_all:
    CommandLine|contains:
      - ' system prune'
      - ' image prune'
      - ' builder prune'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_prune_all and not filter_rehearsal and not filter_local
