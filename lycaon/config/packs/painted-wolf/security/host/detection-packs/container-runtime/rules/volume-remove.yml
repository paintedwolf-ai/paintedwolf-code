title: Delete a container volume
id: 59baf333-3475-43a6-bb44-410c01f32468
description: Removes a named volume and the data stored in it.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.local
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image:
      - docker
      - podman
      - nerdctl
  verbs_volume_remove:
    CommandLine|contains:
      - ' volume rm'
      - ' volume remove'
      - ' volume prune'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_volume_remove and not filter_rehearsal and not filter_local
