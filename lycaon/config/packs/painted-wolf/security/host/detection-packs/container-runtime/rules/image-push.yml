title: Push an image to a registry
id: 7e5dd1c2-a645-4b75-9c59-c077cf0518e1
description: Publishes a container image to a remote registry.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image:
      - docker
      - podman
      - nerdctl
  verbs_registry_push:
    CommandLine|contains:
      - ' push '
      - ' manifest push'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_registry_push and not filter_rehearsal and not filter_local
