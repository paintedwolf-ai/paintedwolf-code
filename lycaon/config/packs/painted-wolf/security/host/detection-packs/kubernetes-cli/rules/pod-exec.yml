title: Run a command inside a running container
id: dcef6e67-20b8-4a83-81d6-3b2e65dc0a9f
description: >-
  Executes a command or opens a shell inside a container in the cluster. What the
  command then does is carried in its own arguments and is not stated here.
references:
  - https://kubernetes.io/docs/reference/kubectl/generated/kubectl_exec/
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-09-01'
modified: '2026-09-01'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
level: medium
detection:
  selection_image:
    Image:
      - kubectl
      - oc
      - kubecolor
  verbs_container_exec:
    CommandLine|contains: ' exec '
  selection_openshift_shell:
    Image: oc
    CommandLine|contains: ' rsh '
  filter_rehearsal:
    Argv|re: '^(--help|-h)$'
  filter_local:
    EffectReach: local
  condition: ((selection_image and verbs_container_exec) or selection_openshift_shell) and not filter_rehearsal and not filter_local
