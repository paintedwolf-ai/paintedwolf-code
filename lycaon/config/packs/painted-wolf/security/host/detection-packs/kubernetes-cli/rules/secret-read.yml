title: Read a cluster secret
id: d62116ac-ba7e-42ee-bfce-e0505746491e
description: Reads the contents of a Kubernetes secret.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image:
      - kubectl
      - oc
      - kubecolor
  # A secret's value only leaves the cluster through an output format that
  # renders it; listing names does not.
  selection_secret:
    CommandLine|contains:
      - ' get secret'
      - ' get secrets'
      - ' describe secret'
  selection_rendered:
    CommandLine|contains:
      - ' -o yaml'
      - ' -o json'
      - ' --output yaml'
      - ' --output json'
      - ' -o jsonpath'
      - ' --output jsonpath'
      - ' describe secret'
  filter_rehearsal:
    Argv:
      - '--help'
      - '-h'
  filter_local:
    EffectReach: local
  condition: selection_image and selection_secret and selection_rendered and not filter_rehearsal and not filter_local
