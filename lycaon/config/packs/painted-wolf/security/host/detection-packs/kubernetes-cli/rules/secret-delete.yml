title: Delete a cluster secret
id: ead5f23f-bca8-4c2d-8554-39488c56977d
description: >-
  Deletes a Kubernetes secret. The stored material is gone, and every workload
  that mounts it loses the credential on its next start.
references:
  - https://kubernetes.io/docs/concepts/configuration/secret/
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-09-01'
modified: '2026-09-01'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image:
      - kubectl
      - oc
      - kubecolor
  selection_delete:
    CommandLine|contains: ' delete '
  # Padding avoids matches inside resource names.
  verbs_secret_target:
    CommandLine|contains:
      - ' secret '
      - ' secrets '
      - ' secret/'
      - ' secrets/'
  filter_rehearsal:
    Argv|re: '^(--dry-run(=.*)?|--help|-h)$'
  filter_local:
    EffectReach: local
  condition: selection_image and selection_delete and verbs_secret_target and not filter_rehearsal and not filter_local
