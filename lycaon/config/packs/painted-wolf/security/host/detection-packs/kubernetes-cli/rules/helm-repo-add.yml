title: Add a Helm chart repository
id: 11a00c58-8df3-46a1-9f68-529e493a98db
description: >-
  Registers a chart repository, which later installs and upgrades resolve chart
  names against.
references:
  - https://helm.sh/docs/helm/helm_repo_add/
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-09-01'
modified: '2026-09-01'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
level: medium
detection:
  selection_image:
    Image: helm
  verbs_chart_repo_add:
    CommandLine|contains: ' repo add '
  filter_rehearsal:
    Argv|re: '^(--help|-h)$'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_chart_repo_add and not filter_rehearsal and not filter_local
