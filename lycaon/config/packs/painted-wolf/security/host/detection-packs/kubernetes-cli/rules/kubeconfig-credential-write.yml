title: Write a bearer token into the kubeconfig
id: aa0b86eb-427b-42c0-ad60-ef4b734f49ad
description: >-
  Stores a bearer token as a kubeconfig user entry. A name that already exists is
  merged over, so the credential it held is replaced and cannot be read back.
references:
  - https://kubernetes.io/docs/reference/kubectl/generated/kubectl_config/kubectl_config_set-credentials/
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-09-01'
modified: '2026-09-01'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.local
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image:
      - kubectl
      - oc
      - kubecolor
  verbs_kubeconfig_credential:
    CommandLine|contains: ' config set-credentials '
  # Inline tokens carry credential material directly.
  selection_token_value:
    CommandLine|contains:
      - ' --token='
      - ' --token '
  filter_rehearsal:
    Argv|re: '^(--help|-h)$'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_kubeconfig_credential and selection_token_value and not filter_rehearsal and not filter_local
