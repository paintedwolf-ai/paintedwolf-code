title: Take a node out of service
id: f17a8cf4-0f96-41f9-b2c1-cbed5c19f617
description: Drains, cordons, or taints a node so workloads move off it.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
level: medium
detection:
  selection_image:
    Image:
      - kubectl
      - oc
      - kubecolor
  verbs_node_disrupt:
    CommandLine|contains:
      - ' drain '
      - ' cordon '
      - ' taint node'
  filter_rehearsal:
    Argv|re: '^(--help|-h|uncordon|--dry-run(=.*)?)$'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_node_disrupt and not filter_rehearsal and not filter_local
