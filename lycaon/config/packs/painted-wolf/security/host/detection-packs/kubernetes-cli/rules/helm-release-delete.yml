title: Uninstall or roll back a Helm release
id: 1866a262-e766-48fa-af32-41f4cbb58e65
description: Removes a Helm release or reverts it to an earlier revision.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image: helm
  verbs_release_remove:
    CommandLine|contains:
      - ' uninstall '
      - ' delete '
      - ' rollback '
  filter_rehearsal:
    Argv|re: '^(--dry-run(=.*)?|--help|-h)$'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_release_remove and not filter_rehearsal and not filter_local
