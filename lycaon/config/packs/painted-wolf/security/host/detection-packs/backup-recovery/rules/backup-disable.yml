title: Stop taking backups
id: 4f2d2b75-75eb-4e3d-9637-f773393ce883
description: Turns off automatic backups, so nothing new is captured until it is turned back on.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-08'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.local
level: medium
detection:
  # Reversible with `tmutil enable`; what is already stored stays put.
  selection_tmutil:
    Image: tmutil
    CommandLine|contains:
      - ' disable'
      - ' disablelocal'
  filter_rehearsal:
    Argv:
      - '--help'
      - '-h'
  filter_local:
    EffectReach: local
  condition: selection_tmutil and not filter_rehearsal and not filter_local
