title: Store a registry credential
id: 6c792c55-5633-4343-a208-03f235cc2b8d
description: Writes a registry or image-repository credential to disk for later use.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_node_token:
    Image:
      - npm
      - pnpm
      - yarn
      - bun
    CommandLine|contains:
      - ':_authToken'
      - ' config set //'
  selection_registry_login:
    Image:
      - docker
      - podman
      - nerdctl
      - helm
    CommandLine|contains:
      - ' login '
      - ' registry login'
  selection_password_flag:
    CommandLine|contains:
      - ' --password '
      - ' --password='
      - ' --password-stdin'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: (selection_node_token or (selection_registry_login and selection_password_flag)) and not filter_rehearsal and not filter_local
