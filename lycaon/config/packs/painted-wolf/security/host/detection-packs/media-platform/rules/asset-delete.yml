title: Delete Cloudinary media assets
id: 3a049dec-a1cd-48e2-b9e3-4a91ba5bc413
description: Permanently deletes one or more uploaded images, videos, or other assets.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image: cld
    # `delete_resources` is a prefix of the _by_prefix / _by_tag / _by_asset_ids
    # variants, so one entry carries all four. The whole-account and folder
    # forms do not share it and need naming.
    CommandLine|contains:
      - ' uploader destroy'
      - ' admin delete_resources'
      - ' admin delete_all_resources'
      - ' admin delete_folder'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_image and not filter_rehearsal and not filter_local
