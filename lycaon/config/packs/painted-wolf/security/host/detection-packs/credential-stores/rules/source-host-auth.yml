title: Write a source-host or VCS credential
id: 6b1d0a97-5e42-4f8d-8a2c-c9f4e7b13d58
description: Rewrites the credentials a source host or version control client authenticates with.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-10'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.credential-store
level: high
detection:
  selection_target:
    TargetFile|contains:
      - '~/.config/gh/'
      - '~/.config/glab-cli/'
      - '~/.netrc'
      - '~/.git-credentials'
  filter_rehearsal:
    Argv: '--help'
  condition: selection_target and not filter_rehearsal
