title: Write a container registry login
id: 0a4a6c1e-9d2f-4a3b-9e88-1f7c5f0c2b41
description: >-
  Rewrites the file a container CLI stores registry credentials in. The directory
  around it also holds cli-plugins, which the CLI executes.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-10'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.credential-store
level: high
detection:
  selection_target:
    TargetFile|contains:
      - '~/.docker/config.json'
      - '~/.config/containers/auth.json'
      - '~/.docker/contexts'
      - '~/.docker/daemon.json'
  filter_rehearsal:
    Argv: '--help'
  condition: selection_target and not filter_rehearsal
