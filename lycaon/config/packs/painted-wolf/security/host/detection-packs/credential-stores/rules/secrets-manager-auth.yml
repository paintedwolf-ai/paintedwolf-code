title: Write a secrets manager or infrastructure credential
id: e51f9c26-0d73-4a5b-b64e-8f2c17a9d340
description: Rewrites a stored token for a secrets manager, infrastructure or storage client.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-10'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.credential-store
level: high
detection:
  selection_target:
    TargetFile|contains:
      - '~/.config/op/'
      - '~/.vault-token'
      - '~/.terraform.d/'
      - '~/.terraformrc'
      - '~/.config/rclone/rclone.conf'
  filter_rehearsal:
    Argv: '--help'
  condition: selection_target and not filter_rehearsal
