title: Reached a data or AI cloud API
id: 3ba2166d-9ce3-4542-b8b7-60f73018bc27
description: >-
  Connected to a managed warehouse, OLTP database, search, vector, ETL/ELT, or
  model platform API. A hostname cannot tell a read from a wipe or charge, so
  this is a coarse signal for scripts and SDKs.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-08'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: egress_observed
tags:
