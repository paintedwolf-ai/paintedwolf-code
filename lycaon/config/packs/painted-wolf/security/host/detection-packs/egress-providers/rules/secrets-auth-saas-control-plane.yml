title: Reached a secrets or auth SaaS API
id: a76f9d16-016b-4487-8ceb-a6c14914f0ee
description: >-
  Connected to a hosted secrets broker or authentication platform API. A
  hostname cannot tell a read from a token mint or policy change.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-08'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: egress_observed
tags:
  - lycaon.effect.external
level: medium
detection:
  selection_host:
    DestinationHostname:
      - api.doppler.com
      - api.1password.com
      - events.1password.com
      - connect.1password.com
      - app.infisical.com
      - api.infisical.com
      - secrets.infisical.com
      - api.vault.hashicorp.com
      - api.hashicorp.cloud
      - auth.hashicorp.com
      - api.clerk.com
      - api.clerk.dev
      - clerk.accounts.dev
      - api.workos.com
      - api.auth0.com
      - login.auth0.com
      - okta.com
      - integrator-api.okta.com
      - api.stytch.com
      - api.descope.com
      - api.kinde.com
  selection_suffix:
    DestinationHostname|endswith:
      - .doppler.com
      - .1password.com
      - .1password.eu
      - .infisical.com
      - .vault.hashicorp.com
      - .hashicorp.cloud
      - .clerk.com
      - .clerk.dev
      - .clerk.accounts.dev
      - .workos.com
      - .auth0.com
      - .okta.com
      - .oktapreview.com
      - .okta-emea.com
      - .stytch.com
      - .descope.com
      - .kinde.com
      - .firebaseio.com
      - .firebaseapp.com
      - .identitytoolkit.googleapis.com
  condition: selection_host or selection_suffix
