title: Delete or reset a remote application database
id: 624967df-19f7-4584-bcf9-8f27c83f9471
description: Deletes Firestore data or resets a linked Supabase database to empty.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_firebase:
    Image: firebase
    CommandLine|contains: ' firestore:delete'
  # A plain `db reset` targets only the local dev stack; --linked or --db-url
  # points it at a real remote database.
  selection_supabase:
    Image: supabase
    CommandLine|contains: ' db reset'
    CommandLine|re: '--linked\b|--db-url\b'
  filter_rehearsal:
    Argv|re: '^(--help|-h|--dry-run(=.*)?)$'
  filter_local:
    EffectReach: local
  condition: (selection_firebase or selection_supabase) and not filter_rehearsal and not filter_local
