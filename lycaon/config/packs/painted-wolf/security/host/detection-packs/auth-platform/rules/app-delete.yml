title: Delete an Auth0 application
id: 64c68870-518d-41f7-b08b-8f1dda8a9800
description: Deletes an OAuth application, so nothing using it can authenticate anymore.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_verb:
    Image: auth0
    CommandLine|re: '(?i)\sapps\s+(delete|rm)\b'
  selection_confirm:
    CommandLine|contains: '--force'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_verb and selection_confirm and not filter_rehearsal and not filter_local
