title: Delete or deactivate an Okta application
id: 75cd8977-a175-4411-abf0-fbf5e86467a6
description: Removes an application integration, so everything signing in through it stops authenticating.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-08'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  # Two shipped binaries: the developer CLI (`okta apps delete`) and the
  # API-mapped client (`okta-cli-client application delete`).
  selection_okta_dev:
    Image: okta
    CommandLine|contains: ' apps delete'
  selection_okta_client:
    Image: okta-cli-client
    CommandLine|contains:
      - ' application delete'
      - ' application deactivate'
  filter_rehearsal:
    Argv:
      - '--help'
      - '-h'
  filter_local:
    EffectReach: local
  condition: (selection_okta_dev or selection_okta_client) and not filter_rehearsal and not filter_local
