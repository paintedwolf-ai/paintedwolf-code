title: Delete an Auth0 user
id: 38f147f8-1a74-4a75-b9f2-c3237257cbcb
description: Deletes an end-user account and its login history.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_verb:
    Image: auth0
    CommandLine|re: '(?i)\susers\s+(delete|rm)\b'
  selection_confirm:
    CommandLine|contains: '--force'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_verb and selection_confirm and not filter_rehearsal and not filter_local
