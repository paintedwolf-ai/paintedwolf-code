title: Change account access or recovery
id: 301cb369-c444-474f-8687-dd17d6f47640
status: stable
description: Removes authentication or recovery access in a way that can lock out an account.
references:
  - https://attack.mitre.org/techniques/T1531/
author: Painted Wolf Code
date: '2026-08-11'
modified: '2026-08-11'
logsource: {product: lycaon, service: tool_exec}
detection:
  selection:
    ActionEffect: lockout
    TargetScope: account
  filter_rehearsal:
    ToolArg|re:
      - '(?i)^(.*[.])?(dry_run|dryrun|preview|validate_only|generate_cli_skeleton)=true$'
      - '(?i)^(.*[.])?(mode|execution_mode)=(dry_run|preview|validate)$'
  filter_local: {EffectReach: local}
  condition: selection and not filter_rehearsal and not filter_local
level: critical
tags: [lycaon.effect.external, lycaon.effect.unrecoverable, attack.impact]
