title: Create a persistent credential
id: bdaad67b-bed5-427c-97e8-e01cb1afee3e
status: stable
description: Creates or rotates a long-lived, signing, or root credential.
references:
  - https://attack.mitre.org/techniques/T1098/
author: Painted Wolf Code
date: '2026-08-11'
modified: '2026-08-11'
logsource: {product: lycaon, service: tool_exec}
detection:
  selection:
    CredentialPersistence: [long_lived, signing, root]
  filter_rehearsal:
    ToolArg|re:
      - '(?i)^(.*[.])?(dry_run|dryrun|preview|validate_only|generate_cli_skeleton)=true$'
      - '(?i)^(.*[.])?(mode|execution_mode)=(dry_run|preview|validate)$'
  filter_local: {EffectReach: local}
  condition: selection and not filter_rehearsal and not filter_local
level: high
tags: [lycaon.effect.external, lycaon.effect.unrecoverable, attack.persistence]
