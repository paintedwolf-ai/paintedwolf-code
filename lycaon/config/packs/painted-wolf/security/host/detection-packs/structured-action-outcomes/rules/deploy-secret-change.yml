title: Change a deployment or CI secret
id: 22d2dc56-ab97-4752-a8a9-4a73a952b4e4
status: stable
description: Creates, replaces, or removes a named secret used by deployment, CI, pipeline, repository, or environment execution.
references: [https://attack.mitre.org/techniques/T1552/]
author: Painted Wolf Code
date: '2026-08-11'
modified: '2026-08-11'
logsource: {product: lycaon, service: tool_exec}
detection:
  selection: {ApiAction: 'structured:deploy-secret-change', TargetPresent: 'true'}
  filter_rehearsal:
    ToolArg|re:
      - '(?i)^(.*[.])?(dry_run|dryrun|preview|validate_only|generate_cli_skeleton)=true$'
      - '(?i)^(.*[.])?(mode|execution_mode)=(dry_run|preview|validate)$'
  filter_local: {EffectReach: local}
  condition: selection and not filter_rehearsal and not filter_local
level: critical
tags: [lycaon.effect.external, lycaon.effect.unrecoverable, attack.credential-access]
