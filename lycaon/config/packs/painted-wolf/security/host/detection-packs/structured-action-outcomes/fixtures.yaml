  - rule: native-security-config
    positive:
      - tool: edit
        args: {path: /etc/ssh/sshd_config, old_string: before, new_string: after}
        target_files: [/etc/ssh/sshd_config]
    negative: *read_only

  # Native rules require mutation and anchored paths.
  - rule: native-git-hook-install
    positive:
      - tool: git_merge
        args: {ref: feature}
        target_files: [~/repos/mirror.git/hooks/post-receive]
      - tool: write
        args: {path: /usr/share/git-core/templates/hooks/pre-commit, content: '#!/bin/sh'}
        target_files: [/usr/share/git-core/templates/hooks/pre-commit]
      - tool: chmod
        args: {path: ~/repos/mirror.git/hooks/post-receive, mode: '0755'}
        target_files: [~/repos/mirror.git/hooks/post-receive]
    negative: &native_path_safe
      - tool: read
        args: {path: ~/.gitconfig}
        target_files: [~/.gitconfig]
      - tool: read
        args: {path: ~/.ssh/authorized_keys}
        target_files: [~/.ssh/authorized_keys]
      - tool: read
        args: {path: /usr/local/bin/git}
        target_files: [/usr/local/bin/git]
      # Similar project paths remain inert.
      - tool: write
        args: {path: internal/gitconfig/gitconfig.go, content: package gitconfig}
        target_files: [internal/gitconfig/gitconfig.go]
      - tool: write
        args: {path: docs/gitconfig.example, content: '[core]'}
        target_files: [docs/gitconfig.example]
      - tool: write
        args: {path: scripts/hooks/pre-commit, content: '#!/bin/sh'}
        target_files: [scripts/hooks/pre-commit]
      - tool: write
        args: {path: testdata/fixture.git/hooks/pre-commit.sample, content: '#!/bin/sh'}
        target_files: [testdata/fixture.git/hooks/pre-commit.sample]
      - tool: write
        args: {path: tools/bin/git, content: '#!/bin/sh'}
        target_files: [tools/bin/git]
      # One directory or one file off from a named path.
      - tool: write
        args: {path: ~/.config/git/ignore, content: build/}
        target_files: [~/.config/git/ignore]
      - tool: write
        args: {path: /usr/share/git-core/templates/info/exclude, content: build/}
        target_files: [/usr/share/git-core/templates/info/exclude]
      - tool: write
        args: {path: ~/.local/share/bin/git, content: '#!/bin/sh'}
        target_files: [~/.local/share/bin/git]
      - tool: write
        args: {path: ~/.local/bin/project-release, content: '#!/bin/sh'}
        target_files: [~/.local/bin/project-release]
      - tool: write
        args: {path: /usr/local/bin/ripgrep, content: '#!/bin/sh'}
        target_files: [/usr/local/bin/ripgrep]
      # File tools reject work-tree metadata paths directly.
      - tool: write
        args: {path: .git/hooks/pre-commit, content: '#!/bin/sh'}
        target_files: [.git/hooks/pre-commit]
      - tool: write
        args: {path: .git/config, content: '[core]'}
        target_files: [.git/config]

  - rule: native-git-config
    positive:
      - tool: git_checkout
        args: {branch: feature}
        target_files: [~/repos/mirror.git/config]
      - tool: edit
        args: {path: ~/.gitconfig, old_string: before, new_string: after}
        target_files: [~/.gitconfig]
      - tool: write
        args: {path: ~/.config/git/config, content: '[core]'}
        target_files: [~/.config/git/config]
      - tool: write
        args: {path: ~/repos/mirror.git/config, content: '[core]'}
        target_files: [~/repos/mirror.git/config]
    negative: *native_path_safe

  - rule: native-path-binary-shadow
    positive:
      - tool: write
        args: {path: /usr/local/bin/git, content: '#!/bin/sh'}
        target_files: [/usr/local/bin/git]
      - tool: copy
        args: {from: build/payload, to: ~/.local/bin/sudo}
        target_files: [build/payload, ~/.local/bin/sudo]
      - tool: chmod
        args: {path: /opt/homebrew/bin/curl, mode: '0755'}
        target_files: [/opt/homebrew/bin/curl]
    negative: *native_path_safe
