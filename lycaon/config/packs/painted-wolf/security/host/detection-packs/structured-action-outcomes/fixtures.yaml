  - rule: native-ssh-access-file
    positive:
      - tool: write
        args: {path: ~/.ssh/authorized_keys, content: ssh-ed25519 fixture}
        target_files: [~/.ssh/authorized_keys]
    negative: *read_only

  - rule: native-shell-startup-file
    positive:
      - tool: edit
        args: {path: ~/.zshrc, old_string: before, new_string: after}
        target_files: [~/.zshrc]
    negative: *read_only

  - rule: native-service-definition
    positive:
      - tool: write
        args: {path: ~/.config/systemd/user/fixture.service, content: fixture}
        target_files: [~/.config/systemd/user/fixture.service]
