title: Read a secret value
id: 079f93dd-a682-4191-8b69-eb8a1f9f468d
status: stable
description: Retrieves the value of a named secret through a registry-identified structured operation.
references: [https://attack.mitre.org/techniques/T1555/]
author: Painted Wolf Code
date: '2026-08-11'
modified: '2026-08-11'
logsource: {product: lycaon, service: tool_exec}
detection:
  selection: {ApiAction: 'structured:secret-access', TargetPresent: 'true'}
  filter_rehearsal:
    ToolArg|re:
      - '(?i)^(.*[.])?(dry_run|dryrun|preview|validate_only|generate_cli_skeleton)=true$'
      - '(?i)^(.*[.])?(mode|execution_mode)=(dry_run|preview|validate)$'
  filter_local: {EffectReach: local}
  condition: selection and not filter_rehearsal and not filter_local
level: high
tags: [lycaon.effect.external, lycaon.effect.unrecoverable, attack.credential-access]
