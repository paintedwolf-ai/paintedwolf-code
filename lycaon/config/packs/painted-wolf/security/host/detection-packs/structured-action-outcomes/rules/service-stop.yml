title: Stop a remote service
id: adb15751-58b6-4db9-9137-19476d045f38
status: stable
description: Stops, suspends, deallocates, pauses, or scales a specifically named remote service to zero.
references: [https://attack.mitre.org/techniques/T1489/]
author: Painted Wolf Code
date: '2026-08-11'
modified: '2026-08-11'
logsource: {product: lycaon, service: tool_exec}
detection:
  selection: {ApiAction: 'structured:service-stop', TargetPresent: 'true'}
  filter_rehearsal:
    ToolArg|re:
      - '(?i)^(.*[.])?(dry_run|dryrun|preview|validate_only|generate_cli_skeleton)=true$'
      - '(?i)^(.*[.])?(mode|execution_mode)=(dry_run|preview|validate)$'
  filter_local: {EffectReach: local}
  condition: selection and not filter_rehearsal and not filter_local
level: medium
tags: [lycaon.effect.external, attack.impact]
