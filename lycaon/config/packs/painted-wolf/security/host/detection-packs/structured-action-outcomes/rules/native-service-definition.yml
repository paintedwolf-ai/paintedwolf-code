title: Change an automatic service definition
id: 82bd8de3-ce06-47a2-9d7b-ce9335a5e517
status: stable
description: Mutates a systemd, launchd, or cron service definition through a native file action.
references: [https://attack.mitre.org/techniques/T1543/]
author: Painted Wolf Code
date: '2026-08-11'
modified: '2026-09-22'
logsource: {product: lycaon, service: tool_exec}
detection:
  selection:
    Tool: [write, edit, replace_lines, code_rewrite, jq_edit, copy, move, delete, chmod, chown, git_restore]
    TargetFile|re:
      - '^(/etc/systemd/system|/usr/lib/systemd/system|~[/][.]config/systemd/user)/[^/]+[.](service|socket|timer|path)$'
      - '^(/Library/LaunchAgents|/Library/LaunchDaemons|~[/]Library/LaunchAgents)/[^/]+[.]plist$'
      - '^/etc/(crontab|cron[.]d/[^/]+)$'
  condition: selection
level: high
tags: [lycaon.effect.local, lycaon.effect.unrecoverable, attack.persistence]
