title: Retrieve short-lived session credentials
id: 54cbacb0-a999-4728-96b8-f65aa9f2ce20
status: stable
description: Retrieves an access token or other short-lived session credential.
references:
  - https://attack.mitre.org/techniques/T1550/001/
author: Painted Wolf Code
date: '2026-08-11'
modified: '2026-08-11'
logsource: {product: lycaon, service: tool_exec}
detection:
  selection:
    CredentialPersistence: session
  filter_rehearsal:
    ToolArg|re:
      - '(?i)^(.*[.])?(dry_run|dryrun|preview|validate_only|generate_cli_skeleton)=true$'
      - '(?i)^(.*[.])?(mode|execution_mode)=(dry_run|preview|validate)$'
  filter_local: {EffectReach: local}
  condition: selection and not filter_rehearsal and not filter_local
level: medium
tags: [lycaon.effect.external]
