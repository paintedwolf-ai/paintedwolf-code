title: Suspend a user or service identity
id: a6fc5ffc-b89c-4bf9-b1e6-a98ae5655ca8
status: stable
description: Disables, suspends, deactivates, or blocks a specifically named identity.
references: [https://attack.mitre.org/techniques/T1531/]
author: Painted Wolf Code
date: '2026-08-11'
modified: '2026-08-11'
logsource: {product: lycaon, service: tool_exec}
detection:
  selection: {ApiAction: 'structured:identity-disable', TargetPresent: 'true'}
  filter_rehearsal:
    ToolArg|re:
      - '(?i)^(.*[.])?(dry_run|dryrun|preview|validate_only|generate_cli_skeleton)=true$'
      - '(?i)^(.*[.])?(mode|execution_mode)=(dry_run|preview|validate)$'
  filter_local: {EffectReach: local}
  condition: selection and not filter_rehearsal and not filter_local
level: medium
tags: [lycaon.effect.external, attack.impact]
