title: Share data publicly
id: 7810b781-4674-4951-a6ba-53cdcf016285
status: stable
description: Creates public or anonymous access to a resource or shared link.
references:
  - https://attack.mitre.org/techniques/T1530/
author: Painted Wolf Code
date: '2026-08-11'
modified: '2026-08-11'
logsource: {product: lycaon, service: tool_exec}
detection:
  selection_effect: {ActionEffect: [share, expose]}
  selection_principal: {PrincipalScope: [public, anonymous]}
  filter_rehearsal:
    ToolArg|re:
      - '(?i)^(.*[.])?(dry_run|dryrun|preview|validate_only|generate_cli_skeleton)=true$'
      - '(?i)^(.*[.])?(mode|execution_mode)=(dry_run|preview|validate)$'
  filter_local: {EffectReach: local}
  condition: selection_effect and selection_principal and not filter_rehearsal and not filter_local
level: high
tags: [lycaon.effect.external, lycaon.effect.unrecoverable, attack.exfiltration]
