title: Deploy to production
id: 39212817-63f2-4fc1-a002-142a7e7fa596
status: stable
description: Deploys or promotes a named application or service to an explicitly production environment.
references: [https://slsa.dev/spec/v1.2/]
author: Painted Wolf Code
date: '2026-08-11'
modified: '2026-08-11'
logsource: {product: lycaon, service: tool_exec}
detection:
  selection_explicit: {ApiAction: 'structured:production-deploy-explicit', TargetPresent: 'true'}
  selection_context:
    ApiAction: 'structured:production-deploy-contextual'
    TargetPresent: 'true'
    ToolArg|re:
      - '(?i)^(.*[.])?(environment|environment_name|stage|target|track)=(production|prod|live)$'
  filter_rehearsal:
    ToolArg|re:
      - '(?i)^(.*[.])?(dry_run|dryrun|preview|validate_only|generate_cli_skeleton)=true$'
      - '(?i)^(.*[.])?(mode|execution_mode)=(dry_run|preview|validate)$'
  filter_local: {EffectReach: local}
  condition: (selection_explicit or selection_context) and not filter_rehearsal and not filter_local
level: medium
tags: [lycaon.effect.external, attack.impact]
