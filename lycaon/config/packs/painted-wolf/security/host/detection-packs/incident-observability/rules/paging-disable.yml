title: Stop a service from paging on-call
id: c849b95b-e989-4fb6-80e3-411712d92e08
description: Disables a service, so a real incident on it will not page anyone.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
level: medium
detection:
  selection_pd:
    Image: pd
    CommandLine|contains: ' service disable'
  # Silences and downtimes expire or can be canceled, so they stay in the
  # reversible band alongside disabling a service.
  selection_amtool:
    Image: amtool
    CommandLine|contains: ' silence add'
  selection_datadog:
    Image: dog
    CommandLine|contains:
      - ' monitor mute'
      - ' monitor mute_all'
      - ' downtime post'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: (selection_pd or selection_amtool or selection_datadog) and not filter_rehearsal and not filter_local
