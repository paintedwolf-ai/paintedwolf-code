title: Delete a Sentry release
id: 298fb80a-1eac-4da1-b4eb-023eb7ae7b5d
description: Removes a release record. Associated sessions and transactions can outlive it, so this is a partial, metadata-level delete.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
level: medium
detection:
  # The command group is `releases`, plural, with no singular alias.
  selection_image:
    Image: sentry-cli
    CommandLine|contains: ' releases delete'
  filter_rehearsal:
    Argv|re: '^(--help|--dry-run(=.*)?)$'
  filter_local:
    EffectReach: local
  condition: selection_image and not filter_rehearsal and not filter_local
