fixtures:
- rule: index-data-erase
  positive:
  - splunk clean eventdata -index main -f
  - splunk clean eventdata -f
  - splunk remove index legacy_index
  - sudo splunk clean eventdata -index main -f
  negative:
  - splunk list index
  - splunk clean eventdata --help
  - splunk remove index legacy_index --help
  - splunk list eventdata
  # Without -f this sits on a confirmation prompt and erases nothing.
  - splunk clean eventdata -index main
  # `--force` is not a Splunk spelling; only -f skips the prompt.
  - splunk clean eventdata -index main --force
- rule: paging-disable
  positive:
  - pd service disable -i PXXXXX
  - amtool silence add alertname=HighErrorRate --duration=24h
  - dog monitor mute 12345
  - dog monitor mute_all
  - dog downtime post 'host:web-1' 3600
  - sudo pd service disable -i PXXXXX
  negative:
  - pd service enable -i PXXXXX
  - amtool silence query
  - amtool alert list
  - dog monitor show 12345
  - dog monitor unmute 12345
  - pd service list
  - pd service disable -i PXXXXX --help
- rule: sentry-release-delete
  positive:
