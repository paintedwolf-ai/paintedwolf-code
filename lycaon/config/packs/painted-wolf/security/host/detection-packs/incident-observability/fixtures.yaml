  - sentry-cli releases delete acme/1.4.0 --help
  - sentry-cli releases delete acme/1.4.0 --dry-run
  - sentry-cli releases finalize acme/1.4.0
  - sentry-cli releases archive acme/1.4.0
- rule: detection-control-delete
