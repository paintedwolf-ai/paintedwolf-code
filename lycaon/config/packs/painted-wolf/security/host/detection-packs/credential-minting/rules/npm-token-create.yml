title: Mint an npm registry token
id: 8dcdada9-bf56-4c9c-9e4a-8f9a0b1c2d38
description: Creates an npm registry authentication token and prints it once.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-20'
modified: '2026-08-20'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.mints_credential
level: informational
detection:
  selection_verb:
    Image: npm
    CommandLine|contains:
      - ' token create'
  filter_rehearsal:
    Argv: '--help'
  condition: selection_verb and not filter_rehearsal
