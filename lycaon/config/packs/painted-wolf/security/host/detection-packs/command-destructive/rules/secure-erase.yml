title: Overwrite files beyond recovery
id: 5bce7d2c-c92b-4cc3-8f25-05cf6bd34a9c
description: Overwrites file contents in place so the previous data cannot be recovered.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.local
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_shred:
    Image:
      - shred
      - srm
      - wipe
  selection_truncate:
    Image: truncate
    CommandLine|contains:
      - ' -s 0'
      - ' --size=0'
  filter_rehearsal:
    Argv|re: '^(--help|--dry-run(=.*)?)$'
  filter_local:
    EffectReach: local
  condition: (selection_shred or selection_truncate) and not filter_rehearsal and not filter_local
