  - mkfs.ext4 /dev/sdb1
  - mkfs.xfs /dev/sdb1
  - mkfs.vfat -F32 /dev/sdc1
  - mkfs /dev/sdb1
  - newfs_hfs /dev/disk2s2
  - diskutil eraseDisk JHFS+ MyDisk /dev/disk2
  - diskutil partitionDisk /dev/disk2 1 GPT JHFS+ Data 100%
  - diskutil secureErase freespace 0 /dev/disk2
