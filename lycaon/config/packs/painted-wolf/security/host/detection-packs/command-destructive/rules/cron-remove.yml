title: Remove a user's scheduled cron jobs
id: d71dacac-7204-4742-a8f7-8fb3371381fb
description: Deletes a user's entire crontab in one action, with no per-job confirmation.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.local
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image: crontab
    CommandLine|contains: ' -r'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_image and not filter_rehearsal and not filter_local
