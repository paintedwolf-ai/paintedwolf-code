title: Recursively delete a directory tree
id: 30d8e331-9d3c-4232-a498-7a0cdae1a47f
description: Force-deletes a directory tree, or discards untracked and ignored files.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.local
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_rm:
    Image: rm
    CommandLine|re: '(?i)\s-{1,2}[a-z]*r[a-z]*f|\s-{1,2}[a-z]*f[a-z]*r|\s--recursive\b'
  selection_git_clean:
    Image: git
    CommandLine|re: '(?i)\sclean\b.*\s-{1,2}[a-z]*[xX]'
  selection_find_delete:
    Image: find
    CommandLine|contains: ' -delete'
  filter_rehearsal:
    Argv|re: '^(--help|--dry-run(=.*)?)$'
  filter_local:
    EffectReach: local
  condition: (selection_rm or selection_git_clean or selection_find_delete) and not filter_rehearsal and not filter_local
