title: Delete a data catalog or dataset
id: 4e4974b4-8a24-422a-9f82-f2d4a43f35a6
description: Deletes a Unity Catalog catalog/schema or a BigQuery dataset, along with the tables it holds.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_databricks:
    Image: databricks
    CommandLine|contains:
      - ' catalogs delete'
      - ' schemas delete'
      - ' unity-catalog catalogs delete'
  # -f/--force silences bq's confirmation prompt, so every unattended delete
  # carries it, for a single table as much as for a whole dataset.
  selection_bq:
    Image: bq
    CommandLine|re: '(?i)\brm\b.*(-f\b|--force\b)'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: (selection_databricks or selection_bq) and not filter_rehearsal and not filter_local
