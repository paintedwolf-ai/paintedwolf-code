title: Permanently delete a compute cluster
id: 84db1907-73e9-4ac9-99c5-68df0165ca25
description: Permanently removes a cluster's configuration and history, past normal termination.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_image:
    Image: databricks
    CommandLine|contains: ' clusters permanent-delete'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_image and not filter_rehearsal and not filter_local
