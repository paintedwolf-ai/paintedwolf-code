title: Issue a token or change a secret-store policy
id: 938def15-7ee6-462c-992b-d0f19ebd9fe5
description: Creates a token or writes an access policy on a secret store.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_image:
    Image:
      - vault
      - bao
  verbs_policy_grant:
    CommandLine|contains:
      - ' policy write'
      - ' token create'
      - ' auth enable'
      - ' write auth/'
      - ' write sys/policy'
  filter_rehearsal:
    Argv: '--help'
  filter_read_only:
    CommandLine|contains:
      - ' policy read'
      - ' policy list'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_policy_grant and not filter_rehearsal and not filter_read_only and not filter_local
