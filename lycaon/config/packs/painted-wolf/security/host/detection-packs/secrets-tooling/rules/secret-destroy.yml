title: Destroy stored secret material
id: ac0ce5e8-b047-4134-84d9-10048effa2b8
description: Permanently removes a secret, its versions, or the key that unseals a store.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image:
      - vault
      - bao
  verbs_secret_destroy:
    CommandLine|contains:
      - ' kv destroy'
      - ' kv metadata delete'
      - ' kv delete'
      - ' secrets disable'
      - ' operator seal'
  filter_rehearsal:
    Argv: '--help'
  filter_read_only:
    CommandLine|contains:
      - ' kv list'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_secret_destroy and not filter_rehearsal and not filter_read_only and not filter_local
