title: Read or decrypt stored secret material
id: 94355aaf-8c84-4bab-a30c-cd85ccad04ea
description: Reads a secret from a store or decrypts an encrypted file to plaintext.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_vault:
    Image:
      - vault
      - bao
    CommandLine|contains:
      - ' kv get'
      - ' read secret/'
      - ' unwrap'
  selection_sops:
    Image: sops
    CommandLine|contains:
      - ' -d'
      - ' --decrypt'
  selection_crypto:
    Image:
      - gpg
      - age
    CommandLine|contains:
      - ' --decrypt'
      - ' -d '
  filter_rehearsal:
    Argv: '--help'
  filter_read_only:
    CommandLine|contains:
      - ' kv list'
  filter_local:
    EffectReach: local
  condition: (selection_vault or selection_sops or selection_crypto) and not filter_rehearsal and not filter_read_only and not filter_local
