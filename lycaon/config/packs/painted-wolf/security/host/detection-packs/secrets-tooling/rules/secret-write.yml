title: Overwrite a stored secret's value
id: 25b156ee-1783-4978-80ac-c57ec71d25bb
description: Writes new data at an existing secret path, replacing what a reader would get back.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
level: medium
detection:
  selection_image:
    Image:
      - vault
      - bao
  # Scoped to the default KV mount so this does not fire on every `vault write`
  # — Vault lets a policy write live anywhere, and that path is already covered
  # by policy-or-token-grant.
  verbs_kv_write:
    CommandLine|re: '(?i)\s(write|kv\s+put)\s+secret[/ ]'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_kv_write and not filter_rehearsal and not filter_local
