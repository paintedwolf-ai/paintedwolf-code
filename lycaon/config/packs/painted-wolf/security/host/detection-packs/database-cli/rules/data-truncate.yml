title: Empty a table or keyspace
id: 87784b94-d72f-4da8-98db-e405d04350f8
description: Truncates a table or flushes every key in a datastore.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image:
      - psql
      - mysql
      - mariadb
      - sqlite3
      - mongosh
      - mongo
      - cockroach
      - clickhouse-client
      - redis-cli
      - valkey-cli
      - cqlsh
      - snowsql
      - snow
  verbs_data_empty:
    CommandLine|re:
      - '(?i)[\s''"(]truncate\b'
      - '(?i)[\s''"(]flush(all|db)\b'
      - '(?i)\.deleteMany\s*\(\s*\{\s*\}\s*\)'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_data_empty and not filter_rehearsal and not filter_local
