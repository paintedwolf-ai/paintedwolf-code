title: Write an OS keychain or password store
id: 9d3a51f7-6c28-4b90-a7e5-1f4802cb6d3a
description: >-
  Rewrites the store a password manager or the operating system keeps decryptable
  material in. Everything the person has saved is reachable from one file here.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-12'
modified: '2026-08-12'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.key-material
level: high
detection:
  selection_target:
    TargetFile|contains:
      - '~/Library/Keychains/'
      - '~/.password-store/'
      - '~/.local/share/keyrings/'
  filter_rehearsal:
    Argv: '--help'
  condition: selection_target and not filter_rehearsal
