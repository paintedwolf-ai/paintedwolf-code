title: Fetch session credentials
id: a9a85ab1-0208-468e-a3a7-a9712be5ac8d
description: >-
  Obtains short-lived credentials or a registry password that authenticate later
  calls as another principal.
references:
  - https://docs.aws.amazon.com/cli/latest/reference/
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-09-01'
modified: '2026-09-01'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
level: medium
detection:
  selection_image:
    Image: aws
  selection_structured:
    Tool|startswith: 'mcp_'
  # get-login-password is the command verb; get-authorization-token the API name.
  verbs_session_credentials:
    ApiAction|contains:
      - ':assume-role'
      - ':get-session-token'
      - ':get-federation-token'
      - ':update-kubeconfig'
      - 'ecr:get-authorization-token'
      - 'ecr:get-login-password'
      - 'eks:get-token'
  filter_rehearsal:
    Argv|re: '^(--dry-run(=.*)?|--generate-cli-skeleton|help)$'
  filter_structured_rehearsal:
    ToolArg|re:
      - '(?i)^(.*[.])?(dry_run|dryrun|preview|validate_only|generate_cli_skeleton)=true$'
      - '(?i)^(.*[.])?(mode|execution_mode)=(dry_run|preview|validate)$'
  filter_local:
    EffectReach: local
  condition: >-
    (selection_image or selection_structured) and verbs_session_credentials
    and not filter_rehearsal and not filter_structured_rehearsal and not filter_local
