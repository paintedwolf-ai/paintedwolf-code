title: Mint or implant a durable credential
id: 86ab1e6f-644f-4974-9ad7-87261eb012f4
description: >-
  Issues a long-lived credential, or installs one on an identity or instance the
  caller can then use directly.
references:
  - https://docs.aws.amazon.com/cli/latest/reference/
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-09-01'
modified: '2026-09-01'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_image:
    Image: aws
  selection_structured:
    Tool|startswith: 'mcp_'
  verbs_credential_mint:
    ApiAction|contains:
      - ':create-access-key'
      - ':create-login-profile'
      - ':create-service-specific-credential'
      - ':reset-service-specific-credential'
      - ':download-default-key-pair'
      - ':create-key-pair'
      - ':upload-ssh-public-key'
      - ':send-ssh-public-key'
      - ':update-login-profile'
      - ':admin-set-user-password'
      - ':admin-create-user'
  # The enabled argument distinguishes key issuance from key disabling.
  # A master-password update creates usable credential material.
  selection_master_password:
    ApiAction|contains:
      - ':modify-db-instance'
      - ':modify-db-cluster'
      - ':modify-cluster'
    CommandLine|contains: ' --master-user-password'
  selection_access_key_state:
    ApiAction|contains: ':update-access-key'
    CommandLine|contains: ' --status active'
  filter_rehearsal:
    Argv|re: '^(--dry-run(=.*)?|--generate-cli-skeleton|help)$'
  filter_structured_rehearsal:
    ToolArg|re:
      - '(?i)^(.*[.])?(dry_run|dryrun|preview|validate_only|generate_cli_skeleton)=true$'
      - '(?i)^(.*[.])?(mode|execution_mode)=(dry_run|preview|validate)$'
  filter_local:
    EffectReach: local
  condition: >-
    (selection_image or selection_structured) and (verbs_credential_mint or selection_master_password or selection_access_key_state)
    and not filter_rehearsal and not filter_structured_rehearsal and not filter_local
