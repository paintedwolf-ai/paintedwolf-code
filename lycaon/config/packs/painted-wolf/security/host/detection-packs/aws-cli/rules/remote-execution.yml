title: Run a command on a managed instance
id: 0cdede47-5a59-4baa-a804-433446d3b362
description: >-
  Dispatches an arbitrary command, or opens an interactive shell, on instances the
  caller has no session on.
references:
  - https://docs.aws.amazon.com/cli/latest/reference/
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-09-01'
modified: '2026-09-01'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_image:
    Image: aws
  selection_structured:
    Tool|startswith: 'mcp_'
  # These operations execute commands on a remote instance.
  verbs_remote_execution:
    ApiAction:
      - 'ssm:send-command'
      - 'ssm:start-session'
  filter_rehearsal:
    Argv|re: '^(--dry-run(=.*)?|--generate-cli-skeleton|help)$'
  filter_structured_rehearsal:
    ToolArg|re:
      - '(?i)^(.*[.])?(dry_run|dryrun|preview|validate_only|generate_cli_skeleton)=true$'
      - '(?i)^(.*[.])?(mode|execution_mode)=(dry_run|preview|validate)$'
  filter_local:
    EffectReach: local
  condition: >-
    (selection_image or selection_structured) and verbs_remote_execution
    and not filter_rehearsal and not filter_structured_rehearsal and not filter_local
