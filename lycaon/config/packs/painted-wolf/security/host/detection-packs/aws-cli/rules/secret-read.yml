title: Read stored credential material
id: 1ae20895-e809-4fdc-a5d1-bee8ef9908a8
description: >-
  Returns a stored secret, a decrypted parameter, a database password, or an API
  key value in the command output.
references:
  - https://docs.aws.amazon.com/cli/latest/reference/
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-09-01'
modified: '2026-09-01'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image: aws
  selection_structured:
    Tool|startswith: 'mcp_'
  verbs_secret_access:
    ApiAction|contains:
      - ':get-secret-value'
      - ':get-password-data'
      - ':generate-db-auth-token'
      - ':get-cluster-credentials'
      - ':get-credentials'
      - ':get-relational-database-master-user-password'
      - 'kms:decrypt'
  # Parameter Store returns ciphertext until asked to decrypt, and an API key is
  # a reference until its value is requested. The flag discloses the value.
  selection_parameter_read:
    ApiAction|contains:
      - ':get-parameter'
      - ':get-parameters'
      - ':get-parameters-by-path'
    CommandLine|contains: ' --with-decryption'
  selection_api_key_read:
    ApiAction|contains: ':get-api-key'
    CommandLine|contains: ' --include-value'
  filter_rehearsal:
    Argv|re: '^(--dry-run(=.*)?|--generate-cli-skeleton|help)$'
  filter_structured_rehearsal:
    ToolArg|re:
      - '(?i)^(.*[.])?(dry_run|dryrun|preview|validate_only|generate_cli_skeleton)=true$'
      - '(?i)^(.*[.])?(mode|execution_mode)=(dry_run|preview|validate)$'
  filter_local:
    EffectReach: local
  condition: >-
    (selection_image or selection_structured) and (verbs_secret_access or selection_parameter_read or selection_api_key_read)
    and not filter_rehearsal and not filter_structured_rehearsal and not filter_local
