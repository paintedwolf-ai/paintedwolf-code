title: Detach this account from its organization
id: 33081f12-db75-46d0-ae17-02c6de5a27b9
description: Removes this account from its AWS Organization.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-07-28'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_image:
    Image: aws
  selection_structured:
    Tool|startswith: 'mcp_'
  selection_org:
    ApiAction:
      - 'organizations:leave-organization'
      - 'organizations:remove-account-from-organization'
  filter_rehearsal:
    Argv|re: '^(--dry-run(=.*)?|--generate-cli-skeleton|help)$'
  filter_structured_rehearsal:
    ToolArg|re:
      - '(?i)^(.*[.])?(dry_run|dryrun|preview|validate_only|generate_cli_skeleton)=true$'
      - '(?i)^(.*[.])?(mode|execution_mode)=(dry_run|preview|validate)$'
  filter_local:
    EffectReach: local
  condition: (selection_image or selection_structured) and selection_org and not filter_rehearsal and not filter_structured_rehearsal and not filter_local
