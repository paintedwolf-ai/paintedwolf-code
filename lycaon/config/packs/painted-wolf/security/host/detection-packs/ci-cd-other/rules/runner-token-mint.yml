title: Mint a CI runner token
id: bbf1cf8a-04dd-4809-a8a6-699e546342ee
description: Creates a token that lets a new machine join the build fleet and receive jobs.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-08'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_circleci:
    Image: circleci
    CommandLine|contains: ' runner token create'
  filter_rehearsal:
    Argv:
      - '--help'
      - '-h'
  filter_local:
    EffectReach: local
  condition: selection_circleci and not filter_rehearsal and not filter_local
