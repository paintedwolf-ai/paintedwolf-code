title: Delete an Azure DevOps repo or pipeline
id: cb87dcdf-fde3-43a6-9797-d59988ec2a1c
description: Deletes a Git repository or pipeline definition from an Azure DevOps project.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image: az
    CommandLine|contains:
      - ' repos delete'
      - ' pipelines delete'
  filter_rehearsal:
    Argv:
      - '--help'
      - '-h'
  filter_local:
    EffectReach: local
  condition: selection_image and not filter_rehearsal and not filter_local
