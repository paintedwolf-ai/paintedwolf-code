title: Delete a shared CI secret store
id: e689e2d6-4f0f-4d47-8b02-9e51fe280709
description: Removes a context or cluster secret that pipelines read their credentials from.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-08'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_circleci:
    Image: circleci
    CommandLine|re: '(?i)\scontext\s+(delete|rm)\b|\scontext\s+secret\s+delete\b'
  # bk prompts unless --yes.
  selection_buildkite:
    Image: bk
    CommandLine|contains|all:
      - ' secret delete'
      - ' --yes'
  filter_rehearsal:
    Argv:
      - '--help'
      - '-h'
  filter_local:
    EffectReach: local
  condition: (selection_circleci or selection_buildkite) and not filter_rehearsal and not filter_local
