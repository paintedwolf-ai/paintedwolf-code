title: Delete a topic or queue
id: c5bcf0fa-c902-4e9e-a11a-ec9e460c9fb3
description: Deletes a topic or queue along with the messages it still holds.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  # kcat is absent: its only modes are consume, produce, metadata list, and
  # query — it cannot delete a topic at all.
  selection_kafka:
    Image:
      - kafka-topics
      - kafka-topics.sh
      - rpk
    CommandLine|contains:
      - ' --delete'
      - ' topic delete'
  selection_pubsub:
    Image:
      - nats
      - pulsar-admin
    CommandLine|contains:
      - ' stream rm'
      - ' stream purge'
      - ' topics delete'
  # Unlike kafka-topics/rpk, confluent's topic delete prompts interactively
  # without --force, so --force marks the unattended form.
  selection_confluent:
    Image: confluent
    CommandLine|contains|all:
      - ' kafka topic delete'
      - ' --force'
  filter_rehearsal:
    Argv|re: '^(--help|--list|--describe)$'
  filter_local:
    EffectReach: local
  condition: (selection_kafka or selection_pubsub or selection_confluent) and not filter_rehearsal and not filter_local
