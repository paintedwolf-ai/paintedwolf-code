title: Grant a Confluent Cloud role binding
id: 5a14551a-a8d1-475d-b40b-16f9d3a78b2e
description: Grants a principal a role over a Confluent Cloud resource.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_image:
    Image: confluent
    CommandLine|contains: ' iam rbac role-binding create'
  filter_rehearsal:
    Argv:
      - '--help'
      - '-h'
  filter_local:
    EffectReach: local
  condition: selection_image and not filter_rehearsal and not filter_local
