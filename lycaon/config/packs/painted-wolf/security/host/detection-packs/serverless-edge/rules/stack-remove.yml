title: Remove a deployed serverless stack
id: aa07cd37-56ed-4675-91ff-c856ab851c6b
description: Deletes a deployed function, worker, or stack and the data bound to it.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_serverless:
    Image:
      - serverless
      - sls
    CommandLine|contains: ' remove'
  selection_sam:
    Image: sam
    CommandLine|contains: ' delete'
  # Bare delete removes the deployment; named deletes remove bound stores.
  selection_wrangler:
    Image: wrangler
    CommandLine|contains: ' delete'
  # Exclude binding deletes handled by binding-secret-change.
  filter_binding_scope:
    CommandLine|contains:
      - ' secret delete'
      - ' secret bulk delete'
      - ' kv key delete'
      - ' kv bulk delete'
      - ' kv:key delete'
      - ' kv:bulk delete'
  filter_rehearsal:
    Argv|re: '^(--help|-h|--dry-run(=.*)?)$'
  filter_local:
    EffectReach: local
  condition: (selection_serverless or selection_sam or selection_wrangler) and not filter_binding_scope and not filter_rehearsal and not filter_local
