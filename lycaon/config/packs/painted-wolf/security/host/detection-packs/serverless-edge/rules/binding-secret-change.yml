title: Change an edge secret or stored value
id: f3d8932f-dba3-48b6-88f9-329bc080ed4f
description: Writes a secret or overwrites stored key-value data an edge deployment reads.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image:
      - wrangler
      - serverless
      - sls
      - sam
  # Match both `kv:key` and `kv key` spellings.
  verbs_binding_write:
    CommandLine|contains:
      - ' secret put'
      - ' secret delete'
      - ' secret bulk'
      - ' kv key put'
      - ' kv key delete'
      - ' kv bulk delete'
      - ' kv:key put'
      - ' kv:key delete'
      - ' kv:bulk delete'
  filter_rehearsal:
    Argv|re: '^(--help|-h|--dry-run(=.*)?)$'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_binding_write and not filter_rehearsal and not filter_local
