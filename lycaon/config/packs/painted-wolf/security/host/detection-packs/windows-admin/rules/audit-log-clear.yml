title: Clear the Windows event log
id: 51cc1459-e4f0-40e2-bdd9-8eaaa49c97a1
description: Clears an event log, removing the record of what ran before this.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.local
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_wevtutil:
    Image:
      - wevtutil
      - wevtutil.exe
    CommandLine|contains: ' cl '
  selection_powershell:
    Image:
      - powershell
      - powershell.exe
      - pwsh
      - pwsh.exe
    CommandLine|contains: 'Clear-EventLog'
  filter_rehearsal:
    CommandLine|re: '(?i)\s(-whatif|/[?])(?:["\x27]|\s)'
  filter_local:
    EffectReach: local
  condition: (selection_wevtutil or selection_powershell) and not filter_rehearsal and not filter_local
