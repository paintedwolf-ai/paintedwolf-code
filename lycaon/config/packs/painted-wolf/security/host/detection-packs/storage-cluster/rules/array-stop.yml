title: Stop or disassemble a software RAID array
id: 91a054bb-f970-43f4-9eca-f6c50d01f3a0
description: Stops an mdadm array or zeroes a member disk's superblock, taking the array offline.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.local
  - lycaon.effect.unrecoverable
level: high
detection:
  selection_image:
    Image: mdadm
  verbs_array_stop:
    CommandLine|contains:
      - ' --stop'
      - ' --zero-superblock'
      - ' --remove'
  filter_rehearsal:
    Argv: '--help'
  filter_local:
    EffectReach: local
  condition: selection_image and verbs_array_stop and not filter_rehearsal and not filter_local
