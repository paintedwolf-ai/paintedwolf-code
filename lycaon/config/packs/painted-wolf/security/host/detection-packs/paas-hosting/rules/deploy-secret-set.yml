title: Change deployment secrets
id: 47cc142b-5245-4c32-8dee-21c63327365a
description: Sets or removes environment secrets used by a deployed application.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.external
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_heroku:
    Image: heroku
    CommandLine|contains:
      - ' config:set'
      - ' config:unset'
  selection_fly:
    Image:
      - fly
      - flyctl
    CommandLine|contains:
      - ' secrets set'
      - ' secrets import'
      - ' secrets unset'
  selection_vercel:
    Image: vercel
    CommandLine|contains:
      - ' env add'
      - ' env rm'
  # netlify's env commands use a colon, not a space — config:set/env add are
  # other platforms' verbs and do not exist here.
  selection_netlify:
    Image: netlify
    CommandLine|contains:
      - ' env:set'
      - ' env:unset'
  # Match every variable and removal alias, including `variable --set KEY=value`.
  selection_railway:
    Image: railway
    CommandLine|re:
      - '(?i)\s(variables?|vars?)\s+(set|delete|rm|remove)\b'
      - '(?i)\s(variables?|vars?)\s(.*\s)?--set\b'
  filter_rehearsal:
    Argv|re: '^(--help|-h|--dry-run(=.*)?)$'
  filter_local:
    EffectReach: local
  condition: (selection_heroku or selection_fly or selection_vercel or selection_netlify or selection_railway) and not filter_rehearsal and not filter_local
