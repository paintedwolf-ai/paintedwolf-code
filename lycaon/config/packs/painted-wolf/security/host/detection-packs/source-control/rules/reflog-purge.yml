title: Remove the recovery log for lost commits
id: 8a26d353-cf30-49d6-8a42-025afbc67a82
description: Expires the reflog or prunes unreachable objects, so detached work cannot be found again.
references:
  - https://attack.mitre.org/
author: Painted Wolf Code
date: '2026-08-07'
modified: '2026-08-11'
status: stable
logsource:
  product: lycaon
  service: tool_exec
tags:
  - lycaon.effect.local
  - lycaon.effect.unrecoverable
level: critical
detection:
  selection_image:
    Image: git
  # The reflog recovers from a bad reset; expiring it makes that mistake
  # permanent.
  verbs_reflog_purge:
    CommandLine|contains:
      - ' reflog expire'
      - ' reflog delete'
  selection_prune_now:
    CommandLine|contains|all:
      - ' gc '
      - ' --prune=now'
  filter_rehearsal:
    Argv|re: '^(--dry-run(=.*)?|--help|-h)$'
  filter_local:
    EffectReach: local
  condition: selection_image and (verbs_reflog_purge or selection_prune_now) and not filter_rehearsal and not filter_local
