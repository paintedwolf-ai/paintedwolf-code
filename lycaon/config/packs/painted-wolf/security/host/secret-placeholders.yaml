# Documented example credentials the outbound secret screen never treats as a
# secret. Every value is a sample its vendor or standard publishes and
# authenticates nothing. An entry can only remove an ask, and only for its exact
# string. Each value carries its public source.
version: 1
placeholders:
  - value: AKIAIOSFODNN7EXAMPLE
    source: AWS documentation sample access key id
  - value: AKIAI44QH8DHBEXAMPLE
    source: AWS documentation sample access key id
  - value: wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY
    source: AWS documentation sample secret access key
  - value: je7MtGbClwBF/2Zp9Utk/h3yCo8nvbEXAMPLEKEY
    source: AWS documentation sample secret access key
  - value: AKIAIOSFODNN7EXAMPLE_KEY
    source: AWS documentation sample access key id variant
  - value: ASIAIOSFODNN7EXAMPLE
    source: AWS documentation sample temporary access key id
  - value: xoxb-not-a-real-token-this-will-not-work
    source: Slack API documentation sample bot token
  - value: sk_test_4eC39HqLyjWDarjtT1zdp7dc
    source: Stripe documentation public test key
  - value: pk_test_TYooMQauvdEDq54NiTphI7jx
    source: Stripe documentation public test key
  - value: ghp_000000000000000000000000000000000000
    source: GitHub documentation sample token shape
  - value: AIzaSyA-EXAMPLE-KEY-000000000000000000
    source: Google API documentation sample key shape
  - value: 00000000-0000-0000-0000-000000000000
    source: nil UUID
  - value: YOUR_API_KEY
    source: universal documentation placeholder
  - value: your-api-key-here
    source: universal documentation placeholder
  - value: changeme
    source: universal configuration placeholder
  - value: password
    source: universal configuration placeholder
