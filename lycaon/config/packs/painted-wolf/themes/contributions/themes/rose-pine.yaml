id: painted-wolf/themes:rose-pine
name: Rosé Pine
appearance: dark

# Low-contrast palette; the edges stay under its hairlines.
bevel:
  strength: 0.75

# Foam carries success and stays distinct from love.
window_colors:
  main: "#c4a7e7"
  anchors: ["#c4a7e7", "#9ccfd8", "#ebbcba", "#f6c177", "#31748f"]
  hue_spread: 18
  chroma_min: 0.04
  chroma_max: 0.12

tokens:
  background: "#191724" # base
  surface: "#191724"
  surface-elevated: "#26233a" # overlay
  surface-chrome: "#1f1d2e" # surface
  # The rail is surface, so blocks clear it rather than the page.
  surface-offset: "#26233a" # overlay
  surface-raised: "#403d52" # highlight-med
  # Highlight-med keeps the border visible against base.
  border: "#403d52" # highlight-med
  text: "#e0def4"
  text-muted: "#908caa" # subtle
  accent: "#c4a7e7" # iris
  accent-warm: "#ebbcba" # rose
  accent-text: "#c4a7e7"
  accent-signal: "#c4a7e7"
  danger: "#eb6f92" # love
  warning: "#f6c177" # gold
  status-positive: "#9ccfd8" # foam — the palette has no green
  # Rose separates running work from warning gold.
  status-running: "#ebbcba" # rose
  draft-accent: "#31748f" # pine
  tint-hue: "#6e6a86" # muted
  # One rung above surface-offset, so a chosen fill stays visible on it.
  selection: "#403d52" # highlight-med
  selection-strong: "#524f67" # highlight-high
  caret: "#e0def4"
  diff-add-hue: "#9ccfd8"
  diff-delete-hue: "#eb6f92"
  cost-coordinator: "#f6c177"
  cost-workers: "#9ccfd8"
  cost-summarizer: "#31748f"
  identity-1: "#c4a7e7"
  identity-2: "#9ccfd8"
  identity-3: "#31748f"
  identity-4: "#f6c177"
  identity-5: "#ebbcba"

syntax:
  keyword: "#31748f" # pine
  string: "#f6c177"
  number: "#ebbcba"
  constant: "#ebbcba"
  variable: "#e0def4"
  type: "#9ccfd8"
  function: "#ebbcba"
  property: "#9ccfd8"
  operator: "#908caa"
  punctuation: "#908caa"
  tag: "#9ccfd8"
  meta: "#908caa"
  invalid: "#eb6f92"
  link: "#c4a7e7"
  heading: { color: "#c4a7e7", bold: true }
  inserted: "#9ccfd8"
  deleted: "#eb6f92"
  emphasis: { italic: true }
  strong: { bold: true }
  quote: { color: "#6e6a86", italic: true }
  strikethrough: {}
  comment: { color: "#6e6a86", italic: true }

# Faceted geometry and a lighter stroke carry the palette's register.
icons:
  # The lighter stroke applies to every glyph.
  stroke:
    weight: 0.85
  geometry:
    find: '<path d="M6.5 2.25 10.75 6.5 6.5 10.75 2.25 6.5Z"/><path d="M9.5 9.5 13.75 13.75"/>'
    goto-line: '<path d="M3 4.25h10"/><path d="M4.5 8h8"/><path d="M6 11.75h5"/>'
    copy: '<rect x="5.75" y="5.75" width="7.75" height="7.75" rx="2"/><path d="M10.25 3.5A1.5 1.5 0 0 0 8.75 2H3.75A1.75 1.75 0 0 0 2 3.75v5A1.5 1.5 0 0 0 3.5 10.25H4"/>'
    check: '<path d="M2.75 8.25 6.5 12 13.25 4.5"/>'
    more: '<path d="M3.4 6.5 4.9 8 3.4 9.5 1.9 8Z"/><path d="M8 6.5 9.5 8 8 9.5 6.5 8Z"/><path d="M12.6 6.5 14.1 8 12.6 9.5 11.1 8Z"/>'
