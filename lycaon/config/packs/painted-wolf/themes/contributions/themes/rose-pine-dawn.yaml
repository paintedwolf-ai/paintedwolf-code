id: painted-wolf/themes:rose-pine-dawn
name: Rosé Pine Dawn
appearance: light

# Cream muddies before white does, so the edges stay light.
bevel:
  strength: 0.75

# Derived warning ink keeps Dawn's gold readable as copy.
# The light surface lifts chrome above the base page.
window_colors:
  main: "#907aa9"
  anchors: ["#907aa9", "#286983", "#56949f", "#d7827e", "#ea9d34"]
  hue_spread: 18
  chroma_min: 0.04
  chroma_max: 0.12

tokens:
  background: "#faf4ed" # base
  surface: "#faf4ed"
  surface-elevated: "#fffaf3" # surface
  surface-chrome: "#fffaf3" # lifted, which is Dawn's shape
  # The rail is brighter than the page, so the lift is brighter still.
  surface-offset: "#f2e9e1" # overlay
  surface-raised: "#fffaf3" # surface
  brand-field: "#fffaf3" # chrome plate
  border: "#cecacd" # highlight-high
  text: "#575279"
  text-muted: "#797593" # subtle
  accent: "#907aa9" # iris
  accent-warm: "#d7827e" # rose
  accent-text: "#907aa9"
  accent-signal: "#907aa9"
  danger: "#b4637a" # love
  warning: "#ea9d34" # gold; warning-text derives separately
  status-positive: "#286983" # pine, the palette's darkest cool hue
  status-running: "#d7827e" # rose — split from gold, as in Rosé Pine
  draft-accent: "#56949f" # foam
  tint-hue: "#9893a5" # muted
  # One rung past surface-offset, so a chosen fill stays visible on it.
  selection: "#dfdad9" # highlight-med
  selection-strong: "#cecacd" # highlight-high
  caret: "#575279"
  diff-add-hue: "#286983"
  diff-delete-hue: "#b4637a"
  cost-coordinator: "#ea9d34"
  cost-workers: "#56949f"
  cost-summarizer: "#286983"
  identity-1: "#907aa9"
  identity-2: "#56949f"
  identity-3: "#286983"
  identity-4: "#ea9d34"
  identity-5: "#d7827e"

syntax:
  keyword: "#286983" # pine
  string: "#ea9d34"
  number: "#d7827e"
  constant: "#d7827e"
  variable: "#575279"
  type: "#56949f"
  function: "#d7827e"
  property: "#56949f"
  operator: "#797593"
  punctuation: "#797593"
  tag: "#56949f"
  meta: "#797593"
  invalid: "#b4637a"
  link: "#907aa9"
  heading: { color: "#907aa9", bold: true }
  inserted: "#286983"
  deleted: "#b4637a"
  emphasis: { italic: true }
  strong: { bold: true }
  quote: { color: "#9893a5", italic: true }
  strikethrough: {}
  comment: { color: "#9893a5", italic: true }

icons:
  # The lighter stroke applies to every glyph.
  stroke:
    weight: 0.85
  geometry:
    find: '<path d="M6.5 2.25 10.75 6.5 6.5 10.75 2.25 6.5Z"/><path d="M9.5 9.5 13.75 13.75"/>'
    goto-line: '<path d="M3 4.25h10"/><path d="M4.5 8h8"/><path d="M6 11.75h5"/>'
    copy: '<rect x="5.75" y="5.75" width="7.75" height="7.75" rx="2"/><path d="M10.25 3.5A1.5 1.5 0 0 0 8.75 2H3.75A1.75 1.75 0 0 0 2 3.75v5A1.5 1.5 0 0 0 3.5 10.25H4"/>'
    check: '<path d="M2.75 8.25 6.5 12 13.25 4.5"/>'
    more: '<path d="M3.4 6.5 4.9 8 3.4 9.5 1.9 8Z"/><path d="M8 6.5 9.5 8 8 9.5 6.5 8Z"/><path d="M12.6 6.5 14.1 8 12.6 9.5 11.1 8Z"/>'
