id: plan_review_readonly
description: Read-only plan review — command in read-only mode on plan paths
command_effects: [read_only]
tools:
  command: sticky
  complete_leg: sticky
  recall: sticky
  record_finding: sticky
  pack_board: sticky
  request_decision: sticky
  request_budget: sticky
  summarize: sticky
  source_history: sticky
  skills_read: sticky
  wait: sticky
  held_result: true
  held_stop: true
deny_tools:
  - write
  - edit
  - replace_lines
  - code_rewrite
  - jq_edit
  - chmod
  - delete
  - chown
  - git_commit
  - git_restore
  - git_checkout
  - git_merge
  - git_stash
  - secret_*
  - delegate_*
  - state_*
  - handoff_*
wait_conditions: [http_ready, port_ready]
