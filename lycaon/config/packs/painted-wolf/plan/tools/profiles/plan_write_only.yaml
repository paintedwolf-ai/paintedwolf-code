id: plan_write_only
description: Plan markdown writes only under plan_write scope
command_effects: [read_only, mutation]
tools:
  summarize: sticky
  command: sticky
  command_output: sticky
  command_stop: sticky
  complete_leg: sticky
  recall: sticky
  record_finding: sticky
  pack_board: sticky
  read_findings: sticky
  read_review: sticky
  request_decision: sticky
  message_coordinator: sticky
  restore_version: sticky
  render_view: sticky
  wait: sticky
  skills_read: sticky
  secret_generate: true
  secret_list: true
  secret_revoke: true
deny_tools:
  - delegate_*
  - plan_from_blueprint
  - state_*
  - handoff_*
write_scope: plan_write
wait_conditions: [process_done, http_ready, port_ready]
