oar: '1.0'
id: SPEC_POSTURE_RESEARCH_REQUIRED
kind: policy
anchor: tool.rejected
requires:
  profiles: [tool]
  facts: [paintedwolf.rejection_code, paintedwolf.next_steps]
when: paintedwolf.rejection_code == "SPEC_POSTURE_RESEARCH_REQUIRED"
effect: block
copy:
  what: Critic tasks are blocked until research is satisfied and you have left research.
  cause: Research still open — finish it before critics
  why: Critic tasks are blocked while research is still open.
  fix: '{{ paintedwolf.next_steps }} On research, leave per Phase exit (host stamps research_satisfied). Continue expand, then approve, on the default path (optional critique returns when that path is available).'
  instead: Finish research → leave research → expand
x-paintedwolf-category: recoverable
x-paintedwolf-emit: rule:spec
x-paintedwolf-message: Research still open — finish it before critics
x-paintedwolf-scenarios:
- id: default
  vars:
    detail: bad args
    path: src/main.go
    profile: coordinator
    tool: task
x-paintedwolf-audience:
- coordinator
