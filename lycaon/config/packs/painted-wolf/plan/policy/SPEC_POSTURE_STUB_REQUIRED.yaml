spec_version: "1.0"
id: SPEC_POSTURE_STUB_REQUIRED
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "SPEC_POSTURE_STUB_REQUIRED"
effect: block
x-paintedwolf-audience:
  - coordinator
x-paintedwolf-category: recoverable
x-paintedwolf-emit: rule:spec
message: Phase 1 plan stub required before starting a plan-writer worker
what: Phase 1 plan stub required before starting a plan-writer worker
cause: Phase 1 plan stub required before starting a plan-writer worker
why: 'Write the Phase 1 blueprint stub at `${overlay_dir}/blueprints/<slug>.md` with frontmatter research_depth and ## Goal, ## Assumptions, ## Approach before starting research tracks'
fix: 'Create the Phase 1 blueprint stub at `${overlay_dir}/blueprints/<slug>.md` with frontmatter research_depth and ## Goal, ## Assumptions, ## Approach using an offered blueprint-writing route'
instead: Complete the Phase 1 blueprint stub before starting research workers
x-paintedwolf-scenarios:
  - id: default
    vars:
      detail: bad args
      path: src/main.go
      profile: coordinator
      tool: task
