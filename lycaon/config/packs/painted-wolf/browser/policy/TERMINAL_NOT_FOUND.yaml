spec_version: "1.0"
id: TERMINAL_NOT_FOUND
kind: schema
on: tool.rejected
selector:
  tools:
    - terminal_send
    - terminal_read
    - terminal_snapshot
    - terminal_close
requires_facts: [paintedwolf.id, paintedwolf.next_steps, paintedwolf.rejection_code, paintedwolf.terminal_not_pty]
when: paintedwolf.rejection_code == "TERMINAL_NOT_FOUND"
effect: block
category: recoverable
emit: guard:terminal_session
message: terminal id is not a live pty handle in this session
what: >-
  {% if paintedwolf.terminal_not_pty %}Handle {{ paintedwolf.id }} belongs to a command, not a terminal.{% else %}No terminal in this session matches id {{ paintedwolf.id }}.{% endif %}
cause: Terminal operations require a terminal id from the same session; closed or reaped ids are no longer available.
why: Driving a missing handle cannot restore the process.
fix: '{% if paintedwolf.terminal_not_pty %}{% else %}Use a terminal id returned in this session. {% endif %}{{ paintedwolf.next_steps }} Inspect any known prior outcome before repeating work.'
instead: Keep command handles and terminal ids on their corresponding tools
scenarios:
  - id: default
    vars:
      id: missing-id
      session_role: implement
      tool: terminal_send
      can_terminal_open: true
