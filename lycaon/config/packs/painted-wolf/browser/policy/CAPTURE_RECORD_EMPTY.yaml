oar: '1.0'
id: CAPTURE_RECORD_EMPTY
kind: schema
anchor: tool.rejected
requires:
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.rejection_reason
  profiles:
  - tool
when: paintedwolf.rejection_code == "CAPTURE_RECORD_EMPTY"
effect: block
copy:
  what: '{{ tool }} recorded no usable frames{% if paintedwolf.rejection_reason %} ({{ paintedwolf.rejection_reason
    }}){% endif %}.'
  cause: The browser painted nothing the recorder could keep, or the page's text could not be sampled for screening,
    so no frame could leave the host.
  why: Every recorded frame is screened for secrets before it is kept; a frame that cannot be screened is not shown.
  fix: Check that the page is loaded and visible with page_snapshot, then record the drive again.
  instead: Branch on Code CAPTURE_RECORD_EMPTY; confirm the page renders, then retry the recording
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:visual_capture
x-paintedwolf-message: A timeline recording kept no frames
x-paintedwolf-scenarios:
- id: default
  vars:
    tool: page_act
  expect_contains:
  - 'Rejected:'
  - 'Code: CAPTURE_RECORD_EMPTY'
