spec_version: "1.0"
id: CAPTURE_RECORD_EMPTY
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.next_steps, paintedwolf.rejection_code, paintedwolf.rejection_reason]
when: paintedwolf.rejection_code == "CAPTURE_RECORD_EMPTY"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:visual_capture
message: A timeline recording kept no frames
what: '{{ tool }} recorded no usable frames{% if paintedwolf.rejection_reason %} ({{ paintedwolf.rejection_reason }}){% endif %}.'
cause: The browser painted nothing the recorder could keep, or the page's text could not be sampled for screening, so no frame could leave the host.
why: Every recorded frame is screened for secrets before it is kept; a frame that cannot be screened is not shown.
fix: '{{ paintedwolf.next_steps }} Then record the drive again.'
instead: Branch on Code CAPTURE_RECORD_EMPTY; confirm the page renders, then retry the recording
x-paintedwolf-scenarios:
  - id: default
    vars:
      tool: page_act
