oar: '1.0'
id: PAGE_NOT_FOUND
kind: schema
anchor: tool.rejected
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.id
when: paintedwolf.rejection_code == "PAGE_NOT_FOUND"
effect: block
copy:
  what: No live page matches id {{ paintedwolf.id }} (closed, reaped, or never opened).
  cause: Page handles are session-scoped and reaped on idle timeout, page_close, or session end.
  why: Driving a missing handle cannot restore cookies or DOM state.
  fix: Use an observed page ID only if it belongs to the intended target in this session. If a new page is
    needed, an offered page_open starts new state; it does not restore the missing DOM or cookies. Do not substitute
    an unrelated live page.
  instead: Recover the intended target and account for missing page state
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:visual_page_session
x-paintedwolf-message: page id is not a live held page in this session
x-paintedwolf-scenarios:
- id: default
  vars:
    id: missing-id
    profile: implement
    tool: page_act
  expect_contains:
  - 'Rejected:'
  - 'Code: PAGE_NOT_FOUND'
  - page_open
