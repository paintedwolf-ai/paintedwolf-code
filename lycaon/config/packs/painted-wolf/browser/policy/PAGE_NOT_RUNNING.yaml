spec_version: "1.0"
id: PAGE_NOT_RUNNING
kind: schema
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.id, paintedwolf.next_steps, paintedwolf.not_running, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "PAGE_NOT_RUNNING"
effect: block
category: recoverable
emit: guard:visual_page_session
message: page id exists but the CDP page is no longer running
what: Page {{ paintedwolf.id }} was closed or the browser target ended.
cause: The registry entry no longer has a usable browser page.
why: Act/snapshot need a live CDP target.
fix: '{{ paintedwolf.next_steps }} Opening a replacement does not restore the prior DOM, cookies, or completed interactions.'
instead: Recover the intended page explicitly and preserve state uncertainty
scenarios:
  - id: default
    vars:
      id: dead-id
      session_role: implement
      tool: page_act
