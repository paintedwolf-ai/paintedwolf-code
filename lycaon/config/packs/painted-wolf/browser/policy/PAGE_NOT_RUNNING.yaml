oar: '1.0'
id: PAGE_NOT_RUNNING
kind: schema
anchor: tool.rejected
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.id
  - paintedwolf.not_running
when: paintedwolf.rejection_code == "PAGE_NOT_RUNNING"
effect: block
copy:
  what: Page {{ paintedwolf.id }} was closed or the browser target ended.
  cause: The registry entry no longer has a usable browser page.
  why: Act/snapshot need a live CDP target.
  fix: If an offered page_open can establish the intended target, continue on its returned ID after recreating
    required state. Opening a replacement does not restore the prior DOM, cookies, or completed interactions.
  instead: Recover the intended page explicitly and preserve state uncertainty
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:visual_page_session
x-paintedwolf-message: page id exists but the CDP page is no longer running
x-paintedwolf-scenarios:
- id: default
  vars:
    id: dead-id
    profile: implement
    tool: page_act
  expect_contains:
  - 'Rejected:'
  - 'Code: PAGE_NOT_RUNNING'
  - page_open
