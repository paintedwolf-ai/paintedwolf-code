oar: '1.0'
id: CAPTURE_PROJECT_DIR_MISSING
kind: schema
anchor: tool.rejected
requires:
  profiles:
  - tool
  facts:
  - paintedwolf.rejection_code
  - paintedwolf.missing
  - paintedwolf.path
when: paintedwolf.rejection_code == "CAPTURE_PROJECT_DIR_MISSING"
effect: block
copy:
  what: The host could not access a directory for project_dir {{ paintedwolf.path }}.
  cause: No attached root or accessible directory was available at the requested path.
  why: Static serve requires a real project-relative directory tree.
  fix: Use an existing directory in an attached project root containing the page to open. If no root is attached,
    the user must attach one; do not create a substitute tree merely to clear this refusal.
  instead: Branch on Code CAPTURE_PROJECT_DIR_MISSING; fix project_dir
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:visual_capture
x-paintedwolf-message: capture_page project_dir is missing or not a directory
x-paintedwolf-scenarios:
- id: default
  vars:
    detail: bad args
    path: src/main.go
    profile: coordinator
    tool: capture_page
  expect_contains:
  - 'Rejected:'
  - 'Code: CAPTURE_PROJECT_DIR_MISSING'
