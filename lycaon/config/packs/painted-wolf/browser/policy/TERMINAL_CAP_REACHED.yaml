spec_version: "1.0"
id: TERMINAL_CAP_REACHED
kind: schema
on: tool.rejected
selector:
  tools:
    - terminal_open
requires_facts: [paintedwolf.background_limit, paintedwolf.live_command_handles, paintedwolf.live_terminal_ids, paintedwolf.next_steps, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "TERMINAL_CAP_REACHED"
effect: block
x-paintedwolf-category: recoverable
x-paintedwolf-emit: guard:terminal_session
message: session pty/background process cap reached
what: 'This session has reached its limit of {{ paintedwolf.background_limit }} live background processes, including terminals.'
cause: 'At admission, terminal ids were {{ paintedwolf.live_terminal_ids }} and command handles were {{ paintedwolf.live_command_handles }}.'
why: The shared session limit bounds long-running processes and their retained output.
fix: 'Wait for existing work to finish, or stop only work that is no longer needed. {{ paintedwolf.next_steps }} A process may have completed since this snapshot; preserve useful running work.'
instead: Retry the requested start only after capacity is available; this refused start created no process
x-paintedwolf-scenarios:
  - id: default
    vars:
      profile: implement
      reason: cap_reached
      background_limit: 4
      live_terminal_ids: [running-terminal]
      can_terminal_close: true
      tool: terminal_open
