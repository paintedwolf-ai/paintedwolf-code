spec_version: "1.0"
id: BROWSER_ENGINE_UNAVAILABLE
kind: policy
on: tool.rejected
selector: {}
requires_facts: [paintedwolf.rejection_code, paintedwolf.rejection_reason]
when: paintedwolf.rejection_code == "BROWSER_ENGINE_UNAVAILABLE"
effect: block
category: recoverable
emit: guard:visual_browser
message: The installed browser is unavailable
what: The host's bundled browser is unavailable for {{ tool }}.
cause: Browser setup could not find a usable installed binary{% if paintedwolf.rejection_reason %} ({{ paintedwolf.rejection_reason }}){% endif %}.
why: Visual tools require the host-managed browser and its resources before a page can be opened.
fix: The user or host must repair the browser installation; development setup may provision it through the supported browser setup task. Retrying arguments or switching visual tools cannot supply a missing browser. Preserve the requested visual validation as unfinished.
instead: Report the missing browser prerequisite without claiming the page was tested or starting an unrelated server.
scenarios:
  - id: missing_browser
    vars:
      tool: page_open
      reason: no_bundled_browser
