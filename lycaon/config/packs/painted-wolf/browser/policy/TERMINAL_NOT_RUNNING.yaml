spec_version: "1.0"
id: TERMINAL_NOT_RUNNING
kind: schema
on: tool.rejected
selector:
  tools:
    - terminal_send
requires_facts: [paintedwolf.id, paintedwolf.next_steps, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "TERMINAL_NOT_RUNNING"
effect: block
category: recoverable
emit: guard:terminal_session
message: terminal process is not running
what: Pty handle {{ paintedwolf.id }} has already exited.
cause: The process finished or was killed before input could be sent.
why: Writing to an exited pty cannot continue the session.
fix: '{{ paintedwolf.next_steps }}'
instead: Preserve the exited process outcome before deciding whether another process is needed
scenarios:
  - id: default
    vars:
      id: dead-id
      profile: implement
      tool: terminal_send
      can_terminal_read: true
      can_terminal_open: true
