spec_version: "1.0"
id: PAGE_ID_REQUIRED
kind: schema
on: tool.rejected
selector:
  tools:
    - page_act
    - page_snapshot
    - page_close
requires_facts: [paintedwolf.id_required, paintedwolf.rejection_code]
when: paintedwolf.rejection_code == "PAGE_ID_REQUIRED"
effect: block
category: recoverable
emit: guard:visual_page_session
message: page tool requires a non-empty id from page_open
what: id was missing or empty.
cause: page_act / page_snapshot / page_close address a held page by id.
why: Without an id the host cannot select which live page to drive.
fix: Pass id from a prior page_open result.
instead: Branch on Code PAGE_ID_REQUIRED; pass id from page_open
scenarios:
  - id: default
    vars:
      profile: implement
      tool: page_act
