<div style="font-family:'Inter',system-ui,sans-serif; padding:24px; background:var(--kit-bg); display:flex; justify-content:center;">
  <div style="display:inline-flex; align-items:center; gap:6px; padding:6px 10px; background:var(--kit-surface); border:1px solid var(--kit-border); border-radius:12px; box-shadow:0 12px 32px -8px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.08); backdrop-filter:blur(16px);">
    <div style="display:flex; align-items:center; gap:6px; padding:4px 8px; background:var(--kit-bg); border:1px solid var(--kit-border); border-radius:6px; color:var(--kit-fg); font-size:12px; font-weight:600;">
      <span style="display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--kit-accent);"></span>
      <span>3 selected</span>
    </div>

    <div style="width:1px; height:18px; background:var(--kit-border); margin:0 4px;" aria-hidden="true"></div>

    <button style="display:inline-flex; align-items:center; gap:6px; padding:5px 10px; background:transparent; color:var(--kit-fg); border:1px solid transparent; border-radius:6px; font-size:12px; font-weight:500; cursor:pointer;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
      <span>Complete</span>
      <kbd style="background:var(--kit-bg); color:var(--kit-muted); border:1px solid var(--kit-border); border-radius:3px; padding:1px 4px; font-size:10px; font-family:'JetBrains Mono',monospace;">C</kbd>
    </button>

    <button style="display:inline-flex; align-items:center; gap:6px; padding:5px 10px; background:transparent; color:var(--kit-fg); border:1px solid transparent; border-radius:6px; font-size:12px; font-weight:500; cursor:pointer;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
      <span>Move</span>
      <kbd style="background:var(--kit-bg); color:var(--kit-muted); border:1px solid var(--kit-border); border-radius:3px; padding:1px 4px; font-size:10px; font-family:'JetBrains Mono',monospace;">M</kbd>
    </button>

    <button style="display:inline-flex; align-items:center; gap:6px; padding:5px 10px; background:transparent; color:var(--kit-fg); border:1px solid transparent; border-radius:6px; font-size:12px; font-weight:500; cursor:pointer;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/>
        <line x1="7" y1="7" x2="7.01" y2="7"/>
      </svg>
      <span>Tag</span>
    </button>

    <div style="width:1px; height:18px; background:var(--kit-border); margin:0 4px;" aria-hidden="true"></div>

    <button style="display:inline-flex; align-items:center; gap:6px; padding:5px 10px; background:transparent; color:#f87171; border:1px solid transparent; border-radius:6px; font-size:12px; font-weight:500; cursor:pointer;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      </svg>
      <span>Delete</span>
      <kbd style="background:var(--kit-bg); color:var(--kit-muted); border:1px solid var(--kit-border); border-radius:3px; padding:1px 4px; font-size:10px; font-family:'JetBrains Mono',monospace;">⌫</kbd>
    </button>
  </div>
</div>
