<div style="font-family:'Inter',system-ui,sans-serif; padding:20px; background:var(--kit-bg); display:flex; justify-content:center;">
  <aside role="status" aria-live="polite" style="width:360px; background:var(--kit-surface); border:1px solid var(--kit-border); border-left:3px solid var(--kit-accent); border-radius:8px; padding:12px 14px; box-shadow:0 10px 25px -5px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.06); display:flex; align-items:flex-start; gap:10px;">
    <div style="color:var(--kit-accent); margin-top:1px;" aria-hidden="true">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
    </div>

    <div style="flex-grow:1; display:flex; flex-direction:column; gap:2px;">
      <div style="font-size:12px; font-weight:600; color:var(--kit-fg);">Changes published successfully</div>
      <div style="font-size:11px; color:var(--kit-muted); line-height:1.4;">Deployment rev-91c2 is live on edge workers.</div>
    </div>

    <div style="display:flex; align-items:center; gap:8px;">
      <button style="background:transparent; border:none; color:var(--kit-accent); font-size:11px; font-weight:600; cursor:pointer; padding:2px 4px;">
        View
      </button>
      <button aria-label="Dismiss notification" style="background:transparent; border:none; color:var(--kit-muted); cursor:pointer; padding:2px; display:inline-flex; align-items:center; justify-content:center;">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
  </aside>
</div>
