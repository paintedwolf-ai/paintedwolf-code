<div style="font-family:'Inter',system-ui,sans-serif; padding:20px; background:var(--kit-bg); display:flex; justify-content:center;">
  <article style="width:280px; background:var(--kit-surface); border:1px solid var(--kit-border); border-radius:12px; padding:16px; box-shadow:0 4px 16px -4px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.08); display:flex; flex-direction:column; gap:12px;">
    <header style="display:flex; align-items:center; justify-content:space-between;">
      <span style="font-size:12px; font-weight:500; color:var(--kit-muted);">Active Subscriptions</span>
      <button style="width:20px; height:20px; display:inline-flex; align-items:center; justify-content:center; background:transparent; border:none; color:var(--kit-muted); cursor:pointer;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
      </button>
    </header>

    <div style="display:flex; align-items:baseline; justify-content:space-between;">
      <span style="font-size:28px; font-weight:700; color:var(--kit-fg); font-variant-numeric:tabular-nums; letter-spacing:-0.02em;">
        2,845
      </span>
      <span style="display:inline-flex; align-items:center; gap:3px; padding:2px 6px; border-radius:9999px; background:rgba(34,197,94,0.12); color:#4ade80; border:1px solid rgba(34,197,94,0.24); font-size:11px; font-weight:600;">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>
        +14.2%
      </span>
    </div>

    <footer style="display:flex; align-items:center; gap:6px; font-size:11px; color:var(--kit-muted); padding-top:4px; border-top:1px solid var(--kit-border);">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
      <span>vs. 2,491 last month</span>
    </footer>
  </article>
</div>
