<div class="kit-surface" style="width:100%; max-width:560px; border-radius:12px; border:1px solid var(--kit-border); overflow:hidden; font-family:'Inter'; box-shadow:0 24px 48px -12px rgba(0,0,0,0.35); backdrop-filter:blur(16px)">
  <div style="display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--kit-border); background:var(--kit-bg)">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--kit-muted); flex-shrink:0">
      <circle cx="11" cy="11" r="8"/>
      <path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" placeholder="Type a command or search..." readonly value="Design icon set" style="flex-grow:1; background:transparent; border:none; outline:none; color:var(--kit-fg); font-size:var(--kit-text-base); font-family:inherit"/>
    <kbd style="background:var(--kit-surface); color:var(--kit-muted); border:1px solid var(--kit-border); border-radius:4px; padding:2px 6px; font-size:11px; font-family:'JetBrains Mono'">ESC</kbd>
  </div>
  <div style="padding:8px; display:flex; flex-direction:column; gap:4px; background:var(--kit-surface)">
    <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-radius:6px; background:var(--kit-accent); color:var(--kit-accent-fg)">
      <div style="display:flex; align-items:center; gap:10px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
        </svg>
        <span style="font-size:var(--kit-text-sm); font-weight:500">Design icon set with visual loop</span>
      </div>
      <kbd style="border:1px solid rgba(255,255,255,0.3); border-radius:4px; padding:1px 6px; font-size:10px; font-family:'JetBrains Mono'">↵</kbd>
    </div>
    <div style="display:flex; align-items:center; justify-content:space-between; padding:8px 12px; border-radius:6px; color:var(--kit-fg)">
      <div style="display:flex; align-items:center; gap:10px">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:var(--kit-muted)">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          <line x1="9" y1="3" x2="9" y2="21"/>
        </svg>
        <span style="font-size:var(--kit-text-sm)">Toggle inspector sidebar</span>
      </div>
      <kbd style="color:var(--kit-muted); font-size:10px; font-family:'JetBrains Mono'">⌘B</kbd>
    </div>
  </div>
</div>
