rules:
- id: lycaon.php.command-injection
  languages:
  - php
  severity: ERROR
  message: Request input reaches a shell command
  metadata:
    category: security
    cwe: CWE-78
    confidence: HIGH
    technology:
    - php
  mode: taint
  pattern-sources:
  - pattern: $_GET[...]
    exact: true
  - pattern: $_POST[...]
    exact: true
  - pattern: $_REQUEST[...]
    exact: true
  - pattern: $_COOKIE[...]
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: system($CMD)
    - focus-metavariable: $CMD
  - patterns:
    - pattern: exec($CMD)
    - focus-metavariable: $CMD
  - patterns:
    - pattern: shell_exec($CMD)
    - focus-metavariable: $CMD
  - patterns:
    - pattern: passthru($CMD)
    - focus-metavariable: $CMD
  pattern-sanitizers:
  - patterns:
    - pattern: escapeshellarg(...)
    - pattern-not-inside: trim(escapeshellarg(...), "'")
    exact: true
- id: lycaon.php.sql-injection
  languages:
  - php
  severity: ERROR
  message: Request input reaches SQL text; bind query parameters
  metadata:
    category: security
    cwe: CWE-89
    confidence: HIGH
    technology:
    - php
  mode: taint
  pattern-sources:
  - pattern: $_GET[...]
    exact: true
  - pattern: $_POST[...]
    exact: true
  - pattern: $_REQUEST[...]
    exact: true
  - pattern: $_COOKIE[...]
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: $DB->query($SQL)
    - focus-metavariable: $SQL
  - patterns:
    - pattern: $DB->exec($SQL)
    - focus-metavariable: $SQL
  - patterns:
    - pattern: mysqli_query($DB,$SQL)
    - focus-metavariable: $SQL
  pattern-sanitizers:
  - pattern: intval(...)
    exact: true
  - pattern: floatval(...)
    exact: true
  - pattern: (int) $VALUE
    exact: true
  - pattern: (float) $VALUE
    exact: true
