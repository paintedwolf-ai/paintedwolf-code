    - '*.mli'
- id: lycaon.coverage.scheme
  languages:
  - generic
  severity: INFO
  message: Internal target selection for scheme
  metadata:
    purpose: coverage
    technology:
    - scheme
  pattern-regex: (?s)\A.
  paths:
