    - '*.scm'
    - '*.ss'
- id: lycaon.coverage.html
  languages:
  - generic
  severity: INFO
  message: Internal target selection for html
  metadata:
    purpose: coverage
    technology:
    - html
  pattern-regex: (?s)\A.
