rules:
- id: lycaon.coverage.ql
  languages:
  - generic
  severity: INFO
  message: CodeQL queries are analysis definitions; no context-free security vulnerability rule is claimed.
  metadata:
    purpose: coverage
    technology:
    - ql
  pattern-regex: (?s)\A.
  paths:
    include:
    - '*.ql'
- id: lycaon.coverage.promql
  languages:
  - generic
  severity: INFO
  message: Tenant isolation and monitoring correctness depend on deployment policy; ordinary selectors are not security
    findings.
  metadata:
    purpose: coverage
    technology:
    - promql
  pattern-regex: (?s)\A.
  paths:
    include:
    - '*.promql'
- id: lycaon.coverage.proto
  languages:
  - generic
  severity: INFO
  message: Authorization and transport security belong to service implementations and deployment; schema compatibility
    is not a security finding.
  metadata:
    purpose: coverage
    technology:
    - proto
  pattern-regex: (?s)\A.
  paths:
    include:
    - '*.proto'
- id: lycaon.coverage.clojure
  languages:
  - generic
  severity: INFO
  message: Internal target selection for clojure
  metadata:
    purpose: coverage
    technology:
    - clojure
  pattern-regex: (?s)\A.
  paths:
    include:
    - '*.clj'
    - '*.cljs'
    - '*.cljc'
    - '*.edn'
- id: lycaon.coverage.commonlisp
  languages:
  - generic
  severity: INFO
