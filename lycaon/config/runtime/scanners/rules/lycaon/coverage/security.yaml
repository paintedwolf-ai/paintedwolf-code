    purpose: coverage
    technology:
    - commonlisp
  pattern-regex: (?s)\A.
  paths:
    include:
    - '*.cl'
    - '*.lisp'
    - '*.lsp'
- id: lycaon.coverage.ocaml
  languages:
  - generic
  severity: INFO
