  options:
    taint_assume_safe_numbers: true
- id: lycaon.java.open-redirect
  languages:
  - java
  severity: ERROR
  message: Request input controls a redirect destination
  metadata:
    category: security
    cwe: CWE-601
    confidence: HIGH
    technology:
    - java
  mode: taint
  pattern-sources:
  - pattern: $REQ.getParameter(...)
    exact: true
  - pattern: $REQ.getHeader(...)
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: $RES.sendRedirect($URL)
    - focus-metavariable: $URL
- id: lycaon.java.weak-cipher
  languages:
  - java
  severity: ERROR
  message: DES encryption is cryptographically broken
  metadata:
    category: security
    cwe: CWE-327
    confidence: HIGH
    technology:
    - java
  pattern-either:
  - pattern: Cipher.getInstance("DES")
  - pattern: Cipher.getInstance("DES/ECB/PKCS5Padding")
- id: lycaon.java.ecb-encryption
  languages:
  - java
  severity: ERROR
  message: ECB encryption reveals repeated plaintext blocks
  metadata:
    category: security
    cwe: CWE-327
    confidence: HIGH
    technology:
    - java
  pattern-either:
  - pattern: Cipher.getInstance("AES/ECB/PKCS5Padding")
  - pattern: Cipher.getInstance("AES/ECB/NoPadding")
- id: lycaon.java.rsa-without-padding
  languages:
  - java
  severity: ERROR
  message: RSA encryption explicitly omits cryptographic padding
  metadata:
    category: security
    cwe: CWE-780
    confidence: HIGH
    technology:
    - java
  pattern: Cipher.getInstance("RSA/ECB/NoPadding")
- id: lycaon.java.trust-manager-empty-check
  languages:
  - java
  severity: ERROR
  message: The TLS trust manager accepts server certificates without checking them
  metadata:
    category: security
    cwe: CWE-295
    confidence: HIGH
    technology:
    - java
  pattern: class $CLASS implements X509TrustManager { ... public void checkServerTrusted(...)
    { } ... }
- id: lycaon.java.hostname-verifier-accept-all
  languages:
  - java
  severity: ERROR
  message: The TLS hostname verifier unconditionally accepts the peer hostname
  metadata:
    category: security
    cwe: CWE-295
    confidence: HIGH
    technology:
    - java
  pattern: $CONNECTION.setHostnameVerifier(($HOST,$SESSION) -> true)
- id: lycaon.java.ldap-injection
  languages:
  - java
  severity: ERROR
  message: Request input reaches an LDAP search filter; bind filter arguments
  metadata:
    category: security
    cwe: CWE-90
    confidence: HIGH
    technology:
    - java
  mode: taint
  pattern-sources:
  - pattern: $REQ.getParameter(...)
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: (javax.naming.directory.DirContext $CTX).search($BASE,$FILTER,...)
    - focus-metavariable: $FILTER
