- id: lycaon.kotlin.open-redirect
  languages:
  - kotlin
  severity: ERROR
  message: Request input controls a redirect destination
  metadata:
    category: security
    cwe: CWE-601
    confidence: HIGH
    technology:
    - kotlin
  mode: taint
  pattern-sources:
  - pattern: $REQ.getParameter(...)
    exact: true
  - pattern: $REQ.getHeader(...)
    exact: true
  pattern-sinks:
  - patterns:
    - pattern: $RES.sendRedirect($URL)
    - focus-metavariable: $URL
- id: lycaon.kotlin.weak-cipher
  languages:
  - kotlin
  severity: ERROR
  message: DES encryption is cryptographically broken
  metadata:
    category: security
    cwe: CWE-327
    confidence: HIGH
    technology:
    - kotlin
  pattern-either:
  - pattern: Cipher.getInstance("DES")
  - pattern: Cipher.getInstance("DES/ECB/PKCS5Padding")
- id: lycaon.kotlin.ecb-encryption
  languages:
  - kotlin
  severity: ERROR
  message: ECB encryption reveals repeated plaintext blocks
  metadata:
    category: security
    cwe: CWE-327
    confidence: HIGH
    technology:
    - kotlin
  pattern-either:
  - pattern: Cipher.getInstance("AES/ECB/PKCS5Padding")
  - pattern: Cipher.getInstance("AES/ECB/NoPadding")
- id: lycaon.kotlin.rsa-without-padding
  languages:
  - kotlin
  severity: ERROR
  message: RSA encryption explicitly omits cryptographic padding
  metadata:
    category: security
    cwe: CWE-780
    confidence: HIGH
    technology:
    - kotlin
  pattern: Cipher.getInstance("RSA/ECB/NoPadding")
