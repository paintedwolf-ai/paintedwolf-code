          '
      - pattern: 'fun $M(..., @org.springframework.web.bind.annotation.ModelAttribute(...)
          $V: $T, ...) = ...

          '
    - pattern-not: 'fun $M(..., @org.springframework.web.bind.annotation.ModelAttribute(...,
        binding=false, ...) $V: $T, ...) { ... }

        '
    - pattern-not: 'fun $M(..., @org.springframework.web.bind.annotation.ModelAttribute(...,
        binding=false, ...) $V: $T, ...) = ...

        '
    - focus-metavariable: $V
  - patterns:
    - pattern-either:
      - pattern: 'fun $M(..., @org.springframework.web.bind.annotation.MatrixVariable(...)
          $V: $T, ...) { ... }

          '
      - pattern: 'fun $M(..., @org.springframework.web.bind.annotation.MatrixVariable(...)
          $V: $T, ...) = ...

          '
    - focus-metavariable: $V
  pattern-sinks:
  - patterns:
    - pattern: Runtime.getRuntime().exec($CMD)
    - metavariable-pattern:
        metavariable: $CMD
        patterns:
        - pattern-not: arrayOf($PROGRAM, ...)
    - focus-metavariable: $CMD
  - patterns:
    - pattern: ProcessBuilder("sh","-c",$CMD)
    - focus-metavariable: $CMD
  - patterns:
    - pattern: Runtime.getRuntime().exec(arrayOf($PROGRAM, ...))
    - focus-metavariable: $PROGRAM
  options:
    taint_assume_safe_numbers: true
