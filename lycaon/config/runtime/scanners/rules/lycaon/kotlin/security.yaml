rules:
- id: lycaon.kotlin.sql-injection
  languages:
  - kotlin
  severity: ERROR
  message: Request input reaches SQL text; use bound parameters
  metadata:
    category: security
    cwe: CWE-89
    confidence: HIGH
    technology:
    - kotlin
  mode: taint
  pattern-sources:
  - pattern: $REQ.getParameter(...)
    exact: true
  - pattern: $REQ.getHeader(...)
    exact: true
  - patterns:
    - pattern-either:
      - pattern: 'fun $M(..., @org.springframework.web.bind.annotation.RequestParam(...)
          $V: $T, ...) { ... }

          '
      - pattern: 'fun $M(..., @org.springframework.web.bind.annotation.RequestParam(...)
          $V: $T, ...) = ...

          '
    - focus-metavariable: $V
  - patterns:
    - pattern-either:
      - pattern: 'fun $M(..., @org.springframework.web.bind.annotation.PathVariable(...)
          $V: $T, ...) { ... }

          '
      - pattern: 'fun $M(..., @org.springframework.web.bind.annotation.PathVariable(...)
          $V: $T, ...) = ...

          '
    - focus-metavariable: $V
  - patterns:
    - pattern-either:
      - pattern: 'fun $M(..., @org.springframework.web.bind.annotation.RequestHeader(...)
          $V: $T, ...) { ... }

          '
      - pattern: 'fun $M(..., @org.springframework.web.bind.annotation.RequestHeader(...)
          $V: $T, ...) = ...

          '
    - focus-metavariable: $V
  - patterns:
    - pattern-either:
      - pattern: 'fun $M(..., @org.springframework.web.bind.annotation.RequestBody(...)
          $V: $T, ...) { ... }

          '
      - pattern: 'fun $M(..., @org.springframework.web.bind.annotation.RequestBody(...)
          $V: $T, ...) = ...

          '
    - focus-metavariable: $V
  - patterns:
    - pattern-either:
      - pattern: 'fun $M(..., @org.springframework.web.bind.annotation.CookieValue(...)
          $V: $T, ...) { ... }

          '
      - pattern: 'fun $M(..., @org.springframework.web.bind.annotation.CookieValue(...)
          $V: $T, ...) = ...

          '
    - focus-metavariable: $V
  - patterns:
    - pattern-either:
      - pattern: 'fun $M(..., @org.springframework.web.bind.annotation.RequestPart(...)
          $V: $T, ...) { ... }

          '
      - pattern: 'fun $M(..., @org.springframework.web.bind.annotation.RequestPart(...)
          $V: $T, ...) = ...

          '
    - focus-metavariable: $V
  - patterns:
    - pattern-either:
      - pattern: 'fun $M(..., @org.springframework.web.bind.annotation.ModelAttribute(...)
          $V: $T, ...) { ... }

          '
      - pattern: 'fun $M(..., @org.springframework.web.bind.annotation.ModelAttribute(...)
          $V: $T, ...) = ...

          '
    - pattern-not: 'fun $M(..., @org.springframework.web.bind.annotation.ModelAttribute(...,
        binding=false, ...) $V: $T, ...) { ... }

        '
    - pattern-not: 'fun $M(..., @org.springframework.web.bind.annotation.ModelAttribute(...,
        binding=false, ...) $V: $T, ...) = ...

        '
    - focus-metavariable: $V
  - patterns:
    - pattern-either:
      - pattern: 'fun $M(..., @org.springframework.web.bind.annotation.MatrixVariable(...)
          $V: $T, ...) { ... }

          '
      - pattern: 'fun $M(..., @org.springframework.web.bind.annotation.MatrixVariable(...)
          $V: $T, ...) = ...

          '
    - focus-metavariable: $V
  pattern-sinks:
  - patterns:
    - pattern: $STMT.executeQuery($SQL)
    - focus-metavariable: $SQL
  - patterns:
    - pattern: $STMT.executeUpdate($SQL)
    - focus-metavariable: $SQL
  - patterns:
    - pattern: $CONN.prepareStatement($SQL)
    - focus-metavariable: $SQL
  options:
    taint_assume_safe_numbers: true
