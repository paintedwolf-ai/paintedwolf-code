- id: lycaon.ruby.tls-verification-disabled
  languages:
  - ruby
  severity: ERROR
  message: TLS certificate verification is disabled
  metadata:
    category: security
    cwe: CWE-295
    confidence: HIGH
    technology:
    - ruby
  pattern: $CLIENT.verify_mode = OpenSSL::SSL::VERIFY_NONE
