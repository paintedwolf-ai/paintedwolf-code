      exact: true
      to-parameter:
        index: 0
        path: []
        arities:
        - 0
        - 1
        - 2
        - 3
      label: HTTP_APP
      model-type: fastify.app
      where:
      - metavariable: $WRAP
        module: fastify-plugin
      - focus: $PLUGIN
    - all:
      - pattern: 'export const $PLUGIN: $TYPE = async ($APP, ...) => { ... };'
      exact: true
      label: HTTP_APP
      model-type: fastify.app
      where:
      - metavariable: $TYPE
        module: fastify
        symbol:
        - FastifyPluginAsync
      - focus: $APP
