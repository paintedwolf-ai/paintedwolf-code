  - typescript
  severity: ERROR
  message: Request input selects a server-side HTTP destination
  metadata:
    category: security
    cwe: CWE-918
    confidence: HIGH
    technology:
    - javascript
  mode: taint
  taint:
    sources: *id001
    sinks:
    - all:
      - pattern: fetch($URL, ...)
      - not:
          pattern: fetch(`$PREFIX${...}...`, ...)
          where:
          - metavariable: $PREFIX
            regex: ^https?://[A-Za-z0-9.-]+(?::[0-9]+)?/
      - not:
          pattern: fetch("$PREFIX" + $REST, ...)
          where:
          - metavariable: $PREFIX
            regex: ^https?://[A-Za-z0-9.-]+(?::[0-9]+)?/
      - not:
          all:
          - pattern: fetch($URL, ...)
          - inside: const $URL = `$PREFIX${...}...`; ...
