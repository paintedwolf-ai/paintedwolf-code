        metavariable: $APP
        type: fastify.app
        member: register
      exact: true
      to-parameter:
        index: 0
        path: []
        arities:
        - 0
        - 1
        - 2
        - 3
      label: HTTP_APP
      model-type: fastify.app
      where:
      - focus: $PLUGIN
