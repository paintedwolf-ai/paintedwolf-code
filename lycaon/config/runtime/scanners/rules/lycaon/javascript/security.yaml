rules:
- id: lycaon.javascript.command-injection
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: Request input reaches a shell command; use execFile with separate arguments
  metadata:
    category: security
    cwe: CWE-78
    confidence: HIGH
    technology:
    - javascript
  mode: taint
  taint:
    sources: &id001
    - all:
      - inside: import $FACTORY from "express"; ...
      - pattern: $FACTORY(...)
      exact: true
      label: HTTP_APP
      model-type: express.app
      where:
      - metavariable: $FACTORY
        module: express
    - all:
      - inside: import {Router as $FACTORY} from "express"; ...
      - pattern: $FACTORY(...)
      exact: true
      label: HTTP_APP
      model-type: express.app
      where:
      - metavariable: $FACTORY
        module: express
    - all:
      - inside: import * as $MODULE from "express"; ...
      - pattern: $MODULE.Router(...)
      exact: true
      label: HTTP_APP
      model-type: express.app
      where:
      - metavariable: $MODULE
        module: express
    - all:
      - pattern: $FACTORY = require("express")
      exact: true
      by-side-effect: true
      label: HTTP_FACTORY
      model-type: express.factory
      where:
      - metavariable: $FACTORY
        module: express
      - focus: $FACTORY
    - all:
      - pattern: 'const {Router: $FACTORY} = require("express");'
      exact: true
      by-side-effect: true
      label: HTTP_FACTORY
      model-type: express.factory
      where:
      - metavariable: $FACTORY
        module: express
      - focus: $FACTORY
    - all:
      - pattern: $FACTORY(...)
      exact: true
      requires: HTTP_FACTORY
      label: HTTP_APP
      model-type: express.app
      requires-model-type:
        metavariable: $FACTORY
        type: express.factory
    - all:
      - pattern: $FACTORY.Router(...)
      exact: true
      requires: HTTP_FACTORY
      label: HTTP_APP
      model-type: express.app
      requires-model-type:
        metavariable: $FACTORY
        type: express.factory
        member: Router
    - all:
      - inside: import $FACTORY from "fastify"; ...
      - pattern: $FACTORY(...)
      exact: true
      label: HTTP_APP
      model-type: fastify.app
      where:
      - metavariable: $FACTORY
        module: fastify
    - all:
      - inside: import {fastify as $FACTORY} from "fastify"; ...
