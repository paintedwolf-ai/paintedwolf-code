      - pattern: 'const $PLUGIN: $TYPE = ($APP, ...) => { ... };'
      exact: true
      label: HTTP_APP
      model-type: fastify.app
      where:
      - metavariable: $TYPE
        module: fastify
        symbol:
        - FastifyPluginAsync
      - focus: $APP
    - all:
