      - pattern: $BUILDER.danger_accept_invalid_hostnames(...)
      - pattern: $BUILDER.default_headers(...)
      - pattern: $BUILDER.deflate(...)
      - pattern: $BUILDER.dns_resolver(...)
      - pattern: $BUILDER.gzip(...)
      - pattern: $BUILDER.hickory_dns(...)
      - pattern: $BUILDER.http09_responses(...)
      - pattern: $BUILDER.http1_allow_obsolete_multiline_headers_in_responses(...)
      - pattern: $BUILDER.http1_allow_spaces_after_header_name_in_responses(...)
      - pattern: $BUILDER.http1_ignore_invalid_headers_in_responses(...)
      - pattern: $BUILDER.http1_only(...)
      - pattern: $BUILDER.http1_title_case_headers(...)
      - pattern: $BUILDER.http2_adaptive_window(...)
      - pattern: $BUILDER.http2_initial_connection_window_size(...)
      - pattern: $BUILDER.http2_initial_stream_window_size(...)
      - pattern: $BUILDER.http2_keep_alive_interval(...)
