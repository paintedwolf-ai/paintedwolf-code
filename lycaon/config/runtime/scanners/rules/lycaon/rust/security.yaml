rules:
- id: lycaon.rust.tls-verification-disabled
  languages:
  - rust
  severity: ERROR
  message: TLS peer verification is disabled
  metadata:
    category: security
    cwe: CWE-295
    confidence: HIGH
    technology:
    - rust
    references:
    - https://docs.rs/reqwest/latest/reqwest/struct.ClientBuilder.html
    - https://docs.rs/reqwest/latest/reqwest/blocking/struct.ClientBuilder.html
    notes: Requires imported reqwest builder types or Client::builder and ClientBuilder::new factories.
      Models the documented fluent APIs separately for asynchronous and blocking builders, including
      current TLS-prefixed methods. Borrowing ends owned-builder provenance; traits on borrowed builders
      cannot acquire native method authority. Unknown transformations produce a bounded coverage
      diagnostic instead of a security finding.
  mode: taint
  pattern-sources:
  - patterns:
    - pattern: 'fn $FUNC(..., $BUILDER: $TYPE, ...) { ... }'
    - metavariable-name:
        metavariable: $TYPE
        module: reqwest
        symbol:
        - ClientBuilder
    - focus-metavariable: $BUILDER
    exact: true
    model-type: reqwest.ClientBuilder
  - patterns:
    - pattern: $FACTORY()
    - metavariable-name:
        metavariable: $FACTORY
        module: reqwest
        symbol:
        - Client
        - builder
    exact: true
    model-type: reqwest.ClientBuilder
  - patterns:
    - pattern: $FACTORY()
    - metavariable-name:
        metavariable: $FACTORY
        module: reqwest
        symbol:
        - ClientBuilder
        - new
    exact: true
    model-type: reqwest.ClientBuilder
  - patterns:
    - pattern-either:
      - pattern: $BUILDER.add_crl(...)
      - pattern: $BUILDER.add_crls(...)
      - pattern: $BUILDER.add_root_certificate(...)
      - pattern: $BUILDER.brotli(...)
      - pattern: $BUILDER.connect_timeout(...)
      - pattern: $BUILDER.connection_verbose(...)
      - pattern: $BUILDER.connector_layer(...)
      - pattern: $BUILDER.cookie_provider(...)
      - pattern: $BUILDER.cookie_store(...)
