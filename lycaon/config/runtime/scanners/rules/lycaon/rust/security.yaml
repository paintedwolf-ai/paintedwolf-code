      - pattern: $BUILDER.http2_prior_knowledge(...)
      - pattern: $BUILDER.http3_congestion_bbr(...)
      - pattern: $BUILDER.http3_conn_receive_window(...)
      - pattern: $BUILDER.http3_max_field_section_size(...)
      - pattern: $BUILDER.http3_max_idle_timeout(...)
      - pattern: $BUILDER.http3_prior_knowledge(...)
