- id: lycaon.rust.zeroed-reference
  languages:
  - rust
  severity: ERROR
  message: Zero initialization cannot create a valid Rust reference
  metadata:
    category: security
    cwe: CWE-843
    confidence: HIGH
    technology:
    - rust
    references:
    - https://doc.rust-lang.org/std/mem/fn.zeroed.html
    notes: Requires native or imported std::mem::zeroed identity and an explicit reference result type.
      Shared and mutable references are covered; nullable raw pointers and Option values remain quiet.
  pattern-either:
  - patterns:
    - pattern-either:
      - pattern: 'let $REF: &$TYPE = $CALL();'
      - pattern: 'let $REF: &mut $TYPE = $CALL();'
      - pattern: 'let $REF: &$TYPE = unsafe { $CALL() };'
      - pattern: 'let $REF: &mut $TYPE = unsafe { $CALL() };'
    - metavariable-name:
        metavariable: $CALL
        module: std.mem
        symbol:
        - zeroed
  - patterns:
    - pattern-either:
      - pattern: 'let $REF: &$TYPE = $CALL();'
      - pattern: 'let $REF: &mut $TYPE = $CALL();'
      - pattern: 'let $REF: &$TYPE = unsafe { $CALL() };'
      - pattern: 'let $REF: &mut $TYPE = unsafe { $CALL() };'
    - metavariable-name:
        metavariable: $CALL
        module: std
        symbol:
        - mem
        - zeroed
- id: lycaon.rust.actix-command-injection
  languages:
  - rust
  severity: ERROR
  message: Request input reaches an explicit shell command
  mode: taint
  pattern-sources:
  - patterns:
    - pattern: 'fn $HANDLER(..., $REQ: $TYPE, ...) { ... }'
    - metavariable-name:
        metavariable: $TYPE
        module: actix_web
        symbol:
        - HttpRequest
    - focus-metavariable: $REQ
    exact: true
    label: HTTP_REQUEST
    model-type: actix_web.HttpRequest
  - patterns:
    - pattern-either:
      - pattern: $REQ.query_string()
      - pattern: $REQ.match_info()[...]
    exact: true
    label: HTTP_VALUE
    requires: HTTP_REQUEST
    requires-model-type:
      metavariable: $REQ
      type: actix_web.HttpRequest
    model-type: rust.primitive.str
  - patterns:
    - pattern: $REQ.match_info().get(...)
    exact: true
    label: HTTP_OPTION
    requires: HTTP_REQUEST
    model-type: actix_web.RequestParameterOption
    requires-model-type:
      metavariable: $REQ
      type: actix_web.HttpRequest
  - patterns:
    - pattern-either:
      - pattern: $OPTION.unwrap()
      - pattern: $OPTION.expect(...)
      - pattern: $OPTION.unwrap_or(...)
      - pattern: $OPTION.unwrap_or_default()
    exact: true
    label: HTTP_VALUE
    requires: HTTP_OPTION
    requires-model-type:
      metavariable: $OPTION
      type: actix_web.RequestParameterOption
    model-type: rust.primitive.str
