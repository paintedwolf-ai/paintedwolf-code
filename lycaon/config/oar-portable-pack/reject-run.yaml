# Escalation over time: notice a repeat, flag it, then refuse.
#
# The counter is the engine's, not a rule's: `same_code_reject_run` counts the
# consecutive rejections carrying the same identifier this session has produced
# (section 5.2). The threshold is in the rule ([OAR-FIRE-3]) — the engine only
# counts — so the escalation travels with the pack.
#
# Two rules, because the decision is resolved by precedence ([OAR-EVAL-4]) and
# the first block short-circuits the occurrence ([OAR-EVAL-3]). Both are
# `invariant` kind, so they evaluate in ascending id order ([OAR-EVAL-1]):
# REJECT_RUN_BLOCK first. At three consecutive rejections it fires and the
# occurrence ends there; at two it passes and REJECT_RUN_WARN decides.
spec_version: "1.0"
id: REJECT_RUN_BLOCK
namespace: example.hygiene
kind: invariant
on: tool.pre_invoke
selector: {}
when: 'same_code_reject_run >= 3'
effect: block
on_fire: [publish_event]
profile: portable
what: The same refusal has repeated three times, so the call is refused outright.
fix: Inspect the environment or change the command rather than replaying it.
---
spec_version: "1.0"
id: REJECT_RUN_WARN
namespace: example.hygiene
kind: invariant
on: tool.pre_invoke
selector: {}
when: 'same_code_reject_run >= 2'
effect: warn
profile: portable
what: The same call has been refused twice in a row.
fix: Change the approach instead of replaying the refused call.
