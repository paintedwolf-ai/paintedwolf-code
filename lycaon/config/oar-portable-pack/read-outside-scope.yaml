# The basic shape: an anchor, a selector, a condition, an effect, and copy that
# explains the refusal. path_outside_scope belongs to the filesystem profile, so
# the rule lists it in requires_facts ([OAR-DOC-22]).
spec_version: "1.0"
id: READ_OUTSIDE_SCOPE
namespace: example.security
kind: policy
on: tool.pre_invoke
selector:
  tools: [read, grep]
requires_facts: [path_outside_scope]
when: 'path_outside_scope'
effect: block
on_error: fail_closed       # if the scope check itself fails, refuse
profile: portable
title: Read outside the declared scope
what: The call reads a path outside the scope in force for this tool.
fix: Read inside the scope, or widen the scope deliberately.
