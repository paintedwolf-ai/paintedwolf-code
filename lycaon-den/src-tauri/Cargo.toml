[package]
name = "painted-wolf-code"
version = "1.0.1"
description = "Painted Wolf Code desktop shell"
authors = ["Painted Wolf Code"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "painted_wolf_code_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Enables the inspector for local release profiling.
profiling = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
semver = "1"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
# Package-managed installs notify; app-managed installs update in place.
# The updater reaches its fixed endpoint directly, so system proxy discovery stays off.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "zip"] }
tokio = { version = "1", features = ["sync", "time", "fs", "io-util", "macros"] }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
sha2 = "0.10"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
base64 = "0.22"
minisign-verify = "0.3.0"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
which = "7"
ureq = "2"
libc = "0.2"
# The blocking picker preserves window-level presentation.
rfd = "0.16"
arboard = "3"
uuid = { version = "1", features = ["v4"] }

# macOS posts through UserNotifications directly; other targets use the plugin.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-notification = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_Com",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows = { version = "0.61.3", features = [
  "Foundation",
  "Security_Credentials_UI",
  "Win32_Foundation",
  "Win32_System_WinRT",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-local-authentication = { version = "0.3.2", default-features = false, features = [
  "std",
  "LAContext",
  "block2",
] }
objc2-foundation = { version = "0.3", features = [
  "NSString",
  "NSDictionary",
  "NSBundle",
  "NSUserDefaults",
  "NSNotification",
  "NSDistributedNotificationCenter",
  "NSObject",
  "NSKeyValueCoding",
  "NSValue",
  "NSDate",
  "NSError",
  "NSGeometry",
  "NSRunLoop",
  "NSURL",
  "NSURLRequest",
  "block2",
] }
objc2-user-notifications = { version = "0.3", features = [
  "block2",
  "UNUserNotificationCenter",
  "UNNotification",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSettings",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-core-graphics",
  "objc2-quartz-core",
  "NSAccessibility",
  "NSApplication",
  "NSColor",
  "NSColorSpace",
  "NSEvent",
  "NSGraphics",
  "NSResponder",
  "NSRunningApplication",
  "NSScreen",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "CFCGTypes",
] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
  "std",
  "CGEvent",
  "CGEventSource",
  "CGEventTypes",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "CABase",
  "CADisplayLink",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "objc2-app-kit",
  "WKNavigation",
  "WKPreferences",
  "WKUserContentController",
  "WKUserScript",
  "WKWebView",
  "WKWebViewConfiguration",
  "WKWebsiteDataStore",
] }
