[[permission]]
identifier = "allow-set-app-menu"
description = "Replace the native application menu with the projection of Den's command registry. Sent on boot and whenever shell state or a key rebind changes what the menu should show."
commands.allow = ["set_app_menu"]

[[permission]]
identifier = "allow-request-quit"
description = "Quit from the in-window app menu; the exit coordinator still decides whether the app may leave."
commands.allow = ["request_quit"]
