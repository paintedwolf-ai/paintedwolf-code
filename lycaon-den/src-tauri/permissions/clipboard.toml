[[permission]]
identifier = "allow-read-clipboard-text"
description = "Read plain text from the OS clipboard for context-menu Paste."
commands.allow = ["read_clipboard_text"]

[[permission]]
identifier = "allow-write-clipboard-text"
description = "Write plain text to the OS clipboard for copy and cut actions."
commands.allow = ["write_clipboard_text"]

[[permission]]
identifier = "allow-write-secret-text"
description = "Copy a revealed secret value to the OS clipboard, marked as secret for clipboard history."
commands.allow = ["write_secret_text"]

[[permission]]
identifier = "allow-clear-secret-text"
description = "Clear a copied secret value when it expires, only while that copy is still on the clipboard."
commands.allow = ["clear_secret_text"]

[[permission]]
identifier = "allow-paste-into-focused-view"
description = "Run the system Paste action in the focused web view for context-menu Paste on macOS."
commands.allow = ["paste_into_focused_view"]

[[permission]]
identifier = "allow-read-clipboard-image"
description = "Read the clipboard image for paste on Linux, where WebKitGTK paste events carry no images."
commands.allow = ["read_clipboard_image"]
