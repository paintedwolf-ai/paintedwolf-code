[[permission]]
identifier = "allow-accessibility-preferred-text-size"
description = "Read the macOS Accessibility text-size category once at boot; later changes arrive on the accessibility://text-size-changed event."
commands.allow = ["accessibility_preferred_text_size"]

[[permission]]
identifier = "allow-accessibility-screen-reader"
description = "Read whether a screen reader is running once at boot; later changes arrive on the accessibility://screen-reader-changed event."
commands.allow = ["accessibility_screen_reader"]
