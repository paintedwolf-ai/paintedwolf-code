# Font catalog for Painted Wolf Code.
#
# Generated by `./task codegen:den-fonts`:
#   lycaon-den/public/fonts/*.woff2
#   lycaon-den/public/fonts/licenses/*.txt
#   lycaon-den/src/fonts/font-catalog.generated.ts
#   lycaon-den/src/fonts/font-faces.generated.css

catalog_version: 1

# Platform fallbacks appended after bundled font families.
fallbacks:
  ui: system-ui, -apple-system, "Segoe UI", sans-serif
  mono: ui-monospace, "SF Mono", Consolas, monospace

families:
  - family: Inter
    role: ui
    default: true
    description: Neutral and quiet at interface sizes.

  - family: IBM Plex Sans
    role: ui
    description: A grotesque with slab-adjacent detail; more voice than Inter.

  - family: Source Sans 3
    role: ui
    description: Humanist, open apertures — the most forgiving at small sizes.

  - family: DM Sans
    role: ui
    description: Geometric and low-contrast; roomy in dense chrome.

  - family: Space Grotesk
    role: ui
    description: Geometric with tightened, slightly odd forms. Distinctive.

  - family: Literata
    role: ui
    description: A serif drawn for screen reading, if you would rather not read a sans.

  - family: JetBrains Mono
    role: mono
    default: true
    description: Tall x-height and wide glyphs, drawn for code.
