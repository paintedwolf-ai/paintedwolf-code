name: Cache notices tools
description: Restore the pinned go-licenses and cargo-about builds that main warms
inputs:
  save:
    description: Save the tools after the job (main only); every other run restores without saving
    default: 'false'
runs:
  using: composite
  steps:
    - name: Resolve tool directory
      id: paths
      shell: bash
      run: printf 'bin=%s\n' "$(python3 scripts/artifact_paths.py bin "${GITHUB_WORKSPACE}")" >> "${GITHUB_OUTPUT}"

    # The notices script reuses any installed tool, so only its exact pins restore.
    - if: ${{ inputs.save == 'true' && github.ref == 'refs/heads/main' }}
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ${{ steps.paths.outputs.bin }}/cargo-about
          ${{ steps.paths.outputs.bin }}/go-licenses
        key: notices-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/licenses-notices.sh', 'rust-toolchain.toml', 'lycaon/go.mod') }}
    - if: ${{ inputs.save != 'true' || github.ref != 'refs/heads/main' }}
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ${{ steps.paths.outputs.bin }}/cargo-about
          ${{ steps.paths.outputs.bin }}/go-licenses
        key: notices-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/licenses-notices.sh', 'rust-toolchain.toml', 'lycaon/go.mod') }}
