name: Cache generation runtime build
description: Reuse the generation runtime's compiled dependencies
inputs:
  lookup-only:
    description: Check the exact native cache identity without restoring payloads
    default: 'false'
  save:
    description: Publish the prepared build (main only); the default restores without saving
    default: 'false'
outputs:
  cache-hit:
    description: Whether the exact generation runtime build was restored
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - id: paths
      shell: bash
      run: |
        set -euo pipefail
        toolchain=system
        if [[ "${RUNNER_OS}" == macOS ]]; then toolchain="${DEVELOPER_DIR:-system}"; fi
        printf 'target=%s/generation-rust\n' "$(python3 scripts/artifact_paths.py compiler-cache "${GITHUB_WORKSPACE}")" >> "${GITHUB_OUTPUT}"
        printf 'prefix=generation-v1-%s-%s-%s-%s-%s-\n' "${RUNNER_OS}" "${RUNNER_ARCH}" "${ImageOS:-}" "${ImageVersion:-}" "${toolchain}" >> "${GITHUB_OUTPUT}"
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.paths.outputs.target }}
          !${{ steps.paths.outputs.target }}/**/incremental
        key: ${{ steps.paths.outputs.prefix }}${{ hashFiles('rust-toolchain.toml', 'lycaon/internal/generation/native/Cargo.toml', 'lycaon/internal/generation/native/Cargo.lock', 'lycaon/internal/generation/native/build.rs', 'lycaon/internal/platformfloor/macos_floor.txt', 'scripts/generation/sources.json', 'scripts/generation/runtime.py', 'scripts/toolchain/rust-path-remap.sh', 'scripts/ci_policy/cache_payload.py', 'scripts/warm-workspace-build.sh') }}
        lookup-only: ${{ inputs.lookup-only == 'true' || inputs.save == 'true' }}
        restore-keys: ${{ inputs.save != 'true' && inputs.lookup-only != 'true' && steps.paths.outputs.prefix || '' }}
    - if: ${{ inputs.save == 'true' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' }}
      id: save
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.paths.outputs.target }}
          !${{ steps.paths.outputs.target }}/**/incremental
        key: ${{ steps.paths.outputs.prefix }}${{ hashFiles('rust-toolchain.toml', 'lycaon/internal/generation/native/Cargo.toml', 'lycaon/internal/generation/native/Cargo.lock', 'lycaon/internal/generation/native/build.rs', 'lycaon/internal/platformfloor/macos_floor.txt', 'scripts/generation/sources.json', 'scripts/generation/runtime.py', 'scripts/toolchain/rust-path-remap.sh', 'scripts/ci_policy/cache_payload.py', 'scripts/warm-workspace-build.sh') }}
    - if: ${{ steps.save.outcome == 'success' }}
      uses: ./.github/actions/cache-prune
      with:
        family: ${{ steps.paths.outputs.prefix }}
