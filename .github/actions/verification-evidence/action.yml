name: Retain verification evidence
description: Preserve receipts, diagnostics, and timings for every hosted verdict
inputs:
  name:
    description: Unique artifact name within the workflow run
    required: true
  status:
    description: Job status before evidence collection
    required: true
runs:
  using: composite
  steps:
    - name: Resolve artifact directory
      id: paths
      shell: bash
      run: echo "artifact-root=$(python3 scripts/artifact_paths.py artifacts "$GITHUB_WORKSPACE")" >> "$GITHUB_OUTPUT"

    - name: Summarize verification
      shell: bash
      env:
        VERIFICATION_STATUS: ${{ inputs.status }}
      run: python3 scripts/ci_verification.py report "$VERIFICATION_STATUS"

    # Evidence is diagnostic; an artifact service outage must not overturn the verdict.
    - name: Upload verification evidence
      if: always()
      continue-on-error: true
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: ${{ inputs.name }}
        path: |
          ${{ steps.paths.outputs.artifact-root }}/ci/
          ${{ steps.paths.outputs.artifact-root }}/verification/
          ${{ steps.paths.outputs.artifact-root }}/last-run/
          ${{ steps.paths.outputs.artifact-root }}/perf/
          lycaon-den/test-results/
          lycaon-den/playwright-report/
        if-no-files-found: warn
        retention-days: 14
