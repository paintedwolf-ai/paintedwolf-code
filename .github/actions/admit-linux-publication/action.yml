name: Admit Linux publication
description: Reevaluate the protected final campaign and exact files before release writes
inputs:
  controller_root:
    description: Checkout of the protected main controller
    required: true
  source_commit:
    description: Independently selected immutable release source
    required: true
  campaign_run_id:
    description: Successful main controller run retaining final installed campaign inputs
    required: true
  publication_files:
    description: Actual final files selected for the impending publication
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-go@5064d95ba18d4a9dda7c4cc67adeb03aea1a2a14 # v7.0.0
      with:
        go-version-file: ${{ inputs.controller_root }}/lycaon/go.mod
        cache: false
    - name: Install repository signature verification tools
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y gnupg rpm zstd libarchive-tools
    - name: Install the pinned Nix cache verifier
      shell: bash
      run: |
        set -euo pipefail
        [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
        test ! -e /nix
        install_root="$RUNNER_TEMP/linux-publication-nix"
        mkdir "$install_root"
        archive=nix-2.35.3-x86_64-linux.tar.xz
        curl --fail --location --connect-timeout 15 --max-time 300 \
          "https://releases.nixos.org/nix/nix-2.35.3/$archive" --output "$install_root/$archive"
        printf '%s  %s\n' 6ce3ce3703fdc241b560cba401c5d338042122fe5b1a81e07bf1a623f259eba0 "$install_root/$archive" | sha256sum --check
        tar -xJf "$install_root/$archive" -C "$install_root"
        printf 'sandbox = true\ntrusted-users = root\n' > "$install_root/nix.conf"
        "$install_root/nix-2.35.3-x86_64-linux/install" --daemon --yes \
          --daemon-user-count 4 --no-channel-add --no-modify-profile \
          --nix-extra-conf-file "$install_root/nix.conf"
        printf '%s\n' /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"
    - id: admit-final-linux
      name: Reevaluate the installed campaign and imminent publication bytes
      shell: bash
      working-directory: ${{ inputs.controller_root }}
      env:
        SOURCE_COMMIT: ${{ inputs.source_commit }}
        CAMPAIGN_RUN_ID: ${{ inputs.campaign_run_id }}
        PUBLICATION_FILES: ${{ inputs.publication_files }}
      run: |
        set -euo pipefail
        ./task release:live-test -- --admit-linux-publication \
          --campaign-run-id "$CAMPAIGN_RUN_ID" --source-commit "$SOURCE_COMMIT" \
          --source-repository "$PWD" --retained-dir "$RUNNER_TEMP/linux-final-campaign" \
          --publication-files "$PUBLICATION_FILES" --receipt "$RUNNER_TEMP/linux-publication-admission.json"
