name: Cache decision engine build
description: Reuse decision-engine test and release builds with their compiled MLX kernels
inputs:
  lookup-only:
    description: Check the exact native cache identity without restoring payloads
    default: 'false'
  save:
    description: Publish the prepared build (main only); the default restores without saving
    default: 'false'
outputs:
  cache-hit:
    description: Whether the exact decision engine build was restored
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Resolve decision engine build paths
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        toolchain=system
        if [[ "${RUNNER_OS}" == macOS ]]; then toolchain="${DEVELOPER_DIR:-system}"; fi
        printf 'prefix=decide-v4-%s-%s-%s-%s-\n' "${RUNNER_OS}" "${RUNNER_ARCH}" "${ImageOS:-}" "${toolchain}" >> "${GITHUB_OUTPUT}"
        printf 'target=%s/decide\n' "$(python3 scripts/artifact_paths.py compiler-cache "${GITHUB_WORKSPACE}")" >> "${GITHUB_OUTPUT}"
        printf 'metal=%s/mlx-metal\n' "$(python3 scripts/artifact_paths.py bin "${GITHUB_WORKSPACE}")" >> "${GITHUB_OUTPUT}"

    # Restore compiler intermediates with the Metal kernels they reference.
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.paths.outputs.target }}
          !${{ steps.paths.outputs.target }}/**/incremental
          ${{ steps.paths.outputs.metal }}
        key: ${{ steps.paths.outputs.prefix }}${{ hashFiles('rust-toolchain.toml', 'lycaon/internal/decide/native/Cargo.toml', 'lycaon/internal/decide/native/Cargo.lock', 'lycaon/internal/platformfloor/macos_floor.txt', 'scripts/decide-features.sh', 'scripts/build-decide.sh', 'scripts/toolchain/decide-test.sh', 'scripts/toolchain/decide-environment.sh', 'scripts/toolchain/rust-path-remap.sh', 'scripts/ci_policy/cache_payload.py', 'scripts/warm-workspace-build.sh') }}
        lookup-only: ${{ inputs.lookup-only == 'true' || inputs.save == 'true' }}
        restore-keys: ${{ inputs.save != 'true' && inputs.lookup-only != 'true' && steps.paths.outputs.prefix || '' }}
    - if: ${{ inputs.save == 'true' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' }}
      id: save
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.paths.outputs.target }}
          !${{ steps.paths.outputs.target }}/**/incremental
          ${{ steps.paths.outputs.metal }}
        key: ${{ steps.paths.outputs.prefix }}${{ hashFiles('rust-toolchain.toml', 'lycaon/internal/decide/native/Cargo.toml', 'lycaon/internal/decide/native/Cargo.lock', 'lycaon/internal/platformfloor/macos_floor.txt', 'scripts/decide-features.sh', 'scripts/build-decide.sh', 'scripts/toolchain/decide-test.sh', 'scripts/toolchain/decide-environment.sh', 'scripts/toolchain/rust-path-remap.sh', 'scripts/ci_policy/cache_payload.py', 'scripts/warm-workspace-build.sh') }}
