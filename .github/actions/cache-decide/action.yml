name: Cache decision engine build
description: Reuse the bialy release build and its compiled MLX kernels across verification jobs
runs:
  using: composite
  steps:
    - name: Resolve decision engine build paths
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        printf 'target=%s/decide-target\n' "$(python3 scripts/artifact_paths.py build "${GITHUB_WORKSPACE}")" >> "${GITHUB_OUTPUT}"
        printf 'metal=%s/mlx-metal\n' "$(python3 scripts/artifact_paths.py bin "${GITHUB_WORKSPACE}")" >> "${GITHUB_OUTPUT}"

    # The target and the kernels it records as built are restored together:
    # a target without its metallib would skip the MLX build that writes it.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.paths.outputs.target }}
          ${{ steps.paths.outputs.metal }}
        key: decide-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVELOPER_DIR }}-${{ hashFiles('rust-toolchain.toml', 'lycaon/internal/decide/native/Cargo.toml', 'lycaon/internal/decide/native/Cargo.lock', 'lycaon/internal/platformfloor/macos_floor.txt', 'scripts/decide-features.sh', 'scripts/build-decide.sh') }}
        restore-keys: |
          decide-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVELOPER_DIR }}-
