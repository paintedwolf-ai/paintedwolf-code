name: Cache decision engine build
description: Reuse decision-engine test and release builds with their compiled MLX kernels
inputs:
  save:
    description: Publish the prepared build (main only); the default restores without saving
    default: 'false'
outputs:
  cache-hit:
    description: Whether the exact decision engine build was restored
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Resolve decision engine build paths
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        printf 'target=%s/decide\n' "$(python3 scripts/artifact_paths.py compiler-cache "${GITHUB_WORKSPACE}")" >> "${GITHUB_OUTPUT}"
        printf 'metal=%s/mlx-metal\n' "$(python3 scripts/artifact_paths.py bin "${GITHUB_WORKSPACE}")" >> "${GITHUB_OUTPUT}"

    # Restore compiler intermediates with the Metal kernels they reference.
    - if: ${{ inputs.save == 'true' && github.ref == 'refs/heads/main' }}
      id: save
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.paths.outputs.target }}
          !${{ steps.paths.outputs.target }}/**/incremental
          ${{ steps.paths.outputs.metal }}
        key: decide-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVELOPER_DIR }}-${{ hashFiles('rust-toolchain.toml', 'lycaon/internal/decide/native/Cargo.toml', 'lycaon/internal/decide/native/Cargo.lock', 'lycaon/internal/platformfloor/macos_floor.txt', 'scripts/decide-features.sh', 'scripts/build-decide.sh', 'scripts/toolchain/rust-path-remap.sh') }}
    - if: ${{ inputs.save != 'true' || github.ref != 'refs/heads/main' }}
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.paths.outputs.target }}
          !${{ steps.paths.outputs.target }}/**/incremental
          ${{ steps.paths.outputs.metal }}
        key: decide-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVELOPER_DIR }}-${{ hashFiles('rust-toolchain.toml', 'lycaon/internal/decide/native/Cargo.toml', 'lycaon/internal/decide/native/Cargo.lock', 'lycaon/internal/platformfloor/macos_floor.txt', 'scripts/decide-features.sh', 'scripts/build-decide.sh', 'scripts/toolchain/rust-path-remap.sh') }}
        restore-keys: |
          decide-v2-${{ runner.os }}-${{ runner.arch }}-${{ env.DEVELOPER_DIR }}-
