name: Set up maintained OpenGrep
description: Download or restore the pinned, verified engine release
inputs:
  save:
    description: Save a downloaded release (main only); every other run restores without saving
    default: 'false'
outputs:
  artifact-directory:
    description: Absolute directory containing the verified maintained artifact
    value: ${{ steps.resolve.outputs.artifact-directory }}
runs:
  using: composite
  steps:
    - name: Read release cache identity
      id: identity
      shell: bash
      run: |
        set -euo pipefail
        CACHE_DIR="${OPENGREP_CACHE_DIR:-$(python3 scripts/artifact_paths.py bin "${GITHUB_WORKSPACE}")/opengrep-artifacts}"
        case "${CACHE_DIR}" in
          /*) ;;
          *) CACHE_DIR="${GITHUB_WORKSPACE}/${CACHE_DIR}" ;;
        esac
        MANIFEST_SHA="$(shasum -a 256 lycaon/config/runtime/scanners/bundled-manifest.yaml | awk '{print $1}')"
        printf 'cache-directory=%s\n' "${CACHE_DIR}" >> "${GITHUB_OUTPUT}"
        printf 'cache-key=opengrep-release-%s-%s-%s\n' "${RUNNER_OS}" "${RUNNER_ARCH}" "${MANIFEST_SHA}" >> "${GITHUB_OUTPUT}"
        printf 'OPENGREP_CACHE_DIR=%s\n' "${CACHE_DIR}" >> "${GITHUB_ENV}"

    - name: Restore release cache
      id: cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.identity.outputs.cache-directory }}
        key: ${{ steps.identity.outputs.cache-key }}

    - name: Resolve and verify pinned release
      id: resolve
      shell: bash
      run: |
        set -euo pipefail
        ARTIFACT_DIR="$(./task --silent scan:opengrep:stage -- --artifact-dir-only)"
        test -d "${ARTIFACT_DIR}"
        printf 'artifact-directory=%s\n' "${ARTIFACT_DIR}" >> "${GITHUB_OUTPUT}"

    - name: Cache verified release
      if: inputs.save == 'true' && github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.identity.outputs.cache-directory }}
        key: ${{ steps.identity.outputs.cache-key }}
