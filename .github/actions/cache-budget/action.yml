name: Admit compiler cache publication
description: Reserve storage and retire only owned compiler cache entries on main
inputs:
  key:
    required: true
    description: Cache key to publish
  path:
    required: true
    description: Cache paths and exclusions
outputs:
  allowed:
    description: Whether the payload fits the publication budget
    value: ${{ steps.budget.outputs.allowed }}
runs:
  using: composite
  steps:
    - id: budget
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CACHE_KEY: ${{ inputs.key }}
        CACHE_PATHS: ${{ inputs.path }}
        PYTHONPATH: scripts
      run: python3 -m ci_policy.cache_budget
