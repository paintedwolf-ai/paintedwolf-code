name: Set up Bialy heads
description: Download the pinned public heads and verify them against the host release manifest
runs:
  using: composite
  steps:
    - name: Download and verify Bialy heads
      shell: bash
      run: |
        set -euo pipefail
        SOURCE_DIR="$(mktemp -d "${RUNNER_TEMP}/bialy-download.XXXXXX")"
        trap 'rm -rf -- "${SOURCE_DIR}"' EXIT
        # The default lookup location: verification receives only declared environment.
        HEADS_DIR="$(python3 scripts/artifact_paths.py bin "${GITHUB_WORKSPACE}")/decide-heads"
        MANIFEST=lycaon/config/packs/painted-wolf/platform/host/decision-release.json
        HEADS_REPO="$(jq -er '.source.heads.repo' "${MANIFEST}")"
        HEADS_REVISION="$(jq -er '.source.heads.revision' "${MANIFEST}")"
        for HEAD in $(jq -r '.heads | keys[]' "${MANIFEST}"); do
          curl --fail --location --silent --show-error \
            --proto '=https' --proto-redir '=https' \
            --retry 3 --connect-timeout 30 --max-time 600 \
            "https://huggingface.co/${HEADS_REPO}/resolve/${HEADS_REVISION}/${HEAD}.safetensors" \
            --output "${SOURCE_DIR}/${HEAD}.safetensors"
        done
        python3 scripts/stage-decide-heads.py \
          --manifest "${MANIFEST}" \
          --source "${SOURCE_DIR}" \
          --destination "${HEADS_DIR}"
        printf 'BIALY_HEADS_DIR=%s\n' "${HEADS_DIR}" >> "${GITHUB_ENV}"
