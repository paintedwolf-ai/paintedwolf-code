name: Set up verification
description: Install pinned toolchains and dependencies for hosted verification
inputs:
  native:
    description: Install the Tauri shell build dependencies
    default: 'false'
    required: false
  save-caches:
    description: Save the toolchain and build caches (main's warm job only); every other run restores without saving
    default: 'false'
    required: false
outputs:
  artifact-root:
    description: Checkout artifact directory
    value: ${{ steps.paths.outputs.artifact-root }}
  go-cache-hit:
    description: Whether the Go caches for the current module graph were restored
    value: ${{ steps.go.outputs.cache-hit }}
  rust-cache-hit:
    description: Whether the Tauri shell dependency build for the current lockfile was restored
    value: ${{ steps.rust.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Resolve artifact directory
      id: paths
      shell: bash
      run: echo "artifact-root=$(python3 scripts/artifact_paths.py artifacts "$GITHUB_WORKSPACE")" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: lycaon/go.mod
        cache: false

    # Caches restore only what main saved: a run on any other ref cannot share
    # what it saves, and its entries would evict main's.
    - id: go
      uses: ./.github/actions/cache-go
      with:
        save: ${{ inputs.save-caches }}

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: .bun-version
        no-cache: true

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version

    - name: Install the pinned Rust toolchain
      shell: bash
      run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal

    - name: Install Tauri Linux build dependencies
      if: runner.os == 'Linux' && inputs.native == 'true'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      id: rust
      if: inputs.native == 'true'
      with:
        workspaces: lycaon-den/src-tauri
        shared-key: den-shell
        save-if: ${{ inputs.save-caches == 'true' }}

    - name: Restore the decision engine build
      if: runner.os == 'macOS'
      uses: ./.github/actions/cache-decide
      with:
        save: ${{ inputs.save-caches }}

    - name: Set up maintained OpenGrep
      uses: ./.github/actions/setup-opengrep
      with:
        save: ${{ inputs.save-caches }}

    # Source-scanning frontend tests shell out to ripgrep.
    - name: Install ripgrep
      shell: bash
      run: |
        set -euo pipefail
        command -v rg >/dev/null && exit 0
        if [[ "${RUNNER_OS}" == macOS ]]; then
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
        else
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ripgrep
        fi

    # Git integration tests resolve the pinned engine from engine-root.
    - name: Fetch pinned git engine
      shell: bash
      run: ./task gitengine:fetch

    - name: Install frontend dependencies
      shell: bash
      working-directory: lycaon-den
      run: bun install --frozen-lockfile

    # The notices script pins both tools; cargo-about otherwise compiles from source on every runner.
    - name: Restore notices tools
      uses: ./.github/actions/cache-notices-tools
      with:
        save: ${{ inputs.save-caches }}

    - name: Generate third-party notices
      shell: bash
      run: ./task licenses:notices
