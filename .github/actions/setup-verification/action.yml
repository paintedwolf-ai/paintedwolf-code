name: Set up verification
description: Install pinned toolchains and dependencies for hosted verification
inputs:
  setup:
    description: >-
      What the lane builds: verification (shared toolchains), shell (also the Tauri
      shell and its staged engine), or harness (the Den Rust workspace and harness
      stack, without the shell's packaging inputs), or frontend (Bun, Node, Rust,
      ripgrep, and document-core dependencies)
    default: verification
    required: false
  runtime-engines:
    description: Provision Git and OCR engines used by host behavior checks
    default: 'true'
  notices:
    description: Restore tools for the lane's explicit licenses:notices check
    default: 'false'
  analysis:
    description: Pinned Go analysis tools needed by the lane (none, lint, vulnerabilities, all)
    default: none
  containers:
    description: Provision the WebKitGTK accessibility images before an offline lane runs den:webkit:atspi
    default: 'false'
  browser:
    description: Provision the pinned browser before an offline lane runs test:confine:linux
    default: 'false'
  repository-tools:
    description: Install the native apt, dnf and pacman tools the distribution fixture tests drive
    default: 'false'
  nix:
    description: Provision the pinned Nix toolchain and locked flake inputs before an offline Nix lane
    default: 'false'
  save-caches:
    description: Save the toolchain and build caches (main's warm job only); every other run restores without saving
    default: 'false'
    required: false
outputs:
  decide-cache-hit:
    description: Whether the decision engine's exact build cache was restored
    value: ${{ steps.decide.outputs.cache-hit }}
  document-cache-hit:
    description: Whether the document compiler cache was restored
    value: ${{ steps.document.outputs.cache-hit }}
  artifact-root:
    description: Checkout artifact directory
    value: ${{ steps.paths.outputs.artifact-root }}
  go-cache-hit:
    description: Whether the Go caches for the current module graph were restored
    value: ${{ steps.go.outputs.cache-hit }}
  rust-cache-hit:
    description: Whether the Tauri shell dependency build for the current lockfile was restored
    value: ${{ steps.rust.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Set verification compiler profiles
      shell: bash
      run: printf 'CARGO_PROFILE_DEV_DEBUG=0\nCARGO_PROFILE_TEST_DEBUG=0\n' >> "${GITHUB_ENV}"

    - name: Resolve artifact directory
      id: paths
      shell: bash
      run: echo "artifact-root=$(python3 scripts/artifact_paths.py artifacts "$GITHUB_WORKSPACE")" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af # v7.0.0
      with:
        go-version-file: lycaon/go.mod
        cache: false

    # Caches restore only what main saved: a run on any other ref cannot share
    # what it saves, and its entries would evict main's.
    - id: go
      if: inputs.setup != 'frontend'
      uses: ./.github/actions/cache-go
      with:
        exact: ${{ inputs.save-caches }}

    - name: Restore analysis tools
      uses: ./.github/actions/cache-analysis-tools
      with:
        tools: ${{ inputs.analysis }}

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: .bun-version
        no-cache: true

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version

    - name: Install the pinned Rust toolchain
      shell: bash
      run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal

    - name: Allow verification engines to create user namespaces
      if: runner.os == 'Linux'
      shell: bash
      run: |
        if [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" == 1 ]]; then
          profile="$RUNNER_TEMP/paintedwolf-verification"
          {
            cat "$GITHUB_ACTION_PATH/apparmor-verification-userns"
            printf '\nprofile paintedwolf-verification-sidecar "%s/lycaon-dev" flags=(unconfined) {\n  userns,\n}\n' \
              "$(python3 scripts/artifact_paths.py build "$GITHUB_WORKSPACE")"
          } > "$profile"
          sudo install -m 0644 "$profile" /etc/apparmor.d/paintedwolf-verification
          sudo apparmor_parser -r /etc/apparmor.d/paintedwolf-verification
        fi

    - name: Provision Linux native test dependencies
      if: runner.os == 'Linux' && inputs.setup == 'shell'
      uses: ./.github/actions/setup-linux-native
      with:
        save: ${{ inputs.save-caches }}

    - uses: ./.github/actions/cache-document-core
      id: document

    - uses: ./.github/actions/cache-rust
      id: rust
      if: inputs.setup == 'shell' || inputs.setup == 'harness'

    - name: Restore the decision engine build
      id: decide
      if: inputs.setup == 'shell'
      uses: ./.github/actions/cache-decide

    - name: Provision pinned Go modules
      if: inputs.setup != 'frontend'
      shell: bash
      run: ./task setup-dev -- --ci-inputs

    - name: Set up maintained OpenGrep
      if: inputs.setup != 'frontend'
      uses: ./.github/actions/setup-opengrep
      with:
        save: ${{ inputs.save-caches }}

    # Source-scanning frontend tests shell out to ripgrep.
    - name: Install ripgrep
      if: inputs.setup != 'harness'
      shell: bash
      run: |
        set -euo pipefail
        command -v rg >/dev/null && exit 0
        if [[ "${RUNNER_OS}" == macOS ]]; then
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
        else
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ripgrep
        fi

    # Git integration tests resolve the pinned engine from engine-root.
    - name: Fetch pinned git engine
      if: inputs.setup != 'frontend' && inputs.runtime-engines == 'true'
      shell: bash
      run: ./task gitengine:fetch

    # Text recognition tests resolve the pinned engine from engine-root on Linux.
    - name: Fetch pinned text recognition engine
      if: runner.os == 'Linux' && inputs.setup != 'frontend' && inputs.runtime-engines == 'true'
      shell: bash
      run: bash scripts/ocrengine-fetch.sh

    - name: Restore pinned frontend packages
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version', 'lycaon-den/bun.lock') }}

    - name: Provision frontend native test inputs
      if: inputs.setup == 'frontend'
      shell: bash
      run: |
        ./task --version
        cargo fetch --locked --manifest-path lycaon/internal/documentcore/native/Cargo.toml

    - name: Provision native dependencies
      if: inputs.setup == 'shell' || inputs.notices == 'true'
      shell: bash
      run: cargo fetch --locked --manifest-path lycaon-den/src-tauri/Cargo.toml

    - name: Install frontend dependencies
      shell: bash
      working-directory: lycaon-den
      run: bun install --frozen-lockfile

    # The notices script pins both tools; cargo-about otherwise compiles from source on every runner.
    - name: Restore notices tools
      if: inputs.setup == 'shell' || inputs.notices == 'true'
      uses: ./.github/actions/cache-notices-tools

    # Preparation writes resources into this checkout; verification checks use isolated snapshots.
    - name: Prepare shell resource notices
      if: inputs.setup == 'shell'
      shell: bash
      run: ./task setup-dev -- --shell-resources

    # The lane's own licenses:notices check generates them; an offline lane needs only the tools.
    - name: Provision notices tools
      if: inputs.setup != 'shell' && inputs.notices == 'true'
      shell: bash
      run: ./task setup-dev -- --notices-tools

    # Offline lanes cannot reach the module proxy, so a cache miss builds the analyzers here.
    - name: Provision analysis tools
      if: inputs.analysis != 'none'
      shell: bash
      env:
        TOOLS: ${{ inputs.analysis }}
      run: python3 scripts/analysis_tools.py ensure "$TOOLS"

    - name: Restore lint diagnostics
      if: runner.os == 'Linux' && (inputs.analysis == 'lint' || inputs.analysis == 'all')
      uses: ./.github/actions/cache-lint-diagnostics

    - name: Set up WebKitGTK accessibility images
      if: inputs.containers == 'true'
      uses: ./.github/actions/setup-webkit-atspi-images

    - name: Install native repository tools
      if: runner.os == 'Linux' && inputs.repository-tools == 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y --no-install-recommends apt-utils createrepo-c gnupg libarchive-tools makepkg rpm

    - name: Provision pinned browser
      if: inputs.browser == 'true'
      shell: bash
      run: ./task test:confine:linux -- --prepare

    - name: Provision pinned Nix and locked inputs
      if: inputs.nix == 'true'
      shell: bash
      run: ./task nix:check -- --prepare

    - name: Save pinned frontend packages
      if: inputs.save-caches == 'true' && github.ref == 'refs/heads/main'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.bun-version', 'lycaon-den/bun.lock') }}
