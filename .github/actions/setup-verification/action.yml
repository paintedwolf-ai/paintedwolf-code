name: Set up verification
description: Install pinned toolchains and dependencies for hosted verification
inputs:
  setup:
    description: >-
      What the lane builds: verification (shared toolchains), shell (also the Tauri
      shell and its staged engine), or harness (the Den Rust workspace and harness
      stack, without the shell's packaging inputs)
    default: verification
    required: false
outputs:
  artifact-root:
    description: Checkout artifact directory
    value: ${{ steps.paths.outputs.artifact-root }}
runs:
  using: composite
  steps:
    - name: Resolve artifact directory
      id: paths
      shell: bash
      run: echo "artifact-root=$(python3 scripts/artifact_paths.py artifacts "$GITHUB_WORKSPACE")" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: lycaon/go.mod
        cache-dependency-path: |
          lycaon/go.sum
          scripts/commentlint/go.sum

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      with:
        bun-version-file: .bun-version

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version

    - name: Install the pinned Rust toolchain
      shell: bash
      run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal

    - name: Install Tauri Linux build dependencies
      if: runner.os == 'Linux' && inputs.setup == 'shell'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
          libjavascriptcoregtk-4.1-dev librsvg2-dev patchelf

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      if: inputs.setup != 'verification'
      with:
        # Source snapshots build into lycaon-den/target.
        workspaces: lycaon-den/src-tauri -> ../target

    - name: Restore the decision engine build
      if: runner.os == 'macOS' && inputs.setup == 'shell'
      uses: ./.github/actions/cache-decide

    - name: Set up maintained OpenGrep
      uses: ./.github/actions/setup-opengrep

    # Source-scanning frontend tests shell out to ripgrep.
    - name: Install ripgrep
      if: inputs.setup != 'harness'
      shell: bash
      run: |
        set -euo pipefail
        command -v rg >/dev/null && exit 0
        if [[ "${RUNNER_OS}" == macOS ]]; then
          HOMEBREW_NO_AUTO_UPDATE=1 brew install ripgrep
        else
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ripgrep
        fi

    # Git integration tests resolve the pinned engine from engine-root.
    - name: Fetch pinned git engine
      shell: bash
      run: ./task gitengine:fetch

    - name: Install frontend dependencies
      shell: bash
      working-directory: lycaon-den
      run: bun install --frozen-lockfile

    - name: Resolve tool directory
      id: tools
      shell: bash
      run: echo "bin=$(python3 scripts/artifact_paths.py bin)" >> "$GITHUB_OUTPUT"

    # The notices script pins both tools; cargo-about otherwise compiles from source on every runner.
    - name: Restore license tools
      if: inputs.setup != 'harness'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ steps.tools.outputs.bin }}/go-licenses
          ${{ steps.tools.outputs.bin }}/cargo-about
        key: license-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/licenses-notices.sh') }}

    - name: Generate third-party notices
      if: inputs.setup != 'harness'
      shell: bash
      run: ./task licenses:notices
