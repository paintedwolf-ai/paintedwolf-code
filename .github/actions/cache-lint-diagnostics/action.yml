name: Cache lint diagnostics
description: Restore the golangci-lint results that main's newest warm run recorded
inputs:
  save:
    description: Publish this run's diagnostics on main
    default: 'false'
runs:
  using: composite
  steps:
    # Diagnostics record absolute paths, so they are cached for the source slot a lane verifies in.
    - name: Resolve lint diagnostics cache
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        printf 'cache=%s\n' "$(bash scripts/test-source-snapshot.sh diagnostics-cache)" >> "${GITHUB_OUTPUT}"
        printf 'prefix=lint-diagnostics-%s-%s-%s-\n' "${RUNNER_OS}" "${RUNNER_ARCH}" "$(python3 scripts/analysis_tools.py key lint)" >> "${GITHUB_OUTPUT}"

    # A prefix restore takes the newest maintenance source.
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.cache }}
        key: ${{ steps.paths.outputs.prefix }}${{ github.sha }}
        restore-keys: ${{ inputs.save != 'true' && steps.paths.outputs.prefix || '' }}
        lookup-only: ${{ inputs.save == 'true' }}

    - if: ${{ inputs.save == 'true' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.paths.outputs.cache }}
        key: ${{ steps.paths.outputs.prefix }}${{ github.sha }}

    - name: Report lint diagnostics lookup
      shell: bash
      env:
        CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
      run: |
        result=miss
        [[ "$CACHE_HIT" != true ]] || result='exact hit'
        printf '\nLint diagnostics: %s.\n' "$result" >> "$GITHUB_STEP_SUMMARY"
