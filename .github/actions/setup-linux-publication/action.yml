name: Set up Linux publication tools
description: Prepare the pinned tools used by protected Linux admission and document publication
inputs:
  controller_root:
    description: Checkout of the protected controller owning the tool and dependency pins
    required: true
  signing:
    description: Prepare the pinned Bun and frozen frontend dependencies for feed signing
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - name: Validate the fixed publication tool context
      shell: bash
      env:
        CONTROLLER_ROOT: ${{ inputs.controller_root }}
        SIGNING: ${{ inputs.signing }}
      run: |
        set -euo pipefail
        [[ "$RUNNER_ENVIRONMENT" == github-hosted && "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 ]]
        case "$SIGNING" in true|false) ;; *) exit 1 ;; esac
        test -f "$CONTROLLER_ROOT/lycaon/go.mod"
        if [[ "$SIGNING" == true ]]; then test -f "$CONTROLLER_ROOT/.bun-version"; fi
    - uses: actions/setup-go@5064d95ba18d4a9dda7c4cc67adeb03aea1a2a14 # v7.0.0
      with:
        go-version-file: ${{ inputs.controller_root }}/lycaon/go.mod
        cache: false
    - name: Install repository signature verification tools
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update
        sudo apt-get install -y gnupg rpm zstd libarchive-tools minisign
    - name: Install the pinned Nix cache verifier
      shell: bash
      run: |
        set -euo pipefail
        [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
        test ! -e /nix
        install_root="$RUNNER_TEMP/linux-publication-nix"
        mkdir "$install_root"
        archive=nix-2.35.3-x86_64-linux.tar.xz
        curl --fail --location --connect-timeout 15 --max-time 300 \
          "https://releases.nixos.org/nix/nix-2.35.3/$archive" --output "$install_root/$archive"
        printf '%s  %s\n' 6ce3ce3703fdc241b560cba401c5d338042122fe5b1a81e07bf1a623f259eba0 "$install_root/$archive" | sha256sum --check
        tar -xJf "$install_root/$archive" -C "$install_root"
        printf 'sandbox = true\ntrusted-users = root\n' > "$install_root/nix.conf"
        "$install_root/nix-2.35.3-x86_64-linux/install" --daemon --yes \
          --daemon-user-count 4 --no-channel-add --no-modify-profile \
          --nix-extra-conf-file "$install_root/nix.conf"
        printf '%s\n' /nix/var/nix/profiles/default/bin >> "$GITHUB_PATH"
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      if: inputs.signing == 'true'
      with:
        bun-version-file: ${{ inputs.controller_root }}/.bun-version
    - name: Prepare the protected feed signer dependencies
      if: inputs.signing == 'true'
      shell: bash
      working-directory: ${{ inputs.controller_root }}/lycaon-den
      run: bun install --frozen-lockfile
