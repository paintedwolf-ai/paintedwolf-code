name: Cache release build
description: Reuse the release-mode Go, Tauri, and notices tool builds that main warms for tag releases
inputs:
  save:
    description: Save the caches after the job (main only); tag releases restore without saving
    default: 'false'
outputs:
  cache-hit:
    description: Whether the exact key for the current toolchains and dependency locks was restored
    value: ${{ steps.save.outputs.cache-hit || steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Resolve release build paths
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        {
          printf 'gocache=%s\n' "$(go env GOCACHE)"
          printf 'gomodcache=%s\n' "$(go env GOMODCACHE)"
          printf 'build_key=release-build-%s-%s-%s-\n' "${RUNNER_OS}" "${RUNNER_ARCH}" "${DEVELOPER_DIR:-}"
        } >> "${GITHUB_OUTPUT}"

    - uses: ./.github/actions/cache-notices-tools
      with:
        save: ${{ inputs.save }}

    # Keys follow the toolchains and dependency locks, so main saves once per
    # change instead of once per commit; a release recompiles only its own
    # packages and crate. Saving starts clean so superseded dependencies do not
    # accumulate. Compiler caches are content-checked, so a tag release may
    # start from an older entry.
    - if: ${{ inputs.save == 'true' }}
      id: save
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ${{ steps.paths.outputs.gocache }}
          ${{ steps.paths.outputs.gomodcache }}
          lycaon-den/src-tauri/target
          !lycaon-den/src-tauri/target/*/release/bundle
        key: ${{ steps.paths.outputs.build_key }}${{ hashFiles('rust-toolchain.toml', 'lycaon/go.mod', 'lycaon/go.sum', 'lycaon-den/src-tauri/Cargo.lock') }}
    - if: ${{ inputs.save != 'true' }}
      id: restore
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ${{ steps.paths.outputs.gocache }}
          ${{ steps.paths.outputs.gomodcache }}
          lycaon-den/src-tauri/target
          !lycaon-den/src-tauri/target/*/release/bundle
        key: ${{ steps.paths.outputs.build_key }}${{ hashFiles('rust-toolchain.toml', 'lycaon/go.mod', 'lycaon/go.sum', 'lycaon-den/src-tauri/Cargo.lock') }}
        restore-keys: ${{ steps.paths.outputs.build_key }}
