name: Cache release build
description: Reuse the release-mode Go, Tauri, and notices tool builds that main warms for tag releases
inputs:
  save:
    description: Save the caches after the job (main only); tag releases restore without saving
    default: 'false'
runs:
  using: composite
  steps:
    - name: Resolve release build paths
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        bin="$(python3 scripts/artifact_paths.py bin "${GITHUB_WORKSPACE}")"
        {
          printf 'gocache=%s\n' "$(go env GOCACHE)"
          printf 'gomodcache=%s\n' "$(go env GOMODCACHE)"
          printf 'bin=%s\n' "${bin}"
          printf 'build_key=release-build-%s-%s-%s-\n' "${RUNNER_OS}" "${RUNNER_ARCH}" "${DEVELOPER_DIR:-}"
        } >> "${GITHUB_OUTPUT}"

    # The notices script reuses any installed tool, so only its exact pins restore.
    - if: ${{ inputs.save == 'true' }}
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ${{ steps.paths.outputs.bin }}/cargo-about
          ${{ steps.paths.outputs.bin }}/go-licenses
        key: notices-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/licenses-notices.sh', 'rust-toolchain.toml', 'lycaon/go.mod') }}
    - if: ${{ inputs.save != 'true' }}
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ${{ steps.paths.outputs.bin }}/cargo-about
          ${{ steps.paths.outputs.bin }}/go-licenses
        key: notices-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/licenses-notices.sh', 'rust-toolchain.toml', 'lycaon/go.mod') }}

    # Compiler caches are content-checked, so any earlier main commit is a safe
    # starting point; each main commit saves its own entry.
    - if: ${{ inputs.save == 'true' }}
      uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ${{ steps.paths.outputs.gocache }}
          ${{ steps.paths.outputs.gomodcache }}
          lycaon-den/src-tauri/target
          !lycaon-den/src-tauri/target/*/release/bundle
        key: ${{ steps.paths.outputs.build_key }}${{ hashFiles('rust-toolchain.toml', 'lycaon/go.sum', 'lycaon-den/src-tauri/Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          ${{ steps.paths.outputs.build_key }}${{ hashFiles('rust-toolchain.toml', 'lycaon/go.sum', 'lycaon-den/src-tauri/Cargo.lock') }}-
          ${{ steps.paths.outputs.build_key }}
    - if: ${{ inputs.save != 'true' }}
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ${{ steps.paths.outputs.gocache }}
          ${{ steps.paths.outputs.gomodcache }}
          lycaon-den/src-tauri/target
          !lycaon-den/src-tauri/target/*/release/bundle
        key: ${{ steps.paths.outputs.build_key }}${{ hashFiles('rust-toolchain.toml', 'lycaon/go.sum', 'lycaon-den/src-tauri/Cargo.lock') }}-${{ github.sha }}
        restore-keys: |
          ${{ steps.paths.outputs.build_key }}${{ hashFiles('rust-toolchain.toml', 'lycaon/go.sum', 'lycaon-den/src-tauri/Cargo.lock') }}-
          ${{ steps.paths.outputs.build_key }}
