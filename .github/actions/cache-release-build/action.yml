name: Cache release build
description: Reuse shared Go builds and release-mode Tauri builds warmed on main
inputs:
  lookup-only:
    description: Check the exact native cache identity without restoring payloads
    default: 'false'
  save:
    description: Publish prepared caches on main; other calls restore without saving
    default: 'false'
outputs:
  cache-hit:
    description: Whether the exact key for the current toolchains and dependency locks was restored
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Resolve release build paths
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        {
          printf 'build_key=release-build-%s-%s-%s-\n' "${RUNNER_OS}" "${RUNNER_ARCH}" "${DEVELOPER_DIR:-}"
        } >> "${GITHUB_OUTPUT}"

    # Cargo validates compiler inputs restored from an earlier lockfile generation.
    - id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          lycaon-den/src-tauri/target
          !lycaon-den/src-tauri/target/*/release/bundle
        key: ${{ steps.paths.outputs.build_key }}${{ hashFiles('rust-toolchain.toml', 'lycaon-den/src-tauri/Cargo.lock', 'lycaon/internal/platformfloor/macos_floor.txt', 'scripts/ci_policy/cache_payload.py', 'scripts/warm-release-build.sh') }}
        lookup-only: ${{ inputs.lookup-only == 'true' || inputs.save == 'true' }}
        restore-keys: ${{ inputs.save != 'true' && inputs.lookup-only != 'true' && steps.paths.outputs.build_key || '' }}
    - if: ${{ inputs.save == 'true' && github.ref == 'refs/heads/main' && steps.restore.outputs.cache-hit != 'true' }}
      id: save
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          lycaon-den/src-tauri/target
          !lycaon-den/src-tauri/target/*/release/bundle
        key: ${{ steps.paths.outputs.build_key }}${{ hashFiles('rust-toolchain.toml', 'lycaon-den/src-tauri/Cargo.lock', 'lycaon/internal/platformfloor/macos_floor.txt', 'scripts/ci_policy/cache_payload.py', 'scripts/warm-release-build.sh') }}
