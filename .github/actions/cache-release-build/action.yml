name: Cache release build
description: Reuse shared Go builds and release-mode Tauri builds warmed on main
inputs:
  save:
    description: Publish prepared caches on main; other calls restore without saving
    default: 'false'
outputs:
  cache-hit:
    description: Whether the exact key for the current toolchains and dependency locks was restored
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Resolve release build paths
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        {
          printf 'build_key=release-build-%s-%s-%s-\n' "${RUNNER_OS}" "${RUNNER_ARCH}" "${DEVELOPER_DIR:-}"
        } >> "${GITHUB_OUTPUT}"

    # Go compiler entries validate their inputs across verification and release.
    - uses: ./.github/actions/cache-go

    - uses: ./.github/actions/cache-notices-tools

    # Cargo validates compiler inputs restored from an earlier lockfile generation.
    - if: ${{ inputs.save == 'true' && github.ref == 'refs/heads/main' }}
      id: budget
      uses: ./.github/actions/cache-budget
      with:
        path: |
          lycaon-den/src-tauri/target
          !lycaon-den/src-tauri/target/*/release/bundle
        key: ${{ steps.paths.outputs.build_key }}${{ hashFiles('rust-toolchain.toml', 'lycaon-den/src-tauri/Cargo.lock', 'lycaon/internal/platformfloor/macos_floor.txt') }}
    - if: ${{ inputs.save == 'true' && github.ref == 'refs/heads/main' && steps.budget.outputs.allowed == 'true' }}
      id: save
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          lycaon-den/src-tauri/target
          !lycaon-den/src-tauri/target/*/release/bundle
        key: ${{ steps.paths.outputs.build_key }}${{ hashFiles('rust-toolchain.toml', 'lycaon-den/src-tauri/Cargo.lock', 'lycaon/internal/platformfloor/macos_floor.txt') }}
    - if: ${{ inputs.save != 'true' || github.ref != 'refs/heads/main' }}
      id: restore
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          lycaon-den/src-tauri/target
          !lycaon-den/src-tauri/target/*/release/bundle
        key: ${{ steps.paths.outputs.build_key }}${{ hashFiles('rust-toolchain.toml', 'lycaon-den/src-tauri/Cargo.lock', 'lycaon/internal/platformfloor/macos_floor.txt') }}
        restore-keys: ${{ steps.paths.outputs.build_key }}
