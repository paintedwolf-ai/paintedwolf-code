name: Cache Go builds
description: Restore the module and build caches that main warms for verification
inputs:
  save:
    description: Publish prepared caches (main only); the default restores without saving
    default: 'false'
  exact:
    description: Restore only the current module graph when preparing its main cache
    default: 'false'
outputs:
  cache-hit:
    description: Whether the exact key for the current module graph was restored
    value: ${{ steps.restore.outputs.cache-hit }}
runs:
  using: composite
  steps:
    - name: Resolve Go cache paths
      id: paths
      shell: bash
      run: |
        set -euo pipefail
        {
          printf 'gocache=%s\n' "$(go env GOCACHE)"
          printf 'gomodcache=%s\n' "$(go env GOMODCACHE)"
          printf 'key_prefix=go-%s-%s-%s-%s-\n' "${RUNNER_OS}" "${RUNNER_ARCH}" "${ImageOS:-}" "$(go env GOVERSION)"
        } >> "${GITHUB_OUTPUT}"

    # Keys follow the module graph, so main saves once per dependency change.
    # Saving starts clean rather than from an older entry, which would carry
    # superseded dependencies forward.
    - if: ${{ inputs.save == 'true' && github.ref == 'refs/heads/main' }}
      id: save
      uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ${{ steps.paths.outputs.gocache }}
          ${{ steps.paths.outputs.gomodcache }}
        key: ${{ steps.paths.outputs.key_prefix }}${{ hashFiles('lycaon/go.mod', 'lycaon/go.sum', 'scripts/commentlint/go.mod', 'scripts/commentlint/go.sum') }}
    - if: ${{ inputs.save != 'true' || github.ref != 'refs/heads/main' }}
      id: restore
      uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
      with:
        path: |
          ${{ steps.paths.outputs.gocache }}
          ${{ steps.paths.outputs.gomodcache }}
        key: ${{ steps.paths.outputs.key_prefix }}${{ hashFiles('lycaon/go.mod', 'lycaon/go.sum', 'scripts/commentlint/go.mod', 'scripts/commentlint/go.sum') }}
        restore-keys: ${{ inputs.exact != 'true' && steps.paths.outputs.key_prefix || '' }}
