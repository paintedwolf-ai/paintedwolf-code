name: release-system-live-test

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:
    inputs:
      mode:
        description: Isolated release surface to rehearse
        type: choice
        required: true
        default: updater
        options:
          - updater
          - native-repositories
          - pacman-repositories

permissions:
  contents: read

# Maintenance runs one workflow at a time; staggered schedules keep a pending run from being replaced.
concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  r2-release-controls:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'updater' }}
    runs-on: ubuntu-latest
    environment: release-rehearsal
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      - name: Install the pinned Tauri CLI for pointer signing
        run: bun install --frozen-lockfile
        working-directory: lycaon-den
      - name: Install minisign for cryptographic feed verification
        run: sudo apt-get update && sudo apt-get install -y minisign
      - name: Check S3 object transport
        run: aws --version

      - name: Exercise isolated R2 release system
        env:
          RELEASE_TEST_R2_ENDPOINT_URL: ${{ vars.RELEASE_TEST_R2_ENDPOINT_URL }}
          RELEASE_TEST_R2_ACCESS_KEY_ID: ${{ secrets.RELEASE_TEST_R2_ACCESS_KEY_ID }}
          RELEASE_TEST_R2_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_TEST_R2_SECRET_ACCESS_KEY }}
          RELEASE_TEST_R2_SESSION_TOKEN: ${{ secrets.RELEASE_TEST_R2_SESSION_TOKEN }}
          RELEASE_TEST_R2_BUCKET: ${{ vars.RELEASE_TEST_R2_BUCKET }}
          RELEASE_TEST_DOWNLOAD_BASE_URL: ${{ vars.RELEASE_TEST_DOWNLOAD_BASE_URL }}
        run: ./task release:live-test

  r2-native-repositories:
    needs: r2-release-controls
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode == 'native-repositories' }}
    strategy:
      max-parallel: 1
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    environment: release-rehearsal
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false

      - name: Install the native repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils rpm createrepo-c dnf libarchive-tools gnupg openssl

      - name: Exercise signed apt and dnf repositories under an isolated R2 prefix
        env:
          RELEASE_TEST_R2_ENDPOINT_URL: ${{ vars.RELEASE_TEST_R2_ENDPOINT_URL }}
          RELEASE_TEST_R2_ACCESS_KEY_ID: ${{ secrets.RELEASE_TEST_R2_ACCESS_KEY_ID }}
          RELEASE_TEST_R2_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_TEST_R2_SECRET_ACCESS_KEY }}
          RELEASE_TEST_R2_SESSION_TOKEN: ${{ secrets.RELEASE_TEST_R2_SESSION_TOKEN }}
          RELEASE_TEST_R2_BUCKET: ${{ vars.RELEASE_TEST_R2_BUCKET }}
          RELEASE_TEST_DOWNLOAD_BASE_URL: ${{ vars.RELEASE_TEST_DOWNLOAD_BASE_URL }}
          RECEIPT: ${{ runner.temp }}/native-repositories.json
        run: ./task release:rehearse:native-repositories-r2 -- --receipt "$RECEIPT"

      - name: Retain the native repository rehearsal receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-repository-rehearsal-${{ matrix.runner }}
          path: ${{ runner.temp }}/native-repositories.json
          if-no-files-found: warn

  r2-pacman-repositories:
    needs: [r2-release-controls, r2-native-repositories]
    if: ${{ always() && !cancelled() && github.event_name == 'workflow_dispatch' && inputs.mode == 'pacman-repositories' }}
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
    environment: release-rehearsal
    timeout-minutes: 30
    steps:
      - name: Prepare the isolated native Arch toolchain
        run: |
          pacman -Syu --noconfirm --needed base-devel python git openssl gnupg sudo unzip aws-cli-v2
          useradd --create-home pw-repository
          printf '%s\n' 'pw-repository ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/pw-repository
          chmod 0440 /etc/sudoers.d/pw-repository

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      - name: Prepare the unprivileged rehearsal owner
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          install -m 0755 "$(command -v bun)" /usr/local/bin/bun
          ln -sf /usr/local/bin/bun /usr/local/bin/bunx
          chown -R pw-repository:pw-repository "$WORKSPACE"

      - name: Exercise isolated signed pacman delivery
        env:
          RELEASE_TEST_R2_ENDPOINT_URL: ${{ vars.RELEASE_TEST_R2_ENDPOINT_URL }}
          RELEASE_TEST_R2_ACCESS_KEY_ID: ${{ secrets.RELEASE_TEST_R2_ACCESS_KEY_ID }}
          RELEASE_TEST_R2_SECRET_ACCESS_KEY: ${{ secrets.RELEASE_TEST_R2_SECRET_ACCESS_KEY }}
          RELEASE_TEST_R2_SESSION_TOKEN: ${{ secrets.RELEASE_TEST_R2_SESSION_TOKEN }}
          RELEASE_TEST_R2_BUCKET: ${{ vars.RELEASE_TEST_R2_BUCKET }}
          RELEASE_TEST_DOWNLOAD_BASE_URL: ${{ vars.RELEASE_TEST_DOWNLOAD_BASE_URL }}
        run: |
          sudo -H --preserve-env=PATH,RELEASE_TEST_R2_ENDPOINT_URL,RELEASE_TEST_R2_ACCESS_KEY_ID,RELEASE_TEST_R2_SECRET_ACCESS_KEY,RELEASE_TEST_R2_SESSION_TOKEN,RELEASE_TEST_R2_BUCKET,RELEASE_TEST_DOWNLOAD_BASE_URL \
            -u pw-repository ./task release:rehearse:pacman-repositories-r2 -- --receipt /tmp/pacman-repositories.json

      - name: Retain the pacman repository rehearsal receipt
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pacman-repository-rehearsal
          path: /tmp/pacman-repositories.json
          if-no-files-found: warn
