name: release-system-live-test

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Maintenance runs one workflow at a time; staggered schedules keep a pending run from being replaced.
concurrency:
  group: maintenance
  cancel-in-progress: false

jobs:
  r2-release-controls:
    runs-on: ubuntu-latest
    environment: release-rehearsal
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      - name: Install the pinned Tauri CLI for pointer signing
        run: bun install --frozen-lockfile
        working-directory: lycaon-den
      - name: Install minisign for cryptographic feed verification
        run: sudo apt-get update && sudo apt-get install -y minisign

      - name: Exercise isolated R2 release system
        env:
          RELEASE_TEST_R2_ACCOUNT_ID: ${{ vars.RELEASE_TEST_R2_ACCOUNT_ID }}
          RELEASE_TEST_R2_API_TOKEN: ${{ secrets.RELEASE_TEST_R2_API_TOKEN }}
          RELEASE_TEST_R2_BUCKET: ${{ vars.RELEASE_TEST_R2_BUCKET }}
          RELEASE_TEST_DOWNLOAD_BASE_URL: ${{ vars.RELEASE_TEST_DOWNLOAD_BASE_URL }}
        run: ./task release:live-test
