name: issue-stale

# Marks long-inactive issues `stale` and nothing else. issue-sweep owns the `stale` grace
# period and the close. Pull requests are not marked.

on:
  schedule:
    # 09:00 UTC on Mondays. Inactivity is a weekly-granularity signal.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      debug_only:
        description: "Log what would be marked without writing anything"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 90
          # issue-sweep closes `stale` after its own grace period.
          days-before-close: -1
          # Issues only.
          days-before-pr-stale: -1
          days-before-pr-close: -1
          stale-issue-label: "stale"
          stale-issue-message: >-
            This has had no activity for 90 days, so it is being marked stale to keep the
            tracker honest about what is actually being worked on. If it still matters, a
            comment removes the label — including just "still happening on <version>".
            If it stopped happening, feel free to close it yourself.
          # One human reply exempts the issue permanently.
          labels-to-add-when-unstale: "never-stale"
          exempt-issue-labels: "never-stale,accepting-work,security"
          exempt-all-issue-assignees: true
          ascending: true
          operations-per-run: 300
          enable-statistics: true
          debug-only: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_only || 'false' }}
