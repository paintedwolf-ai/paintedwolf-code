name: issue-stale

# Marks long-inactive issues `stale` and nothing else. issue-sweep owns the `stale` grace
# period and the close. Pull requests are not marked.

on:
  schedule:
    # 09:00 UTC on Mondays. Inactivity is a weekly-granularity signal.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      debug_only:
        description: "Log what would be marked without writing anything"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

env:
  ISSUE_AUTOMATION_EXEMPT_USERS: ${{ vars.ISSUE_AUTOMATION_EXEMPT_USERS }}

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          DEBUG_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_only || 'false' }}
        with:
          script: |
            const { markStale } = require("./.github/scripts/issue-policy.cjs");
            await markStale({ github, context, core });
