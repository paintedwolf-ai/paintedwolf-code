name: issue-stale

# Marks long-inactive issues `stale` and nothing else. issue-sweep owns the `stale` grace
# period and the close. Pull requests are not marked.

on:
  schedule:
    # 09:00 UTC on Mondays. Inactivity is a weekly-granularity signal.
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      debug_only:
        description: "Log what would be marked without writing anything"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

# Maintenance runs one workflow at a time; staggered schedules keep a pending run from being replaced.
concurrency:
  group: maintenance
  cancel-in-progress: false

env:
  ISSUE_AUTOMATION_EXEMPT_USERS: ${{ vars.ISSUE_AUTOMATION_EXEMPT_USERS }}

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          DEBUG_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.debug_only || 'false' }}
        with:
          script: |
            const { markStale } = require("./.github/scripts/issue-policy.cjs");
            await markStale({ github, context, core });
