name: release secrets check

# Proves the publication credentials work before a release needs them. Storage
# receives one test object under release-system-tests/, deleted at once; the tap
# and the website are only probed.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    environment: release-publication
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify publication credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          WWW_DISPATCH_TOKEN: ${{ secrets.WWW_DISPATCH_TOKEN }}
          DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL }}
        run: |
          set -uo pipefail
          failed=0
          report() {
            if [[ "$2" == ok ]]; then echo "ok: $1"; else echo "::error title=$1::$2"; failed=1; fi
          }
          present() { [[ -n "${!1:-}" ]] && report "$1 is set" ok || report "$1 is set" "missing"; }
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN R2_BUCKET HOMEBREW_TAP_TOKEN HOMEBREW_TAP_REPO WWW_DISPATCH_TOKEN; do
            present "$name"
          done
          [[ "${DOWNLOAD_BASE_URL:-}" == https://downloads.paintedwolf.dev ]] \
            && report "DOWNLOAD_BASE_URL" ok || report "DOWNLOAD_BASE_URL" "expected https://downloads.paintedwolf.dev"

          # The release lists and writes objects through this same API.
          listing="$(curl -sS --max-time 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects?per_page=1")"
          if jq -e '.success == true' <<<"${listing}" >/dev/null 2>&1; then
            report "Cloudflare token lists the R2 bucket" ok
          else
            report "Cloudflare token lists the R2 bucket" "$(jq -c '.errors // .' <<<"${listing}" 2>/dev/null | head -c 300)"
          fi

          # Write, read back, and delete one object under the isolated test prefix.
          objects="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects"
          key="release-system-tests/secrets-check/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.txt"
          body="secrets check ${GITHUB_RUN_ID}"
          put="$(curl -sS --max-time 30 -X PUT -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: text/plain" --data-binary "${body}" "${objects}/${key}")"
          if jq -e '.success == true' <<<"${put}" >/dev/null 2>&1; then
            report "Cloudflare token writes to the R2 bucket" ok
            read_back="$(curl -sS --max-time 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${objects}/${key}")"
            [[ "${read_back}" == "${body}" ]] && report "written object reads back" ok \
              || report "written object reads back" "content differs"
            removed="$(curl -sS --max-time 30 -X DELETE -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "${objects}/${key}")"
            jq -e '.success == true' <<<"${removed}" >/dev/null 2>&1 && report "test object deleted" ok \
              || report "test object deleted" "$(jq -c '.errors // .' <<<"${removed}" 2>/dev/null | head -c 300)"
          else
            report "Cloudflare token writes to the R2 bucket" "$(jq -c '.errors // .' <<<"${put}" 2>/dev/null | head -c 300)"
          fi

          # A push-capable token is admitted to the receive-pack advertisement.
          can_push() {
            curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -u "x-access-token:$2" \
              "https://github.com/$1.git/info/refs?service=git-receive-pack"
          }
          status="$(can_push "${HOMEBREW_TAP_REPO}" "${HOMEBREW_TAP_TOKEN}")"
          [[ "${status}" == 200 ]] && report "tap token can push ${HOMEBREW_TAP_REPO}" ok \
            || report "tap token can push ${HOMEBREW_TAP_REPO}" "HTTP ${status}"
          status="$(can_push paintedwolf-ai/paintedwolf-www "${WWW_DISPATCH_TOKEN}")"
          [[ "${status}" == 200 ]] && report "website token can dispatch to paintedwolf-ai/paintedwolf-www" ok \
            || report "website token can dispatch to paintedwolf-ai/paintedwolf-www" "HTTP ${status}"
          exit "${failed}"

      # Release archives exceed wrangler's 300 MiB limit and take the S3 path.
      - name: Write, re-put, and delete a large immutable object
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL }}
        run: |
          set -euo pipefail
          file="${RUNNER_TEMP}/large.bin"
          head -c 419430400 /dev/urandom > "${file}"
          key="release-system-tests/secrets-check/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-large.bin"
          bash scripts/release-r2-immutable-put.sh --key "${key}" --file "${file}"
          bash scripts/release-r2-immutable-put.sh --key "${key}" --file "${file}"
          # Same read-back as the release's public-domain verification.
          started="$(date +%s)"
          curl --fail --silent --show-error --location --connect-timeout 10 --max-time 300 \
            -H 'Cache-Control: no-cache' "${DOWNLOAD_BASE_URL}/${key}?release_verify=${GITHUB_RUN_ID}" \
            --output "${RUNNER_TEMP}/public.bin"
          cmp "${file}" "${RUNNER_TEMP}/public.bin"
          echo "ok: public read-back matched in $(( $(date +%s) - started ))s"
          head -c 1 /dev/urandom >> "${file}"
          if bash scripts/release-r2-immutable-put.sh --key "${key}" --file "${file}"; then
            echo "::error title=large object::different bytes were accepted for an existing key"
            exit 1
          fi
          source scripts/release-r2-rest.sh
          r2_s3_require_env
          aws s3 rm "s3://${R2_BUCKET}/${key}" --endpoint-url "${R2_S3_ENDPOINT}" --only-show-errors
          echo "ok: large immutable object created, accepted identical, refused different, deleted"
