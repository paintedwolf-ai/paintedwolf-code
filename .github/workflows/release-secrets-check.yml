name: release secrets check

# Read-only proof that the publication credentials work before a release needs
# them. Nothing is written to storage, the tap, or the website.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    environment: release-publication
    timeout-minutes: 10
    steps:
      - name: Verify publication credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_REPO: ${{ vars.HOMEBREW_TAP_REPO }}
          WWW_DISPATCH_TOKEN: ${{ secrets.WWW_DISPATCH_TOKEN }}
          DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL }}
        run: |
          set -uo pipefail
          failed=0
          report() {
            if [[ "$2" == ok ]]; then echo "ok: $1"; else echo "::error title=$1::$2"; failed=1; fi
          }
          present() { [[ -n "${!1:-}" ]] && report "$1 is set" ok || report "$1 is set" "missing"; }
          for name in CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN R2_BUCKET HOMEBREW_TAP_TOKEN HOMEBREW_TAP_REPO WWW_DISPATCH_TOKEN; do
            present "$name"
          done
          [[ "${DOWNLOAD_BASE_URL:-}" == https://downloads.paintedwolf.dev ]] \
            && report "DOWNLOAD_BASE_URL" ok || report "DOWNLOAD_BASE_URL" "expected https://downloads.paintedwolf.dev"

          # The release lists and writes objects through this same API.
          listing="$(curl -sS --max-time 30 -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets/${R2_BUCKET}/objects?per_page=1")"
          if jq -e '.success == true' <<<"${listing}" >/dev/null 2>&1; then
            report "Cloudflare token lists the R2 bucket" ok
          else
            report "Cloudflare token lists the R2 bucket" "$(jq -c '.errors // .' <<<"${listing}" 2>/dev/null | head -c 300)"
          fi

          # A push-capable token is admitted to the receive-pack advertisement.
          can_push() {
            curl -sS -o /dev/null -w '%{http_code}' --max-time 30 -u "x-access-token:$2" \
              "https://github.com/$1.git/info/refs?service=git-receive-pack"
          }
          status="$(can_push "${HOMEBREW_TAP_REPO}" "${HOMEBREW_TAP_TOKEN}")"
          [[ "${status}" == 200 ]] && report "tap token can push ${HOMEBREW_TAP_REPO}" ok \
            || report "tap token can push ${HOMEBREW_TAP_REPO}" "HTTP ${status}"
          status="$(can_push paintedwolf-ai/paintedwolf-www "${WWW_DISPATCH_TOKEN}")"
          [[ "${status}" == 200 ]] && report "website token can dispatch to paintedwolf-ai/paintedwolf-www" ok \
            || report "website token can dispatch to paintedwolf-ai/paintedwolf-www" "HTTP ${status}"
          exit "${failed}"
