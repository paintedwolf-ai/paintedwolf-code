name: lycaon-den

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lycaon-den-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vitest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install dependencies
        working-directory: lycaon-den
        run: bun install --frozen-lockfile

      # CI/check owns typechecking and the complete Vitest suite. The required e2e
      # check depends on this job.
      - name: Frontend seam canaries
        timeout-minutes: 30
        run: ./task den:test:fast

      - uses: ./.github/actions/verification-evidence
        if: always()
        timeout-minutes: 5
        with:
          name: frontend-canaries-${{ github.run_attempt }}
          status: ${{ job.status }}

  playwright-web:
    name: playwright-web (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache-dependency-path: lycaon/go.sum

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install frontend dependencies
        working-directory: lycaon-den
        run: bun install --frozen-lockfile

      # The containers' engine runs the maintained scanner.
      - name: Set up maintained OpenGrep
        uses: ./.github/actions/setup-opengrep

      - name: Playwright web E2E (Tier B)
        timeout-minutes: 40
        env:
          # Keep traces and reports on disk so the failure-upload step below
          # can capture them; the cleanup trap otherwise deletes them.
          LYCAON_E2E_KEEP_ARTIFACTS: "1"
          LYCAON_E2E_JOB_SHARD: ${{ matrix.shard }}/3
        run: ./task e2e:den

      - uses: ./.github/actions/verification-evidence
        if: always()
        timeout-minutes: 5
        with:
          name: playwright-web-${{ matrix.shard }}-${{ github.run_attempt }}
          status: ${{ job.status }}

      - name: E2E cleanup
        timeout-minutes: 5
        if: always()
        run: ./task e2e:cleanup

  playwright-desktop:
    uses: ./.github/workflows/desktop-verification.yml

  # The required branch check; it always runs.
  e2e:
    if: always()
    needs: [vitest, playwright-web, playwright-desktop]
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every Den and end-to-end tier
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_verification.py gate
