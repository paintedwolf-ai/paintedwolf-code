name: dependency inventory

# Re-queries upstream versions weekly and commits the regenerated inventory.
# Pull requests keep the offline inventory current through check:drift.
on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-inventory
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: lycaon/go.mod
          cache-dependency-path: lycaon/go.sum

      - name: Refresh upstream versions and regenerate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./task codegen:dependency-inventory:upstream

      # main-protection lets GitHub Actions push this generated commit.
      - name: Commit generated files
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -- docs/operations/dependency-inventory.md dependencies/upstream.json .github/dependabot.yml
          git diff --cached --quiet && exit 0
          git commit -s -m "deps: refresh dependency inventory"
          git pull --rebase
          git push
