name: issue-intake

# Checks that an issue carries the machine-generated facts the forms ask for, and
# routes it by area. It labels and comments; closing belongs to issue-sweep.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

env:
  ISSUE_AUTOMATION_EXEMPT_USERS: ${{ vars.ISSUE_AUTOMATION_EXEMPT_USERS }}

jobs:
  intake:
    if: github.event.action == 'opened' || github.event.changes.body != null
    concurrency:
      group: issue-intake-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const { data: issue } = await github.rest.issues.get({
              ...context.repo, issue_number: context.payload.issue.number,
            });
            const { isExempt } = require("./.github/scripts/issue-policy.cjs");
            if (issue.state !== "open" || isExempt(issue)) return;
            const body = issue.body || "";

            // Issue forms render as "### <label>" followed by the value. Pull one section out
            // by heading so a reordered form does not silently change what we validate.
            const section = (heading) => {
              const lines = body.split(/\r?\n/);
              const start = lines.findIndex(
                (l) => l.trim().toLowerCase() === `### ${heading}`.toLowerCase(),
              );
              if (start === -1) return null;
              const rest = lines.slice(start + 1);
              const end = rest.findIndex((l) => l.startsWith("### "));
              return (end === -1 ? rest : rest.slice(0, end)).join("\n").trim();
            };

            const addLabels = async (labels) => {
              if (!labels.length) return;
              try {
                await github.rest.issues.addLabels({
                  ...context.repo, issue_number: issue.number, labels,
                });
              } catch (err) {
                // A label that does not exist yet must not fail intake for everything else.
                core.warning(`could not add ${labels.join(", ")}: ${err.message}`);
              }
            };

            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: issue.number, per_page: 100,
            });
            const marker = (kind) => `<!-- paintedwolf-intake:${kind} -->`;
            const previous = (kind) => comments.find(
              (c) => c.user?.login === "github-actions[bot]" && c.body?.includes(marker(kind)),
            );
            const comment = async (text, kind = "info") => {
              const body = `${marker(kind)}\n${text}`;
              const existing = previous(kind);
              if (existing?.body === body) return;
              if (existing) {
                await github.rest.issues.updateComment({
                  ...context.repo, comment_id: existing.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: issue.number, body,
                });
              }
            };
            const latestInfoEvent = async () => {
              const events = await github.paginate(github.rest.issues.listEvents, {
                ...context.repo, issue_number: issue.number, per_page: 100,
              });
              return events.filter(
                (e) => ["labeled", "unlabeled"].includes(e.event) && e.label?.name === "needs-info",
              ).at(-1);
            };
            const needsInfo = async (text) => {
              let eventId = previous("info")?.body.match(/<!-- intake-label:(\d+) -->/)?.[1];
              if (!issue.labels.some((l) => l.name === "needs-info")) {
                await addLabels(["needs-info"]);
                const event = await latestInfoEvent();
                eventId = event?.event === "labeled" && event.actor?.login === "github-actions[bot]"
                  ? String(event.id) : undefined;
              }
              await comment(`${text}${eventId ? `\n<!-- intake-label:${eventId} -->` : ""}`);
            };
            const resolveInfo = async () => {
              const existing = previous("info");
              if (!existing) return;
              const eventId = existing.body.match(/<!-- intake-label:(\d+) -->/)?.[1];
              if (eventId) {
                const event = await latestInfoEvent();
                // A maintainer's later label application belongs to that maintainer.
                if (event?.event === "labeled" && String(event.id) === eventId) {
                  await github.rest.issues.removeLabel({
                    ...context.repo, issue_number: issue.number, name: "needs-info",
                  });
                }
              }
              await comment("The required intake information is now complete. Thanks for updating the report.");
            };

            // The chooser can be bypassed by navigating straight to /issues/new, so a body-less
            // issue is expected rather than exceptional.
            if (body.trim().length < 30) {
              const chooser =
                `https://github.com/${context.repo.owner}/${context.repo.repo}/issues/new/choose`;
              await needsInfo(
                [
                  "Thanks for opening this. This tracker uses issue forms, and it looks like this",
                  "one was filed without going through them.",
                  "",
                  `Please open a new issue from the [issue chooser](${chooser}) and pick`,
                  "the form that fits — the fields it asks for are the ones needed to act on a report.",
                  "This issue will be closed automatically if there is no activity; that is queue",
                  "management, not a verdict on the problem you hit.",
                ].join("\n"),
              );
              return;
            }

            const labels = [];
            const missing = [];

            const searched = "I searched existing issues and this is not already reported.";
            const publicCode = "Nothing I am pasting below contains secrets, credentials, or code I cannot publish. This issue will be public forever.";
            const preflights = {
              bug: [searched, "This is one bug. I will file separate reports for separate bugs.",
                "I reproduced this on the latest release.", publicCode],
              launch: [searched, "Nothing I am pasting below contains secrets or credentials. This issue will be public forever."],
              agent: ["This is not a containment escape. The agent stayed inside the permissions it was granted.",
                searched, "I understand a one-off mistake from a model I chose may be closed as expected behaviour.", publicCode],
              website: [],
            };
            const form = section("Page URL") !== null && section("What is wrong") !== null ? "website"
              : section("Model and provider") !== null || issue.labels.some((l) => l.name === "agent-behavior") ? "agent"
              : section("Version you tried to install") !== null ? "launch" : "bug";
            const confirmed = new Set(
              [...(section("Before you file") || "").matchAll(/^\s*- \[x\] (.+)$/gim)]
                .map((m) => m[1].trim()),
            );
            const unconfirmed = preflights[form].filter((text) => !confirmed.has(text));
            if (unconfirmed.length) {
              missing.push(`every **Before you file** checkbox present and confirmed (${unconfirmed.length} missing or unchecked)`);
            }

            // System information is machine-generated with a fixed shape.
            const systemInfo = section("System information");
            if (systemInfo !== null) {
              if (!/^\s*app version:/m.test(systemInfo)) missing.push("`app version:`");
              if (!/^\s*den version:/m.test(systemInfo)) missing.push("`den version:`");
            }

            // Report id: the saved bundle filename. Checked for shape only — the file itself
            // must never be attached to a public issue.
            const reportId = section("Report id");
            if (reportId !== null && !/diagnostics-\d{8}-\d{6}/.test(reportId)) {
              missing.push("a support-bundle filename in the **Report id** field");
            }

            // Agent-behaviour reports cannot be acted on without the model. The form requires
            // it; this catches a bypassed chooser or a later edit that emptied the field.
            const model = section("Model and provider");
            if (model !== null && model.length < 2) {
              missing.push("the **Model and provider** field");
            }

            const AREAS = {
              "chat / agent": "area:chat",
              "files editor": "area:editor",
              "settings": "area:settings",
              "scanners": "area:scanners",
              "mcp": "area:mcp",
              "extensions": "area:extensions",
              "git": "area:git",
              "install / update": "area:install",
            };
            const area = section("Which part of the app");
            if (area) {
              const hit = AREAS[area.trim().toLowerCase()];
              if (hit) {
                labels.push(hit);
              } else if (area.trim().toLowerCase() === "i don't know") {
                labels.push("needs-triage");
              } else {
                // An unmatched answer means the form options and this table drifted.
                // Make that loud here rather than silent in triage.
                labels.push("needs-triage");
                await comment(
                  [
                    `The **Which part of the app** answer (“${area.trim()}”) does not match a`,
                    "known area, so no area label was applied. This is usually a form/dropdown",
                    "drift on our side, not a problem with the report — a maintainer will route it.",
                  ].join("\n"),
                  "area",
                );
              }
              if ((hit || area.trim().toLowerCase() === "i don't know") && previous("area")) {
                await comment("The area answer is now a supported form option. Thanks for updating the report.", "area");
              }
            }

            if (missing.length) {
              const wantsDiagnostics = missing.some(
                (m) => m.includes("app version") || m.includes("den version") || m.includes("support-bundle"),
              );
              const wantsModel = missing.some((m) => m.includes("Model and provider"));
              const help = [];
              if (wantsDiagnostics) {
                help.push(
                  "System information and the report id come straight from the app — **Settings → Advanced → Diagnostics**.",
                  "*System information → Copy for bug report* gives the version block (no keys, nothing about your",
                  "projects), and *Save diagnostics bundle* gives the filename to paste as the report id.",
                  "**Keep the bundle itself** — do not attach it here; it contains your file paths and",
                  "recent logs. If a maintainer needs it they will ask on the issue, and you can send it",
                  "to info@paintedwolf.ai. Do not email it unasked, and do not email for help.",
                );
              }
              if (wantsModel) {
                if (help.length) help.push("");
                help.push(
                  "An in-bounds agent report needs the model and provider — behaviour depends on them,",
                  "and a report without that cannot be acted on.",
                );
              }
              await needsInfo(
                [
                  "Thanks for the report. It is missing a couple of specifics that a maintainer",
                  "would need in order to look at it:",
                  "",
                  ...missing.map((m) => `- ${m}`),
                  "",
                  ...help,
                  "",
                  "Edit the issue to add the above. If nothing arrives this will close automatically —",
                  "reopening is one comment away. Filing does not entitle you to a reply.",
                ].join("\n"),
              );
            } else {
              await resolveInfo();
            }

            await addLabels(labels);
