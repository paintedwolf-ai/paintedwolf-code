name: Platform verification

# The merge queue's jobs that a catalog lane cannot express: the upgrade corpus,
# macOS confinement and engine checks, and the Playwright web and desktop tiers.
# The free plan runs five macOS jobs at once, so only what needs macOS runs there.
on:
  workflow_call:

permissions:
  contents: read

env:
  # MLX 0.32 Metal kernels need the Xcode 26 toolchain; Linux runners ignore it.
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  # Boot the retained upgrade-corpus fixtures with HEAD. Booting stored databases
  # is platform-neutral, so it stays off the scarce macOS runners.
  upgrade-corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      PW_TEST_HOST: dedicated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-verification

      - uses: ./.github/actions/setup-bialy

      - name: Build sidecar
        timeout-minutes: 60
        run: ./task build:lycaon-dev

      - name: Boot upgrade corpus fixtures
        timeout-minutes: 90
        run: ./task upgrade:corpus:boot

      - uses: ./.github/actions/verification-evidence
        if: always()
        timeout-minutes: 5
        with:
          name: upgrade-corpus-${{ github.run_attempt }}
          status: ${{ job.status }}

  # Applied Seatbelt profiles, the managed browser under Seatbelt, and the owned
  # Git engine's parity matrix (darwin-arm64 only) share one macOS runner and one
  # sidecar build. Each suite runs even when an earlier one fails.
  confinement:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache-dependency-path: lycaon/go.sum

      - name: Set up maintained OpenGrep
        uses: ./.github/actions/setup-opengrep

      - uses: ./.github/actions/setup-bialy

      - uses: ./.github/actions/cache-decide

      - name: Fetch pinned git engine
        run: ./task gitengine:fetch

      - name: Build sidecar and provision pinned browser
        id: browser
        timeout-minutes: 60
        run: |
          set -euo pipefail
          ./task build:lycaon-dev
          BUILD_DIR="$(python3 scripts/artifact_paths.py build "$GITHUB_WORKSPACE")"
          BROWSER_OUT="$("$BUILD_DIR/lycaon-dev" browser ensure --cache-dir "$RUNNER_TEMP/browser-cache")"
          BROWSER_PATH="${BROWSER_OUT##* path=}"
          test -x "$BROWSER_PATH"
          echo "path=$BROWSER_PATH" >> "$GITHUB_OUTPUT"

      - name: Applied Seatbelt confinement
        timeout-minutes: 45
        run: ./task test:seatbelt

      - name: Confined browser launch and screenshot regression
        if: ${{ !cancelled() && steps.browser.outcome == 'success' }}
        timeout-minutes: 30
        env:
          LYCAON_BROWSER_BIN: ${{ steps.browser.outputs.path }}
          # The step above provisioned one, so a skip here would be a green job
          # covering nothing.
          LYCAON_BROWSER_REQUIRED: '1'
        run: >
          ./task test:digest -- ./internal/browser
          -run '^(TestHeadlessLauncherPinsSubprocessPath|TestLaunchHeadlessUnderBrowserConfinement|TestProbeUsabilityUnderBrowserConfinement|TestPoolNewPageUnderBrowserConfinement|TestCaptureURLReachesHostLoopback|TestConfinedBrowserFloorReachesHostLoopback|TestBrowserBoundaryRefusesWhenConfinementCannotBeBuilt|TestLaunchHeadlessRefusesUnsafeCacheDir)$'
          -count=1

      - name: Git engine parity matrix
        if: ${{ !cancelled() }}
        timeout-minutes: 30
        env:
          LYCAON_GIT_REFERENCE: /usr/bin/git
          LYCAON_GIT_PARITY_REQUIRED: "1"
        run: >
          ./task test:integration -- ./test/integration/...
          -run 'GitParity|LFS|Filter|Attributes|UndefinedFilter|RepoAttributes|LargeFile'

      - uses: ./.github/actions/verification-evidence
        if: always()
        timeout-minutes: 5
        with:
          name: confinement-${{ github.run_attempt }}
          status: ${{ job.status }}

  playwright-web:
    name: playwright-web (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache-dependency-path: lycaon/go.sum

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - name: Install frontend dependencies
        working-directory: lycaon-den
        run: bun install --frozen-lockfile

      # Browser system packages come from the distribution mirror, whose speed
      # varies by minutes; this step's time stays out of the test budget.
      - name: Install Playwright browsers
        working-directory: lycaon-den
        timeout-minutes: 20
        run: bunx playwright install chromium webkit --with-deps

      # The containers' engine runs the maintained scanner.
      - name: Set up maintained OpenGrep
        uses: ./.github/actions/setup-opengrep

      - name: Playwright web E2E (Tier B)
        timeout-minutes: 40
        env:
          # Keep traces and reports on disk so the failure-upload step below
          # can capture them; the cleanup trap otherwise deletes them.
          LYCAON_E2E_KEEP_ARTIFACTS: "1"
          LYCAON_E2E_JOB_SHARD: ${{ matrix.shard }}/3
          LYCAON_E2E_PLAYWRIGHT_READY: "1"
        run: ./task e2e:den

      - uses: ./.github/actions/verification-evidence
        if: always()
        timeout-minutes: 5
        with:
          name: playwright-web-${{ matrix.shard }}-${{ github.run_attempt }}
          status: ${{ job.status }}

      - name: E2E cleanup
        timeout-minutes: 5
        if: always()
        # A run killed at its step deadline keeps its admission; withdraw it so cleanup is not queued behind it.
        run: |
          python3 scripts/ci_verification.py release "Playwright web E2E"
          ./task e2e:cleanup

  playwright-desktop:
    uses: ./.github/workflows/desktop-verification.yml
