name: Unchanged main native launch diagnostic

on:
  workflow_call:
    inputs:
      source-sha:
        type: string
        default: ''
permissions:
  contents: read
jobs:
  baseline-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PW_TEST_HOST: dedicated
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Exact current main; no product, fixture or catalog changes from the harness.
          ref: 8cfa86649e877cb8262cba71d9967bae31a5a85a
      - uses: ./.github/actions/setup-verification
        with:
          linux-launch: 'true'
      - uses: ./.github/actions/setup-bialy
      - name: Unchanged main Linux launch boundary
        id: launch
        run: ./task test:confine:linux -- launch
      - uses: ./.github/actions/verification-evidence
        if: always()
        with:
          name: unchanged-main-linux-launch-${{ github.run_attempt }}
          status: ${{ steps.launch.outcome }}
