name: Linux package candidates

# Packaging changes prepare their unsigned release artifacts before they merge.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit to prepare; the dispatched ref when empty
        type: string
        default: ''
  schedule:
    - cron: '17 9 * * 1'
  pull_request:
    types: [opened, ready_for_review]
    branches: [main]
    paths:
      - '.github/workflows/linux-candidates.yml'
      - '.github/workflows/release-prepare.yml'
      - '.github/actions/setup-*/**'
      - 'flake.*'
      - 'packaging/**'
      - 'scripts/*linux*'
      - 'scripts/linux_release/**'
      - 'scripts/release_distribution_contract/**'
      - 'scripts/release_preparation/**'
      - 'scripts/*engine*'
      - 'scripts/*bundle*'
      - 'scripts/release-stage-platform-artifacts.sh'
      - 'scripts/release-metadata.py'
      - 'scripts/release_semver.py'
      - 'scripts/update_keys.py'
      - 'scripts/sha256.sh'
      - 'scripts/*opengrep*'
      - 'VERSION'
      - 'RELEASE_BUILD'
      - 'Taskfile.yml'
      - 'task'
      - 'lycaon/go.mod'
      - 'lycaon/go.sum'
      - 'lycaon-den/package.json'
      - 'lycaon-den/bun.lock'
      - 'lycaon-den/src-tauri/Cargo.*'
      - 'lycaon-den/src-tauri/tauri*.json'
      - 'rust-toolchain.toml'
      - '.bun-version'
      - '.node-version'

permissions:
  contents: read

concurrency:
  group: linux-candidates-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  prepare:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft || github.event.action == 'ready_for_review' }}
    uses: ./.github/workflows/release-prepare.yml
    permissions:
      contents: read
      actions: read
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}
