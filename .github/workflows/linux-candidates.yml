name: Linux package candidates

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - id: source
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "version=$(python3 scripts/release-metadata.py | jq -er .product_version)" >> "${GITHUB_OUTPUT}"
          echo "matrix=$(./task release:candidate:select)" >> "${GITHUB_OUTPUT}"
          ./task release:candidate:select -- --source-record "$RUNNER_TEMP/candidate-source.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-candidate-source-${{ github.run_attempt }}
          path: ${{ runner.temp }}/candidate-source.json
          if-no-files-found: error
          retention-days: 90

  candidates:
    needs: source
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - name: Verify native candidate runner
        env:
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          [[ "$(go env GOOS)" == linux && "$(go env GOARCH)" == "${EXPECTED_GOARCH}" ]]
          case "${EXPECTED_GOARCH}" in
            amd64) [[ "$(rustc --print host-tuple)" == x86_64-unknown-linux-gnu ]] ;;
            arm64) [[ "$(rustc --print host-tuple)" == aarch64-unknown-linux-gnu ]] ;;
          esac
      - name: Install Linux bundle and audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev xdg-utils rpm rpmlint lintian cpio gnupg libarchive-tools
      - name: Verify the catalog row for this candidate
        env:
          PLATFORM: ${{ matrix.updater_key }}
          CANDIDATE_RUNNER_LABEL: ${{ matrix.runner }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: |
          ./task release:candidate:select -- --platform "${PLATFORM}" \
            --runner-label "${CANDIDATE_RUNNER_LABEL}" --architecture "${EXPECTED_GOARCH}"
      - name: Download or restore qualified maintained engine
        uses: ./.github/actions/setup-opengrep
      - name: Download pinned Bialy heads
        uses: ./.github/actions/setup-bialy
      - name: Install frontend dependencies
        working-directory: lycaon-den
        run: bun install --frozen-lockfile
      - name: Build the declared Linux package families
        id: package-build
        env:
          PACKAGE_EXTENSIONS: ${{ join(matrix.package_extensions, ',') }}
        run: |
          case "${PACKAGE_EXTENSIONS}" in
            deb,rpm) ./task den:bundle ;;
            deb,rpm,pkg.tar.zst) ./task den:bundle -- --pacman-container ;;
            *) echo "Unsupported candidate package-family contract" >&2; exit 1 ;;
          esac
      # The disposable runner, not the probe, owns this host preparation: the
      # probe receives no lease here, so it never invokes sudo or apparmor_parser.
      - name: Allow the staged package diagnostic to create user namespaces
        run: |
          if [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null)" == 1 ]]; then
            printf '%s\n' 'abi <abi/4.0>,' 'include <tunables/global>' \
              'profile paintedwolf-candidate-diagnostic /tmp/painted-wolf-linux.*/deb/opt/painted-wolf-code/bin/pw flags=(unconfined) {' \
              '  userns,' '}' | sudo tee /etc/apparmor.d/paintedwolf-candidate-diagnostic >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/paintedwolf-candidate-diagnostic
          fi
      - name: Verify and stage platform artifacts
        env:
          VERSION: ${{ needs.source.outputs.version }}
          PLATFORM: ${{ matrix.updater_key }}
          ARCH: ${{ matrix.artifact_arch }}
          PACKAGE_EXTENSIONS: ${{ join(matrix.package_extensions, ',') }}
          TMPDIR: /tmp
        run: |
          bash scripts/release-stage-platform-artifacts.sh \
            --platform "${PLATFORM}" --goos linux --arch "${ARCH}" \
            --version "${VERSION}" --package-extensions "${PACKAGE_EXTENSIONS}" \
            --output "${RUNNER_TEMP}/candidate"
          printf '%s\n' "$GITHUB_SHA" > "${RUNNER_TEMP}/candidate/controller-commit.txt"
          git rev-parse HEAD > "${RUNNER_TEMP}/candidate/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "${RUNNER_TEMP}/candidate/source-tree.txt"
          printf '%s\n' 'nonrelease; installed qualification is required' > "${RUNNER_TEMP}/candidate/qualification-scope.txt"
      - name: Rehearse Linux signatures with a disposable local key
        run: |
          ./task release:rehearse:linux-signing -- \
            --candidate-dir "${RUNNER_TEMP}/candidate" \
            --require-architectures "${{ matrix.artifact_arch }}" \
            --receipt "${RUNNER_TEMP}/candidate/signing-rehearsal.json"
      - name: Retain candidate packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-candidate-${{ matrix.updater_key }}
          path: ${{ runner.temp }}/candidate/*
          if-no-files-found: error
          retention-days: 90

      - name: Retain partial native bytes without complete candidate authority
        id: diagnostic-retention
        if: ${{ failure() && steps.package-build.outcome != 'skipped' }}
        env:
          CONTROLLER_COMMIT: ${{ github.workflow_sha }}
        run: |
          ./task release:candidate:diagnostics -- \
            --source "$GITHUB_WORKSPACE" --controller "$CONTROLLER_COMMIT" \
            --output "$RUNNER_TEMP/candidate-diagnostics"
      - name: Upload unqualified partial package diagnostics
        if: ${{ failure() && steps.diagnostic-retention.outcome == 'success' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-partial-diagnostics-${{ matrix.updater_key }}
          path: ${{ runner.temp }}/candidate-diagnostics/*
          if-no-files-found: error
          retention-days: 90
