name: Linux package candidates

on:
  push:
    branches: [linux/candidate-ci-isolation]
    paths: [packaging/linux/qualification-source.json]
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
  workflow_dispatch:
  schedule:
    - cron: '17 9 * * 1'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '.github/workflows/linux-candidates.yml'
      - '.github/workflows/release.yml'
      - '.github/actions/setup-*/**'
      - 'packaging/**'
      - 'scripts/*linux*'
      - 'scripts/*engine*'
      - 'scripts/*bundle*'
      - 'scripts/release-stage-platform-artifacts.sh'
      - 'lycaon-den/src-tauri/Cargo.*'
      - 'lycaon-den/src-tauri/tauri*.json'
      - 'rust-toolchain.toml'
      - '.bun-version'

permissions:
  contents: read

concurrency:
  group: linux-candidates-${{ github.event.pull_request.number || inputs.source_sha || github.ref }}
  cancel-in-progress: false

jobs:
  source:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
      matrix: ${{ steps.source.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha || github.sha }}
          persist-credentials: false
      - name: Select the frozen premerge qualification source
        if: github.event_name == 'push' && github.ref == 'refs/heads/linux/candidate-ci-isolation'
        run: |
          set -euo pipefail
          selection="$(python3 - <<'SOURCE_PY'
          import json, re
          from pathlib import Path
          selected = json.loads(Path('packaging/linux/qualification-source.json').read_text())
          if set(selected) != {'source_commit', 'source_tree'} or any(
              not isinstance(value, str) or not re.fullmatch('[0-9a-f]{40}', value)
              for value in selected.values()
          ):
              raise SystemExit('Invalid frozen candidate qualification source')
          print(selected['source_commit'], selected['source_tree'])
          SOURCE_PY
          )"
          read -r source_sha source_tree <<< "$selection"
          git fetch --no-tags origin "refs/qualification/$source_sha"
          [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$source_sha" ]]
          [[ "$(git rev-parse 'FETCH_HEAD^{tree}')" == "$source_tree" ]]
          git checkout --detach "$source_sha"
      - id: source
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "version=$(python3 scripts/release-metadata.py | jq -er .product_version)" >> "${GITHUB_OUTPUT}"
          echo "matrix=$(python3 scripts/linux_release/candidates.py)" >> "${GITHUB_OUTPUT}"

  candidates:
    needs: source
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.source.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@5064d95ba18d4a9dda7c4cc67adeb03aea1a2a14 # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal
      - name: Verify native candidate runner
        env:
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          [[ "$(go env GOOS)" == linux && "$(go env GOARCH)" == "${EXPECTED_GOARCH}" ]]
          case "${EXPECTED_GOARCH}" in
            amd64) [[ "$(rustc --print host-tuple)" == x86_64-unknown-linux-gnu ]] ;;
            arm64) [[ "$(rustc --print host-tuple)" == aarch64-unknown-linux-gnu ]] ;;
          esac
      - name: Install Linux bundle and audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev xdg-utils rpm rpmlint lintian cpio gnupg libarchive-tools
      - name: Verify the catalog row for this candidate
        env:
          PLATFORM: ${{ matrix.updater_key }}
          CANDIDATE_RUNNER_LABEL: ${{ matrix.runner }}
          EXPECTED_GOARCH: ${{ matrix.goarch }}
        run: |
          python3 scripts/linux_release/candidates.py --platform "${PLATFORM}" \
            --runner-label "${CANDIDATE_RUNNER_LABEL}" --architecture "${EXPECTED_GOARCH}"
      - name: Download or restore qualified maintained engine
        uses: ./.github/actions/setup-opengrep
      - name: Download pinned Bialy heads
        uses: ./.github/actions/setup-bialy
      - name: Install frontend dependencies
        working-directory: lycaon-den
        run: bun install --frozen-lockfile
      - name: Build the declared Linux package families
        env:
          PACKAGE_EXTENSIONS: ${{ join(matrix.package_extensions, ',') }}
        run: |
          case "${PACKAGE_EXTENSIONS}" in
            deb,rpm) ./task den:bundle ;;
            deb,rpm,pkg.tar.zst) ./task den:bundle -- --pacman-container ;;
            *) echo "Unsupported candidate package-family contract" >&2; exit 1 ;;
          esac
      - name: Verify and stage platform artifacts
        env:
          VERSION: ${{ needs.source.outputs.version }}
          PLATFORM: ${{ matrix.updater_key }}
          ARCH: ${{ matrix.artifact_arch }}
          PACKAGE_EXTENSIONS: ${{ join(matrix.package_extensions, ',') }}
        run: |
          bash scripts/release-stage-platform-artifacts.sh \
            --platform "${PLATFORM}" --goos linux --arch "${ARCH}" \
            --version "${VERSION}" --package-extensions "${PACKAGE_EXTENSIONS}" \
            --output "${RUNNER_TEMP}/candidate"
          printf '%s\n' "$GITHUB_SHA" > "${RUNNER_TEMP}/candidate/controller-commit.txt"
          git rev-parse HEAD > "${RUNNER_TEMP}/candidate/source-commit.txt"
          git rev-parse 'HEAD^{tree}' > "${RUNNER_TEMP}/candidate/source-tree.txt"
          printf '%s\n' 'nonrelease; installed qualification is required' > "${RUNNER_TEMP}/candidate/qualification-scope.txt"
      - name: Rehearse Linux signatures with a disposable local key
        run: |
          ./task release:live-test -- --local-linux-signing \
            --candidate-dir "${RUNNER_TEMP}/candidate" \
            --require-architectures "${{ matrix.artifact_arch }}" \
            --receipt "${RUNNER_TEMP}/candidate/signing-rehearsal.json"
      - name: Retain candidate packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-candidate-${{ matrix.updater_key }}
          path: ${{ runner.temp }}/candidate/*
          if-no-files-found: error
          retention-days: 90
