name: Qualification
run-name: Qualification ${{ inputs.source-sha || github.sha }}

on:
  workflow_dispatch:
    inputs:
      source-sha:
        description: Main commit to qualify; blank selects the dispatch commit
        type: string
        default: ''

permissions:
  contents: read

# One executor preserves explicit release candidates.
concurrency:
  group: qualification
  queue: max
  cancel-in-progress: false

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      source-sha: ${{ steps.source.outputs.source-sha }}
      record: ${{ steps.source.outputs.record }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Bind qualification source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_SOURCE: ${{ inputs.source-sha }}
          PYTHONPATH: scripts
        run: python3 -m ci_policy.qualification_source

  static:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b2a9ab24f04885adb52faf6bdccb0bb7dfb3c187 # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - name: Validate candidate metadata
        run: ./task release:preflight -- --static
      - uses: ./.github/actions/setup-apt
        with:
          packages: minisign
      - name: Verify compatibility with the signed stable baseline
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.source.outputs.source-sha }}
          DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL }}
        run: |
          set -euo pipefail
          gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/releases?per_page=100" > "${RUNNER_TEMP}/published-releases.json"
          baseline="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" |
            python3 scripts/release-compatibility-baseline.py "${SOURCE_SHA}" --base-url "${DOWNLOAD_BASE_URL}" \
              --releases-file "${RUNNER_TEMP}/published-releases.json" --publish true)"
          baseline_sha="$(sed -n 's/^baseline_sha=//p' <<<"${baseline}")"
          versions="$(sed -n 's/^published_versions=//p' <<<"${baseline}")"
          ./task release:preflight -- --compatibility-only --source-root "${GITHUB_WORKSPACE}" \
            --baseline-ref "${baseline_sha}" --published-versions "${versions}"

  credentials:
    needs: [source, static]
    uses: ./.github/workflows/release-secrets-check.yml
    with:
      source_sha: ${{ needs.source.outputs.source-sha }}

  selection:
    needs: [source, credentials]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      nightly-run-id: ${{ steps.evidence.outputs.nightly-run-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Look for a full nightly on the exact candidate
        id: evidence
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_RECORD: ${{ needs.source.outputs.record }}
          PYTHONPATH: scripts
        run: python3 -m ci_policy.nightly_evidence select

  verification:
    needs: [source, selection]
    if: needs.selection.outputs.nightly-run-id == ''
    uses: ./.github/workflows/nightly-verification.yml
    permissions:
      contents: read
      actions: read
    with:
      source-sha: ${{ needs.source.outputs.source-sha }}
      source-tree: ${{ fromJSON(needs.source.outputs.record).source_tree }}

  preparation:
    needs: [source, credentials]
    uses: ./.github/workflows/release-prepare.yml
    permissions:
      contents: read
      actions: read
    with:
      source_sha: ${{ needs.source.outputs.source-sha }}

  qualification:
    if: ${{ !cancelled() }}
    needs: [source, static, credentials, selection, verification, preparation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
      - name: Require exact-commit qualification
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          QUALIFICATION_RECORD: ${{ needs.source.outputs.record }}
          NIGHTLY_RUN_ID: ${{ needs.selection.outputs.nightly-run-id }}
          PREPARATION_RUN_ID: ${{ needs.preparation.outputs.run_id }}
          PYTHONPATH: scripts
        run: python3 -m ci_policy.qualification_receipt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualification-source-${{ github.run_attempt }}
          path: qualification-source.json
          if-no-files-found: error
          retention-days: 90
