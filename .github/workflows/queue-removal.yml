name: Queue removal notice
# GitHub removes a PR from the merge queue without saying why on the PR.
on:
  pull_request_target:
    types: [dequeued]
permissions:
  contents: read
  pull-requests: write
  actions: read
jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Only default-branch controller code executes with write credentials.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Report the failed lanes
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        run: python3 -m ci_policy.queue_removal
