name: Verification

on:
  workflow_call:
    inputs:
      source-sha:
        description: Exact source commit; blank uses the calling workflow commit
        type: string
        default: ''
      reuse-merge-proof:
        description: Reuse complete merge-group lanes for the selected source tree
        type: boolean
        default: false
      profile:
        description: Catalog profile (fast, integration, check, nightly, or release)
        required: true
        type: string
      affected:
        description: Resolve the event change base and narrow integration lanes
        default: false
        type: boolean
      suite:
        description: Nightly suite selection
        default: all
        type: string
      platform:
        description: Run only the profile's platform lanes, beside a gate that covers the others
        default: false
        type: boolean

# The caller's token permissions apply: only merge-group CI grants actions write,
# so a removed group's jobs can cancel their own run. Actions read lets the plan
# order lanes and balance shards by main's measured durations.

env:
  # MLX 0.32 Metal kernels need the Xcode 26 toolchain; Linux runners ignore it.
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      max-parallel: ${{ steps.plan.outputs.max-parallel }}
      package-timings: ${{ steps.plan.outputs.package-timings }}
      change-base: ${{ steps.plan.outputs.change-base }}
      early-target: ${{ steps.plan.outputs.early-target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          fetch-depth: 0
      - name: Resolve verification jobs
        id: plan
        env:
          PROFILE: ${{ inputs.profile }}
          REUSE: ${{ inputs.reuse-merge-proof }}
          SOURCE_SHA: ${{ inputs.source-sha || github.sha }}
          SUITE: ${{ inputs.suite }}
          AFFECTED: ${{ inputs.affected }}
          PLATFORM: ${{ inputs.platform }}
          # Reads main's nightly receipts; without actions read access the plan uses lane budgets.
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$PROFILE" == integration && "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            PW_CHANGE_BASE="$(PYTHONPATH=scripts python3 -m ci_policy.queue_dispatch)"
            export PW_CHANGE_BASE
            echo "change-base=$PW_CHANGE_BASE" >> "$GITHUB_OUTPUT"
          fi
          args=()
          if [[ "$AFFECTED" == true ]]; then args+=(--affected); fi
          if [[ "$PLATFORM" == true ]]; then args+=(--platform); fi
          # The fast tier is one unsharded job, which measurements would not change.
          if [[ "$PROFILE" != fast ]]; then
            python3 scripts/ci_verification.py timings > "$RUNNER_TEMP/timings.json"
            args+=(--timings "$RUNNER_TEMP/timings.json")
            echo "package-timings=$(jq -c '.packages // {}' "$RUNNER_TEMP/timings.json")" >> "$GITHUB_OUTPUT"
          fi
          if [[ "$PROFILE" == fast && "$GITHUB_EVENT_NAME" == pull_request ]]; then
            early="$(PYTHONPATH=scripts python3 -m ci_policy.merge_preflight)"
            echo "early-target=$early" >> "$GITHUB_OUTPUT"
          fi
          matrix="$(python3 scripts/ci_verification.py matrix "$PROFILE" --suite "$SUITE" "${args[@]}")"
          if [[ "$REUSE" == true ]]; then
            [[ "$PROFILE" == check && "$AFFECTED" != true && "$PLATFORM" != true ]]
            matrix="$(PYTHONPATH=scripts python3 -m ci_policy.proof_reuse --matrix "$matrix" --source "$SOURCE_SHA" --output "$RUNNER_TEMP/qualification-reuse.json")"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "max-parallel=$(python3 scripts/ci_verification.py max-parallel "$PROFILE")" >> "$GITHUB_OUTPUT"

      - name: Retain qualification coverage sources
        if: inputs.reuse-merge-proof
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: qualification-reuse-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qualification-reuse.json
          if-no-files-found: error
          retention-days: 90

  verify:
    name: ${{ matrix.lane }}${{ matrix.shard != '' && format(' ({0})', matrix.shard) || '' }}
    needs: plan
    strategy:
      # A merge group stops at its first failure and frees its runners; every other run keeps
      # each lane's evidence.
      fail-fast: ${{ github.event_name == 'merge_group' || startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/') }}
      # The catalog's capacity table bounds how many runners each profile holds at once.
      max-parallel: ${{ fromJSON(needs.plan.outputs.max-parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.job_minutes }}
    env:
      LYCAON_LLM_MOCK: '1'
      LYCAON_GIT_REFERENCE: /usr/bin/git
      # Hosted runners run one lane each, so admission may use every CPU.
      PW_TEST_HOST: dedicated
      SOAK: 10m
      PW_CI_AFFECTED: ${{ inputs.affected && '1' || '0' }}
      PW_CHANGE_BASE: ${{ needs.plan.outputs.change-base }}
      PW_CI_EARLY_TARGET: ${{ needs.plan.outputs.early-target }}
    steps:
      - name: Record job start
        run: python3 -c 'import os, time; open(os.environ["GITHUB_ENV"], "a").write(f"PW_CI_JOB_STARTED_AT={time.time()}\n")'

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha || github.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/merge-group-watch

      - uses: ./.github/actions/setup-analysis
        if: matrix.setup == 'analysis'
        with:
          analysis: ${{ matrix.analysis }}

      - uses: ./.github/actions/setup-verification
        if: matrix.setup != 'analysis'
        with:
          setup: ${{ matrix.setup }}
          runtime-engines: ${{ matrix.runtime_engines }}
          notices: ${{ matrix.notices }}
          analysis: ${{ matrix.analysis }}
          # An admission lane runs offline, so it cannot fetch its container images; other lanes
          # build them from each distribution as it ships that day.
          containers: ${{ matrix.containers && (inputs.profile == 'fast' || inputs.profile == 'integration') }}
          browser: ${{ matrix.browser }}
          linux-launch: ${{ matrix.linux_launch }}
          repository-tools: ${{ matrix.repository_tools }}
          nix: ${{ matrix.nix }}

      # Shell lanes stage the engine, including the decision engine heads.
      - uses: ./.github/actions/setup-bialy
        if: ${{ matrix.setup == 'shell' }}

      - name: Run verification
        timeout-minutes: ${{ matrix.minutes }}
        env:
          LANE: ${{ matrix.lane }}
          SHARD: ${{ matrix.shard }}
          # Admission runs with loopback networking only.
          OFFLINE: ${{ inputs.profile == 'fast' || inputs.profile == 'integration' }}
          PW_CI_PACKAGE_TIMINGS: ${{ needs.plan.outputs.package-timings }}
          PYTHONPATH: scripts
        run: |
          if [[ "$OFFLINE" == true ]]; then
            python3 -m ci_policy.offline "$LANE" --shard "$SHARD"
          else
            python3 scripts/ci_verification.py run "$LANE" --shard "$SHARD"
          fi

      - uses: ./.github/actions/verification-evidence
        if: always()
        timeout-minutes: 5
        with:
          name: verification-${{ inputs.profile }}-${{ matrix.lane }}${{ matrix.shard != '' && format('-{0}', strategy.job-index) || '' }}-${{ github.run_attempt }}
          status: ${{ job.status }}

      - name: Seal complete merge-group lane proof
        if: success() && (github.event_name == 'merge_group' || startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))
        env:
          PYTHONPATH: scripts
        run: python3 -m ci_policy.lane_proof

      - name: Retain complete merge-group lane proof
        if: success() && (github.event_name == 'merge_group' || startsWith(github.ref, 'refs/heads/gh-readonly-queue/main/'))
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: lane-proof-${{ matrix.lane }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/lane-proof.json
          if-no-files-found: ignore
          retention-days: 14
