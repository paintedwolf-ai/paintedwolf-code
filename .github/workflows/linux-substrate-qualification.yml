name: Native Linux package substrate qualification

on:
  push:
    branches: [linux/candidate-ci-isolation]
    paths: [packaging/linux/qualification-substrate.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-package-substrate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arm-substrate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the immutable substrate controller independently of the application source
        shell: bash
        run: |
          set -euo pipefail
          selection="$(python3 - <<'SOURCE_PY'
          import json,re
          from pathlib import Path
          value=json.loads(Path('packaging/linux/qualification-substrate.json').read_text())
          if set(value)!={'source_commit','source_tree'} or any(
              not isinstance(item,str) or not re.fullmatch('[a-f0-9]{40}',item) for item in value.values()
          ):
              raise SystemExit('Invalid substrate controller selection')
          print(value['source_commit'],value['source_tree'])
          SOURCE_PY
          )"
          read -r source_sha source_tree <<< "$selection"
          git fetch --no-tags origin "$source_sha"
          [[ "$(git rev-parse 'FETCH_HEAD^{commit}')" == "$source_sha" ]]
          [[ "$(git rev-parse 'FETCH_HEAD^{tree}')" == "$source_tree" ]]
          git checkout --detach "$source_sha"
      - uses: actions/setup-go@5064d95ba18d4a9dda7c4cc67adeb03aea1a2a14 # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false
      - name: Prepare native substrate verification tools
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == aarch64 ]]
          [[ "$(go env GOARCH)" == arm64 ]]
          sudo apt-get update
          sudo apt-get install -y gnupg zstd libarchive-tools
      - name: Construct and admit the tiny native package fixture
        run: |
          ./task release:live-test -- --local-pacman-construction \
            --receipt "$RUNNER_TEMP/native-substrate.json"
      - name: Retain actual substrate observations
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-substrate-arm64
          path: ${{ runner.temp }}/native-substrate.json
          if-no-files-found: error
          retention-days: 90
