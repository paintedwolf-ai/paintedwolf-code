name: Queue health
on:
  schedule:
    - cron: '25 */4 * * *'
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pull-requests: read
# Maintenance runs one workflow at a time; staggered schedules keep a pending run from being replaced.
concurrency:
  group: maintenance
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Report queue health and recurring failures
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        run: python3 -m ci_policy.health
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: queue-health-${{ github.run_id }}
          path: queue-health.json
          retention-days: 30
