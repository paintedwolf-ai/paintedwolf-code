name: Build caches

# The only workflow that saves caches. A run can restore only caches saved on
# its own ref or on main, so merge-queue, pull request, and tag runs restore
# what this saves on main and save nothing themselves. Keys follow toolchains
# and dependency locks, so most pushes find every key present and skip the
# compiles.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-caches
  # Finish cold preparation so frequent main pushes cannot starve cache publication.
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  verification:
    strategy:
      fail-fast: false
      # Each platform prepares and publishes its compiler inputs on one runner.
      max-parallel: 1
      matrix:
        runner: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    # Publishing lint diagnostics deletes the entries they replace.
    permissions:
      contents: read
      actions: write
    env:
      PW_TEST_HOST: dedicated
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - id: setup
        uses: ./.github/actions/setup-verification
        with:
          setup: shell
          save-caches: ${{ github.ref == 'refs/heads/main' }}
          analysis: all

      - uses: ./.github/actions/setup-bialy

      - name: Restore release compiler inputs
        if: runner.os == 'macOS'
        id: release
        uses: ./.github/actions/cache-release-build

      - name: Compile the Go module
        if: steps.setup.outputs.go-cache-hit != 'true'
        run: ./task build

      # The macOS platform jobs build the development sidecar, which also
      # builds the decision engine whenever its cache key changes.
      - name: Build the development sidecar
        if: runner.os == 'macOS' && (steps.setup.outputs.go-cache-hit != 'true' || steps.setup.outputs.decide-cache-hit != 'true')
        run: ./task build:lycaon-dev

      - name: Build the decision engine
        if: runner.os == 'Linux' && steps.setup.outputs.decide-cache-hit != 'true'
        run: ./task build:decide

      - name: Warm document compiler inputs
        if: steps.setup.outputs.document-cache-hit != 'true'
        run: ./task build:document-core

      - name: Warm desktop workspace builds
        if: steps.setup.outputs.rust-cache-hit != 'true' || steps.setup.outputs.decide-cache-hit != 'true'
        run: ./task setup-dev -- --workspace-cache

      - name: Warm release compiler inputs
        if: runner.os == 'macOS' && (steps.release.outputs.cache-hit != 'true' || steps.setup.outputs.go-cache-hit != 'true')
        run: ./task setup-dev -- --release-cache

      - name: Publish prepared release compiler cache
        if: github.ref == 'refs/heads/main' && runner.os == 'macOS' && steps.release.outputs.cache-hit != 'true'
        uses: ./.github/actions/cache-release-build
        with:
          save: 'true'

      - name: Publish prepared desktop compiler cache
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.rust-cache-hit != 'true'
        uses: ./.github/actions/cache-rust
        with:
          save: 'true'

      - name: Publish prepared document compiler cache
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.document-cache-hit != 'true'
        uses: ./.github/actions/cache-document-core
        with:
          save: 'true'

      # Publish completed compiler caches before diagnostic work.
      - name: Publish prepared Go caches
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.go-cache-hit != 'true'
        uses: ./.github/actions/cache-go
        with:
          save: 'true'

      - name: Publish prepared decision engine
        if: github.ref == 'refs/heads/main' && steps.setup.outputs.decide-cache-hit != 'true'
        uses: ./.github/actions/cache-decide
        with:
          save: 'true'

      - name: Publish prepared notices tools
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/cache-notices-tools
        with:
          save: 'true'

      - name: Publish prepared analysis tools
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/cache-analysis-tools
        with:
          tools: all
          save: 'true'

      # Offline merge-queue lanes restore these rather than build each WebKitGTK release's image.
      - name: Publish WebKitGTK accessibility images
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/setup-webkit-atspi-images
        with:
          save: 'true'

      # Lint lanes run on Linux. Findings on main do not stop warming; nightly reports them.
      - name: Record lint diagnostics
        if: runner.os == 'Linux'
        continue-on-error: true
        run: ./task lint:full

      - name: Publish lint diagnostics
        if: runner.os == 'Linux' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/cache-lint-diagnostics
        with:
          save: 'true'

  usage:
    if: always()
    needs: verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Report repository cache usage
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          {
            echo '### Repository caches'
            gh api "repos/${REPO}/actions/cache/usage" \
              --jq '"\(.active_caches_count) caches, \(.active_caches_size_in_bytes / 1048576 | floor) MiB stored"'
            echo
            echo '| Ref | MiB | Key |'
            echo '|---|---|---|'
            gh api --paginate "repos/${REPO}/actions/caches?per_page=100&sort=size_in_bytes" \
              --jq '.actions_caches[] | "| \(.ref) | \(.size_in_bytes / 1048576 | floor) | `\(.key)` |"'
          } >> "${GITHUB_STEP_SUMMARY}"
