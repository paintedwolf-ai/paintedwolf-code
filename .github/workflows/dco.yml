name: Original commit certification
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Ready pull request number to certify again
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  checks: write
concurrency:
  group: dco-${{ github.event.pull_request.number || github.event.merge_group.head_sha || inputs.pull_request }}
  cancel-in-progress: true
jobs:
  certify:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Read trusted default branch source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Certify original PR commits
        env:
          GH_TOKEN: ${{ github.token }}
          DCO_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 scripts/dco_check.py
