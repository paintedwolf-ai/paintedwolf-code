name: Original commit certification
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_run:
    workflows: [CI]
    types: [completed]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Ready pull request number to certify again
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write
concurrency:
  group: dco-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number || github.event.merge_group.head_sha || inputs.pull_request }}
  cancel-in-progress: true
jobs:
  certify:
    if: (github.event_name != 'pull_request_target' || github.event.pull_request.draft == false) && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Certify original PR commits
        uses: paintedwolf-ai/dco-checker@6d9c097a7778472a7b4518dbdb083f5328909c6d
