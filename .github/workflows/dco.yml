name: Original commit certification
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  workflow_run:
    workflows: [CI]
    types: [completed]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      pull_request:
        description: Ready pull request number to certify again
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: write
  statuses: write
concurrency:
  group: dco-certification
  queue: max
  cancel-in-progress: false
jobs:
  certify:
    if: (github.event_name != 'pull_request_target' || (github.event.pull_request.draft == false && github.actor != 'dependabot[bot]')) && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Certify original PR commits
        uses: paintedwolf-ai/dco-checker@82d6997588764ead443a819de36ec373b8cbca4f
