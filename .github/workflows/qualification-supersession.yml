name: Qualification supersession
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
# Separate from the executor so a new push can stop its obsolete snapshot.
# Share the existing maintenance runner reservation; each request reads live main.
concurrency:
  group: maintenance
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
      - name: Cancel superseded background qualification
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONPATH: scripts
        run: python3 -m ci_policy.qualification_supersession
