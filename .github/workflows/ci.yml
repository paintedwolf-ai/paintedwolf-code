name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # MLX 0.32 Metal kernels need the Xcode 26 toolchain; Linux runners ignore it.
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  verification:
    uses: ./.github/workflows/verification.yml
    with:
      profile: check

  # Boot last N corpus fixtures with HEAD; named so a corpus failure is distinct.
  upgrade-corpus:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: lycaon/go.mod
          cache-dependency-path: lycaon/go.sum

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - name: Set up maintained OpenGrep
        uses: ./.github/actions/setup-opengrep

      - name: Install frontend dependencies
        working-directory: lycaon-den
        run: bun install --frozen-lockfile

      - uses: ./.github/actions/setup-bialy

      - name: Build sidecar
        run: ./task build:lycaon-dev

      - name: Boot upgrade corpus fixtures
        timeout-minutes: 90
        run: ./task upgrade:corpus:boot

      - uses: ./.github/actions/verification-evidence
        if: always()
        timeout-minutes: 5
        with:
          name: upgrade-corpus-${{ github.run_attempt }}
          status: ${{ job.status }}

  # Applied Seatbelt profiles (darwin; --full).
  seatbelt:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: lycaon/go.mod
          cache-dependency-path: lycaon/go.sum

      - name: Applied Seatbelt confinement
        timeout-minutes: 60
        run: ./task test:seatbelt

      - uses: ./.github/actions/verification-evidence
        if: always()
        timeout-minutes: 5
        with:
          name: seatbelt-${{ github.run_attempt }}
          status: ${{ job.status }}

  # Managed browser under Seatbelt.
  browser-confinement:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: lycaon/go.mod
          cache-dependency-path: lycaon/go.sum

      - name: Set up maintained OpenGrep
        uses: ./.github/actions/setup-opengrep

      - uses: ./.github/actions/setup-bialy

      - name: Build sidecar and provision pinned browser
        id: browser
        run: |
          set -euo pipefail
          ./task build:lycaon-dev
          BUILD_DIR="$(python3 scripts/artifact_paths.py build "$GITHUB_WORKSPACE")"
          BROWSER_OUT="$("$BUILD_DIR/lycaon-dev" browser ensure --cache-dir "$RUNNER_TEMP/browser-cache")"
          BROWSER_PATH="${BROWSER_OUT##* path=}"
          test -x "$BROWSER_PATH"
          echo "path=$BROWSER_PATH" >> "$GITHUB_OUTPUT"

      - name: Confined browser launch and screenshot regression
        timeout-minutes: 60
        env:
          LYCAON_BROWSER_BIN: ${{ steps.browser.outputs.path }}
          # The step above provisioned one, so a skip here would be a green job
          # covering nothing.
          LYCAON_BROWSER_REQUIRED: '1'
        run: >
          ./task test:digest -- ./internal/browser
          -run '^(TestHeadlessLauncherPinsSubprocessPath|TestLaunchHeadlessUnderBrowserConfinement|TestProbeUsabilityUnderBrowserConfinement|TestPoolNewPageUnderBrowserConfinement|TestCaptureURLReachesHostLoopback|TestConfinedBrowserFloorReachesHostLoopback|TestBrowserBoundaryRefusesWhenConfinementCannotBeBuilt|TestLaunchHeadlessRefusesUnsafeCacheDir)$'
          -count=1

      - uses: ./.github/actions/verification-evidence
        if: always()
        timeout-minutes: 5
        with:
          name: browser-confinement-${{ github.run_attempt }}
          status: ${{ job.status }}

  # Owned git engine is darwin-arm64 only.
  git-parity:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: lycaon/go.mod
          cache-dependency-path: lycaon/go.sum

      - name: Fetch pinned git engine
        run: ./task gitengine:fetch

      - name: Git engine parity matrix
        timeout-minutes: 60
        env:
          LYCAON_GIT_REFERENCE: /usr/bin/git
          LYCAON_GIT_PARITY_REQUIRED: "1"
        run: >
          ./task test:integration -- ./test/integration/...
          -run 'GitParity|LFS|Filter|Attributes|UndefinedFilter|RepoAttributes|LargeFile'

      - uses: ./.github/actions/verification-evidence
        if: always()
        timeout-minutes: 5
        with:
          name: git-parity-${{ github.run_attempt }}
          status: ${{ job.status }}

  check:
    if: always()
    needs: [verification, upgrade-corpus, seatbelt, browser-confinement, git-parity]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require all CI verification
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_verification.py gate
