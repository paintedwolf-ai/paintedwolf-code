name: CI

# Pull requests run the fast tier, the stages of `./task check-fast`. The merge
# queue runs the full tier on the exact commit that lands on main: every stage of
# `./task check` plus platform verification. `check` is the one required check
# for both, so main only advances to a commit the full tier passed.
on:
  pull_request:
    branches: [main]
  merge_group:
  # The full tier on any branch, before queueing or to reproduce a queue failure.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verification:
    uses: ./.github/workflows/verification.yml
    with:
      profile: ${{ github.event_name == 'pull_request' && 'fast' || 'check' }}

  platform:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/platform-verification.yml

  check:
    if: always()
    needs: [verification, platform]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require this tier's verification
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SKIPPED: ${{ github.event_name == 'pull_request' && 'platform' || '' }}
        run: python3 scripts/ci_verification.py gate --skipped "$SKIPPED"
