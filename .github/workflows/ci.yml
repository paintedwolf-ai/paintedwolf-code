name: CI

# A ready pull request runs the fast tier, whose check lets auto-merge add it to
# the merge queue; the queue runs the affected-scope integration gate on the
# exact commit that lands. Exact-commit platform qualification follows main and
# gates releases.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  # The full tier on any branch; the fast tier for a pull request whose events
  # start no CI. Either reports the required check (see dispatched-check).
  workflow_dispatch:
    inputs:
      profile:
        description: Catalog profile to run
        type: choice
        default: check
        options: [check, fast]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fast:
    if: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft || inputs.profile == 'fast' }}
    uses: ./.github/workflows/verification.yml
    with:
      profile: fast
      affected: ${{ github.event_name == 'pull_request' }}

  integration:
    if: ${{ github.event_name == 'merge_group' || inputs.profile == 'check' }}
    # Its jobs cancel their own run once the merge queue removes the group.
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/verification.yml
    with:
      profile: ${{ github.event_name == 'merge_group' && 'integration' || 'check' }}
      affected: ${{ github.event_name == 'merge_group' }}

  platform:
    if: inputs.profile == 'check'
    uses: ./.github/workflows/platform-verification.yml

  check:
    # Judges failed and timed-out jobs, but a cancelled run must not wait for a runner to do so.
    if: ${{ !cancelled() }}
    needs: [fast, integration, platform]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require this tier's verification
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SKIPPED: ${{ inputs.profile == 'check' && 'fast' || format('{0},platform', github.event_name == 'merge_group' && 'fast' || 'integration') }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: python3 scripts/ci_verification.py gate --skipped "$SKIPPED" --draft "$DRAFT"

  dispatched-check:
    # A pull request's checks leave out dispatch runs; report the required
    # check as a commit status instead.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Report the check on the dispatched commit
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ needs.check.result == 'success' && 'success' || 'failure' }}
          PROFILE: ${{ inputs.profile }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state="$STATE" -f context=check -f description="Dispatched $PROFILE profile"
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
