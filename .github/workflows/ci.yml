name: CI

# A ready pull request runs the fast tier, whose check lets auto-merge add it to
# the merge queue; the queue runs the affected-scope integration gate on the
# exact commit that lands. The nightly verifies main daily; manual exact-source
# Qualification gates releases.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  # The full tier on any branch; the fast tier for a pull request whose events
  # start no CI. Either reports the required check (see dispatched-check).
  workflow_dispatch:
    inputs:
      profile:
        description: Catalog profile to run
        type: choice
        default: check
        options: [check, fast, integration]
      lane:
        description: Optional diagnostic lane; reports no required check
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  # A delayed draft synchronize event must not cancel a ready-for-review run.
  group: ci-${{ startsWith(github.ref, 'refs/heads/gh-readonly-queue/') && 'merge_group' || github.event_name }}-${{ github.ref }}-${{ github.event.pull_request.draft && github.event.action != 'ready_for_review' && 'draft' || 'ready' }}-${{ inputs.lane || 'all' }}
  # A replacement diagnostic supersedes its own lane without canceling full gates.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' && inputs.lane != '' }}

jobs:
  static:
    # Source errors a person can fix in seconds report within a minute, while the slower jobs run.
    if: ${{ github.event_name == 'pull_request' && (!github.event.pull_request.draft || github.event.action == 'ready_for_review') || inputs.profile == 'fast' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false
      - name: Check static source rules
        run: bash scripts/static-checks.sh

  fast:
    if: ${{ github.event_name == 'pull_request' && (!github.event.pull_request.draft || github.event.action == 'ready_for_review') || inputs.profile == 'fast' }}
    permissions:
      contents: read
      actions: read
      statuses: read
    uses: ./.github/workflows/verification.yml
    with:
      profile: fast
      lane: ${{ inputs.lane || '' }}
      affected: ${{ github.event_name == 'pull_request' }}

  integration:
    if: ${{ github.event_name == 'merge_group' || inputs.profile == 'integration' || inputs.profile == 'check' && inputs.lane != 'platform' }}
    # Its jobs cancel their own run once the merge queue removes the group.
    permissions:
      contents: read
      actions: write
      # Validate the exact live queue entry before recovered integration dispatch.
      pull-requests: read
    uses: ./.github/workflows/verification.yml
    with:
      profile: ${{ (github.event_name == 'merge_group' || inputs.profile == 'integration') && 'integration' || 'check' }}
      lane: ${{ inputs.lane || '' }}
      affected: ${{ github.event_name == 'merge_group' || (inputs.profile == 'integration' && inputs.lane == '') }}

  platform:
    if: inputs.profile == 'check' && (inputs.lane == '' || inputs.lane == 'platform')
    uses: ./.github/workflows/platform-verification.yml

  platform-lanes:
    if: inputs.profile == 'check' && inputs.lane == ''
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/verification.yml
    with:
      profile: release
      platform: true

  check:
    name: ${{ inputs.lane != '' && 'diagnostic-summary' || (github.event.pull_request.draft == true && github.event.action != 'ready_for_review' && 'draft-check' || 'check') }}
    # Judges failed and timed-out jobs, but a cancelled run must not wait for a runner to do so.
    if: ${{ !cancelled() && inputs.lane == '' && !(github.event_name == 'pull_request' && github.event.pull_request.draft && github.event.action != 'ready_for_review') }}
    needs: [static, fast, integration, platform, platform-lanes]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require this tier's verification
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SKIPPED: ${{ inputs.profile == 'check' && 'static,fast' || format('{0},platform,platform-lanes', (github.event_name == 'merge_group' || inputs.profile == 'integration') && 'static,fast' || 'integration') }}
          DRAFT: ${{ github.event.pull_request.draft == true && github.event.action != 'ready_for_review' }}
        run: python3 scripts/ci_verification.py gate --skipped "$SKIPPED" --draft "$DRAFT"
      - name: Delete skipped runs that would hide this check
        # GitHub reads a required check from the newest suite on the head; a
        # skipped draft run registered after this run would block the merge queue.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci_verification.py delete-skipped-runs "$HEAD_SHA"

  dispatched-check:
    # A pull request's checks leave out dispatch runs; report the required
    # check as a commit status instead.
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.lane == '' }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Report the check on the dispatched commit
        env:
          GH_TOKEN: ${{ github.token }}
          STATE: ${{ needs.check.result == 'success' && 'success' || 'failure' }}
          PROFILE: ${{ inputs.profile }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA"
          -f state="$STATE" -f context=check -f description="Dispatched $PROFILE profile"
          -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
