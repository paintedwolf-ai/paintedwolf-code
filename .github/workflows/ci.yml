name: CI

# Admission uses the same conservative scope on PRs and combined queue commits.
# Exact-commit platform qualification follows main and gates releases.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  # The full tier on any branch, before queueing or to reproduce a queue failure.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verification:
    if: ${{ !github.event.pull_request.draft }}
    uses: ./.github/workflows/verification.yml
    with:
      profile: ${{ github.event_name == 'workflow_dispatch' && 'check' || 'integration' }}
      affected: ${{ github.event_name != 'workflow_dispatch' }}

  platform:
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/platform-verification.yml

  check:
    # Judges failed and timed-out jobs, but a cancelled run must not wait for a runner to do so.
    if: ${{ !cancelled() }}
    needs: [verification, platform]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require this tier's verification
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SKIPPED: ${{ github.event_name != 'workflow_dispatch' && 'platform' || '' }}
          DRAFT: ${{ github.event.pull_request.draft == true }}
        run: python3 scripts/ci_verification.py gate --skipped "$SKIPPED" --draft "$DRAFT"
