name: Release Linux delivery

# Called after the shared gates and Linux repository activation, before discovery
# metadata and announcement. Each job holds one runner and its own credential.
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      version:
        type: string
        required: true
      channel:
        type: string
        required: true

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  # Each native system builds its own closure without credentials, one at a time.
  nix-closures:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Install the pinned Nix
        run: python3 -c 'from scripts.linux_release.nix_runner import install; print(install())' >> "${GITHUB_PATH}"
      - name: Build and export the application closure
        env:
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/nix-closure/outputs"
          nix build --extra-experimental-features 'nix-command flakes' --no-link --print-out-paths \
            ".#packages.${SYSTEM}.default" > "${RUNNER_TEMP}/nix-closure/outputs/${SYSTEM}.txt"
          xargs nix copy --extra-experimental-features nix-command \
            --to "file://${RUNNER_TEMP}/nix-closure/${SYSTEM}" < "${RUNNER_TEMP}/nix-closure/outputs/${SYSTEM}.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nix-closure-${{ matrix.system }}
          path: ${{ runner.temp }}/nix-closure
          if-no-files-found: error
          retention-days: 14

  publish-nix-cache:
    needs: nix-closures
    runs-on: ubuntu-latest
    environment: release-publication
    timeout-minutes: 90
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Require the provisioned production cache trust
        run: python3 -m scripts.nix_cache.release_lane check-trust
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - name: Install the pinned Nix
        run: python3 -c 'from scripts.linux_release.nix_runner import install; print(install())' >> "${GITHUB_PATH}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: nix-closure-*
          path: nix-closures
          merge-multiple: true
      - name: Import both closures into the local store
        run: |
          set -euo pipefail
          for system in x86_64-linux aarch64-linux; do
            xargs nix copy --extra-experimental-features nix-command --no-check-sigs \
              --from "file://${GITHUB_WORKSPACE}/nix-closures/${system}" < "nix-closures/outputs/${system}.txt"
          done
      - name: Sign and publish the release's Nix closures
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          PYTHONPATH=scripts python3 -m scripts.nix_cache.release_lane publish --outputs nix-closures/outputs \
            --source-commit "${SOURCE_SHA}" --version "${VERSION}" --output "${RUNNER_TEMP}/nix-publication.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nix-cache-publication
          path: ${{ runner.temp }}/nix-publication.json
          if-no-files-found: error
          retention-days: 90
