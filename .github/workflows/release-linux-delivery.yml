name: Release Linux delivery

# Called after the shared gates and Linux repository activation, before discovery
# metadata and announcement. It signs and publishes the closures the source's
# preparation built; nothing compiles here.
on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true
      version:
        type: string
        required: true
      channel:
        type: string
        required: true
      preparation_run_id:
        description: Run that holds the source's preparation receipt and artifacts
        type: string
        required: true

permissions:
  contents: read
  checks: read
  actions: read

jobs:
  publish-nix-cache:
    runs-on: ubuntu-latest
    environment: release-publication
    timeout-minutes: 90
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          persist-credentials: false
      - name: Require the provisioned production cache trust
        run: python3 -m scripts.nix_cache.release_lane check-trust
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true
      - name: Install the pinned Nix
        run: python3 -c 'from scripts.linux_release.nix_runner import install; print(install())' >> "${GITHUB_PATH}"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: prepared-nix-*
          path: ${{ runner.temp }}/prepared
          run-id: ${{ inputs.preparation_run_id }}
          github-token: ${{ github.token }}
      - name: Verify both closures against the source and import them
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/nix-outputs"
          for system in x86_64-linux aarch64-linux; do
            closure="${RUNNER_TEMP}/prepared/prepared-nix-${system}"
            python3 -m scripts.release_preparation verify --artifact "${closure}" --name "prepared-nix-${system}" \
              --source-commit "${SOURCE_SHA}"
            cp "${closure}/outputs.txt" "${RUNNER_TEMP}/nix-outputs/${system}.txt"
            xargs nix copy --extra-experimental-features nix-command --no-check-sigs \
              --from "file://${closure}/cache" < "${closure}/outputs.txt"
          done
      - name: Sign and publish the release's Nix closures
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL }}
          NIX_CACHE_SIGNING_KEY: ${{ secrets.NIX_CACHE_SIGNING_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          PYTHONPATH=scripts python3 -m scripts.nix_cache.release_lane publish --outputs "${RUNNER_TEMP}/nix-outputs" \
            --source-commit "${SOURCE_SHA}" --version "${VERSION}" --output "${RUNNER_TEMP}/nix-publication.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nix-cache-publication
          path: ${{ runner.temp }}/nix-publication.json
          if-no-files-found: error
          retention-days: 90
