name: Runner priority

# Hosted runners start jobs first come, first served. This sweep gives them to
# work in priority order: the merge queue and releases, ready pull requests,
# main qualification, drafts, main cache warming, then background work. It
# cancels CI of merge groups that no longer exist, cancels lower-priority runs
# while merge-queue, release or ready pull request jobs wait for a runner, keeps
# background work out of a busy queue, and re-runs the cancelled jobs once
# nothing that outranks them is waiting.
on:
  # Merge groups, releases and ready pull requests claim runners; finished runs free them.
  workflow_run:
    workflows: [CI, Qualification, release, release-halt, nightly, dependency inventory, release-system-live-test]
    types: [requested, completed]
  # Workflows cannot trigger on a merge group's removal or a job waiting for a
  # runner, so a periodic sweep covers what the events miss.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: runner-priority
  cancel-in-progress: false

jobs:
  schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts

      - name: Give runners to work in priority order
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_verification.py schedule
