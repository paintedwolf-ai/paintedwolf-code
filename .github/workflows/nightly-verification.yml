name: Nightly verification

on:
  workflow_call:
    inputs:
      source-sha:
        type: string
        required: true
      source-tree:
        type: string
        required: true
      suite:
        type: string
        default: all

permissions:
  contents: read
  actions: read

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # MLX 0.32 Metal kernels need the Xcode 26 toolchain; Linux runners ignore it.
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  verification:
    if: ${{ inputs.suite != 'release' }}
    uses: ./.github/workflows/verification.yml
    # Reads the measured durations that plan the matrix.
    permissions:
      contents: read
      actions: read
    with:
      profile: nightly
      suite: ${{ inputs.suite || 'all' }}
      source-sha: ${{ inputs.source-sha }}

  platform:
    if: ${{ (inputs.suite || 'all') == 'all' }}
    uses: ./.github/workflows/platform-verification.yml
    with:
      source-sha: ${{ inputs.source-sha }}

  e2e:
    if: ${{ contains(fromJSON('["all", "e2e"]'), inputs.suite || 'all') }}
    uses: ./.github/workflows/e2e-verification.yml
    permissions:
      contents: read
      actions: read
    with:
      web-parallel: 2
      source-sha: ${{ inputs.source-sha }}

  release-rehearsal:
    if: ${{ contains(fromJSON('["all", "release"]'), inputs.suite || 'all') }}
    uses: ./.github/workflows/release-rehearsal.yml
    with:
      source-sha: ${{ inputs.source-sha }}

  # Published builds exercise the upgrade harness with their compiled-in keys.
  installed-upgrade-fixtures:
    if: ${{ contains(fromJSON('["all", "release"]'), inputs.suite) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - uses: actions/setup-go@b2a9ab24f04885adb52faf6bdccb0bb7dfb3c187 # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false

      - name: Install public signature verification
        uses: ./.github/actions/setup-apt
        with:
          packages: minisign

      - name: Pin the two newest published releases and their public pointers
        id: prepare
        run: |
          ./task upgrade:rehearse -- --prepare-bundle --published \
            --source "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/installed-upgrade-fixtures"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: upload
        with:
          name: nightly-installed-upgrade-fixtures-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-upgrade-fixtures
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  # One case at a time, after the release rehearsal's macOS job, keeps nightly within the plan's macOS runners.
  installed-upgrade:
    needs: [installed-upgrade-fixtures, release-rehearsal]
    if: ${{ !cancelled() && needs.installed-upgrade-fixtures.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.installed-upgrade-fixtures.outputs.matrix) }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - uses: actions/setup-go@b2a9ab24f04885adb52faf6bdccb0bb7dfb3c187 # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      - name: Install frontend dependencies
        working-directory: lycaon-den
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.installed-upgrade-fixtures.outputs.artifact-id }}
          path: ${{ runner.temp }}/installed-upgrade-fixtures

      - name: Upgrade the installed published release
        env:
          CASE_ID: ${{ matrix.case_id }}
        run: |
          ./task upgrade:rehearse -- --bundle --case "$CASE_ID" \
            --fixtures "$RUNNER_TEMP/installed-upgrade-fixtures" --evidence "$RUNNER_TEMP/installed-upgrade-evidence"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-installed-upgrade-evidence-${{ matrix.case_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-upgrade-evidence
          if-no-files-found: error
          retention-days: 14

  nightly:
    # Judges failed and timed-out jobs, but a cancelled run must not wait for a runner to do so.
    if: ${{ !cancelled() }}
    needs: [verification, platform, e2e, release-rehearsal, installed-upgrade-fixtures, installed-upgrade]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}

      # Later plans in every tier order lanes and balance shards from this one file, so only a
      # run of every suite publishes it.
      - name: Collect lane timings
        id: receipts
        if: (inputs.suite || 'all') == 'all'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: receipt-verification-nightly-*
          path: ${{ runner.temp }}/receipts

      - name: Collect browser spec timings
        if: steps.receipts.outcome == 'success'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: receipt-playwright-web-*
          path: ${{ runner.temp }}/receipts

      - name: Merge lane timings
        id: timings
        if: steps.receipts.outcome == 'success'
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          SOURCE_TREE: ${{ inputs.source-tree }}
          PYTHONPATH: scripts
        run: python3 -m ci_policy.timings "$RUNNER_TEMP/receipts" "$RUNNER_TEMP/timings.json"

      - name: Publish timings
        if: steps.timings.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-timings
          path: ${{ runner.temp }}/timings.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Require all selected nightly verification
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SKIPPED: ${{ inputs.suite == 'release' && 'verification,platform,e2e' || inputs.suite == 'e2e' && 'platform,release-rehearsal,installed-upgrade-fixtures,installed-upgrade' || (inputs.suite || 'all') != 'all' && 'platform,e2e,release-rehearsal,installed-upgrade-fixtures,installed-upgrade' || '' }}
        run: python3 scripts/ci_verification.py gate --skipped "$SKIPPED"

      - name: Bind full nightly verification to its source
        if: inputs.suite == 'all'
        env:
          SOURCE_SHA: ${{ inputs.source-sha }}
          SOURCE_TREE: ${{ inputs.source-tree }}
          PYTHONPATH: scripts
        run: python3 -m ci_policy.nightly_evidence write

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: inputs.suite == 'all'
        with:
          name: nightly-source-${{ github.run_attempt }}
          path: nightly-source.json
          if-no-files-found: error
          retention-days: 90
