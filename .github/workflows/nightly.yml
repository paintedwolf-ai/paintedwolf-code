name: nightly

# Qualifies main daily and each release candidate as it lands, so a tag finds its
# commit's verdict already recorded. The release-time checks run alongside as an
# early warning: they judge the published world rather than the commit, so every
# release repeats them.
on:
  schedule:
    # 05:00 UTC — before the Den desktop nightly (macOS runner contention).
    - cron: "0 5 * * *"
  push:
    branches: [main]
    # A release candidate changes VERSION.
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      suite:
        description: Which qualification suites to run; only all records a verdict
        type: choice
        default: all
        options: [all, behavior, race, coverage, performance, fuzz]

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.sha }}
  cancel-in-progress: false

env:
  # MLX 0.32 Metal kernels need the Xcode 26 toolchain; Linux runners ignore it.
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  qualification:
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/qualification.yml
    with:
      suite: ${{ inputs.suite || 'all' }}

  release-checks:
    uses: ./.github/workflows/verification.yml
    with:
      profile: release

  # Prior release binary opens the corpus, then HEAD migrates the same store.
  upgrade-path:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false

      - uses: ./.github/actions/cache-go

      - name: Set up maintained OpenGrep
        uses: ./.github/actions/setup-opengrep

      - uses: ./.github/actions/setup-bialy

      - uses: ./.github/actions/cache-decide

      - name: Build HEAD sidecar
        run: ./task build:lycaon-dev

      - name: Prior-release upgrade rehearsal
        timeout-minutes: 90
        env:
          # Download the prior release from the public stable pointer.
          DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL }}
        run: ./task upgrade:rehearse

      - uses: ./.github/actions/verification-evidence
        if: always()
        timeout-minutes: 5
        with:
          name: nightly-upgrade-${{ github.run_attempt }}
          status: ${{ job.status }}

  nightly:
    # Judges failed and timed-out jobs, but a cancelled run must not wait for a runner to do so.
    if: ${{ !cancelled() }}
    needs: [qualification, release-checks, upgrade-path]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require every selected nightly job
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci_verification.py gate
