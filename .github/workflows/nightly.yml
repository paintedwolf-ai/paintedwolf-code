name: nightly
run-name: Nightly ${{ inputs.source-sha || github.sha }}

on:
  schedule:
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Which legs to run
        type: choice
        default: all
        options: [all, behavior, race, performance, fuzz, e2e, release]
      source-sha:
        description: Exact source commit; blank uses the dispatched commit
        type: string
        default: ''

permissions:
  contents: read

# One run at a time: a newer run replaces a pending one, and a running one finishes.
concurrency:
  group: nightly
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  # MLX 0.32 Metal kernels need the Xcode 26 toolchain; Linux runners ignore it.
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

# Every stage starts once the source is bound. The catalog caps the matrix at six
# runners; the platform jobs, browser shards, desktop journey and store upgrade
# rehearsal add six more, the release rehearsal five and the installed upgrade
# three, seven of the twenty on macOS.
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      tree: ${{ steps.source.outputs.tree }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Bind the verified source
        id: source
        env:
          NIGHTLY_SOURCE: ${{ inputs.source-sha }}
          PYTHONPATH: scripts
        run: python3 -m ci_policy.nightly_source

  verification:
    needs: source
    if: ${{ inputs.suite != 'release' }}
    uses: ./.github/workflows/verification.yml
    # Reads the measured durations that plan the matrix.
    permissions:
      contents: read
      actions: read
    with:
      profile: nightly
      suite: ${{ inputs.suite || 'all' }}
      source-sha: ${{ needs.source.outputs.sha }}

  platform:
    needs: source
    if: ${{ (inputs.suite || 'all') == 'all' }}
    uses: ./.github/workflows/platform-verification.yml
    with:
      source-sha: ${{ needs.source.outputs.sha }}

  e2e:
    needs: source
    if: ${{ contains(fromJSON('["all", "e2e"]'), inputs.suite || 'all') }}
    uses: ./.github/workflows/e2e-verification.yml
    with:
      web-parallel: 2
      source-sha: ${{ needs.source.outputs.sha }}

  # Prior release binary opens the corpus, then the source migrates the same store.
  upgrade-path:
    needs: source
    if: ${{ (inputs.suite || 'all') == 'all' }}
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          fetch-depth: 0

      - uses: ./.github/actions/setup-verification

      - uses: ./.github/actions/setup-bialy

      - uses: ./.github/actions/cache-decide

      - name: Install the public feed verifier
        timeout-minutes: 5
        run: HOMEBREW_NO_AUTO_UPDATE=1 brew install minisign

      - name: Prior-release upgrade rehearsal
        timeout-minutes: 90
        env:
          # Download the prior release from the public stable pointer.
          DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL }}
        run: ./task upgrade:rehearse

      - uses: ./.github/actions/verification-evidence
        if: always()
        timeout-minutes: 5
        with:
          name: nightly-upgrade-${{ github.run_attempt }}
          status: ${{ job.status }}

  release-rehearsal:
    needs: source
    if: ${{ contains(fromJSON('["all", "release"]'), inputs.suite || 'all') }}
    uses: ./.github/workflows/release-rehearsal.yml
    with:
      source-sha: ${{ needs.source.outputs.sha }}

  # The newest published release upgrades the one before it, from public signed bytes.
  # Both trust only their compiled-in keys, so this shows the harness works and says
  # nothing about the current source; the release gate qualifies the candidate.
  installed-upgrade-fixtures:
    needs: source
    if: ${{ contains(fromJSON('["all", "release"]'), inputs.suite || 'all') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b2a9ab24f04885adb52faf6bdccb0bb7dfb3c187 # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false

      - name: Install public signature verification
        uses: ./.github/actions/setup-apt
        with:
          packages: minisign

      - name: Pin the two newest published releases and their public pointers
        id: prepare
        run: |
          ./task upgrade:rehearse -- --prepare-bundle --published \
            --source "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/installed-upgrade-fixtures"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-installed-upgrade-fixtures-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-upgrade-fixtures
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  installed-upgrade:
    needs: [source, installed-upgrade-fixtures]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.installed-upgrade-fixtures.outputs.matrix) }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-go@b2a9ab24f04885adb52faf6bdccb0bb7dfb3c187 # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      - name: Install frontend dependencies
        working-directory: lycaon-den
        run: bun install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nightly-installed-upgrade-fixtures-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-upgrade-fixtures

      - name: Upgrade the installed published release
        env:
          CASE_ID: ${{ matrix.case_id }}
        run: |
          ./task upgrade:rehearse -- --bundle --case "$CASE_ID" \
            --fixtures "$RUNNER_TEMP/installed-upgrade-fixtures" --evidence "$RUNNER_TEMP/installed-upgrade-evidence"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: nightly-installed-upgrade-evidence-${{ matrix.case_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/installed-upgrade-evidence
          if-no-files-found: error
          retention-days: 14

  nightly:
    # Judges failed and timed-out jobs, but a cancelled run must not wait for a runner to do so.
    if: ${{ !cancelled() }}
    needs: [source, verification, platform, e2e, upgrade-path, release-rehearsal, installed-upgrade-fixtures, installed-upgrade]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Later plans in every tier order lanes and balance shards from this one file, so only a
      # run of every suite publishes it.
      - name: Collect lane timings
        id: receipts
        if: (inputs.suite || 'all') == 'all'
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: receipt-verification-nightly-*
          path: ${{ runner.temp }}/receipts

      - name: Merge lane timings
        id: timings
        if: steps.receipts.outcome == 'success'
        continue-on-error: true
        env:
          SOURCE_SHA: ${{ needs.source.outputs.sha }}
          SOURCE_TREE: ${{ needs.source.outputs.tree }}
          PYTHONPATH: scripts
        run: python3 -m ci_policy.timings "$RUNNER_TEMP/receipts" "$RUNNER_TEMP/timings.json"

      - name: Publish timings
        if: steps.timings.outcome == 'success'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-timings
          path: ${{ runner.temp }}/timings.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Require all selected nightly verification
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SKIPPED: ${{ inputs.suite == 'release' && 'verification,platform,e2e,upgrade-path' || inputs.suite == 'e2e' && 'platform,upgrade-path,release-rehearsal,installed-upgrade-fixtures,installed-upgrade' || (inputs.suite || 'all') != 'all' && 'platform,e2e,upgrade-path,release-rehearsal,installed-upgrade-fixtures,installed-upgrade' || '' }}
        run: python3 scripts/ci_verification.py gate --skipped "$SKIPPED"
