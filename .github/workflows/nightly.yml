name: nightly

on:
  schedule:
    # One nightly run owns backend and browser verification. Merges arrive at
    # every hour, so its two-runner footprint, not the hour, keeps it out of the
    # merge queue's way; 05:00 UTC is among the quietest hours.
    - cron: "0 5 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Which legs to run
        type: choice
        default: all
        options: [all, behavior, race, coverage, performance, fuzz, e2e]

permissions:
  contents: read

# One run at a time: a newer run replaces a pending one, and a running one finishes.
concurrency:
  group: nightly
  cancel-in-progress: false

env:
  # MLX 0.32 Metal kernels need the Xcode 26 toolchain; Linux runners ignore it.
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

# The stages run in turn, so one run holds at most two runners, and each stage
# runs whatever an earlier one concluded.
jobs:
  verification:
    uses: ./.github/workflows/verification.yml
    with:
      profile: nightly
      suite: ${{ github.event_name == 'schedule' && 'all' || inputs.suite }}

  e2e:
    needs: verification
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.suite == 'all' || inputs.suite == 'e2e') }}
    uses: ./.github/workflows/e2e-verification.yml
    with:
      web-parallel: 1

  # Prior release binary opens the corpus, then HEAD migrates the same store.
  upgrade-path:
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false

      - uses: ./.github/actions/cache-go

      - name: Set up maintained OpenGrep
        uses: ./.github/actions/setup-opengrep

      - uses: ./.github/actions/setup-bialy

      - uses: ./.github/actions/cache-decide

      - name: Build HEAD sidecar
        run: ./task build:lycaon-dev

      - name: Prior-release upgrade rehearsal
        timeout-minutes: 90
        env:
          # Download the prior release from the public stable pointer.
          DOWNLOAD_BASE_URL: ${{ vars.DOWNLOAD_BASE_URL }}
        run: ./task upgrade:rehearse

      - uses: ./.github/actions/verification-evidence
        if: always()
        timeout-minutes: 5
        with:
          name: nightly-upgrade-${{ github.run_attempt }}
          status: ${{ job.status }}

  quarantine:
    needs: e2e
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-verification
      - name: Observe quarantined tests
        env:
          PYTHONPATH: scripts
          LYCAON_LLM_MOCK: '1'
        run: python3 -m ci_policy.quarantine
      - uses: ./.github/actions/verification-evidence
        if: always()
        with:
          name: quarantine-${{ github.run_attempt }}
          status: ${{ job.status }}

  nightly:
    # Judges failed and timed-out jobs, but a cancelled run must not wait for a runner to do so.
    if: ${{ !cancelled() }}
    needs: [verification, upgrade-path, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require all selected nightly verification
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SKIPPED: ${{ github.event_name != 'schedule' && inputs.suite != 'all' && inputs.suite != 'e2e' && 'e2e' || '' }}
        run: python3 scripts/ci_verification.py gate --skipped "$SKIPPED"
