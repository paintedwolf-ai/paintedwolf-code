name: AUR recipe delivery

on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: Successful protected main release controller run
        required: true
        type: string
      source_commit:
        description: Exact selected release source commit
        required: true
        type: string
      channel:
        description: Release channel whose published pacman generations the recipe pins
        type: choice
        options: [stable, preview]
        default: stable
      operation:
        description: Prepare a recipe or request separately authorized AUR delivery
        type: choice
        options: [prepare, publish-aur]
        default: prepare

permissions:
  contents: read
  actions: read

concurrency:
  group: release-static-update
  cancel-in-progress: false

jobs:
  # The controller run supplies its retained public files; the published pacman
  # repository supplies the active generations. Both bind the selected source commit.
  inputs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@5064d95ba18d4a9dda7c4cc67adeb03aea1a2a14 # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false

      - name: Admit the selected controller run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          OPERATION: ${{ inputs.operation }}
        run: |
          ./task release:publish:aur-recipe -- request \
            --release-run-id "$RELEASE_RUN_ID" --source-commit "$SOURCE_COMMIT" --operation "$OPERATION"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RELEASE_RUN_ID" > "$RUNNER_TEMP/controller-run.json"
          ./task release:publish:aur-recipe -- provenance --run "$RUNNER_TEMP/controller-run.json" \
            --repository-id "$GITHUB_REPOSITORY_ID" --release-run-id "$RELEASE_RUN_ID" \
            --source-commit "$SOURCE_COMMIT"

      - name: Collect the AUR delivery inputs
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          CHANNEL: ${{ inputs.channel }}
          PACMAN_REPOSITORY_URL: ${{ vars.PACMAN_REPOSITORY_URL }}
        run: |
          gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name release-public-artifacts --dir "$RUNNER_TEMP/final-artifacts"
          ./task release:publish:aur-recipe -- collect --repository-url "$PACMAN_REPOSITORY_URL" \
            --channel "$CHANNEL" --source-commit "$SOURCE_COMMIT" \
            --final-artifacts "$RUNNER_TEMP/final-artifacts" --output "$RUNNER_TEMP/aur-inputs"

      - name: Retain the AUR delivery inputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-aur-delivery-inputs
          path: ${{ runner.temp }}/aur-inputs
          if-no-files-found: error

  recipe:
    needs: inputs
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
    environment: release-aur
    timeout-minutes: 30
    steps:
      - name: Prepare the recipe owner
        run: |
          pacman -Syu --noconfirm --needed base-devel python git gnupg sudo
          useradd --create-home pw-aur
          printf '%s\n' 'pw-aur ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/pw-aur
          chmod 0440 /etc/sudoers.d/pw-aur

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@5064d95ba18d4a9dda7c4cc67adeb03aea1a2a14 # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false

      - name: Receive the AUR delivery inputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: linux-aur-delivery-inputs
          path: /tmp/aur-inputs

      - name: Hand the inputs to the recipe owner
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          mkdir /tmp/aur-output
          chown -R pw-aur:pw-aur "$WORKSPACE" /tmp/aur-inputs /tmp/aur-output

      - name: Prepare the separately bound recipe
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          OPERATION: ${{ inputs.operation }}
        run: |
          sudo -H --preserve-env=PATH -u pw-aur ./task release:publish:aur-recipe -- prepare \
            --input-root /tmp/aur-inputs --source-commit "$SOURCE_COMMIT" \
            --operation "$OPERATION" --receipt /tmp/aur-output/delivery.json
          # Public transport remains closed until the controller reevaluates the retained
          # campaign and files and authorizes publish-aur separately from binary activation.

      - name: Retain the prepared recipe and delivery facts
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aur-recipe-delivery-plan
          path: /tmp/aur-output
          if-no-files-found: warn
