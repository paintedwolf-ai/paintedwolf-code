name: Portable Python Paired Timing

on:
  push:
    branches:
      - portable-python/py10-paired-baseline
  workflow_dispatch:
    inputs:
      mode:
        description: Execution mode (baseline or compare)
        type: choice
        options:
          - baseline
          - compare
        default: compare
      samples:
        description: Number of cold and warm samples per workload
        type: string
        default: '5'
      min-idle:
        description: Minimum required pre-series CPU idle percentage
        type: string
        default: '90'
      precheck-seconds:
        description: Pre-series CPU idle sampling duration in seconds
        type: string
        default: '30'

permissions:
  contents: read

jobs:
  macos-arm64-paired:
    name: Paired timing (macos-15 arm64)
    runs-on: macos-15
    timeout-minutes: 45
    env:
      EXPECTED_ARCH: arm64
      SAMPLES: ${{ inputs.samples || '5' }}
      MIN_IDLE: ${{ inputs.min-idle || '90' }}
      PRECHECK_SECONDS: ${{ inputs.precheck-seconds || '30' }}
    steps:
      - name: Assert effective architecture, quiet Spotlight on ephemeral VM, and capture runner metadata
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_ARCH="$(uname -m)"
          echo "Expected arch: ${EXPECTED_ARCH}, actual arch: ${ACTUAL_ARCH}"
          test "${ACTUAL_ARCH}" = "${EXPECTED_ARCH}"
          sudo mdutil -a -i off || true
          OUT_DIR="${RUNNER_TEMP}/paired-out"
          mkdir -p "${OUT_DIR}"
          {
            echo "job_name=macos-arm64-paired"
            echo "runner_os=${RUNNER_OS}"
            echo "runner_arch=${RUNNER_ARCH}"
            echo "image_os=${ImageOS:-unknown}"
            echo "image_version=${ImageVersion:-unknown}"
            echo "github_run_id=${GITHUB_RUN_ID}"
            echo "github_run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "github_run_url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "github_sha=${GITHUB_SHA}"
            echo "uname=$(uname -a)"
            echo "logical_cpus=$(sysctl -n hw.logicalcpu)"
            echo "cpu_brand=$(sysctl -n machdep.cpu.brand_string || true)"
            echo "mem_bytes=$(sysctl -n hw.memsize)"
            sw_vers
          } | tee "${OUT_DIR}/runner-metadata.txt"

      - name: Generate ephemeral RSA-4096 keypair (pre-timing)
        shell: bash
        run: |
          set -euo pipefail
          KEY_DIR="${RUNNER_TEMP}/ephemeral-key"
          mkdir -p "${KEY_DIR}"
          chmod 700 "${KEY_DIR}"
          openssl genrsa -out "${KEY_DIR}/priv.pem" 4096 2>/dev/null
          openssl rsa -in "${KEY_DIR}/priv.pem" -pubout -out "${KEY_DIR}/pub.pem" 2>/dev/null
          shasum -a 256 "${KEY_DIR}/pub.pem"

      - name: Upload ephemeral public key artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ephemeral-pubkey-${{ github.run_id }}
          path: ${{ runner.temp }}/ephemeral-key/pub.pem
          retention-days: 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b2a9ab24f04885adb52faf6bdccb0bb7dfb3c187 # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false

      - name: Fetch, decrypt, verify, and pre-stage artifacts from ephemeral transport ref (pre-timing)
        shell: bash
        run: |
          set -euo pipefail
          unset PW_PORTABLE_PYTHON_IMAGE_DIR PW_PORTABLE_PYTHON_ENGINE_DIR
          REF="refs/heads/tmp/py10-transport-${GITHUB_RUN_ID}"
          echo "Waiting for encrypted transport ref ${REF} (up to 360s)..."
          FOUND=0
          for i in $(seq 1 72); do
            if git ls-remote --exit-code --heads origin "${REF}" >/dev/null 2>&1; then
              FOUND=1
              echo "Found ${REF} on poll ${i}"
              break
            fi
            sleep 5
          done
          if [[ "${FOUND}" != "1" ]]; then
            echo "ERROR: timed out waiting for ${REF}" >&2
            exit 1
          fi

          TDIR="${RUNNER_TEMP}/transport-extract"
          PDIR="${RUNNER_TEMP}/paired-payload"
          mkdir -p "${TDIR}" "${PDIR}"
          git fetch --depth=1 origin "${REF}:refs/remotes/origin/py10-transport" --quiet
          git archive "refs/remotes/origin/py10-transport" | tar -C "${TDIR}" -xf -

          (
            cd "${TDIR}"
            cat chunk_* > payload.enc
            shasum -a 256 -c payload.enc.sha256
            openssl pkeyutl -decrypt -inkey "${RUNNER_TEMP}/ephemeral-key/priv.pem" -pkeyopt rsa_padding_mode:oaep -in sym.key.enc -out sym.key
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 -pass file:sym.key -in payload.enc | tar -C "${PDIR}" -xf -
          )
          rm -rf "${TDIR}" "${RUNNER_TEMP}/ephemeral-key"

          # Pre-compile the Go test binary ONCE before any staging/timing
          TEST_BIN="${RUNNER_TEMP}/paired_baseline.test"
          (
            cd "${GITHUB_WORKSPACE}/lycaon"
            CGO_ENABLED=1 go test -c -o "${TEST_BIN}" ./internal/portablepython
          ) 2>&1 | tee "${RUNNER_TEMP}/paired-out/compile-harness.log"

          # Stage every pair defined in compare-plan.json (and compile per-side test binary if compile_rev is specified) BEFORE timing
          python3 - "${PDIR}" "${RUNNER_TEMP}/stages" "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/paired-out" "${RUNNER_TEMP}/bins" <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path

          pdir = Path(sys.argv[1])
          stage_base = Path(sys.argv[2])
          repo = Path(sys.argv[3])
          out_dir = Path(sys.argv[4])
          bin_dir = Path(sys.argv[5])
          bin_dir.mkdir(parents=True, exist_ok=True)
          plan = json.loads((pdir / "compare-plan.json").read_text())

          def sha256_file(p: Path) -> str:
              h = hashlib.sha256()
              with p.open("rb") as fh:
                  for chunk in iter(lambda: fh.read(65536), b""):
                      h.update(chunk)
              return h.hexdigest()

          for name, spec in plan["pairs"].items():
              eng_arc = pdir / spec["engine_archive"]
              img_arc = pdir / spec["image_archive"]
              mf = pdir / spec["manifest"]
              got_e = sha256_file(eng_arc)
              got_i = sha256_file(img_arc)
              if got_e != spec["engine_archive_sha256"]:
                  raise SystemExit(f"SHA256 mismatch for {name} engine: got {got_e}, want {spec['engine_archive_sha256']}")
              if got_i != spec["image_archive_sha256"]:
                  raise SystemExit(f"SHA256 mismatch for {name} image: got {got_i}, want {spec['image_archive_sha256']}")
              src_repo = repo
              if spec.get("compile_rev"):
                  rev = spec["compile_rev"]
                  wt = bin_dir / f"src-{name}"
                  subprocess.run(["git", "-C", str(repo), "fetch", "--depth=1", "origin", rev], check=True)
                  subprocess.run(["git", "-C", str(repo), "worktree", "add", "--detach", str(wt), rev], check=True)
                  src_repo = wt
                  side_bin = bin_dir / f"paired_baseline-{name}.test"
                  env = dict(os.environ, CGO_ENABLED="1")
                  print(f"Compiling per-side test binary for {name} at {rev} -> {side_bin}", flush=True)
                  cres = subprocess.run(
                      ["go", "test", "-c", "-o", str(side_bin), "./internal/portablepython"],
                      cwd=str(wt / "lycaon"),
                      env=env,
                      capture_output=True,
                      text=True,
                  )
                  (out_dir / f"compile-{name}.log").write_text(cres.stdout + cres.stderr)
                  if cres.returncode != 0:
                      print(cres.stdout, cres.stderr)
                      raise SystemExit(f"go test -c failed for {name} ({rev}): rc={cres.returncode}")
              sroot = stage_base / name
              sroot.mkdir(parents=True, exist_ok=True)
              cmd = [
                  "bash", str(src_repo / "scripts/portable-python/stage-bundled.sh"),
                  "--manifest", str(mf),
                  "--root", str(sroot),
                  "--target", "aarch64-apple-darwin",
                  "--artifact-dir", str(eng_arc.parent),
                  "--image-source", str(img_arc),
                  "--require-engine", "--require-image",
              ]
              print(f"Staging pair {name} -> {sroot}", flush=True)
              res = subprocess.run(cmd, capture_output=True, text=True)
              (out_dir / f"stage-{name}.log").write_text(res.stdout + res.stderr)
              if res.returncode != 0:
                  print(res.stdout, res.stderr)
                  raise SystemExit(f"stage-bundled.sh failed for {name}: rc={res.returncode}")
          print("ALL_PAIRS_VERIFIED_AND_STAGED_OK")
          PY

      - name: Run alternating in-runner paired comparisons (overrides UNSET, graded by grade_paired_receipt.py)
        shell: bash
        run: |
          set -euo pipefail
          unset PW_PORTABLE_PYTHON_IMAGE_DIR PW_PORTABLE_PYTHON_ENGINE_DIR
          echo "Allowing fresh macOS VM boot daemons 45s to settle before timed comparisons..."
          sleep 45
          python3 - "${RUNNER_TEMP}/paired-payload" "${RUNNER_TEMP}/stages" "${GITHUB_WORKSPACE}" "${RUNNER_TEMP}/paired-out" "${RUNNER_TEMP}/paired_baseline.test" "${SAMPLES}" "${MIN_IDLE}" "${PRECHECK_SECONDS}" <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          pdir, sbase, repo, out_base, test_bin, samples, min_idle, pre_s = sys.argv[1:]
          pdir, sbase, repo, out_base = Path(pdir), Path(sbase), Path(repo), Path(out_base)
          plan = json.loads((pdir / "compare-plan.json").read_text())

          overall_rc = 0
          for cmp in plan["comparisons"]:
              cname = cmp["name"]
              b_spec = plan["pairs"][cmp["baseline"]]
              c_spec = plan["pairs"][cmp["candidate"]]
              c_out = out_base / cname
              c_out.mkdir(parents=True, exist_ok=True)
              cmd = [
                  "bash", str(repo / "scripts/portable-python-qual/paired/run-paired.sh"),
                  "--mode", "compare",
                  "--repo-root", str(repo),
                  "--out-dir", str(c_out),
                  "--test-bin", test_bin,
                  "--baseline-dir", str(sbase / cmp["baseline"]),
                  "--candidate-dir", str(sbase / cmp["candidate"]),
                  "--baseline-manifest", str(pdir / b_spec["manifest"]),
                  "--candidate-manifest", str(pdir / c_spec["manifest"]),
                  "--baseline-product-rev", b_spec["product_rev"],
                  "--candidate-product-rev", c_spec["product_rev"],
                  "--baseline-image-archive", str(pdir / b_spec["image_archive"]),
                  "--baseline-engine-archive", str(pdir / b_spec["engine_archive"]),
                  "--candidate-image-archive", str(pdir / c_spec["image_archive"]),
                  "--candidate-engine-archive", str(pdir / c_spec["engine_archive"]),
                  "--samples", samples,
                  "--min-idle", min_idle,
                  "--precheck-seconds", pre_s,
                  "--max-attempts", "6",
                  "--retry-wait", "20",
              ]
              b_bin = Path(test_bin).parent / "bins" / f"paired_baseline-{cmp['baseline']}.test"
              c_bin = Path(test_bin).parent / "bins" / f"paired_baseline-{cmp['candidate']}.test"
              if b_bin.is_file():
                  cmd += ["--baseline-test-bin", str(b_bin)]
              if c_bin.is_file():
                  cmd += ["--candidate-test-bin", str(c_bin)]
              if cmp.get("swap_warm_order"):
                  cmd.append("--swap-warm-order")
              print(f"=== Running comparison {cname}: {cmp['baseline']} vs {cmp['candidate']} ===", flush=True)
              res = subprocess.run(cmd)
              if res.returncode != 0:
                  print(f"Comparison {cname} exited with rc={res.returncode}", flush=True)
                  overall_rc = res.returncode
          sys.exit(overall_rc)
          PY

      - name: Upload paired timing evidence (receipts and telemetry only)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portable-python-paired-compare-macos-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/paired-out/
          if-no-files-found: warn
          retention-days: 14
