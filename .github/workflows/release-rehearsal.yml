name: Release rehearsal

# The release's scripts on tiny payloads, signed with disposable keys. No job here
# holds a credential or publishes; notarization and stapling stay in the release.
on:
  workflow_call:
    inputs:
      source-sha:
        description: Exact source commit to rehearse
        type: string
        required: true

permissions:
  contents: read

env:
  # MLX Metal kernels need the Xcode 26 toolchain; Linux runners ignore it.
  DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer

jobs:
  assembly:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - uses: actions/setup-go@b2a9ab24f04885adb52faf6bdccb0bb7dfb3c187 # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false

      - name: Install the signature tools
        uses: ./.github/actions/setup-apt
        with:
          packages: minisign jq

      - name: Rehearse upload limits and release assembly
        run: ./task release:live-test -- --assembly --receipt "$RUNNER_TEMP/rehearsal/assembly.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-rehearsal-assembly-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rehearsal
          if-no-files-found: error
          retention-days: 14

  # Production control files, conffiles and maintainer scripts around a tiny payload, in the pinned image.
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - uses: actions/setup-go@b2a9ab24f04885adb52faf6bdccb0bb7dfb3c187 # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false

      - name: Lint Debian and RPM metadata
        run: |
          set -euo pipefail
          ./task release:rehearse:deb-metadata -- --container --receipt "$RUNNER_TEMP/rehearsal/deb-metadata.json"
          ./task release:rehearse:rpm-metadata -- --container --receipt "$RUNNER_TEMP/rehearsal/rpm-metadata.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-rehearsal-packages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rehearsal
          if-no-files-found: error
          retention-days: 14

  repositories:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - uses: actions/setup-go@b2a9ab24f04885adb52faf6bdccb0bb7dfb3c187 # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false

      - name: Install the native repository tools
        uses: ./.github/actions/setup-apt
        with:
          packages: apt-utils rpm createrepo-c dnf libarchive-tools gnupg openssl
          recommends: 'false'

      - name: Sign packages and assemble apt and dnf repositories
        run: |
          set -euo pipefail
          ./task release:rehearse:linux-signing -- --receipt "$RUNNER_TEMP/rehearsal/linux-signing.json"
          ./task release:rehearse:native-repositories -- --receipt "$RUNNER_TEMP/rehearsal/native-repositories.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-rehearsal-repositories-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rehearsal
          if-no-files-found: error
          retention-days: 14

  pacman:
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel@sha256:061679925e5d5028f2df9395d441ce6c4b9accf0157ff3486c06b6962e014ef1
    timeout-minutes: 30
    steps:
      - name: Prepare the native Arch toolchain and an unprivileged builder
        run: |
          pacman -Syu --noconfirm --needed base-devel python git openssl gnupg sudo unzip
          useradd --create-home pw-repository
          printf '%s\n' 'pw-repository ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/pw-repository
          chmod 0440 /etc/sudoers.d/pw-repository

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          persist-credentials: false

      - uses: actions/setup-go@b2a9ab24f04885adb52faf6bdccb0bb7dfb3c187 # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false

      # makepkg refuses to run as root.
      - name: Assemble signed pacman repositories
        env:
          WORKSPACE: ${{ github.workspace }}
        run: |
          chown -R pw-repository:pw-repository "$WORKSPACE"
          install -d -o pw-repository /tmp/rehearsal
          sudo -H --preserve-env=PATH -u pw-repository \
            ./task release:rehearse:pacman-repositories -- --receipt /tmp/rehearsal/pacman-repositories.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-rehearsal-pacman-${{ github.run_attempt }}
          path: /tmp/rehearsal
          if-no-files-found: error
          retention-days: 14

  # The unsigned bundle needs no Developer ID; its updater archive is signed with a disposable key.
  macos:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source-sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b2a9ab24f04885adb52faf6bdccb0bb7dfb3c187 # v7.0.0
        with:
          go-version-file: lycaon/go.mod
          cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          no-cache: true

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal

      - uses: ./.github/actions/cache-decide
      - uses: ./.github/actions/cache-go
      - uses: ./.github/actions/cache-notices-tools
      - uses: ./.github/actions/cache-document-core
      - uses: ./.github/actions/cache-release-build
      - uses: ./.github/actions/setup-opengrep
      - uses: ./.github/actions/setup-bialy

      - name: Install frontend dependencies
        working-directory: lycaon-den
        run: bun install --frozen-lockfile

      - name: Build the unsigned bundle
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/updater/rehearsal.key"
          # bun run drops an empty argument, so the disposable key gets a throwaway password.
          (cd lycaon-den && bun run tauri signer generate --ci --password rehearsal --write-keys "$key")
          TAURI_SIGNING_PRIVATE_KEY="$(cat "$key")" TAURI_SIGNING_PRIVATE_KEY_PASSWORD=rehearsal ./task den:bundle -- --unsigned

      - name: Audit the unsigned bundle
        run: |
          set -euo pipefail
          bundle="$(find lycaon-den/src-tauri/target -maxdepth 4 -path '*/release/bundle' -type d -print -quit)"
          ./task bundle:verify -- --app "$(find "$bundle/macos" -maxdepth 1 -name '*.app' -print -quit)" \
            --dmg "$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)"

      - name: Rehearse the updater archive and the cask
        run: |
          set -euo pipefail
          bundle="$(find lycaon-den/src-tauri/target -maxdepth 4 -path '*/release/bundle' -type d -print -quit)"
          ./task release:live-test -- --macos --app "$(find "$bundle/macos" -maxdepth 1 -name '*.app' -print -quit)" \
            --dmg "$(find "$bundle/dmg" -maxdepth 1 -name '*.dmg' -print -quit)" \
            --public-key "$(cat "$RUNNER_TEMP/updater/rehearsal.key.pub")" --receipt "$RUNNER_TEMP/rehearsal/macos.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: release-rehearsal-macos-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rehearsal
          if-no-files-found: warn
          retention-days: 14
