      - "/"
      - "/.github/actions/*"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - major
          - minor
          - patch

  - package-ecosystem: bun
