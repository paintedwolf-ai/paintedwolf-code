title: Tauri shell crates (`lycaon-den/src-tauri`)
intro: |
  Declared in `Cargo.toml`; the Pinned column shows the `Cargo.lock` resolution. No CI job or
  `./task` target builds the Windows shell, so Windows-only crates remain unverified until a
  Windows build runs.
manifest:
  kind: cargo
  path: lycaon-den/src-tauri/Cargo.toml
  lock: lycaon-den/src-tauri/Cargo.lock
  dependabot_group: cargo-dependencies

packages:
  tauri:
    urgency: critical
    friction: moderate
    notes: |
      Webview host, IPC, and asset isolation. Keep `@tauri-apps/cli` and `@tauri-apps/api` in
      step.
  tauri-build:
    urgency: critical
    friction: moderate
    notes: |
      Moves with `tauri`.
  tauri-plugin-updater:
    urgency: critical
    friction: high
    notes: |
      In-place updates. Prove the chain with `scripts/release-validate-updater-manifest.sh` and
      `scripts/verify-updater-signature.sh` against the `tauri.conf.json` public key; see
      [Release operations](release.md). `Cargo.toml` selects its features explicitly: the
      plugin's default `system-proxy` feature would route the check through OS proxy discovery,
      which the shell's other clients also avoid.
  minisign-verify:
    urgency: high
    friction: low
    notes: |
      Used by `scripts/verify-updater-signature.sh` through the `verify_updater_signature`
      example.
  tauri-plugin-dialog:
    urgency: moderate
    friction: low
  tauri-plugin-shell:
    urgency: moderate
    friction: low
  tauri-plugin-notification:
    urgency: moderate
    friction: low
  reqwest:
    urgency: high
    friction: low
    notes: |
      Async HTTP.
  rustls:
    urgency: high
    friction: low
    notes: |
      TLS with the `ring` provider.
  ed25519-dalek:
    urgency: high
    friction: moderate
    notes: |
      Signs secret-reveal requests to the sidecar (`sidecar.rs`). Bump a major together with
      `rand`.
  rand:
    urgency: high
    friction: moderate
    notes: |
      Supplies `OsRng` to `ed25519-dalek`.
  ureq:
    urgency: low
    friction: high
    updates: no-major
    notes: |
      Blocking localhost calls to the sidecar (attachment import, secret reveal). Version 3
      rewrites the API.
  tokio:
    urgency: moderate
    friction: low
  objc2:
    urgency: moderate
    friction: high
    notes: |
      Cocoa, WebKit, LocalAuthentication, and notification bindings. Treat 0.x minor bumps as
      breaking.
  objc2-foundation:
    urgency: moderate
    friction: high
  objc2-app-kit:
    urgency: moderate
    friction: high
  objc2-web-kit:
    urgency: moderate
    friction: high
  objc2-local-authentication:
    urgency: moderate
    friction: high
  objc2-user-notifications:
    urgency: moderate
    friction: high
  windows:
    urgency: moderate
    friction: moderate
    notes: |
      Credential UI and window APIs; unverified on Windows.
  windows-sys:
    urgency: moderate
    friction: moderate
  rfd:
    urgency: low
    friction: low
    notes: |
      File picker.
  which:
    urgency: low
    friction: low
    notes: |
      Executable lookup.
  arboard:
    urgency: low
    friction: low
    notes: |
      Clipboard.
