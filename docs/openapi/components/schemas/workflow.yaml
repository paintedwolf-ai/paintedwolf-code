    PendingFeedback:
      x-go-generate: true
      x-go-field-order: ["phase_id", "prompt", "response_type", "options", "allow_other", "artifact_id", "artifact_ids", "purpose", "issued_revision", "secret"]
      type: object
      description: Live coordinator→human ask awaiting a response.
      required:
      - phase_id
      - prompt
      additionalProperties: false
      properties:
        phase_id:
          type: string
          pattern: '^[a-z0-9_-]+$'
          description: Route key and stable identity for the pending input.
        prompt:
          type: string
          description: >-
            Card question (ask_user one decision; markdown OK; host-capped at 800
            code points so the prompt fits the 12rem composer-dock prompt area).
        response_type:
          type: string
          enum: [text, single_choice, multi_choice, secret]
          description: >-
            Discriminates the resolve endpoint — text answers go to feedback,
            choices to decisions, and secret values to the protected secret endpoint.
        options:
          type: array
          items:
            type: string
          description: Choice options for single_choice/multi_choice asks.
        allow_other:
          type: boolean
          description: Whether a free-text answer outside options is accepted (choice asks).
        artifact_id:
          type: string
          format: uuid
          description: Exact visual artifact under review.
        artifact_ids:
          x-go-name: "ArtifactIDs"
          type: array
          maxItems: 4
          items:
            type: string
            format: uuid
          description: Exact visual artifacts under comparison.
        purpose:
          type: string
          enum: [clarify, review, compare, secret]
        secret:
          x-go-pointer: true
          $ref: workflow.yaml#/components/schemas/SecretInputMeta
        issued_revision:
          type: integer
          format: int64
          minimum: 1
          description: Run revision that issued this request; retained with the answer for audit.
