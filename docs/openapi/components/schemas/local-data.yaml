        mode: {type: string, enum: [forever, max_age, max_bytes]}
        max_age_days: {type: integer, format: int64, minimum: 1}
        max_bytes: {type: integer, format: int64, minimum: 1}
    HistoryRetentionPolicy:
      type: object
      x-go-generate: true
      additionalProperties: false
      required: [version, revision, suspended, recordings, checkpoints, source_revisions, scan_detail, receipt_detail]
      properties:
        version: {type: integer, minimum: 1, maximum: 1}
        revision: {type: integer, format: int64, minimum: 1}
        suspended: {type: boolean}
        recordings: {$ref: '#/components/schemas/HistoryRetentionRule'}
        checkpoints: {$ref: '#/components/schemas/HistoryRetentionRule'}
        source_revisions: {$ref: '#/components/schemas/HistoryRetentionRule'}
        scan_detail: {$ref: '#/components/schemas/HistoryRetentionRule'}
        receipt_detail: {$ref: '#/components/schemas/HistoryRetentionRule'}
    HistoryStorageLane:
      type: object
      x-go-generate: true
      additionalProperties: false
      required: [id, stored_bytes, logical_bytes, shared_bytes]
      properties:
        id:
          type: string
          pattern: '^[a-z0-9_-]+$'
        stored_bytes:
          type: integer
          format: int64
          description: Retained file bytes, deduplicated within the lane. This is not exclusive filesystem allocation. The upgrade-recovery lane reports zero here because its independent snapshots may share physical extents with live files.
        logical_bytes:
          type: integer
          format: int64
          description: Uncompressed content bytes where available. For upgrade-recovery, the sum of retained snapshot file lengths, which may share physical disk space and must not be added to a physical storage total.
        shared_bytes: {type: integer, format: int64}
