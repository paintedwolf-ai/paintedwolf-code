      type: object
      x-go-generate: true
      additionalProperties: false
      required: [scope_type, scope_id, protected]
      properties:
        scope_type: {type: string, enum: [project, session]}
        scope_id:
          type: string
          format: uuid
        protected: {type: boolean}
    HistoryClassUsage:
      type: object
      x-go-generate: true
      additionalProperties: false
      required: [class, content_bytes]
      properties:
        class: {type: string, enum: [recordings, checkpoints, source_revisions, scan_detail, receipt_detail]}
        content_bytes:
          type: integer
          format: int64
          minimum: 0
          description: Uncompressed retained content referenced by this class, deduplicated within the class. SQLite classes count serialized detail fields, excluding row and page overhead. Shared bodies can appear in multiple classes; this is neither exclusive disk allocation nor reclaimable bytes.
