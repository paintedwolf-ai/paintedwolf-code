        session_id:
          type: string
          format: uuid
        page_id:
          type: string
          pattern: '^[A-Za-z0-9_.:-]+$'
        assistant_message_id:
          type: string
          format: uuid
          description: Assistant transcript row that originated this preview surface.
        tool_call_id:
          type: string
          pattern: '^[A-Za-z0-9_.:-]+$'
          description: Tool invocation within the containing assistant row.
        parent_session_id:
          type: string
          format: uuid
        seq:
          type: integer
          format: int64
        mime:
          type: string
        jpeg_b64:
          type: string
        width:
          type: integer
        height:
          type: integer
        url:
          type: string
        title:
          type: string
        idle:
          x-go-pointer: true
