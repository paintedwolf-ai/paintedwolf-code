      additionalProperties: false
      properties:
        area:
          $ref: settings-area.generated.yaml#/components/schemas/SettingsArea
        scope:
          $ref: settings/preferences.yaml#/components/schemas/SettingsScope
        action:
          type: string
    ArtifactChangeOp:
      type: string
      enum:
      - written
      - deleted
    ArtifactEvent:
      x-go-generate: true
      type: object
      required:
      - artifact_id
      - project_id
      - op
      additionalProperties: false
      description: >-
        A durable visual artifact was written or deleted. Identity only: clients
        re-read the artifact list so one tile's metadata, reference counts, and
        bytes all render from one place.
      properties:
        artifact_id:
          type: string
          format: uuid
        project_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
          description: Producing (holder) session, when one is known.
        root_session_id:
          type: string
          format: uuid
          description: Session tree that resolves the event, when one is known.
        op:
          $ref: events.yaml#/components/schemas/ArtifactChangeOp
    SourceChange:
      x-go-generate: true
      type: object
      required:
      - root_id
      - path
      - op
      - origin
      - changed_at
      additionalProperties: false
      description: >-
        One host-authoritative or external filesystem transition. Rename
        carries from_path; agent/user changes may carry attribution and
        after_sha256.
      properties:
        root_id:
          type: string
          format: uuid
        path:
          type: string
          description: Root-relative path after the change (destination for rename).
        from_path:
          type: string
          description: Root-relative path before a rename; omit for other ops.
        op:
          $ref: events.yaml#/components/schemas/SourceChangeOp
        origin:
          $ref: events.yaml#/components/schemas/SourceChangeOrigin
        is_dir:
          x-go-pointer: true
          type: boolean
          description: Entry kind after an upsert; omitted when unknown or deleted.
        session_id:
          type: string
          format: uuid
          description: Producing session attribution; never event-delivery scope.
        worker_id:
          type: string
          format: uuid
        turn:
          type: integer
          minimum: 0
        tool_call_id:
          type: string
          pattern: '^[A-Za-z0-9_.:-]+$'
        after_sha256:
          type: string
          description: Hex SHA-256 of content after a host write; omit for external and delete.
        changed_at:
          type: string
          format: date-time
    SourceChangesEvent:
      x-go-generate: true
      type: object
      required:
      - project_id
      - workspace_id
      - workspace_kind
      - changes
      - resync
      additionalProperties: false
      description: >-
        A bounded set of filesystem transitions for one physical source
        workspace. Resync means the path set overflowed or exact transitions
        are unavailable; clients rehydrate their loaded projection.
      properties:
        project_id:
          type: string
          format: uuid
        workspace_id:
          type: string
          pattern: '^ws_[0-9a-f]{32}$'
          minLength: 1
        workspace_kind:
          $ref: '#/components/schemas/SourceWorkspaceKind'
        changes:
          type: array
          maxItems: 512
          items:
            $ref: '#/components/schemas/SourceChange'
        resync:
          type: boolean
        git_changed:
          type: boolean
          description: >-
            A git ref surface moved in this window — possibly with no file
            changes at all (a commit). Consumers refresh git-derived
            comparisons even when changes is empty.
    EditorDocumentEvent:
      x-go-generate: true
      type: object
      additionalProperties: false
      description: >-
        Document invalidation and presentation metadata. Reconcile through
        state-vector synchronization; events never transport document text.
      required: [id, project_id, workspace_id, file_id, root_id, path, base_sha256, encoding, size_bytes, eol, base_eol, mixed_eol, base_mixed_eol, revision, dirty, diverged, absent, secret_screen_status, content_changed]
      properties:
        epoch: {type: integer, format: int64, minimum: 1}
        published_revision: {type: integer, format: int64, minimum: 1}
