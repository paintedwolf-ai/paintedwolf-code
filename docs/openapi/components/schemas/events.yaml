      properties:
        session_id:
          type: string
          format: uuid
        page_id:
          type: string
          pattern: '^[A-Za-z0-9_.:-]+$'
        assistant_message_id:
          type: string
          format: uuid
          description: Assistant transcript row that originated this preview surface.
        tool_call_id:
          type: string
          pattern: '^[A-Za-z0-9_.:-]+$'
          description: Tool invocation within the containing assistant row.
        parent_session_id:
          type: string
          format: uuid
        width:
          type: integer
        height:
          type: integer
        url:
          type: string
        title:
          type: string
        idle:
          x-go-pointer: true
          type: boolean
    PreviewWatchRequest:
      x-go-generate: true
      type: object
      required:
      - watching
      - page_id
      additionalProperties: false
      properties:
        watching:
          type: boolean
        page_id:
          type: string
          pattern: '^[A-Za-z0-9_.:-]+$'
    PreviewWatchResult:
      x-go-generate: true
      type: object
      required:
      - watching
      - page_id
      additionalProperties: false
      properties:
        watching:
          type: boolean
        page_id:
          type: string
          pattern: '^[A-Za-z0-9_.:-]+$'
    ProviderEvent:
      x-go-generate: true
      type: object
      required:
      - provider_id
      - action
      additionalProperties: false
      properties:
        provider_id:
          type: string
          pattern: "^[a-zA-Z0-9_.-]+$"
        action:
          type: string
    ModelPolicyEvent:
      x-go-generate: true
      type: object
      required:
      - scope
      - action
      additionalProperties: false
      properties:
        scope:
          type: string
        action:
          type: string
    SettingsEvent:
      x-go-generate: true
      type: object
      required:
      - area
      - scope
