components:
  schemas:
    # Enum values from docs/openapi/vocab/EventTopic.yaml — do not hand-edit.
    EventTopic:
      $ref: event-topic.generated.yaml#/components/schemas/EventTopic
    SourceChangeOp:
      $ref: source-change-op.generated.yaml#/components/schemas/SourceChangeOp
    SourceChangeOrigin:
      $ref: source-change-origin.generated.yaml#/components/schemas/SourceChangeOrigin
    SourceWorkspaceKind:
      $ref: source-workspace-kind.generated.yaml#/components/schemas/SourceWorkspaceKind
    MessageChangeOp:
      type: string
      description: >-
        append adds a new transcript row; patch replaces the row with the same
        message id.
      enum:
      - append
      - patch
    LLMCallStatus:
      type: string
      enum:
      - active
      - ok
      - error
    LLMRetryReason:
      type: string
      description: >-
        Why a provider request is being reissued: status (throttle / transient
        5xx), capacity (503/529), hold (turn-level wait), cooldown (slot),
        unreachable (the request never reached the provider), or silent (the
        provider took the request and sent no response headers), or
        empty_completion (the provider completed without assistant text or a
        tool call). The last three carry no HTTP status, so a client must not
        expect one alongside them.
      enum:
      - status
      - capacity
      - hold
      - cooldown
      - unreachable
      - silent
      - empty_completion
    ActivityStatus:
      type: string
      description: Lifecycle edge for one host-observed activity lease.
      enum:
      - active
      - done
    ActivityKind:
      type: string
      description: Closed host work phase; presentation copy is client-supplied.
      enum:
      - preparing_context
      - running_tool
      - starting_workflow
      - awaiting_wake
      - deciding
    EventEnvelope:
      $ref: event-envelope.generated.yaml#/components/schemas/EventEnvelope
    EventEnvelopeBase:
      type: object
      required:
      - v
      - event_id
      - cursor
      - topic
      - published_at
      - scope
      - data
      additionalProperties: false
      description: Shared fields of every topic-discriminated EventHub SSE envelope.
      properties:
        v:
          type: integer
          const: 1
          description: Schema version.
        event_id:
          type: string
          format: uuid
          description: Stable mutation event identity retained across delivery retries.
        entity_revision:
          type: integer
          format: int64
          minimum: 0
          description: >
            Monotonic authoritative entity revision when the topic has one, for
            rejecting an out-of-order delivery. Carried by workflow (the run's
            revision, scoped to the run in the event's own workflow_run_id), session
            lifecycle snapshots, and the session-scoped progress, queue, and findings
            topics. Absent on
            every other topic, which has no single monotonic entity behind it —
            treat a missing value as "cannot be compared", never as revision 0.
        cursor:
          type: string
          description: Opaque replay boundary for this delivered event.
        topic:
          $ref: events.yaml#/components/schemas/EventTopic
        published_at:
          type: string
          format: date-time
          description: RFC 3339 timestamp.
        scope:
          $ref: events.yaml#/components/schemas/EventScope
        data:
          description: Topic-specific payload, narrowed by EventEnvelope.
    EventScopeKind:
      type: string
      enum:
      - device
      - project
      - session
    EventScope:
      description: Closed, attributable delivery scope for an event.
      oneOf:
      - type: object
        required:
        - kind
        additionalProperties: false
        properties:
          kind:
            allOf:
            - $ref: events.yaml#/components/schemas/EventScopeKind
            - const: device
      - type: object
        required:
        - kind
        - project_id
        additionalProperties: false
        properties:
          kind:
            allOf:
            - $ref: events.yaml#/components/schemas/EventScopeKind
            - const: project
          project_id:
            type: string
            format: uuid
      - type: object
        required:
        - kind
        - project_id
        - session_id
        additionalProperties: false
        properties:
          kind:
            allOf:
            - $ref: events.yaml#/components/schemas/EventScopeKind
            - const: session
          project_id:
            type: string
            format: uuid
          session_id:
            type: string
            format: uuid
    MessageEvent:
      x-go-generate: true
      type: object
      description: >-
        One transcript row change. message is always the full post-write row:
        apply it as a whole-row snapshot ordered by seq, never a field merge
        onto a cached row — an absent field means the row no longer has it.
      required:
      - session_id
      - op
      - message
      additionalProperties: false
      properties:
        session_id:
          type: string
          format: uuid
        op:
          $ref: events.yaml#/components/schemas/MessageChangeOp
        seq:
          type: integer
          format: int64
        message:
          $ref: session/messages.yaml#/components/schemas/Message
    WorkerEvent:
      x-go-generate: true
      type: object
      required:
      - worker_id
      - status
      additionalProperties: false
      properties:
        dependencies:
          type: array
          items:
            $ref: worker.yaml#/components/schemas/WorkerDependency
        worker_id:
          type: string
          format: uuid
        status:
          $ref: worker.yaml#/components/schemas/WorkerStatus
        agent_type:
          type: string
        child_session_id:
          type: string
          format: uuid
        parent_session_id:
          type: string
          format: uuid
        brief:
          type: string
          description: Worker assignment goal used for card titles.
        merge_status:
          $ref: worker.yaml#/components/schemas/WorkerMergeStatus
        max_tool_loops:
          type: integer
          minimum: 0
        budget_request:
          x-go-pointer: true
          $ref: worker.yaml#/components/schemas/WorkerBudgetRequest
          description: The worker's unanswered request for more tool rounds; absent once granted
        tool_loops_used:
          type: integer
          minimum: 0
        tool_calls_used:
          type: integer
          minimum: 0
        turn_tool_calls:
          type: integer
          minimum: 0
        turn_tools_done:
          type: integer
          minimum: 0
        context_usage:
          x-go-pointer: true
          $ref: worker.yaml#/components/schemas/WorkerContextUsage
        workspace_preparation:
          x-go-pointer: true
          $ref: worker.yaml#/components/schemas/WorkspacePreparation
        result:
          x-go-pointer: true
          $ref: worker.yaml#/components/schemas/WorkerResult
        failure:
          x-go-pointer: true
          $ref: worker.yaml#/components/schemas/WorkerFailure
        error:
          type: string
    BoardEvent:
      x-go-generate: true
      type: object
      required:
      - project_id
      - snapshot
      - detail_level
      additionalProperties: false
      properties:
        project_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        snapshot:
          $ref: board.yaml#/components/schemas/BoardView
        detail_level:
          $ref: board.yaml#/components/schemas/BoardDetailLevel
    DelegationEvent:
      x-go-generate: true
      type: object
      required:
      - delegation_id
      - status
      - leg_id
      - phase
      additionalProperties: false
      properties:
        delegation_id:
          type: string
          format: uuid
        status:
          $ref: delegation.yaml#/components/schemas/DelegationStatus
        leg_id:
          type: string
          format: uuid
        phase:
          $ref: delegation.yaml#/components/schemas/DelegationPhase
    LLMTokenCounts:
      x-go-generate: true
      type: object
      additionalProperties: false
      properties:
        prompt:
          type: integer
          minimum: 0
        completion:
          type: integer
          minimum: 0
        total:
          type: integer
          minimum: 0
        context_window:
          type: integer
          minimum: 0
        compaction_threshold:
          type: integer
          minimum: 0
    CoordinatorLoopProgress:
      x-go-generate: true
      type: object
      additionalProperties: false
      properties:
        host_turn:
          type: boolean
        iteration:
          type: integer
          minimum: 0
          description: 1-based index of the model turn now running.
        max_iterations:
          type: integer
          minimum: 0
        prose_finish:
          type: boolean
          description: >-
            Tools-omitted closeout turn — reserved last iteration or early
            closeout (blocked loop, cancel, spend, timeout).
        surface:
          type: string
        activity_label:
          type: string
          description: Host-projected activity label from the coordinator surface catalog.
        guarded:
          type: boolean
        provisional_hidden:
          type: boolean
    LLMCallEvent:
      x-go-generate: true
      type: object
      required:
      - call_id
      - session_id
      - provider
      - model
      - status
      - tokens
      additionalProperties: false
      properties:
        call_id:
          type: string
          format: uuid
        session_id:
          description: Session whose coordinator turn this call belongs to. The
            event stream is project-scoped, so clients must attribute activity by
            this id rather than by whichever session they currently display.
          type: string
          format: uuid
        provider:
          type: string
        model:
          type: string
        status:
          $ref: events.yaml#/components/schemas/LLMCallStatus
        tokens:
          $ref: events.yaml#/components/schemas/LLMTokenCounts
        coordinator_loop:
          x-go-pointer: true
          $ref: events.yaml#/components/schemas/CoordinatorLoopProgress
        attempt:
          type: integer
          description: >-
            1-based index of the attempt now running. Present only while the call is
            being retried, so a rate-limited provider is distinguishable from a slow
            one; the first attempt omits it. Republished on the same call_id with
            status active.
        max_attempts:
          type: integer
          description: The initial request plus every retry the provider policy allows.
        retry_wait_ms:
          type: integer
          format: int64
          description: Backoff slept before this attempt, in milliseconds.
        retry_reason:
          $ref: events.yaml#/components/schemas/LLMRetryReason
        silence_ms:
          type: integer
          format: int64
          description: >-
            How long the previous attempt went unanswered after its request was
            delivered, in milliseconds. Present only with retry_reason silent.
            This is the number that separates a slow model from a stalled one:
            both look identical while a turn is open, and only this says which.
    ActivityEvent:
      x-go-generate: true
      type: object
      required:
      - activity_id
      - session_id
      - kind
      - status
      - started_at
      additionalProperties: false
      description: >-
        One session-scoped host activity lease. The active edge opens the lease
        and the done edge with the same activity_id closes it. Further active
        edges replace measured progress on that lease; arguments remain on the
        canonical transcript tool call.
        A lease outlives the turn that opened it: an awaiting_wake lease spans an
        idle session, so a client closes leases on their done edge or an authoritative
        session activity snapshot, never on a session status change.
      properties:
        activity_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        kind:
          $ref: events.yaml#/components/schemas/ActivityKind
        status:
          $ref: events.yaml#/components/schemas/ActivityStatus
        started_at:
          type: string
          format: date-time
        tool_name:
          type: string
        tool_call_id:
          type: string
          pattern: '^[A-Za-z0-9_.:-]+$'
        progress:
          x-go-pointer: true
          $ref: events.yaml#/components/schemas/ToolProgress
        wait_triggers:
          type: array
          items:
            type: string
          description: >-
            Subscriptions that will end an awaiting_wake lease, in the host's own
            vocabulary (timer, next_worker_done, process_done, …). Present only on
            awaiting_wake, and what the client names rather than inferring a
            subject from the sleep reason.
        decision_trigger:
          $ref: turn-load.yaml#/components/schemas/TurnLoadTrigger
          description: >-
            What asked the local decision engine. Present only on deciding,
            which the host opens only while an available engine is answering;
            the answer arrives as a turn_load event.
    ToolProgress:
      x-go-generate: true
      type: object
      additionalProperties: false
      required: [phase, files_searched, files_skipped, matches]
      description: Measured discovery work. Counts are observations, not a completion estimate.
      properties:
        phase:
          type: string
          enum: [selecting, searching]
        files_searched:
          type: integer
          minimum: 0
        files_skipped:
          type: integer
          minimum: 0
        matches:
          type: integer
          minimum: 0
    OAROnFireEvent:
      x-go-generate: true
      type: object
      required:
      - session_id
      - rule
      - anchor
      - effect
      additionalProperties: false
      description: >-
        One Open Agent Rules publish_event record. It is host-observed telemetry,
        never a fact visible to another rule at the occurrence.
      properties:
        session_id:
          type: string
          format: uuid
        rule:
          type: string
          description: Qualified OAR rule identifier.
        anchor:
          type: string
        effect:
          type: string
          enum: [block, warn, nudge, allow, transform]
    BackgroundProcessEvent:
      x-go-generate: true
      type: object
      required:
      - process_id
      - session_id
      - stream
      - end_offset
      - running
      additionalProperties: false
      properties:
        process_id:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
        session_id:
          type: string
          format: uuid
        stream:
          type: string
        text:
          type: string
        end_offset:
          type: integer
          format: int64
          minimum: 0
          description: >-
            Byte offset just past the process output this event reflects; 0 for
            a held call, which has no byte stream.
        running:
          type: boolean
        exit_code:
          x-go-pointer: true
          type: integer
        truncated:
          type: boolean
        reset:
          type: boolean
          description: Replace previously projected text instead of appending it.
    BackgroundProcessStage:
      x-go-generate: true
      type: object
      required:
      - command
      additionalProperties: false
      properties:
        command:
          type: string
        exit_code:
          x-go-pointer: true
          type: integer
          description: >-
            Absent while the stage has not exited, and for a stage a sequencing
            operator skipped. A skipped stage reached no status, so reporting 0
            would read as success.
        skipped:
          type: boolean
          description: >-
            The stage never ran: the preceding group's exit status did not satisfy
            the connector joining them.
        connector:
          type: string
          enum: ['|', '&&', '||', ';']
          description: >-
            Operator joining this stage to the previous one. Absent on the first
            stage. `|` wires the previous stage's stdout into this one; the rest
            gate on the previous group's exit status.
    BackgroundProcess:
      x-go-generate: true
      type: object
      required:
      - process_id
      - running
      additionalProperties: false
      properties:
        output:
          x-go-pointer: true
          $ref: '#/components/schemas/BackgroundProcessOutput'
        process_id:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
        running:
          type: boolean
        stages:
          type: array
          items:
            $ref: '#/components/schemas/BackgroundProcessStage'
        exit_code:
          x-go-pointer: true
          type: integer
    BackgroundProcessChunk:
      x-go-generate: true
      type: object
      required:
      - offset
      - stream
      - text
      additionalProperties: false
      properties:
        offset:
          type: integer
          format: int64
          minimum: 0
          description: Byte offset of the first process output byte this chunk covers.
        stream:
          type: string
        text:
          type: string
    BackgroundProcessOutput:
      x-go-generate: true
      type: object
      description: >-
        The screened tail of one process's retained output, bounded by the host.
        It is a snapshot, not a page: live output continues on the process
        event topic.
      required:
      - process_id
      - chunks
      - running
      additionalProperties: false
      properties:
        process_id:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
        chunks:
          type: array
          items:
            $ref: '#/components/schemas/BackgroundProcessChunk'
        running:
          type: boolean
        truncated:
          type: boolean
          description: Earlier output was evicted from the host buffer or cut from this snapshot.
        exit_code:
          x-go-pointer: true
          type: integer
    BackgroundProcessStopResult:
      x-go-generate: true
      type: object
      required:
      - process_id
      - stop_requested
      - running
      additionalProperties: false
      properties:
        process_id:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
        stop_requested:
          type: boolean
          description: The host requested termination; this does not assert process exit.
        running:
          type: boolean
          description: True until the host has observed terminal process state. Wait for the process event instead of repeating stop.
        exit_code:
          x-go-pointer: true
          type: integer
    PreviewActionOverlay:
      x-go-generate: true
      type: object
      required:
      - label
      additionalProperties: false
      properties:
        label:
          type: string
        target:
          type: string
        x:
          x-go-pointer: true
          type: number
          format: double
        y:
          x-go-pointer: true
          type: number
          format: double
        w:
          x-go-pointer: true
          type: number
          format: double
        h:
          x-go-pointer: true
          type: number
          format: double
    PreviewEventOp:
      type: string
      enum:
      - attach
      - detach
      - frame
      - action
      - state
      description: Live preview stream message kind.
    PreviewEvent:
      x-go-generate: true
      type: object
      required:
      - op
      - session_id
      - page_id
      - assistant_message_id
      - tool_call_id
      - seq
      additionalProperties: false
      description: >-
        Read-only live page mirror (CDP screencast frames + driven-action overlay).
