      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        prompt:
          type: string
          minLength: 1
          maxLength: 8000
        replaces:
          type: string
          format: uuid
    OverlappingStandingWatch:
      x-go-generate: true
