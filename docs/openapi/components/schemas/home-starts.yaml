components:
  schemas:
    HomeStartCapabilities:
      x-go-generate: true
      type: object
      required:
      - protocol_version
      - store_id
      - person_id
      additionalProperties: false
      description: >-
        What a client binds a Home submission to before replaying it. A changed
        store or person means saved launches belong to another host.
      properties:
        protocol_version:
          type: integer
          format: int32
          enum:
          - 1
        store_id:
          type: string
          format: uuid
          description: Durable identity of this host store; survives restarts.
        person_id:
          type: string
          format: uuid
          description: The acting person.
    HomeStartChoices:
      x-go-generate: true
      type: object
      additionalProperties: false
      description: >-
        Immutable creation choices of one Home submission. The prompt itself is
        sent separately through the session prompt endpoint.
      dependentRequired:
        provider_id:
        - model
        model:
        - provider_id
      properties:
        mode:
          x-go-pointer: true
          $ref: session/identity.yaml#/components/schemas/SessionMode
          description: Initial chat mode. Defaults to Agent.
        provider_id:
          type: string
          pattern: '^[a-z0-9_-]{1,64}$'
          description: Explicit coordinator provider for the chat.
        model:
          type: string
          minLength: 1
          description: Explicit coordinator model for the chat.
    PutHomeStartRequest:
      x-go-generate: true
      type: object
      required:
      - choices
      additionalProperties: false
      properties:
        choices:
          $ref: '#/components/schemas/HomeStartChoices'
    ReplaceHomeStartFirstPromptRequest:
      x-go-generate: true
      type: object
      required:
      - expected_revision
      - operation_id
      - replacement_operation_id
      additionalProperties: false
      properties:
        expected_revision:
          type: integer
          format: int64
          minimum: 1
        operation_id:
          type: string
          format: uuid
          description: The first-prompt operation being replaced.
        replacement_operation_id:
          type: string
          format: uuid
          description: Fresh operation the changed first prompt will use.
    HomeStartFirstPrompt:
      x-go-generate: true
      type: object
      required:
      - operation_id
      - admitted
      additionalProperties: false
      properties:
        operation_id:
          type: string
          format: uuid
          description: The only operation that may admit this chat's first prompt.
        admitted:
          type: boolean
          description: A durable prompt receipt exists for operation_id in the bound chat.
        status:
          type: string
          description: The receipt status once admitted.
          enum:
          - queued
          - running
          - complete
          - failed
          - interrupted
          - canceled
    HomeStartFailure:
      x-go-generate: true
      type: object
      required:
      - code
      - resumable
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - project_create_failed
          - session_create_failed
          - draft_workspace_occupied
        resumable:
          type: boolean
          description: The same PUT resumes the failed step.
    HomeStart:
      x-go-generate: true
      type: object
      required:
      - launch_id
      - phase
      - revision
      - first_prompt
      additionalProperties: false
      description: >-
        The caller's view of one Home submission. IDs appear once their rows are
        committed; revision increases with every change.
      properties:
        launch_id:
          type: string
          format: uuid
        phase:
          type: string
          description: >-
            reserved, project_created and session_bound record creation progress.
            stopped and retired admit no further work; failed carries failure.
          enum:
          - reserved
          - project_created
          - session_bound
          - stopped
          - retired
          - failed
        revision:
          type: integer
          format: int64
          minimum: 1
        choices:
          x-go-pointer: true
          $ref: '#/components/schemas/HomeStartChoices'
          description: Absent for a launch stopped before its PUT.
        project_id:
          type: string
          format: uuid
        session_id:
          type: string
          format: uuid
        session_status:
          $ref: session/identity.yaml#/components/schemas/SessionStatus
        first_prompt:
          $ref: '#/components/schemas/HomeStartFirstPrompt'
        failure:
          x-go-pointer: true
          $ref: '#/components/schemas/HomeStartFailure'
