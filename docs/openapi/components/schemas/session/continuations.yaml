components:
  schemas:
    ActionContinuation:
      x-go-generate: true
      type: object
      additionalProperties: false
      required: [continuation_id, session_id, action, state, opened_at]
      properties:
        continuation_id: {type: string, format: uuid}
        session_id: {type: string, format: uuid}
        action: {$ref: ../continuation-action.generated.yaml#/components/schemas/ContinuationAction}
        state: {$ref: ../continuation-state.generated.yaml#/components/schemas/ContinuationState}
        reason: {$ref: ../continuation-reason.generated.yaml#/components/schemas/ContinuationReason}
        turn_id: {type: string, format: uuid}
        failure_code:
          x-go-type: string
          anyOf:
            - {$ref: ../host-continuation-failure.generated.yaml#/components/schemas/HostContinuationFailure}
            - {$ref: ../notice-code.generated.yaml#/components/schemas/NoticeCode}
        opened_at: {type: string, format: date-time}
        resolved_at: {type: string, format: date-time, x-go-pointer: true}
    ContinuationNotice:
      x-go-generate: true
      type: object
      required: [session_id, revision]
      additionalProperties: false
      properties:
        session_id: {type: string, format: uuid}
        revision: {type: integer, format: int64}
        continuation_id: {type: string, format: uuid}
        host_error:
          x-go-pointer: true
          $ref: events.yaml#/components/schemas/SessionHostError
