components:
  schemas:
    ManagedSecret:
      x-go-generate: true
      type: object
      description: >-
        Metadata for protected material. Ordinary reads are value-free. A
        person using the installed desktop app may reveal the current value
        through fresh, challenge-bound operating-system authentication.
      required:
      - reference
      - name
      - scope
      - origin
      - created_at
      - state
      - version
      - use_count
      - reveal_count
      additionalProperties: false
      properties:
        reference:
          type: string
          pattern: '^\{\{paintedwolf-secret:[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}\}\}$'
          description: Provider-safe token accepted by supported outbound agent tools.
        chat_session_id:
          type: [string, "null"]
          format: uuid
          description: >-
            The chat whose agents may spend chat-scoped material; absent for
            project scope. Scope decides who may spend a capability, never how
            long it lives: only an explicit revoke ends one.
        chat_title:
          type: string
          description: Title of the owning chat while it exists and has one.
        chat_deleted:
          type: boolean
          description: >-
            True when the owning chat was deleted. The capability stays active
            for people to reveal, replace, promote, or revoke; no agent can
            spend it, because no chat can see it.
        name:
          type: string
        purpose:
          type: string
        scope:
          type: string
          enum: [chat, project]
        origin:
          type: string
          description: >-
            How the capability was created. This is immutable provenance, not
            a claim about where the current stored value lives or whether an
            external credential still matches it. `file_marked` means a person
            marked a value in a project file; `composer_marked` means a person
            protected selected draft text for a chat; `settings_entered` means a
            person typed a value into project settings. File marks and settings
            entries are project acts; composer marks initially take chat scope.
            `cookie_jar` means the host stored the cookies an agent's own
            `http_request` calls received under a named jar; every cookie value
            in it is screened like any other managed value. `token_jar` is the
            same for tokens `http_request` captured from responses.
          enum: [generated, ask_user_response, detected, file_marked, composer_marked, settings_entered, cookie_jar, token_jar]
        custody:
          type: string
          enum: [person, file, chat, host]
          description: >-
            Who supplied the current value, recorded in the encrypted vault when
            the bytes entered. `person` means a person gave the value to Painted
            Wolf Code, which may hold the only copy, or chose to hold a value the
            host generated: revealing it or handing it
            to any file, process, service, or MCP server needs that person's
            verified presence on this device. `file` means a person marked bytes
            already in a project file, which governs them. `chat` means the host
            generated the value for one chat, which alone has held it. `host`
            means the host generated or captured the value for the agent's work
            beyond one chat. Absent when no value is readable.
        format:
          type: string
          enum: [base64url, hex, alphanumeric]
          description: Present only for generated material.
        entropy_bits:
          x-go-type: "int64"
          type: integer
          minimum: 128
          maximum: 1024
          description: Present only for generated material.
        created_at:
          x-go-type: "string"
          type: string
          format: date-time
        agent_use_ends_at:
          x-go-type: "*string"
          type: [string, "null"]
          format: date-time
          description: >-
            After this time the agent may no longer substitute the capability.
            Authenticated human reveal remains available for recovery. The
            protected bytes remain available for screening, and this deadline
            does not alter an external credential or a project file.
        state:
          type: string
          description: >-
            `revoked` is terminal and no administration reaches it.
            `agent_use_expired` means its agent-use deadline passed; a new
            deadline revives it.
            `unavailable` has metadata but no readable bytes, and supplying a
            value again restores it under the same reference.
          enum: [active, revoked, agent_use_expired, unavailable]
        version:
          x-go-type: "int64"
          type: integer
          minimum: 0
          description: >-
            Counts stored values, not edits. Starts at 1 and rises with each
            stored-value replacement while the reference stays the same. Zero means no readable
            value was ever recorded.
        value_replaced_at:
          x-go-type: "*string"
          type: [string, "null"]
          format: date-time
          description: When the current protected value replaced its predecessor; absent before the first replacement.
        last_used_at:
          x-go-type: "*string"
          type: [string, "null"]
          format: date-time
          description: Most recent substitution attempt, refusals included; absent when the reference has never reached a tool call.
        use_count:
          x-go-type: "int64"
          type: integer
          minimum: 0
          description: Substitution attempts inside the bounded history window, refusals included.
        last_revealed_at:
          x-go-type: "*string"
          type: [string, "null"]
          format: date-time
          description: Most recent successful authenticated human reveal; absent when never revealed.
        reveal_count:
          x-go-type: "int64"
          type: integer
          minimum: 0
          description: Successful authenticated human reveals retained for this capability.
    ManagedSecretList:
      x-go-generate: true
      type: object
      required: [secrets]
      additionalProperties: false
      properties:
        secrets:
          type: array
          items:
            $ref: "#/components/schemas/ManagedSecret"
    CreateManagedSecretRequest:
      x-go-generate: true
      type: object
      description: >-
        Stores a value a person entered in project settings. This is the one
        managed-secret path where a credential travels in a request body: every
        other path either generates the bytes host-side or slices them from a
        document the host already holds. The response carries only the
        capability. Ordinary reads never return the value; authenticated reveal
        is the sole disclosure path.
      required: [name, purpose, secret_value, operation_id]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        purpose:
          type: string
          minLength: 1
          maxLength: 240
          description: >-
            Required. A project-scoped capability outlives every chat, so the
            next chat can only tell what it is by reading this.
        secret_value:
          type: string
          minLength: 4
          writeOnly: true
          description: >-
            The credential. Never echoed back and never returned by an ordinary
            read. The field is named for what it holds so the host's own
            request-capture scrubber redacts it by name; renaming it would
            silently stop that. The floor is the length the screen can tell
            apart from ordinary text: below it the host refuses rather than
            mint a reference nothing would ever redact.
        agent_use_ends_at:
          x-go-type: "string"
          type: string
          format: date-time
          description: >-
            Optional deadline, at most one year out, after which the agent may
            no longer substitute this capability. Authenticated human reveal
            remains available for recovery. Omit for no deadline. This does not
            alter an external credential.
        operation_id:
          type: string
          format: uuid
          description: Idempotency key for a retried submission.
    UpdateManagedSecretRequest:
      x-go-generate: true
      type: object
      description: >-
        Administers one capability. Omitted fields are left as they stand, and
        nothing here reaches the stored value. A revoked capability is terminal
        and accepts no update.
      additionalProperties: false
      properties:
        name:
          x-go-pointer: true
          type: string
          minLength: 1
          maxLength: 80
        purpose:
          x-go-pointer: true
          type: string
          maxLength: 240
        agent_use_ends_at:
          type: [string, "null"]
          format: date-time
          description: Deadline after which the agent may no longer substitute this capability; null removes the deadline.
        scope:
          x-go-pointer: true
          type: string
          enum: [project]
          description: >-
            Scope only widens. Promoting a chat capability to `project` lets it
            outlive the chat that created it, and requires a purpose. Narrowing
            a project capability has no honest target chat, so it is refused.
    ReplaceManagedSecretValueRequest:
      x-go-generate: true
      type: object
      description: >-
        Puts new bytes behind an unchanged reference, or restores a capability
        whose stored value went missing. Supported agent tooling already
        holding the reference keeps working. Only Painted Wolf's protected copy
        changes: this does not modify a project file, rotate an external
        credential, revoke it, or activate the replacement at its provider. The
        replaced value is retired, not deleted: its bytes stay readable to
        provider screening so a credential the agent has already seen keeps
        being redacted, but a retired value never resolves again.
      required: [secret_value]
      additionalProperties: false
      properties:
        secret_value:
          type: string
          minLength: 4
          writeOnly: true
          description: >-
            The new credential. Never echoed back. Named so the host's own
            request-capture scrubber redacts it by name. It holds the same
            length floor as minting: a replacement the screen could not
            recognize would silently retire a protection that worked.
    ManagedSecretUse:
      x-go-generate: true
      type: object
      description: >-
        One recorded attempt to substitute a reference into a tool call. Carries
        what the host decided and who asked, never the value and never the
        argument the value was going into.
      required: [used_at, tool_name, outcome, delivery]
      additionalProperties: false
      properties:
        tool_call_id:
          type: string
          pattern: '^[A-Za-z0-9_.:-]+$'
          description: Invocation identity shared with authorization history; absent for non-tool resolution.
        delivery:
          type: string
          enum: [pending, not_dispatched, withheld, handed_off, redacted]
          description: >-
            Delivery to the local executor or transport. A handoff does not imply
            process startup, network delivery, or successful authentication.
            Pending means no terminal observation was recorded.
        used_at:
          x-go-type: "string"
          type: string
          format: date-time
        tool_name:
          type: string
        outcome:
          type: string
          description: >-
            `resolved` means the host substituted the value. Other outcomes are
            refusals.
          enum: [resolved, revoked, agent_use_expired, unavailable, out_of_scope]
        version:
          x-go-type: "int64"
          type: integer
          minimum: 1
          description: Stored value the attempt reached; absent when it was refused before one was read.
        session_id:
          type: string
          format: uuid
        chat_session_id:
          type: string
          format: uuid
        recipients:
          type: array
          description: Recipients the release that handed the value off reviewed; empty until one did.
          items:
            $ref: "#/components/schemas/ManagedSecretUseRecipient"
        unlock_id:
          type: string
          format: uuid
          description: >-
            The unlock a value a person stored left under; the person verified
            presence to open it for this chat. Absent for other values and for
            uses that did not leave.
    ManagedSecretUseRecipient:
      x-go-generate: true
      type: object
      required: [label, surface]
      additionalProperties: false
      properties:
        label: {type: string}
        surface: {type: string}
    ManagedSecretUseList:
      x-go-generate: true
      type: object
      description: A bounded rolling window of recent uses, newest first. Not a permanent ledger.
      required: [uses]
      additionalProperties: false
      properties:
        uses:
          type: array
          items:
            $ref: "#/components/schemas/ManagedSecretUse"
        next_cursor:
          type: string
          description: Opaque cursor for the next page of secret uses; empty or omitted at the end.
    BeginManagedSecretRevealRequest:
      x-go-generate: true
      type: object
      required: [window_label]
      additionalProperties: false
      description: >-
        Starts one installed-app reveal. The native shell supplies its actual
        calling window label; it is bound into the proof payload and audit
        record, but it is not an authorization identity.
      properties:
        window_label:
          type: string
          minLength: 1
          maxLength: 120
    ManagedSecretRevealChallenge:
      x-go-generate: true
      type: object
      required: [challenge_id, proof_payload, prompt, version, expires_at]
      additionalProperties: false
      description: >-
        One short-lived request for native user-presence authentication. The
        proof payload is opaque canonical bytes; the native shell signs it only
        after the operating system verifies the device user.
      properties:
        challenge_id:
          type: string
          format: uuid
        proof_payload:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
          description: Base64url without padding of the exact bytes the native shell signs.
        prompt:
          type: string
          description: Host-authored reason shown by the operating-system authentication prompt.
        version:
          x-go-type: "int64"
          type: integer
          minimum: 1
        expires_at:
          x-go-type: "string"
          type: string
          format: date-time
    CompleteManagedSecretRevealRequest:
      x-go-generate: true
      type: object
      required: [authenticator, signature]
      additionalProperties: false
      description: >-
        Challenge-bound native user-presence proof. The signature covers the
        challenge payload plus the authenticator identifier; the ordinary API
        bearer is never sufficient to reveal a value.
      properties:
        authenticator:
          $ref: ../presence.yaml#/components/schemas/PresenceAuthenticator
        signature:
          type: string
          pattern: '^[A-Za-z0-9_-]+$'
          description: Base64url without padding Ed25519 signature from the installed desktop shell.
    ManagedSecretRevealResponse:
      x-go-generate: true
      type: object
      required: [secret_value, version, revealed_at, remask_after_ms]
      additionalProperties: false
      description: >-
        The current value after successful operating-system authentication.
        The response body is categorically withheld from debug capture. Den
        does not persist the value, emit it as an event, or make it available
        to agent tools.
      properties:
        secret_value:
          type: string
          readOnly: true
        version:
          x-go-type: "int64"
          type: integer
          minimum: 1
        revealed_at:
          x-go-type: "string"
          type: string
          format: date-time
        remask_after_ms:
          x-go-type: "int64"
          type: integer
          minimum: 5000
          maximum: 60000

