components:
  schemas:
    SecretScreenStatus:
      type: string
      description: >-
        Lifecycle of the editor highlighting pass. pending means the host is
        screening in the background, complete accompanies secret_screen, and
        unavailable means no editor screener is configured. This status never
        gates reading or editing document content.
      enum: [pending, complete, unavailable]
    SecretSpanState:
      type: string
      description: >-
        What the host knows about the bytes under one screened span. The state
        is the ledger's standing of those bytes, never the reach of whoever
        reads the screen. `tracked` is the current value of a live managed
        capability: the agent never reads it, and chats the capability admits
        use it by reference. `retired` is a replaced version or a revoked
        capability; its reference no longer resolves while its bytes remain
        screening evidence, so the file still holds a live credential nothing
        can spend. `detected` is a catalog or container-evidence hit with
        nothing tracking it, screened by shape rather than exact provenance.
      enum: [tracked, retired, detected]
    SecretSpan:
      x-go-generate: true
      type: object
      description: >-
        One screened range in an editor document. Offsets are rune positions into
        the document draft, matching the redaction-span convention. A span never
        carries the matched bytes; clients render from this list rather than by
        searching content, and must not infer a span from text.
      required: [start, end, state, rule_id]
      additionalProperties: false
      properties:
        start:
          type: integer
          minimum: 0
          description: Rune offset of the first matched character in the draft.
        end:
          type: integer
          minimum: 0
          description: Rune offset one past the last matched character.
        state:
          $ref: "#/components/schemas/SecretSpanState"
        rule_id:
          type: string
          pattern: '^[a-zA-Z0-9_.:/-]+$'
          description: Catalog rule identity, or the managed-capability evidence id.
        rule_title:
          type: string
          description: Human-readable rule name for presentation.
        reference:
          type: string
          description: >-
            Managed capability token. Present only when state is `tracked`. A
            project screen carries it for every live capability, whichever chat
            created it; a jar entry has none.
        shape:
          type: string
          description: Synthetic character classes and run lengths — a receipt for which bytes matched, never the bytes.
    SecretScreen:
      x-go-generate: true
      type: object
      description: >-
        Provenance for one completed text screen. Presence means screening ran;
        absence means screening was unavailable. An empty span list does not say
        the text is free of credentials — no pattern catalog recognizes every
        one. Spans use rune offsets into the exact text carried beside this screen.
      required: [truncated]
      additionalProperties: false
      properties:
        truncated:
          type: boolean
          description: Whether the screen covered only a prefix of the document.
        screened_bytes:
          type: integer
          minimum: 0
          description: Bytes actually screened.
        screened_revision:
          type: integer
          format: int64
          description: Editor-document revision the spans were computed against. Omitted for immutable comparison content.
        catalog_version:
          type: string
          description: Vendored detection catalog the screen ran against. Empty when no vendor catalog is loaded.
        spans:
          type: array
          items:
            $ref: "#/components/schemas/SecretSpan"
    SecretMarkRange:
      x-go-generate: true
      type: object
      description: >-
        A rune range in one editor document. The client sends offsets, never
        bytes: the host slices the value from its own copy of the draft, so a
        credential never travels in a request body, an access log, or an error
        path.
      required: [revision, start, end]
      additionalProperties: false
      properties:
        revision:
          type: integer
          format: int64
          description: Document revision the range was selected against. A mismatch is refused.
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
        trim:
          x-go-pointer: true
          type: boolean
          description: >-
            Strip surrounding whitespace and one matched quote layer before
            capturing. Omitted means trim: the quote around a credential is
            syntax in the file, not part of the value that travels.
    SecretMarkPreview:
      x-go-generate: true
      type: object
      description: >-
        What marking a range would capture. The host decides eligibility so the
        client never has to guess what will be refused after a person has already
        named the capability.
      required: [eligible, start, end, rune_length, byte_length]
      additionalProperties: false
      properties:
        eligible:
          type: boolean
        reason:
          type: string
          enum: [out_of_range, empty, too_large, too_short, already_protected]
          description: >-
            Present only when eligible is false. too_short is the mint floor,
            set at the shortest length a real credential takes so a PIN is
            accepted: only one-to-three character selections are refused,
            because those occur constantly in ordinary text and an exact match
            would redact unrelated prose rather than protect anything.
            already_protected means the selection holds bytes a managed secret
            in this project already protects; a second capability would
            duplicate that secret rather than protect anything new.
        start:
          type: integer
          minimum: 0
        end:
          type: integer
          minimum: 0
        rune_length:
          type: integer
          minimum: 0
        byte_length:
          type: integer
          minimum: 0
        shape:
          type: string
          description: Synthetic character classes and run lengths for the captured bytes.
        trimmed_leading:
          type: integer
          minimum: 0
        trimmed_trailing:
          type: integer
          minimum: 0
    SecretMarkRequest:
      x-go-generate: true
      type: object
      description: Mint a project-scoped managed secret from bytes already present in a project file.
      required: [range, name, purpose]
      additionalProperties: false
      properties:
        range:
          $ref: "#/components/schemas/SecretMarkRange"
        name:
          type: string
          minLength: 1
          maxLength: 80
        purpose:
          type: string
          minLength: 1
          maxLength: 240
        operation_id:
          type: string
          format: uuid
          description: Idempotency key. Repeating a mark with the same key returns the same capability.
