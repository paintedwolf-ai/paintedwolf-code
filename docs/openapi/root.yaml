openapi: 3.1.0
info:
  title: Painted Wolf Code Host API
  version: 1.0.0
  license:
    name: Apache License 2.0
    identifier: Apache-2.0
  description: 'REST + SSE contract for the Painted Wolf Code local service.


    - JSON field names use snake_case on the wire.

    - Resource IDs are UUID strings unless noted.

    - Timestamps are RFC 3339 date-time strings.

    - SSE EventHub payloads use the envelope in `docs/schemas/events/envelope.json`.

    '
servers:
- url: http://127.0.0.1:8787
  description: Default local sidecar
security:
- bearerAuth: []
tags:
- name: sessions
  description: Chat sessions, transcripts, prompts, context, and session artifacts.
- name: workflows
  description: Workflow catalogs, session composition, execution, and human transitions.
- name: projects
  description: Project identity, roots, source access, and project-scoped history.
- name: blueprints
  description: Reusable project and workflow launch configurations.
- name: delegations
  description: Coordinator work delegation and leg lifecycle.
- name: workers
  description: Background worker tasks and cancellation.
- name: board
  description: Session planning and execution board snapshots.
- name: events
  description: Authenticated server-sent event subscriptions.
- name: cost
  description: Session and project model-usage accounting.
- name: scan
  description: Security scan execution, findings, and scanner configuration.
- name: mcp
  description: MCP provider configuration, discovery, OAuth, and health.
- name: providers
  description: Language-model providers, credentials, models, and policy.
- name: web-research
  description: Web-research provider configuration, credentials, and index status.
- name: rules
  description: Effective project guidance and rule surfaces.
- name: settings
  description: Device and project preferences, approvals, and model policy.
- name: git
  description: >-
    Command endpoints for the active project's git working tree (status,
    checkout, discard, commit, push, pull, stash). These are RPC-style verbs,
    not REST resources — each POST performs a named git action
    against the session's roots rather than mutating an addressable object.
- name: search
  description: Cross-source search, replacement, and export.
- name: debug
  description: Local diagnostics and performance telemetry.
- name: health
  description: Sidecar readiness, compatibility recovery, and host preflight facts.
- name: host
  description: Host identity, contract version, and the authenticated caller.
- name: local-data
  description: >-
    Command endpoint for clearing rebuildable ephemeral local buckets. Like the
    git routes, `clear` is a deliberate RPC-style action verb, not a REST
    resource; it never touches the durable store or credentials.
- name: backup
  description: >-
    Local durable-install backup and staged restore. Distinct from the scrubbed
    diagnostics bundle and from rebuildable Cache clears.
- name: extensions
  description: Extension packs, installed units, suggestions, and desired state.
- name: contributions
  description: >-
    Runtime projection of the captured contribution frame and the two
    invocation routes for host-executed contribution commands.
- name: host-resources
  description: Host capability inventory and user-granted access policy.
- name: attention
  description: >-
    Cross-project view of the sessions asking something of the human. Read as a
    snapshot here; kept live on the device-scoped `attention` SSE topic.
