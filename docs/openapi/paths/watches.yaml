paths:
  /v1/projects/{id}/watches:
    get:
      tags:
      - projects
      operationId: listProjectWatches
      summary: List agent watches and person-owned standing watches for a project
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ProjectId
      - name: owner
        in: query
        required: false
        schema:
          type: string
          enum:
          - agent
          - person
          - all
          default: all
      responses:
        '200':
          description: Project watches and daily spend ceiling summary
          content:
            application/json:
              schema:
                $ref: ../components/schemas/watches.yaml#/components/schemas/ProjectWatchListResponse
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
    post:
      tags:
      - projects
      operationId: createStandingWatch
      x-person-action: record
      summary: Create a person-owned standing watch in a project
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ProjectId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/watches.yaml#/components/schemas/CreateStandingWatchRequest
      responses:
        '201':
          description: Created standing watch
          content:
            application/json:
              schema:
                $ref: ../components/schemas/watches.yaml#/components/schemas/StandingWatch
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '422':
          $ref: ../components/responses.yaml#/components/responses/UnprocessableContent
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
  /v1/projects/{id}/watches/{watch_id}:
    get:
      tags:
      - projects
      operationId: getProjectWatch
      summary: Read one project watch for any owner
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ProjectId
      - $ref: ../components/parameters.yaml#/components/parameters/WatchId
      responses:
        '200':
          description: Project watch record
          content:
            application/json:
              schema:
                $ref: ../components/schemas/watches.yaml#/components/schemas/ProjectWatch
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
    patch:
      tags:
      - projects
      operationId: updateStandingWatch
      x-person-action: record
      summary: Edit a standing watch or take ownership of a disabled standing watch
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ProjectId
      - $ref: ../components/parameters.yaml#/components/parameters/WatchId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/watches.yaml#/components/schemas/UpdateStandingWatchRequest
      responses:
        '200':
          description: Updated standing watch
          content:
            application/json:
              schema:
                $ref: ../components/schemas/watches.yaml#/components/schemas/StandingWatch
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '422':
          $ref: ../components/responses.yaml#/components/responses/UnprocessableContent
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
    delete:
      tags:
      - projects
      operationId: deleteStandingWatch
      x-person-action: record
      summary: Delete a standing watch and its stored run history
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ProjectId
      - $ref: ../components/parameters.yaml#/components/parameters/WatchId
      responses:
        '204':
          description: Standing watch deleted
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
  /v1/projects/{id}/watches/{watch_id}/pause:
    post:
      tags:
      - projects
      operationId: pauseStandingWatch
      x-person-action: record
      summary: Pause a standing watch and discard pending or queued runs
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ProjectId
      - $ref: ../components/parameters.yaml#/components/parameters/WatchId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/watches.yaml#/components/schemas/StandingWatchRevisionRequest
      responses:
        '200':
          description: Paused standing watch
          content:
            application/json:
              schema:
                $ref: ../components/schemas/watches.yaml#/components/schemas/StandingWatch
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
  /v1/projects/{id}/watches/{watch_id}/resume:
    post:
      tags:
      - projects
      operationId: resumeStandingWatch
      x-person-action: record
      summary: Resume a paused standing watch from the current time
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ProjectId
      - $ref: ../components/parameters.yaml#/components/parameters/WatchId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/watches.yaml#/components/schemas/StandingWatchRevisionRequest
      responses:
        '200':
          description: Resumed standing watch
          content:
            application/json:
              schema:
                $ref: ../components/schemas/watches.yaml#/components/schemas/StandingWatch
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '422':
          $ref: ../components/responses.yaml#/components/responses/UnprocessableContent
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
  /v1/projects/{id}/watches/{watch_id}/run:
    post:
      tags:
      - projects
      operationId: runStandingWatchNow
      x-person-action: record
      summary: Trigger an immediate standing-watch run ignoring the change gate
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ProjectId
      - $ref: ../components/parameters.yaml#/components/parameters/WatchId
      responses:
        '200':
          description: Created and dispatched standing-watch run
          content:
            application/json:
              schema:
                $ref: ../components/schemas/watches.yaml#/components/schemas/WatchRun
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
  /v1/projects/{id}/watches/{watch_id}/runs:
    get:
      tags:
      - projects
      operationId: listWatchRuns
      summary: List runs for a standing watch newest first
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ProjectId
      - $ref: ../components/parameters.yaml#/components/parameters/WatchId
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 50
      responses:
        '200':
          description: Paged standing-watch runs
          content:
            application/json:
              schema:
                $ref: ../components/schemas/watches.yaml#/components/schemas/WatchRunListResponse
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
  /v1/sessions/{id}/watches:
    get:
      tags:
      - sessions
      operationId: listWatches
      summary: List agent watches owned by a session or its worker jobs
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/SessionId
      responses:
        '200':
          description: Session agent watches
          content:
            application/json:
              schema:
                $ref: ../components/schemas/watches.yaml#/components/schemas/AgentWatchListResponse
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
  /v1/sessions/{id}/watches/{watch_handle}:
    get:
      tags:
      - sessions
      operationId: getWatch
      summary: Inspect one session or worker watch without acknowledging pending matches
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/SessionId
      - $ref: ../components/parameters.yaml#/components/parameters/WatchHandle
      responses:
        '200':
          description: Session agent watch record
          content:
            application/json:
              schema:
                $ref: ../components/schemas/watches.yaml#/components/schemas/AgentWatch
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
    patch:
      tags:
      - sessions
      operationId: updateWatchDelivery
      x-person-action: record
      summary: Switch delivery mode on a live agent watch
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/SessionId
      - $ref: ../components/parameters.yaml#/components/parameters/WatchHandle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/watches.yaml#/components/schemas/UpdateWatchDeliveryRequest
      responses:
        '200':
          description: Updated agent watch record
          content:
            application/json:
              schema:
                $ref: ../components/schemas/watches.yaml#/components/schemas/AgentWatch
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '422':
          $ref: ../components/responses.yaml#/components/responses/UnprocessableContent
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
  /v1/sessions/{id}/watches/{watch_handle}/cancel:
    post:
      tags:
      - sessions
      operationId: cancelWatch
      x-person-action: record
      summary: Cancel an agent watch or dismiss a standing-watch proposal
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/SessionId
      - $ref: ../components/parameters.yaml#/components/parameters/WatchHandle
      responses:
        '200':
          description: Terminal watch and final receipt
          content:
            application/json:
              schema:
                $ref: ../components/schemas/watches.yaml#/components/schemas/CancelWatchResponse
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
  /v1/sessions/{id}/watches/{watch_handle}/keep:
    post:
      tags:
      - sessions
      operationId: keepWatch
      x-person-action: record
      summary: Keep an agent watch as a person-owned standing watch or apply a replaces edit
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/SessionId
      - $ref: ../components/parameters.yaml#/components/parameters/WatchHandle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/watches.yaml#/components/schemas/KeepWatchRequest
      responses:
        '200':
          description: Kept standing watch and terminal agent-watch receipt
          content:
            application/json:
              schema:
                $ref: ../components/schemas/watches.yaml#/components/schemas/KeepWatchResponse
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '422':
          $ref: ../components/responses.yaml#/components/responses/UnprocessableContent
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
