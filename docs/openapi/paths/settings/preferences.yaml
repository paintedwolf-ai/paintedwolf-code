paths:
  /v1/settings/limits:
    get:
      tags:
      - settings
      operationId: getLimitsSettings
      summary: Get effective session and budget limits for scope
      parameters:
      - name: project_id
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Settings limits
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/preferences.yaml#/components/schemas/SettingsLimitsResponse
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
    patch:
      tags:
      - settings
      operationId: updateLimitsSettings
      x-person-action: record
      summary: Update session and budget limits for global or project scope
      parameters:
      - name: project_id
        in: query
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/settings/preferences.yaml#/components/schemas/SettingsLimitsPatch
      responses:
        '200':
          description: Updated settings limits
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/preferences.yaml#/components/schemas/SettingsLimitsResponse
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
