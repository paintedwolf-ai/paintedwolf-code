paths:
  /v1/settings/approvals:
    get:
      tags:
      - settings
      operationId: getApprovalsSettings
      summary: Get effective approval rules for scope
      parameters:
      - name: project_id
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Approval config
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/approvals.yaml#/components/schemas/ApprovalConfigResponse
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
    patch:
      tags:
      - settings
      operationId: updateApprovalsSettings
      x-person-action: record
      summary: Update approval rules for global or project scope
      parameters:
      - name: project_id
        in: query
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/settings/approvals.yaml#/components/schemas/UpdateApprovalsSettingsRequest
      responses:
        '200':
          description: Updated approval config
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/approvals.yaml#/components/schemas/ApprovalConfigResponse
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
  /v1/approval-grants:
    get:
      tags:
      - settings
      operationId: listApprovalGrants
      summary: List active revocable approval leases
      description: >
        Host-minted chat, project, and device leases — including exact
        local-service (socket_path) grants. Built for review and revocation;
        search and sort client-side on title, scope, category, pattern, paths,
        and granted_at. Unqualified, the list includes chat-scoped leases
        across every chat, each carrying chat_session_id and session_title for
        grouping. Pass session_id to narrow chat-scoped rows to one chat.
      parameters:
      - name: session_id
        in: query
        schema:
          type: string
          format: uuid
        description: Narrow chat-scoped leases to this chat.
      responses:
        '200':
          description: Approval grants
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/approvals.yaml#/components/schemas/ApprovalGrantsResponse
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
    post:
      tags:
      - settings
      operationId: createApprovalGrant
      x-person-action: record
      summary: Create one durable grant from Settings
      description: >
        Deliberate Settings-only creation of one project or device grant: an
        exact local-service (socket_path) grant after host resolution of a
        single absolute AF_UNIX socket, or a network host family (host) lease
        over a registrable site, optionally bound to one tunnel port. Execution
        cards mint their own ladders; models cannot call this method.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/settings/approvals.yaml#/components/schemas/CreateApprovalGrantRequest
      responses:
        '201':
          description: Grant created
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/approvals.yaml#/components/schemas/ApprovalGrant
        '400':
          $ref: ../../components/responses.yaml#/components/responses/Error
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
  /v1/approval-asks:
    get:
      tags:
      - settings
      operationId: listApprovalAsks
      summary: Approval asks by reason over a recent window
      description: >
        A local, on-device view of which reasons have been asking and how they
        were answered, read from the authorization ledger across every session.
        Presentation only: nothing here changes whether an ask occurs. A reason
        a person allowed every time is a reason worth quieting, and the row says
        where that control is.
      parameters:
      - name: days
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 90
          default: 7
        description: Window length in days, ending now.
      - name: project_id
        in: query
        schema:
          type: string
          format: uuid
        description: Narrow to one project's sessions.
      responses:
        '200':
          description: Recent asks by reason
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/approvals.yaml#/components/schemas/ApprovalRecentAsksResponse
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
  /v1/approval-grants/resolve-socket:
    post:
      tags:
      - settings
      operationId: resolveSocketGrant
      x-person-action: none
      summary: Resolve one absolute AF_UNIX socket for Settings confirmation
      description: >
        Validates type and resolves approved/target paths without writing a
        grant. Used by the deliberate durable creation confirmation step.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/settings/approvals.yaml#/components/schemas/ResolveSocketGrantRequest
      responses:
        '200':
          description: Resolved socket pair and authority warning
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/approvals.yaml#/components/schemas/ResolveSocketGrantResponse
        '400':
          $ref: ../../components/responses.yaml#/components/responses/Error
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
  /v1/approval-grants/revoke:
    post:
      tags:
      - settings
      operationId: revokeApprovalGrants
      x-person-action: record
      summary: Revoke approval leases in bulk
      description: >
        One call for the Saved approvals group actions. Each id resolves
        independently and reports its own outcome; socket grants update the
        next-process boundary only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/settings/approvals.yaml#/components/schemas/RevokeApprovalGrantsRequest
      responses:
        '200':
          description: Per-id revoke results
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/approvals.yaml#/components/schemas/RevokeApprovalGrantsResponse
        '400':
          $ref: ../../components/responses.yaml#/components/responses/Error
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
