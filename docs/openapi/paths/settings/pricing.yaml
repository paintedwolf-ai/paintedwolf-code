paths:
  /v1/settings/pricing:
    get:
      tags:
      - settings
      operationId: getPricingSettings
      summary: Get global cost pricing settings
      responses:
        '200':
          description: Cost pricing settings
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/pricing.yaml#/components/schemas/SettingsPricingResponse
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
    patch:
      tags:
      - settings
      operationId: updatePricingSettings
      x-person-action: record
      summary: Update global cost pricing settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/settings/pricing.yaml#/components/schemas/SettingsPricing
      responses:
        '200':
          description: Updated cost pricing settings
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/pricing.yaml#/components/schemas/SettingsPricingResponse
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
  /v1/settings/pricing/sources/{source_id}/refresh:
    post:
      tags:
      - settings
      operationId: refreshPricingSource
      x-person-action: none
      summary: Force refresh one pricing feed source
      parameters:
      - name: source_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9_-]+$'
      responses:
        '200':
          description: Updated source meta
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/pricing.yaml#/components/schemas/PricingSourceMeta
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
        '502':
          $ref: ../../components/responses.yaml#/components/responses/BadGateway
