paths:
  /v1/detection-packs:
    get:
      tags:
      - settings
      operationId: listDetectionPacks
      summary: List detection packs
      description: >
        Reads detection packs from disk for the host or filtered by project lens.
      parameters:
      - name: project_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: >
          When set, apply that project's enable-only detection-packs.yaml overlay
          to the returned enabled flags. Ignored unless the project_settings
          trust surface applies to the project.
      responses:
        '200':
          description: Detection packs
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/detections.yaml#/components/schemas/DetectionPackList
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
    post:
      tags:
      - settings
      operationId: importDetectionPack
      x-person-action: record
      summary: Import a detection pack from a folder
      description: >
        Validates and optionally copies an allowlisted pack folder into the
        device detection-packs directory. dry_run previews without writing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/settings/detections.yaml#/components/schemas/DetectionPackImportRequest
      responses:
        '201':
          description: Import preview or committed result
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/detections.yaml#/components/schemas/DetectionPackImportResult
        '400':
          $ref: ../../components/responses.yaml#/components/responses/Error
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Error
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
  /v1/detection-packs/{pack_id}:
    patch:
      tags:
      - settings
      operationId: updateDetectionPack
      x-person-action: record
      summary: Enable or disable a detection pack
      parameters:
      - name: pack_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,39}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/settings/detections.yaml#/components/schemas/UpdateDetectionPackRequest
      responses:
        '200':
          description: Updated pack
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/detections.yaml#/components/schemas/DetectionPack
        '404':
          $ref: ../../components/responses.yaml#/components/responses/Error
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
    delete:
      tags:
      - settings
      operationId: deleteDetectionPack
      x-person-action: record
      summary: Remove a device detection pack
      parameters:
      - name: pack_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,39}$'
      responses:
        '204':
          description: Pack removed
        '404':
          $ref: ../../components/responses.yaml#/components/responses/Error
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Error
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
