paths:
  /v1/settings/model-policy:
    get:
      tags:
      - settings
      operationId: getModelPolicySettings
      summary: Get stored model policy overlay (empty slots inherit parent / Settings)
      parameters:
      - name: project_id
        in: query
        schema:
          type: string
          format: uuid
      - name: effective
        in: query
        description: When true, return the effective merged policy (bundled, then global, then the project_id
          project's overlay) with every slot resolved, instead of the stored overlay layer. Read-only projection
          for status surfaces; the editor keeps using the overlay form.
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Model policy
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/models.yaml#/components/schemas/ModelPolicy
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
    patch:
      tags:
      - settings
      operationId: updateModelPolicySettings
      x-person-action: record
      summary: Apply model-policy slot assignments
      description: >
        Omitted slots stay stored. A present key, including an empty ref, is the
        assignment.
      parameters:
      - name: project_id
        in: query
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/settings/models.yaml#/components/schemas/ModelPolicyPatch
      responses:
        '200':
          description: Updated model policy
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/models.yaml#/components/schemas/ModelPolicy
        '503':
          description: Provider discovery failed while validating the model assignment; provider_catalog_unavailable is retryable and no assignment is applied
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
