paths:
  /v1/projects/{id}/blueprints:
    get:
      tags:
      - blueprints
      operationId: listBlueprints
      summary: List blueprint files under the overlay blueprints/ directory for a project
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ProjectId
      - name: path
        in: query
        required: false
        description: >
          Filter to the blueprint at this project-relative path; the answer holds
          at most one blueprint.
        schema:
          type: string
          minLength: 1
      responses:
        '200':
          description: Blueprint summaries
          content:
            application/json:
              schema:
                $ref: ../components/schemas/blueprint.yaml#/components/schemas/BlueprintListResponse
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
    post:
      tags:
      - blueprints
      operationId: createBlueprint
      x-person-action: record
      summary: Create a blueprint markdown file under the overlay blueprints/ directory
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ProjectId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/blueprint.yaml#/components/schemas/CreateBlueprintRequest
      responses:
        '201':
          description: Blueprint created
          content:
            application/json:
              schema:
                $ref: ../components/schemas/blueprint.yaml#/components/schemas/Blueprint
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
  /v1/projects/{id}/blueprints/{blueprint_id}:
    get:
      tags:
      - blueprints
      operationId: getBlueprint
      summary: Get blueprint by ID
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ProjectId
      - $ref: ../components/parameters.yaml#/components/parameters/BlueprintId
      responses:
        '200':
          description: Blueprint
          content:
            application/json:
              schema:
                $ref: ../components/schemas/blueprint.yaml#/components/schemas/Blueprint
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
    patch:
      tags:
      - blueprints
      operationId: updateBlueprint
      x-person-action: record
      summary: Update blueprint content and/or display title
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ProjectId
      - $ref: ../components/parameters.yaml#/components/parameters/BlueprintId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/blueprint.yaml#/components/schemas/UpdateBlueprintRequest
      responses:
        '200':
          description: Updated blueprint
          content:
            application/json:
              schema:
                $ref: ../components/schemas/blueprint.yaml#/components/schemas/Blueprint
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
    delete:
      tags:
      - blueprints
      operationId: deleteBlueprint
      x-person-action: record
      summary: Delete a blueprint file under the overlay blueprints/ directory
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ProjectId
      - $ref: ../components/parameters.yaml#/components/parameters/BlueprintId
      responses:
        '204':
          description: Blueprint deleted
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
  /v1/projects/{id}/blueprints/{blueprint_id}/approve:
    post:
      tags:
      - blueprints
      operationId: approveBlueprint
      x-person-action: record
      summary: Atomically approve reviewed blueprint bytes for a workflow revision
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ProjectId
      - $ref: ../components/parameters.yaml#/components/parameters/BlueprintId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/blueprint.yaml#/components/schemas/BlueprintApproveRequest
      responses:
        '200':
          description: Approved blueprint
          content:
            application/json:
              schema:
                $ref: ../components/schemas/blueprint.yaml#/components/schemas/Blueprint
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
  /v1/projects/{id}/blueprints/{blueprint_id}/launch:
    post:
      tags:
      - blueprints
      operationId: launchBlueprint
      x-person-action: record
      summary: Launch a compatible workflow seeded from a file copy
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ProjectId
      - $ref: ../components/parameters.yaml#/components/parameters/BlueprintId
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ../components/schemas/blueprint.yaml#/components/schemas/LaunchBlueprintRequest
      responses:
        '201':
          description: Session and workflow run started from a seeded blueprint copy
          content:
            application/json:
              schema:
                $ref: ../components/schemas/blueprint.yaml#/components/schemas/LaunchBlueprintResponse
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '403':
          $ref: ../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
        '422':
          $ref: ../components/responses.yaml#/components/responses/UnprocessableContent
