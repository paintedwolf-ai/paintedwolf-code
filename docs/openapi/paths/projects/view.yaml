paths:
  /v1/projects/{id}/view:
    put:
      tags: [projects]
      operationId: replaceProjectView
      x-person-action: none
      summary: Replace what one of this person's windows shows of the project
      description: >-
        The host keeps each window's report briefly and tells a session's agent
        what the person had in view when they sent a prompt. Windows renew
        their report while it holds; a report that is not renewed expires.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ../../components/schemas/project/view.yaml#/components/schemas/ReplaceProjectViewRequest}
      responses:
        '204': {description: The window's report was replaced}
        '400': {$ref: ../../components/responses.yaml#/components/responses/Error}
        default: {$ref: ../../components/responses.yaml#/components/responses/Error}
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
