paths:
  /v1/projects/{id}/editor-documents/{document_id}/secret-spans/preview:
    post:
      tags: [projects]
      operationId: previewEditorSecretMark
      x-person-action: none
      summary: Report what marking a range in this document would capture
      description: >
        Resolves a selected rune range against the document draft and returns the
        resolved offsets, a shape receipt, and eligibility. Nothing is stored and
        no value is returned; the host slices its own copy of the draft so the
        client never sends the bytes it is asking about.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      - {name: document_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref:
                ../../components/schemas/project/editor-secrets.yaml#/components/schemas/SecretMarkRange}}}
      responses:
        '200': {description: What the range would capture, content: {application/json: {schema: {$ref:
                  ../../components/schemas/project/editor-secrets.yaml#/components/schemas/SecretMarkPreview}}}}
        '404': {description: No such document in this project,
          content: {application/json: {schema: {$ref: ../../components/schemas/common.yaml#/components/schemas/Error}}}}
        '409': {description: Stale document revision,
          content: {application/json: {schema: {$ref: ../../components/schemas/common.yaml#/components/schemas/Error}}}}
        default: {$ref: ../../components/responses.yaml#/components/responses/Error}
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '403':
          $ref: ../../components/responses.yaml#/components/responses/Forbidden
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
  /v1/projects/{id}/editor-documents/{document_id}/secret-spans/mark:
    post:
      tags: [projects]
      operationId: markEditorSecret
      x-person-action: record
      summary: Mint a managed secret from bytes already present in this file
      description: >
        Stores the value in the encrypted credential vault, admits its exact bytes
        to outbound screening, and returns the value-free capability. The file is
        not modified: a `{{paintedwolf-secret:…}}` reference is rejected by filesystem tools
        rather than materialized, so the source file remains the credential source
        of truth and marking is a zero-edit operation.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      - {name: document_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref:
                ../../components/schemas/project/editor-secrets.yaml#/components/schemas/SecretMarkRequest}}}
      responses:
        '200': {description: The managed capability, content: {application/json: {schema: {$ref:
                  ../../components/schemas/project/managed-secrets.yaml#/components/schemas/ManagedSecret}}}}
        '400': {description: The range cannot become a protected value,
          content: {application/json: {schema: {$ref: ../../components/schemas/common.yaml#/components/schemas/Error}}}}
        '404': {description: No such document in this project,
          content: {application/json: {schema: {$ref: ../../components/schemas/common.yaml#/components/schemas/Error}}}}
        '409': {description: Stale document revision,
          content: {application/json: {schema: {$ref: ../../components/schemas/common.yaml#/components/schemas/Error}}}}
        default: {$ref: ../../components/responses.yaml#/components/responses/Error}
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '403':
          $ref: ../../components/responses.yaml#/components/responses/Forbidden
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
        '503':
          $ref: ../../components/responses.yaml#/components/responses/ServiceUnavailable
