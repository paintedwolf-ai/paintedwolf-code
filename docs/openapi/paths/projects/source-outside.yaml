paths:
  /v1/projects/{id}/source/outside-files:
    post:
      tags: [projects]
      operationId: openOutsideFile
      x-person-action: record
      summary: Open a file outside the project in a chat's Files section
      description: >
        Adds a file the person chose in the native file picker to the chat:
        records that the chat opened it and places it in one of the chat's
        locations. Afterwards the file is addressed by the project's outside
        namespace and its path like any other source file.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      requestBody:
        required: true
        content: {application/json: {schema: {$ref:
                ../../components/schemas/project/source-outside.yaml#/components/schemas/OpenOutsideFileRequest}}}
      responses:
        '200': {description: The file and the location holding it, content: {application/json: {schema: {$ref:
                  ../../components/schemas/project/source-outside.yaml#/components/schemas/OpenedOutsideFile}}}}
        '400': {description: 'The path is not an absolute file path outside the project', content: {application/json: {schema: {$ref:
                  ../../components/schemas/common.yaml#/components/schemas/Error}}}}
        '404': {description: 'Project, chat, or file not found', content: {application/json: {schema: {$ref:
                  ../../components/schemas/common.yaml#/components/schemas/Error}}}}
        default: {$ref: ../../components/responses.yaml#/components/responses/Error}
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../components/responses.yaml#/components/responses/Forbidden
        '409': {description: 'The project has no outside namespace on this platform', content: {application/json: {schema: {$ref:
                  ../../components/schemas/common.yaml#/components/schemas/Error}}}}
        '413': {description: 'The request or the chosen file is too large', content: {application/json: {schema: {$ref:
                  ../../components/schemas/common.yaml#/components/schemas/Error}}}}
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
  /v1/projects/{id}/source/outside-locations/{location_id}:
    patch:
      tags: [projects]
      operationId: updateSourceChatLocation
      x-person-action: record
      summary: Hide or show a chat location
      description: Changes only whether the chat's Files section presents the location; agent access and history are unchanged.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      - name: location_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref:
                ../../components/schemas/project/source-outside.yaml#/components/schemas/UpdateSourceChatLocationRequest}}}
      responses:
        '200': {description: The updated location, content: {application/json: {schema: {$ref:
                  ../../components/schemas/project/source-outside.yaml#/components/schemas/SourceChatLocation}}}}
        '404': {description: 'Project or location not found', content: {application/json: {schema: {$ref:
                  ../../components/schemas/common.yaml#/components/schemas/Error}}}}
        default: {$ref: ../../components/responses.yaml#/components/responses/Error}
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '403':
          $ref: ../../components/responses.yaml#/components/responses/Forbidden
        '413': {description: 'The request body is too large', content: {application/json: {schema: {$ref:
                  ../../components/schemas/common.yaml#/components/schemas/Error}}}}
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
