paths:
  /v1/projects/{id}/trust:
    get:
      tags:
      - projects
      operationId: getProjectTrust
      summary: What this project supplies to the agent and which of it applies
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      responses:
        '200':
          description: Discovered surfaces with enable and seen state
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/trust.yaml#/components/schemas/ProjectTrust
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '503':
          $ref: ../../components/responses.yaml#/components/responses/ServiceUnavailable
    patch:
      tags:
      - projects
      operationId: updateProjectTrust
      x-person-action: record
      summary: Switch project surfaces on or off
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/settings/trust.yaml#/components/schemas/UpdateProjectTrustRequest
      responses:
        '200':
          description: Updated project trust
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/trust.yaml#/components/schemas/ProjectTrust
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '403':
          $ref: ../../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
        '503':
          $ref: ../../components/responses.yaml#/components/responses/ServiceUnavailable
  /v1/projects/{id}/trust/review:
    post:
      tags: [projects]
      operationId: openProjectTrustReview
      x-person-action: none
      summary: Mark the shared Trust comparison read without replacing it
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      responses:
        '200':
          description: Shared Trust state with the captured comparison marked read
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/trust.yaml#/components/schemas/ProjectTrust
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Error
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '403':
          $ref: ../../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '503':
          $ref: ../../components/responses.yaml#/components/responses/ServiceUnavailable
