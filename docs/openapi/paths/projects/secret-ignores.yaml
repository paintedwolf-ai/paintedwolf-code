paths:
  /v1/projects/{id}/secret-ignores:
    get:
      tags: [projects]
      operationId: listProjectSecretIgnores
      summary: Read the project's ignored public values
      parameters:
        - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
        - name: root_id
          in: query
          required: false
          description: Attached folder whose ignore file holds the declarations.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: File declarations and their current status
          content:
            application/json:
              schema: {$ref: ../../components/schemas/project/secret-ignores.yaml#/components/schemas/SecretIgnoreList}
        '401': {$ref: ../../components/responses.yaml#/components/responses/Unauthorized}
        '404': {$ref: ../../components/responses.yaml#/components/responses/Error}
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
        '500':
          $ref: ../../components/responses.yaml#/components/responses/InternalError
    post:
      tags: [projects]
      operationId: createProjectSecretIgnore
      x-person-action: record
      summary: Declare one exact public value in the project's ignore file
      description: Writes plaintext following an explicit human review. Does not release any held request. The entry id makes identical retries idempotent.
      parameters:
        - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: ../../components/schemas/project/secret-ignores.yaml#/components/schemas/AddSecretIgnoreRequest}
      responses:
        '201':
          description: Current declarations
          content:
            application/json:
              schema: {$ref: ../../components/schemas/project/secret-ignores.yaml#/components/schemas/SecretIgnoreList}
        '400': {$ref: ../../components/responses.yaml#/components/responses/Error}
        '401': {$ref: ../../components/responses.yaml#/components/responses/Unauthorized}
        '404': {$ref: ../../components/responses.yaml#/components/responses/Error}
        '409': {$ref: ../../components/responses.yaml#/components/responses/Error}
        '415': {$ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType}
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
        '500':
          $ref: ../../components/responses.yaml#/components/responses/InternalError
  /v1/projects/{id}/secret-ignores/{entry_id}:
    delete:
      tags: [projects]
      operationId: deleteProjectSecretIgnore
      x-person-action: record
      summary: Withdraw one declared public value from the project's ignore file
      description: Removes the entry the listing published, preserving the file's other section and its comments. Withdrawing an exception only narrows what the project ignores, so it does not require the scanning trust surface. Covered findings return to normal screening without a rescan.
      parameters:
        - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
        - name: entry_id
          in: path
          required: true
          description: The entry id this project's listing published.
          schema:
            type: string
            pattern: '^[A-Za-z0-9_.:-]+$'
        - name: root_id
          in: query
          required: true
          description: The attached folder whose ignore file holds the entry.
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Current declarations removed
        '400': {$ref: ../../components/responses.yaml#/components/responses/Error}
        '401': {$ref: ../../components/responses.yaml#/components/responses/Unauthorized}
        '404': {$ref: ../../components/responses.yaml#/components/responses/Error}
        '409': {$ref: ../../components/responses.yaml#/components/responses/Error}
        '500':
          $ref: ../../components/responses.yaml#/components/responses/InternalError
  /v1/projects/{id}/secret-ignore-candidates/{candidate_id}:
    get:
      tags: [projects]
      operationId: getSecretIgnoreCandidate
      summary: Review a live unprotected secret detection
      description: Only available during the originating approval and never for protected values. Plaintext is returned only for the explicit human review and is not persisted in the checkpoint.
      parameters:
        - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
        - name: candidate_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Exact bytes for review
          content:
            application/json:
              schema: {$ref: ../../components/schemas/project/secret-ignores.yaml#/components/schemas/SecretIgnoreCandidate}
        '400': {$ref: ../../components/responses.yaml#/components/responses/Error}
        '401': {$ref: ../../components/responses.yaml#/components/responses/Unauthorized}
        '404': {$ref: ../../components/responses.yaml#/components/responses/Error}
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
        '500':
          $ref: ../../components/responses.yaml#/components/responses/InternalError
