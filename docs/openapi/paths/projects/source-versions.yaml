paths:
  /v1/projects/{id}/source/versions:
    get:
      tags: [projects]
      operationId: listProjectSourceVersions
      x-multi-stream-list: true
      summary: List one file's merged history — retained versions and git lineage
      description: |
        Every retained state of the file, across primary and worker workspaces,
        newest first. It is not filtered by a presentation baseline or Walk
        range, and it is not limited to states a recorded effect produced: a
        tracked baseline and a preserved pre-image are restorable states and
        page here like any other.

        When the file's root is a git checkout the response also carries one
        page of the file's commit lineage, joined server-side: a commit whose
        blob equals a retained version collapses into that version's row, a
        commit that arrived through an observed ref movement names it, and the
        rest belong to the git-history era below the tracked-since boundary.
        The two lanes page independently. next_cursor continues every
        requested lane that holds more; a continuation answers an exhausted
        lane empty, with git_history_state not_requested for the Git lane.
        A cursor continues only the file, lane, and chat workspace that issued
        it. Select one lane for phased rendering or paging.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      - $ref: ../../components/parameters.yaml#/components/parameters/SourceSessionIdQuery
      - name: file_id
        in: query
        required: true
        schema: {type: string, format: uuid}
      - name: limit
        in: query
        required: false
        schema: {type: integer, minimum: 1, maximum: 500, default: 100}
      - name: cursor
        in: query
        required: false
        description: Opaque next_cursor from the preceding page. Omit for the newest page.
        schema: {type: string}
      - name: lane
        in: query
        required: false
        description: History lane to return.
        schema:
          type: string
          enum: [all, retained, git]
          default: all
      responses:
        '200':
          description: Retained file versions
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/project/source-versions.yaml#/components/schemas/SourceFileVersionsResponse
        '400':
          description: Missing target or invalid pagination
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
  /v1/projects/{id}/source/commits/{commit_sha}/restore:
    post:
      tags: [projects]
      operationId: restoreProjectSourceCommitState
      x-person-action: record
      summary: Restore the file's bytes as one commit holds them
      description: |
        Applies a listed commit's blob as a new user-authored primary
        workspace version. Bytes come from the repository object store and
        must hash to the request's blob_oid; a drifted or unreachable object
        returns 422 without touching the working tree. The required base tip
        provides compare-and-swap protection, matching version restore. The
        restored bytes equal the commit's, so the merged listing re-labels
        the new row with the commit identity through the same blob join.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      - $ref: ../../components/parameters.yaml#/components/parameters/SourceSessionIdQuery
      - name: commit_sha
        in: path
        required: true
        schema: {type: string, pattern: '^[0-9a-f]{7,64}$'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/project/source-versions.yaml#/components/schemas/SourceCommitRestoreRequest
      responses:
        '200':
          description: The commit's bytes are now current
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/project/source-versions.yaml#/components/schemas/SourceCommitRestoreResponse
        '400':
          description: Malformed operation id, target, or base tip
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        '404':
          description: Project, logical file, or commit not found; `source_commit_not_found` when no repository serving the root holds the commit
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        '410':
          description: The exact native Trash item is no longer available for restoration
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        '409':
          description: The working file changed since it was loaded
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        '422':
          description: The commit's bytes are unreachable or do not hash to blob_oid
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '403':
          $ref: ../../components/responses.yaml#/components/responses/Forbidden
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
  /v1/projects/{id}/source/versions/{version_id}/restore:
    post:
      tags: [projects]
      operationId: restoreProjectSourceVersion
      x-person-action: record
      summary: Restore one retained version as the working file
      description: |
        Applies the selected immutable state as a new user-authored primary
        workspace version. Exact retained bytes are used, including binary
        content. The target remains at its current path across historical
        renames. The required base tip provides compare-and-swap protection;
        a changed or unexpectedly present/absent target returns 409. Content
        that was not captured or is unavailable returns 422 without touching
        the working tree.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      - $ref: ../../components/parameters.yaml#/components/parameters/SourceSessionIdQuery
      - name: version_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/project/source-versions.yaml#/components/schemas/SourceVersionRestoreRequest
      responses:
        '200':
          description: The selected state is now current
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/project/source-versions.yaml#/components/schemas/SourceVersionRestoreResponse
        '400':
          description: Malformed operation id, target, or base tip
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        '404':
          description: Project, logical file, or retained version not found
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        '410':
          description: The exact native Trash item is no longer available for restoration
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        '409':
          description: The working file changed since it was loaded
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        '422':
          description: Exact bytes for this retained version are unavailable
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '403':
          $ref: ../../components/responses.yaml#/components/responses/Forbidden
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
