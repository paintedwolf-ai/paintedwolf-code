paths:
  /v1/projects/{id}/agent-context:
    get:
      tags:
      - projects
      operationId: getProjectAgentContext
      summary: Resolve actual repository guidance for one project path
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      - $ref: ../../components/parameters.yaml#/components/parameters/SourceSessionIdQuery
      - name: root_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: path
        in: query
        required: false
        schema:
          type: string
          default: .
      responses:
        '200':
          description: Applied AGENTS.md chain and available project skills for the requested scope
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/settings/trust.yaml#/components/schemas/ProjectAgentContext
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
