paths:
  /v1/projects/{id}/secrets:
    get:
      tags: [projects]
      operationId: listProjectManagedSecrets
      summary: List managed secret metadata for a project
      description: Returns names, creation origins, scopes, references, and lifecycle state. Secret values are never returned.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      responses:
        '200':
          description: Value-free managed-secret inventory
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/project/managed-secrets.yaml#/components/schemas/ManagedSecretList
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
    post:
      tags: [projects]
      operationId: createProjectManagedSecret
      x-person-action: record
      summary: Store a value a person entered in project settings
      description: >-
        Mints a project-scoped capability from a credential the person typed in.
        The value travels in this request body and nowhere else: it is written
        to the encrypted credential vault and is not returned by this response or
        any later read.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/project/managed-secrets.yaml#/components/schemas/CreateManagedSecretRequest
      responses:
        '201':
          description: The stored capability, without its value
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/project/managed-secrets.yaml#/components/schemas/ManagedSecret
        '400':
          description: The value or its labels cannot become a managed secret
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '403':
          $ref: ../../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
        '503':
          $ref: ../../components/responses.yaml#/components/responses/ServiceUnavailable
  /v1/projects/{id}/secrets/{secret_id}:
    patch:
      tags: [projects]
      operationId: updateProjectManagedSecret
      x-person-action: record
      summary: Administer one managed secret
      description: >-
        Updates labels, agent-use deadline, and scope. Nothing here reaches the
        stored value, an external credential, or a project file, and a revoked
        capability is terminal.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      - name: secret_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/project/managed-secrets.yaml#/components/schemas/UpdateManagedSecretRequest
      responses:
        '200':
          description: Updated capability metadata
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/project/managed-secrets.yaml#/components/schemas/ManagedSecret
        '400':
          description: The update does not apply to this capability
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        '404':
          description: No such secret in this project
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        '409':
          description: The capability is revoked, which is terminal
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '403':
          $ref: ../../components/responses.yaml#/components/responses/Forbidden
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
        '503':
          $ref: ../../components/responses.yaml#/components/responses/ServiceUnavailable
    delete:
      tags: [projects]
      operationId: revokeProjectManagedSecret
      x-person-action: record
      summary: Permanently revoke one managed secret
      description: Disables reference resolution and authenticated reveal permanently. Protected bytes remain only for provider screening until project deletion.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      - name: secret_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Revoked capability metadata
        '404':
          description: No such secret in this project
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '403':
          $ref: ../../components/responses.yaml#/components/responses/Forbidden
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
        '503':
          $ref: ../../components/responses.yaml#/components/responses/ServiceUnavailable
  /v1/projects/{id}/secrets/{secret_id}/value:
    put:
      tags: [projects]
      operationId: replaceProjectManagedSecretValue
      x-person-action: record
      summary: Replace or restore one managed secret's stored value
      description: >-
        Puts new bytes behind an unchanged reference. Only Painted Wolf's
        protected copy changes; this does not modify a project file or rotate,
        revoke, or activate an external credential. The replaced value is
        retired rather than deleted, so provider screening keeps redacting a
        credential the agent has already seen; a retired value never resolves.
        The same call restores a capability whose stored value went missing.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      - name: secret_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/project/managed-secrets.yaml#/components/schemas/ReplaceManagedSecretValueRequest
      responses:
        '200':
          description: Capability metadata at its new version
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/project/managed-secrets.yaml#/components/schemas/ManagedSecret
        '400':
          description: The value cannot be stored, or already is the stored value
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        '404':
          description: No such secret in this project
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        '409':
          description: The capability is revoked, which is terminal
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '403':
          $ref: ../../components/responses.yaml#/components/responses/Forbidden
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
        '503':
          $ref: ../../components/responses.yaml#/components/responses/ServiceUnavailable
  /v1/projects/{id}/secrets/{secret_id}/uses:
    get:
      tags: [projects]
      operationId: listProjectManagedSecretUses
      summary: Recent substitution attempts for one managed secret
      description: >-
        A bounded rolling window of what the host did with this reference, newest
        first — successful substitutions and refusals alike. Records who asked,
        never the value and never the argument it was going into.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      - name: secret_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        required: false
        description: Opaque cursor returned as next_cursor by the previous page.
        schema:
          type: string
      responses:
        '200':
          description: Recent uses within the retained window
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/project/managed-secrets.yaml#/components/schemas/ManagedSecretUseList
        '404':
          description: No such secret in this project
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '403':
          $ref: ../../components/responses.yaml#/components/responses/Forbidden
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
        '503':
          $ref: ../../components/responses.yaml#/components/responses/ServiceUnavailable
  /v1/projects/{id}/secrets/{secret_id}/attestations:
    get:
      tags: [projects]
      operationId: listProjectManagedSecretAttestations
      summary: Presence-verified reveals and releases of one managed secret
      description: >-
        Newest first. Each entry records a reveal to the person's own view or
        a release to the recipients an approval reviewed, with who confirmed
        and how. Never the value or the proof.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      - name: secret_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      responses:
        '200':
          description: Recorded attestations
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/project/managed-secrets.yaml#/components/schemas/ManagedSecretAttestationList
        '404':
          description: No such secret in this project
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '403':
          $ref: ../../components/responses.yaml#/components/responses/Forbidden
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
        '503':
          $ref: ../../components/responses.yaml#/components/responses/ServiceUnavailable
  /v1/projects/{id}/secrets/{secret_id}/reveal-challenges:
    post:
      tags: [projects]
      operationId: beginProjectManagedSecretReveal
      x-person-action: none
      summary: Begin one authenticated human reveal
      description: >-
        Creates a short-lived, single-use challenge for the installed desktop
        shell. This operation returns no credential bytes. A bearer-authenticated
        caller without the native shell's challenge-bound proof cannot complete
        the reveal.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      - name: secret_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/project/managed-secrets.yaml#/components/schemas/BeginManagedSecretRevealRequest
      responses:
        '201':
          description: Challenge to authenticate and sign
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/project/managed-secrets.yaml#/components/schemas/ManagedSecretRevealChallenge
        '404':
          description: No such secret in this project
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        '409':
          description: The capability is revoked or has no readable current value
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        '503':
          description: Native authenticated reveal is unavailable for this app session
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '403':
          $ref: ../../components/responses.yaml#/components/responses/Forbidden
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
  /v1/projects/{id}/secrets/{secret_id}/reveal-challenges/{challenge_id}/complete:
    post:
      tags: [projects]
      operationId: completeProjectManagedSecretReveal
      x-person-action: record
      summary: Complete one authenticated human reveal
      description: >-
        Consumes one fresh challenge and a native-shell signature produced only
        after operating-system user verification. The challenge is consumed by
        the first completion attempt. Success is durably audited before the
        current value is returned. The response body is categorically withheld
        from every debug capture.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      - name: secret_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: challenge_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/project/managed-secrets.yaml#/components/schemas/CompleteManagedSecretRevealRequest
      responses:
        '200':
          description: Current value for immediate human presentation
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/project/managed-secrets.yaml#/components/schemas/ManagedSecretRevealResponse
        '403':
          description: The challenge expired, was already consumed, or its proof was invalid
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        '404':
          description: No such secret in this project
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        '409':
          description: The capability or current value changed after the challenge began
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
        '503':
          $ref: ../../components/responses.yaml#/components/responses/ServiceUnavailable
