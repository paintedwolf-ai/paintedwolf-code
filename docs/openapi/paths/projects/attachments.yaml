paths:
  /v1/projects/{id}/attachments:
    post:
      tags: [projects]
      operationId: uploadAttachment
      x-person-action: record
      summary: Stream one attachment body into project host data
      description: >
        The body is the raw file, not a JSON envelope, so nothing is buffered whole
        in memory on either side. The host detects the format from the leading
        bytes, decodes a single-member compression container when it finds one, and
        materializes the result content-addressed. A video is decoded once in the
        managed browser, and one whose codec does not play is refused with
        attachment_undecodable. The returned blob_id is what a prompt references;
        the client never learns a filesystem path.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/ProjectId
      - name: filename
        in: query
        required: true
        description: Display name for the upload; a hint the host sanitizes, never a path it opens
        schema: {type: string}
      - name: mime
        in: query
        required: false
        description: >-
          The file's own media type as the client knows it, a detection hint.
          The body is always sent as application/octet-stream.
        schema: {type: string, maxLength: 255, pattern: '^[a-z0-9!#$&^_.+-]+/[a-z0-9!#$&^_.+-]+$'}
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: {type: string, format: binary}
      responses:
        '201':
          description: Body materialized
          content:
            application/json:
              schema: {$ref: ../../components/schemas/session/prompts.yaml#/components/schemas/AttachmentUploadResponse}
        '400':
          description: Invalid filename or attachment rejected with unsupported_attachment or attachment_undecodable
          content: {application/json: {schema: {$ref: ../../components/schemas/common.yaml#/components/schemas/Error}}}
        '413':
          description: Attachment exceeded a size cap (attachment_too_large)
          content: {application/json: {schema: {$ref: ../../components/schemas/common.yaml#/components/schemas/Error}}}
        '503':
          description: Project attachment storage is unavailable
          content: {application/json: {schema: {$ref: ../../components/schemas/common.yaml#/components/schemas/Error}}}
        default: {$ref: ../../components/responses.yaml#/components/responses/Error}
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
