paths:
  /v1/host-resources:
    get:
      operationId: getHostResources
      summary: List catalog host resources and current machine-state availability
      tags: [host-resources]
      parameters:
      - name: project_id
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Coherent host-resource snapshot
          content:
            application/json:
              schema:
                $ref: ../components/schemas/host-resources.yaml#/components/schemas/HostResourcesResponse
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
  /v1/host-resources/refresh:
    post:
      operationId: refreshHostResources
      x-person-action: none
      summary: Refresh all host-resource probes and return the new snapshot
      tags: [host-resources]
      responses:
        '200':
          description: Refreshed host-resource snapshot
          content:
            application/json:
              schema:
                $ref: ../components/schemas/host-resources.yaml#/components/schemas/HostResourcesResponse
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
  /v1/host-resources/{resource_id}:
    patch:
      operationId: updateHostResource
      x-person-action: record
      summary: Set or inherit the exact host-resource access rule for a scope
      tags: [host-resources]
      parameters:
      - name: resource_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-z0-9]+([.-][a-z0-9]+)*$'
      - name: project_id
        in: query
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/host-resources.yaml#/components/schemas/UpdateHostResourceRequest
      responses:
        '200':
          description: Effective host-resource snapshot after the lossless policy mutation
          content:
            application/json:
              schema:
                $ref: ../components/schemas/host-resources.yaml#/components/schemas/HostResourcesResponse
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
