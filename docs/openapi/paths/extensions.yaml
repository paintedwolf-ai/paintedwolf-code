paths:
  /v1/extensions:
    get:
      tags:
      - extensions
      operationId: getExtensionsCatalog
      summary: The catalog generation in force — packs, units, diagnostics, and desired state
      description: |
        One resolve, projected whole: pack summaries with blocked_reason, the units
        they resolved to, the diagnostics against them, and the desired state that
        selected them. A pack summary and a diagnostic about the same pack come from
        the same generation, so they cannot disagree.

        MCP dependency is per contribution, not per pack: see the contribution
        frame's requirement readiness. Does not install or enable MCP providers.
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ExtensionsProjectIdQuery
      responses:
        '200':
          description: The catalog generation in force
          content:
            application/json:
              schema:
                $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionsCatalogView
        '409':
          description: Extension state changed (extension_state_changed)
          content: {application/json: {schema: {$ref: ../components/schemas/common.yaml#/components/schemas/Error}}}
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
  /v1/extensions/units/{unit_id}:
    get:
      tags:
      - extensions
      operationId: getExtensionUnit
      summary: Get one effective unit (providers + bodies)
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ExtensionUnitId
      - $ref: ../components/parameters.yaml#/components/parameters/ExtensionsProjectIdQuery
      responses:
        '200':
          description: Unit detail
          content:
            application/json:
              schema:
                $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionUnitDetail
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
    patch:
      tags:
      - extensions
      operationId: updateExtensionUnit
      x-person-action: record
      summary: Update unit enablement or collision owner in desired state
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ExtensionUnitId
      - $ref: ../components/parameters.yaml#/components/parameters/ExtensionsProjectIdQuery
      - $ref: ../components/parameters.yaml#/components/parameters/ExtensionsScopeQuery
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/extensions.yaml#/components/schemas/UpdateExtensionUnitRequest
      responses:
        '200':
          description: Updated desired state
          content:
            application/json:
              schema:
                $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionMutationResponse
        '409':
          description: Extension state changed (extension_state_changed)
          content: {application/json: {schema: {$ref: ../components/schemas/common.yaml#/components/schemas/Error}}}
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
  /v1/extensions/packs:
    post:
      tags:
      - extensions
      operationId: installExtensionPack
      x-person-action: record
      summary: Resolve and install a versioned pack graph
      description: >-
        Selects the newest release satisfying version, or the exact ref pin; resolves
        transitive dependencies; and atomically publishes desired state plus an exact
        integrity lock. Does not apply profiles or install MCP. Network resolution is
        cancelable and bounded.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionInstallRequest
      responses:
        '201':
          description: Install result (pack installed or refreshed from source)
          content:
            application/json:
              schema:
                $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionInstallResponse
        '409':
          description: Extension state changed (extension_state_changed)
          content: {application/json: {schema: {$ref: ../components/schemas/common.yaml#/components/schemas/Error}}}
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
  /v1/extensions/packs/{pack_id}:
    patch:
      tags:
      - extensions
      operationId: updateExtensionPack
      x-person-action: record
      summary: Enable or disable a pack in desired state
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ExtensionPackId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/extensions.yaml#/components/schemas/UpdateExtensionPackRequest
      responses:
        '200':
          description: Updated desired state
          content:
            application/json:
              schema:
                $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionMutationResponse
        '409':
          description: Extension state changed (extension_state_changed)
          content: {application/json: {schema: {$ref: ../components/schemas/common.yaml#/components/schemas/Error}}}
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
    delete:
      tags:
      - extensions
      operationId: deleteExtensionPack
      x-person-action: record
      summary: Remove a cached pack from desired state (stock packs rejected)
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ExtensionPackId
      - name: expected_revision
        in: query
        required: true
        description: Extension-state revision the caller last observed
        schema:
          type: string
      responses:
        '204':
          description: Removed — updated desired state
        '409':
          description: Extension state changed (extension_state_changed)
          content: {application/json: {schema: {$ref: ../components/schemas/common.yaml#/components/schemas/Error}}}
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
  /v1/extensions/configuration:
    patch:
      tags:
      - extensions
      operationId: updateExtensionConfiguration
      x-person-action: record
      summary: Atomically replace configuration values for one or more packs
      description: >-
        Each pack value is its complete replacement block; an empty map removes
        that pack's configuration. Values are non-secret scalars or string lists
        and every pack commits under one extension-state revision.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionConfigurationRequest
      responses:
        '200':
          description: Updated desired state
          content:
            application/json:
              schema:
                $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionMutationResponse
        '409':
          description: Extension state changed (extension_state_changed)
          content: {application/json: {schema: {$ref: ../components/schemas/common.yaml#/components/schemas/Error}}}
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
  /v1/extensions/packs/{pack_id}/update:
    get:
      tags:
      - extensions
      operationId: getExtensionPackUpdate
      summary: Resolve and compare the complete candidate package graph
      description: |
        Stock packs update with the app. Development packs reload from disk. Release
        constraints re-resolve against SemVer tags; exact pins re-resolve only their
        recorded ref. The response reports every added, removed, upgraded, downgraded,
        or revised transitive package.
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ExtensionPackId
      responses:
        '200':
          description: Update availability
          content:
            application/json:
              schema:
                $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionPackUpdateStatus
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
    post:
      tags:
      - extensions
      operationId: applyExtensionPackUpdate
      x-person-action: record
      summary: Resolve and atomically publish the candidate package graph
      description: >-
        Fetches from the remote, so it can run for minutes; abandoning the request
        cancels the fetch, and a remote that never responds fails the request
        rather than hanging.
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ExtensionPackId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionRevisionRequest
      responses:
        '200':
          description: Pack updated
          content:
            application/json:
              schema:
                $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionPackActionResponse
        '409':
          description: Extension state changed (extension_state_changed)
          content: {application/json: {schema: {$ref: ../components/schemas/common.yaml#/components/schemas/Error}}}
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
  /v1/extensions/packs/{pack_id}/reload:
    post:
      tags:
      - extensions
      operationId: reloadExtensionPack
      x-person-action: record
      summary: Re-read a linked folder pack from disk and refresh the catalog
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ExtensionPackId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionRevisionRequest
      responses:
        '200':
          description: Pack reloaded
          content:
            application/json:
              schema:
                $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionPackActionResponse
        '409':
          description: Extension state changed (extension_state_changed)
          content: {application/json: {schema: {$ref: ../components/schemas/common.yaml#/components/schemas/Error}}}
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
  /v1/extensions/packs/{pack_id}/profiles/{profile_name}/apply:
    post:
      tags:
      - extensions
      operationId: applyExtensionPackProfile
      x-person-action: record
      summary: Apply a pack profile into desired state
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ExtensionPackId
      - $ref: ../components/parameters.yaml#/components/parameters/ExtensionProfileName
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionRevisionRequest
      responses:
        '200':
          description: Profile applied
          content:
            application/json:
              schema:
                $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionMutationResponse
        '409':
          description: Extension state changed (extension_state_changed)
          content: {application/json: {schema: {$ref: ../components/schemas/common.yaml#/components/schemas/Error}}}
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
  /v1/extensions/meta-packs:
    post:
      tags:
      - extensions
      operationId: installExtensionMetaPack
      x-person-action: record
      summary: Resolve a versioned suite and install all member packages in one graph
      description: >-
        Clones from the source, so it can run for minutes; abandoning the request cancels the clone and installs nothing,
        and a remote that never responds fails the request rather than hanging.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionMetaPackInstallRequest
      responses:
        '201':
          description: Suite installed; returns refreshed extensions list
          content:
            application/json:
              schema:
                $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionMutationResponse
        '409':
          description: Extension state changed (extension_state_changed)
          content: {application/json: {schema: {$ref: ../components/schemas/common.yaml#/components/schemas/Error}}}
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
  /v1/extensions/meta-packs/{meta_pack_id}:
    patch:
      tags:
      - extensions
      operationId: updateExtensionMetaPack
      x-person-action: record
      summary: Enable or disable every present member pack in a meta-pack suite
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ExtensionMetaPackId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/extensions.yaml#/components/schemas/UpdateExtensionMetaPackRequest
      responses:
        '200':
          description: Suite updated; returns refreshed extensions list
          content:
            application/json:
              schema:
                $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionMutationResponse
        '409':
          description: Extension state changed (extension_state_changed)
          content: {application/json: {schema: {$ref: ../components/schemas/common.yaml#/components/schemas/Error}}}
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
    delete:
      tags:
      - extensions
      operationId: deleteExtensionMetaPack
      x-person-action: record
      summary: Remove a community meta-pack cache entry
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ExtensionMetaPackId
      - name: expected_revision
        in: query
        required: true
        description: Extension-state revision the caller last observed
        schema:
          type: string
      responses:
        '204':
          description: Suite removed
        '409':
          description: Extension state changed (extension_state_changed)
          content: {application/json: {schema: {$ref: ../components/schemas/common.yaml#/components/schemas/Error}}}
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
  /v1/extensions/meta-packs/{meta_pack_id}/apply:
    post:
      tags:
      - extensions
      operationId: applyExtensionMetaPack
      x-person-action: record
      summary: Enable every member pack in a meta-pack suite
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/ExtensionMetaPackId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionRevisionRequest
      responses:
        '200':
          description: Suite enabled; returns refreshed extensions list
          content:
            application/json:
              schema:
                $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionMutationResponse
        '409':
          description: Extension state changed (extension_state_changed)
          content: {application/json: {schema: {$ref: ../components/schemas/common.yaml#/components/schemas/Error}}}
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
  /v1/extensions/suggestions:
    get:
      tags:
      - extensions
      operationId: getExtensionSuggestions
      summary: The install proposals this project lists, never applied
      description: |
        Reads the project's extensions.yaml as a suggestion manifest. Packs listed
        there are proposals to install on the device. Suggest rows do not contribute
        until a human accepts them; unit disables are separate project settings.
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Suggestion rows for project contribution review and extension settings
          content:
            application/json:
              schema:
                $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionSuggestionsResponse
        '409':
          description: The project's extension suggestion file is invalid (extension_suggestion_invalid)
          content: {application/json: {schema: {$ref: ../components/schemas/common.yaml#/components/schemas/Error}}}
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
  /v1/extensions/suggestions/accept:
    post:
      tags:
      - extensions
      operationId: acceptExtensionSuggestions
      x-person-action: record
      summary: Install suggested packs on the device
      parameters:
      - name: project_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionSuggestionsAcceptRequest
      responses:
        '200':
          description: Catalog after the device install
          content:
            application/json:
              schema:
                $ref: ../components/schemas/extensions.yaml#/components/schemas/ExtensionsCatalogView
        '409':
          description: The project's extension suggestion file is invalid (extension_suggestion_invalid)
          content: {application/json: {schema: {$ref: ../components/schemas/common.yaml#/components/schemas/Error}}}
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '403':
          $ref: ../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
