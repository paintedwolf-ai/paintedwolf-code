paths:
  /v1/sessions/{id}/rewind/preview:
    post:
      tags: [sessions]
      operationId: previewSessionRewind
      x-person-action: none
      summary: Preview the source changes and conflicts for a rewind
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/SessionId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/session/rewind.yaml#/components/schemas/RewindPreviewRequest
      responses:
        '200':
          description: Exact plan identity or structured conflicts; no source or transcript mutation
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/session/rewind.yaml#/components/schemas/RewindPreviewResponse
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
        '422':
          $ref: ../../components/responses.yaml#/components/responses/UnprocessableContent
  /v1/sessions/{id}/rewind:
    post:
      tags:
      - sessions
      operationId: rewindSession
      x-person-action: record
      summary: Undo a turn — restore files and drop the ask and everything after it
      description: >-
        Restores the project and session to the state immediately before the
        anchor user message's turn started: all selected source effects are
        reversed through exact retained versions, and the anchor plus every later transcript row is
        removed. Host-executed and not a tool — the model must not be able to undo
        itself. The session must be idle; a running turn or an
        in-flight worker rejects with session_not_idle. Unrelated to the HITL
        /checkpoints approval bus. See docs/session.md § Session recovery.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/SessionId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/session/rewind.yaml#/components/schemas/RewindSessionRequest
      responses:
        '200':
          description: What the rewind restored and removed
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/session/rewind.yaml#/components/schemas/RewindSessionResponse
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
        '422':
          $ref: ../../components/responses.yaml#/components/responses/UnprocessableContent
