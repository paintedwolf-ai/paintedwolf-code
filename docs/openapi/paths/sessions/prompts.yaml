paths:
  /v1/sessions/{id}/prompts:
    post:
      tags:
      - sessions
      operationId: sendPrompt
      x-person-action: record
      summary: Send user prompt to session
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/SessionId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/session/prompts.yaml#/components/schemas/PromptRequest
      responses:
        '202':
          description: Prompt enqueued — coordinator turn runs asynchronously; transcript and errors arrive on SSE
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/session/prompts.yaml#/components/schemas/PromptAcceptedResponse
        '400':
          description: Invalid prompt or attachment rejected with unsupported_attachment,
            attachment_not_found, or reference_out_of_jail
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        '413':
          description: Inline prose or an attachment exceeded a size cap (prompt_text_too_large, attachment_too_large)
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        '503':
          description: Prompt or project attachment storage is unavailable
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/common.yaml#/components/schemas/Error
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '403':
          $ref: ../../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
  /v1/sessions/{id}/composer-secrets:
    post:
      tags: [sessions]
      operationId: createComposerSecret
      x-person-action: record
      summary: Protect selected composer text for this task
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/SessionId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/session/prompts.yaml#/components/schemas/CreateComposerSecretRequest
      responses:
        '201':
          description: Value-free managed secret metadata
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/project/managed-secrets.yaml#/components/schemas/ManagedSecret
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '403':
          $ref: ../../components/responses.yaml#/components/responses/Forbidden
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
        '503':
          $ref: ../../components/responses.yaml#/components/responses/ServiceUnavailable
  /v1/sessions/{id}/abort:
    post:
      tags:
      - sessions
      operationId: abortSession
      x-person-action: record
      summary: Stop all activity attached to a session tree
      description: >-
        Stops the session and every attached child activity. The request rejects
        new work while it cancels and joins queued prompts, child sessions,
        workers, workflows, checkpoints, tool invocations, and background session
        tasks. It returns after the session is idle and leaves persisted messages
        and results intact.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/SessionId
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/session/prompts.yaml#/components/schemas/AbortSessionRequest
      responses:
        '200':
          description: Session after abort (status idle)
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/session/identity.yaml#/components/schemas/Session
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
