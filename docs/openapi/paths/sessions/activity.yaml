paths:
  /v1/sessions/{id}/findings:
    get:
      tags:
      - sessions
      operationId: getSessionFindings
      summary: Findings digest for a session
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/SessionId
      responses:
        '200':
          description: Findings digest
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/findings.yaml#/components/schemas/FindingsDigest
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
  /v1/sessions/{id}/drafts/{slot_id}/versions:
    get:
      tags:
      - sessions
      operationId: listDraftVersions
      summary: Superseded coordinator draft bodies for one slot
      description: >-
        Bounded read of prior draft attempt snapshots for the specified
        coordinator draft slot.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/SessionId
      - $ref: ../../components/parameters.yaml#/components/parameters/DraftSlotId
      responses:
        '200':
          description: Prior draft attempt snapshots in version order
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/session/messages.yaml#/components/schemas/DraftVersionsResponse
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
  /v1/sessions/{id}/progress:
    get:
      tags:
      - sessions
      operationId: getSessionProgress
      summary: Coordinator progress digest for a session
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/SessionId
      responses:
        '200':
          description: Progress digest
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/progress.yaml#/components/schemas/ProgressDigest
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
  /v1/sessions/{id}/invocations:
    get:
      tags:
      - sessions
      operationId: listSessionInvocations
      summary: List durable invocation receipts for a session
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/SessionId
      - name: cursor
        in: query
        required: false
        description: Keyset pagination cursor
        schema:
          type: string
      - name: limit
        in: query
        required: false
        description: Maximum receipts to return
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      responses:
        '200':
          description: Invocation receipts in dispatch order
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/session/tool-results.yaml#/components/schemas/InvocationReceiptList
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
  /v1/sessions/{id}/program-receipts/{program_id}:
    get:
      tags: [sessions]
      operationId: getCommandProgramReceipt
      x-multi-stream-list: true
      summary: Inspect bounded program and host child receipts
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/SessionId
      - name: program_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: activity_id
        in: query
        description: Restrict execution receipts to a host activity, including all repetitions.
        schema: {type: string, format: uuid}
      - name: cursor
        in: query
        schema: {type: string}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Durable program facts and one bounded child page
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/session/command-programs.yaml#/components/schemas/CommandProgramReceiptPage
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
  /v1/sessions/{id}/program-receipt-document:
    get:
      tags: [sessions]
      operationId: getCommandReceiptDocument
      x-positional-window: true
      summary: Read a row window of a command receipt document
      description: >-
        The document is JSON Lines written by the host from durable program records. For each
        scope in order it holds one program row, then the scope's execution rows by ordinal, then
        the program's node rows by node id. Reads that name a revision answer
        chat_content_changed once the records behind it change.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/SessionId
      - $ref: ../../components/parameters.yaml#/components/parameters/CommandReceiptScopes
      - name: revision
        in: query
        description: Snapshot to read. Omit it to read the current snapshot.
        schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      - name: offset
        in: query
        description: Zero-based row to start at.
        schema: {type: integer, minimum: 0, default: 0}
      - name: limit
        in: query
        schema: {type: integer, minimum: 1, maximum: 500, default: 64}
      responses:
        '200':
          description: Rows from one snapshot of the receipt document
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/session/command-programs.yaml#/components/schemas/CommandReceiptDocumentPage
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
  /v1/sessions/{id}/program-receipt-document/search:
    get:
      tags: [sessions]
      operationId: searchCommandReceiptDocument
      summary: Search a command receipt document without reading its rows
      description: >-
        Each request scans a bounded number of rows, so a page may hold no matches and still
        carry next_cursor.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/SessionId
      - $ref: ../../components/parameters.yaml#/components/parameters/CommandReceiptScopes
      - name: revision
        in: query
        required: true
        schema: {type: string, pattern: '^[0-9a-f]{64}$'}
      - {name: q, in: query, required: true, schema: {type: string, minLength: 1, maxLength: 1024}}
      - {name: case_sensitive, in: query, schema: {type: boolean, default: false}}
      - {name: cursor, in: query, schema: {type: string}}
      - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500, default: 50}}
      responses:
        '200':
          description: Matches by row and rune column in the named snapshot
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/session/command-programs.yaml#/components/schemas/CommandReceiptSearchPage
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
  /v1/sessions/{id}/queue:
    get:
      tags:
      - sessions
      operationId: getSessionQueue
      summary: Editable next-turn queue for a session
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/SessionId
      responses:
        '200':
          description: Queue draft
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/queue.yaml#/components/schemas/QueueDraft
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
    patch:
      tags:
      - sessions
      operationId: updateSessionQueue
      x-person-action: record
      summary: Mutate the editable next-turn queue
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/SessionId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/queue.yaml#/components/schemas/QueueMutateRequest
      responses:
        '200':
          description: Updated queue draft
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/queue.yaml#/components/schemas/QueueDraft
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
