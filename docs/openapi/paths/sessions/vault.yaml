paths:
  /v1/sessions/{id}/vault:
    get:
      tags: [sessions]
      operationId: getChatVault
      summary: Whether a chat is unlocked for values a person stored
      description: >-
        A chat is unlocked when its person verified presence on an approval
        that sends values they stored. The unlock lasts until it goes unused
        for its idle period, reaches its ceiling, or the computer locks or
        sleeps. Unlocking never approves a recipient.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/SessionId
      responses:
        '200':
          description: The chat's unlock state
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/presence.yaml#/components/schemas/ChatVault
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
  /v1/sessions/{id}/vault/lock:
    post:
      tags: [sessions]
      operationId: lockChatVault
      x-person-action: record
      summary: Lock a chat's values a person stored
      description: Ends the chat's unlock now. Sends that need those values ask again.
      parameters:
      - $ref: ../../components/parameters.yaml#/components/parameters/SessionId
      responses:
        '200':
          description: The chat's unlock state after locking
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/presence.yaml#/components/schemas/ChatVault
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '404':
          $ref: ../../components/responses.yaml#/components/responses/NotFound
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
  /v1/vault/lock:
    post:
      tags: [sessions]
      operationId: lockVault
      x-person-action: none
      summary: Lock every chat when the person steps away
      description: >-
        The desktop shell calls this when the screen locks, the computer
        sleeps, or the app quits. Locking can only take authority away, so any
        authenticated caller may request it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../../components/schemas/presence.yaml#/components/schemas/LockVaultRequest
      responses:
        '200':
          description: How many chats were locked
          content:
            application/json:
              schema:
                $ref: ../../components/schemas/presence.yaml#/components/schemas/LockVaultResponse
        default:
          $ref: ../../components/responses.yaml#/components/responses/Error
        '400':
          $ref: ../../components/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ../../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../../components/responses.yaml#/components/responses/UnsupportedMediaType
        '413':
          $ref: ../../components/responses.yaml#/components/responses/ContentTooLarge
