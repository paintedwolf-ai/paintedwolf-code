paths:
  /v1/backup/capabilities:
    get:
      tags: [backup]
      operationId: getBackupCapabilities
      summary: Read archive format and transfer limits
      description: Available during normal operation and store recovery.
      responses:
        '200':
          description: Limits enforced by this engine
          content:
            application/json:
              schema:
                $ref: ../components/schemas/backup.yaml#/components/schemas/BackupCapabilities
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '503':
          $ref: ../components/responses.yaml#/components/responses/ServiceUnavailable
  /v1/backup:
    get:
      tags:
      - backup
      operationId: exportBackup
      summary: Download a local durable-install backup archive
      description: >-
        Streams a format-1 zip of the restorable durable config set plus a
        online SQLite snapshot of store.db and a manifest.json (replacement scope,
        size, and sha256 per file). Live-process and behavior-installing
        control-plane files, including MCP connections and extension setup,
        are excluded, as are managed credential stores. Conversation and retained
        project content is preserved without redaction and can contain secrets
        supplied by the user. A new device needs credentials and integrations
        configured again; an in-place restore preserves device credentials. Distinct from the scrubbed
        diagnostics bundle. Local only — nothing is uploaded.
      responses:
        '200':
          description: Zip archive
          headers:
            X-Backup-SHA256:
              description: SHA-256 of the complete compressed archive; native saves verify it before replacement.
              schema:
                type: string
                pattern: '^[0-9a-f]{64}$'
          content:
            application/zip:
              schema:
                type: string
                format: binary
        '409':
          description: Retained files could not be captured; retry after active changes finish.
          content:
            application/json:
              schema:
                $ref: ../components/schemas/common.yaml#/components/schemas/Error
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '503':
          $ref: ../components/responses.yaml#/components/responses/ServiceUnavailable
  /v1/backup/restore:
    post:
      tags:
      - backup
      operationId: restoreBackup
      x-person-action: record
      summary: Stage a backup archive for apply on next launch
      description: >-
        Applies compressed and expanded size limits, rejects unknown entries,
        validates the archive manifest and per-file sizes and sha256 hashes,
        and requires a known baseline with a registered upgrade path to this binary.
        An older supported store is upgraded in staging, then checked for schema,
        SQLite integrity, foreign keys, and retained object references. Imported
        retention policies are suspended until explicitly reviewed. Every affected
        live file is copied to a transaction-scoped .restore-recovery-<uuid>,
        present files are fsynced under .restore-staging-<uuid>, and explicit
        deletions are staged in an exclusively published restore.pending.json.
        A second stage is rejected while that marker exists. The live store is
        not swapped until the next launch preflights the complete staged read
        set and applies the marker before db.Open. The desktop client restarts
        its managed backend immediately after staging, before normal work can
        resume. Restore replaces; it never merges.
      requestBody:
        required: true
        content:
          application/zip:
            schema:
              type: string
              format: binary
              maxLength: 68719476736
              description: Compressed archive; its size bound is the backup archive limit.
      responses:
        '200':
          description: Restore staged; restart required
          content:
            application/json:
              schema:
                $ref: ../components/schemas/backup.yaml#/components/schemas/BackupRestoreResult
        '400':
          description: Invalid or corrupt archive
          content:
            application/json:
              schema:
                $ref: ../components/schemas/common.yaml#/components/schemas/Error
        '409':
          description: Archive schema does not match this app, or another restore already holds the pending marker
          content:
            application/json:
              schema:
                $ref: ../components/schemas/common.yaml#/components/schemas/Error
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '413':
          $ref: ../components/responses.yaml#/components/responses/Error
          description: Archive exceeds maximum allowed upload size
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../components/responses.yaml#/components/responses/ServiceUnavailable
  /v1/backup/restore/recovery-snapshot:
    post:
      tags:
      - backup
      operationId: restoreRecoverySnapshot
      x-person-action: record
      summary: Stage the latest compatible upgrade recovery snapshot
      description: >-
        Selects a self-contained snapshot directory in upgrade-recovery with a known
        schema baseline and upgrade route, validates its complete payload, and
        publishes the same restore transaction used by uploaded backups. Local
        recovery uses copy-on-write files where supported and does not inherit
        public ZIP upload limits. Recovery includes the store and retained files. The live store is not swapped until the next launch.
        Available on a healthy server and in recovery mode.
      responses:
        '200':
          description: Restore staged; restart required
          content:
            application/json:
              schema:
                $ref: ../components/schemas/backup.yaml#/components/schemas/BackupRestoreResult
        '409':
          description: Recovery snapshot missing, invalid, incompatible with this app, or another restore already holds
            the pending marker
          content:
            application/json:
              schema:
                $ref: ../components/schemas/common.yaml#/components/schemas/Error
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../components/responses.yaml#/components/responses/ServiceUnavailable
  /v1/store/reset:
    post:
      tags:
      - backup
      operationId: resetStore
      x-person-action: record
      summary: Stage a clean current store for apply on next launch
      description: >-
        Preserves the refused store, its SQLite sidecars, rolling snapshot,
        identity-coupled project/session files, rebuildable store projections,
        and the first-run onboarding latch in a transaction-scoped
        .restore-recovery-<uuid>. It then stages a freshly initialized current
        schema baseline and resets the onboarding latch for the next launch.
        Provider definitions, credentials, approvals, and other device
        configuration are not replaced. Available on a healthy server and in
        recovery mode. The desktop client requires explicit confirmation and
        restarts its managed backend immediately after staging.
      responses:
        '200':
          description: Fresh store staged; restart required
          content:
            application/json:
              schema:
                $ref: ../components/schemas/backup.yaml#/components/schemas/BackupRestoreResult
        '409':
          description: Another restore or reset already holds the pending marker
          content:
            application/json:
              schema:
                $ref: ../components/schemas/common.yaml#/components/schemas/Error
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '503':
          $ref: ../components/responses.yaml#/components/responses/ServiceUnavailable
