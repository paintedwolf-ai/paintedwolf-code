paths:
  /v1/projects/{id}/git/repos:
    get:
      tags:
      - git
      operationId: listGitRepos
      summary: Ordered repository set for a project
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Canonical project UUID.
      - name: session_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Optional session whose active root selects active_repo_id.
      responses:
        '200':
          description: Repository set with status summaries
          content:
            application/json:
              schema:
                $ref: ../components/schemas/git.yaml#/components/schemas/GitReposView
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
    post:
      tags:
      - git
      operationId: createGitRepo
      x-person-action: record
      summary: Initialize a new git repository in a named project root
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Canonical project UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/git.yaml#/components/schemas/GitInitRequest
      responses:
        '201':
          description: Initialized git repository
          content:
            application/json:
              schema:
                $ref: ../components/schemas/git.yaml#/components/schemas/GitRepoEntry
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
        '422':
          $ref: ../components/responses.yaml#/components/responses/UnprocessableContent

  /v1/projects/{id}/git/repos/{repo_id}/status:
    get:
      tags:
      - git
      operationId: getGitStatus
      summary: Working-tree status for the Den Git tab
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Canonical project UUID.
      - name: repo_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
        description: Repository to report status for.
      - name: session_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Optional session whose checkout supplies the status.
      responses:
        '200':
          description: Git status snapshot
          content:
            application/json:
              schema:
                $ref: ../components/schemas/git.yaml#/components/schemas/GitStatusSummary
        '202':
          description: First status generation is refreshing off the request path
          content:
            application/json:
              schema:
                $ref: ../components/schemas/git.yaml#/components/schemas/GitStatusSummary
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict

  /v1/projects/{id}/git/repos/{repo_id}/changes:
    get:
      tags:
      - git
      operationId: listGitChanges
      summary: Page changed paths from a cached status revision
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Canonical project UUID.
      - name: repo_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
        description: Repository to page changes for.
      - name: session_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Optional session whose checkout supplies the changes.
      - name: revision
        in: query
        required: false
        schema:
          type: integer
          format: uint64
      - name: cursor
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 200
      responses:
        '200':
          description: Changed path page from the newest available generation
          content:
            application/json:
              schema:
                $ref: ../components/schemas/git.yaml#/components/schemas/GitChangesPage
        '202':
          description: First status generation is refreshing
          content:
            application/json:
              schema:
                $ref: ../components/schemas/git.yaml#/components/schemas/GitChangesPage
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict

  /v1/projects/{id}/git/repos/{repo_id}/branches:
    get:
      tags:
      - git
      operationId: listGitBranches
      summary: List local branches for the Git tab picker
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Canonical project UUID.
      - name: repo_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
        description: Repository to list branches for.
      - name: session_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Optional session whose checkout scopes the repository.
      responses:
        '200':
          description: Local branches
          content:
            application/json:
              schema:
                $ref: ../components/schemas/git.yaml#/components/schemas/GitBranchesView
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict

  /v1/projects/{id}/git/repos/{repo_id}/checkout:
    post:
      tags:
      - git
      operationId: checkoutGit
      x-person-action: record
      summary: Switch to a branch (optionally creating it first)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Canonical project UUID.
      - name: repo_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
        description: Repository to act on.
      - name: session_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Optional session whose checkout scopes the operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/git.yaml#/components/schemas/GitCheckoutRequest
      responses:
        '200':
          description: Fresh git status after checkout
          content:
            application/json:
              schema:
                $ref: ../components/schemas/git.yaml#/components/schemas/GitMutationResult
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
        '422':
          $ref: ../components/responses.yaml#/components/responses/UnprocessableContent

  /v1/projects/{id}/git/repos/{repo_id}/discard:
    post:
      tags:
      - git
      operationId: discardGit
      x-person-action: record
      summary: Revert the working tree to a clean state
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Canonical project UUID.
      - name: repo_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
        description: Repository to act on.
      - name: session_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Optional session whose checkout scopes the operation.
      responses:
        '200':
          description: Fresh git status after discard
          content:
            application/json:
              schema:
                $ref: ../components/schemas/git.yaml#/components/schemas/GitMutationResult
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
        '422':
          $ref: ../components/responses.yaml#/components/responses/UnprocessableContent

  /v1/projects/{id}/git/repos/{repo_id}/push:
    post:
      tags:
      - git
      operationId: pushGit
      x-person-action: record
      summary: Publish the current branch to its upstream
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Canonical project UUID.
      - name: repo_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
        description: Repository to act on.
      - name: session_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Optional session whose checkout scopes the operation.
      responses:
        '200':
          description: Fresh git status after push
          content:
            application/json:
              schema:
                $ref: ../components/schemas/git.yaml#/components/schemas/GitMutationResult
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
        '422':
          $ref: ../components/responses.yaml#/components/responses/UnprocessableContent

  /v1/projects/{id}/git/repos/{repo_id}/pull:
    post:
      tags:
      - git
      operationId: pullGit
      x-person-action: record
      summary: Fast-forward the current branch from its upstream
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Canonical project UUID.
      - name: repo_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
        description: Repository to act on.
      - name: session_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Optional session whose checkout scopes the operation.
      responses:
        '200':
          description: Fresh git status after pull
          content:
            application/json:
              schema:
                $ref: ../components/schemas/git.yaml#/components/schemas/GitMutationResult
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
        '422':
          $ref: ../components/responses.yaml#/components/responses/UnprocessableContent

  /v1/projects/{id}/git/repos/{repo_id}/commit:
    post:
      tags:
      - git
      operationId: commitGit
      x-person-action: record
      summary: Stage and commit working-tree changes
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Canonical project UUID.
      - name: repo_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
        description: Repository to act on.
      - name: session_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Optional session whose checkout scopes the operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/git.yaml#/components/schemas/GitCommitRequest
      responses:
        '200':
          description: Fresh git status after the commit
          content:
            application/json:
              schema:
                $ref: ../components/schemas/git.yaml#/components/schemas/GitMutationResult
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
        '422':
          $ref: ../components/responses.yaml#/components/responses/UnprocessableContent

  /v1/projects/{id}/git/repos/{repo_id}/stash:
    post:
      tags:
      - git
      operationId: stashGit
      x-person-action: record
      summary: Stash working-tree changes (including untracked files)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Canonical project UUID.
      - name: repo_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
        description: Repository to act on.
      - name: session_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Optional session whose checkout scopes the operation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/git.yaml#/components/schemas/GitStashRequest
      responses:
        '200':
          description: Fresh git status after the stash
          content:
            application/json:
              schema:
                $ref: ../components/schemas/git.yaml#/components/schemas/GitMutationResult
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
        '422':
          $ref: ../components/responses.yaml#/components/responses/UnprocessableContent

  /v1/projects/{id}/git/repos/{repo_id}/commit-message:
    post:
      tags:
      - git
      operationId: draftGitCommitMessage
      x-person-action: none
      summary: Draft a commit message from the current diff via the lite model
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Canonical project UUID.
      - name: repo_id
        in: path
        required: true
        schema:
          type: string
          pattern: '^[a-zA-Z0-9_-]+$'
        description: Repository to act on.
      - name: session_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
        description: Optional session whose checkout scopes the operation.
      responses:
        '200':
          description: Drafted commit message
          content:
            application/json:
              schema:
                $ref: ../components/schemas/git.yaml#/components/schemas/GitCommitMessageResponse
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
        '422':
          $ref: ../components/responses.yaml#/components/responses/UnprocessableContent
        '503':
          $ref: ../components/responses.yaml#/components/responses/ServiceUnavailable

  /v1/sessions/{id}/git-worktree:
    get:
      tags:
      - git
      operationId: getGitWorktree
      summary: View a chat's worktree binding
      description: >
        Returns the worktree binding for a chat. An unbound chat returns bound
        false with zero counts. A missing worktree directory returns state stale
        without probing the path.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Canonical session UUID.
      responses:
        '200':
          description: Worktree view
          content:
            application/json:
              schema:
                $ref: ../components/schemas/git.yaml#/components/schemas/GitWorktreeView
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
    put:
      tags:
      - git
      operationId: bindGitWorktree
      x-person-action: record
      summary: Create a worktree for a chat
      description: >
        Creates a separate checkout of one project repository on a new branch,
        outside the project folder. Refuses when the chat is busy, already bound,
        the branch exists, the repository HEAD is detached, or the target directory
        exists. The repository's shared git config is proven unchanged.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Canonical session UUID.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/git.yaml#/components/schemas/GitWorktreeBindRequest
      responses:
        '200':
          description: Bound worktree view
          content:
            application/json:
              schema:
                $ref: ../components/schemas/git.yaml#/components/schemas/GitWorktreeView
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
    delete:
      tags:
      - git
      operationId: deleteGitWorktree
      x-person-action: record
      summary: Remove a chat's worktree checkout
      description: >
        Removes the separate checkout and deletes the binding row. The branch and
        its commits are kept. A dirty worktree is refused. A missing worktree
        directory is always removable — that is the repair for a stale binding.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Canonical session UUID.
      responses:
        '204':
          description: Worktree removed
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict

  /v1/sessions/{id}/git-worktree/land:
    post:
      tags:
      - git
      operationId: landGitWorktree
      x-person-action: record
      summary: Merge a chat's branch into its base branch
      description: >
        Merges the session branch into the recorded base branch in the project
        folder with an explicit merge commit. Runs only when the chat is idle,
        both trees are clean, and the project folder is on the base branch. A
        conflicting merge is aborted; nothing is left half-applied. Landing does
        not unbind.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
        description: Canonical session UUID.
      responses:
        '200':
          description: Land result (including nothing_to_land)
          content:
            application/json:
              schema:
                $ref: ../components/schemas/git.yaml#/components/schemas/GitWorktreeLandResult
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
