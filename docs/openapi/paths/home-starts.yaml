paths:
  /v1/home-starts/capabilities:
    get:
      tags:
      - home-starts
      operationId: getHomeStartCapabilities
      summary: Read the Home start protocol and host binding
      responses:
        '200':
          description: Protocol version, store identity and acting person
          content:
            application/json:
              schema:
                $ref: ../components/schemas/home-starts.yaml#/components/schemas/HomeStartCapabilities
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
  /v1/home-starts/{launch_id}:
    put:
      tags:
      - home-starts
      operationId: reserveHomeStart
      x-person-action: record
      summary: Reserve or resume a Home submission
      description: >
        Reserves the project, chat and first-prompt operation for a client launch
        id, then creates them in the background. A matching repeat returns the
        latest state and resumes unfinished work; different choices under the same
        id conflict.
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/LaunchId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/home-starts.yaml#/components/schemas/ReserveHomeStartRequest
      responses:
        '202':
          description: The durable reservation and its current phase
          content:
            application/json:
              schema:
                $ref: ../components/schemas/home-starts.yaml#/components/schemas/HomeStart
        '503':
          description: Provider discovery failed while validating the model choice
          content:
            application/json:
              schema:
                $ref: ../components/schemas/common.yaml#/components/schemas/Error
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
    get:
      tags:
      - home-starts
      operationId: getHomeStart
      summary: Read a Home submission
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/LaunchId
      responses:
        '200':
          description: The caller's Home start
          content:
            application/json:
              schema:
                $ref: ../components/schemas/home-starts.yaml#/components/schemas/HomeStart
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
  /v1/home-starts/{launch_id}/stop:
    post:
      tags:
      - home-starts
      operationId: stopHomeStart
      x-person-action: record
      summary: Stop a Home submission
      description: >
        Before first-prompt admission, fences the start so it admits no prompt;
        a Stop that precedes its PUT reserves a stopped launch. After admission,
        stops only that first turn while it is still the chat's latest.
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/LaunchId
      responses:
        '200':
          description: The Home start after the stop
          content:
            application/json:
              schema:
                $ref: ../components/schemas/home-starts.yaml#/components/schemas/HomeStart
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
  /v1/home-starts/{launch_id}/reissue-first-prompt:
    post:
      tags:
      - home-starts
      operationId: reissueHomeStartFirstPrompt
      x-person-action: record
      summary: Reissue an unadmitted first prompt under a fresh operation
      description: >
        Retires the named first-prompt operation and binds a fresh one to the same
        chat, unless the old one was already admitted. A repeat with the same ids
        returns the recorded outcome.
      parameters:
      - $ref: ../components/parameters.yaml#/components/parameters/LaunchId
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../components/schemas/home-starts.yaml#/components/schemas/ReissueHomeStartFirstPromptRequest
      responses:
        '200':
          description: The Home start bound to the replacement operation
          content:
            application/json:
              schema:
                $ref: ../components/schemas/home-starts.yaml#/components/schemas/HomeStart
        default:
          $ref: ../components/responses.yaml#/components/responses/Error
        '400':
          $ref: ../components/responses.yaml#/components/responses/BadRequest
        '401':
          $ref: ../components/responses.yaml#/components/responses/Unauthorized
        '404':
          $ref: ../components/responses.yaml#/components/responses/NotFound
        '409':
          $ref: ../components/responses.yaml#/components/responses/Conflict
        '415':
          $ref: ../components/responses.yaml#/components/responses/UnsupportedMediaType
        '429':
          $ref: ../components/responses.yaml#/components/responses/TooManyRequests
        '413':
          $ref: ../components/responses.yaml#/components/responses/ContentTooLarge
