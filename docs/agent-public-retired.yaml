  - id: surface_note
    kind: tool_name
    summary: Mid-turn note tool. Updates are now assistant text with inline citations, under the paintedwolf.markdown_note content contract; wait is not its successor.
    date: 2026-11-03
  - id: SURFACE_NOTE_UNGROUNDED
    kind: hint_code
    summary: Rejected an uncited surface_note. Successor MID_TURN_NOTE_UNGROUNDED withholds uncited text and lets tools run.
    date: 2026-11-03
  - id: SURFACE_NOTE_HANDLE_UNGROUND
    kind: hint_code
    summary: Rejected an unresolved surface_note reference. Successor MID_TURN_NOTE_HANDLE_UNGROUND.
    date: 2026-11-03
  - id: SURFACE_NOTE_URL_ONLY_UNGROUND
    kind: hint_code
    summary: Rejected a surface_note citing only unobserved URLs. Successor MID_TURN_NOTE_URL_ONLY_UNGROUND.
