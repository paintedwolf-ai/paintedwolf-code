    dir: '{{.GO_DIR}}'
    cmds:
      - go run ./cmd/lycaon extensions {{.CLI_ARGS}}

  extensions:validate:
    desc: Resolve + print packs, units, and diagnostics (exit 1 when any diagnostic is error severity). Pass --project DIR after --
    dir: '{{.GO_DIR}}'
    cmds:
      - go run ./cmd/lycaon extensions validate {{.CLI_ARGS}}

  test:lycaon-rules:
    desc: Verify the shipping OpenGrep rules against the complete language corpus
    cmds:
      - bash {{.SCRIPTS_DIR}}/test-lycaon-rules.sh {{.CLI_ARGS}}

  scan:opengrep:stage:
    desc: 'Download or reuse the verified, pinned OpenGrep release for this host'
    cmds:
      - bash {{.SCRIPTS_DIR}}/resolve-opengrep.sh {{.CLI_ARGS}}

  scan:opengrep:select:
    desc: 'Authenticate and select an engine release: -- --tag TAG --expected-commit SHA <release.json path or HTTPS URL>'
    cmds:
      - bash {{.SCRIPTS_DIR}}/select-opengrep-release.sh {{.CLI_ARGS}}

  test:scanners:
    desc: 'Bundled-scanner suite against the committed corpus — a missing engine fails rather than skips'
    cmds:
      - |
        bash {{.SCRIPTS_DIR}}/with-bundled-scanners.sh -- \
          bash {{.SCRIPTS_DIR}}/go-test-digest.sh --full --tags integration --name test:scanners -- \
          ./internal/scan/... ./test/security/... \
          -run '^(TestAPIScanMaintainedSASTE2E|TestAPIScanBundledScannerFindingsE2E|TestAPIScanPackBundledFindingsE2E|TestAPIScanPackMatchesPerCategoryAPIRuns|TestAPIScanPackNativeQueryE2E|TestAPIScanServePathSASTE2E|TestAPIScanRetainsTargetFailureAlongsideUsableFindings|TestIngesterBundledSASTProducesGuidance|TestOpenGrepBundledAdapterFixture|TestOpenGrepUsesAbsoluteRuleConfigsFromProjectWorkingDirectory|TestOpenGrepEmbeddedSourceRecovery)$'

  check-fast:
    desc: Handoff gate on one stable source snapshot
    cmds:
      - bash {{.SCRIPTS_DIR}}/test-source-snapshot.sh run -- ./task check-fast:workspace

  check-fast:workspace:
    desc: Sequential handoff stages with bounded workers
    cmds:
      - test -n "${PW_SOURCE_SNAPSHOT_COMMIT:-}"
      - python3 {{.SCRIPTS_DIR}}/test-execution.py plan -- check-fast

  check:tests:
    desc: Complete runtime test legs in sequence
    internal: true
    cmds:
      - python3 {{.SCRIPTS_DIR}}/test-execution.py plan -- check:tests

  docs:links:
    desc: Validate relative markdown links and heading anchors under docs/
    cmds:
      - bash {{.SCRIPTS_DIR}}/doc-link-check.sh

  check:drift:
    desc: Codegen, OpenAPI bundle, and sqlc drift guards (full check only)
    internal: true
    cmds:
      - python3 {{.SCRIPTS_DIR}}/test-execution.py plan -- check:drift

  check:
    desc: Complete ship gate on one stable source snapshot
    cmds:
      - bash {{.SCRIPTS_DIR}}/test-source-snapshot.sh run -- ./task check:workspace

  check:workspace:
    desc: Complete build, drift, test, and lint gate
    cmds:
      - test -n "${PW_SOURCE_SNAPSHOT_COMMIT:-}"
      - python3 {{.SCRIPTS_DIR}}/test-execution.py plan -- check
