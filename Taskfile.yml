    preconditions:
      - sh: command -v curl && command -v jq && command -v sqlite3 && command -v node
        msg: curl, jq, sqlite3, and node required for upgrade corpus seed
    cmds:
      - bash {{.SCRIPTS_DIR}}/upgrade-corpus-seed.sh {{.CLI_ARGS}}

