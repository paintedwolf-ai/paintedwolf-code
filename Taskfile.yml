version: '3'

vars:
  GO_DIR: lycaon
  SCRIPTS_DIR: '{{.ROOT_DIR}}/scripts'
  BIN_DIR:
    sh: python3 {{.SCRIPTS_DIR}}/artifact_paths.py bin {{.ROOT_DIR}}
  BUILD_DIR:
    sh: python3 {{.SCRIPTS_DIR}}/artifact_paths.py build {{.ROOT_DIR}}
  ARTIFACT_DIR:
    sh: python3 {{.SCRIPTS_DIR}}/artifact_paths.py artifacts {{.ROOT_DIR}}

tasks:
  default:
    desc: Fast local checks (handoff default)
    cmds:
      - task: check-fast

  setup-dev:
    desc: One-time complete dev setup — toolchains, dependencies, pinned tools, bundled runtimes
    cmds:
      - bash {{.SCRIPTS_DIR}}/setup-dev.sh {{.CLI_ARGS}}

  licenses:notices:
    desc: Generate THIRD-PARTY-NOTICES.md (Go + Den npm + Tauri crates + bundled binaries); fail-closed on unknown licenses
    preconditions:
      - sh: command -v bun
        msg: bun required — install from https://bun.sh
      - sh: command -v go
        msg: Go required — see lycaon/go.mod
      - sh: command -v cargo
        msg: cargo required — install Rust from https://rustup.rs
      - sh: test -d lycaon-den/node_modules
        msg: lycaon-den/node_modules missing — run bun install in lycaon-den
    cmds:
      - bash {{.SCRIPTS_DIR}}/licenses-notices.sh

  comments:lint:
    desc: Scan repository source comments
    internal: true
    dir: scripts/commentlint
    cmds:
      - go run . --root ../.. --config .commentlint.json {{.CLI_ARGS}}

  comments:test:
    desc: Test the source comment scanner
    internal: true
    dir: scripts/commentlint
    cmds:
      - go test ./...

  comments:check:
    desc: Test the source comment scanner and scan the repository
    cmds:
      - task: comments:test
      - task: comments:lint

  dev:signing-identity:
    desc: 'macOS — provision the stable self-signed identity dev builds are signed with (`-- --remove` to undo)'
    cmds:
      - bash {{.SCRIPTS_DIR}}/dev-signing-identity.sh {{.CLI_ARGS}}

  build:
    desc: Compile all Go packages in lycaon/
    dir: '{{.GO_DIR}}'
    sources:
      - '**/*.go'
      - 'internal/harnessfixture/contract.json'
      - 'internal/db/*.sql'
      - 'internal/db/released-baselines.json'
      - 'internal/backup/archive-limits.json'
      - go.mod
      - go.sum
    cmds:
      - bash {{.SCRIPTS_DIR}}/repo-snapshot-lock.sh read -- go build -tags=paintedwolf_release ./...

  build:cross:
    desc: Cross-compile smoke for GOOS=windows — guards platform-tagged files CI's linux runner never builds
    dir: '{{.GO_DIR}}'
    sources:
      - '**/*.go'
      - 'internal/harnessfixture/contract.json'
      - 'internal/db/*.sql'
      - 'internal/db/released-baselines.json'
      - 'internal/backup/archive-limits.json'
      - go.mod
      - go.sum
    env:
      GOOS: windows
      GOARCH: amd64
    cmds:
      - bash {{.SCRIPTS_DIR}}/repo-snapshot-lock.sh read -- go build -tags=paintedwolf_release ./...

  build:lycaon-dev:
    desc: Build lycaon-dev + sibling pw-logs, bialy, and pw-document-core — local den:sidecar + stable @self MCP (not go run)
    dir: '{{.GO_DIR}}'
    sources:
      - '**/*.go'
      - 'internal/harnessfixture/contract.json'
      - 'internal/documentcore/native/src/**/*.rs'
      - internal/documentcore/native/Cargo.toml
      - internal/documentcore/native/Cargo.lock
      - '../scripts/build-document-core.sh'
      - 'internal/db/*.sql'
      - 'internal/db/released-baselines.json'
      - 'internal/backup/archive-limits.json'
      - 'config/**/*'
      - go.mod
      - go.sum
      - '../VERSION'
      - '../scripts/sign-dev-binary.sh'
      - '../scripts/dev-signing-config.sh'
      - '../scripts/build-dev-engine.sh'
      - '../scripts/resolve-opengrep.sh'
      - '../scripts/stage-bundled-opengrep.sh'
    generates:
      - '{{.BUILD_DIR}}/lycaon-dev'
      - '{{.BUILD_DIR}}/pw-logs'
      - '{{.BUILD_DIR}}/pw-document-core'
    status:
      - env -u LYCAON_OPENGREP_CANDIDATE '{{.BUILD_DIR}}/lycaon-dev' scan engines verify-bundled --root {{.ROOT_DIR}}/lycaon-den/src-tauri/engine-root >/dev/null
    cmds:
      - bash {{.SCRIPTS_DIR}}/build-dev-engine.sh

  build:decide:
    desc: Build the decision engine sidecar (bialy) into the build directory
    sources:
      - 'lycaon/internal/decide/native/src/**/*.rs'
      - lycaon/internal/decide/native/Cargo.toml
      - lycaon/internal/decide/native/Cargo.lock
      - scripts/build-decide.sh
    generates:
      - '{{.BUILD_DIR}}/bialy'
    preconditions:
      - sh: command -v cargo
        msg: cargo required — install rustup from https://rustup.rs; rust-toolchain.toml selects the version
    cmds:
      - bash {{.SCRIPTS_DIR}}/build-decide.sh

  build:document-core:
    desc: Build the native document core (pw-document-core) for this host and print its path
    preconditions:
      - sh: command -v cargo
        msg: cargo required — install rustup from https://rustup.rs; rust-toolchain.toml selects the version
    cmds:
      - bash {{.SCRIPTS_DIR}}/build-document-core.sh

  browser:ensure:
    desc: Provision pinned chrome-headless-shell into the development browser cache (download-once)
    deps:
      - build:lycaon-dev
    env:
      # The development channel shares the managed browser cache.
      LYCAON_DEV: '1'
    cmds:
      - '{{.BUILD_DIR}}/lycaon-dev browser ensure'

  gitengine:fetch:
    desc: Download and SHA-256-verify the pinned dugite-native git toolchain into engine-root/gitengine
    sources:
      - lycaon/config/gitengine/pin.yaml
      - '{{.SCRIPTS_DIR}}/gitengine-fetch.sh'
    generates:
      - lycaon-den/src-tauri/engine-root/gitengine/VERSION
    cmds:
      - bash {{.SCRIPTS_DIR}}/gitengine-fetch.sh

  lint:fast:
    desc: Go vet + fast golangci-lint
    dir: '{{.GO_DIR}}'
    sources:
      - '**/*.go'
      - .golangci.yml
      - .deadcode-exclude
      - '{{.SCRIPTS_DIR}}/lint-go.sh'
      - '{{.SCRIPTS_DIR}}/deadcode-check.sh'
    cmds:
      - bash {{.SCRIPTS_DIR}}/lint-go.sh fast {{.CLI_ARGS}}

  lint:full:
    desc: Go vet + full golangci-lint + deadcode
    dir: '{{.GO_DIR}}'
    sources:
      - '**/*.go'
      - .golangci.yml
      - '{{.SCRIPTS_DIR}}/lint-go.sh'
      - '{{.SCRIPTS_DIR}}/deadcode-check.sh'
    cmds:
      - bash {{.SCRIPTS_DIR}}/lint-go.sh full {{.CLI_ARGS}}

  lint:vuln:
    desc: Offline govulncheck symbol scan against the vendored database (required in check; allowlist in lycaon/govulncheck-allowlist.yaml)
    dir: '{{.GO_DIR}}'
    # The database is vendored so one source produces one verdict; freshness is
    # lint:vuln:fresh, which runs where the network is available.
    cmds:
      - bash {{.SCRIPTS_DIR}}/lint-vuln.sh

  lint:vuln:vendor:
    desc: Re-materialize the pinned Go vulnerability database, pruned to this module's dependencies
    cmds:
      - python3 {{.SCRIPTS_DIR}}/vendor-vulndb.py

  lint:vuln:vendor:check:
    desc: Offline — verify the vendored vulnerability database against its pin and this module's dependencies
    sources:
      - lycaon/vulndb/**/*
      - lycaon/vulndb-provenance.json
      - lycaon/go.mod
      - lycaon/go.sum
      - scripts/vendor-vulndb.py
    cmds:
      - python3 {{.SCRIPTS_DIR}}/vendor-vulndb.py --check

  lint:vuln:fresh:
    desc: Scheduled — govulncheck against the live upstream database, to catch disclosures made since the pin
    dir: '{{.GO_DIR}}'
    env:
      LYCAON_VULNDB: https://vuln.go.dev
    cmds:
      - bash {{.SCRIPTS_DIR}}/lint-vuln.sh

  test:race:
    desc: Go race detector with full integration scenarios (excludes test/security); release gate
    cmds:
      - python3 {{.SCRIPTS_DIR}}/test-execution.py plan -- test:race -- {{.CLI_ARGS}}

  perf:bench:
    desc: 'Run all Go microbenchmarks repeatedly; PERF_BENCH_BASELINE=/path compares reports'
    cmds:
      - bash {{.SCRIPTS_DIR}}/go-bench.sh {{.CLI_ARGS}}

  perf:sidecar:
    desc: 'Release-sidecar workload: boot, project, task, prompt, source, concurrency, resources, and correctness'
    dir: '{{.GO_DIR}}'
    cmds:
      - mkdir -p '{{.BUILD_DIR}}' '{{.ARTIFACT_DIR}}/perf'
      - >-
        go build -tags=paintedwolf_release,paintedwolf_performance
        -ldflags="-X github.com/lycaon/lycaon/internal/version.Version=$(tr -d '[:space:]' < ../VERSION)"
        -o '{{.BUILD_DIR}}/lycaon-perf-sidecar' ./cmd/lycaon
      - >-
        go run ./cmd/lycaon-perf
        --binary '{{.BUILD_DIR}}/lycaon-perf-sidecar'
        --output '{{.ARTIFACT_DIR}}/perf/sidecar.json'
        --scale medium --enforce {{.CLI_ARGS}}

  perf:soak:
    desc: 'Long sidecar stability run; SOAK defaults to 30m and may be overridden'
    dir: '{{.GO_DIR}}'
    vars:
      SOAK: '{{default "30m" .SOAK}}'
    cmds:
      - mkdir -p '{{.BUILD_DIR}}' '{{.ARTIFACT_DIR}}/perf'
      - >-
        go build -tags=paintedwolf_release,paintedwolf_performance
        -ldflags="-X github.com/lycaon/lycaon/internal/version.Version=$(tr -d '[:space:]' < ../VERSION)"
        -o '{{.BUILD_DIR}}/lycaon-perf-sidecar' ./cmd/lycaon
      - >-
        go run ./cmd/lycaon-perf
        --binary '{{.BUILD_DIR}}/lycaon-perf-sidecar'
        --output '{{.ARTIFACT_DIR}}/perf/sidecar-soak.json'
        --scale medium --iterations 5 --prompts 2 --soak {{.SOAK}} --enforce {{.CLI_ARGS}}

  budgets:
    desc: 'Prompt and code size budgets for what the change touches; PW_BUDGETS_INSPECT="<path>" shows a path''s standing'
    cmds:
      - python3 {{.SCRIPTS_DIR}}/budgets.py

  coverage:changes:
    desc: Go statements the change adds or modifies must be tested (floors in scripts/coverage-policy.json)
    cmds:
      - python3 {{.SCRIPTS_DIR}}/coverage_changes.py go

  check:coverage:
    desc: Minimum statement coverage on internal/* (default 62%% floor)
    sources:
      - 'lycaon/**/*.go'
      - '{{.SCRIPTS_DIR}}/coverage-check.sh'
      - '{{.SCRIPTS_DIR}}/coverage-packages.sh'
      - '{{.SCRIPTS_DIR}}/coverage_policy.py'
      - '{{.SCRIPTS_DIR}}/go-test-digest.sh'
      - '{{.SCRIPTS_DIR}}/test-digest.py'
      - '{{.SCRIPTS_DIR}}/verification_timings.py'
      - 'lycaon/coverage-exempt.txt'
    cmds:
      - bash {{.SCRIPTS_DIR}}/coverage-check.sh

  check:coverage:packages:
    desc: 'Per-package coverage report for internal/* (advisory; COVERAGE_PKG_ENFORCE=1 to gate)'
    sources:
      - 'lycaon/**/*.go'
      - 'lycaon/coverage-exempt.txt'
      - '{{.SCRIPTS_DIR}}/coverage-packages.sh'
      - '{{.SCRIPTS_DIR}}/coverage_policy.py'
      - '{{.SCRIPTS_DIR}}/go-test-digest.sh'
      - '{{.SCRIPTS_DIR}}/test-digest.py'
      - '{{.SCRIPTS_DIR}}/verification_timings.py'
    cmds:
      - bash {{.SCRIPTS_DIR}}/coverage-packages.sh

  test:short:
    desc: Go unit and component tests with -short (excludes contract, external integration, wiring, smoke, and HTTP journey tiers); failures condensed via digest
    cmds:
      - python3 {{.SCRIPTS_DIR}}/test-execution.py plan -- test:short -- {{.CLI_ARGS}}

  test:pause:
    desc: Pause admission of local verification runs across checkouts
    cmds:
      - python3 {{.SCRIPTS_DIR}}/test-execution.py pause {{.CLI_ARGS}}

  test:resume:
    desc: Resume queued local verification runs
    cmds:
      - python3 {{.SCRIPTS_DIR}}/test-execution.py resume

  test:status:
    desc: Show the shared verification queue, advisories, and active worker budget
    cmds:
      - python3 {{.SCRIPTS_DIR}}/test-execution.py status

  test:cancel:
    desc: 'Withdraw one queued or running request: `-- <ticket> --reason "<why>" [--force]`'
    cmds:
      - python3 {{.SCRIPTS_DIR}}/test-execution.py cancel -- {{.CLI_ARGS}}

  test:runner:
    desc: Verify execution scheduling, cancellation, and worker limits
    cmds:
      - python3 -m unittest discover -s scripts -p 'test_*execution.py'

  test:stress:
    desc: Large database, source-tree, Git operation, attribution, and working-year storage fixtures
    cmds:
      - python3 {{.SCRIPTS_DIR}}/test-execution.py plan -- test:stress -- {{.CLI_ARGS}}

  test:wiring:
    desc: Integration harness tests (test/wiring); included in test:full and test:race, excluded from test:short
    cmds:
      - python3 {{.SCRIPTS_DIR}}/test-execution.py plan -- test:wiring -- {{.CLI_ARGS}}

  test:integration:
    desc: Assembled Go component tests and randomized SQLite lifecycle properties
    cmds:
      - python3 {{.SCRIPTS_DIR}}/test-execution.py plan -- test:integration -- {{.CLI_ARGS}}

  test:full:
    desc: Full Go behavior and required bundled scanner tests (mock LLM)
    cmds:
      - python3 {{.SCRIPTS_DIR}}/test-execution.py plan -- test:full -- {{.CLI_ARGS}}

  test:live-scanners:
    desc: 'Catalog scanner rows against the real installed CLIs — runs whichever binaries are on PATH, skips the rest. Never in a blocking gate; the only check that catches a row whose argv the tool no longer accepts.'
    cmds:
      - bash {{.SCRIPTS_DIR}}/go-test-digest.sh --full --tags live_scanners --name test:live-scanners -- ./internal/scan/drivers/external/ -run TestCatalogScannerLive

  test:contract:
    desc: Repository contracts (wire, generated artifacts, catalogs, and architectural seams)
    cmds:
      - python3 {{.SCRIPTS_DIR}}/test-execution.py plan -- test:contract -- {{.CLI_ARGS}}

  # Confinement and gated integration tests use separate filters.
  test:seatbelt:
    desc: 'Applied Seatbelt + Available()-gated confinement (--full, darwin)'
    cmds:
      - bash {{.SCRIPTS_DIR}}/go-test-digest.sh --full --name test:seatbelt-confine -- ./internal/confine/...
      # The scope contract derives this applied-confinement inventory.
      - bash {{.SCRIPTS_DIR}}/go-test-digest.sh --full --name test:seatbelt-gated -- ./test/contract/... ./internal/mcp/... ./internal/scan/... ./internal/hitl/... ./internal/exec/... ./internal/webresearch/... ./internal/tools/... -run '^(TestConfinementIntegrityCompositeChain|TestConfinementIntegrityConfigTokenUnreadable|TestConfinementIntegrityForeignVarFoldersWriteDenied|TestConfinementIntegrityLauncherUntamperable|TestConfinementIntegrityNoProfileStagingFile|TestNonHTTPContractContainedDerivesFromSameRequestAsProfile|TestNonHTTPContractProxyStartupFailureDeniesAndRollsBack|TestPrepareStdioCommandConfinedWhenAvailable|TestPrepareStdioCommandHandsTheServerNoCredential|TestPrepareStdioCommandRequiresRootsWhenAvailable|TestBundledScannerConfinementDeniesNetwork|TestExternalScannerWritesProjectTree|TestContainedCarriesDirectIPNarrowing|TestContainedProvenanceMatchesDefaultConfinement|TestContainedTaskOverlayStaysOutOfRoots|TestContainedWriteRootsCarryDurableGrants|TestExternalScannerLaunchIsValidWhileEnforcing|TestWebToolsUnaffectedByCommandProxyOnlyDefault|TestOpenGrepBundledAdapterFixture|TestIngesterBundledSASTProducesGuidance|TestOpenGrepUsesAbsoluteRuleConfigsFromProjectWorkingDirectory|TestOpenGrepEmbeddedSourceRecovery|TestExecutionCapabilityAsksBeforeSpawnAndConsumesOnce)$'
      - |
        bash {{.SCRIPTS_DIR}}/with-bundled-scanners.sh -- \
          bash {{.SCRIPTS_DIR}}/go-test-digest.sh --full --tags scanstress --name test:seatbelt-scanstress -- ./test/scanstress/...

  test:fuzz:
    desc: 'Run Go native fuzz targets briefly (FUZZTIME=20s default; e.g. task test:fuzz -- ./internal/parse/...)'
    dir: '{{.GO_DIR}}'
    cmds:
      - bash {{.SCRIPTS_DIR}}/fuzz-short.sh {{.CLI_ARGS | default "./..."}}

  test:failed:
    desc: Replay the latest failed Go run with its source, flags, and test environment
    cmds:
      - bash {{.SCRIPTS_DIR}}/go-test-failed.sh

  test:fail-messages:
    desc: Rewrite bare t.Fatal(err) → testutil.FailErr with inferred step labels
    cmds:
      - python3 {{.SCRIPTS_DIR}}/rewrite-fail-messages.py

  test:fail-messages:check:
    desc: CI guard — fail if any bare t.Fatal(err) patterns remain in test files
    cmds:
      - python3 {{.SCRIPTS_DIR}}/rewrite-fail-messages.py --check

  check:digest:
    desc: 'Lighter summarized pass (build + lint:fast + Go + Den + harness canary); not the ship gate. FULL=1 for full Go tests'
    cmds:
      - bash {{.SCRIPTS_DIR}}/check-summary.sh

  test:digest:
    desc: 'Go tests only, condensed to a failure digest (e.g. task test:digest -- ./internal/workflow/...)'
    cmds:
      - python3 {{.SCRIPTS_DIR}}/test-execution.py plan -- test:digest -- {{.CLI_ARGS}}

  gocache:trim:
    desc: 'Apply the Go cache size budget and trim compiled and diagnostic caches unused for more than a week'
    cmds:
      - bash {{.SCRIPTS_DIR}}/gocache-trim.sh

  test:security:
    desc: Security HTTP journey E2E (test/security; full run, not -short)
    # HTTP journeys need a wider per-package budget.
    cmds:
      - python3 {{.SCRIPTS_DIR}}/test-execution.py plan -- test:security -- {{.CLI_ARGS}}

  e2e:den:
    desc: 'Tier B — Den Playwright vs Docker sidecar + Vite (Docker required; filter: LYCAON_E2E_GREP=boot)'
    preconditions:
      - sh: command -v bun
        msg: bun required — https://bun.sh
      - sh: command -v go
        msg: Go required — see lycaon/go.mod
      - sh: command -v curl
        msg: curl required for sidecar health wait
      - sh: command -v docker
        msg: Docker required for ./task e2e:den
      - sh: docker info >/dev/null 2>&1
        msg: Docker daemon must be running for ./task e2e:den
    cmds:
      - bash {{.SCRIPTS_DIR}}/e2e-den.sh {{.CLI_ARGS}}

  e2e:den:desktop:
    desc: Tier C — Den Playwright vs Tauri dev + attach sidecar (needs Rust/cargo; macOS CI)
    preconditions:
      - sh: command -v bun
        msg: bun required — https://bun.sh
      - sh: command -v go
        msg: Go required — see lycaon/go.mod
      - sh: command -v cargo
        msg: cargo required for Tauri desktop E2E
    cmds:
      - bash {{.SCRIPTS_DIR}}/e2e-den-desktop.sh {{.CLI_ARGS}}

  den:harness:
    desc: 'LLM-drivable native stack — mock-LLM sidecar + Vite, same-origin (no Docker, no CORS). Ctrl-C to stop.'
    # Interactive stacks run on every invocation.
    preconditions:
      - sh: command -v go
        msg: Go required — see lycaon/go.mod
      - sh: command -v bun
        msg: bun required — https://bun.sh
      - sh: command -v curl
        msg: curl required for sidecar health wait
    cmds:
      - bash {{.SCRIPTS_DIR}}/den-harness.sh {{.CLI_ARGS}}

  den:harness:test:
    desc: 'Run Playwright web tier against the native (Docker-free) harness stack (filter: -- --grep "name")'
    preconditions:
      - sh: command -v go
        msg: Go required — see lycaon/go.mod
      - sh: command -v bun
        msg: bun required — https://bun.sh
      - sh: command -v curl
        msg: curl required for sidecar health wait
    cmds:
      - bash {{.SCRIPTS_DIR}}/den-harness-test.sh {{.CLI_ARGS}}

  den:webkit:scroll:
    desc: 'WebKit scroll-thread invariants: probes the host, then glides host wheel input into the harness Den in a real WKWebView (macOS)'
    preconditions:
      - sh: command -v go
        msg: Go required — see lycaon/go.mod
      - sh: command -v bun
        msg: bun required — https://bun.sh
      - sh: command -v cargo
        msg: cargo required — install rustup from https://rustup.rs; rust-toolchain.toml selects the version
      - sh: command -v curl
        msg: curl required for sidecar health wait
    cmds:
      - bash {{.SCRIPTS_DIR}}/den-webkit-scroll.sh

  den:harness:canary:
    desc: 'Minimal harness e2e slice (boot + driver chat + prompt) — the tier-is-alive check run by check:digest'
    preconditions:
      - sh: command -v go
        msg: Go required — see lycaon/go.mod
      - sh: command -v bun
        msg: bun required — https://bun.sh
      - sh: command -v curl
        msg: curl required for sidecar health wait
    cmds:
      - bash {{.SCRIPTS_DIR}}/den-harness-canary.sh

  e2e:cleanup:
    desc: Remove leftover E2E Docker projects/volumes and Playwright output (safe after failed runs)
    cmds:
      - bash {{.SCRIPTS_DIR}}/e2e-cleanup.sh

  e2e:
    desc: All self-contained E2E tiers (API + Den web)
    cmds:
      - task: test:security
      - task: e2e:den

  den:typecheck:
    desc: Frontend TypeScript check (lycaon-den)
    dir: lycaon-den
    sources:
      - 'src/**/*.{ts,tsx}'
      - tsconfig.json
      - package.json
    preconditions:
      - sh: command -v bun
        msg: bun required — install from https://bun.sh
    cmds:
      - bash {{.SCRIPTS_DIR}}/repo-snapshot-lock.sh read -- bun run typecheck

  den:lint:
    desc: 'Frontend ESLint (errors only): typescript-eslint + eslint-plugin-solid'
    dir: lycaon-den
    sources:
      - 'src/**/*.{ts,tsx}'
      - eslint.config.js
      - package.json
    env:
      # Type-aware linting outgrows Node's default heap on 7 GB hosted runners.
      NODE_OPTIONS: --max-old-space-size=4096
    preconditions:
      - sh: command -v bun
        msg: bun required — install from https://bun.sh
    cmds:
      - bash {{.SCRIPTS_DIR}}/repo-snapshot-lock.sh read -- bun run lint

  den:lint:full:
    desc: Frontend ESLint with warnings visible (full report)
    dir: lycaon-den
    preconditions:
      - sh: command -v bun
        msg: bun required — install from https://bun.sh
    cmds:
      - bash {{.SCRIPTS_DIR}}/repo-snapshot-lock.sh read -- bun run lint:full

  den:lint:fix:
    desc: Frontend ESLint auto-fix
    dir: lycaon-den
    preconditions:
      - sh: command -v bun
        msg: bun required — install from https://bun.sh
    cmds:
      - bun run lint:fix

  den:test:
    desc: Frontend Vitest including repo-scan suites (lycaon-den); failures condensed via digest
    preconditions:
      - sh: command -v bun
        msg: bun required — install from https://bun.sh
    cmds:
      - bash {{.SCRIPTS_DIR}}/vitest-digest.sh --name den:test

  den:test:fast:
    desc: Vitest seam canaries (model + DOM; exhaustive suite runs at closeout)
    preconditions:
      - sh: command -v bun
        msg: bun required — install from https://bun.sh
    env:
      LYCAON_VITEST_FAST: '1'
    cmds:
      - bash {{.SCRIPTS_DIR}}/vitest-digest.sh --name den:test:fast

  den:test:digest:
    desc: 'Vitest with failure digest (e.g. task den:test:digest -- src/**/*.test.ts)'
    preconditions:
      - sh: command -v bun
        msg: bun required — install from https://bun.sh
    cmds:
      - bash {{.SCRIPTS_DIR}}/vitest-digest.sh --name den:test:digest -- {{.CLI_ARGS}}

  den:test:transcript-scale:
    desc: 'Transcript hydration performance at 5000 and 10000 messages'
    preconditions:
      - sh: command -v bun
        msg: bun required — install from https://bun.sh
    cmds:
      - LYCAON_VITEST_PERF=1 bash {{.SCRIPTS_DIR}}/vitest-digest.sh --name den:test:transcript-scale -- src/chat/transcript/layout/transcript-scale.perf.test.ts

  den:test:rust:
    desc: Den Rust workspace tests and operational examples (shell, wheel glide, WebKit harness)
    dir: lycaon-den/src-tauri
    sources:
      - 'src/**/*.rs'
      - 'examples/**/*.rs'
      - 'crates/**/*.rs'
      - 'crates/**/Cargo.toml'
      - build.rs
      - 'tauri*.conf.json'
      - 'permissions/**/*.toml'
      - 'capabilities/**/*.json'
      - ../../VERSION
      - ../../packaging/update-keys.json
      - ../../packaging/update-limits.json
      - 'src/update_service/fixtures/*.json'
      - ../../lycaon/internal/backup/archive-limits.json
      - ../shared/local-file-formats.json
      - Cargo.toml
      - Cargo.lock
    preconditions:
      - sh: command -v cargo
        msg: cargo required — install rustup from https://rustup.rs; rust-toolchain.toml selects the version
    cmds:
      - bash {{.SCRIPTS_DIR}}/ensure-tauri-binaries.sh
      - cargo test --workspace --all-targets --quiet

  decide:test:
    desc: Decision engine (bialy) Rust tests
    dir: lycaon/internal/decide/native
    sources:
      - 'src/**/*.rs'
      - Cargo.toml
      - Cargo.lock
    env:
      CARGO_TARGET_DIR: '{{.BUILD_DIR}}/decide-target'
      MLX_RS_METAL_PATH: '{{.BUILD_DIR}}/mlx-metal'
    preconditions:
      - sh: command -v cargo
        msg: cargo required — install rustup from https://rustup.rs; rust-toolchain.toml selects the version
    cmds:
      # Parity tests use the shipped binary's features.
      - cargo test --all-targets --quiet --features "$(bash {{.SCRIPTS_DIR}}/decide-features.sh)"

  den:test:coverage:
    desc: Frontend Vitest with v8 coverage report
    dir: lycaon-den
    preconditions:
      - sh: command -v bun
        msg: bun required — install from https://bun.sh
    cmds:
      - bash -c 'source ../scripts/document-core-env.sh && bun run test:coverage'

  den:coverage:changes:
    desc: Frontend statements the change adds or modifies must be tested (floors in scripts/coverage-policy.json)
    preconditions:
      - sh: command -v bun
        msg: bun required — install from https://bun.sh
    cmds:
      - python3 {{.SCRIPTS_DIR}}/coverage_changes.py den

  den:coverage-check:
    desc: Fail if lycaon-den coverage is below DEN_COVERAGE_MIN_* floors
    sources:
      - lycaon-den/src/**/*
      - '{{.SCRIPTS_DIR}}/den-coverage-check.sh'
      - '{{.SCRIPTS_DIR}}/coverage_policy.py'
      - '{{.SCRIPTS_DIR}}/vitest-digest.sh'
      - '{{.SCRIPTS_DIR}}/vitest-digest.py'
      - '{{.SCRIPTS_DIR}}/verification_timings.py'
    cmds:
      - bash {{.SCRIPTS_DIR}}/den-coverage-check.sh

  den:sidecar:stop:
    desc: 'Stop local engines — dev-store lock holders, LYCAON_ADDR listeners, and bundled pw processes'
    cmds:
      - bash {{.SCRIPTS_DIR}}/den-sidecar-stop.sh

  den:sidecar:
    desc: 'Den dev terminal 1 — Go sidecar (stderr logs); pair with den:dev. Refuses if a live engine already holds LYCAON_ADDR'
    # Foreground servers run on every invocation.
    # Nested tasks require explicit variables from debug wrappers.
    deps:
      - build:lycaon-dev
    preconditions:
      - sh: command -v go
        msg: Go required — see lycaon/go.mod
    vars:
      LYCAON_LLM_DEBUG:
        sh: 'printf %s "${LYCAON_LLM_DEBUG:-0}"'
      LYCAON_HTTP_DEBUG:
        sh: 'printf %s "${LYCAON_HTTP_DEBUG:-0}"'
      LYCAON_SSE_DEBUG:
        sh: 'printf %s "${LYCAON_SSE_DEBUG:-0}"'
      LYCAON_DEBUG_SESSION:
        sh: 'printf %s "${LYCAON_DEBUG_SESSION:-0}"'
      LYCAON_LOG_LEVEL:
        sh: 'printf %s "${LYCAON_LOG_LEVEL:-info}"'
      LYCAON_TOOL_FEEDBACK_VERBOSE:
        sh: 'printf %s "${LYCAON_TOOL_FEEDBACK_VERBOSE:-0}"'
      LYCAON_DB_FRESH:
        sh: 'printf %s "${LYCAON_DB_FRESH:-0}"'
    env:
      LYCAON_LLM_DEBUG: '{{.LYCAON_LLM_DEBUG}}'
      LYCAON_HTTP_DEBUG: '{{.LYCAON_HTTP_DEBUG}}'
      LYCAON_SSE_DEBUG: '{{.LYCAON_SSE_DEBUG}}'
      LYCAON_DEBUG_SESSION: '{{.LYCAON_DEBUG_SESSION}}'
      LYCAON_LOG_LEVEL: '{{.LYCAON_LOG_LEVEL}}'
      LYCAON_TOOL_FEEDBACK_VERBOSE: '{{.LYCAON_TOOL_FEEDBACK_VERBOSE}}'
      LYCAON_DB_FRESH: '{{.LYCAON_DB_FRESH}}'
    cmds:
      # Preflight reports browser provisioning failures after startup.
      - cmd: |
          if ! '{{.BIN_DIR}}/task' browser:ensure; then
            echo 'warning: browser provisioning failed; retry when the host is online with ./task browser:ensure' >&2
          fi
      # Preflight reports missing dependencies after startup.
      - cmd: bash {{.SCRIPTS_DIR}}/gitengine-ensure.sh
        ignore_error: true
      - bash {{.SCRIPTS_DIR}}/den-dev-sidecar.sh

  den:sidecar:fresh:
    desc: 'Den sidecar — wipe Den session state, db:wipe, serve with LYCAON_DB_FRESH=1'
    cmds:
      # The guarded wipe requires the engine to be stopped.
      - task: den:sidecar:stop
      - bash {{.SCRIPTS_DIR}}/den-fresh-session-state.sh wipe
      - bash {{.SCRIPTS_DIR}}/den-fresh-session-state.sh mark
      - task: db:wipe
      - task: den:sidecar
        vars:
          LYCAON_DB_FRESH: '1'

  db:wipe:
    desc: 'Remove store.db (+ WAL) under the channel config dir'
    cmds:
      - bash {{.SCRIPTS_DIR}}/db-wipe.sh

  den:sidecar:llm-debug:
    desc: 'Den sidecar with LYCAON_LLM_DEBUG — provider payloads to ~/.config/paintedwolf-dev/llm-requests.jsonl'
    vars:
      LYCAON_DB_FRESH:
        sh: 'printf %s "${LYCAON_DB_FRESH:-0}"'
    cmds:
      - task: den:sidecar
        vars:
          LYCAON_LLM_DEBUG: '1'
          LYCAON_DB_FRESH: '{{.LYCAON_DB_FRESH}}'

  den:sidecar:llm-debug:fresh:
    desc: 'LLM debug capture + Den session wipe + db:wipe + LYCAON_DB_FRESH=1'
    cmds:
      # The guarded wipe requires the engine to be stopped.
      - task: den:sidecar:stop
      - bash {{.SCRIPTS_DIR}}/den-fresh-session-state.sh wipe
      - bash {{.SCRIPTS_DIR}}/den-fresh-session-state.sh mark
      - task: db:wipe
      - task: den:sidecar:llm-debug
        vars:
          LYCAON_DB_FRESH: '1'

  den:sidecar:full-debug:
    desc: 'Den sidecar with full debug capture — slog, HTTP, SSE, LLM payloads, tool timing, verbose tool rejects'
    vars:
      LYCAON_DB_FRESH:
        sh: 'printf %s "${LYCAON_DB_FRESH:-0}"'
    cmds:
      - task: den:sidecar
        vars:
          LYCAON_DEBUG_SESSION: '1'
          LYCAON_LOG_LEVEL: debug
          LYCAON_LLM_DEBUG: '1'
          LYCAON_HTTP_DEBUG: '1'
          LYCAON_SSE_DEBUG: '1'
          LYCAON_TOOL_DEBUG: '1'
          LYCAON_DEN_PERF_DEBUG: '1'
          LYCAON_PERF_DEBUG: '1'
          LYCAON_TOOL_FEEDBACK_VERBOSE: '1'
          LYCAON_DB_FRESH: '{{.LYCAON_DB_FRESH}}'

  den:sidecar:full-debug:fresh:
    desc: 'Full debug capture + regen codegen + Den session wipe + db:wipe + LYCAON_DB_FRESH=1'
    cmds:
      - task: codegen:tool-command-equivalence
      - task: codegen:guidance-registry
      # The guarded wipe requires the engine to be stopped.
      - task: den:sidecar:stop
      - bash {{.SCRIPTS_DIR}}/den-fresh-session-state.sh wipe
      - bash {{.SCRIPTS_DIR}}/den-fresh-session-state.sh mark
      - task: db:wipe
      - task: den:sidecar:full-debug
        vars:
          LYCAON_DB_FRESH: '1'

  debug:tail:
    desc: 'Follow sidecar slog capture log (LYCAON_LOG_FILE or latest session sidecar.log)'
    cmds:
      - bash {{.SCRIPTS_DIR}}/debug-capture.sh tail log

  debug:clear:
    desc: 'Truncate sidecar slog capture log'
    cmds:
      - bash {{.SCRIPTS_DIR}}/debug-capture.sh clear log

  debug:clear-all:
    desc: 'Truncate all dev capture logs in the latest session, including Den and sidecar performance'
    cmds:
      - bash {{.SCRIPTS_DIR}}/debug-capture.sh clear-all

  http:debug:tail:
    desc: 'Follow HTTP capture log (LYCAON_HTTP_DEBUG_FILE or session/default path)'
    cmds:
      - bash {{.SCRIPTS_DIR}}/debug-capture.sh tail http

  http:debug:clear:
    desc: 'Truncate HTTP capture log'
    cmds:
      - bash {{.SCRIPTS_DIR}}/debug-capture.sh clear http

  sse:debug:tail:
    desc: 'Follow SSE capture log (LYCAON_SSE_DEBUG_FILE or session/default path)'
    cmds:
      - bash {{.SCRIPTS_DIR}}/debug-capture.sh tail sse

  sse:debug:clear:
    desc: 'Truncate SSE capture log'
    cmds:
      - bash {{.SCRIPTS_DIR}}/debug-capture.sh clear sse

  tool:debug:tail:
    desc: 'Follow tool invocation capture log (LYCAON_TOOL_DEBUG_FILE or session/default path)'
    cmds:
      - bash {{.SCRIPTS_DIR}}/debug-capture.sh tail tool

  tool:debug:clear:
    desc: 'Truncate tool invocation capture log'
    cmds:
      - bash {{.SCRIPTS_DIR}}/debug-capture.sh clear tool

  den-perf:debug:tail:
    desc: 'Follow Den main-thread perf/stall capture (LYCAON_DEN_PERF_DEBUG_FILE or session/default path)'
    cmds:
      - bash {{.SCRIPTS_DIR}}/debug-capture.sh tail den-perf

  den-perf:debug:clear:
    desc: 'Truncate Den main-thread perf/stall capture log'
    cmds:
      - bash {{.SCRIPTS_DIR}}/debug-capture.sh clear den-perf

  perf:debug:tail:
    desc: 'Follow sidecar performance capture (LYCAON_PERF_DEBUG_FILE or session/default path)'
    cmds:
      - bash {{.SCRIPTS_DIR}}/debug-capture.sh tail perf

  perf:debug:clear:
    desc: 'Truncate sidecar performance capture log'
    cmds:
      - bash {{.SCRIPTS_DIR}}/debug-capture.sh clear perf

  llm:debug:tail:
    desc: 'Follow LLM capture log (LYCAON_LLM_DEBUG_FILE or session/default path)'
    cmds:
      - bash {{.SCRIPTS_DIR}}/debug-capture.sh tail llm

  llm:debug:clear:
    desc: 'Truncate LLM capture log'
    cmds:
      - bash {{.SCRIPTS_DIR}}/debug-capture.sh clear llm

  # Log viewers use the development capture tree.
  logs:
    desc: 'Interactive log browser (TUI) over the latest full-debug capture; plain dashboard when piped'
    dir: '{{.GO_DIR}}'
    env:
      LYCAON_DEV: '1'
    cmds:
      - go run ./cmd/lycaon-debug logs {{.CLI_ARGS}}

  logs:tui:
    desc: 'Force the interactive log browser (LLM/HTTP/SSE/sessions, expand & follow)'
    dir: '{{.GO_DIR}}'
    env:
      LYCAON_DEV: '1'
    cmds:
      - go run ./cmd/lycaon-debug logs tui {{.CLI_ARGS}}

  logs:prompt:
    desc: 'Pretty-print one LLM call transcript — `./task logs:prompt -- [N] [--no-system] [--tools]` (default: last call)'
    dir: '{{.GO_DIR}}'
    env:
      LYCAON_DEV: '1'
    cmds:
      - go run ./cmd/lycaon-debug logs prompt {{.CLI_ARGS}}

  logs:llm:
    desc: 'Compact list of captured LLM calls — `./task logs:llm -- [--agent NAME] [--surface NAME] [-n N]`'
    dir: '{{.GO_DIR}}'
    env:
      LYCAON_DEV: '1'
    cmds:
      - go run ./cmd/lycaon-debug logs llm {{.CLI_ARGS}}

  logs:http:
    desc: 'Status-colored HTTP request log — `./task logs:http -- [--errors] [-n N]`'
    dir: '{{.GO_DIR}}'
    env:
      LYCAON_DEV: '1'
    cmds:
      - go run ./cmd/lycaon-debug logs http {{.CLI_ARGS}}

  logs:den-perf:
    desc: 'Den main-thread stall/perf log — `./task logs:den-perf -- [-f] [--json]`'
    dir: '{{.GO_DIR}}'
    env:
      LYCAON_DEV: '1'
    cmds:
      - go run ./cmd/lycaon-debug logs den-perf {{.CLI_ARGS}}

  logs:sse:
    desc: 'SSE event stream by topic — `./task logs:sse -- [--topic NAME] [-n N]`'
    dir: '{{.GO_DIR}}'
    env:
      LYCAON_DEV: '1'
    cmds:
      - go run ./cmd/lycaon-debug logs sse {{.CLI_ARGS}}

  logs:sessions:
    desc: 'Coordinator/worker session topology tree'
    dir: '{{.GO_DIR}}'
    env:
      LYCAON_DEV: '1'
    cmds:
      - go run ./cmd/lycaon-debug logs sessions {{.CLI_ARGS}}

  logs:dump:
    desc: 'Annotated synthetic coordinator prompt — `./task logs:dump -- --fixture implement_investigate_idle [--previous-family orchestrate]`'
    dir: '{{.GO_DIR}}'
    env:
      LYCAON_DEV: '1'
    cmds:
      - go run ./cmd/lycaon-debug logs dump {{.CLI_ARGS}}

  logs:config:
    desc: 'View or change logs viewer settings — `./task logs:config -- [get KEY | set KEY VALUE | path]`'
    dir: '{{.GO_DIR}}'
    env:
      LYCAON_DEV: '1'
    cmds:
      - go run ./cmd/lycaon-debug logs config {{.CLI_ARGS}}

  eval:tool-usage:
    desc: 'Agent outcomes: tool-usage driver or BENCHMARK=prepare|test|run|service|report|analyze|smoke|providers'
    dir: '{{.GO_DIR}}'
    env:
      LYCAON_DEV: '1'
    cmds:
      - |
        case '{{.BENCHMARK | default ""}}' in
          test)
            cd ..
            bash scripts/test-source-snapshot.sh run -- python3 scripts/coordinator-benchmark/python_runtime.py -m unittest discover -s scripts/coordinator-benchmark -p 'test_*.py' {{.CLI_ARGS}} ;;
          providers) python3 ../scripts/coordinator-benchmark/python_runtime.py ../scripts/coordinator-benchmark/provider_checks.py {{.CLI_ARGS}} ;;
          prepare|run|service|report|analyze|smoke) python3 ../scripts/coordinator-benchmark/python_runtime.py ../scripts/coordinator-benchmark/{{.BENCHMARK}}.py {{.CLI_ARGS}} ;;
          '')
            mkdir -p '{{.BUILD_DIR}}'
            go build -o '{{.BUILD_DIR}}/lycaon-debug' ./cmd/lycaon-debug
            if [ '{{.BUILD_ONLY | default "false"}}' != 'true' ]; then
              '{{.BUILD_DIR}}/lycaon-debug' eval tool-usage {{.CLI_ARGS}}
            fi ;;
          *) echo 'Unknown benchmark action' >&2; exit 2 ;;
        esac

  den:dev:
    desc: 'Den dev terminal 2 — Tauri shell (attach to den:sidecar; no bundled spawn)'
    # Interactive shells run on every invocation.
    preconditions:
      - sh: command -v bun
        msg: bun required — install from https://bun.sh
      - sh: command -v curl
        msg: curl required for sidecar health check
      - sh: command -v cargo
        msg: cargo required — install rustup from https://rustup.rs; rust-toolchain.toml selects the version
      - sh: command -v rustc
        msg: rustc required — install rustup from https://rustup.rs; rust-toolchain.toml selects the version
      - sh: test -d lycaon-den/node_modules
        msg: lycaon-den/node_modules missing — run ./task setup-dev
    cmds:
      - bash {{.SCRIPTS_DIR}}/den-dev-app.sh

  den:app:
    desc: 'Local .app with Web Inspector; `-- --debug` enables an isolated config override, `-- --no-devtools` matches shipped UI, `-- --open` launches it'
    # Whole-tree inputs require a build on every invocation.
    preconditions:
      - sh: command -v bun
        msg: bun required — install from https://bun.sh
      - sh: command -v go
        msg: Go required — see lycaon/go.mod
      - sh: command -v cargo
        msg: cargo required — install Rust from https://rustup.rs
    cmds:
      - bash {{.SCRIPTS_DIR}}/den-build-app.sh {{.CLI_ARGS}}

  den:stage-engine:
    desc: 'Stage the sidecar and maintained scanner for Tauri development without the browser payload'
    preconditions:
      - sh: command -v go
        msg: Go required — see lycaon/go.mod
    cmds:
      - bash {{.SCRIPTS_DIR}}/stage-engine.sh --minimal

  den:bundle:
    desc: 'Build desktop bundle (.dmg on macOS; AppImage on Linux) with embedded engine sidecar; signs + notarizes when APPLE_SIGNING_IDENTITY is a Developer ID'
    preconditions:
      - sh: command -v bun
        msg: bun required — install from https://bun.sh
      - sh: command -v go
        msg: Go required — see lycaon/go.mod
      - sh: command -v cargo
        msg: cargo required — install Rust from https://rustup.rs
    cmds:
      - bash {{.SCRIPTS_DIR}}/den-build-bundle.sh

  bundle:verify:
    desc: 'Audit a built .app/.dmg — arch slices, macOS floor, dylib paths, signing, hardened runtime, staple'
    preconditions:
      - sh: '[ "$(uname -s)" = "Darwin" ]'
        msg: bundle:verify is macOS-only
    cmds:
      - bash {{.SCRIPTS_DIR}}/verify-bundle.sh {{.CLI_ARGS}}

  bundle:smoke:
    desc: 'Launch a stably signed .app/.dmg through LaunchServices and prove its GUI-spawned engine serves (--app PATH | --dmg PATH)'
    preconditions:
      - sh: '[ "$(uname -s)" = "Darwin" ]'
        msg: bundle:smoke is macOS-only
    cmds:
      - bash {{.SCRIPTS_DIR}}/bundle-smoke.sh {{.CLI_ARGS}}

  openapi:bundle:
    desc: Bundle modular docs/openapi/ sources to docs/openapi.yaml
    sources:
      - docs/openapi/**/*
      - '{{.SCRIPTS_DIR}}/bundle-openapi.sh'
      - '{{.SCRIPTS_DIR}}/repo-snapshot-lock.sh'
      - '{{.SCRIPTS_DIR}}/snapshot-publish.sh'
      - '{{.SCRIPTS_DIR}}/redocly-version.sh'
    preconditions:
      - sh: command -v npx
        msg: npx required (Node 26+)
    cmds:
      - bash {{.SCRIPTS_DIR}}/repo-snapshot-lock.sh generate -- bash {{.SCRIPTS_DIR}}/bundle-openapi.sh bundle

  openapi:bundle:check:
    desc: Fail if docs/openapi.yaml is stale vs modular sources
    sources:
      - docs/openapi/**/*
      - docs/openapi.yaml
      - '{{.SCRIPTS_DIR}}/bundle-openapi.sh'
      - '{{.SCRIPTS_DIR}}/repo-snapshot-lock.sh'
      - '{{.SCRIPTS_DIR}}/snapshot-publish.sh'
      - '{{.SCRIPTS_DIR}}/redocly-version.sh'
    preconditions:
      - sh: command -v npx
        msg: npx required (Node 26+)
    cmds:
      - bash {{.SCRIPTS_DIR}}/repo-snapshot-lock.sh read -- bash {{.SCRIPTS_DIR}}/bundle-openapi.sh check

  codegen:tool-command-equivalence:
    desc: Generate exact command equivalence tables and sync tool-schema replaces suffixes
    dir: '{{.GO_DIR}}'
    sources:
      - config/packs/painted-wolf/platform/tools/tool-command-equivalence.yaml
      - cmd/codegen-tool-command-equivalence/**/*
      - config/packs/painted-wolf/platform/tools/schemas/**/*
    generates:
      - internal/tools/command_equivalence_gen.go
      - internal/confine/read_habit_catalog_gen.go
    cmds:
      - go run ./cmd/codegen-tool-command-equivalence --root .

  codegen:tool-command-equivalence:check:
    desc: Fail if command equivalence codegen outputs are stale
    dir: '{{.GO_DIR}}'
    sources:
      - config/packs/painted-wolf/platform/tools/tool-command-equivalence.yaml
      - cmd/codegen-tool-command-equivalence/**/*
      - config/packs/painted-wolf/platform/tools/schemas/**/*
      - internal/tools/command_equivalence_gen.go
      - internal/confine/read_habit_catalog_gen.go
    cmds:
      - go run ./cmd/codegen-tool-command-equivalence --root . --check

  codegen:guidance-registry:
    desc: Regenerate schemas/guidance_registry.json from stock pack policy/ dirs (never rewrites hint YAML)
    dir: '{{.GO_DIR}}'
    generates:
      - ../schemas/guidance_registry.json
    cmds:
      - go run ./cmd/codegen-guidance-registry --root .

  codegen:guidance-registry:check:
    desc: Fail if guidance_registry.json is stale vs stock pack policy/
    dir: '{{.GO_DIR}}'
    cmds:
      - go run ./cmd/codegen-guidance-registry --root . --check

  oar:vendor:
    desc: Copy the Open Agent Rules schemas + vocabulary from the standard into schemas/oar/ (lycaon consumes the standard; it does not publish it)
    cmds:
      - ./scripts/vendor-oar-spec.sh

  oar:vendor:check:
    desc: Verify vendored OAR members and their pinned source manifest
    sources:
      - schemas/oar/**/*
      - scripts/vendor-oar-spec.sh
    cmds:
      - ./scripts/vendor-oar-spec.sh --check

  scan:rules:vendor:
    desc: Re-materialize every vendored OpenGrep rule catalog at its pinned commit in rules-provenance.yaml
    cmds:
      - ./scripts/vendor-scan-rules.sh

  scan:rules:vendor:bump:
    desc: 'Move one vendored rule catalog pin: ./task scan:rules:vendor:bump -- <id>=<tag|branch|sha>'
    cmds:
      - ./scripts/vendor-scan-rules.sh --bump {{.CLI_ARGS}}

  scan:rules:vendor:check:
    desc: Offline — verify vendored rule catalogs
    sources:
      - lycaon/config/runtime/scanners/rules/vendor/**/*
      - lycaon/config/runtime/scanners/rules-provenance.yaml
      - scripts/vendor-scan-rules.sh
    cmds:
      - ./scripts/vendor-scan-rules.sh --check

  secret-mint:vendor:
    desc: Re-materialize the zxcvbn passwords list at its pinned commit
    cmds:
      - ./scripts/vendor-zxcvbn-passwords.sh

  secret-mint:vendor:bump:
    desc: 'Move the zxcvbn passwords pin: ./task secret-mint:vendor:bump -- <id>=<tag|branch|sha>'
    cmds:
      - ./scripts/vendor-zxcvbn-passwords.sh --bump {{.CLI_ARGS}}

  secret-mint:vendor:check:
    desc: Offline — fail if the vendored zxcvbn passwords list was hand-edited or drifted from its pin
    sources:
      - lycaon/config/packs/painted-wolf/security/host/secret-mint/vendor/**/*
      - lycaon/config/packs/painted-wolf/security/host/secret-mint/zxcvbn-provenance.yaml
      - scripts/vendor-zxcvbn-passwords.sh
    cmds:
      - ./scripts/vendor-zxcvbn-passwords.sh --check

  codegen:approval-explanations:
    desc: Scaffold/enrich each pack's approvals/ explanation registry entries
    dir: '{{.GO_DIR}}'
    sources:
      - config/packs/**/approvals/**
      - internal/approvals/**
      - internal/settings/approval_tiers.generated.go
      - internal/settings/reversibility.go
      - cmd/codegen-approval-explanations/**/*
    cmds:
      - go run ./cmd/codegen-approval-explanations

  codegen:approval-explanations:check:
    desc: Fail if approval explanation registry is stale or incomplete
    dir: '{{.GO_DIR}}'
    sources:
      - config/packs/**/approvals/**
      - internal/approvals/**
      - internal/settings/approval_tiers.generated.go
      - internal/settings/reversibility.go
      - cmd/codegen-approval-explanations/**/*
    cmds:
      - go run ./cmd/codegen-approval-explanations --check

  codegen:native-tool-contracts:
    desc: >-
      Generate host approval membership and exact invocation contracts from
      pack native-tools.yaml
    dir: '{{.GO_DIR}}'
    sources:
      - config/packs/painted-wolf/platform/tools/native-tools.yaml
      - cmd/codegen-native-tool-contracts/**/*
      - internal/nativemanifest/**/*
    generates:
      - internal/settings/approval_tiers.generated.go
      - internal/toolcontract/contracts.generated.go
    cmds:
      - >-
        go run ./cmd/codegen-native-tool-contracts
        --out-go ./internal/settings/approval_tiers.generated.go
        --out-contract-go ./internal/toolcontract/contracts.generated.go

  codegen:native-tool-contracts:check:
    desc: Fail if native tool contract outputs are stale
    dir: '{{.GO_DIR}}'
    sources:
      - config/packs/painted-wolf/platform/tools/native-tools.yaml
      - cmd/codegen-native-tool-contracts/**/*
      - internal/nativemanifest/**/*
      - internal/settings/approval_tiers.generated.go
      - internal/toolcontract/contracts.generated.go
    cmds:
      - >-
        go run ./cmd/codegen-native-tool-contracts
        --out-go ./internal/settings/approval_tiers.generated.go
        --out-contract-go ./internal/toolcontract/contracts.generated.go
        --check

  codegen:worker-branch-tools:
    desc: >-
      Generate the host set of tools that require a private write-worker branch
      from pack native-tools.yaml requires_worker_branch
