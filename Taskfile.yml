    desc: 'Boot every retained (or named) upgrade-corpus fixture against {{.BUILD_DIR}}/lycaon-dev'
    deps:
      - build:lycaon-dev
    preconditions:
      - sh: command -v curl && command -v jq && command -v python3 && command -v sqlite3 && command -v node
        msg: curl, jq, python3, sqlite3, and node required for upgrade corpus boot
    cmds:
      - bash {{.SCRIPTS_DIR}}/upgrade-corpus-boot.sh {{.CLI_ARGS}}

