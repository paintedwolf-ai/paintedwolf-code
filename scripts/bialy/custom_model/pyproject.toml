[project]
name = "paintedwolf-custom-model-experiments"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["torch>=2.8,<3", "transformers>=5.9,<6", "peft>=0.18,<1", "safetensors>=0.6,<1", "jsonschema>=4.25,<5", "gguf>=0.17,<1"]

[tool.uv]
package = false

# The training host runs NVIDIA driver 570 (CUDA 12.8); PyPI's default Linux
# wheel is a CUDA 13 build that cannot see that GPU, so Linux takes the CUDA
# 12.8 build from the PyTorch index. macOS keeps the CPU wheel for the fixtures.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
